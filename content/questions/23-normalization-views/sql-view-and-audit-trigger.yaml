hints:
- Select from `DepartmentSalarySummary v`.
- Join `Employees e ON v.department = e.department` and `SalaryAuditLog l ON e.id = l.emp_id`.
- '| # Pseudocode Blueprint

  | SELECT v.department, v.emp_count, ROUND(v.avg_salary, 2) AS avg_salary,

  |        l.emp_id, l.old_salary, l.new_salary

  | FROM DepartmentSalarySummary v

  | JOIN Employees e ON v.department = e.department

  | JOIN SalaryAuditLog l ON e.id = l.emp_id

  | ORDER BY v.department, l.log_id;'
solution:
  code: "SELECT\n    v.department,\n    v.emp_count,\n    ROUND(v.avg_salary, 2) AS avg_salary,\n    l.emp_id,\n    l.old_salary,\n\
    \    l.new_salary\nFROM DepartmentSalarySummary v\nJOIN Employees e ON v.department = e.department\nJOIN SalaryAuditLog\
    \ l ON e.id = l.emp_id\nORDER BY v.department, l.log_id;\n"
  explanation: The trigger automatically records previous and updated salary values into `SalaryAuditLog` during the UPDATE
    statement. Joining the view with the audit log confirms that the view dynamically computes the updated department average
    while the audit table stores an immutable log of the modification.
  time: O(E + L) join over filtered employees
  space: O(1) memory overhead
pitch_script: '**(Clarify)** "We need to query a dynamic summary view joined with an audit log table populated by an internal
  database trigger."


  **(Brute force)** "Relying on application-level logging risks unlogged changes when database records are modified via admin
  consoles or background maintenance scripts."


  **(Trigger)** "Verifying automated trigger history alongside virtual aggregations signals database view and audit trigger
  verification."


  **(Optimal)** "We select from `DepartmentSalarySummary v`, joining `Employees e` on department and `SalaryAuditLog l` on
  employee id. We format the average salary with `ROUND(..., 2)` and project the old and new salaries captured by the trigger."


  **(Complexity)** "Executes in O(E + L) time and O(1) space." '
