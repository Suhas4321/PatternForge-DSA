  solution: "class Solution:\n    def calc_cosine(self, dot: float, nu: float, nv: float) -> float:\n        denom = nu *\
    \ nv\n        return (dot / denom) if denom > 0 else 0.0\n"
  hint: Check if nu * nv > 0.
hints:
- Compute query norm if metric == 'cosine'.
- Iterate candidates, computing dot product and optionally candidate norm.
- Sort by (-score, id) and slice top k.
solution:
  code: "import math\n\nclass Solution:\n    def find_nearest_neighbors(self, query_vector: list[float], candidates: list[dict],\
    \ k: int = 3, metric: str = \"cosine\") -> list[dict]:\n        if not candidates:\n            return []\n          \
    \  \n        def dot(u, v):\n            return sum(x * y for x, y in zip(u, v))\n            \n        def norm(v):\n\
    \            return math.sqrt(sum(x * x for x in v))\n            \n        q_norm = norm(query_vector)\n        scored\
    \ = []\n        \n        for cand in candidates:\n            c_id = cand[\"id\"]\n            c_vec = cand[\"vector\"\
    ]\n            d = dot(query_vector, c_vec)\n            \n            if metric == \"cosine\":\n                c_norm\
    \ = norm(c_vec)\n                denom = q_norm * c_norm\n                score = (d / denom) if denom > 0 else 0.0\n\
    \            else:\n                score = d\n                \n            scored.append({\n                \"id\":\
    \ c_id,\n                \"score\": round(score, 5),\n            })\n            \n        scored.sort(key=lambda x:\
    \ (-x[\"score\"], x[\"id\"]))\n        return scored[:k]\n"
  explanation: Calculates cosine or dot product distance for each candidate, returning top-k nearest vector neighbors sorted
    by similarity score.
  time: O(N * D + N log N) where N is candidate count and D is vector dimension
  space: O(N) for candidate scores
pitch_script: '**(Clarify)** "We need to perform vector nearest neighbor retrieval, supporting both cosine similarity and
  dot product metrics with tie-breaking."


  **(Basement Insight)** "Computing cosine similarity on every search requires square root operations to calculate vector
  norms. Normalizing vectors at ingestion converts cosine similarity to a pure dot product, enabling SIMD hardware acceleration."


  **(Solution)** "We compute the dot product and optionally vector norms depending on the requested metric. We round the similarity
  score and return the top-k highest scoring candidates."


  **(Complexity)** "Runs in O(N * D) time and O(N) space."

  '
