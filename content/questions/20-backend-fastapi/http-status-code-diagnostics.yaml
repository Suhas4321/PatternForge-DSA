drills:
  - title: Detect retryable status
    skill: setup
    goal: Check if an HTTP code is retryable.
    instructions: |
      Return `code in (429, 502, 503, 504)`.
    function:
      name: is_retryable_code
      params: [{name: code}]
    starter_code: |
      class Solution:
          def is_retryable_code(self, code: int) -> bool:
              pass
    tests:
      - {args: [429], expected: true}
      - {args: [404], expected: false}
    solution: |
      class Solution:
          def is_retryable_code(self, code: int) -> bool:
              return code in (429, 502, 503, 504)
    hint: "Use `return code in (429, 502, 503, 504)`."

  - title: Auth vs Forbidden distinction
    skill: core
    goal: Return 401 if not authed, else 403 if no role.
    instructions: |
      Implement `auth_code(authed: bool, has_role: bool) -> int`.
    function:
      name: auth_code
      params: [{name: authed}, {name: has_role}]
    starter_code: |
      class Solution:
          def auth_code(self, authed: bool, has_role: bool) -> int:
              pass
    tests:
      - {args: [false, false], expected: 401}
      - {args: [true, false], expected: 403}
    solution: |
      class Solution:
          def auth_code(self, authed: bool, has_role: bool) -> int:
              return 401 if not authed else (403 if not has_role else 200)
    hint: "If not authed return 401, else if not has_role return 403."

  - title: Safe dictionary lookup
    skill: edge
    goal: Safely get boolean key with default False.
    instructions: |
      Return `bool(d.get(k, False))`.
    function:
      name: safe_bool
      params: [{name: d}, {name: k}]
    starter_code: |
      class Solution:
          def safe_bool(self, d: dict, k: str) -> bool:
              pass
    tests:
      - {args: [{"ok": true}, "ok"], expected: true}
      - {args: [{}, "missing"], expected: false}
    solution: |
      class Solution:
          def safe_bool(self, d: dict, k: str) -> bool:
              return bool(d.get(k, False))
    hint: "Return bool(d.get(k, False))."

hints:
  - "Check transient network and rate limit flags first: `rate_limit_exceeded` (429), `upstream_timeout` (504), and `downstream_offline` (502) all set `retryable: True`."
  - "Check client payload errors: `validation_errors` returns 422, `conflict` returns 409, `not_found` returns 404, all with `retryable: False`."
  - "For auth errors, check `authenticated`: if False return 401 Unauthorized; if True but `has_role` is False return 403 Forbidden. Default to 500."

solution:
  code: |
    class Solution:
        def classify_http_error(self, scenario: dict) -> dict:
            if scenario.get("rate_limit_exceeded"):
                return {"status_code": 429, "reason": "Too Many Requests", "retryable": True}

            if scenario.get("upstream_timeout"):
                return {"status_code": 504, "reason": "Gateway Timeout", "retryable": True}

            if scenario.get("downstream_offline"):
                return {"status_code": 502, "reason": "Bad Gateway", "retryable": True}

            if scenario.get("validation_errors"):
                return {"status_code": 422, "reason": "Unprocessable Entity", "retryable": False}

            err_type = scenario.get("error_type")
            if err_type == "auth":
                if not scenario.get("authenticated", False):
                    return {"status_code": 401, "reason": "Unauthorized", "retryable": False}
                if not scenario.get("has_role", False):
                    return {"status_code": 403, "reason": "Forbidden", "retryable": False}

            if err_type == "conflict":
                return {"status_code": 409, "reason": "Conflict", "retryable": False}

            if err_type == "not_found":
                return {"status_code": 404, "reason": "Not Found", "retryable": False}

            return {"status_code": 500, "reason": "Internal Server Error", "retryable": False}
  explanation: |
    Evaluating error scenarios in priority order guarantees accurate RFC status codes.
    Transient rate-limiting and gateway connection timeouts are tagged `retryable: True`, allowing
    downstream proxies or clients to execute exponential-backoff retries.
    Client-side syntax, validation, and authorization errors are strictly `retryable: False`.
  time: O(1) dictionary key lookups
  space: O(1) returned dictionary

pitch_script: |
  **(Clarify)** "We need to classify API execution scenarios into exact HTTP status codes and determine whether the error is retryable."

  **(Basement Insight)** "Conflating client-side bugs with upstream timeouts by throwing generic HTTP 500s prevents client SDKs from executing automated retries and pollutes production alerts. 4xx codes mean client must fix their payload; 5xx codes mean the server or downstream gateway failed."

  **(Solution)** "We check transient gateway flags (429, 504, 502) first and mark them retryable. Next, we validate client payload errors (422 validation, 401 missing credentials, 403 insufficient permissions, 404 not found, 409 conflict). Any unmatched exception safely falls back to 500."

  **(Complexity)** "Executes in O(1) time and space."

