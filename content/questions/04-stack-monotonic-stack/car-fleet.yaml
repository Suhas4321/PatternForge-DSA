  - {args: [10, [6, 8], [3, 2]], expected: 2, note: "unsorted input; the faster car behind falls just short (4/3 vs 1)"}
  - {args: [10, [7, 6, 4], [1, 4, 3]], expected: 1, note: "compare with the fleet ahead (time 3), not the car directly ahead (time 1)"}
  - {args: [10, [0, 1, 2, 3, 4], [1, 1, 1, 1, 1]], expected: 5, note: "same speed: nobody ever catches anyone"}
