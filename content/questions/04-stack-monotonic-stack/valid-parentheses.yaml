  - {args: ["([]){}[({})]"], expected: true}
visualize_test: 4

drills:
  - title: Push on open, pop on close
    skill: setup
    goal: Write the stack loop that pushes openers and pops on closers, and read the depth off the stack size.
    instructions: |
      `s` is a **valid** expression containing digits, operators and only round brackets.
      Return its maximum nesting depth: the largest number of brackets open at the same time.

      Push on `'('`, pop on `')'`, ignore everything else, and track the largest stack size
      you ever see. This is the skeleton of the full problem: the stack always holds exactly
      the brackets that are open right now.
    function:
      name: maxDepth
      params: [{name: s}]
    starter_code: |
      class Solution:
          def maxDepth(self, s: str) -> int:
              pass
    tests:
      - {args: ["(1+(2*3)+((8)/4))+1"], expected: 3}
      - {args: ["(1)+((2))+(((3)))"], expected: 3}
      - {args: ["1+2"], expected: 0, note: no brackets at all}
      - {args: ["()"], expected: 1}
    solution: |
      class Solution:
          def maxDepth(self, s: str) -> int:
              stack = []
              best = 0
              for ch in s:
                  if ch == "(":
                      stack.append(ch)
                      best = max(best, len(stack))
                  elif ch == ")":
                      stack.pop()
              return best
    hint: "Update `best` right after a push: that's the only moment the depth can grow."

  - title: The closer must match the top
    skill: core
    goal: Use a closing→opening map to check each closer against the top of the stack.
    instructions: |
      `s` contains only `()[]{}`. Return the **index of the first closing bracket that
      fails**: either the stack is empty when it arrives, or the opener on top is a
      different type. Return `-1` if no closer fails (leftover openers are not this drill's
      concern).

      This is the heart of the full problem. A map like `{')': '(', ']': '[', '}': '{'}` turns
      "does this closer match?" into a single lookup, and checking `not stack` first stops you
      from popping an empty list.
    function:
      name: firstBadIndex
      params: [{name: s}]
    starter_code: |
      class Solution:
          def firstBadIndex(self, s: str) -> int:
              pass
    tests:
      - {args: ["([)]"], expected: 2}
      - {args: ["()[]{}"], expected: -1}
      - {args: ["]"], expected: 0, note: empty stack}
      - {args: ["{[]}}"], expected: 4}
      - {args: ["(("], expected: -1, note: leftovers don't count here}
    solution: |
      class Solution:
          def firstBadIndex(self, s: str) -> int:
              pairs = {")": "(", "]": "[", "}": "{"}
              stack = []
              for i, ch in enumerate(s):
                  if ch in pairs:
                      if not stack or stack[-1] != pairs[ch]:
                          return i
                      stack.pop()
                  else:
                      stack.append(ch)
              return -1
    hint: "Key the map by the closer, so `pairs[ch]` is the opener that must be on top."

  - title: What's left on the stack is unclosed
    skill: edge
    goal: Treat an empty-stack closer safely and read the leftover openers at the end.
    instructions: |
      `s` contains only `'('` and `')'`. Return the **indices of the opening brackets that
      are never closed**, in increasing order. A stray `')'` that arrives when nothing is open
      should simply be skipped.

      The two classic bugs in Valid Parentheses live here: popping when the stack is empty
      (crash, or a wrong answer for `"]"`), and returning `true` while openers are still on
      the stack (wrong answer for `"(("`). Pushing **indices** instead of characters also
      tells you exactly *which* brackets were left open.
    function:
      name: unclosedOpeners
      params: [{name: s}]
    starter_code: |
      class Solution:
          def unclosedOpeners(self, s: str) -> List[int]:
              pass
    tests:
      - {args: ["(()"], expected: [0]}
      - {args: ["())("], expected: [3], note: the stray ')' is skipped}
      - {args: ["))"], expected: []}
      - {args: ["((()"], expected: [0, 1]}
      - {args: ["()"], expected: []}
    solution: |
      class Solution:
          def unclosedOpeners(self, s: str) -> List[int]:
              stack = []
              for i, ch in enumerate(s):
                  if ch == "(":
                      stack.append(i)
                  elif stack:
                      stack.pop()
              return stack
    hint: "Only pop when the stack is non-empty; whatever remains at the end is your answer."

hints:
  - >-
    When a closing bracket arrives, which opening bracket is it allowed to close? Does it
    ever make sense for it to close anything other than the most recent one still open?
  - >-
    Push every opener. For each closer: if the stack is empty or its top is not the matching
    opener, the string is invalid; otherwise pop. At the end the string is valid only if the
    stack is empty.
  - |
    if length is odd: return false
    pairs = map closer -> opener
    stack = empty
    for each ch in s:
        if ch is a closer:
            if stack empty or top != pairs[ch]: return false
            pop
        else:
            push ch
    return stack is empty

solution:
  code: |
    class Solution:
        def isValid(self, s: str) -> bool:
            if len(s) % 2 == 1:
                return False  # pairs can't cover an odd number of characters
            pairs = {")": "(", "]": "[", "}": "{"}
            stack = []  # openers still waiting to be closed; newest on top
            for i, ch in enumerate(s):
                if ch in pairs:
                    # a closer must match the newest unclosed opener
                    if not stack or stack[-1] != pairs[ch]:
                        return False
                    stack.pop()
                else:
                    stack.append(ch)
            return not stack  # leftover openers mean something was never closed
  explanation: |
    Brackets nest, so they close in reverse order of opening: the opener a closer must match
    is always the most recent one still open. The stack keeps those unclosed openers with the
    newest on top.

    For each closer there are exactly two ways to fail: nothing is open (`not stack`, e.g.
    `"]"`), or the top is a different type (`"(]"`, `"([)]"`). Check `not stack` **before**
    reading `stack[-1]`, or an early closer crashes the code. If the closer matches, pop: that
    pair is done and the opener below becomes the newest unclosed one.

    Surviving the loop is not enough. `"(("` never has a failing closer, but both openers are
    still waiting, so the answer is `not stack`. The odd-length check is just a free early
    exit; the stack logic would reject those strings anyway.
  time: O(N) — one pass, O(1) push / pop / map lookup per character
  space: O(N) — the stack holds up to N openers (e.g. "((((((")
  brute_force_code: |
    class Solution:
        def isValid(self, s: str) -> bool:
            prev = None
            while s != prev:
                prev = s
                s = s.replace("()", "").replace("[]", "").replace("{}", "")
            return s == ""

pitch_script: |
  **(Clarify)** "So the string only has the six bracket characters, and it's valid if every
  closer matches the same type, closes in the right order, and nothing is left open. An odd
  length is automatically invalid, right?"

  **(Brute force)** "The naive way is to keep deleting adjacent matched pairs like '()' until
  nothing changes and check whether the string is empty. On deeply nested input that's N/2
  passes over the string, so O(N²)."

  **(Trigger)** "'Closed in the correct order' is the signal. Nested brackets close in reverse
  order of opening, last-in first-out, so a stack of the open brackets is the natural fit:
  the only opener a closer can match is the one on top."

  **(Optimal)** "I keep a map from each closer to its opener. I scan once: push openers; for a
  closer, if the stack is empty or the top isn't its opener, I return false, otherwise I pop.
  At the end I return whether the stack is empty, because leftover openers were never
  closed."

  **(Complexity)** "One pass with O(1) work per character, so O(N) time, and O(N) space for
  the stack when everything is an opener."

twist:
  lc: 921
  title: Minimum Add to Make Parentheses Valid
  why: >-
    Now you don't stop at the first failure; you count how many brackets you'd have to add.
    Same matching stack: a closer that finds an empty stack needs one added opener, and every
    opener left on the stack at the end needs one added closer. With a single bracket type the
    stack collapses to a counter of unclosed openers.

