drills:
- skill: setup
  title: Count lock inversions in a list
  goal: Count pairs where locks[i] > locks[j] for i < j.
  instructions: Iterate all pairs (i, j) with i < j and count occurrences where locks[i] > locks[j].
  function:
    name: drill_count_inv
    params:
    - name: locks
  starter_code: "class Solution:\n    def drill_count_inv(self, locks: list[str]) -> int:\n        pass\n"
  tests:
  - args:
    - - L2
      - L1
    expected: 1
  - args:
    - - L1
      - L2
      - L3
    expected: 0
  solution: "class Solution:\n    def drill_count_inv(self, locks: list[str]) -> int:\n        inv = 0\n        for i in range(len(locks)):\n\
    \            for j in range(i + 1, len(locks)):\n                if locks[i] > locks[j]:\n                    inv += 1\n\
    \        return inv\n"
  hint: Use nested loops to check locks[i] > locks[j].
- skill: core
  title: Sort lock sequence
  goal: Return sorted copy of locks.
  instructions: Return `sorted(locks)`.
  function:
    name: drill_sort_locks
    params:
    - name: locks
  starter_code: "class Solution:\n    def drill_sort_locks(self, locks: list[str]) -> list[str]:\n        pass\n"
  tests:
  - args:
    - - L3
      - L1
      - L2
    expected:
    - L1
    - L2
    - L3
  solution: "class Solution:\n    def drill_sort_locks(self, locks: list[str]) -> list[str]:\n        return sorted(locks)\n"
  hint: Return sorted(locks).
- skill: edge
  title: Validate deadlock freedom
  goal: Confirm all lists in dictionary are sorted.
  instructions: Return `True` if for every list `l`, `l == sorted(l)`.
  function:
    name: drill_all_sorted
    params:
    - name: reqs
  starter_code: "class Solution:\n    def drill_all_sorted(self, reqs: dict) -> bool:\n        pass\n"
  tests:
  - args:
    - T1:
      - L1
      - L2
    expected: true
  - args:
    - T1:
      - L2
      - L1
    expected: false
  solution: "class Solution:\n    def drill_all_sorted(self, reqs: dict) -> bool:\n        return all(l == sorted(l) for l\
    \ in reqs.values())\n"
  hint: Check `all(l == sorted(l) for l in reqs.values())`.
hints:
- Iterate through `thread_requests.items()`.
- For each thread, count out-of-order pairs and store `sorted(locks)`.
- '| # Pseudocode Blueprint

  | reordered = {}, total_inversions = 0

  | for t, locks in thread_requests.items():

  |     for i in range(len(locks)):

  |         for j in range(i+1, len(locks)):

  |             if locks[i] > locks[j]: total_inversions += 1

  |     reordered[t] = sorted(locks)

  | return reordered, total_inversions, True'
solution:
  code: "class Solution:\n    def resolve_lock_order(self, thread_requests: dict[str, list[str]]) -> dict:\n        reordered:\
    \ dict[str, list[str]] = {}\n        inversions = 0\n        for thread_id, locks in thread_requests.items():\n      \
    \      for i in range(len(locks)):\n                for j in range(i + 1, len(locks)):\n                    if locks[i]\
    \ > locks[j]:\n                        inversions += 1\n            reordered[thread_id] = sorted(locks)\n\n        return\
    \ {\n            \"reordered_requests\": reordered,\n            \"inversions_fixed\": inversions,\n            \"is_deadlock_free\"\
    : True,\n        }\n"
  explanation: Enforcing a global lock acquisition hierarchy by sorting each thread's requested lock list guarantees that
    locks are acquired in strictly monotonic order. This breaks Coffman's circular wait condition, mathematically eliminating
    deadlocks.
  time: O(T * K^2) where T is threads and K is locks per thread
  space: O(T * K) for the reordered requests dictionary
pitch_script: '**(Clarify)** "We need to reorder each thread''s lock acquisition sequence according to a canonical global
  hierarchy to eliminate deadlocks and count fixed inversions."


  **(Brute force)** "Relying on deadlock detection after threads freeze incurs high recovery latency and aborts transactions."


  **(Trigger)** "Fixing inverted lock sequences across concurrent threads triggers hierarchical lock ordering."


  **(Optimal)** "We iterate through each thread''s requested locks. We count inversions where an earlier lock is lexicographically
  greater than a later lock, and store the sorted list. Because every thread acquires locks in strictly increasing order,
  the Wait-For Graph is a DAG with zero cycles."


  **(Complexity)** "Executes in O(T * K^2) time to detect inversions and O(T * K) space." '
