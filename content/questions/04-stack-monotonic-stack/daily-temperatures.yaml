solution:
  code: |
    class Solution:
        def dailyTemperatures(self, temperatures: List[int]) -> List[int]:
            answer = [0] * len(temperatures)
            stack = []  # indices still waiting for a warmer day; temperatures decrease upward
            for i, t in enumerate(temperatures):
                while stack and temperatures[stack[-1]] < t:
                    j = stack.pop()
                    answer[j] = i - j
                stack.append(i)
            return answer
  explanation: |
    The stack holds the days that haven't found a warmer day yet, and their temperatures are
    decreasing from bottom to top (a warmer day would have popped the colder ones beneath it).

    When day `i` arrives, every day on top that is strictly colder has found its answer: it's
    `i - j`. Pop them all, then push `i`, because day `i` is now waiting too. Days left on the
    stack at the end never get warmer, so their answer stays 0.

    Each index is pushed once and popped at most once, so even though there's a `while` inside
    the `for`, the total work is O(N).
  time: O(N) — every index is pushed and popped at most once
  space: O(N) — the stack can hold every index on a decreasing input
  brute_force_code: |
    class Solution:
        def dailyTemperatures(self, temperatures: List[int]) -> List[int]:
            n = len(temperatures)
            answer = [0] * n
            for i in range(n):
                for j in range(i + 1, n):
                    if temperatures[j] > temperatures[i]:
                        answer[i] = j - i
                        break
            return answer

pitch_script: |
  **(Clarify)** "So for each day I return how many days until a strictly warmer one, and 0 if
  there's none. Equal temperatures don't count as warmer, right?"

  **(Brute force)** "The direct way is, for each day, scan forward until I find something
  warmer. That's O(N²) in the worst case, like a strictly decreasing list, and with 10⁵ days
  that's too slow."

  **(Trigger)** "This is a 'next greater element' question, which tells me a monotonic stack
  should work. The days still waiting for an answer always have decreasing temperatures, so the
  most recent one is the first to get resolved."

  **(Optimal)** "I keep a stack of indices. For each new day, while the day on top of the stack
  is colder than today, I pop it and set its answer to today's index minus its index. Then I
  push today. Anything left at the end keeps 0."

  **(Complexity)** "Each index is pushed and popped at most once, so it's O(N) time, even with
  the inner while loop, and O(N) space for the stack in the worst case."

