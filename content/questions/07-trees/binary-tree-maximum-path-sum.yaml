slug: binary-tree-maximum-path-sum
lc: 124

concept:
  problem_it_solves: >-
    "What is the best path that bends at this node?" Any path in a tree has exactly one
    highest node: the path climbs up one side to it and goes down the other side. So the
    overall best path is the best "bent" path over all choices of that top node. To score the
    bend at a node, you need the best straight-down path from each child, and that's exactly
    what each recursive call can return to its parent.
  brute_force: >-
    Try every node as the top of the path. For each one, compute from scratch the best
    downward path in its left subtree and in its right subtree (dropping a side if it's
    negative), and score node.val + left + right. Correct, but each "best downward path" is a
    full scan of a subtree, so every node is re-scanned once for each of its ancestors.
  brute_force_complexity: >-
    O(N · H) time, O(H) space — on a 3 × 10⁴-node chain that's about 4.5 × 10⁸ node visits.
  key_insight: >-
    Separate what a call *returns* from what it *records*. A parent can only extend a path
    that goes straight down through one child, so each call returns node.val + max(left, right):
    the best downward path starting here, using at most one side. But the best path that bends
    here uses both sides, node.val + left + right, and a parent can't extend that, so it's
    recorded in a global best instead of returned. A side whose best gain is negative is
    clamped to 0, meaning "don't go that way". One post-order pass computes everything.
  real_world: >-
    Midpoint rooting in phylogenetics finds the longest leaf-to-leaf path in an evolutionary
    tree with weighted branches, which is exactly "the best path that bends at some node",
    computed in one post-order pass. Network planners do the same on tree-shaped distribution
    topologies whose links carry gains and costs, picking the most valuable chain of connected
    hops without enumerating every pair of endpoints.

statement:
  clean: |
    A **path** in a binary tree is a sequence of nodes where each pair of adjacent nodes in the
    sequence has an edge connecting them. A node can appear in the sequence **at most once**.
    Note that the path **does not need to pass through the root**.

    The **path sum** of a path is the sum of the node's values in the path.

    Given the `root` of a binary tree, return the maximum path sum of **any non-empty path**.
    Node values can be negative.
  oa_story: |
    **SangamSys Energy — OA Round 1**

    SangamSys runs the electricity distribution network for a group of tech parks on the
    outskirts of Bengaluru. Power flows from a main substation through relay stations; each
    relay feeds at most two downstream relays, and there are no loops, so every pair of relays
    is connected by exactly one chain of cables. Each relay has a net score: rooftop solar
    makes some relays net producers (positive), while others lose more to transformer losses
    than they generate (negative).

    For a pilot microgrid, SangamSys wants to pick one unbroken chain of directly connected
    relays, visiting each relay at most once, and island it from the rest of the network. The
    chain doesn't have to include the main substation, and it can go up from one relay
    towards the substation and back down a different branch. It must contain at least one
    relay. Return the largest total net score such a chain can have. There can be up to 30,000
    relays, and in a bad week every score may be negative.
  trigger_keywords: ["path sum", "any non-empty path", "does not need to pass through the root"]
  examples:
    - input: "root = [1,2,3]"
      output: "6"
      explanation: "The path 2 → 1 → 3 sums to 6."
    - input: "root = [-10,9,20,null,null,15,7]"
      output: "42"
      explanation: "The path 15 → 20 → 7 sums to 42. Going up to -10 would only lower it."
    - input: "root = [-3]"
      output: "-3"
      explanation: "The path must be non-empty, so a single negative node is the answer."
  constraints:
    - "The number of nodes in the tree is in the range [1, 3 * 10^4]"
    - "-1000 <= Node.val <= 1000"

constraint_quiz:
  prompt: >-
    The tree has up to 3 × 10⁴ nodes and may be a long chain. What time complexity should you
    aim for?
  options:
    - "O(N²) — try every pair of endpoints"
    - "O(N · H) — recompute each node's best downward paths from scratch"
    - "O(N) — one post-order pass"
    - "O(N log N) — sort the node values"
  answer: 2
  explanation: >-
    Every pair of endpoints is about 4.5 × 10⁸ pairs, each with a path to sum, which is far too
    slow. Recomputing downward paths per node is O(N · H), O(N²) on a chain. Sorting values
    destroys the connectivity that defines a path. A single post-order pass where each call
    returns its best downward path gives every node what it needs from its children in O(1):
    O(N) total.

pattern_quiz:
  prompt: >-
    The best path can bend at any node, using both of that node's subtrees, but a parent can
    only extend a path that goes straight down. Which pattern fits?
  options:
    - "BFS level by level, summing each level"
    - "DFS that returns the best one-sided downward path and updates a global best with both sides"
    - "DFS passing the running path sum down from the root"
    - "Kadane's algorithm on the in-order traversal"
  answer: 1
  explanation: >-
    This is the same shape as Diameter of Binary Tree: each call returns one thing to its
    parent (the best downward path, one side only) and records another (the bent path, both
    sides) in a global. Passing the sum down only covers paths that start at the root, but
    the statement says the best path doesn't have to touch the root at all. Levels don't form paths, and in-order
    neighbours are often not connected by an edge, so Kadane's on that list sums non-paths.

