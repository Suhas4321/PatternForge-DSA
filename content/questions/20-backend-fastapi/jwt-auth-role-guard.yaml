drills:
  - title: Claims validation
    skill: setup
    goal: Check if sub and exp exist in dictionary.
    instructions: |
      Return `("sub" in payload) and ("exp" in payload)`.
    function:
      name: has_valid_claims
      params: [{name: payload}]
    starter_code: |
      class Solution:
          def has_valid_claims(self, payload: dict) -> bool:
              pass
    tests:
      - {args: [{"sub": "u1", "exp": 100}], expected: true}
      - {args: [{"sub": "u1"}], expected: false}
    solution: |
      class Solution:
          def has_valid_claims(self, payload: dict) -> bool:
              return ("sub" in payload) and ("exp" in payload)
    hint: "Check both keys in payload."

  - title: Expiration check
    skill: core
    goal: Detect if token timestamp is expired.
    instructions: |
      Return `current_time >= exp`.
    function:
      name: is_expired
      params: [{name: current_time}, {name: exp}]
    starter_code: |
      class Solution:
          def is_expired(self, current_time: int, exp: int) -> bool:
              pass
    tests:
      - {args: [100, 90], expected: true}
      - {args: [80, 90], expected: false}
    solution: |
      class Solution:
          def is_expired(self, current_time: int, exp: int) -> bool:
              return current_time >= exp
    hint: "Return current_time >= exp."

  - title: Role level check
    skill: edge
    goal: Compare user role rank against required role rank.
    instructions: |
      Rank admin: 3, developer: 2, viewer: 1. Return `user_rank >= required_rank`.
    function:
      name: is_role_sufficient
      params: [{name: user_role}, {name: req_role}]
    starter_code: |
      class Solution:
          def is_role_sufficient(self, user_role: str, req_role: str) -> bool:
              pass
    tests:
      - {args: ["admin", "developer"], expected: true}
      - {args: ["viewer", "admin"], expected: false}
    solution: |
      class Solution:
          def is_role_sufficient(self, user_role: str, req_role: str) -> bool:
              ranks = {"admin": 3, "developer": 2, "viewer": 1}
              return ranks.get(user_role, 0) >= ranks.get(req_role, 0)
    hint: "Map roles to numbers and compare."

hints:
  - "First check `if 'sub' not in token_payload or 'exp' not in token_payload:` and return 401."
  - "Second check `if current_time >= token_payload['exp']:` and return 401 with 'Token has expired'."
  - "Third compare role ranks: define `hierarchy = {'admin': 3, 'developer': 2, 'viewer': 1}`. If user rank < required rank, return 403 Forbidden."

solution:
  code: |
    class Solution:
        def verify_jwt_rbac(self, token_payload: dict, required_role: str, current_time: int) -> dict:
            if "sub" not in token_payload or "exp" not in token_payload:
                return {
                    "authorized": False,
                    "status_code": 401,
                    "error": "Invalid token claims",
                }

            if current_time >= token_payload["exp"]:
                return {
                    "authorized": False,
                    "status_code": 401,
                    "error": "Token has expired",
                }

            hierarchy = {"admin": 3, "developer": 2, "viewer": 1}
            user_role = token_payload.get("role", "viewer")

            user_rank = hierarchy.get(user_role, 0)
            req_rank = hierarchy.get(required_role, 1)

            if user_rank < req_rank:
                return {
                    "authorized": False,
                    "status_code": 403,
                    "error": "Insufficient role permissions",
                }

            return {
                "authorized": True,
                "status_code": 200,
                "user_id": token_payload["sub"],
                "role": user_role,
            }
  explanation: |
    The guard executes three fast in-memory assertions:
    1. Structure assertion: `sub` and `exp` must exist.
    2. Time validity: `current_time < exp` guarantees token freshness.
    3. Hierarchy assertion: maps roles to hierarchical integer levels to verify permission scope.
    
    This enforces stateless authentication and authorization with zero database latency.
  time: O(1) in-memory checks
  space: O(1)

pitch_script: |
  **(Clarify)** "We need to verify JWT token claims, check expiration, and enforce role hierarchy authorization for an API endpoint."

  **(Basement Insight)** "Monolithic session tables force a blocking database round-trip on every single HTTP request. Stateless JWTs allow microservices to verify claims and role hierarchy in memory in under 5 microseconds, eliminating database connection pool exhaustion."

  **(Solution)** "We first assert that the subject (`sub`) and expiration (`exp`) claims are present. Next, we verify that `current_time < exp`, returning 401 Unauthorized if expired. Finally, we map roles to hierarchical integer ranks (admin=3, developer=2, viewer=1) and return 403 Forbidden if the user's role rank is below the required role rank."

  **(Complexity)** "Executes in O(1) time and space."

