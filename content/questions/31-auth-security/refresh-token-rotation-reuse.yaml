hints:
- Check `sessions_db['revoked']` first; if True, return 401.
- Check if `presented_token in sessions_db['used_tokens']`. If so, set `sessions_db['revoked'] = True` and return 401 token_reuse_detected.
- '| # Pseudocode Blueprint

  | if sessions_db.revoked: return 401 session_revoked

  | if presented_token in sessions_db.used_tokens:

  |     sessions_db.revoked = True

  |     return 401 token_reuse_detected

  | if presented_token != sessions_db.active_token:

  |     return 404 token_not_found

  | sessions_db.used_tokens.append(presented_token)

  | new_active = f"rt_rot_{len(used)}_{presented_token[-4:]}"

  | sessions_db.active_token = new_active

  | return 200, new_access, new_active'
solution:
  code: "class Solution:\n    def rotate_refresh_token(self, presented_token: str, sessions_db: dict) -> dict:\n        if\
    \ sessions_db.get(\"revoked\", False):\n            return {\"success\": False, \"error\": \"session_revoked\", \"status_code\"\
    : 401}\n\n        used = sessions_db.setdefault(\"used_tokens\", [])\n        if presented_token in used:\n          \
    \  sessions_db[\"revoked\"] = True\n            return {\"success\": False, \"error\": \"token_reuse_detected\", \"session_revoked\"\
    : True, \"status_code\": 401}\n\n        active = sessions_db.get(\"active_token\")\n        if presented_token != active:\n\
    \            return {\"success\": False, \"error\": \"token_not_found\", \"status_code\": 404}\n\n        used.append(presented_token)\n\
    \        new_active = f\"rt_rot_{len(used)}_{presented_token[-4:]}\"\n        sessions_db[\"active_token\"] = new_active\n\
    \        new_access = f\"at_user_gen_{len(used)}\"\n\n        return {\n            \"success\": True,\n            \"\
    new_access_token\": new_access,\n            \"new_refresh_token\": new_active,\n            \"status_code\": 200,\n \
    \       }\n"
  explanation: Refresh Token Rotation guarantees that each refresh token can only be exchanged once. If a token in the `used_tokens`
    history is presented again, a replay attack has occurred. Setting `revoked = True` invalidates the entire session immediately,
    protecting the account.
  time: O(U) where U is the count of used tokens in the session
  space: O(1) updates to session dictionary
pitch_script: '**(Clarify)** "We need to simulate OAuth 2.0 Refresh Token Rotation, issuing single-use replacement tokens
  and revoking the session if a used token is replayed."


  **(Brute force)** "Static refresh tokens without rotation allow intercepted credentials to maintain indefinite access to
  user accounts."


  **(Trigger)** "Tracking single-use token lifecycle and detecting reuse signals OAuth 2.0 Refresh Token Rotation."


  **(Optimal)** "We verify that the session is not revoked. If the presented token is found in the `used_tokens` list, we
  detect token reuse and immediately revoke the session with HTTP 401. If the token matches the active token, we archive it
  into `used_tokens`, issue a fresh access and refresh token pair, and return 200 OK."


  **(Complexity)** "Executes in O(U) time to check token history and O(1) space." '
