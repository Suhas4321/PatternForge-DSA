slug: diameter-of-binary-tree
lc: 543

concept:
  problem_it_solves: >-
    "What is the longest path between any two nodes?" Any path in a tree climbs up to one
    highest node (its turning point) and then goes down the other side, so the question becomes
    "for each node, how long is the longest path that turns here?". That needs the heights of
    both children, which is exactly what a height DFS already computes.
  brute_force: >-
    For every node, call a separate height() function on its left and right child to measure
    the longest path that turns at that node, and keep the maximum. Each height() call re-walks
    the whole subtree from scratch, so a node deep in the tree gets measured again by every one
    of its ancestors, even though its height never changes.
  brute_force_complexity: >-
    O(N²) time in the worst case, O(H) space — a skewed 10⁴-node tree re-walks about
    10⁴ · 10⁴ / 2 = 5 × 10⁷ nodes. (On a balanced tree it's O(N log N).)
  key_insight: >-
    One DFS can do two jobs if you separate what a call *returns* from what it *records*. Each
    call returns its height to the parent, because a parent can only extend a path down *one*
    arm. While it has both arm lengths in hand, it records left + right (the longest path
    turning at this node) in a variable outside the recursion. The answer is the best value
    recorded anywhere, which is why the diameter doesn't have to pass through the root.
  real_world: >-
    Network engineers compute the diameter of a tree-shaped topology (a spanning tree of
    switches, a CDN distribution tree) to bound the worst-case hop count, and therefore
    latency, between any two nodes. The same "longest path through any node" computation finds
    the critical path in build-dependency and job-scheduling trees, and placing a server at the
    middle of the diameter minimises its worst-case distance to every node.

statement:
  clean: |
    Given the `root` of a binary tree, return the length of the **diameter** of the tree.

    The diameter of a binary tree is the length of the **longest path between any two nodes**
    in a tree. This path **may or may not pass through the root**.

    The length of a path between two nodes is represented by the **number of edges** between
    them.
  oa_story: |
    **ShakhaBank — OA Round 1**

    ShakhaBank runs its Karnataka branch network as a hierarchy: the head office in MG Road
    oversees regional hubs, and every office supervises at most two offices directly below it.
    Cash, cheque bundles and audit files move by courier along these supervision links only,
    one hop per link, up or down the hierarchy.

    The risk team is designing a 24-hour delivery SLA and needs the worst case: the largest
    number of courier hops between *any* two offices in the network. The longest route might go
    through the head office, or it might stay entirely inside one region. Write a function that
    takes the network, starting from the head office, and returns that number of hops. The
    network has between 1 and 10,000 offices.
  trigger_keywords: ["diameter", "longest path between any two nodes", "may or may not pass through the root"]
  examples:
    - input: "root = [1,2,3,4,5]"
      output: "3"
      explanation: "The path 4 → 2 → 1 → 3 (or 5 → 2 → 1 → 3) has 3 edges."
    - input: "root = [1,2]"
      output: "1"
  constraints:
    - "The number of nodes in the tree is in the range [1, 10^4]."
    - "-100 <= Node.val <= 100"

constraint_quiz:
  prompt: >-
    The tree has up to 10⁴ nodes and can be skewed. What time complexity should you aim for?
  options:
    - "O(N²) — measure both heights from scratch at every node"
    - "O(N log N) — fine because trees are logarithmic"
    - "O(N) — one DFS that returns heights and tracks the best path"
    - "O(H) — just follow the deepest branch"
  answer: 2
  explanation: >-
    Re-measuring heights at every node is O(N²) on a skewed tree: about 5 × 10⁷ node visits,
    slow in Python and wasteful. O(N log N) assumes a balanced tree, which isn't promised.
    O(H) skips most nodes, but the longest path can live in any part of the tree. A single
    post-order DFS computes each node's height once and uses it right away: O(N).

pattern_quiz:
  prompt: >-
    The longest path can turn at any node, and at each node you need both children's heights.
    Which approach fits?
  options:
    - "DFS that returns height and updates best = max(best, left + right) at every node"
    - "Return height(root.left) + height(root.right)"
    - "BFS from the root to find the deepest level, then double it"
    - "Find the longest root-to-leaf path"
  answer: 0
  explanation: >-
    "May or may not pass through the root" is the trigger for return-height-track-global: every
    node is a candidate turning point, so each call measures the path through itself and
    records the best, while still returning a single arm (its height) to its parent. Using only
    the root's two heights misses paths inside one subtree. Doubling the depth assumes a
    symmetric tree, and a root-to-leaf path only uses one arm.

