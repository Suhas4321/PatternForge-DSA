  - {args: [[1], [2]], expected: -1, note: single station that can't pay its leg}
  - {args: [[3, 1, 1], [1, 2, 2]], expected: 0, note: "total surplus is exactly 0: still feasible"}
  - {args: [[5, 1, 2, 3, 4], [4, 4, 1, 5, 1]], expected: 4, note: answer is the last station}
  - {args: [[4, 5, 2, 6, 5, 3], [3, 2, 7, 3, 2, 9]], expected: -1, note: total short by just 1}
  - {args: [[2, 2, 0, 4], [1, 3, 3, 1]], expected: 3, note: "tank touches 0 at station 1 without a reset"}
visualize_test: 0

drills:
  - title: Drive the loop from one start
    skill: setup
    goal: Simulate a full circuit from a given start with wrap-around indexing and a never-negative tank check.
    instructions: |
      Return `True` if starting at station `start` with an empty tank, you can visit every
      station once and come back, otherwise `False`.

      Use `(start + k) % n` to wrap around the circle, and fail the moment the tank drops
      below zero (exactly zero is fine). This is the brute force's inner loop, and the
      greedy is all about avoiding running it N times.
    function:
      name: simulateFrom
      params: [{name: gas}, {name: cost}, {name: start}]
    starter_code: |
      class Solution:
          def simulateFrom(self, gas: List[int], cost: List[int], start: int) -> bool:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], [3, 4, 5, 1, 2], 3], expected: true}
      - {args: [[1, 2, 3, 4, 5], [3, 4, 5, 1, 2], 0], expected: false}
      - {args: [[2], [2], 0], expected: true}
      - {args: [[3, 1, 1], [1, 2, 2], 1], expected: false}
    solution: |
      class Solution:
          def simulateFrom(self, gas: List[int], cost: List[int], start: int) -> bool:
              n, tank = len(gas), 0
              for k in range(n):
                  i = (start + k) % n
                  tank += gas[i] - cost[i]
                  if tank < 0:
                      return False
              return True
    hint: "After `k` legs you're at station `(start + k) % n`; add `gas[i] - cost[i]` and check `< 0`."

  - title: Reset the start after a failure
    skill: core
    goal: Make one pass that jumps the candidate start to i + 1 whenever the tank goes negative.
    instructions: |
      Scan stations `0..n-1` once with a running tank, starting with candidate `0`. Whenever
      the tank goes **negative** at station `i`, the new candidate is `i + 1` and the tank
      resets to 0. Return the list of candidates in the order they were tried.

      The reason you may skip straight to `i + 1`: every station between the old candidate
      and `i` was reached with fuel to spare, so starting there with an empty tank can only
      be worse, and it would also die at `i`. Notice the last candidate can be invalid (even
      `n`) when there isn't enough gas in total; that's why the full solution also checks
      the totals.
    function:
      name: resetStarts
      params: [{name: gas}, {name: cost}]
    starter_code: |
      class Solution:
          def resetStarts(self, gas: List[int], cost: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], [3, 4, 5, 1, 2]], expected: [0, 1, 2, 3]}
      - {args: [[5, 1, 2, 3, 4], [4, 4, 1, 5, 1]], expected: [0, 2, 4], note: skips stations 1 and 3}
      - {args: [[3, 1, 1], [1, 2, 2]], expected: [0]}
      - {args: [[1], [2]], expected: [0, 1], note: "infeasible: the last candidate is off the end"}
    solution: |
      class Solution:
          def resetStarts(self, gas: List[int], cost: List[int]) -> List[int]:
              starts, tank = [0], 0
              for i in range(len(gas)):
                  tank += gas[i] - cost[i]
                  if tank < 0:
                      tank = 0
                      starts.append(i + 1)
              return starts
    hint: "Reset only on `tank < 0`, not `<= 0`: arriving with exactly zero is still allowed."

  - title: Start right after the lowest point
    skill: edge
    goal: Read the answer off the running balance's lowest point, and return -1 when the overall total is negative.
    instructions: |
      Track the running balance `sum(gas[0..i] - cost[0..i])` and remember the first index
      where it reaches its **lowest** value below 0. Return `-1` if the final balance is
      negative; otherwise return the station right after that lowest point, or `0` if the
      balance never dips below zero.

      This is the same answer the reset scan finds, seen from a different angle: starting
      just after the deepest deficit means every later dip is shallower, so the tank never
      goes negative. The two edges are the "never dips, so start at 0" case and the
      infeasible total.
    function:
      name: lowestPointStart
      params: [{name: gas}, {name: cost}]
    starter_code: |
      class Solution:
          def lowestPointStart(self, gas: List[int], cost: List[int]) -> int:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], [3, 4, 5, 1, 2]], expected: 3}
      - {args: [[5, 1, 2, 3, 4], [4, 4, 1, 5, 1]], expected: 4}
      - {args: [[2, 3, 4], [3, 4, 3]], expected: -1}
      - {args: [[3, 1, 1], [1, 2, 2]], expected: 0, note: balance never dips}
      - {args: [[2, 2, 0, 4], [1, 3, 3, 1]], expected: 3}
    solution: |
      class Solution:
          def lowestPointStart(self, gas: List[int], cost: List[int]) -> int:
              balance, low, low_i = 0, 0, -1
              for i in range(len(gas)):
                  balance += gas[i] - cost[i]
                  if balance < low:
                      low, low_i = balance, i
              return -1 if balance < 0 else low_i + 1
    hint: "Start `low` at 0 and `low_i` at -1, so 'never dipped' naturally gives `low_i + 1 == 0`."

hints:
  - >-
    Suppose you start at station s and run dry at station k. What do you know about the tank
    when you arrived at any station between s and k? Would starting at one of them with an
    empty tank help?
  - >-
    Keep a running tank and a candidate start. When the tank goes negative at i, every
    station from the candidate to i is ruled out, so the candidate becomes i + 1 and the tank
    resets to 0. Separately, what does comparing sum(gas) with sum(cost) tell you about
    whether any answer exists?
  - |
    if total gas < total cost: return -1
    start = 0, tank = 0
    for i from 0 to n - 1:
        tank = tank + gas[i] - cost[i]
        if tank < 0:
            start = i + 1
            tank = 0
    return start

solution:
  code: |
    class Solution:
        def canCompleteCircuit(self, gas: List[int], cost: List[int]) -> int:
            if sum(gas) < sum(cost):
                return -1  # not enough fuel in the whole loop, whatever the start
            start = 0
            tank = 0  # fuel in the tank since leaving `start`
            for i in range(len(gas)):
                tank += gas[i] - cost[i]
                if tank < 0:  # can't make the leg out of i: no start in start..i works
                    start = i + 1
                    tank = 0
            return start
  explanation: |
    **If total gas < total cost, no start can work**: over one full loop you collect every
    `gas[i]` and pay every `cost[i]` exactly once, so you'd end below zero.

    **Why every station between the old start and the failure point can be skipped.** Say
    we start at `s` and the tank first goes negative on the leg out of station `k`. For any
    station `m` with `s < m <= k`, we arrived at `m` from `s` with a tank of at least 0.
    Starting at `m` instead means arriving there with exactly 0, which is no more fuel than
    before, and the road from `m` to `k` is the same. So the tank at `k` would be no higher,
    and it would also go negative. All of `s..k` fail, and the next possible start is
    `k + 1`. That's why each station is examined only once.

    **Why the final candidate is the answer when total ≥ 0.** From `start` to the end of the
    array the tank never went negative, so we wrap round to station 0 carrying some surplus.
    The skipped region `0..start-1` is made of blocks that each ran a deficit, and any
    *tail* of it also runs a deficit (inside a failed block the prefixes were ≥ 0 but the
    whole block was < 0, so what remains after any prefix is < 0). At any station `j` in
    the skipped region, the tank equals the total surplus of the loop minus the stretch
    `j+1..start-1` still ahead, and that stretch is a deficit (or empty, at `j = start-1`),
    so the tank is at least the total, which is ≥ 0. The tank never goes negative on the
    way back to `start`.

    Use `tank < 0`, not `<= 0`: arriving with exactly zero fuel is fine (`gas = [2]`,
    `cost = [2]` returns 0). The check for totals also guards against returning `n`, which
    the reset can produce on infeasible inputs like `gas = [1]`, `cost = [2]`.
  time: O(N) — one pass for the sums and one for the scan
  space: O(1) — a few integers
  brute_force_code: |
    class Solution:
        def canCompleteCircuit(self, gas: List[int], cost: List[int]) -> int:
            n = len(gas)
            for s in range(n):
                tank = 0
                for k in range(n):
                    i = (s + k) % n
                    tank += gas[i] - cost[i]
                    if tank < 0:
                        break
                else:
                    return s
            return -1

pitch_script: |
  **(Clarify)** "So the route is circular, I start with an empty tank, cost[i] is the fuel to
  go from i to i plus one, and arriving with exactly zero fuel is fine? I return the unique
  start, or -1?"

  **(Brute force)** "I could try every start and simulate the full loop, stopping at the
  first negative tank. That's O(N²), up to 10¹⁰ steps for 10⁵ stations."

  **(Trigger)** "Two observations. First, if total gas is less than total cost, no start can
  work, and if it's at least the total cost, some start must work. Second, if I start at s
  and fail at k, then every station between s and k also fails, because I reached each of
  them with a non-negative tank, and starting there with zero fuel can only be worse. So I
  never need to retry them."

  **(Optimal)** "I check the totals first. Then I scan once with a running tank and a
  candidate start of zero. Whenever the tank goes negative at i, I set the candidate to i
  plus one and reset the tank. At the end, the candidate is the answer: everything I skipped
  ran a deficit, and since the totals balance, the surplus from the candidate to the end
  covers it on the way back round."

  **(Complexity)** "O(N) time, since the sums and the scan are each one pass, and O(1) extra
  space."

twist:
  lc: 871
  title: Minimum Number of Refueling Stops
  why: >-
    Now the route is a straight line to a target, you start with some fuel, and you want the
    fewest refuelling stops instead of a starting point. The reset trick doesn't apply,
    because there's no choice of start, only a choice of which stations to use. The greedy
    becomes "drive as far as you can; when you can't reach the next station, retroactively
    refuel at the biggest station you've passed", using a max-heap of passed stations. The
    exchange argument is that if you must stop once more among the stations behind you,
    taking the most fuel is never worse. That's O(N log N).

