drills:
- skill: setup
  title: Partition workload types
  goal: Separate tasks into CPU and IO lists.
  instructions: Return `[cpu_tasks, io_tasks]`.
  function:
    name: drill_split_workload
    params:
    - name: tasks
  starter_code: "class Solution:\n    def drill_split_workload(self, tasks: list[dict]) -> list:\n        pass\n"
  tests:
  - args:
    - - type: CPU
      - type: IO
    expected:
    - - type: CPU
    - - type: IO
  solution: "class Solution:\n    def drill_split_workload(self, tasks: list[dict]) -> list:\n        return [[t for t in\
    \ tasks if t.get(\"type\") == \"CPU\"], [t for t in tasks if t.get(\"type\") == \"IO\"]]\n"
  hint: Use list comprehensions on `t.get('type')`.
- skill: core
  title: Calculate thread vs process times
  goal: Compute latency estimates for both pools.
  instructions: Return `[thread_time, process_time]`.
  function:
    name: drill_pool_times
    params:
    - name: cpu_ms
    - name: io_ms
    - name: cores
    - name: n_tasks
  starter_code: "class Solution:\n    def drill_pool_times(self, cpu_ms: int, io_ms: int, cores: int, n_tasks: int) -> list[int]:\n\
    \        pass\n"
  tests:
  - args:
    - 800
    - 50
    - 4
    - 3
    expected:
    - 850
    - 265
  solution: "import math\n\nclass Solution:\n    def drill_pool_times(self, cpu_ms: int, io_ms: int, cores: int, n_tasks:\
    \ int) -> list[int]:\n        thread_t = cpu_ms + io_ms\n        proc_t = math.ceil(cpu_ms / cores) + io_ms + (n_tasks\
    \ * 5)\n        return [thread_t, proc_t]\n"
  hint: Calculate `cpu + io` for thread, and `ceil(cpu/cores) + io + n*5` for process.
- skill: edge
  title: Compute CPU workload ratio
  goal: Calculate fraction of time spent in CPU tasks.
  instructions: Return `round(cpu_ms / total_ms, 2)` if total_ms > 0 else 0.0.
  function:
    name: drill_cpu_ratio
    params:
    - name: cpu_ms
    - name: total_ms
  starter_code: "class Solution:\n    def drill_cpu_ratio(self, cpu_ms: int, total_ms: int) -> float:\n        pass\n"
  tests:
  - args:
    - 800
    - 850
    expected: 0.94
  - args:
    - 0
    - 300
    expected: 0.0
  solution: "class Solution:\n    def drill_cpu_ratio(self, cpu_ms: int, total_ms: int) -> float:\n        return round(cpu_ms\
    \ / total_ms, 2) if total_ms > 0 else 0.0\n"
  hint: Divide cpu_ms by total_ms and round to 2 decimals.
hints:
- Sum CPU task durations and find maximum IO duration.
- Compare `thread_pool_time` (GIL serializes CPU) against `process_pool_time` (parallel CPU plus IPC penalty).
- '| # Pseudocode Blueprint

  | thread_time = total_cpu_ms + max_io_ms

  | proc_time = max(ceil(total_cpu_ms / cores), max_cpu_ms) + max_io_ms + (len(tasks) * 5)

  | if proc_time < thread_time: recommend ProcessPoolExecutor, gil = True

  | else: recommend ThreadPoolExecutor, gil = False'
solution:
  code: "import math\n\nclass Solution:\n    def recommend_pool_strategy(self, tasks: list[dict], cpu_cores: int) -> dict:\n\
    \        cpu_tasks = [t for t in tasks if t.get(\"type\") == \"CPU\"]\n        io_tasks = [t for t in tasks if t.get(\"\
    type\") == \"IO\"]\n\n        total_cpu_ms = sum(t[\"duration_ms\"] for t in cpu_tasks)\n        total_io_ms = sum(t[\"\
    duration_ms\"] for t in io_tasks)\n        max_io_ms = max((t[\"duration_ms\"] for t in io_tasks), default=0)\n      \
    \  max_cpu_ms = max((t[\"duration_ms\"] for t in cpu_tasks), default=0)\n\n        total_duration = total_cpu_ms + total_io_ms\n\
    \        cpu_ratio = round(total_cpu_ms / total_duration, 2) if total_duration > 0 else 0.0\n\n        thread_pool_time\
    \ = total_cpu_ms + max_io_ms\n        ipc_overhead = len(tasks) * 5\n        process_pool_time = max(math.ceil(total_cpu_ms\
    \ / cpu_cores), max_cpu_ms) + max_io_ms + ipc_overhead\n\n        if process_pool_time < thread_pool_time:\n         \
    \   recommended = \"ProcessPoolExecutor\"\n            est_time = process_pool_time\n            gil_bottleneck = True\n\
    \        else:\n            recommended = \"ThreadPoolExecutor\"\n            est_time = thread_pool_time\n          \
    \  gil_bottleneck = False\n\n        return {\n            \"recommended_pool\": recommended,\n            \"estimated_time_ms\"\
    : est_time,\n            \"gil_bottleneck_detected\": gil_bottleneck,\n            \"cpu_ratio\": cpu_ratio,\n       \
    \ }\n"
  explanation: For CPU-bound tasks, the Python GIL forces ThreadPoolExecutor to run serially. ProcessPoolExecutor bypasses
    the GIL across available CPU cores, outperforming threads whenever the parallel speedup outweighs the IPC serialization
    penalty.
  time: O(N) where N is the number of tasks
  space: O(N) for partitioned task lists
pitch_script: '**(Clarify)** "We need to analyze a list of CPU and IO tasks to recommend whether ThreadPoolExecutor or ProcessPoolExecutor
  will achieve lower overall wall-clock execution time."


  **(Brute force)** "Using ThreadPoolExecutor for all tasks causes CPU-bound workloads to serialize under CPython''s Global
  Interpreter Lock."


  **(Trigger)** "Comparing GIL serialization against multi-process core distribution and IPC penalties signals a workload
  pool optimization model."


  **(Optimal)** "We partition tasks into CPU and IO. In ThreadPoolExecutor, CPU tasks serialize (sum) while IO overlaps (max).
  In ProcessPoolExecutor, CPU tasks run in parallel across CPU cores bounded by ceil(total_cpu / cores) and max task duration,
  plus a 5ms IPC serialization penalty. We pick the pool with the minimum estimated completion time."


  **(Complexity)** "Runs in O(N) time and O(N) space." '
