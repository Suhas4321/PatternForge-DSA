slug: evaluate-reverse-polish-notation
lc: 150

concept:
  problem_it_solves: >-
    "Which operands does this operator apply to?" In postfix notation the answer is always
    "the two most recent values that haven't been used yet", and those values may themselves
    be results of earlier operators. A stack holds exactly those pending values, newest on
    top, so every operator is O(1).
  brute_force: >-
    Find the first operator in the list, combine the two numbers right before it, splice the
    result back into the list, and repeat until one number is left. Every round rescans the
    list from the start and shifts the tail to close the gap, so the same tokens are read
    and moved over and over.
  brute_force_complexity: O(N²) time, O(N) space — 10⁴ tokens means up to ~5 × 10⁷ token reads and shifts.
  key_insight: >-
    Postfix order means an operator always comes *after* both of its operands are fully
    computed. So you never need to look ahead or backtrack: push every number, and when an
    operator arrives, pop the two newest values, combine them, and push the result back as a
    single new operand. The first pop is the *right* operand, which matters for - and /.
  real_world: >-
    The Java Virtual Machine, Python's bytecode interpreter and WebAssembly are all stack
    machines: compiled code is essentially postfix, and `BINARY_ADD` pops two values and
    pushes one. Spreadsheet engines and rule engines convert formulas to postfix once, then
    evaluate them with a stack every time a cell or input changes.

statement:
  clean: |
    You are given an array of strings `tokens` that represents an arithmetic expression in
    **Reverse Polish Notation**.

    Evaluate the expression. Return an integer that represents the value of the expression.

    Note that:

    - The valid operators are `'+'`, `'-'`, `'*'`, and `'/'`.
    - Each operand may be an integer or another expression.
    - The division between two integers always **truncates toward zero**.
    - There will not be any division by zero.
    - The input represents a valid arithmetic expression in a reverse polish notation.
    - The answer and all the intermediate calculations can be represented in a **32-bit
      integer**.
  oa_story: |
    **SafarStay Hotels — OA Round 1**

    SafarStay's revenue team in Bellandur writes nightly pricing rules in a drag-and-drop
    rules builder ("base rate, add weekend surcharge, multiply by nights, subtract coupon…").
    To keep the booking service fast, the builder compiles every rule into a flat list of
    tokens in which each operator is written *after* the two values it combines. For example
    `["2", "1", "+", "3", "*"]` means (2 + 1) × 3.

    Given one compiled rule as a list of string tokens (integers, or one of `+`, `-`, `*`,
    `/`), return the integer price it evaluates to. Division keeps only the integer part, so
    -7 / 2 is -3, not -4. Rules are always well-formed, never divide by zero, and every
    intermediate value fits in a 32-bit integer. A compiled rule can be up to 10,000 tokens
    long.
  trigger_keywords: ["Reverse Polish Notation", "truncates toward zero"]
  examples:
    - input: "tokens = [\"2\",\"1\",\"+\",\"3\",\"*\"]"
      output: "9"
      explanation: "((2 + 1) * 3) = 9"
    - input: "tokens = [\"4\",\"13\",\"5\",\"/\",\"+\"]"
      output: "6"
      explanation: "(4 + (13 / 5)) = 4 + 2 = 6"
    - input: "tokens = [\"10\",\"6\",\"9\",\"3\",\"+\",\"-11\",\"*\",\"/\",\"*\",\"17\",\"+\",\"5\",\"+\"]"
      output: "22"
      explanation: "9 + 3 = 12; 12 * -11 = -132; 6 / -132 truncates to 0; 10 * 0 = 0; 0 + 17 + 5 = 22."
  constraints:
    - "1 <= tokens.length <= 10^4"
    - "tokens[i] is either an operator: '+', '-', '*', or '/', or an integer in the range [-200, 200]"

constraint_quiz:
  prompt: With up to 10⁴ tokens, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) (repeatedly finding an operator and splicing the list) is ~5 × 10⁷ operations: slow
    and clumsy, and not what an interviewer wants. O(N log N) would need sorting, but the
    token order *is* the expression, so sorting makes no sense. O(log N) can't even read
    every token. One pass with a stack does O(1) work per token: O(N).

pattern_quiz:
  prompt: >-
    Each operator applies to the two most recent values that haven't been consumed yet,
    and its result becomes a new value. Which pattern fits?
  options:
    - "Queue of operands (first in, first out)"
    - "Operand stack: push numbers; on an operator pop two, push the result"
    - "Two pointers from both ends of the token list"
    - "Recursion that splits the list at the middle operator"
  answer: 1
  explanation: >-
    "Evaluate expression" in postfix form is the operand-stack trigger: the most recent
    values are consumed first (LIFO), and results are pushed back as new operands. A queue
    would grab the *oldest* values, which is wrong for "3 4 5 * -". Two pointers have no
    meaning here, and there is no "middle operator" to split on in postfix; the last token
    is the root, and finding its operands' boundaries is exactly what the stack does for you.

