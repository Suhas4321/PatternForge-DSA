hints:
- Use `base64.urlsafe_b64encode` and strip trailing `=` for URL-safe transmission.
- In VERIFY, split on `.` to extract `b64_payload` and `sig`, recompute expected HMAC, and use `hmac.compare_digest`.
- '| # Pseudocode Blueprint

  | if action == "SIGN":

  |     b64 = b64encode(dumps(payload)).rstrip("=")

  |     sig = hmac_sha256(secret, b64)

  |     return f"{b64}.{sig}"

  | elif action == "VERIFY":

  |     parts = token.split(".")

  |     if len(parts) != 2: return malformed

  |     if not compare_digest(sig, hmac_sha256(secret, b64)): return invalid_sig

  |     payload = loads(b64decode(b64))

  |     if current_time > payload.exp: return expired

  |     return valid, payload'
solution:
  code: "import base64\nimport hashlib\nimport hmac\nimport json\n\nclass Solution:\n    def sign_and_verify_token(self, action:\
    \ str, payload_or_token: any, secret: str, current_time: int) -> dict:\n        if action == \"SIGN\":\n            payload_json\
    \ = json.dumps(payload_or_token, separators=(\",\", \":\"), sort_keys=True)\n            b64_payload = base64.urlsafe_b64encode(payload_json.encode()).decode().rstrip(\"\
    =\")\n            sig = hmac.new(secret.encode(), b64_payload.encode(), hashlib.sha256).hexdigest()\n            token\
    \ = f\"{b64_payload}.{sig}\"\n            return {\"token\": token, \"success\": True}\n\n        elif action == \"VERIFY\"\
    :\n            token = str(payload_or_token)\n            parts = token.split(\".\")\n            if len(parts) != 2:\n\
    \                return {\"valid\": False, \"error\": \"malformed_token\"}\n            b64_payload, sig = parts\n   \
    \         expected_sig = hmac.new(secret.encode(), b64_payload.encode(), hashlib.sha256).hexdigest()\n            if not\
    \ hmac.compare_digest(sig, expected_sig):\n                return {\"valid\": False, \"error\": \"invalid_signature\"\
    }\n\n            padded = b64_payload + \"=\" * (-len(b64_payload) % 4)\n            try:\n                raw_json =\
    \ base64.urlsafe_b64decode(padded.encode()).decode()\n                payload = json.loads(raw_json)\n            except\
    \ Exception:\n                return {\"valid\": False, \"error\": \"corrupted_payload\"}\n\n            exp = payload.get(\"\
    exp\")\n            if exp is not None and current_time > exp:\n                return {\"valid\": False, \"error\": \"\
    token_expired\"}\n\n            return {\"valid\": True, \"payload\": payload}\n"
  explanation: Signing bundles JSON payload data into URL-safe base64 and binds it with an HMAC-SHA256 signature. Verification
    recalculates the signature and compares it in constant time with `hmac.compare_digest` to prevent timing attacks, followed
    by checking the expiration timestamp.
  time: O(M) where M is payload JSON length
  space: O(M) for encoded token string
pitch_script: '**(Clarify)** "We need to build a stateless authentication token engine that issues HMAC-SHA256 signed tokens
  and verifies signatures and expiration without database calls."


  **(Brute force)** "Validating tokens by checking a database table defeats the purpose of stateless authentication and creates
  database bottlenecks."


  **(Trigger)** "Creating cryptographically signed payloads with tamper detection signals HMAC-SHA256 token signing."


  **(Optimal)** "For SIGN, we encode sorted JSON into URL-safe base64 and generate an HMAC-SHA256 hex signature. For VERIFY,
  we split into payload and signature, recompute the expected signature, and compare using `hmac.compare_digest` to eliminate
  timing attacks. If the signature matches and current time does not exceed `exp`, the token is valid."


  **(Complexity)** "Executes in O(M) time and O(M) space for payload length M." '
