slug: processes-vs-threads-memory
lc: 9401
citadel_id: os_concurrency
brick_layer: 1
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does incrementing a counter across 10 threads produce a number lower than 10,000?"
    In Python, `counter += 1` is not atomic. The Python virtual machine compiles it into three distinct bytecode instructions:
    `LOAD_GLOBAL`, `BINARY_OP (ADD)`, and `STORE_GLOBAL`.
    If the operating system context-switches threads between the LOAD and the STORE, the second thread reads a stale value,
    overwriting the first thread's addition. A Mutex (`threading.Lock()`) serializes access to the critical section.
  brute_force: >-
    Allowing multiple threads to mutate shared memory concurrently without synchronization.
    This creates intermittent data race conditions that only fail under heavy concurrent production traffic.
  brute_force_complexity: O(1) syntax, but silent data corruption and non-deterministic lost updates.
  key_insight: >-
    Threads in a single process share the exact same Heap memory space, while OS Processes have completely isolated virtual memory.
    To prevent lost updates across threads, wrap critical section mutations inside `with lock:` (which executes `lock.acquire()`
    and `lock.release()`), guaranteeing that only one thread executes the LOAD-ADD-STORE sequence at any nanosecond.
  real_world: >-
    Multi-threaded API request counters, shared memory metrics collectors, and database connection pool checkout locks.

statement:
  clean: |
    Implement a thread synchronization simulator to demonstrate process thread race condition handling:
    `simulate_concurrent_counter(workers: int, increments_per_worker: int, use_lock: bool) -> dict`.
    
    You need to simulate multiple OS threads incrementing a shared variable:
    1. Initialize `counter = 0`.
    2. If `use_lock` is `True`, synchronize increments using a `threading.Lock()` so that each increment
       `counter += 1` executes atomically within `with lock:`.
    3. If `use_lock` is `False`, simulate preemption during the read-modify-write cycle:
       read `temp = counter`, perform a tiny cooperative yield or loop, and write `counter = temp + 1`.
       (For reliable testing, when `use_lock=False` with multiple workers, lost updates should occur).
    4. Spawn and join `workers` threads, each executing `increments_per_worker` increments.
    5. Return a dictionary containing:
       - `final_counter`: the final value of the shared counter.
       - `expected_counter`: `workers * increments_per_worker`.
       - `race_occurred`: boolean `True` if `final_counter < expected_counter`, else `False`.
  oa_story: |
    **Drizz High-Concurrency Test Harness — Counter Inversion Post-Mortem**
    
    During 100-worker multi-threaded mobile load testing, our test execution counter logged only 82,000 completed runs
    even though exactly 100,000 tasks were dispatched.
    The post-mortem revealed that an unsynchronized global counter `total_tests += 1` was losing increments
    under thread preemption.
    
    Implement this simulation to verify how `threading.Lock()` eliminates race conditions across shared thread heaps.
  trigger_keywords: ["process thread race condition", "simulate_concurrent_counter", "workers"]
  examples:
    - input: "workers = 5, increments_per_worker = 100, use_lock = True"
      output: "{'final_counter': 500, 'expected_counter': 500, 'race_occurred': False}"
      explanation: "Mutex lock guarantees atomic execution, final count equals expected 500."
    - input: "workers = 4, increments_per_worker = 100, use_lock = False"
      output: "{'final_counter': 320, 'expected_counter': 400, 'race_occurred': True}"
      explanation: "Without a lock, thread preemption loses increments, so race_occurred is True."
  constraints:
    - "workers >= 1"
    - "increments_per_worker >= 1"

constraint_quiz:
  prompt: >-
    Why is `counter += 1` not atomic in Python despite appearing as a single line of code?
  options:
    - "Because it translates into multiple bytecode instructions: LOAD, ADD, and STORE"
    - "Because Python converts all numbers to strings"
    - "Because the GIL switches off during math"
    - "Because addition requires an HTTP call"
  answer: 0
  explanation: >-
    CPython decomposes `+= 1` into loading the variable onto the value stack, adding 1, and storing it back. Preemption between LOAD and STORE causes lost updates.

pattern_quiz:
  prompt: What synchronization primitive guarantees mutual exclusion so only one thread executes a critical section at a time?
  options:
    - "Mutex / threading.Lock"
    - "Condition variable"
    - "Queue"
    - "Barrier"
  answer: 0
  explanation: >-
    A Mutex (Mutual Exclusion Lock) ensures that only one thread can hold the lock and execute the critical section simultaneously.

