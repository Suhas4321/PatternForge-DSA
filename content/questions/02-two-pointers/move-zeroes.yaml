tests:
  - {args: [[0, 1, 0, 3, 12]], expected: [1, 3, 12, 0, 0]}
  - {args: [[0]], expected: [0], note: single zero}
  - {args: [[1, 2, 3]], expected: [1, 2, 3], note: "no zeros: read == write, every swap is with itself"}
  - {args: [[0, 0, 0, 1]], expected: [1, 0, 0, 0], note: "all zeros in front of one non-zero"}
  - {args: [[4, 0, 0]], expected: [4, 0, 0], note: already done}
  - {args: [[2, 0, -1, 0, 0, 5, -3]], expected: [2, -1, 5, -3, 0, 0, 0], note: "negatives are non-zero too: order kept"}
  - {args: [[0, 0]], expected: [0, 0], note: all zeros}
  - {args: [[-2147483648, 0, 2147483647]], expected: [-2147483648, 2147483647, 0], note: extreme values}
visualize_test: 5

drills:
  - title: Watch read and write drift apart
    skill: setup
    goal: Run a read pointer over every index and a write pointer that advances only on non-zeros.
    instructions: |
      Return a list of `[read, write]` pairs, one for every **non-zero** element, recorded at the
      moment `read` reaches it (before `write` advances).

      This shows what `write` really means: it counts the non-zeros placed so far, which is also
      the slot where the current non-zero belongs. The gap `read - write` is exactly the number
      of zeros seen so far.
    function:
      name: readWritePairs
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def readWritePairs(self, nums: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[0, 1, 0, 3, 12]], expected: [[1, 0], [3, 1], [4, 2]]}
      - {args: [[1, 2]], expected: [[0, 0], [1, 1]], note: no zeros so the pointers never separate}
      - {args: [[0, 0]], expected: []}
      - {args: [[0, 0, 7]], expected: [[2, 0]]}
    solution: |
      class Solution:
          def readWritePairs(self, nums: List[int]) -> List[List[int]]:
              pairs = []
              write = 0
              for read in range(len(nums)):
                  if nums[read] != 0:
                      pairs.append([read, write])
                      write += 1
              return pairs
    hint: "`write` starts at 0 and only `write += 1` inside the `if nums[read] != 0` branch."

  - title: Snowball the non-zeros forward
    skill: core
    goal: Copy each non-zero into nums[write] and advance write, compacting the keepers in order.
    instructions: |
      Modify `nums` **in place**: copy every non-zero element forward to `nums[write]` (overwrite,
      don't swap) and advance `write`. Don't touch anything after the last write. The tests check
      `nums` afterwards, so the tail will still hold stale values.

      This is the core transition of Move Zeroes. Since `write <= read` always, you only ever
      overwrite slots you have already read, so nothing is lost, and non-zeros arrive in the
      order you read them. Look at the stale tail in the first test: it's why the full solution
      either fills the tail with zeros afterwards or **swaps** instead of copying.
    function:
      name: compactNonZeros
      params: [{name: nums}]
      inplace_arg: 0
    starter_code: |
      class Solution:
          def compactNonZeros(self, nums: List[int]) -> None:
              pass
    tests:
      - {args: [[0, 1, 0, 3, 12]], expected: [1, 3, 12, 3, 12], note: "tail still holds old values"}
      - {args: [[1, 2, 3]], expected: [1, 2, 3]}
      - {args: [[0, 0, 5]], expected: [5, 0, 5]}
      - {args: [[0, 0]], expected: [0, 0]}
    solution: |
      class Solution:
          def compactNonZeros(self, nums: List[int]) -> None:
              write = 0
              for read in range(len(nums)):
                  if nums[read] != 0:
                      nums[write] = nums[read]
                      write += 1
    hint: "Same loop as the setup drill, but instead of recording, do `nums[write] = nums[read]`."

  - title: Count only the swaps that change something
    skill: edge
    goal: Recognise that while no zero has been seen, read == write and the swap is a no-op.
    instructions: |
      Using the swap version of the algorithm, return how many swaps **actually move data**,
      i.e. swaps where `read != write`. (Don't modify `nums`.)

      Until the first zero appears, `read` and `write` are equal and every "swap" is an element
      swapping with itself. That's harmless, which is why the solution needs no special case, but
      it's also what the follow-up "minimise the total number of operations" is poking at: you
      can guard the swap with `if read != write` and touch the array only when something moves.
    function:
      name: countRealSwaps
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def countRealSwaps(self, nums: List[int]) -> int:
              pass
    tests:
      - {args: [[0, 1, 0, 3, 12]], expected: 3}
      - {args: [[1, 2, 3]], expected: 0, note: no zeros means no real swaps}
      - {args: [[4, 0, 0]], expected: 0, note: zeros already at the end}
      - {args: [[0, 0, 1]], expected: 1}
      - {args: [[1, 0, 2, 0, 3]], expected: 2}
    solution: |
      class Solution:
          def countRealSwaps(self, nums: List[int]) -> int:
              write = swaps = 0
              for read in range(len(nums)):
                  if nums[read] != 0:
                      if read != write:
                          swaps += 1
                      write += 1
              return swaps
    hint: "Keep the usual `write` pointer and add 1 to the count only when `read != write`."

hints:
  - >-
    Instead of thinking about where the zeros should go, think about where each non-zero should
    go. If you've seen k non-zeros so far, which index does the next one belong at?
  - >-
    Keep write = number of non-zeros placed so far. Scan read from left to right; when nums[read]
    is non-zero, put it at index write and advance write. What is sitting between write and
    read at any moment, and what happens if you swap instead of copy?
  - |
    write = 0
    for read from 0 to n - 1:
        if nums[read] != 0:
            swap nums[write] and nums[read]
            write = write + 1

solution:
  code: |
    class Solution:
        def moveZeroes(self, nums: List[int]) -> None:
            write = 0  # nums[:write] holds the non-zeros found so far, in order
            for read in range(len(nums)):
                if nums[read] != 0:
                    # nums[write..read-1] are all zeros, so this sends a zero back to read
                    nums[write], nums[read] = nums[read], nums[write]
                    write += 1
  explanation: |
    Two invariants hold after every step: `nums[:write]` is every non-zero seen so far in its
    original order, and `nums[write:read]` is all zeros (the gap grows by one each time `read`
    passes a zero). So when `read` hits a non-zero, swapping it with `nums[write]` moves the
    non-zero to the end of the finished prefix and moves a zero into the slot `read` just left.
    When the loop ends, the gap stretches to the end of the array: the zeros are at the back
    without any separate fill step.

    **Why order is preserved:** both pointers only move left to right, and non-zeros are written
    to consecutive slots in exactly the order `read` meets them. No non-zero ever jumps over
    another non-zero; it only jumps over zeros. (Opposite-end swapping fails exactly here.)

    When no zero has been seen yet, `read == write` and the swap is an element swapping with
    itself, which is harmless. The total work is one pass with at most one swap per non-zero.
  time: O(N) — one pass; each element is read once and swapped at most once
  space: O(1) — two indices, all changes made inside nums
  brute_force_code: |
    class Solution:
        def moveZeroes(self, nums: List[int]) -> None:
            n = len(nums)
            i = 0
            for _ in range(n):  # examine n elements in total
                if nums[i] == 0:
                    for j in range(i, n - 1):  # shift everything after i left by one
                        nums[j] = nums[j + 1]
                    nums[n - 1] = 0
                else:
                    i += 1

pitch_script: |
  **(Clarify)** "I modify nums in place and return nothing, non-zero elements must keep their
  relative order, and negative numbers count as non-zero, right? The order of the zeros
  themselves doesn't matter since they're identical."

  **(Brute force)** "The direct way is: whenever I see a zero, shift everything after it one
  place left and put the zero at the end. That's O(N²) in the worst case because the same
  elements get shifted once per zero ahead of them. Copying non-zeros into a new array is
  linear, but it breaks the in-place requirement."

  **(Trigger)** "'In-place' plus 'keep the relative order' tells me to use a read pointer and a
  write pointer moving in the same direction. I shouldn't use pointers from both ends, because
  swapping across the array would reverse the order of the non-zeros."

  **(Optimal)** "I keep write as the number of non-zeros placed so far. I scan read from left to
  right, and whenever nums[read] is non-zero I swap it with nums[write] and increment write.
  Everything between write and read is always zero, so each swap moves a non-zero forward and a
  zero backward, and because both pointers move left to right, non-zeros stay in their original
  order. At the end all the zeros are already in the tail."

  **(Complexity)** "One pass, so O(N) time, and O(1) extra space. For the follow-up on
  operations, I do at most one swap per non-zero, and I can skip the swap when read equals
  write, since that's an element swapping with itself."

twist:
  lc: 26
  title: Remove Duplicates from Sorted Array
  why: >-
    Same read/write skeleton, but the "keep" condition changes from "non-zero" to "different
    from the last kept value", i.e. nums[read] != nums[write - 1], and you return write (the new
    length) instead of fixing the tail. Sortedness guarantees all copies of a value are adjacent,
    so comparing with the last kept element is enough.

viz:
  arrays: [nums]
  pointers: [read, write]
