slug: reorder-list
lc: 143

concept:
  problem_it_solves: >-
    "How do I visit a singly linked list from both ends at once?" A singly linked list only
    walks forward, so "take the last node, then the second-last, …" is exactly the direction
    it can't go. The fix is to *make* the back half walk forward: split the list in the
    middle, reverse the second half, and then both halves can be read front-to-front.
  brute_force: >-
    Repeatedly walk from the current node to the end of the list, unhook the tail, and splice
    it in after the current node. Each splice re-walks almost the whole remaining list just
    to find a tail you already passed on the previous walk. (Copying all nodes into an array
    and using two indices fixes the time, but costs O(N) extra memory, which is exactly what
    the interviewer will ask you to remove.)
  brute_force_complexity: O(N²) time, O(1) space — 5 × 10⁴ nodes means ~6 × 10⁸ pointer hops just to find tails.
  key_insight: >-
    The order L0, Ln, L1, Ln-1, … is just two lists merged alternately: the first half
    L0, L1, L2, … and the second half read backwards Ln, Ln-1, …. "Read backwards" on a
    singly linked list means "reverse it". So the problem is three problems you already know,
    in a row: find the middle with slow/fast pointers, reverse the second half in place,
    and zip the two halves together. Each step is one O(N) pass with O(1) extra pointers.
  real_world: >-
    These three moves are everyday list surgery in systems code. Merge sort on linked lists
    (how many standard libraries sort lists) splits with slow/fast pointers because it doesn't
    know the length. Kernel and allocator free lists (Linux's list_head) are rewired in place
    because allocating in a hot path isn't allowed, and feed services zipper-merge two ranked
    streams (organic and sponsored, near and top-rated) exactly like step three.

statement:
  clean: |
    You are given the `head` of a singly linked list. The list can be represented as:

    `L0 → L1 → … → Ln - 1 → Ln`

    **Reorder the list** to be on the following form:

    `L0 → Ln → L1 → Ln - 1 → L2 → Ln - 2 → …`

    You **may not modify the values** in the list's nodes. Only nodes themselves may be
    changed. Do not return anything; rearrange the list in place.
  oa_story: |
    **BogieBuild Rail Systems — OA Round 1**

    BogieBuild writes the yard software for a coach-maintenance depot near Yeshwanthpur. A rake
    (a train of coaches) arrives with its coaches coupled one behind another, and each coach's
    controller only knows the coach coupled directly behind it. For a load-balancing test, the
    depot wants the rake rearranged so the coaches alternate from the two ends: the front coach,
    then the last coach, then the second coach, then the second-last coach, and so on until the
    two ends meet.

    Coach numbers are painted on and can't be swapped between coaches; only the couplings can be
    changed. The shunting yard has no spare siding, so you can't park the coaches anywhere else
    while you work, and rakes can have up to 50,000 coaches in the simulation. Given the front
    coach, re-couple the rake in place.
  trigger_keywords: ["Reorder the list", "may not modify the values", "L0 → Ln → L1"]
  examples:
    - input: "head = [1,2,3,4]"
      output: "[1,4,2,3]"
      explanation: "First half 1 → 2, second half reversed 4 → 3, zipped: 1, 4, 2, 3."
    - input: "head = [1,2,3,4,5]"
      output: "[1,5,2,4,3]"
      explanation: "With an odd length the first half keeps the middle node 3, which ends up last."
  constraints:
    - "The number of nodes in the list is in the range [1, 5 * 10^4]"
    - "1 <= Node.val <= 1000"

constraint_quiz:
  prompt: >-
    The list can have 5 × 10⁴ nodes and the interviewer says "no extra data structures". What
    should you aim for?
  options: ["O(N²) time, O(1) space", "O(N) time, O(N) space", "O(N) time, O(1) space", "O(N log N) time, O(1) space"]
  answer: 2
  explanation: >-
    Re-walking to the tail for every splice is O(N²), about N²/4 ≈ 6 × 10⁸ hops here, which is too slow.
    Copying the nodes into an array (or a stack) is O(N) time but O(N) space, which breaks the
    "no extra data structures" rule. Nothing here needs sorting, so O(N log N) is just slower
    for no reason. Three linear passes (middle, reverse, merge) with a handful of pointers give
    O(N) time and O(1) space.

pattern_quiz:
  prompt: >-
    You must interleave a singly linked list's front with its back, in place, without changing
    values. Which pattern fits?
  options:
    - "Sort the nodes by value and relink them"
    - "Push every node on a stack, then pop from the back while walking from the front"
    - "Slow/fast pointers to find the middle, reverse the second half, merge the halves alternately"
    - "Two pointers from both ends, like on an array"
  answer: 2
  explanation: >-
    "Reorder" here is about positions, not values, so sorting is wrong. A stack works but
    costs O(N) memory. Array-style two pointers from both ends need a pointer that moves
    backwards, which a singly linked list doesn't have. The trigger "front and back
    alternately, in place, O(1) space" means: make the back walk forward by reversing it,
    which needs the middle first (slow/fast), and then a zipper merge.

