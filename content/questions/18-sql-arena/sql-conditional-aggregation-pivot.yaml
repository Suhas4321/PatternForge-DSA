slug: sql-conditional-aggregation-pivot
lc: 9316
citadel_id: sql_dbms
brick_layer: 6
runner_type: sql_sqlite

concept:
  problem_it_solves: >-
    "How do we transform discrete row values (such as test statuses PASS, FAIL, TIMEOUT) into columnar dashboard summaries in a single table pass?"
    In relational databases that lack dynamic `PIVOT` operators, or where portable cross-database SQL is required,
    conditional aggregation using `SUM(CASE WHEN status = 'X' THEN 1 ELSE 0 END)` is the industry-standard pattern.
  brute_force: >-
    Executing three separate queries (`SELECT COUNT(*) WHERE status = 'PASS'`, `SELECT COUNT(*) WHERE status = 'FAIL'`),
    then joining the three resulting tables back together. This scans the underlying disk pages 3 times instead of 1.
  brute_force_complexity: O(3 * N) table scans plus intermediate multi-join overhead.
  key_insight: >-
    Embedding a `CASE WHEN` expression directly inside an aggregate function (`SUM` or `COUNT`) computes multiple
    pivoted column metrics during a single Sequential Table Scan over the grouped table blocks.
  real_world: >-
    Continuous integration test summaries (Drizz testing telemetry), order fulfillment metrics, and financial monthly accounting rollups.

statement:
  clean: |
    Write a SQL query using conditional aggregation to pivot test run status counts per device:
    
    Table schema:
    ```sql
    CREATE TABLE TestRuns (
      run_id INTEGER PRIMARY KEY,
      device TEXT,
      status TEXT
    );
    ```
    
    Status can be `'PASS'`, `'FAIL'`, or `'TIMEOUT'`.
    
    Requirements:
    1. Group rows by `device`.
    2. Compute:
       - `pass_count`: number of runs with `status = 'PASS'`.
       - `fail_count`: number of runs with `status = 'FAIL'`.
       - `timeout_count`: number of runs with `status = 'TIMEOUT'`.
    3. Order the results by `device` ascending.
  oa_story: |
    **Drizz Test Farm — Execution Telemetry Dashboard**
    
    Our CI/CD telemetry dashboard displays a daily matrix showing total pass, fail, and timeout numbers
    for each connected mobile device model.
    The previous reporting job executed multiple separate queries and merged them in memory.
    
    Write an optimal, single-pass conditional aggregation query that pivots status counts into clean columnar metrics.
  trigger_keywords: ["conditional aggregation", "TestRuns", "device"]
  examples:
    - input: "TestRuns table has Pixel 8 with 2 PASS, 1 FAIL, and Galaxy S23 with 1 PASS, 1 FAIL, 1 TIMEOUT"
      output: "[('Galaxy S23', 1, 1, 1), ('Pixel 8', 2, 1, 0)]"
      explanation: "Statuses are pivoted into columns per device."
  constraints:
    - "TestRuns table contains between 0 and 10^5 rows"
    - "status is one of 'PASS', 'FAIL', 'TIMEOUT'"

constraint_quiz:
  prompt: >-
    Why is `SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END)` preferred over `COUNT(CASE WHEN status = 'PASS' THEN 1 END)`?
  options:
    - "Both work, but SUM(...) ELSE 0 explicitly guarantees an integer 0 rather than NULL when no matching rows exist"
    - "COUNT cannot accept CASE statements in SQL"
    - "SUM is 10x faster than COUNT"
    - "COUNT only works on primary keys"
  answer: 0
  explanation: >-
    Using `SUM(...) ELSE 0` ensures non-matching groups receive 0 rather than NULL, avoiding awkward COALESCE handling.

pattern_quiz:
  prompt: What SQL pattern pivots discrete row values into columns without specialized vendor PIVOT keywords?
  options:
    - "Conditional Aggregation (SUM/COUNT with CASE WHEN)"
    - "NATURAL JOIN"
    - "UNION ALL"
    - "RECURSIVE CTE"
  answer: 0
  explanation: >-
    Combining aggregate functions with CASE WHEN expressions is the universal, cross-database idiom for row-to-column pivoting.

