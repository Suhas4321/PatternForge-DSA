hints:
  - "Use `SELECT DISTINCT salary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET 1`."
  - "To handle the case where only 1 salary exists, wrap the entire expression as a scalar subquery: `SELECT (...) AS SecondHighestSalary;`."
  - "Scalar subqueries returning 0 rows evaluate automatically to `NULL` in SQL."

solution:
  code: |
    SELECT (
      SELECT DISTINCT salary
      FROM Employee
      ORDER BY salary DESC
      LIMIT 1 OFFSET 1
    ) AS SecondHighestSalary;
  explanation: |
    1. `SELECT DISTINCT salary FROM Employee ORDER BY salary DESC`: sorts unique salary tiers from highest to lowest.
    2. `LIMIT 1 OFFSET 1`: skips the #1 salary and returns the single row representing the #2 tier.
    3. Wrapping inside `SELECT (...) AS SecondHighestSalary`: if the table contains fewer than 2 distinct salaries,
       the subquery returns an empty rowset. In ANSI SQL, a scalar subquery producing 0 rows yields `NULL`,
       satisfying the LeetCode 176 requirement cleanly without complicated `IFNULL` functions.
  time: O(N log N) for sorting distinct salaries
  space: O(N) temporary buffer for sort and distinct hash

pitch_script: |
  **(Clarify)** "We need to return the second-highest distinct salary from the Employee table, ensuring that tied top salaries are handled and returning NULL if fewer than two distinct tiers exist."

  **(Basement Insight)** "A naive `LIMIT 1 OFFSET 1` fails on ties: two employees with the top salary of $300k would cause offset 1 to return $300k. Additionally, on single-salary tables, `OFFSET 1` returns zero rows instead of a row with NULL."

  **(Solution)** "We use `SELECT DISTINCT salary FROM Employee ORDER BY salary DESC LIMIT 1 OFFSET 1` to bypass ties, wrapped in an outer scalar `SELECT (...) AS SecondHighestSalary` so zero rows automatically evaluate to NULL."

  **(Complexity)** "Runs in O(N log N) time for sorting, or O(1) if an index exists on `salary DESC`."

