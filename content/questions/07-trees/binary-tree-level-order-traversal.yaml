slug: binary-tree-level-order-traversal
lc: 102

concept:
  problem_it_solves: >-
    "What does the tree look like one level at a time?" DFS answers questions about a subtree
    by diving to the bottom first, so it naturally mixes depths together. When the answer is
    organised by distance from the root (level 0, level 1, level 2, ...), you want to finish
    every node at one depth before touching the next, and a FIFO queue does exactly that.
  brute_force: >-
    Compute the height H, then for each depth d run a fresh DFS from the root that collects only
    the nodes at depth d. It produces the right answer, but every pass re-walks all the levels
    above d just to reach the ones it wants, so the top of the tree is visited H times.
  brute_force_complexity: >-
    O(N · H) time, O(H) space — on a skewed tree H = N, so 2000 nodes means about 2 × 10⁶
    node visits for a job that needs 2000.
  key_insight: >-
    A queue is first-in, first-out, so if you push children as you pop parents, every node of
    level d leaves the queue before any node of level d + 1. The only extra trick is knowing
    where one level ends: at the start of each round, len(queue) is exactly the number of nodes
    on the current level (everything in it was pushed by the previous level). Pop exactly that
    many, collect their values, push their children, and the queue now holds exactly the next
    level.
  real_world: >-
    Social graphs compute "friends, then friends-of-friends" (LinkedIn's 1st/2nd/3rd degree
    connections) level by level. Web crawlers fetch pages in BFS waves by link distance from
    the seed, and org-chart tools render a reporting tree row by row: CEO, then VPs, then
    directors.

statement:
  clean: |
    Given the `root` of a binary tree, return the **level order traversal** of its nodes'
    values, that is, the values **level by level**, each level read **from left to right**.

    Return a list of lists: the first inner list holds the root's value, the second holds the
    values of the root's children, and so on. An empty tree returns an empty list.
  oa_story: |
    **ReferralRoots — OA Round 1**

    ReferralRoots runs the referral programme for a fintech app that is spreading through
    Bengaluru's tech parks. The founder was the first member. Every member gets two invite
    slots, a "left" invite and a "right" invite, and each invite can bring in at most one new
    member, who then gets two slots of their own. The data team stores this as each member
    pointing to the (up to two) people they brought in.

    For the quarterly report the growth team wants the members grouped by **generation**:
    generation 0 is the founder, generation 1 is everyone the founder invited, generation 2 is
    everyone those people invited, and so on. Within a generation, list members in invite
    order: everything that came through a left slot before its sibling's right slot, and
    earlier branches before later ones. Return one list of member IDs per generation, starting
    from the founder. If the programme has no members yet, return an empty list.
  trigger_keywords: ["level order traversal", "level by level", "from left to right"]
  examples:
    - input: "root = [3,9,20,null,null,15,7]"
      output: "[[3],[9,20],[15,7]]"
      explanation: "Level 0 is 3, level 1 is 9 then 20, level 2 is 15 then 7 (both children of 20)."
    - input: "root = [1]"
      output: "[[1]]"
    - input: "root = []"
      output: "[]"
  constraints:
    - "The number of nodes in the tree is in the range [0, 2000]"
    - "-1000 <= Node.val <= 1000"

constraint_quiz:
  prompt: >-
    The tree has up to 2000 nodes and can be completely skewed (a single long chain). What
    time complexity should a good solution have?
  options:
    - "O(N · H) — one DFS per depth"
    - "O(N log N) — sort nodes by depth"
    - "O(N) — visit each node once"
    - "O(H) — walk one path from the root"
  answer: 2
  explanation: >-
    One DFS per depth is O(N · H), which becomes O(N²) on a chain because the top levels are
    re-walked every pass. Sorting by (depth, position) works but adds a log factor for no
    reason, since a queue already produces nodes in that order. O(H) is impossible: every value
    has to appear in the output, so you must visit all N nodes. A BFS touches each node exactly
    once: O(N).

pattern_quiz:
  prompt: >-
    The output is grouped by distance from the root, and each group is ordered left to right.
    Which pattern fits?
  options:
    - "Pre-order DFS, appending values to one list"
    - "BFS with a queue, processing one level per round"
    - "In-order traversal"
    - "Two pointers over the level-order array"
  answer: 1
  explanation: >-
    "Level by level" is the BFS trigger. A FIFO queue releases nodes in order of depth, and
    snapshotting len(queue) at the start of each round tells you where a level ends. A plain
    pre-order DFS mixes depths (it goes 3, 9, 20, 15, 7 only by luck here; on deeper trees it
    dives before finishing a level). In-order sorts a BST, which is unrelated. There is no
    array to point into: the input is a tree of nodes.

