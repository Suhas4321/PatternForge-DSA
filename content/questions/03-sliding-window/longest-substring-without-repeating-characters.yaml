  - {args: ["bbbbb"], expected: 1}
  - {args: ["pwwkew"], expected: 3, note: "\"pwke\" is a subsequence, not a substring"}
  - {args: [""], expected: 0, note: empty string}
  - {args: [" "], expected: 1, note: a space is a character}
  - {args: ["dvdf"], expected: 3, note: "don't restart from r on a repeat: the answer is \"vdf\""}
  - {args: ["abba"], expected: 2, note: "l must never move backwards"}
  - {args: ["tmmzuxt"], expected: 5, note: "the first t has already left the window when the second arrives"}
  - {args: ["ab cd ef"], expected: 5, note: "spaces repeat too: \"ab cd\" and \"cd ef\""}
visualize_test: 2

drills:
  - title: Expand r and count what's inside
    skill: setup
    goal: Grow the window one character at a time, keeping a hash map of counts for the window.
    instructions: |
      Walk the string with `r` from left to right, adding `s[r]` to a dictionary of counts.
      Return a list where position `r` holds the count of `s[r]` **right after** you added it.

      This is the expand half of every variable window. The moment a count becomes `2` is
      exactly the moment the window stops being "without repeating characters", so this
      number is the signal the full solution reacts to.
    function:
      name: countsOnEntry
      params: [{name: s}]
    starter_code: |
      class Solution:
          def countsOnEntry(self, s: str) -> List[int]:
              pass
    tests:
      - {args: ["abca"], expected: [1, 1, 1, 2]}
      - {args: ["bbb"], expected: [1, 2, 3]}
      - {args: ["a b a"], expected: [1, 1, 1, 2, 2], note: spaces are counted too}
      - {args: [""], expected: []}
    solution: |
      class Solution:
          def countsOnEntry(self, s: str) -> List[int]:
              count = {}
              out = []
              for r in range(len(s)):
                  count[s[r]] = count.get(s[r], 0) + 1
                  out.append(count[s[r]])
              return out
    hint: "`count[c] = count.get(c, 0) + 1` adds a character whether or not it was seen before."

  - title: Move l until the window is valid again
    skill: core
    goal: Write the while loop that shrinks from the left until the duplicate has left the window.
    instructions: |
      Run the window over `s`: add `s[r]` to the counts, then **while** `s[r]` appears more
      than once, remove `s[l]` from the counts and move `l` right. Return the value of `l`
      after each step (one entry per `r`).

      It has to be a `while`, not an `if`: in `"abcb"` the duplicate `b` sits at index 1, so
      `l` must step past both `a` and `b` before the window is valid. And `l` only ever moves
      forward, which is why the whole thing is O(N).
    function:
      name: leftAfterEachStep
      params: [{name: s}]
    starter_code: |
      class Solution:
          def leftAfterEachStep(self, s: str) -> List[int]:
              pass
    tests:
      - {args: ["abcabcbb"], expected: [0, 0, 0, 1, 2, 3, 5, 7]}
      - {args: ["dvdf"], expected: [0, 0, 1, 1]}
      - {args: ["bbbb"], expected: [0, 1, 2, 3]}
      - {args: ["abba"], expected: [0, 0, 2, 2], note: "the second a does not pull l back"}
    solution: |
      class Solution:
          def leftAfterEachStep(self, s: str) -> List[int]:
              count = {}
              l = 0
              lefts = []
              for r, c in enumerate(s):
                  count[c] = count.get(c, 0) + 1
                  while count[c] > 1:
                      count[s[l]] -= 1
                      l += 1
                  lefts.append(l)
              return lefts
    hint: "The loop condition is about the character that just entered: `while count[c] > 1`."

  - title: Measure only when the window is valid
    skill: edge
    goal: Record r − l + 1 right after the shrink, and keep where the best window starts so you can return it.
    instructions: |
      Return the longest substring without repeating characters **itself**. If several have
      the same maximum length, return the one that appears first. For an empty string,
      return `""`.

      Two details people get wrong: the length is `r - l + 1` (both ends are inside the
      window), and it must be measured **after** the while loop, when the window is
      guaranteed valid. Updating only on a strictly greater length keeps the earliest answer.
    function:
      name: longestUniqueSubstring
      params: [{name: s}]
    starter_code: |
      class Solution:
          def longestUniqueSubstring(self, s: str) -> str:
              pass
    tests:
      - {args: ["abcabcbb"], expected: "abc", note: "ties: \"bca\" and \"cab\" come later"}
      - {args: ["pwwkew"], expected: "wke"}
      - {args: ["dvdf"], expected: "vdf"}
      - {args: ["bbbbb"], expected: "b"}
      - {args: [""], expected: ""}
    solution: |
      class Solution:
          def longestUniqueSubstring(self, s: str) -> str:
              seen = set()
              l = best_l = best_len = 0
              for r, c in enumerate(s):
                  while c in seen:
                      seen.remove(s[l])
                      l += 1
                  seen.add(c)
                  if r - l + 1 > best_len:
                      best_l, best_len = l, r - l + 1
              return s[best_l:best_l + best_len]
    hint: "Store the start and the length of the best window; slice once at the end."

hints:
  - >-
    Suppose s[l..r-1] has no repeats and s[r] is a character already inside it. Is any window
    that still contains both copies worth keeping? What is the smallest move that fixes the
    window?
  - >-
    Keep a window [l, r] and a count map of its characters. For each r: add s[r]; while s[r]
    now appears twice, remove s[l] and move l right; then the window is valid, so compare
    r − l + 1 with the best so far.
  - |
    count = empty map, l = 0, best = 0
    for r from 0 to len(s) - 1:
        add s[r] to count
        while count[s[r]] > 1:
            remove s[l] from count
            l = l + 1
        best = max(best, r - l + 1)
    return best

solution:
  code: |
    class Solution:
        def lengthOfLongestSubstring(self, s: str) -> int:
            count = {}  # char -> occurrences inside s[l..r]
            best = 0
            l = 0
            for r, c in enumerate(s):
                count[c] = count.get(c, 0) + 1
                # c is duplicated now: shrink from the left until its older copy leaves
                while count[c] > 1:
                    count[s[l]] -= 1
                    l += 1
                best = max(best, r - l + 1)  # the window is valid here
            return best
  explanation: |
    The window `s[l..r]` always holds distinct characters. Adding `s[r]` can break that in
    exactly one way: `s[r]` itself is now in there twice. So the while loop only needs to
    watch `count[c]`, and it pops characters off the left until the older copy of `c` is
    gone. After the loop the window is valid again, which is the only moment it is safe to
    measure `r - l + 1`.

    Why it is O(N) even with a loop inside a loop: `l` never moves backwards and never passes
    `r`, so across the whole run it moves at most N times in total. Each character is added
    once and removed at most once.

    The cases that catch people: `"dvdf"` (on the second `d` you slide to index 1, not
    restart at `r`, so `"vdf"` survives), and `"abba"` if you use the faster "jump" version
    with a last-seen index map: `l = last[c] + 1` must only apply when `last[c] >= l`, or
    the second `a` would drag `l` back to index 1. The count-map version used here never
    moves `l` backwards, and it is the same template as Fruit Into Baskets and the windows
    still to come.
  time: O(N) — l and r each move right at most N times; O(1) average per map update
  space: O(min(N, Σ)) — the map holds at most one entry per distinct character (Σ = alphabet size)
  brute_force_code: |
    class Solution:
        def lengthOfLongestSubstring(self, s: str) -> int:
            best = 0
            for i in range(len(s)):
                seen = set()
                for j in range(i, len(s)):
                    if s[j] in seen:
                        break
                    seen.add(s[j])
                    best = max(best, j - i + 1)
            return best

pitch_script: |
  **(Clarify)** "So I return the length, not the substring itself, and it has to be
  contiguous. Spaces and symbols count as characters, and the empty string should give 0,
  right?"

  **(Brute force)** "The simple way is to fix every start, extend to the right with a set,
  and stop at the first repeat. That's O(N²) in general. With 5 × 10⁴ characters that's
  over a billion steps in the worst case, and most of it re-checks characters the previous
  start already checked."

  **(Trigger)** "'Longest substring' with a condition that breaks when a bad character
  enters tells me it's a variable sliding window. If a window has a repeat, any bigger
  window containing it also has the repeat, so I never need to move the left end backwards."

  **(Optimal)** "I keep l and r and a count map of the window. For each r I add s[r]. If
  that character now appears twice, I move l right, removing characters, until it appears
  once. At that point the window is valid, so I update the best with r minus l plus one."

  **(Complexity)** "Both pointers only move forward, so it's O(N) time overall with O(1)
  hash operations, and the map holds at most one entry per distinct character, so the
  space is bounded by the alphabet size. I could also store the last index of each
  character and jump l directly, as long as I never let it move backwards."

twist:
  lc: 1695
  title: Maximum Erasure Value
  why: >-
    Same "all elements unique" window, but over an integer array, and you maximise the sum
    of the window instead of its length. The template is unchanged: grow r, shrink l while
    nums[r] is duplicated. You just keep a running window sum, adding nums[r] on entry and
    subtracting nums[l] on exit, and track the best sum instead of r − l + 1.

viz:
  title: Longest Substring Sliding Window
  complexity:
    time: "O(n)"
    space: "O(min(n, m))"
  arrays: [s]
  pointers: [l, r]
  window: [l, r]
  maps: [count]
  watch: [c, best]
  line_notes:
    6: "Expand sliding window to the right by including character c at index r."
    7: "Increment character frequency count within the active window."
    9: "Character c is repeated; shrink window from left until the duplicate exits."
    10: "Decrement count of outgoing character at window left boundary."
    12: "Window contains only unique characters; record maximum window length."
