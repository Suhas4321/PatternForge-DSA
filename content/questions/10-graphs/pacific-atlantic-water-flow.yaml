slug: pacific-atlantic-water-flow
lc: 417

concept:
  problem_it_solves: >-
    "Which cells can reach a target region?" Asked forwards, every cell starts its own search and
    the searches overlap almost completely. Asked backwards, from the target, one search per target
    region answers the question for every cell at once. Here there are two targets (two oceans), so
    two backward searches, and the answer is the overlap of what they reach.
  brute_force: >-
    For every cell, run a DFS/BFS that follows water downhill (to neighbours with height <= the
    current one) and check whether that search ever touches the Pacific border and the Atlantic
    border. Neighbouring cells share almost the same downhill region, so the same cells get
    re-explored by thousands of separate searches, and nothing learned by one search is reused by
    the next.
  brute_force_complexity: >-
    O((m·n)²) time, O(m·n) space — a 200 × 200 grid has 4 × 10⁴ cells, and 4 × 10⁴ searches of up
    to 4 × 10⁴ cells each is about 1.6 × 10⁹ steps.
  key_insight: >-
    Reverse the flow. Water goes from a cell to a neighbour that is lower or equal, so if you walk
    backwards from the ocean you may only step to a neighbour that is higher or equal. Start one
    multi-source BFS from every Pacific border cell at once, climbing to neighbours with
    height >= the current height; every cell it reaches can drain into the Pacific. Do the same
    from the Atlantic border. A cell drains into both oceans exactly when both climbs reach it, so
    the answer is the intersection of the two visited sets. Each search visits each cell at most
    once: two passes over the grid instead of one search per cell.
  real_world: >-
    GIS tools (ArcGIS, GRASS GIS, the flood models city corporations use for monsoon planning)
    delineate a watershed by starting at the outlet and walking uphill over a digital elevation
    map, exactly this reverse climb. The same "search backwards from the target" trick powers
    impact analysis in microservice graphs (which services can reach this database?) and the
    mark phase of garbage collectors, which mark from the roots instead of asking every object
    whether it is reachable.

statement:
  clean: |
    There is an `m x n` rectangular island that borders both the **Pacific Ocean** and the
    **Atlantic Ocean**. The Pacific touches the island's **left and top edges**, and the Atlantic
    touches its **right and bottom edges**.

    The island is divided into square cells. You are given an `m x n` integer matrix `heights`,
    where `heights[r][c]` is the height above sea level of the cell at `(r, c)`.

    It rains heavily. Rain water can flow from a cell to a neighbouring cell directly north,
    south, east or west if that neighbour's height is **less than or equal to** the current cell's
    height. Water can flow from any cell adjacent to an ocean into that ocean.

    Return a list of grid coordinates `result` where `result[i] = [ri, ci]` means rain water can
    **flow to both the Pacific and Atlantic** oceans from cell `(ri, ci)`. You may return the
    coordinates in any order.
  oa_story: |
    **MonsoonMap — OA Round 1**

    MonsoonMap builds flood-readiness maps for BBMP. A ward is surveyed as a rectangular grid of
    plots, and each plot has an elevation reading. During a cloudburst, rain on a plot runs off to
    an adjacent plot (north, south, east or west) whenever that plot is no higher than the current
    one. The ward's west and north edges open into the Vrishabhavathi storm drain, and its east and
    south edges open into the Koramangala-Challaghatta drain; rain on any edge plot can run straight
    into the drain beside it.

    The planning team wants to place emergency pumps only on plots whose runoff can reach **both**
    drains, so the pump can redirect water to whichever drain is less loaded. Given the elevation
    grid (up to 200 × 200 plots, elevations up to 100,000), return the `[row, col]` of every such
    plot, in any order.
  trigger_keywords: ["less than or equal to", "flow to both the Pacific and Atlantic", "left and top edges"]
  examples:
    - input: "heights = [[1,2,2,3,5],[3,2,3,4,4],[2,4,5,3,1],[6,7,1,4,5],[5,1,1,2,4]]"
      output: "[[0,4],[1,3],[1,4],[2,2],[3,0],[3,1],[4,0]]"
      explanation: >-
        From (2,2), height 5, water can go up to (1,2)=3 → (0,2)=2 into the Pacific, and right to
        (2,3)=3 → (2,4)=1 into the Atlantic. (0,4) is a corner: it touches the top (Pacific) and
        the right edge (Atlantic) directly.
    - input: "heights = [[1]]"
      output: "[[0,0]]"
      explanation: "A single cell touches all four edges, so it drains into both oceans."
  constraints:
    - "m == heights.length"
    - "n == heights[r].length"
    - "1 <= m, n <= 200"
    - "0 <= heights[r][c] <= 10^5"

constraint_quiz:
  prompt: >-
    The grid can be 200 × 200 (4 × 10⁴ cells). What time complexity should you aim for?
  options:
    - "O((m·n)²) — one search per cell"
    - "O(m·n · log(m·n)) — sort cells by height"
    - "O(m·n) — a constant number of passes over the grid"
    - "O(m + n) — only look at the border"
  answer: 2
  explanation: >-
    One search per cell is about 1.6 × 10⁹ steps, which times out. Sorting cells by height would
    pass, but the ordering isn't needed: reachability alone answers the question. Two reverse
    searches (one per ocean) touch every cell at most once each, so O(m·n), about 10⁵ steps. Only
    looking at the border is impossible, because interior cells like (2,2) in example 1 can be in
    the answer.

pattern_quiz:
  prompt: >-
    You must find every cell from which water can reach two different target regions (the two
    ocean borders). Which approach fits best?
  options:
    - "From every cell, DFS downhill and check whether both oceans are reached"
    - "Reverse-flow BFS/DFS from each ocean's border cells, climbing to >= heights, then intersect the reached sets"
    - "Dijkstra from the top-left corner using heights as weights"
    - "Sort cells by height and sweep from lowest to highest"
  answer: 1
  explanation: >-
    "Can each cell reach the target?" with a fixed set of targets is the reverse-search trigger:
    search once from the targets instead of once from every cell. Reversing the edges flips
    "flows to a lower-or-equal neighbour" into "climb to a higher-or-equal neighbour". The forward
    search per cell is the brute force, Dijkstra answers a cost question nobody asked, and a
    height sweep ignores that water must follow connected paths.

