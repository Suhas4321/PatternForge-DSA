hints:
- 'Use a subquery to find the surviving minimum id for each email: `SELECT MIN(id) FROM Contacts GROUP BY email`.'
- Filter the outer table `WHERE id NOT IN (...)` to isolate all redundant rows.
- '| # Pseudocode Blueprint

  | SELECT id, name, email

  | FROM Contacts

  | WHERE id NOT IN (

  |     SELECT MIN(id)

  |     FROM Contacts

  |     GROUP BY email

  | )

  | ORDER BY id;'
solution:
  code: "SELECT\n    id,\n    name,\n    email\nFROM Contacts\nWHERE id NOT IN (\n    SELECT MIN(id)\n    FROM Contacts\n\
    \    GROUP BY email\n)\nORDER BY id;\n"
  explanation: Grouping by email finds the earliest identifier for each contact record. Filtering with `id NOT IN (SELECT
    MIN(id) ...)` isolates all subsequent duplicate entries with identical emails, allowing safe inspection or purging while
    preserving the original row.
  time: O(N) with index on email
  space: O(U) for distinct email set
pitch_script: '**(Clarify)** "We need to identify all duplicate contact records sharing the same email address, preserving
  only the original account with the lowest id."


  **(Brute force)** "Scanning the table with pairwise self-joins takes O(N^2) time and produces duplicate match pairings."


  **(Trigger)** "Selecting surviving records by minimum key and filtering the rest signals a `MIN(id) GROUP BY` subquery."


  **(Optimal)** "We find the survivor for each email using `SELECT MIN(id) FROM Contacts GROUP BY email`. In the outer query,
  any row whose `id` is NOT in that minimum set is a duplicate. We select `id, name, email` and order by id."


  **(Complexity)** "Executes in O(N) time with an index on email and O(U) space." '
