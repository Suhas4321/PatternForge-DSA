          def bound_metric(self, observed: int, limit: int) -> int:
              pass
    tests:
      - {args: [4, 3], expected: 3}
      - {args: [2, 5], expected: 2}
    solution: |
      class Solution:
          def bound_metric(self, observed: int, limit: int) -> int:
              return min(observed, limit)
    hint: "Return min(observed, limit)."

hints:
  - "If `task_count == 0`, return `{'tasks_completed': 0, 'max_concurrent_observed': 0}`."
  - "Instantiate `sem = asyncio.Semaphore(max_concurrency)`."
  - "Define `async def worker()` with `async with sem:`, update active workers, await `asyncio.sleep(0.001)`, and run all via `await asyncio.gather(...)`."

solution:
  code: |
    import asyncio

    class Solution:
        async def simulate_async_throttle(self, task_count: int, max_concurrency: int) -> dict:
            if task_count == 0:
                return {
                    "tasks_completed": 0,
                    "max_concurrent_observed": 0,
                }

            sem = asyncio.Semaphore(max_concurrency)
            active_workers = 0
            max_observed = 0

            async def worker():
                nonlocal active_workers, max_observed
                async with sem:
                    active_workers += 1
                    if active_workers > max_observed:
                        max_observed = active_workers
                    await asyncio.sleep(0.001)
                    active_workers -= 1

            tasks = [worker() for _ in range(task_count)]
            await asyncio.gather(*tasks)

            return {
                "tasks_completed": task_count,
                "max_concurrent_observed": max_observed,
            }
  explanation: |
    `asyncio.Semaphore(max_concurrency)` controls permit distribution on the single-threaded Event Loop.
    When `active_workers` reaches `max_concurrency`, the next coroutine to call `async with sem:` yields control
    and is placed on the waiting queue.
    
    As running workers complete their sleep and exit the context block, permits are returned and waiting
    coroutines resume, guaranteeing that peak simultaneous execution never exceeds `max_concurrency`.
  time: O(N * T / K) wall-clock time where N is tasks, T is sleep duration, and K is concurrency
  space: O(N) for coroutine objects

pitch_script: |
  **(Clarify)** "We need to throttle asynchronous tasks using an asyncio Semaphore so that at most K tasks run simultaneously, measuring the peak concurrent workers observed."

  **(Basement Insight)** "Dispatching hundreds of async coroutines via `asyncio.gather()` without bounds causes network socket exhaustion, HTTP 429 rate limiting, and memory spikes. `asyncio.Semaphore` provides cooperative backpressure without blocking the event loop thread."

  **(Solution)** "We instantiate `asyncio.Semaphore(max_concurrency)`. Each task enters via `async with sem:`, increments the active counter, updates `max_observed`, and awaits cooperative sleep. Awaiting `asyncio.gather` executes all tasks while strictly honoring the concurrency ceiling."

  **(Complexity)** "Executes in O(N) logical time, with wall-clock time proportional to N / K."

twist:
  lc: 9404
  title: Dynamic Concurrency Adaptation on HTTP 429
  why: >-
    In production gateways, if downstream APIs return HTTP 429 Too Many Requests,
    dynamically shrink semaphore capacity from 25 to 10 (additive decrease) and restore on success (multiplicative recovery).

