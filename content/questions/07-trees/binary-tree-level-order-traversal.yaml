visualize_test: 0

drills:
  - title: Drain a queue in BFS order
    skill: setup
    goal: Initialise a deque with the root and run the popleft-then-push-children loop.
    instructions: |
      Return all node values in BFS order as **one flat list** (no grouping yet). Return `[]`
      for an empty tree.

      This is the engine of every BFS: start with `queue = deque([root])`, then repeatedly
      `popleft()` a node, record it, and append its non-null children. Because the queue is
      first-in first-out, a node's children always wait behind everything already queued,
      which is exactly why the output comes out level by level.
    function:
      name: bfsOrder
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def bfsOrder(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[3, 9, 20, null, null, 15, 7]], expected: [3, 9, 20, 15, 7]}
      - {args: [[1, 2, 3, 4, null, null, 5]], expected: [1, 2, 3, 4, 5]}
      - {args: [[]], expected: [], note: empty tree}
      - {args: [[1, null, 2]], expected: [1, 2]}
    solution: |
      class Solution:
          def bfsOrder(self, root: Optional[TreeNode]) -> List[int]:
              if not root:
                  return []
              order = []
              queue = deque([root])
              while queue:
                  node = queue.popleft()
                  order.append(node.val)
                  if node.left:
                      queue.append(node.left)
                  if node.right:
                      queue.append(node.right)
              return order
    hint: "Guard the empty tree first, so you never put `None` in the queue."

  - title: Snapshot the level size
    skill: core
    goal: Read len(queue) at the start of each round and pop exactly that many nodes.
    instructions: |
      Return a list with the **number of nodes on each level**, from the root down. Return
      `[]` for an empty tree.

      This isolates the one line that turns a flat BFS into a level-by-level BFS. At the start
      of a round the queue holds only the current level, so `size = len(queue)` is that
      level's node count. Pop exactly `size` nodes; the children you push during those pops
      are the next level and must not be counted now. Reading `len(queue)` inside the loop
      instead would count them too.
    function:
      name: levelSizes
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def levelSizes(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[3, 9, 20, null, null, 15, 7]], expected: [1, 2, 2]}
      - {args: [[1, 2, 3, 4, 5, 6, 7]], expected: [1, 2, 4]}
      - {args: [[1, 2, null, 3]], expected: [1, 1, 1], note: chain}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def levelSizes(self, root: Optional[TreeNode]) -> List[int]:
              if not root:
                  return []
              sizes = []
              queue = deque([root])
              while queue:
                  size = len(queue)  # frozen before any children are pushed
                  sizes.append(size)
                  for _ in range(size):
                      node = queue.popleft()
                      queue.extend(c for c in (node.left, node.right) if c)
              return sizes
    hint: "`range(len(queue))` is evaluated once, before the loop body runs."

  - title: Keep only the deepest level
    skill: edge
    goal: Build each level in a fresh list and extract the right one at the end, including for an empty tree.
    instructions: |
      Return the values on the **deepest level**, left to right. Return `[]` for an empty tree.

      Two details trip people up in the full problem. First, `level` must be a **new list each
      round**; reusing one list (or clearing it after appending it to the result) leaves every
      entry pointing at the same object. Second, the empty tree must return `[]`, not `[[]]`
      and not a crash on `None.left`. Here you overwrite `last` with each finished level, so
      when the queue empties it holds the bottom row.
    function:
      name: deepestLevel
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def deepestLevel(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[3, 9, 20, null, null, 15, 7]], expected: [15, 7]}
      - {args: [[1, 2, 3, 4, null, null, 5]], expected: [4, 5], note: "cousins on the bottom row"}
      - {args: [[1]], expected: [1]}
      - {args: [[]], expected: [], note: empty tree}
      - {args: [[1, 2, 3, null, 4]], expected: [4], note: "the deepest level has a single node"}
    solution: |
      class Solution:
          def deepestLevel(self, root: Optional[TreeNode]) -> List[int]:
              last = []
              queue = deque([root] if root else [])
              while queue:
                  level = []  # a brand-new list every round
                  for _ in range(len(queue)):
                      node = queue.popleft()
                      level.append(node.val)
                      queue.extend(c for c in (node.left, node.right) if c)
                  last = level
              return last
    hint: "Start `queue` empty when `root` is `None`, and the while loop never runs."

hints:
  - >-
    DFS goes deep before it goes wide. Which data structure hands nodes back in the order they
    were discovered, so that everything at depth 1 comes out before anything at depth 2?
  - >-
    Use a queue that starts with the root. Each round, the queue holds exactly one level: read
    its length first, pop that many nodes, record their values in a new list, and push their
    children. When the round ends, the queue holds exactly the next level.
  - |
    if root is empty: return []
    result = [], queue = [root]
    while queue is not empty:
        level = []
        repeat len(queue) times:
            node = pop from the front
            add node.val to level
            push node.left, node.right (if they exist) to the back
        add level to result
    return result

solution:
  code: |
    class Solution:
        def levelOrder(self, root: Optional[TreeNode]) -> List[List[int]]:
            if not root:
                return []
            res = []
            queue = deque([root])
            while queue:
                level = []
                for _ in range(len(queue)):  # exactly the nodes of the current level
                    node = queue.popleft()
                    level.append(node.val)
                    if node.left:
                        queue.append(node.left)
                    if node.right:
                        queue.append(node.right)
                res.append(level)  # the queue now holds exactly the next level
            return res
  explanation: |
    The invariant is: **at the top of the `while` loop, the queue contains exactly one full
    level, in left-to-right order.** It holds at the start (just the root). During a round we
    pop the `len(queue)` nodes of the current level, left to right, and push their children
    left before right. So when the round ends, the old level is gone and the queue holds the
    next level, again left to right. The invariant holds again, and by induction every round
    produces one correct level.

    `range(len(queue))` is computed **once**, before the loop body runs, so the children we
    push during the round don't get mixed into the current level. That single snapshot is what
    separates level-order BFS from a plain BFS.

    Use `collections.deque`, not a list: `list.pop(0)` shifts every remaining element and costs
    O(N), which would make the whole traversal O(N²). The empty tree is handled up front so
    `None` never enters the queue.

    A DFS also works if you pass the depth down: `dfs(node, depth)` appends to `res[depth]`,
    creating the list the first time a depth is reached. Pre-order with left before right
    visits each level left to right, so the order still comes out correct. BFS is the more
    natural fit because the problem *is* "level by level".
  time: O(N) — every node is pushed and popped exactly once
  space: O(W) for the queue, where W is the widest level (up to about N / 2 on a perfect tree), plus O(N) for the output
  brute_force_code: |
    class Solution:
        def levelOrder(self, root: Optional[TreeNode]) -> List[List[int]]:
            def height(node):
                return 0 if not node else 1 + max(height(node.left), height(node.right))

            def collect(node, d, out):  # re-walks from the root for every depth
                if not node:
                    return
                if d == 0:
                    out.append(node.val)
                    return
                collect(node.left, d - 1, out)
                collect(node.right, d - 1, out)

            res = []
            for d in range(height(root)):
                level = []
                collect(root, d, level)
                res.append(level)
            return res

pitch_script: |
  **(Clarify)** "So I return one list per level, top to bottom, and each level left to right.
  For an empty tree I return an empty list, not a list containing an empty list. Right?"

  **(Brute force)** "One way is to find the height, then for each depth run a DFS from the
  root that collects only the nodes at that depth. That's O(N times H), which is O(N²) on a
  skewed tree, because I keep re-walking the top of the tree."

  **(Trigger)** "The phrase 'level by level' tells me BFS. A queue is first-in first-out, so if
  I push children while popping parents, all of one level comes out before any of the next."

  **(Optimal)** "I start the queue with the root. Each round, I read the queue's length first,
  because at that moment the queue holds exactly the current level. I pop that many nodes,
  collect their values into a new list, and push their left and right children. After the
  round the queue holds exactly the next level, so I append the list and repeat until the
  queue is empty."

  **(Complexity)** "Every node goes in and out of the queue once, so it's O(N) time. Space is
  O(W) for the queue, where W is the widest level, which can be about N over 2 for a perfect
  tree, plus the output itself. I'd use a deque, because popping from the front of a Python
  list is O(N)."

twist:
  lc: 103
  title: Binary Tree Zigzag Level Order Traversal
  why: >-
    Same BFS, same len(queue) snapshot, but the reading direction alternates: level 0 left to
    right, level 1 right to left, and so on. Keep the queue order unchanged (children are still
    pushed left then right, otherwise the next level comes out scrambled) and only flip how you
    record the level: reverse `level` on odd rounds, or build it with a deque and appendleft
    when going right to left. The traversal never changes; only the output does.

viz:
  arrays: [queue, level, res]
