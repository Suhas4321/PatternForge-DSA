  - {args: [[[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]], expected: [[1, 2], [3, 10], [12, 16]]}
  - {args: [[], [5, 7]], expected: [[5, 7]], note: empty list}
  - {args: [[[1, 5]], [2, 3]], expected: [[1, 5]], note: new interval is contained}
  - {args: [[[1, 5]], [6, 8]], expected: [[1, 5], [6, 8]], note: goes at the very end}
  - {args: [[[3, 5], [8, 9]], [0, 1]], expected: [[0, 1], [3, 5], [8, 9]], note: goes at the very front}
  - {args: [[[1, 2], [5, 6]], [2, 5]], expected: [[1, 6]], note: touches on both sides}
  - {args: [[[1, 2], [3, 4], [5, 6]], [0, 10]], expected: [[0, 10]], note: swallows everything}
  - {args: [[[1, 2], [6, 7]], [3, 4]], expected: [[1, 2], [3, 4], [6, 7]], note: fits in a gap}
visualize_test: 1

drills:
  - title: Phase 1, copy what ends before
    skill: setup
    goal: Walk the sorted list with one index and stop at the first interval that could touch the new one.
    instructions: |
      Return the intervals that lie **entirely before** `newInterval`, i.e. those that end
      strictly before it starts. `intervals` is sorted and non-overlapping.

      This is phase 1 of the full solution. The comparison must be strict: an interval ending at
      exactly `newInterval[0]` touches it, so it belongs to the merge phase, not the copy phase.
      Use a `while` loop with an index, because phase 2 will continue from where it stops.
    function:
      name: beforeNew
      params: [{name: intervals}, {name: newInterval}]
    starter_code: |
      class Solution:
          def beforeNew(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[[1, 2], [3, 5], [6, 7]], [5, 8]], expected: [[1, 2]], note: "[3,5] touches at 5"}
      - {args: [[[1, 2], [3, 4]], [6, 8]], expected: [[1, 2], [3, 4]]}
      - {args: [[[4, 6]], [1, 2]], expected: []}
      - {args: [[], [1, 2]], expected: []}
    solution: |
      class Solution:
          def beforeNew(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
              out = []
              i = 0
              while i < len(intervals) and intervals[i][1] < newInterval[0]:
                  out.append(intervals[i])
                  i += 1
              return out
    hint: "Keep going while `intervals[i][1] < newInterval[0]`, strictly less."

  - title: Phase 2, absorb the colliding run
    skill: core
    goal: Grow the new interval with min of starts and max of ends over every interval it overlaps.
    instructions: |
      Return the single interval `[start, end]` that `newInterval` becomes after absorbing every
      interval in `intervals` that overlaps or touches it.

      Overlap with closed intervals means `iv[1] >= start and iv[0] <= end`. Each absorbed
      interval can only widen the merged interval: `start = min(...)`, `end = max(...)`. In the
      full solution these colliding intervals are one contiguous run, so phase 2 is just a loop
      while `intervals[i][0] <= end`.
    function:
      name: absorbAll
      params: [{name: intervals}, {name: newInterval}]
    starter_code: |
      class Solution:
          def absorbAll(self, intervals: List[List[int]], newInterval: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]], expected: [3, 10]}
      - {args: [[[1, 3], [6, 9]], [2, 5]], expected: [1, 5]}
      - {args: [[[1, 2], [6, 7]], [3, 4]], expected: [3, 4], note: nothing overlaps}
      - {args: [[[1, 5]], [2, 3]], expected: [1, 5], note: contained in an existing interval}
      - {args: [[], [4, 4]], expected: [4, 4]}
    solution: |
      class Solution:
          def absorbAll(self, intervals: List[List[int]], newInterval: List[int]) -> List[int]:
              start, end = newInterval
              for s, e in intervals:
                  if e >= start and s <= end:  # shares at least one point
                      start = min(start, s)
                      end = max(end, e)
              return [start, end]
    hint: "Only widen: `start = min(start, s)` and `end = max(end, e)` for each overlapping interval."

  - title: Place it exactly once
    skill: edge
    goal: Insert a disjoint interval at the front, middle or end of a sorted list without dropping or duplicating it.
    instructions: |
      `newInterval` is guaranteed **not** to overlap or touch anything in `intervals`. Return
      the list with it inserted in sorted position.

      The bug this trains against: placing the new interval only when you meet an interval that
      starts after it. If the list is empty, or the new interval belongs at the very end, that
      moment never comes and the new interval silently disappears. In the full solution this is
      why `result.append([start, end])` sits *between* the loops, not inside one.
    function:
      name: insertDisjoint
      params: [{name: intervals}, {name: newInterval}]
    starter_code: |
      class Solution:
          def insertDisjoint(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[[1, 2], [6, 7]], [3, 4]], expected: [[1, 2], [3, 4], [6, 7]]}
      - {args: [[[3, 5]], [0, 1]], expected: [[0, 1], [3, 5]], note: front}
      - {args: [[[1, 2], [4, 5]], [7, 9]], expected: [[1, 2], [4, 5], [7, 9]], note: end}
      - {args: [[], [2, 3]], expected: [[2, 3]], note: empty list}
    solution: |
      class Solution:
          def insertDisjoint(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
              out = []
              placed = False
              for iv in intervals:
                  if not placed and iv[0] > newInterval[1]:
                      out.append(newInterval)
                      placed = True
                  out.append(iv)
              if not placed:
                  out.append(newInterval)
              return out
    hint: "After the loop, check whether the new interval was ever placed."

hints:
  - >-
    The list is already sorted and clean. If you lay the new interval over it, which existing
    intervals can it collide with? Are they scattered, or do they sit next to each other?
  - >-
    Use one index and three loops. Copy intervals while they end before the new start. Then,
    while intervals start at or before the new end, widen the new interval to cover them. Append
    the widened interval, then copy everything left.
  - |
    result = empty, i = 0, (start, end) = newInterval
    while i < n and intervals[i].end < start:
        append intervals[i]; i += 1
    while i < n and intervals[i].start <= end:
        start = min(start, intervals[i].start)
        end = max(end, intervals[i].end); i += 1
    append [start, end]
    while i < n: append intervals[i]; i += 1
    return result

solution:
  code: |
    class Solution:
        def insert(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
            result = []
            i, n = 0, len(intervals)
            start, end = newInterval
            # Phase 1: intervals that end before the new one starts
            while i < n and intervals[i][1] < start:
                result.append(intervals[i])
                i += 1
            # Phase 2: every interval that starts before the new one ends is absorbed
            while i < n and intervals[i][0] <= end:
                start = min(start, intervals[i][0])
                end = max(end, intervals[i][1])
                i += 1
            result.append([start, end])
            # Phase 3: the rest start after the merged interval ends
            while i < n:
                result.append(intervals[i])
                i += 1
            return result
  explanation: |
    Because the list is sorted by start **and** non-overlapping, it is also sorted by end. So
    the intervals that end before `start` are a prefix, the ones that start after `end` are a
    suffix, and everything in between overlaps the new interval. Each phase is a `while` loop
    that continues from the shared index `i`, so every interval is looked at once.

    The two comparisons encode the touching rule. Phase 1 uses `intervals[i][1] < start`
    (strict), so an interval ending exactly at `start` is merged, not copied. Phase 2 uses
    `intervals[i][0] <= end`, so an interval starting exactly at `end` is merged too; that is
    how `[8,10]` joins `[4,8]` in example 2.

    Phase 2 keeps widening `end` as it absorbs intervals, so the loop condition checks against
    the *growing* end. The merged interval is appended between phases 2 and 3 unconditionally,
    which covers the empty list, a new interval that goes at the very front or very end, and one
    that overlaps nothing.
  time: O(N) — each interval is visited once across the three loops
  space: O(N) — the output list (O(1) extra besides it)
  brute_force_code: |
    class Solution:
        def insert(self, intervals: List[List[int]], newInterval: List[int]) -> List[List[int]]:
            all_ivs = sorted([list(iv) for iv in intervals] + [list(newInterval)])
            merged = []
            for s, e in all_ivs:
                if merged and s <= merged[-1][1]:
                    merged[-1][1] = max(merged[-1][1], e)
                else:
                    merged.append([s, e])
            return merged

pitch_script: |
  **(Clarify)** "The existing list is sorted by start and has no overlaps, and the new interval
  might overlap several of them. Touching counts as overlapping, so 4 to 8 and 8 to 10 merge?
  And I can return a new list rather than editing in place?"

  **(Brute force)** "The simplest correct answer is to append the new interval and run Merge
  Intervals: sort, then merge. That's O(N log N), but it wastes the fact that the input is
  already sorted."

  **(Trigger)** "Since the list is sorted and disjoint, the intervals that collide with the new
  one have to be a contiguous run. Everything before that run ends before the new start, and
  everything after starts after the new end. That gives me a three-phase linear scan."

  **(Optimal)** "With a single index, I first copy intervals while they end strictly before the
  new start. Then, while intervals start at or before the new end, I absorb them by taking the
  min of starts and the max of ends; the end keeps growing as I absorb. I append the merged
  interval, then copy everything that's left. Appending between the loops handles the empty
  list and the front and end cases."

  **(Complexity)** "Every interval is visited once, so it's O(N) time and O(N) for the output.
  I could binary search for the start of the overlapping run, but building the output is O(N)
  anyway, so it doesn't change the bound."

twist:
  lc: 729
  title: My Calendar I
  why: >-
    Now the intervals arrive one booking at a time, and a booking that overlaps anything must be
    rejected instead of merged. The calendar is the same sorted, non-overlapping list, but you
    never merge: you find where the new booking would sit (binary search, or a sorted container)
    and only check its two neighbours, the one before and the one after, which is the same
    "collisions are contiguous" insight that makes the three phases work. Watch the touching
    rule flip: bookings are half-open [start, end), so one ending at 10 and the next starting at
    10 do not conflict.

