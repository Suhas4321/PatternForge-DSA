slug: move-zeroes
lc: 283

concept:
  problem_it_solves: >-
    "Keep the elements I want, in their original order, packed at the front, in place." One
    pointer reads every element; a second pointer marks where the next kept element should be
    written. Everything before the write pointer is finished, so each element is handled exactly
    once and nothing is ever shifted twice.
  brute_force: >-
    Every time you meet a 0, shift everything after it one step left and drop the 0 at the end.
    The same non-zero elements get shifted again and again, once for every zero in front of
    them. (Copying non-zeros into a new list is linear, but it breaks the in-place rule.)
  brute_force_complexity: >-
    O(N²) time, O(1) space — 10⁴ elements with half of them zeros means ~2.5 × 10⁷ element
    shifts.
  key_insight: >-
    You don't need to move zeros at all; move the non-zeros. Keep `write` = "how many non-zeros
    I've placed so far", which is also the slot the next non-zero belongs in. Walk `read` across
    the array and, on every non-zero, swap it into `write` and advance `write`. The gap between
    write and read is always a block of zeros, so each swap sends a zero backward and a non-zero
    forward, and non-zeros land in exactly the order they were read.
  real_world: >-
    C++'s erase–remove idiom (`std::remove_if`) is exactly this read/write loop, and Java's
    `ArrayList.removeIf` compacts the survivors forward the same way. Mark-compact garbage collectors
    slide live objects to the front of the heap preserving their order, and log-structured
    stores (Kafka log compaction, LSM-tree compaction in RocksDB) copy surviving records forward
    and reclaim the tail.

statement:
  clean: |
    Given an integer array `nums`, move all `0`'s **to the end** of it while maintaining the
    **relative order** of the non-zero elements.

    **Note** that you must do this **in-place** without making a copy of the array.

    **Follow up:** Could you minimize the total number of operations done?
  oa_story: |
    **KiranaKart Quick Commerce — OA Round 1**

    KiranaKart's dark store in Indiranagar shows customers a ranked shelf of products, stored as
    a list of stock counts in ranking order. Items with a stock count of `0` are out of stock and
    must sink to the bottom of the shelf, while every item that is still in stock must keep its
    ranking position relative to the other in-stock items (the merchandising team spent weeks
    tuning that order).

    The shelf list lives in a fixed buffer on the store's handheld scanner, which has very little
    memory, so you must rearrange the buffer itself rather than build a new one. Your function
    receives the list and returns nothing; the scanner reads the buffer after your function runs.
    Bonus points in the review if your rearrangement does as few writes as possible.
  trigger_keywords: ["to the end", "relative order", "in-place"]
  examples:
    - input: "nums = [0,1,0,3,12]"
      output: "[1,3,12,0,0]"
      explanation: "1, 3, 12 keep their order; both zeros end up at the back."
    - input: "nums = [0]"
      output: "[0]"
  constraints:
    - "1 <= nums.length <= 10^4"
    - "-2^31 <= nums[i] <= 2^31 - 1"

constraint_quiz:
  prompt: >-
    N can be 10⁴, the change must be in-place, and the follow-up asks you to minimise
    operations. What should you aim for?
  options:
    - "O(N²) time, O(1) space"
    - "O(N log N) time, O(N) space"
    - "O(N) time, O(N) space"
    - "O(N) time, O(1) space"
  answer: 3
  explanation: >-
    Shifting elements left on every zero is O(N²), up to ~10⁸ moves on bad inputs, and wastes
    operations. A stable sort with key "is zero" is O(N log N) and Python's sort uses O(N)
    temporary memory. Copying non-zeros into a new list is O(N) time but O(N) space, which the
    in-place rule forbids. One pass with a read and a write pointer does O(N) time and O(1)
    space.

pattern_quiz:
  prompt: >-
    Move every 0 to the end, in place, keeping the non-zeros in their original order. Which
    pattern fits?
  options:
    - "Two pointers from both ends: swap a zero on the left with a non-zero on the right"
    - "Read/write pointers moving in the same direction"
    - "Hash map of value → count"
    - "Sort the array with a custom key"
  answer: 1
  explanation: >-
    Opposite-end swapping does push zeros back, but it breaks the order: [0, 1, 2] becomes
    [2, 1, 0]. Counting values loses positions. Sorting is O(N log N) and not in-place in
    Python. "In-place" plus "maintain relative order" is the read/write (fast/slow) pointer
    trigger: both pointers move left to right, so elements are written in the order they are
    read.

