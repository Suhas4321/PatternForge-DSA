concept:
  problem_it_solves: >-
    "How do we generate an aggregated A/B testing benchmark leaderboard across multiple LLMs from 500,000 raw API execution logs?"
    Writing manual nested dictionaries with sums and counts in pure Python is verbose and slow.
    Pandas's Split-Apply-Combine pattern (`df.groupby().agg()`) vectorizes multi-metric reductions across categories simultaneously.
  brute_force: >-
    Looping over all rows, using a `defaultdict(list)` to store latencies and success booleans per model,
    then running secondary loops to compute means and rates.
  brute_force_complexity: O(N) operations, but multiple intermediate list allocations and high memory churn.
  key_insight: >-
    `.groupby('model').agg(...)` splits the underlying columnar index into group buckets, applies C-optimized reduction kernels
    (`count`, `mean`, `quantile`), and recombines the results into a unified summary DataFrame.
    Boolean columns cast to integers (`df['success'].astype(int)`) allow computing percentage success rates via a simple mean.
  real_world: >-
    Generating model performance leaderboards (GEPA and Drizz test metrics), cloud service SLA tracking, and financial risk dashboards.

statement:
  clean: |
    Implement an automated model performance aggregator using split-apply-combine agg:
    `compute_model_leaderboard(records: list[dict]) -> list[dict]`.
    
    Given a list of LLM test execution logs where each dictionary contains:
    `model` (str), `latency_ms` (float), and `success` (bool).
    
    Aggregation requirements:
    1. If `records` is empty, return `[]`.
    2. Convert `records` into a `pandas.DataFrame`.
    3. Group rows by `model` and compute the following metrics for each model:
       - `run_count`: total number of test runs for this model (int).
       - `avg_latency`: arithmetic mean of `latency_ms`, rounded to 1 decimal place (float).
       - `success_rate`: percentage of runs where `success == True` (i.e. `mean(success) * 100`), rounded to 1 decimal place (float).
    4. Sort the summary DataFrame:
       - Primarily by `success_rate` in **descending** order (higher reliability first).
       - Secondarily by `avg_latency` in **ascending** order (faster speed first on ties).
    5. Return the resulting leaderboard as a list of dictionaries with keys `model`, `run_count`, `avg_latency`, and `success_rate`.
  oa_story: |
    **GEPA Optimization Platform — Model Leaderboard Rollup**
    
    During genetic prompt mutation experiments, candidate prompts are tested across OpenAI, Anthropic, and open-source models.
    The evaluation engine logs each API response. To determine which model variant graduates to production, the analytics
    team requires a unified leaderboard sorting candidate models by highest success rate and lowest latency.
    
    Build a vectorized Pandas aggregation pipeline that computes group metrics and outputs the sorted leaderboard.
  trigger_keywords: ["split-apply-combine agg", "compute_model_leaderboard", "records"]
  examples:
    - input: "records = [{'model': 'gpt-4o', 'latency_ms': 200, 'success': True}, {'model': 'gpt-4o', 'latency_ms': 300, 'success': False}]"
      output: "[{'model': 'gpt-4o', 'run_count': 2, 'avg_latency': 250.0, 'success_rate': 50.0}]"
      explanation: "Computes count 2, mean latency 250.0, and 50.0% success rate."
  constraints:
    - "records contains between 0 and 20,000 items"
    - "latency_ms is a positive float"

constraint_quiz:
  prompt: >-
    How can the percentage of `True` values in a boolean column be computed directly using Pandas aggregation?
  options:
    - "df['success'].astype(int).mean() * 100"
    - "df['success'].sum() * 100"
    - "df['success'].count()"
    - "df['success'].std()"
  answer: 0
  explanation: >-
    Casting booleans to 1s and 0s means the mean equals the proportion of True values; multiplying by 100 yields the percentage.

pattern_quiz:
  prompt: What are the three phases of the Split-Apply-Combine mental model in Pandas?
  options:
    - "Split into groups -> Apply a function/reduction to each group -> Combine into a new DataFrame"
    - "Sort -> Filter -> Slice"
    - "Load -> Serialize -> Save"
    - "Index -> Map -> Reduce"
  answer: 0
  explanation: >-
    Hadley Wickham's Split-Apply-Combine paradigm divides data into subsets, executes independent functions, and combines results.

