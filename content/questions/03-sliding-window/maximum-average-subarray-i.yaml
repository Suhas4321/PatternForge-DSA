tests:
  - {args: [[1, 12, -5, -6, 50, 3], 4], expected: 12.75}
  - {args: [[5], 1], expected: 5.0, note: single element}
  - {args: [[0, 4, 0, 3, 2], 1], expected: 4.0, note: "k = 1 is just the maximum element"}
