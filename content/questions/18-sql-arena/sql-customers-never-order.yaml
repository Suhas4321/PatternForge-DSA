slug: sql-customers-never-order
lc: 9313
citadel_id: sql_dbms
brick_layer: 3
runner_type: sql_sqlite

concept:
  problem_it_solves: >-
    "How do we query records that have NO matching foreign key rows in a child table (an Anti-Join)?"
    A standard INNER JOIN discards rows with no matches.
    Using `LEFT JOIN Orders ON Customers.id = Orders.customerId` preserves all customer rows and fills missing order columns with NULL.
    Filtering with `WHERE Orders.id IS NULL` isolates exactly the customers who have never placed an order.
  brute_force: >-
    Using `WHERE id NOT IN (SELECT customerId FROM Orders)`. While readable, if `Orders.customerId` contains even a single `NULL` value,
    SQL three-valued logic causes `NOT IN (..., NULL)` to evaluate to `UNKNOWN` for every row, returning 0 rows!
  brute_force_complexity: O(C * O) unindexed subquery scan and prone to NULL poison bugs.
  key_insight: >-
    `LEFT JOIN ... WHERE child.id IS NULL` is immune to NULL value pitfalls in the foreign key column.
    The database engine executes a Hash or Merge Anti-Join in O(C + O) linear time, immediately returning orphan parent records.
  real_world: >-
    LeetCode 183 (Customers Who Never Order), identifying inactive users for re-engagement emails, and finding unassigned tickets.

statement:
  clean: |
    Write a SQL query to find all customers never order from the `Customers` table.
    
    Table schemas:
    ```sql
    CREATE TABLE Customers (
      id INTEGER PRIMARY KEY,
      name TEXT
    );
    
    CREATE TABLE Orders (
      id INTEGER PRIMARY KEY,
      customerId INTEGER
    );
    ```
    
    Return the result table with a single column: `Customers`.
  oa_story: |
    **E-Commerce Marketing Operations — Churn & Inactivity Audit**
    
    Our marketing team is launching a discount campaign targeting registered users who created an account but never made a purchase.
    The previous analytics script used a subquery with `NOT IN`, which broke production reporting when a test order with a `NULL` customerId was created.
    
    Write an optimal, production-grade Anti-Join query that reliably returns all customers who have no entries in the `Orders` table.
  trigger_keywords: ["customers never order", "Customers", "Orders"]
  examples:
    - input: "Customers: [(1, 'Joe'), (2, 'Henry'), (3, 'Sam'), (4, 'Max')]; Orders: [(1, 3), (2, 1)]"
      output: "Customers: Henry, Max"
      explanation: "Joe and Sam placed orders (3 and 1). Henry and Max have no corresponding orders."
  constraints:
    - "Customers table contains between 0 and 10^5 rows"
    - "Orders table contains between 0 and 10^5 rows"

constraint_quiz:
  prompt: >-
    Why can `WHERE id NOT IN (SELECT customerId FROM Orders)` unexpectedly return 0 rows?
  options:
    - "Because NOT IN is not supported in ANSI SQL"
    - "Because if the subquery returns any NULL value, `val NOT IN (..., NULL)` evaluates to UNKNOWN"
    - "Because customerId must always be positive"
    - "Because of case sensitivity"
  answer: 1
  explanation: >-
    In SQL's three-valued logic, `x NOT IN (1, NULL)` evaluates to UNKNOWN, which evaluates to False in WHERE clauses.

pattern_quiz:
  prompt: What join pattern matches all left rows and filters for non-existent right rows via `WHERE right.id IS NULL`?
  options:
    - "Anti-Join via LEFT JOIN"
    - "CROSS JOIN"
    - "INNER JOIN"
    - "NATURAL JOIN"
  answer: 0
  explanation: >-
    A LEFT JOIN combined with a `WHERE right_key IS NULL` filter is the textbook SQL Anti-Join idiom.

