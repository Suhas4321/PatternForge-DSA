slug: rag-cross-encoder-reranker
lc: 9607
citadel_id: ai_resume
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: Why is initial vector search often insufficient for precision enterprise RAG? Bi-encoder vector search
    encodes query and documents independently into fixed-length vectors, losing fine-grained cross-token interactions. A cross-encoder
    performs joint cross-attention over [CLS] query [SEP] passage, modeling exact term coverage and phrase bonuses to rescore
    candidates accurately.
  brute_force: Running heavy cross-encoder neural networks across all 10,000,000 documents in the database for every single
    user query.
  brute_force_complexity: O(N * L^2) full self-attention across the entire corpus causing multi-second latency.
  key_insight: 'Two-stage retrieval: use fast bi-encoder ANN vector search to retrieve the top-50 candidates, then run cross-encoder
    scoring on only those 50 passages.'
  real_world: Cohere Rerank API, BGE-Reranker-Large, and WisdomBot aerospace document reranking stage.
statement:
  clean: "Implement a deterministic cross-encoder candidate reranker:\n`rerank_passages(self, query: str, candidates: list[dict],\
    \ top_k: int = 3) -> list[dict]`.\n\nGiven:\n- `query`: search query string\n- `candidates`: list of candidate document\
    \ dictionaries:\n  `{'doc_id': str, 'text': str, 'biencoder_score': float}`\n- `top_k`: maximum number of reranked passages\
    \ to return\n\nCross-Encoder Scoring Formula:\n1. Tokenize `query` into lowercase alphanumeric words: `q_words = set(re.findall(r'\\\
    w+', query.lower().strip()))`.\n2. For each candidate document:\n   - Tokenize `doc['text']` into lowercase words: `d_words\
    \ = re.findall(r'\\w+', doc['text'].lower())`.\n   - Lexical coverage ratio:\n     `coverage = len(q_words.intersection(set(d_words)))\
    \ / max(len(q_words), 1)`.\n   - Exact phrase bonus:\n     `phrase_bonus = 1.0 if query.lower().strip() in doc['text'].lower()\
    \ else 0.0`.\n   - Bi-encoder score:\n     `bi_score = float(doc.get('biencoder_score', 0.0))`.\n   - Cross-encoder composite\
    \ score:\n     `cross_score = round((0.5 * coverage) + (0.3 * phrase_bonus) + (0.2 * bi_score), 4)`.\n3. Sort candidates:\n\
    \   - Primary: `cross_score` descending\n   - Secondary (tie-breaker): `doc_id` alphabetically ascending\n4. Take the\
    \ top `min(top_k, len(candidates))` candidates and assign 1-indexed `'rank'` (1, 2, ...).\n5. Return list of dicts: `[{'doc_id':\
    \ doc_id, 'cross_score': cross_score, 'rank': rank}, ...]`."
  oa_story: '**WisdomBot Search Service — Two-Stage Neural Retrieval Pipeline**


    During aerospace engine diagnostics, technicians searched for exact error strings like `HPT vane burn through inspection`.
    While bi-encoder vector embeddings retrieved general turbine blade manuals, they scored passages describing unrelated
    compressor components higher than the exact vane inspection procedure.


    The search team deployed a lightweight cross-encoder reranker to jointly score the top-50 retrieved candidates using lexical
    coverage and exact phrase match boosts. Implement this reranker.'
  trigger_keywords:
  - deterministic cross-encoder candidate reranker
  - rerank_passages
  - biencoder_score
  examples:
  - input: 'query = ''fast vector search'', candidates = [{''doc_id'': ''docA'', ''text'': ''Fast vector search with HNSW
      indexes'', ''biencoder_score'': 0.8}, {''doc_id'': ''docB'', ''text'': ''General search algorithms in databases'', ''biencoder_score'':
      0.9}], top_k = 2'
    output: '[{''doc_id'': ''docA'', ''cross_score'': 0.96, ''rank'': 1}, {''doc_id'': ''docB'', ''cross_score'': 0.3467,
      ''rank'': 2}]'
    explanation: docA contains the exact phrase 'fast vector search' and full keyword coverage, surpassing docB's higher bi-encoder
      score.
  constraints:
  - 0 <= len(candidates) <= 200
  - 1 <= top_k <= 50
constraint_quiz:
  prompt: Why is a Cross-Encoder typically used as a reranker rather than the first-stage retriever?
  options:
  - Because computing full cross-attention over query-document token pairs for millions of documents is computationally prohibitive
  - Because Cross-Encoders can only run on CPU, not GPU
  - Because Cross-Encoders do not support English text
  - Because Vector databases forbid Cross-Encoders by law
  answer: 0
  explanation: Bi-encoders pre-compute document vectors offline, allowing fast O(log N) ANN index scans. Cross-encoders require
    computing O(L^2) attention dynamically for every query-document pair, restricting their use to small top-k candidate sets.
pattern_quiz:
  prompt: What key architectural distinction separates Bi-Encoders from Cross-Encoders?
  options:
  - Bi-Encoders encode query and document in separate forward passes; Cross-Encoders concatenate query and document into a
    single forward pass with full cross-attention
  - Bi-Encoders use 2 layers; Cross-Encoders use 100 layers
  - Bi-Encoders only process numbers; Cross-Encoders only process words
  - Bi-Encoders run on client mobile devices only
  answer: 0
  explanation: Bi-encoders output separate embedding vectors for dot-product comparison. Cross-encoders concatenate `[CLS]
    Query [SEP] Passage` so every token directly attends to every other token.
