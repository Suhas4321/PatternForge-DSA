concept:
  problem_it_solves: >-
    "How do we solve the classic 'Nth Highest Salary per Department' question purely in Python using Pandas without writing custom nested loops?"
    SQL analytical window functions (`DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC)`) have a direct, high-performance
    equivalent in Pandas: `df.groupby('dept')['salary'].rank(method='dense', ascending=False)`.
  brute_force: >-
    Looping through departments, converting salaries into sets to eliminate duplicates, sorting, finding the second element,
    and running another loop to find which employees match that salary.
  brute_force_complexity: O(D * N log N) manual Python loops and sets.
  key_insight: >-
    `method='dense'` assigns consecutive integer ranks without gaps when values tie.
    For example, if salaries are `[120k, 120k, 95k]`, standard `rank(method='min')` assigns ranks `[1, 1, 3]`, completely skipping rank 2!
    `method='dense'` assigns ranks `[1, 1, 2]`, correctly identifying 95k as the 2nd highest salary.
  real_world: >-
    Payroll analytics, identifying top-performing sales regions, and calculating tier-2 latency percentiles across microservices.

statement:
  clean: |
    Implement department-level rank filtering using dense rank window:
    `get_second_highest_salaries(employees: list[dict]) -> list[dict]`.
    
    Given a list of employee records with keys:
    `emp_id` (int), `name` (str), `department` (str), and `salary` (int).
    
    Requirements:
    1. If `employees` is empty, return `[]`.
    2. Convert `employees` into a `pandas.DataFrame`.
    3. Calculate the dense rank of `salary` within each `department` in descending order:
       `df["rank"] = df.groupby("department")["salary"].rank(method="dense", ascending=False)`.
    4. Filter for employees who have `rank == 2` (the 2nd highest salary in their department).
       If a department has no 2nd highest salary (e.g. only 1 distinct salary exists), that department produces no output rows.
    5. Project columns: `["department", "name", "salary"]`.
    6. Sort the final DataFrame by `department` ascending, then `salary` descending, then `name` ascending.
    7. Return the result as a list of dictionaries via `.to_dict(orient='records')`.
  oa_story: |
    **Drizz Compensation Analytics — Department Benchmarks**
    
    During annual engineering compensation leveling across global engineering hubs, HR needed to identify
    the second-highest compensation band in each engineering department. If two senior staff engineers tied for the top salary,
    the next distinct salary tier must still be correctly recognized as Rank 2.
    
    Implement this analytical calculation using vectorized Pandas window ranking.
  trigger_keywords: ["dense rank window", "get_second_highest_salaries", "employees"]
  examples:
    - input: "employees = [{'emp_id': 1, 'name': 'Alice', 'department': 'Eng', 'salary': 100}, {'emp_id': 2, 'name': 'Bob', 'department': 'Eng', 'salary': 90}]"
      output: "[{'department': 'Eng', 'name': 'Bob', 'salary': 90}]"
      explanation: "Bob has rank 2 in Eng with salary 90."
    - input: "employees = [{'emp_id': 1, 'name': 'A', 'department': 'HR', 'salary': 50}]"
      output: "[]"
      explanation: "Only 1 salary exists, so no rank 2 employee."
  constraints:
    - "employees contains between 0 and 20,000 items"
    - "salary is a positive integer"

constraint_quiz:
  prompt: >-
    Given salaries `[100, 100, 90]`, what rank will `salary = 90` receive under `rank(method='dense', ascending=False)`?
  options:
    - "Rank 1"
    - "Rank 2"
    - "Rank 3"
    - "Rank 0"
  answer: 1
  explanation: >-
    Dense ranking does not skip numbers on ties; the two 100s both receive Rank 1, so 90 receives Rank 2.

pattern_quiz:
  prompt: Which argument in Pandas `.rank()` groups tied values without skipping rank numbers?
  options:
    - "method='dense'"
    - "method='average'"
    - "method='min'"
    - "method='first'"
  answer: 0
  explanation: >-
    `method='dense'` produces consecutive ranks without gaps (1, 1, 2 rather than 1, 1, 3).

