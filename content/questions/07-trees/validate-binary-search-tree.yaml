  - {args: [[5, 1, 4, null, null, 3, 6]], expected: false}
  - {args: [[5, 4, 6, null, null, 3, 7]], expected: false, note: "parent-child checks all pass; 3 breaks the root's lower bound"}
  - {args: [[5, 3, 8, 1, 6]], expected: false, note: "6 is right of 3 but inside 5's left subtree: upper bound broken"}
  - {args: [[1]], expected: true, note: single node}
  - {args: [[2, 2, 2]], expected: false, note: "duplicates: strictly less / greater"}
  - {args: [[-2147483648, null, 2147483647]], expected: true, note: "extreme values: an int sentinel like ±2^31 would break"}
  - {args: [[8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7]], expected: true, note: larger valid BST}
visualize_test: 2

drills:
  - title: In-order reads a BST in sorted order
    skill: setup
    goal: Write the recursive in-order traversal (left, node, right).
    instructions: |
      Return the node values in **in-order**: left subtree, then the node, then the right
      subtree.

      For a valid BST this list is strictly increasing, because everything left of a node is
      smaller and everything right is larger. That gives a second way to validate a BST and is
      the backbone of many BST problems (k-th smallest, BST iterator). Run it on
      `[5,4,6,null,null,3,7]` and look: `4, 5, 3, 6, 7`. The `3` after the `5` is the bug.
    function:
      name: inorderValues
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def inorderValues(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[2, 1, 3]], expected: [1, 2, 3]}
      - {args: [[5, 4, 6, null, null, 3, 7]], expected: [4, 5, 3, 6, 7], note: "not sorted: not a BST"}
      - {args: [[1, null, 2, null, 3]], expected: [1, 2, 3]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def inorderValues(self, root: Optional[TreeNode]) -> List[int]:
              out = []

              def walk(node):
                  if not node:
                      return
                  walk(node.left)
                  out.append(node.val)
                  walk(node.right)

              walk(root)
              return out
    hint: "The only difference from pre-order is where the `append` goes."

  - title: Which bounds does each node inherit?
    skill: core
    goal: Pass (low, high) down, tightening high when going left and low when going right.
    instructions: |
      Return, in pre-order, the pair `[low, high]` of bounds each node must satisfy, using
      `None` for "unbounded". The root gets `[None, None]`.

      This is the heart of the solution. A left child inherits its parent's `low` and gets the
      parent's value as its new `high`; a right child inherits `high` and gets the parent's
      value as its new `low`. Notice that deep nodes keep bounds from ancestors several levels
      up. That's exactly the information the parent-child check throws away.
    function:
      name: inheritedBounds
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def inheritedBounds(self, root: Optional[TreeNode]) -> List[List[Optional[int]]]:
              pass
    tests:
      - {args: [[2, 1, 3]], expected: [[null, null], [null, 2], [2, null]]}
      - {args: [[5, 4, 6, null, null, 3, 7]], expected: [[null, null], [null, 5], [5, null], [5, 6], [6, null]], note: "3 must lie in (5, 6)"}
      - {args: [[8, 4, null, 2, 6]], expected: [[null, null], [null, 8], [null, 4], [4, 8]]}
    solution: |
      class Solution:
          def inheritedBounds(self, root: Optional[TreeNode]) -> List[List[Optional[int]]]:
              out = []

              def dfs(node, low, high):
                  if not node:
                      return
                  out.append([low, high])
                  dfs(node.left, low, node.val)
                  dfs(node.right, node.val, high)

              dfs(root, None, None)
              return out
    hint: "Going left changes only `high`; going right changes only `low`."

  - title: Strict order without a fake sentinel
    skill: edge
    goal: Validate with in-order and a `prev` that starts as None, rejecting equal neighbours.
    instructions: |
      Return `True` if the tree is a valid BST, checking during an in-order walk that each
      value is **strictly greater** than the previous one.

      Two edges decide this. Duplicates are invalid, so the check is `node.val <= prev` → fail
      (not `<`). And values reach `-2^31`, so starting `prev` at `-2^31` (or any int) wrongly
      rejects a tree whose smallest value is exactly `-2^31`. Start with `prev = None`, meaning
      "nothing seen yet", or use `float('-inf')`. The same reasoning is why the bounds solution
      uses infinities instead of int limits.
    function:
      name: isIncreasingInorder
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def isIncreasingInorder(self, root: Optional[TreeNode]) -> bool:
              pass
    tests:
      - {args: [[2, 2, 2]], expected: false, note: duplicates}
      - {args: [[-2147483648]], expected: true, note: "the minimum int on its own is valid"}
      - {args: [[-2147483648, null, 2147483647]], expected: true}
      - {args: [[5, 4, 6, null, null, 3, 7]], expected: false}
      - {args: [[2, 1, 3]], expected: true}
    solution: |
      class Solution:
          def isIncreasingInorder(self, root: Optional[TreeNode]) -> bool:
              prev = None

              def walk(node):
                  nonlocal prev
                  if not node:
                      return True
                  if not walk(node.left):
                      return False
                  if prev is not None and node.val <= prev:
                      return False
                  prev = node.val
                  return walk(node.right)

              return walk(root)
    hint: "Compare with `prev` only after the left subtree is done, then update `prev`."

hints:
  - >-
    Checking each node against its two children feels right. Try it on [5,4,6,null,null,3,7]:
    which node breaks the rules, and which ancestor's rule does it break?
  - >-
    Every node must lie in an open range (low, high) set by its ancestors. The root's range is
    (-∞, ∞). A left child's range is (low, node.val); a right child's is (node.val, high).
    Pass the range down and fail as soon as a node falls outside it.
  - |
    valid(node, low, high):
        if node is empty: return true
        if node.val is not strictly between low and high: return false
        return valid(node.left, low, node.val) and valid(node.right, node.val, high)
    answer = valid(root, -infinity, +infinity)

solution:
  code: |
    class Solution:
        def isValidBST(self, root: Optional[TreeNode]) -> bool:
            def valid(node, low, high):
                if not node:
                    return True  # an empty subtree breaks no rule
                if not (low < node.val < high):  # strict: duplicates are invalid
                    return False
                # going left caps the subtree at node.val; going right floors it at node.val
                return valid(node.left, low, node.val) and valid(node.right, node.val, high)

            return valid(root, float('-inf'), float('inf'))
  explanation: |
    **Why the parent-child check is wrong.** In `[5,4,6,null,null,3,7]` every node is correct
    relative to its own children: 4 < 5 < 6 and 3 < 6 < 7. But 3 sits in the root's right
    subtree, so it must be greater than 5. The rule is about whole subtrees, and a node's
    children can't see its grandparents.

    **What gets passed down.** The bounds `(low, high)` summarise every constraint from every
    ancestor: going left through value `v` adds "< v", going right adds "> v", and only the
    tightest of each kind matters. So one pair of numbers per call is enough. Each call checks
    its node against the pair and hands tightened pairs to its children. Compare with Good
    Nodes, which passed one number down; here two numbers travel down and a boolean comes back
    up. `and` short-circuits, so the first violation stops the search.

    **Edge cases.** Use strict `<` on both sides, because duplicates are invalid. Values can be
    exactly `-2^31` or `2^31 - 1`, so an integer sentinel like `-2**31` would reject a valid
    tree; `float('-inf')`/`float('inf')` (or `None` meaning unbounded) can never collide with a
    real value.

    **Alternative.** An in-order traversal of a BST yields strictly increasing values, so you
    can walk in-order keeping the previous value and fail on any `node.val <= prev`. It's the
    same O(N) time and O(H) space, and it's worth knowing because it is the basis of
    "k-th smallest in a BST".
  time: O(N) — each node is checked once, in O(1)
  space: O(H) — recursion depth; O(log N) when balanced, O(N) for a chain
  brute_force_code: |
    class Solution:
        def isValidBST(self, root: Optional[TreeNode]) -> bool:
            def subtree_max(node):  # re-scans the whole subtree every time it is called
                if not node:
                    return float('-inf')
                return max(node.val, subtree_max(node.left), subtree_max(node.right))

            def subtree_min(node):
                if not node:
                    return float('inf')
                return min(node.val, subtree_min(node.left), subtree_min(node.right))

            def check(node):
                if not node:
                    return True
                if subtree_max(node.left) >= node.val or subtree_min(node.right) <= node.val:
                    return False
                return check(node.left) and check(node.right)

            return check(root)

pitch_script: |
  **(Clarify)** "So a BST here means strictly smaller on the whole left subtree and strictly
  greater on the whole right subtree, so duplicates make it invalid. Values can be the full
  32-bit range."

  **(Brute force)** "Checking just each node against its children is wrong: in 5, 4, 6, null,
  null, 3, 7 every parent-child pair is fine but 3 is in 5's right subtree. A correct brute
  force compares each node with every value in its subtrees, which is O(N times H)."

  **(Trigger)** "The constraint on a node comes from all of its ancestors, so I need to pass
  information down. Each ancestor either caps or floors the allowed values, so the whole
  history fits in a range: a low and a high bound."

  **(Optimal)** "I write valid(node, low, high). An empty node is valid. Otherwise the node's
  value must be strictly between low and high. Then the left child gets low and node.val, and
  the right child gets node.val and high. I start with minus and plus infinity, not int limits,
  because the values can be exactly minus two to the 31."

  **(Complexity)** "Each node is visited once, so O(N) time, and O(H) recursion stack. An
  alternative is an in-order traversal checking the values are strictly increasing, with the
  same complexity."

twist:
  lc: 230
  title: Kth Smallest Element in a BST
  why: >-
    You're now given a valid BST and asked for the k-th smallest value. The in-order view from
    this problem's alternative becomes the main tool: in-order visits a BST's values in sorted
    order, so walk in-order (an explicit stack is easiest to stop early), count the nodes as
    they are visited, and return the k-th. Instead of checking prev < node.val, you count. It
    costs O(H + k) rather than O(N), since you stop as soon as you reach k.

viz:
  watch: [low, high]
