slug: remove-nth-node-from-end-of-list
lc: 19

concept:
  problem_it_solves: >-
    "How do I find a position counted from the end when I can only walk forwards?" A singly
    linked list has no length and no backward links, so "n from the end" seems to need the
    length first. Two pointers kept a fixed distance apart carry that information for you:
    when the front one reaches the end, the back one is exactly n nodes behind it.
  brute_force: >-
    Walk the whole list once to count its length L, then walk again L − n steps to reach the
    node before the target and unlink it. It is linear, but it reads the list twice, and the
    follow-up asks for a single pass. Copying all nodes into an array to index L − n gives one
    pass but costs O(L) memory.
  brute_force_complexity: >-
    O(L) time in two passes (up to 2L steps), O(1) space — or one pass with O(L) extra space
    for an array of nodes.
  key_insight: >-
    Move `fast` n nodes ahead first, then move `fast` and `slow` together. The gap between them
    never changes, so when fast stands on the last node, slow is n nodes behind it: right before
    the node to delete. Start both at a dummy node placed in front of the head. Then "the node
    before the target" always exists, even when the target is the head itself (n = L), and
    `slow.next = slow.next.next` works in every case.
  real_world: >-
    Keeping a reader a fixed distance behind a writer is the idea behind lag-based windows on
    streams: `tail -n` on a pipe only ever holds the last n lines, Kafka consumer lag is the
    gap between the latest offset and a consumer's offset, and replication followers trail a
    leader's log. Dummy (sentinel) nodes are used throughout real linked-list code, such as the
    Linux kernel's `list_head`, precisely so that inserting or removing at the front needs no
    special case.

statement:
  clean: |
    Given the `head` of a linked list, remove the **nth node from the end** of the list and
    return its head.

    **Follow up:** Could you do this in **one pass**?
  oa_story: |
    **ChaiChain — OA Round 1**

    ChaiChain runs a chain of tea kiosks across Bengaluru tech parks, and every kiosk prints
    order tokens onto a live chain: each token record holds the token number and a reference
    to the token printed after it. Nobody stores how many tokens are on the chain. When a
    customer at the Manyata Tech Park kiosk cancels, the cashier only knows "I'm the nth most
    recent order", where n = 1 means the latest token.

    Given the first token on the chain and `n`, remove that token from the chain and return the
    first token of the updated chain (which may be a different token, or nothing at all, if the
    oldest order or the only order was cancelled). The kiosk's printer stream can only be read
    once, so the fix must be done in a single walk. A chain holds at most 30 tokens, and `n`
    is always valid.
  trigger_keywords: ["nth node from the end", "one pass"]
  examples:
    - input: "head = [1,2,3,4,5], n = 2"
      output: "[1,2,3,5]"
      explanation: "The 2nd node from the end is 4, so 3 now points straight to 5."
    - input: "head = [1], n = 1"
      output: "[]"
      explanation: "Removing the only node leaves an empty list."
    - input: "head = [1,2], n = 1"
      output: "[1]"
  constraints:
    - "The number of nodes in the list is sz."
    - "1 <= sz <= 30"
    - "0 <= Node.val <= 100"
    - "1 <= n <= sz"

constraint_quiz:
  prompt: >-
    The list is tiny (at most 30 nodes), but the follow-up asks for one pass. What should you
    aim for?
  options:
    - "O(L²) time — for each node, count how many nodes follow it"
    - "O(L) time, two passes, O(1) space — count, then walk to L − n"
    - "O(L) time, one pass, O(1) space — two pointers n apart"
    - "O(n) time — walk only n nodes from the head"
  answer: 2
  explanation: >-
    With 30 nodes every option is fast enough, so the follow-up is the real requirement.
    Counting the suffix length for every node repeats work quadratically. Counting first and
    then walking is linear and correct, but it is two passes. Walking only n nodes is
    impossible: n says nothing about where the end is, so you must reach the end at least
    once. Two pointers with a gap of n reach the end once and find the target in the same walk.

pattern_quiz:
  prompt: >-
    You must delete the node n positions from the end of a singly linked list in one pass, and
    the node to delete may be the head. Which pattern fits?
  options:
    - "Reverse the list, delete the nth node from the front, reverse back"
    - "Fast and slow pointers where fast moves twice as fast"
    - "Dummy head plus two pointers kept n nodes apart"
    - "Hash map from index to node"
  answer: 2
  explanation: >-
    "nth from end" is the fixed-gap trigger: the distance between the pointers, not their speed,
    carries the information, so 2x-speed pointers (which find middles and cycles) don't apply.
    "May delete the head" is the dummy-node trigger. Reversing twice works but costs three
    passes, and an index map spends O(L) memory to imitate an array.

