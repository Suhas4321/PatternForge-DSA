slug: palindrome-partitioning
lc: 131

concept:
  problem_it_solves: >-
    "In how many ways can I cut this sequence into pieces where every piece passes a test, and
    what are they?" Every cut position is a yes/no decision, so the answers live in a tree of
    choices. Partition backtracking walks that tree one piece at a time and abandons a branch
    the moment a piece fails the test, instead of building whole cuttings and checking them
    afterwards.
  brute_force: >-
    A string of length N has N − 1 gaps, and each gap is either cut or not, so there are
    2^(N−1) cuttings. Generate every one, then check whether all its pieces are palindromes.
    Most of that work is wasted: if the first piece "ab" isn't a palindrome, every one of the
    2^(N−3) cuttings that start with "ab" is still generated and rejected one by one.
  brute_force_complexity: >-
    O(N · 2^N) time, O(N) space besides the output — N = 16 means 32,768 cuttings, each
    checked in O(N), and nearly all of the rejected ones are pure waste.
  key_insight: >-
    Don't decide cuts, decide pieces. Standing at index start, the only question is "where
    does the next piece end?". Try every end from start to N − 1; if s[start..end] is a
    palindrome, choose it, recurse from end + 1, then un-choose. When start reaches N, the
    pieces in path cover the whole string, so path is a complete answer. A failing piece kills
    its entire subtree at once, which is exactly the pruning the brute force lacks. The
    palindrome checks can be made O(1) with a precomputed table pal[i][j] =
    (s[i] == s[j] and (j − i < 2 or pal[i + 1][j − 1])).
  real_world: >-
    Word segmentation in search engines and Indian-language keyboards (splitting
    "bengalurutraffic" into dictionary words) is the same "where does the next piece end?"
    backtracking, with "is a dictionary word" instead of "is a palindrome". Tokenisers for NLP
    models and parsers that split a stream into valid tokens explore the same choice tree,
    usually memoised.

statement:
  clean: |
    Given a string `s`, **partition** `s` such that
    **every substring of the partition is a palindrome**. Return **all possible** palindrome
    partitionings of `s`.

    A palindrome reads the same forward and backward. A partition splits `s` into contiguous,
    non-empty substrings that, read in order, give back `s`. Return the partitions in any
    order; the substrings inside each partition must stay in their original order.
  oa_story: |
    **PalindromePost — OA Round 1**

    PalindromePost is a Bengaluru social app famous for its "mirror stickers": a caption is
    chopped into consecutive chunks and each chunk becomes a sticker that looks identical
    when you flip it left to right, letter for letter. A user in Indiranagar types a
    lowercase caption `s`, and the sticker designer wants to show every way the whole caption
    can be chopped so that every single chunk is a mirror chunk.

    Chunks must be non-empty, must not overlap, and must cover the caption from start to end
    in order (a sticker set is read left to right, so the order of chunks inside one set
    matters). Return every valid sticker set; the sets themselves can be listed in any order.
    Captions are at most 16 characters long.
  trigger_keywords: ["partition", "every substring of the partition is a palindrome", "all possible"]
  examples:
    - input: "s = \"aab\""
      output: "[[\"a\",\"a\",\"b\"],[\"aa\",\"b\"]]"
      explanation: "\"aab\" itself is not a palindrome, and neither is \"ab\", so only these two cuttings work."
    - input: "s = \"a\""
      output: "[[\"a\"]]"
  constraints:
    - "1 <= s.length <= 16"
    - "s contains only lowercase English letters."

constraint_quiz:
  prompt: >-
    s has at most 16 characters and you must return every palindrome partition. What
    complexity is acceptable?
  options:
    - "O(N) — one pass is enough"
    - "O(N²) — it's a palindrome DP problem"
    - "O(N · 2^N) — exponential, because the output itself can be that big"
    - "O(N!) — try every ordering of the characters"
  answer: 2
  explanation: >-
    For "aaaa...a" every one of the 2^(N−1) cuttings is valid, so just writing the output
    takes O(N · 2^N); no O(N) or O(N²) algorithm can list it (an O(N²) DP can only *count* or
    find the minimum cut). N ≤ 16 is the tell that exponential is fine: 16 · 2^16 ≈ 10^6.
    O(N!) is both wrong (pieces keep their order, nothing is permuted) and far too large:
    16! ≈ 2 × 10^13.

pattern_quiz:
  prompt: >-
    You must return all ways to split a string into contiguous pieces where each piece
    satisfies a check. Which pattern fits?
  options:
    - "Sliding window that grows while the window is a palindrome"
    - "Expand around centre to find the longest palindrome"
    - "Partition backtracking: choose where the next piece ends, recurse on the rest"
    - "Subsets backtracking: include or exclude each character"
  answer: 2
  explanation: >-
    "Partition … all possible" is the partition-backtracking trigger: each recursion level
    picks the end of the next piece and continues from the following index. A sliding window
    or expand-around-centre finds one best palindrome, not every complete cutting.
    Include/exclude on characters would produce subsequences, which break contiguity; the
    pieces must stay contiguous and cover the whole string.

