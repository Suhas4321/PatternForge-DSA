drills:
  - title: GroupBy count aggregation
    skill: setup
    goal: Count rows per group.
    instructions: |
      Group `records` by `team` and return total count per team.
    function:
      name: count_per_team
      params: [{name: records}]
    starter_code: |
      class Solution:
          def count_per_team(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"team": "Blue"}, {"team": "Blue"}, {"team": "Red"}]], expected: [{"team": "Blue", "count": 2}, {"team": "Red", "count": 1}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def count_per_team(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              grouped = df.groupby("team").size().reset_index(name="count")
              return grouped.to_dict(orient="records")
    hint: "Use `df.groupby('team').size().reset_index(name='count')`."

  - title: GroupBy mean calculation
    skill: core
    goal: Compute group average.
    instructions: |
      Compute mean of `score` per `dept`, rounded to 1 decimal place.
    function:
      name: avg_score_per_dept
      params: [{name: records}]
    starter_code: |
      class Solution:
          def avg_score_per_dept(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"dept": "Eng", "score": 80.0}, {"dept": "Eng", "score": 90.0}]], expected: [{"dept": "Eng", "avg": 85.0}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def avg_score_per_dept(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              grouped = df.groupby("dept")["score"].mean().round(1).reset_index(name="avg")
              return grouped.to_dict(orient="records")
    hint: "Use `df.groupby('dept')['score'].mean().round(1).reset_index(name='avg')`."

  - title: Two-tier sort_values
    skill: edge
    goal: Sort by two columns in different directions.
    instructions: |
      Sort by `score` descending, then `id` ascending.
    function:
      name: sort_two_tier
      params: [{name: records}]
    starter_code: |
      class Solution:
          def sort_two_tier(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"id": 2, "score": 90}, {"id": 1, "score": 90}, {"id": 3, "score": 95}]], expected: [{"id": 3, "score": 95}, {"id": 1, "score": 90}, {"id": 2, "score": 90}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def sort_two_tier(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              sorted_df = df.sort_values(by=["score", "id"], ascending=[False, True])
              return sorted_df.to_dict(orient="records")
    hint: "Use `df.sort_values(by=['score', 'id'], ascending=[False, True])`."

hints:
  - "If `records` is empty, return `[]`."
  - "Add a helper column `success_int = df['success'].astype(int) * 100`."
  - "Group by `model` and call `.agg(run_count=('latency_ms', 'count'), avg_latency=('latency_ms', 'mean'), success_rate=('success_int', 'mean'))`."

solution:
  code: |
    import pandas as pd

    class Solution:
        def compute_model_leaderboard(self, records: list[dict]) -> list[dict]:
            if not records:
                return []
            df = pd.DataFrame(records)

            df["success_val"] = df["success"].astype(int) * 100.0

            grouped = df.groupby("model").agg(
                run_count=("latency_ms", "count"),
                avg_latency=("latency_ms", "mean"),
                success_rate=("success_val", "mean"),
            ).reset_index()

            grouped["run_count"] = grouped["run_count"].astype(int)
            grouped["avg_latency"] = grouped["avg_latency"].round(1)
            grouped["success_rate"] = grouped["success_rate"].round(1)

            # Sort: primary success_rate DESC, secondary avg_latency ASC
            sorted_df = grouped.sort_values(
                by=["success_rate", "avg_latency"],
                ascending=[False, True]
            )

            return sorted_df.to_dict(orient="records")
  explanation: |
    We convert the `success` boolean series to float percentages (`0.0` or `100.0`).
    Using named aggregation inside `.groupby('model').agg(...)` calculates the sample count,
    mean latency, and success percentage in a single vectorized pass.
    
    Rounding normalizes decimal precision, and `sort_values` organizes models by highest reliability
    and lowest latency.
  time: O(N log K) where N is records and K is distinct models
  space: O(N) for DataFrame structures

pitch_script: |
  **(Clarify)** "We need to aggregate raw execution logs by model, computing total test count, average latency, and percentage success rate, sorted by reliability descending and latency ascending."

  **(Basement Insight)** "Pandas `.groupby().agg()` implements the Split-Apply-Combine pattern in compiled C code. Computing named aggregations simultaneously avoids multiple scans over the dataset and yields a compact summary table."

  **(Solution)** "We build a DataFrame, multiply the boolean `success` mask by 100, and group by `model`. Using named aggregation, we calculate `count` and `mean` metrics. We round the results and sort with `ascending=[False, True]`."

  **(Complexity)** "Runs in O(N + K log K) time where N is records and K is unique models, with O(N) space."

