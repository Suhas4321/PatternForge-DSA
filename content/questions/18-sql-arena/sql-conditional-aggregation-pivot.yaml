          - ["Galaxy S23", 3]
          - ["Pixel 8", 3]
    solution: |
      SELECT device, COUNT(*) AS total FROM TestRuns GROUP BY device ORDER BY device;
    hint: "Use `GROUP BY device`."

  - title: Conditional case when pass count
    skill: core
    goal: Count only PASS statuses using CASE WHEN.
    instructions: |
      Select `device, SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count FROM TestRuns GROUP BY device ORDER BY device;`.
    function:
      name: execute_sql
      params: []
    starter_code: |
      SELECT device, SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count
      FROM TestRuns
      GROUP BY device
      ORDER BY device;
    tests:
      - args: []
        expected:
          - ["Galaxy S23", 1]
          - ["Pixel 8", 2]
    solution: |
      SELECT device, SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count
      FROM TestRuns
      GROUP BY device
      ORDER BY device;
    hint: "Use `SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END)`."

  - title: Full three-column pivot
    skill: edge
    goal: Aggregate pass, fail, and timeout simultaneously.
    instructions: |
      Add `fail_count` and `timeout_count` columns to the query.
    function:
      name: execute_sql
      params: []
    starter_code: |
      SELECT
        device,
        SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count,
        SUM(CASE WHEN status = 'FAIL' THEN 1 ELSE 0 END) AS fail_count,
        SUM(CASE WHEN status = 'TIMEOUT' THEN 1 ELSE 0 END) AS timeout_count
      FROM TestRuns
      GROUP BY device
      ORDER BY device ASC;
    tests:
      - args: []
        expected:
          - ["Galaxy S23", 1, 1, 1]
          - ["Pixel 8", 2, 1, 0]
    solution: |
      SELECT
        device,
        SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count,
        SUM(CASE WHEN status = 'FAIL' THEN 1 ELSE 0 END) AS fail_count,
        SUM(CASE WHEN status = 'TIMEOUT' THEN 1 ELSE 0 END) AS timeout_count
      FROM TestRuns
      GROUP BY device
      ORDER BY device ASC;
    hint: "Combine three SUM(CASE ...) clauses in the SELECT statement."

hints:
  - "Group by `device`."
