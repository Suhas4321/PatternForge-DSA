hints:
- Handle empty tasks list first.
- Use `heapq` with tuples `(current_time, task_count, core_id)` initialized to 0 for all cores.
- '| # Pseudocode Blueprint

  | if not tasks: return 0, 0, 1.0, False

  | single_time = sum(durations) + (N - 1) * switch_ms

  | pq = [(0, 0, core_id) for core_id in range(cores)]

  | for task in tasks:

  |     t, count, cid = heappop(pq)

  |     new_t = t + (switch_ms if count > 0 else 0) + task.duration

  |     heappush(pq, (new_t, count + 1, cid))

  | multi_time = max(item[0] for item in pq)

  | return single_time, multi_time, speedup'
solution:
  code: "import heapq\n\nclass Solution:\n    def model_execution_time(self, tasks: list[dict], cores: int, context_switch_ms:\
    \ int) -> dict:\n        if not tasks:\n            return {\n                \"single_core_time_ms\": 0,\n          \
    \      \"multi_core_time_ms\": 0,\n                \"speedup\": 1.0,\n                \"is_parallel_faster\": False,\n\
    \            }\n\n        total_duration = sum(t[\"duration_ms\"] for t in tasks)\n        single_core_time = total_duration\
    \ + (len(tasks) - 1) * context_switch_ms\n\n        pq = [(0, 0, i) for i in range(cores)]\n        for t in tasks:\n\
    \            curr_t, count, core_id = heapq.heappop(pq)\n            extra_switch = context_switch_ms if count > 0 else\
    \ 0\n            new_t = curr_t + extra_switch + t[\"duration_ms\"]\n            heapq.heappush(pq, (new_t, count + 1,\
    \ core_id))\n\n        multi_core_time = max(item[0] for item in pq)\n        speedup = round(single_core_time / multi_core_time,\
    \ 2) if multi_core_time > 0 else 1.0\n\n        return {\n            \"single_core_time_ms\": single_core_time,\n   \
    \         \"multi_core_time_ms\": multi_core_time,\n            \"speedup\": speedup,\n            \"is_parallel_faster\"\
    : multi_core_time < single_core_time,\n        }\n"
  explanation: On a single core, all tasks are serialized and suffer context-switch latency between every switch. On multiple
    cores, tasks are dispatched greedily to the earliest available core using a min-heap, enabling genuine parallel execution
    and reducing wall-clock runtime.
  time: O(N log C) where N is task count and C is number of cores
  space: O(C) for the min-heap priority queue
pitch_script: '**(Clarify)** "We need to model the wall-clock execution time of a task list on 1 core versus N cores, incorporating
  context switch penalties."


  **(Brute force)** "Assuming an ideal linear speedup (T_single / N) ignores task imbalances and scheduling overheads."


  **(Trigger)** "Distributing tasks across multiple worker cores signals a greedy min-heap priority queue scheduler."


  **(Optimal)** "Single core execution is the sum of task durations plus context switches. For multi-core scheduling, a min-heap
  tracks the earliest free core, assigning the next task and adding context-switch overhead only if that core already ran
  a task. The final time is the maximum core completion time."


  **(Complexity)** "Takes O(N log C) time and O(C) space for C cores." '
twist:
  lc: 9406
  title: Thread vs Process Context Switch Overhead Model
  why: Context switching between threads shares address space, while switching between processes requires expensive TLB and
    page-table flushes.
