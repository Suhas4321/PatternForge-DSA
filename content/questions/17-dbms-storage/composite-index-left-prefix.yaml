slug: composite-index-left-prefix
lc: 9303
citadel_id: sql_dbms
brick_layer: 3
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does my query do a Full Table Scan even though an index exists on the columns in my WHERE clause?"
    If you create a composite index on `(dept_id, salary, hire_date)`, the database sorts rows primarily by `dept_id`,
    secondarily by `salary`, and tertiarily by `hire_date`.
    If your query executes `WHERE salary > 90000`, the index is completely useless!
    This is identical to trying to find all people named 'Alice' in a phone book sorted by Last Name:
    without the Last Name (the leftmost prefix), you must scan every single page.
  brute_force: >-
    Adding composite indexes randomly without considering column order, or creating redundant single-column indexes
    on every column. Redundant indexes slow down INSERT/UPDATE/DELETE operations and waste storage without accelerating queries.
  brute_force_complexity: O(1) syntax, but causes index skip scans or table scans at runtime.
  key_insight: >-
    The Leftmost Prefix Rule dictates that a composite index on `(A, B, C)` can only be used by the query optimizer
    if the WHERE clause filters on a contiguous prefix starting from the first column: `(A)`, `(A, B)`, or `(A, B, C)`.
    Queries filtering by `(B)`, `(C)`, or `(B, C)` cannot navigate the index tree from the root.
  real_world: >-
    Database index optimization across PostgreSQL, MySQL InnoDB, and CockroachDB, avoiding slow query warnings in production APIs.

statement:
  clean: |
    Implement a query planner index advisor that verifies the composite leftmost prefix rule:
    `can_use_composite_index(index_cols: list[str], where_cols: list[str]) -> bool`.
    
    Given:
    1. `index_cols`: an ordered list of column names defining a composite index (e.g. `["dept_id", "salary", "hire_date"]`).
    2. `where_cols`: an unordered list of columns present in the query's `WHERE` clause (e.g. `["salary", "dept_id"]`).
    
    Rules for composite index usage:
    1. If `index_cols` or `where_cols` is empty, return `False`.
    2. The first column of the composite index (`index_cols[0]`) **must** be present in `where_cols`.
       If `index_cols[0]` is missing, the query engine cannot enter the B-Tree root, so return `False`.
    3. The query can use the index if `where_cols` contains a contiguous prefix of `index_cols` starting at position 0.
       For instance, for `["A", "B", "C"]`:
       - `["A"]` -> `True`
       - `["A", "B"]` -> `True`
       - `["A", "B", "C"]` -> `True`
       - `["A", "C"]` -> `True` (uses column A of the index, even though C cannot be used for index filtering)
       - `["B"]` or `["B", "C"]` -> `False` (fails the leftmost prefix rule)
  oa_story: |
    **DynamoDB to PostgreSQL Migration — Index Tuning**
    
    After migrating our test execution tables from DynamoDB to PostgreSQL, we created a composite index
    on `(tenant_id, status, created_at)`.
    A junior engineer reported that an analytics query filtering only by `status = 'FAIL'` was running in 4 seconds
    instead of 5 milliseconds.
    `EXPLAIN ANALYZE` revealed a Sequential Table Scan because the query omitted `tenant_id`, violating the Leftmost Prefix Rule.
    
    Build this query planner advisor to validate whether a query's WHERE clause qualifies to use a composite index.
  trigger_keywords: ["composite leftmost prefix", "can_use_composite_index", "index_cols"]
  examples:
    - input: "index_cols = ['dept_id', 'salary'], where_cols = ['dept_id']"
      output: "True"
      explanation: "dept_id is index_cols[0], satisfying the leftmost prefix rule."
    - input: "index_cols = ['dept_id', 'salary'], where_cols = ['salary']"
      output: "False"
      explanation: "Omitting dept_id prevents using the index; requires full table scan."
  constraints:
    - "index_cols contains between 0 and 10 column names"
    - "where_cols contains between 0 and 10 column names"

constraint_quiz:
  prompt: >-
    Why can't an index on `(last_name, first_name)` be used to look up `WHERE first_name = 'Alice'`?
  options:
    - "Because first_name values are not stored in the index"
    - "Because entries are sorted primarily by last_name; 'Alice' can be scattered across every page of the tree"
    - "Because SQL does not allow string indexes"
    - "Because first_name is shorter than last_name"
  answer: 1
  explanation: >-
    Without the primary sort key (last_name), the engine cannot prune branches of the B-Tree and must scan all entries.

pattern_quiz:
  prompt: What is the Leftmost Prefix Rule in relational database indexing?
  options:
    - "A query must always filter columns from left to right in the SELECT statement"
    - "A composite index can only be leveraged if the query filters include the leading columns of the index definition"
    - "Indexes must always be named starting with the letter A"
    - "Only the leftmost table in a JOIN can have an index"
  answer: 1
  explanation: >-
    A composite B-Tree index on (A, B, C) can only be entered if the query filters on column A.

