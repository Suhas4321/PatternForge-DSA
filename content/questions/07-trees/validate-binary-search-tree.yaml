slug: validate-binary-search-tree
lc: 98

concept:
  problem_it_solves: >-
    "Is every node inside the range its ancestors allow?" The BST rule is not about a node and
    its children; it's about a node and *every* node in its subtrees. Each ancestor you pass on
    the way down adds a constraint: going left through 5 means "everything here must be < 5",
    going right through 3 means "everything here must be > 3". Validation means carrying those
    constraints down and checking each node against them.
  brute_force: >-
    For every node, scan its whole left subtree for the maximum and its whole right subtree for
    the minimum, and check max(left) < node.val < min(right). It's correct, but each node
    re-reads its entire subtree, so nodes near the bottom are read once for every ancestor
    they have. The tempting shortcut, checking only node.left.val < node.val < node.right.val,
    is fast but wrong.
  brute_force_complexity: >-
    O(N · H) time, O(H) space — on a 10⁴-node chain that's about 5 × 10⁷ node reads.
  key_insight: >-
    Every node lives inside an open interval (low, high) determined by its ancestors. The root
    may be anything: (−∞, +∞). Going left from a node with value v keeps the lower bound and
    tightens the upper bound to v; going right keeps the upper bound and raises the lower bound
    to v. So pass (low, high) down the recursion and check low < node.val < high at every node.
    One visit per node, and the ancestors' constraints arrive automatically.
  real_world: >-
    Database engines verify index integrity this way: PostgreSQL's amcheck extension
    (bt_index_parent_check) walks a B-tree index and checks that the keys on every child page
    fall within the bounds implied by the parent page that points to it. Range-sharded
    key-value stores run the same "is this key inside the range my ancestors assigned?" check
    when validating shard metadata.

statement:
  clean: |
    Given the `root` of a binary tree, determine if it is a **valid binary search tree** (BST).

    A valid BST is defined as follows:

    - The **left subtree** of a node contains only nodes with keys **strictly less than** the
      node's key.
    - The right subtree of a node contains only nodes with keys strictly greater than the
      node's key.
    - Both the left and right subtrees must also be binary search trees.

    Note that the rule applies to the **whole** subtree, not just the immediate children.
  oa_story: |
    **AuditAnchor Compliance — OA Round 1**

    AuditAnchor audits the transaction ledgers of NBFCs headquartered in Bengaluru. One client
    stores its ledger as a lookup index in which every entry has a reference number and links
    to at most two other entries: a "before" link and an "after" link. The index is supposed
    to follow one rule: every entry reachable through an entry's before link, however many
    hops away, must have a strictly smaller reference number, and every entry reachable
    through its after link must have a strictly larger one. Every entry must satisfy this, not
    just the top one.

    A recent migration may have broken the index, and the RBI auditors want a yes/no answer
    before signing off. Given the top entry, return `True` if the whole index follows the rule
    and `False` otherwise. Duplicated reference numbers count as a violation. Reference
    numbers span the full signed 32-bit range, and an index can hold up to 10,000 entries.
  trigger_keywords: ["valid binary search tree", "left subtree", "strictly less than"]
  examples:
    - input: "root = [2,1,3]"
      output: "true"
    - input: "root = [5,1,4,null,null,3,6]"
      output: "false"
      explanation: "The root is 5 but its right child is 4, which is smaller."
    - input: "root = [5,4,6,null,null,3,7]"
      output: "false"
      explanation: "Every parent-child pair looks fine, but 3 is in the right subtree of 5, so it must be greater than 5."
  constraints:
    - "The number of nodes in the tree is in the range [1, 10^4]"
    - "-2^31 <= Node.val <= 2^31 - 1"

constraint_quiz:
  prompt: >-
    The tree has up to 10⁴ nodes and may be a long chain. What time complexity should you aim
    for?
  options:
    - "O(N · H) — compare each node with its whole subtrees"
    - "O(N log N) — collect the values and sort them"
    - "O(N) — visit each node once with the bounds it must satisfy"
    - "O(H) — check one root-to-leaf path"
  answer: 2
  explanation: >-
    Comparing every node with its subtrees is O(N · H), O(N²) on a chain. Sorting the values
    and comparing them with an in-order list is correct but O(N log N), and the in-order list
    alone already tells you the answer without sorting. One bad node can hide anywhere, so a
    single path can't be enough. Passing bounds down checks every node exactly once: O(N).

pattern_quiz:
  prompt: >-
    Whether a node is valid depends on the values of all its ancestors, not just its parent.
    Which approach fits?
  options:
    - "Check node.left.val < node.val < node.right.val at every node"
    - "DFS passing an allowed (low, high) range down to each node"
    - "BFS comparing each level's values with the level above"
    - "Return each subtree's height and compare left and right"
  answer: 1
  explanation: >-
    The parent-child check misses violations like [5,4,6,null,null,3,7], where 3 is fine next
    to its parent 6 but breaks the rule set by its grandparent 5. Ancestor constraints have to
    travel down, and a pair of bounds summarises all of them. Levels mix nodes from different
    subtrees with different constraints, and heights say nothing about ordering.

