slug: pdf-text-semantic-chunker
lc: 9223
citadel_id: python_data
brick_layer: 3
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does feeding raw extracted PDF text into vector databases produce terrible retrieval search results?"
    PDF extractors return broken words split across line breaks (e.g. `multi-\npage` becomes `multi-` and `page`),
    meaning search queries for `multipage` fail to match. Additionally, fixed-token chunking without overlap splits
    critical context in half right in the middle of sentences.
  brute_force: >-
    Splitting raw text with `text.split('.')` or arbitrary character slicing `text[i:i+500]`.
    This cuts words in half, leaves hyphenated word fragments unmerged, and loses semantic continuity across chunk borders.
  brute_force_complexity: O(N) operations, but severely degrades embedding quality and RAG recall.
  key_insight: >-
    A production RAG ingestion pipeline cleans OCR/PDF artifacts first by regex-merging hyphenated word breaks
    (`re.sub(r'(\w+)-\s*\n\s*(\w+)', r'\1\2', text)`). Then it tokenizes into words and applies a sliding window
    with `step = chunk_size - overlap`, ensuring adjacent chunks share enough context so semantic boundaries aren't lost.
  real_world: >-
    WisdomBot enterprise PDF ingestion, LangChain/LlamaIndex RecursiveCharacterTextSplitter, and ChromaDB vector indexing.

statement:
  clean: |
    Implement a RAG document preprocessor using pdf semantic chunking:
    `chunk_document(raw_text: str, chunk_size: int, overlap: int) -> list[dict]`.
    
    Given raw extracted document text:
    1. **Clean Hyphenation**: Detect words split across line breaks by a hyphen (e.g. `"multi-\npage"` or `"trans-\n action"`)
       and merge them into a single word (e.g. `"multipage"`, `"transaction"`).
    2. **Normalize Whitespace**: Replace all remaining newline characters and multiple whitespace sequences with a single space.
    3. **Tokenize**: Split the cleaned text into words (tokens) by whitespace.
    4. **Sliding Window Chunking**:
       - Slide a window of size `chunk_size` over the tokens.
       - The step size between consecutive chunk start positions is `chunk_size - overlap`.
       - If `len(tokens) <= chunk_size`, produce a single chunk containing all tokens.
       - For each chunk, construct:
         `{"chunk_id": int, "text": " ".join(tokens), "token_count": len(tokens)}`.
       - `chunk_id` starts at 0 and increments by 1.
    5. Return the list of chunk dictionaries. If `raw_text` contains no words after cleaning, return `[]`.
  oa_story: |
    **WisdomBot Knowledge Base — PDF RAG Ingestion Engine**
    
    In our enterprise PDF document QA system, vector similarity search was failing on technical queries
    because standard PyPDF extraction left hyphenated line breaks (`"concur-\n rency"`), which embedding
    models failed to map to the term `"concurrency"`.
    
    Build a resilient preprocessor that de-hyphenates broken tokens and chunks the document into overlapping
    semantic slices for embedding ingestion.
  trigger_keywords: ["pdf semantic chunking", "chunk_document", "raw_text"]
  examples:
    - input: "raw_text = 'The algo-\nrithm runs in linear time.', chunk_size = 3, overlap = 1"
      output: "[{'chunk_id': 0, 'text': 'The algorithm runs', 'token_count': 3}, {'chunk_id': 1, 'text': 'runs in linear', 'token_count': 3}, {'chunk_id': 2, 'text': 'linear time.', 'token_count': 2}]"
      explanation: "De-hyphenates 'algorithm', then slides window of size 3 with step 2 (3 - 1)."
    - input: "raw_text = 'Short document', chunk_size = 5, overlap = 1"
      output: "[{'chunk_id': 0, 'text': 'Short document', 'token_count': 2}]"
      explanation: "Total tokens (2) <= chunk_size (5), so only one chunk is generated."
  constraints:
    - "chunk_size >= 1"
    - "0 <= overlap < chunk_size"

constraint_quiz:
  prompt: >-
    Why is token overlap used when chunking documents for Vector DB embeddings?
  options:
    - "To compress file sizes on disk"
    - "To ensure context spanning across chunk boundaries is not lost during semantic search"
    - "To speed up embedding model inference"
    - "To reduce token costs"
  answer: 1
  explanation: >-
    Overlap ensures that sentences crossing a chunk boundary are represented in at least one chunk with their surrounding context intact.

pattern_quiz:
  prompt: What regular expression substitution merges hyphenated words across line breaks?
  options:
    - 're.sub(r"(\w+)-\s*\n\s*(\w+)", r"\1\2", text)'
    - 're.sub(r"-", " ", text)'
    - 're.sub(r"\n", "", text)'
    - 're.split(r" ", text)'
  answer: 0
  explanation: >-
    Matching word characters on both sides of a hyphen and newline allows merging the fragments into a single unbroken word.

