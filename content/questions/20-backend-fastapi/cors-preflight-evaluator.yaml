slug: cors-preflight-evaluator
lc: 9506
citadel_id: backend_apis
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: Why does a browser block web applications from querying APIs on another domain until a special OPTIONS
    request succeeds? Cross-Origin Resource Sharing (CORS) protects users from malicious sites reading private intranet or
    API data. For non-simple requests (custom headers like `Authorization` or methods like `PUT`/`DELETE`), browsers send
    an HTTP `OPTIONS` preflight request. The server must explicitly declare allowed origins, methods, and headers.
  brute_force: 'Blindly setting `Access-Control-Allow-Origin: *` on production authenticated APIs, exposing cookies and sensitive
    data to CSRF attacks.'
  brute_force_complexity: Severe browser security vulnerability.
  key_insight: Evaluating the Origin, Method, and non-simple Headers against strict server policies returns HTTP 204 No Content
    with `Access-Control-*` headers or appropriate 4xx rejections.
  real_world: FastAPI `CORSMiddleware`, AWS API Gateway CORS policies, and Cloudflare egress security headers.
statement:
  clean: "Implement a CORS preflight options decision engine for cross-origin browser security:\n`evaluate_cors_preflight(origin:\
    \ str, method: str, headers: list[str], allowed_origins: list[str], allowed_methods: list[str], allowed_headers: list[str])\
    \ -> dict`.\n\nInputs:\n- `origin`: client request `Origin` header (e.g. `\"https://app.payloop.in\"`).\n- `method`: requested\
    \ `Access-Control-Request-Method` (e.g. `\"POST\"`).\n- `headers`: list of requested `Access-Control-Request-Headers`\
    \ (e.g. `[\"Authorization\", \"Content-Type\"]`).\n- `allowed_origins`, `allowed_methods`, `allowed_headers`: server whitelist\
    \ policies.\n\nRules:\n1. Origin Validation:\n   - If `origin not in allowed_origins` and `\"*\"` not in `allowed_origins`:\n\
    \     return `{\"allowed\": False, \"status_code\": 403, \"headers\": {}}`.\n2. Method Validation:\n   - If `method.upper()`\
    \ not in `[m.upper() for m in allowed_methods]`:\n     return `{\"allowed\": False, \"status_code\": 405, \"headers\"\
    : {}}`.\n3. Header Validation:\n   - Case-insensitive check: all requested `headers` must be in `allowed_headers` OR belong\
    \ to standard simple headers (`\"content-type\"`, `\"accept\"`, `\"origin\"`).\n   - If any requested header is disallowed:\n\
    \     return `{\"allowed\": False, \"status_code\": 400, \"headers\": {}}`.\n4. Success (CORS Preflight Approved):\n \
    \  - Return HTTP 204 No Content with response headers:\n     - `\"Access-Control-Allow-Origin\"`: `origin` (or `\"*\"\
    ` if wildcard allowed)\n     - `\"Access-Control-Allow-Methods\"`: comma-separated `allowed_methods`\n     - `\"Access-Control-Allow-Headers\"\
    `: comma-separated `allowed_headers`\n     - `\"Access-Control-Max-Age\"`: `\"86400\"`\n   - Result: `{\"allowed\": True,\
    \ \"status_code\": 204, \"headers\": resp_headers}`."
  oa_story: '**PayLoop Merchant Dashboard — CORS Preflight Failure**


    PayLoop launched a merchant analytics portal hosted on `https://portal.payloop.in` calling API backend `https://api.payloop.in`.
    In Chrome, API requests failed instantly with console errors: ''No Access-Control-Allow-Origin header is present on the
    requested resource''.


    The security team refused to open wildcards (`*`). Implement this CORS preflight engine to evaluate origins, methods,
    and headers securely, returning HTTP 204 preflight approvals.'
  trigger_keywords:
  - cors preflight options decision engine
  - evaluate_cors_preflight
  - Access-Control-Allow-Origin
  examples:
  - input: origin = "https://payloop.in", method = "POST", headers = ["Authorization", "Content-Type"], allowed_origins =
      ["https://payloop.in"], allowed_methods = ["GET", "POST", "OPTIONS"], allowed_headers = ["Authorization", "Content-Type"]
    output: '{"allowed": True, "status_code": 204, "headers": {"Access-Control-Allow-Origin": "https://payloop.in", "Access-Control-Allow-Methods":
      "GET, POST, OPTIONS", "Access-Control-Allow-Headers": "Authorization, Content-Type", "Access-Control-Max-Age": "86400"}}'
    explanation: Origin, method, and headers match allowed policies, yielding HTTP 204 preflight approval.
  - input: origin = "https://malicious-site.com", method = "POST", headers = [], allowed_origins = ["https://payloop.in"],
      allowed_methods = ["GET", "POST"], allowed_headers = []
    output: '{"allowed": False, "status_code": 403, "headers": {}}'
    explanation: Untrusted origin rejected with HTTP 403 Forbidden.
  constraints:
  - 1 <= len(allowed_origins) <= 50
  - 1 <= len(allowed_methods) <= 10
constraint_quiz:
  prompt: What HTTP status code is typically returned by servers for a successful CORS preflight OPTIONS request?
  options:
  - 204 No Content (or 200 OK)
  - 301 Moved Permanently
  - 404 Not Found
  - 503 Service Unavailable
  answer: 0
  explanation: A preflight OPTIONS request is a metadata check that requires no response body, so servers respond with HTTP
    204 No Content (or 200 OK) containing CORS headers.
pattern_quiz:
  prompt: What is the purpose of the `Access-Control-Max-Age` header in a CORS preflight response?
  options:
  - It specifies how many seconds the browser can cache the preflight result before needing to send another OPTIONS check
  - It sets the maximum lifetime of user login sessions
  - It controls database cache TTLs
  - It sets the SSL certificate validity period
  answer: 0
  explanation: '`Access-Control-Max-Age` caches the preflight decision in the browser, eliminating the round-trip latency
    of OPTIONS checks for subsequent requests within that window.'
