slug: safe-nested-json-resolver
lc: 9225
citadel_id: python_data
brick_layer: 3
runner_type: python_practical
concept:
  problem_it_solves: How do backend data ingestion pipelines extract values from deeply nested third-party JSON payloads without
    crashing on KeyError, IndexError, or TypeError? In production API payloads, intermediate objects are frequently None or
    missing (e.g. data['user']['billing']['address']['city'] raises KeyError when billing is absent). A safe path resolver
    navigates dot-delimited paths with default fallback.
  brute_force: Writing deeply nested try-except KeyError blocks around every dictionary lookup across ETL scripts.
  brute_force_complexity: Bloated boilerplate code that obscures business transformation logic.
  key_insight: Tokenizing dot-delimited path expressions and stepping iteratively through dicts and list indices safely returns
    the default value upon any navigation failure.
  real_world: Lodash _.get in JavaScript, Glom in Python, and Kafka event stream payload transformations.
statement:
  clean: "Implement safe nested JSON navigation without KeyError or IndexError:\n`safe_resolve_path(self, data: dict | list,\
    \ path: str, default: any = None) -> any`.\n\nInputs:\n- `data`: arbitrary nested dictionary or list\n- `path`: dot-delimited\
    \ path string, supporting dictionary keys and list index numbers (e.g. `'user.profile.address.city'`, `'orders.0.items.1.name'`)\n\
    - `default`: value returned if any key or index is missing or non-traversable (default `None`)\n\nNavigation Rules:\n\
    1. If `path` is empty string `''`, return `data`.\n2. Split `path` by `'.'` to extract `tokens`.\n3. Iterate through `tokens`:\n\
    \   - If current target is a `dict`:\n     - If `token` in `target`: advance `current = target[token]`.\n     - Otherwise:\
    \ return `default`.\n   - If current target is a `list`:\n     - If `token.isdigit()`:\n       `idx = int(token)`\n  \
    \     - If `0 <= idx < len(target)`: advance `current = target[idx]`.\n       - Otherwise: return `default`.\n     - Otherwise:\
    \ return `default`.\n   - If current target is neither `dict` nor `list` (e.g. `None`, `int`, `str`), and more tokens\
    \ remain:\n     return `default`.\n4. Return the resolved final value."
  oa_story: '**PayLoop Merchant Webhook — Polymorphic JSON Telemetry Extractor**


    PayLoop receives settlement webhooks from 40 different partner banks across India. Each bank formats payload trees slightly
    differently: some place terminal coordinates at `event.payload.merchant.terminal_id`, while others omit the `merchant`
    block entirely when settlements are aborted.


    Hardcoded dict lookups triggered frequent `KeyError: ''merchant''` unhandled exceptions in the ingestion worker. The platform
    team built a safe JSON path resolver to extract fields with fallback defaults. Implement this resolver.'
  trigger_keywords:
  - safe nested JSON navigation without KeyError
  - safe_resolve_path
  - tokens
  examples:
  - input: 'data = {''user'': {''profile'': {''address'': {''city'': ''Bengaluru''}}}}, path = ''user.profile.address.city'',
      default = ''N/A'''
    output: '''Bengaluru'''
    explanation: Traverses 4 nested dictionary levels to retrieve city.
  - input: 'data = {''items'': [{''id'': ''item1''}, {''id'': ''item2''}]}, path = ''items.1.id'', default = None'
    output: '''item2'''
    explanation: Traverses list index 1 and dictionary key id.
  constraints:
  - path is a string of dot-separated alphanumeric tokens
  - default can be any value
constraint_quiz:
  prompt: What should the safe path resolver return if an intermediate value in the path is None?
  options:
  - The default value, because None is neither a dict nor a list and cannot be traversed further
  - Raise an unhandled TypeError
  - Return an empty dictionary
  - Convert None into string 'null'
  answer: 0
  explanation: When an intermediate node is None, attempting key or index lookups would crash with TypeError; returning default
    provides safe defensive navigation.
pattern_quiz:
  prompt: Which common utility function in standard web libraries implements this exact safe navigation pattern?
  options:
  - Lodash _.get() in JavaScript and dict.get chained traversal in Python
  - Binary search
  - Quicksort partition
  - Dijkstra's shortest path
  answer: 0
  explanation: Lodash _.get(object, path, defaultValue) is the classic JavaScript pattern for safe deep object navigation.
