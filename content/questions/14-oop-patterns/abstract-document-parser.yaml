slug: abstract-document-parser
lc: 9212
citadel_id: python_data
brick_layer: 2
runner_type: python_practical

concept:
  problem_it_solves: >-
    "How do we guarantee that every document parser in our pipeline implements the exact same interface?"
    Without contract enforcement, one engineer writes `def extract()`, another writes `def parse()`, and a third
    returns a generator instead of a list. Abstract Base Classes (ABCs) enforce strict method signatures at instantiation time.
  brute_force: >-
    Writing ad-hoc classes and waiting until runtime in production for an `AttributeError: 'PDFParser' object has no attribute 'parse'`
    to blow up an ETL pipeline.
  brute_force_complexity: O(1) runtime, but high probability of runtime crashes due to broken class contracts.
  key_insight: >-
    Subclassing `abc.ABC` and decorating abstract methods with `@abstractmethod` prevents instantiation of any subclass
    that fails to implement required methods. This enables true polymorphism: the calling pipeline can invoke `.parse()`
    without knowing the concrete parser type.
  real_world: >-
    WisdomBot multi-modal document ingestion, LangChain document loaders (`BaseLoader`), and LlamaIndex data connectors.

statement:
  clean: |
    Implement an extensible document ingestion pipeline using an abstract base class:
    `process_corpus(documents: list[dict]) -> list[list[str]]`.
    
    Each item in `documents` is a dictionary:
    `{"type": "markdown" | "csv", "content": str}`.
    
    Requirements:
    1. Define `BaseParser(abc.ABC)` with an abstract method `@abc.abstractmethod def parse(self, raw: str) -> list[str]`.
    2. Implement concrete subclass `MarkdownParser(BaseParser)`:
       - Splits `content` by lines.
       - Returns only lines that start with `#` (after stripping leading/trailing whitespace), with whitespace trimmed.
    3. Implement concrete subclass `CSVParser(BaseParser)`:
       - Splits `content` by commas `,`.
       - Strips whitespace from each token and ignores empty tokens.
    4. In `process_corpus`:
       - Route each document to its corresponding parser subclass.
       - If a document's `type` is neither `"markdown"` nor `"csv"`, return `["UNSUPPORTED"]` for that document.
       - Return the list of parsed string lists.
  oa_story: |
    **WisdomBot RAG Ingestion Pipeline — Polymorphic Parser Contract**
    
    Our knowledge ingestion worker reads technical manuals in Markdown and tabular datasets in CSV.
    The data team previously had ad-hoc parsers with incompatible methods (`.get_lines()`, `.read_csv()`),
    causing recurring crashes when new document types were added.
    
    Establish an `abc.ABC` contract ensuring all parsers conform to a unified `.parse()` signature.
  trigger_keywords: ["abstract base class", "process_corpus", "documents"]
  examples:
    - input: "documents = [{'type': 'markdown', 'content': '# Title\nBody text\n## Subheading'}]"
      output: "[['# Title', '## Subheading']]"
      explanation: "MarkdownParser filters only lines starting with '#' heading markers."
    - input: "documents = [{'type': 'csv', 'content': 'alpha, beta, , gamma'}]"
      output: "[['alpha', 'beta', 'gamma']]"
      explanation: "CSVParser splits by comma, trims whitespace, and skips empty tokens."
  constraints:
    - "documents contains between 0 and 100 items"
    - "content is a string of length up to 10^4 characters"

constraint_quiz:
  prompt: >-
    What happens if you attempt to instantiate a class that inherits from `abc.ABC` without implementing all `@abstractmethod`s?
  options:
    - "It instantiates normally"
    - "Python raises TypeError: Can't instantiate abstract class with abstract methods"
    - "Python issues a warning but runs"
    - "It defaults all missing methods to return None"
  answer: 1
  explanation: >-
    Python strictly blocks instantiation of abstract classes that have unimplemented abstract methods by raising a TypeError.

