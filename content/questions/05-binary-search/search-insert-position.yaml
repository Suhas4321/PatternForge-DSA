slug: search-insert-position
lc: 35

concept:
  problem_it_solves: >-
    "Where does this value belong in a sorted list?" That is the same as asking for the
    first position whose value is at least target, which is called the lower bound. The
    yes/no question "is nums[i] >= target?" is no, no, no, then yes, yes, yes along a sorted
    array, and binary search can find the spot where it flips in O(log N).
  brute_force: >-
    Walk from the left and return the first index whose value is >= target, or len(nums)
    if you fall off the end. Like any linear scan on sorted data, it reads every "no" one at
    a time, although each one says the same thing about all the values before it.
  brute_force_complexity: O(N) time, O(1) space — 10⁴ elements means up to 10⁴ comparisons instead of 14.
  key_insight: >-
    Stop looking for target and look for the boundary. The answer is the first index where
    nums[i] >= target, and it can be any index from 0 to len(nums), so the search range is
    [0, len(nums)]. If nums[mid] < target, mid is a "no" and the answer is to its right:
    lo = mid + 1. Otherwise mid is a "yes" and might be the answer itself, so keep it:
    hi = mid. When lo == hi there is one candidate left, and it is the answer.
  real_world: >-
    Python's bisect.bisect_left and C++'s std::lower_bound are this exact function, used to
    keep lists sorted on insert. Time-series databases such as Prometheus find the first
    sample at or after a query's start timestamp this way, and RocksDB searches each SSTable's
    index block for the first entry whose key is >= the key being looked up.

statement:
  clean: |
    Given a **sorted array of distinct integers** and a target value, return the index if
    the target is found. If not, return the **index where it would be** if it were inserted
    in order.

    You must write an algorithm with O(log n) runtime complexity.
  oa_story: |
    **PustakPoint — OA Round 1**

    PustakPoint runs a second-hand bookshop chain out of Jayanagar and Malleshwaram. Each
    shelf holds books ordered by catalogue number, smallest on the left, and no two books
    share a number. When a new arrival comes in, the shelf assistant's handheld scanner tells
    them which slot to use.

    Given the catalogue numbers on a shelf, from left to right, and the catalogue number of
    the arriving book, return the slot (0-indexed) where the book already sits if a copy with
    that number is on the shelf, and otherwise the slot where it must be slid in so the shelf
    stays in order. A number larger than everything goes after the last book. Shelves can hold
    10,000 books and the scanner may only check a few of them per lookup.
  trigger_keywords: ["sorted array of distinct integers", "index where it would be", "O(log n) runtime complexity"]
  examples:
    - input: "nums = [1,3,5,6], target = 5"
      output: "2"
      explanation: "5 is found at index 2."
    - input: "nums = [1,3,5,6], target = 2"
      output: "1"
      explanation: "2 belongs between 1 and 3, at index 1."
    - input: "nums = [1,3,5,6], target = 7"
      output: "4"
      explanation: "7 is larger than everything, so it goes at the end: index len(nums) = 4."
  constraints:
    - "1 <= nums.length <= 10^4"
    - "-10^4 <= nums[i] <= 10^4"
    - "nums contains distinct values sorted in ascending order."
    - "-10^4 <= target <= 10^4"

constraint_quiz:
  prompt: >-
    N is at most 10⁴ and the statement asks for O(log n). What complexity should you aim
    for?
  options: ["O(N)", "O(log N)", "O(N log N)", "O(√N)"]
  answer: 1
  explanation: >-
    O(N) is the linear scan; it would be fast enough at 10⁴, but the statement forbids it.
    O(N log N) is the cost of sorting, which you don't need since the input is already
    sorted. O(√N) comes from jump search (skip ahead √N at a time, then scan back): it beats
    a scan but still isn't logarithmic. Halving the range each step gives O(log N), about 14
    probes.

pattern_quiz:
  prompt: >-
    You must return the index of target if present, otherwise the index where it would be
    inserted. Which framing makes the code simplest?
  options:
    - "Exact binary search that returns -1 on a miss, then special-case the miss"
    - "Lower bound: the first index i with nums[i] >= target, or len(nums) if none"
    - "Linear scan from the left until nums[i] >= target"
    - "Upper bound: the first index i with nums[i] > target"
  answer: 1
  explanation: >-
    "Found" and "insert here" are the same answer: the first index whose value is >= target,
    so one lower-bound search covers both, including len(nums) when target is the largest.
    The exact search throws away where it stopped unless you reason about the final lo
    separately. The scan is O(N). Upper bound is one too far whenever target is present: for
    [1,3,5,6] and 5 it returns 3, not 2.

