concept:
  problem_it_solves: Why do average response times hide critical production service slowdowns? In LLM inference serving, 95%
    of queries may complete in 200ms while the slowest 5% stall for 12 seconds due to queue queuing and model timeouts. Mean
    metrics completely mask this tail latency. Production telemetry analysis requires calculating the 95th percentile (P95)
    latency per model provider using Pandas relational joins and group-by quantiles.
  brute_force: Writing custom Python nested loops with sorting to manually compute quantiles across disparate relational lists.
  brute_force_complexity: High memory consumption and slow non-vectorized Python execution.
  key_insight: Combining pd.merge with groupby(['model_name', 'provider']).apply(quantile(0.95)) computes vectorized statistical
    percentiles at C-speed.
  real_world: Datadog APM metrics, Langfuse LLM observability dashboards, and Arize AI model monitoring.
statement:
  clean: "Implement Pandas relational merge and group-by percentile latency aggregation:\n`compute_model_p95_latencies(self,\
    \ requests_data: list[dict], models_data: list[dict]) -> list[dict]`.\n\nInputs:\n- `requests_data`: list of inference\
    \ request records:\n  `[{'request_id': str, 'model_id': str, 'latency_ms': float}, ...]`\n- `models_data`: list of model\
    \ metadata records:\n  `[{'model_id': str, 'model_name': str, 'provider': str}, ...]`\n\nAnalytics Workflow:\n1. If either\
    \ `requests_data` or `models_data` is empty, return `[]`.\n2. Convert records into Pandas DataFrames `req_df` and `mod_df`.\n\
    3. Perform an inner merge on `'model_id'`. If merged result is empty, return `[]`.\n4. Group by `['model_name', 'provider']`.\n\
    5. Aggregate metrics for each group:\n   - `'request_count'`: total request count (`int`)\n   - `'p95_latency'`: 95th\
    \ percentile of `latency_ms` using `quantile(0.95)`, rounded to 2 decimal places (`float`)\n   - `'mean_latency'`: average\
    \ of `latency_ms`, rounded to 2 decimal places (`float`)\n6. Sort result DataFrame:\n   - Primary: `'p95_latency'` descending\n\
    \   - Secondary (tie-breaker): `'model_name'` alphabetically ascending\n7. Return records as list of dicts:\n   `[{'model_name':\
    \ ..., 'provider': ..., 'request_count': ..., 'p95_latency': ..., 'mean_latency': ...}, ...]`."
  oa_story: '**Drizz Vision AI — Mobile Farm Inference Latency Analytics**


    Drizz runs automated mobile device test suites backed by multiple vision LLMs (Claude-Sonnet, GPT-4o, and Gemini Flash).
    During automated test bursts across 100 Android devices in Bengaluru, users reported intermittent UI assertion timeouts.


    While average latency showed 185ms, P95 tail latency exceeded 2,400ms on specific models due to GPU cold starts. The infrastructure
    engineer wrote a Pandas pipeline to merge request telemetry with model metadata and calculate P95 latencies. Implement
    this analytical pipeline.'
  trigger_keywords:
  - Pandas relational merge and group-by percentile latency aggregation
  - compute_model_p95_latencies
  - requests_data
  examples:
  - input: 'requests_data = [{''request_id'': ''r1'', ''model_id'': ''m1'', ''latency_ms'': 120.0}, {''request_id'': ''r2'',
      ''model_id'': ''m1'', ''latency_ms'': 250.0}], models_data = [{''model_id'': ''m1'', ''model_name'': ''Claude-Sonnet'',
      ''provider'': ''Anthropic''}]'
    output: '[{''model_name'': ''Claude-Sonnet'', ''provider'': ''Anthropic'', ''request_count'': 2, ''p95_latency'': 243.5,
      ''mean_latency'': 185.0}]'
    explanation: Calculates 2 requests, 95th percentile 243.5ms, and mean 185.0ms.
  constraints:
  - 0 <= len(requests_data) <= 10^4
  - 0 <= len(models_data) <= 100
  - latency_ms > 0
constraint_quiz:
  prompt: Why is P95 latency a better reliability metric than mean latency for web APIs?
  options:
  - Mean latency averages out extreme spikes; P95 directly measures the degraded experience encountered by the slowest 5%
    of requests
  - P95 latency is always smaller than the mean
  - P95 can only be calculated on binary numbers
  - P95 requires zero RAM
  answer: 0
  explanation: Mean metrics are skewed by normal fast responses. Percentiles (P95/P99) expose real-world tail latencies caused
    by garbage collection, throttling, or cold starts.
pattern_quiz:
  prompt: In Pandas, which method computes arbitrary percentile thresholds on a Series or GroupBy object?
  options:
  - .quantile(q) where q is between 0.0 and 1.0 (e.g. 0.95 for P95)
  - .percentile()
  - .median_high()
  - .sample_tail()
  answer: 0
  explanation: pd.Series.quantile(0.95) computes the 95th percentile value using linear interpolation.
