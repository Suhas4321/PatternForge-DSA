  - {args: [[1, 4, 4], 3], expected: 4, note: "k == n: every element alone, answer is max(nums)"}
  - {args: [[1, 2, 3, 4, 5], 1], expected: 15, note: "k == 1: the answer is sum(nums)"}
  - {args: [[10], 1], expected: 10, note: single element}
  - {args: [[5, 1, 1, 1], 3], expected: 5, note: "greedy needs only 2 pieces at 5: fewer than k is still feasible"}
