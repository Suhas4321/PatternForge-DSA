slug: jump-game-ii
lc: 45

concept:
  problem_it_solves: >-
    "What's the fewest hops to get from the start to the end, when each position lets me
    move up to some distance?" That's a shortest path, which normally means BFS with a
    queue. But the positions reachable in k hops always form one contiguous block, so BFS
    collapses into a single left-to-right scan with two boundaries and a counter.
  brute_force: >-
    DP: dp[j] = fewest jumps to reach j, and every index i relaxes all of i+1 .. i+nums[i].
    It wastes work because it keeps relaxing indices that already have their final answer.
    Once you know the block of indices reachable in k jumps, everything in that block is done.
  brute_force_complexity: >-
    O(N · K) time where K is the largest jump (O(N²) in general), O(N) space — with
    N = 10⁴ and K = 1000 that's ~10⁷ relaxations and an extra array, versus one O(N) pass
    with O(1) space.
  key_insight: >-
    Think of it as BFS where level k is the block of indices whose fewest-jumps answer is k.
    Level 0 is just index 0. While you scan level k, track the farthest index any of its
    members can reach; that farthest index is where level k + 1 ends. So keep current_end
    (end of the level you're scanning), farthest (end of the next level) and jumps. Each time
    i reaches current_end, the level is finished: jumps += 1 and current_end = farthest.
  real_world: >-
    Network routing computes minimum hop counts with BFS, and when ranges are contiguous
    (relay towers along a highway, CDN edge nodes along a route) it collapses into this scan.
    Video streaming players choose the fewest chunk downloads to cover a seek range the same
    way, and logistics planners count the minimum refuelling or handover points on a route.

statement:
  clean: |
    You are given a 0-indexed array of integers `nums` of length `n`. You are initially
    positioned at index `0`. Each element `nums[i]` represents the
    **maximum length of a forward jump** from index `i`: from `i` you can jump to any index
    `i + j` where `0 <= j <= nums[i]` and `i + j < n`.

    Return the **minimum number of jumps** to reach index `n - 1`. The test cases are
    generated such that you **can reach** index `n - 1`.
  oa_story: |
    **MeetMandap — OA Round 2**

    MeetMandap books wedding and event venues across Bengaluru and runs a courier relay to
    move decor kits from its Yeshwanthpur warehouse to venues out on the Mysore Road
    corridor. Hubs sit in a fixed line along the road. From the dispatch sheet, each hub's
    van can carry a kit to any hub up to some number of hubs further down the line, and
    every handover between vans costs the team a signature, a delay and a chance of damage.

    Given the list of how far each hub's van can carry a kit, starting at the first hub,
    return the smallest number of van trips needed to get a kit to the last hub. Ops
    guarantees the last hub is always reachable. A corridor can have 10,000 hubs, and the
    planner recomputes this for every booking, so it must be a single pass.
  trigger_keywords: ["minimum number of jumps", "maximum length of a forward jump"]
  examples:
    - input: "nums = [2,3,1,1,4]"
      output: "2"
      explanation: "Jump 1 step from index 0 to 1, then 3 steps to the last index. Jumping the full 2 steps first would need 3 jumps."
    - input: "nums = [2,3,0,1,4]"
      output: "2"
  constraints:
    - "1 <= nums.length <= 10^4"
    - "0 <= nums[i] <= 1000"
    - "It's guaranteed that you can reach nums[n - 1]."

constraint_quiz:
  prompt: >-
    N ≤ 10⁴ and every jump is at most 1000. The DP that relaxes every jump is O(N · 1000).
    What's the best complexity you should aim for in the interview?
  options: ["O(N · 1000)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N · 1000) is ~10⁷ steps and would probably pass here, but it depends on the jump bound;
    if jumps went up to 10⁵ it becomes O(N²), and interviewers expect you to see past it.
    A heap or segment tree over dp values gives O(N log N), which is unnecessary. The BFS
    levels are contiguous, so one scan with two boundaries is O(N). O(log N) can't work
    because you must read every jump length.

pattern_quiz:
  prompt: >-
    Fewest jumps from index 0 to the end, where each index can jump any distance up to
    nums[i]. Which pattern fits?
  options:
    - "DFS trying the longest jump first"
    - "Always jump as far as possible from where you stand"
    - "BFS levels as contiguous ranges, scanned greedily with current_end and farthest"
    - "Kadane-style extend or restart"
  answer: 2
  explanation: >-
    "Minimum number of" steps in an unweighted graph is BFS. Here every BFS level is a
    contiguous block, so you don't need a queue: scanning the block and taking its farthest
    reach gives the next block. "Always jump as far as possible" is the tempting wrong
    greedy: on [2,3,1,1,4] it jumps to index 2 and needs 3 jumps instead of 2. DFS has no
    guarantee of finding the minimum quickly, and Kadane solves a different problem.

