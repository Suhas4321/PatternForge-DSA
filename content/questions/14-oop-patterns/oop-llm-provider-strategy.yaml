slug: oop-llm-provider-strategy
lc: 9215
citadel_id: python_data
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How do enterprise AI backends support multiple LLM vendors (OpenAI, Anthropic, Ollama) without cluttering
    every API endpoint with massive if-elif-else statements? The Strategy pattern defines a common interface for model execution.
    Concrete strategy classes encapsulate vendor-specific payloads, while a context gateway dynamically dispatches calls at
    runtime following the Open-Closed Principle.
  brute_force: Scattering vendor-specific payload logic throughout route handlers, making adding new models risky and messy.
  brute_force_complexity: High code coupling that violates SOLID design principles.
  key_insight: Encapsulating model invocation behind a uniform generate() strategy method allows swapping providers with zero
    client code modification.
  real_world: LangChain ChatModel abstraction, LiteLLM client routing, and Amazon Bedrock multi-model SDK.
statement:
  clean: "Implement the Strategy design pattern for multiple LLM inference providers:\n`dispatch_llm_strategy(self, provider:\
    \ str, prompt: str, model_config: dict = None) -> dict`.\n\nAbstract Strategy Interface:\n- `LLMProviderStrategy(ABC)`\
    \ with `@abstractmethod def generate(self, prompt: str, config: dict) -> dict`.\n\nConcrete Strategy Classes:\n1. `OpenAIStrategy`:\n\
    \   - `model = config.get('model', 'gpt-4o')`\n   - `tokens = len(prompt.split()) + 20`\n   - Returns: `{'provider': 'openai',\
    \ 'model': model, 'tokens': tokens, 'response': f'OpenAI: {prompt}'}`\n2. `AnthropicStrategy`:\n   - `model = config.get('model',\
    \ 'claude-3-5-sonnet')`\n   - `tokens = len(prompt.split()) + 25`\n   - Returns: `{'provider': 'anthropic', 'model': model,\
    \ 'tokens': tokens, 'response': f'Anthropic: {prompt}'}`\n3. `OllamaStrategy`:\n   - `model = config.get('model', 'llama3')`\n\
    \   - `tokens = len(prompt.split()) + 15`\n   - Returns: `{'provider': 'ollama', 'model': model, 'tokens': tokens, 'response':\
    \ f'Ollama: {prompt}'}`\n\nDispatcher Context:\n- Look up provider (case-insensitive) in strategy registry.\n- If provider\
    \ is not recognized, return `{'error': f'Unsupported provider: {provider}'}`.\n- Otherwise, execute the matching strategy's\
    \ `generate(prompt, config)` and return its dictionary."
  oa_story: '**SwiftCart Customer Assistant — Multi-Model AI Routing Hub**


    SwiftCart''s customer chat backend uses OpenAI for real-time recommendations, Anthropic Claude for dispute resolution,
    and on-premise Ollama for internal employee queries. The early prototype used a 500-line `if vendor == ''openai''` dispatcher
    that broke whenever parameter names differed.


    The staff engineer instructed the team to refactor the inference tier using the Gang of Four Strategy pattern. Implement
    this extensible LLM provider strategy dispatcher.'
  trigger_keywords:
  - Strategy design pattern for multiple LLM inference providers
  - dispatch_llm_strategy
  - OpenAIStrategy
  examples:
  - input: 'provider = ''openai'', prompt = ''Analyze sentiment'', model_config = {''model'': ''gpt-4o-mini''}'
    output: '{''provider'': ''openai'', ''model'': ''gpt-4o-mini'', ''tokens'': 22, ''response'': ''OpenAI: Analyze sentiment''}'
    explanation: OpenAI strategy formats tokens (2 words + 20) and returns standardized payload.
  constraints:
  - provider is a string
  - prompt is a non-empty string
