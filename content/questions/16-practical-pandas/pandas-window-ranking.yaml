drills:
  - title: Dense rank calculation on series
    skill: setup
    goal: Apply dense rank to a Pandas series.
    instructions: |
      Return the dense rank of `[100, 100, 90]` ascending=False.
    function:
      name: test_dense_rank
      params: [{name: values}]
    starter_code: |
      class Solution:
          def test_dense_rank(self, values: list[int]) -> list[int]:
              pass
    tests:
      - {args: [[100, 100, 90]], expected: [1, 1, 2]}
      - {args: [[50, 70, 60]], expected: [3, 1, 2]}
    solution: |
      import pandas as pd

      class Solution:
          def test_dense_rank(self, values: list[int]) -> list[int]:
              s = pd.Series(values)
              ranks = s.rank(method="dense", ascending=False).astype(int)
              return ranks.tolist()
    hint: "Use `s.rank(method='dense', ascending=False).astype(int)`."

  - title: GroupBy partition ranking
    skill: core
    goal: Rank values within groups.
    instructions: |
      Compute rank of `val` per `group` with `method='dense', ascending=False`.
    function:
      name: group_rank
      params: [{name: records}]
    starter_code: |
      class Solution:
          def group_rank(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"g": "A", "val": 10}, {"g": "A", "val": 20}]], expected: [{"g": "A", "val": 10, "rk": 2}, {"g": "A", "val": 20, "rk": 1}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def group_rank(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              df["rk"] = df.groupby("g")["val"].rank(method="dense", ascending=False).astype(int)
              return df.to_dict(orient="records")
    hint: "Use `df.groupby('g')['val'].rank(method='dense', ascending=False)`."

  - title: Filter rank 2 rows
    skill: edge
    goal: Isolate rows where rank == 2.
    instructions: |
      Return only rows where `rank == 2`.
    function:
      name: filter_rank_2
      params: [{name: records}]
    starter_code: |
      class Solution:
          def filter_rank_2(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"name": "A", "rank": 1}, {"name": "B", "rank": 2}]], expected: [{"name": "B", "rank": 2}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def filter_rank_2(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              return df.loc[df["rank"] == 2].to_dict(orient="records")
    hint: "Use `df.loc[df['rank'] == 2]`."

hints:
  - "If `employees` is empty, return `[]`."
  - "Compute dense rank: `df['rank'] = df.groupby('department')['salary'].rank(method='dense', ascending=False)`."
  - "Filter with `df.loc[df['rank'] == 2]`, project `['department', 'name', 'salary']`, and sort by `['department', 'salary', 'name']` with `ascending=[True, False, True]`."

solution:
  code: |
    import pandas as pd

    class Solution:
        def get_second_highest_salaries(self, employees: list[dict]) -> list[dict]:
            if not employees:
                return []
            df = pd.DataFrame(employees)

            # Step 1: Calculate dense rank partitioned by department
            df["rank"] = df.groupby("department")["salary"].rank(method="dense", ascending=False)

            # Step 2: Filter for 2nd highest salary
            second_df = df.loc[df["rank"] == 2]

            if second_df.empty:
                return []

            # Step 3: Select columns and sort
            cols = ["department", "name", "salary"]
            sorted_df = second_df[cols].sort_values(
                by=["department", "salary", "name"],
                ascending=[True, False, True]
            )

            return sorted_df.to_dict(orient="records")
  explanation: |
    We utilize Pandas's `.groupby('department')['salary'].rank(method='dense', ascending=False)`.
    Because `method='dense'` does not leave gaps after tied values, any salary that is immediately below
    the department's top salary receives `rank == 2`.
    
    Filtering by `rank == 2` isolates the target employees across all departments simultaneously.
    Sorting with `ascending=[True, False, True]` produces deterministic, ordered results.
  time: O(N log N) dominated by sorting
  space: O(N) for DataFrame memory

pitch_script: |
  **(Clarify)** "We need to identify employees earning the second-highest salary within each department, correctly handling ties using dense ranking."

  **(Basement Insight)** "Standard ranking algorithms like `method='min'` or `method='average'` skip rank numbers when ties occur (e.g. two #1 ranks result in the next being #3). `method='dense'` produces consecutive ranks without gaps (1, 1, 2), matching SQL's `DENSE_RANK()`."

  **(Solution)** "We build a DataFrame and compute `df.groupby('department')['salary'].rank(method='dense', ascending=False)`. We slice with `.loc[df['rank'] == 2]`, project `[department, name, salary]`, and sort by department ascending, salary descending, and name ascending."

  **(Complexity)** "Executes in O(N log N) time due to sorting, using O(N) auxiliary space for the DataFrame."

