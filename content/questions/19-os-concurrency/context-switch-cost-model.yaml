slug: context-switch-cost-model
lc: 9406
citadel_id: os_concurrency
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: Why is an OS thread context switch an order of magnitude faster than a process context switch? A thread
    switch only saves and restores general-purpose registers, program counter, and stack pointer. A process switch must additionally
    swap the Page Table Base Register (CR3 in x86), flush the Translation Lookaside Buffer (TLB), and invalidate L1/L2 CPU
    caches, inducing expensive memory misses.
  brute_force: Assuming threads and processes have identical CPU scheduling costs.
  brute_force_complexity: Flawed architectural assumption leading to CPU throttling.
  key_insight: Modeling the CPU register save latency, TLB flush overhead, and cache penalty quantifies the exact microsecond
    divergence between thread and process switching.
  real_world: Sizing Nginx worker processes vs Golang goroutines vs Python Celery prefork workers.
statement:
  clean: "Implement an OS context switch cost model to compare thread vs process switching overhead:\n`compare_context_switch_costs(switches:\
    \ int, switch_type: str, cache_miss_rate: float) -> dict`.\n\nHardware Benchmark Constants:\n- Thread Switch:\n  - Base\
    \ register save/restore: `1200` ns\n  - TLB flush: `0` ns (threads share address space)\n  - Cache penalty: `int(cache_miss_rate\
    \ * 3000)` ns\n- Process Switch:\n  - Base register save/restore: `3500` ns\n  - TLB flush: `4500` ns (address space change\
    \ requires TLB invalidation)\n  - Cache penalty: `int(cache_miss_rate * 12000)` ns\n\nFormulas:\n1. `overhead_per_switch_ns\
    \ = base_ns + tlb_ns + cache_ns`\n2. `total_latency_ns = overhead_per_switch_ns * switches`\n3. `total_latency_ms = round(total_latency_ns\
    \ / 1_000_000, 4)`\n\nReturn a dictionary containing:\n- `\"switch_type\"`: `str` (`\"thread\"` or `\"process\"`)\n- `\"\
    switches\"`: `int`\n- `\"overhead_per_switch_ns\"`: `int`\n- `\"total_latency_ns\"`: `int`\n- `\"total_latency_ms\"`:\
    \ `float`"
  oa_story: '**Ola Fleet Tracking Gateway — Worker Architecture Benchmark**


    Ola''s vehicle telematics cluster handles 50,000 location pings per second. The platform team evaluated whether to run
    worker tasks using multi-processing vs multi-threading. The profiling team observed high CPU kernel time during process
    context switches.


    Implement this context switch cost model to quantify the exact latency impact of TLB flushes and CPU cache misses.'
  trigger_keywords:
  - context switch cost model
  - compare_context_switch_costs
  - total_latency_ms
  examples:
  - input: switches = 1000, switch_type = "process", cache_miss_rate = 0.5
    output: '{"switch_type": "process", "switches": 1000, "overhead_per_switch_ns": 14000, "total_latency_ns": 14000000, "total_latency_ms":
      14.0}'
    explanation: Process switch takes 3500 base + 4500 TLB + 6000 cache = 14000ns per switch. 1000 switches = 14.0ms.
  - input: switches = 1000, switch_type = "thread", cache_miss_rate = 0.5
    output: '{"switch_type": "thread", "switches": 1000, "overhead_per_switch_ns": 2700, "total_latency_ns": 2700000, "total_latency_ms":
      2.7}'
    explanation: Thread switch takes 1200 base + 0 TLB + 1500 cache = 2700ns. 1000 switches = 2.7ms (over 5x faster).
  constraints:
  - 0 <= switches <= 1_000_000
  - switch_type in ('thread', 'process')
  - 0.0 <= cache_miss_rate <= 1.0
constraint_quiz:
  prompt: Why does a process context switch invalidate the Translation Lookaside Buffer (TLB)?
  options:
  - Because virtual addresses map to completely different physical frames in different process address spaces
  - Because the CPU resets its clock frequency during process switching
  - Because TLB memory is cleared on every timer interrupt
  - Because threads do not use virtual memory
  answer: 0
  explanation: Each process has its own page tables. Virtual address 0x00400000 in Process A points to different physical
    RAM than the same address in Process B, requiring the TLB cache to be flushed.
pattern_quiz:
  prompt: What primary hardware components are saved during a lightweight thread context switch?
  options:
  - General purpose CPU registers, Program Counter (PC), and Stack Pointer (SP)
  - Entire 4GB RAM address space
  - Disk swap partitions
  - GPU framebuffers
  answer: 0
  explanation: A thread switch only needs to preserve the CPU execution context (registers, PC, SP) since heap and address
    spaces are already shared.
