tests:
  - {args: [[1, 2, 3, 0, 2]], expected: 3}
  - {args: [[1]], expected: 0, note: single day}
  - {args: [[1, 2]], expected: 1, note: "one trade, the cooldown never matters"}
  - {args: [[5, 4, 3, 2, 1]], expected: 0, note: "falling prices: never buy"}
  - {args: [[1, 2, 3, 4, 5]], expected: 4, note: "one long hold beats splitting into trades"}
  - {args: [[1, 4, 2, 7]], expected: 6, note: "without the cooldown it would be 3 + 5 = 8"}
  - {args: [[6, 1, 6, 4, 3, 0, 2]], expected: 7, note: "sell at 6, cool down, buy back at 0"}
  - {args: [[3, 3, 3]], expected: 0, note: flat prices}
  - {args: [[1, 4, 2, 7, 1, 9]], expected: 11, note: "skip the middle trade: (4 − 1) + (9 − 1)"}
visualize_test: 0

drills:
  - title: Two states, no cooldown
    skill: setup
    goal: Set up a dp[i][state] table with a day-0 base row and fill it with a two-state machine.
    instructions: |
      Return the maximum profit with unlimited transactions and **no** cooldown.

      Use `dp[i][0]` = best profit at the end of day `i` while **holding** a share and
      `dp[i][1]` = best profit while holding **nothing**. Day 0 is the base row: holding means
      you bought, so `-prices[0]`; holding nothing is `0`. Each later day: hold =
      `max(keep holding, buy today from nothing)`, nothing = `max(keep waiting, sell today)`.
      The answer is the "nothing" column on the last day (an unsold share is wasted money).
      This is the same table shape as the cooldown problem with one fewer state, so get it
      working first.
    function:
      name: maxProfitNoCooldown
      params: [{name: prices}]
    starter_code: |
      class Solution:
          def maxProfitNoCooldown(self, prices: List[int]) -> int:
              pass
    tests:
      - {args: [[7, 1, 5, 3, 6, 4]], expected: 7}
      - {args: [[1, 2, 3, 4, 5]], expected: 4}
      - {args: [[7, 6, 4, 3, 1]], expected: 0}
      - {args: [[1, 4, 2, 7]], expected: 8, note: "buying the day after a sale is allowed here"}
      - {args: [[5]], expected: 0}
    solution: |
      class Solution:
          def maxProfitNoCooldown(self, prices: List[int]) -> int:
              n = len(prices)
              dp = [[0] * 2 for _ in range(n)]
              dp[0][0] = -prices[0]
              for i in range(1, n):
                  dp[i][0] = max(dp[i - 1][0], dp[i - 1][1] - prices[i])
                  dp[i][1] = max(dp[i - 1][1], dp[i - 1][0] + prices[i])
              return dp[n - 1][1]
    hint: "Both new values read only yesterday's row, `dp[i - 1]`."

  - title: One day of the cooldown machine
    skill: core
    goal: Turn yesterday's [hold, sold, rest] into today's using only the legal arrows.
    instructions: |
      `prev` is yesterday's row `[hold, sold, rest]` (best profit ending yesterday in each
      state) and `price` is today's price. Return today's row.

      Follow the arrows into each state:

      - **hold** = max(keep holding: `prev[0]`, buy today: `prev[2] - price`). You can only buy
        from **rest**, never from sold. That is the cooldown.
      - **sold** = sell the share you held: `prev[0] + price`.
      - **rest** = max(keep resting: `prev[2]`, yesterday's sale finishes its cooldown:
        `prev[1]`).

      The first four tests are days 1 to 4 of `[1, 2, 3, 0, 2]`, so you can watch the answer 3
      appear.
    function:
      name: nextDay
      params: [{name: prev}, {name: price}]
    starter_code: |
      class Solution:
          def nextDay(self, prev: List[int], price: int) -> List[int]:
              pass
    tests:
      - {args: [[-1, 0, 0], 2], expected: [-1, 1, 0]}
      - {args: [[-1, 1, 0], 3], expected: [-1, 2, 1]}
      - {args: [[-1, 2, 1], 0], expected: [1, -1, 2], note: "buy at 0 from REST (1 − 0)"}
      - {args: [[1, -1, 2], 2], expected: [1, 3, 2], note: "sell: 1 + 2 = 3, the final answer"}
      - {args: [[-1, 3, 0], 2], expected: [-1, 1, 3], note: "SOLD's 3 can't buy today: only REST (0) can"}
    solution: |
      class Solution:
          def nextDay(self, prev: List[int], price: int) -> List[int]:
              hold = max(prev[0], prev[2] - price)
              sold = prev[0] + price
              rest = max(prev[2], prev[1])
              return [hold, sold, rest]
    hint: "Buying reads `prev[2]` (rest), not `prev[1]` (sold)."

  - title: Three variables, updated simultaneously
    skill: edge
    goal: Space-optimise the table to three variables without letting today's values leak into today's transitions.
    instructions: |
      Solve the full cooldown problem in O(1) space with three variables `hold`, `sold`,
      `rest`.

      The trap: if you update them one line at a time, `sold = hold + p` uses the hold you just
      updated, and `rest = max(rest, sold)` uses today's sale, which lets you buy tomorrow right
      after selling and silently breaks the cooldown. On `[1, 4, 2, 7]` that bug returns 8
      instead of 6. Every right-hand side must use **yesterday's** values: compute all three
      from the old ones in one tuple assignment. Start from day 0: `hold = -prices[0]`,
      `sold = rest = 0`, and return the better of `sold` and `rest` at the end.
    function:
      name: maxProfitConstantSpace
      params: [{name: prices}]
    starter_code: |
      class Solution:
          def maxProfitConstantSpace(self, prices: List[int]) -> int:
              pass
    tests:
      - {args: [[1, 2, 3, 0, 2]], expected: 3, note: "sequential updates give 4"}
      - {args: [[1, 4, 2, 7]], expected: 6, note: "sequential updates give 8"}
      - {args: [[1, 4, 2, 7, 1, 9]], expected: 11}
      - {args: [[1]], expected: 0}
      - {args: [[2, 1, 4]], expected: 3}
    solution: |
      class Solution:
          def maxProfitConstantSpace(self, prices: List[int]) -> int:
              hold, sold, rest = -prices[0], 0, 0
              for p in prices[1:]:
                  hold, sold, rest = max(hold, rest - p), hold + p, max(rest, sold)
              return max(sold, rest)
    hint: "Python evaluates the whole right-hand side of `a, b, c = ...` before assigning anything."

hints:
  - >-
    "Best profit up to day i" isn't enough information to decide what you may do tomorrow.
    What else do you need to know about the end of day i: do you own a share, and did you just
    sell?
  - >-
    Use three states: HOLD (own a share), SOLD (sold today), REST (own nothing, free to buy).
    HOLD comes from HOLD or from REST by buying; SOLD comes only from HOLD by selling; REST comes
    from REST or from SOLD (the cooldown day). There's no arrow from SOLD to HOLD.
  - |
    dp = one row of [hold, sold, rest] per day
    day 0: hold = -prices[0], sold = 0, rest = 0
    for each later day i:
        hold = max(yesterday hold, yesterday rest - prices[i])
        sold = yesterday hold + prices[i]
        rest = max(yesterday rest, yesterday sold)
    return max(last day sold, last day rest)

solution:
  code: |
    class Solution:
        def maxProfit(self, prices: List[int]) -> int:
            n = len(prices)
            states = ["hold", "sold", "rest"]  # column 0 HOLD, 1 SOLD (sold today), 2 REST (free to buy)
            # dp[i][s] = best profit at the end of day i, finishing the day in state s
            dp = [[0] * len(states) for _ in range(n)]
            dp[0][0] = -prices[0]  # buy on day 0; SOLD and REST start at 0
            for i in range(1, n):
                dp[i][0] = max(dp[i - 1][0], dp[i - 1][2] - prices[i])  # keep holding, or buy from REST
                dp[i][1] = dp[i - 1][0] + prices[i]  # sell the share held yesterday
                dp[i][2] = max(dp[i - 1][2], dp[i - 1][1])  # keep resting, or cool down after a sale
            return max(dp[n - 1][1], dp[n - 1][2])  # never finish holding a share
  explanation: |
    **The state diagram, in words.** At the end of any day you are in exactly one of three
    states:

    - **HOLD**: you own a share. Arrows in: HOLD → HOLD (keep it), REST → HOLD (buy today).
    - **SOLD**: you sold today. Arrow in: HOLD → SOLD (sell).
    - **REST**: you own nothing and you are allowed to buy tomorrow. Arrows in: REST → REST
      (wait), SOLD → REST (the cooldown day after a sale).

    There is no SOLD → HOLD arrow. That missing arrow is the entire cooldown rule.

    **The 5-step DP recipe:**

    1. **Define dp in words.** `dp[i][s]` = best total profit achievable by the end of day `i`
       if you finish day `i` in state `s` (0 HOLD, 1 SOLD, 2 REST). Buying subtracts the price,
       selling adds it.
    2. **Recurrence from the last choice.** Today's action is the last choice, so each state
       takes the best arrow into it from yesterday's row: `hold = max(hold, rest - price)`,
       `sold = hold + price`, `rest = max(rest, sold)`.
    3. **Base cases.** Day 0: HOLD = `-prices[0]` (you bought). REST = 0. SOLD = 0 can be read
       as "bought and sold on day 0 for no gain": it's never better than resting, so it can't
       create a fake profit, and it only feeds REST on day 1, which is 0 anyway.
    4. **Fill order.** Day by day, left to right. Every cell of row `i` reads only row `i - 1`.
    5. **Answer location.** `max(dp[n - 1][1], dp[n - 1][2])`: finishing in HOLD means you paid
       for a share you never sold, which is never optimal.

    In the visualizer the rows are labelled with each day's price and the columns with the
    state names, so you can watch HOLD read REST (blue) and never SOLD.

    **Stepping stone and space.** The memoised version is `best(i, holding)`, which jumps to
    `i + 2` after a sale: 2n states. The table here has the same information, and because each
    row only reads the previous one, it compresses to three variables (O(1) space), as long as
    all three are updated from yesterday's values at once.
  time: O(n) — three O(1) updates per day
  space: O(n) for the n × 3 table; O(1) with three variables updated simultaneously
  brute_force_code: |
    class Solution:
        def maxProfit(self, prices: List[int]) -> int:
            def best(i, holding):
                if i >= len(prices):
                    return 0
                if holding:  # keep the share, or sell and skip the cooldown day
                    return max(best(i + 1, True), prices[i] + best(i + 2, False))
                return max(best(i + 1, False), -prices[i] + best(i + 1, True))  # wait, or buy

            return best(0, False)

pitch_script: |
  **(Clarify)** "I can do any number of transactions, hold at most one share, and after a sell
  I can't buy the next day. Can I sell and do nothing for several days? Yes, the cooldown is
  only the minimum gap. And 0 profit is allowed if I never trade?"

  **(Brute force)** "A recursion on the day and whether I'm holding: wait or buy when free, keep
  or sell when holding, and a sale jumps two days ahead. It's exponential because the same day
  and status get recomputed for every history that leads there."

  **(Trigger)** "What I'm allowed to do today depends on what I did yesterday, which is the
  sign of a state-machine DP. I'll use three states: holding, just sold, and resting, meaning
  free to buy. The cooldown is just the rule that you can't go from sold straight to holding."

  **(Optimal)** "dp of i, state is the best profit at the end of day i in that state. Holding is
  the max of holding yesterday or buying today from rest. Sold is yesterday's holding plus
  today's price. Rest is the max of resting yesterday or having sold yesterday. Day 0 starts at
  minus the price for holding and zero for the others, and the answer is the better of sold
  and rest on the last day."

  **(Complexity)** "O(n) time and O(n) space for the table. Each row only uses the row before
  it, so I can drop to three variables for O(1) space, updating all three together so today's
  sale can't leak into today's buy."

twist:
  lc: 714
  title: Best Time to Buy and Sell Stock with Transaction Fee
  why: >-
    The cooldown disappears, but every completed trade costs a fixed fee. Without a cooldown
    the SOLD state is no longer needed: two states, hold and free, are enough. The fee is paid
    on the arrow from hold to free: free = max(free, hold + price − fee), hold = max(hold,
    free − price). The machine changes shape, but the method (draw the states, take the best
    arrow into each) stays exactly the same.

