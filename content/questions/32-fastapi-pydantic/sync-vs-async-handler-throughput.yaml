hints:
- If `handler_type == 'sync_def'`, use `math.ceil(requests_count / threadpool_workers) * blocking_time_ms`.
- If `handler_type == 'async_def_blocking'`, execution is fully serialized (`requests_count * blocking_time_ms`).
- '| # Pseudocode Blueprint

  | if handler_type == "sync_def":

  |     batches = ceil(reqs / workers)

  |     total_ms = batches * blocking_ms

  |     starved = False

  | else:

  |     total_ms = reqs * blocking_ms

  |     starved = reqs > 1

  | rps = round(reqs / (total_ms / 1000.0), 2)

  | return total_ms, starved, rps'
solution:
  code: "import math\n\nclass Solution:\n    def simulate_handler_throughput(self, handler_type: str, requests_count: int,\
    \ blocking_time_ms: int, threadpool_workers: int = 4) -> dict:\n        if handler_type == \"sync_def\":\n           \
    \ batches = math.ceil(requests_count / threadpool_workers) if requests_count > 0 else 0\n            total_time_ms = batches\
    \ * blocking_time_ms\n            starved = False\n        else:\n            total_time_ms = requests_count * blocking_time_ms\n\
    \            starved = requests_count > 1\n\n        rps = round((requests_count / (total_time_ms / 1000.0)), 2) if total_time_ms\
    \ > 0 else 0.0\n        return {\n            \"handler_type\": handler_type,\n            \"requests_count\": requests_count,\n\
    \            \"total_time_ms\": total_time_ms,\n            \"event_loop_starved\": starved,\n            \"throughput_req_per_sec\"\
    : rps,\n        }\n"
  explanation: FastAPI routes regular `def` endpoints to a multi-threaded pool, executing blocking calls in parallel batches
    across threads. An `async def` endpoint runs directly on the single-threaded event loop; any synchronous blocking call
    monopolizes the thread and starves all concurrent requests.
  time: O(1) arithmetic calculation
  space: O(1) dictionary response
pitch_script: '**(Clarify)** "We need to model the latency and throughput of synchronous `def` versus blocking `async def`
  endpoints in FastAPI under concurrent traffic."


  **(Brute force)** "Using `async def` everywhere causes synchronous I/O or CPU operations to monopolize the single event
  loop thread, causing full system lockups."


  **(Trigger)** "Comparing single-threaded event loop starvation against threadpool batch processing signals a web concurrency
  model."


  **(Optimal)** "For `sync_def`, FastAPI offloads requests to a threadpool, completing in `ceil(N / workers) * blocking_time`.
  For `async_def_blocking`, all requests are strictly serialized (`N * blocking_time`). Throughput is computed as requests
  divided by total wall-clock seconds."


  **(Complexity)** "Executes in O(1) time and space." '
