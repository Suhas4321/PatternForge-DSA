slug: reverse-nodes-in-k-group
lc: 25

concept:
  problem_it_solves: >-
    "How do I reverse a list one chunk at a time and stitch the chunks back together?"
    Reversing a whole list is a single loop, but reversing pieces means every piece has two
    loose ends: the node before it must now point at the piece's old last node, and the
    piece's old first node must point at whatever comes after. Tracking a `group_prev`
    pointer (the node just before the current group) gives you a fixed handle on both ends.
  brute_force: >-
    Copy every node into an array, reverse each full block of k entries in the array, then
    relink the nodes in array order. The reversal itself is easy this way, but it spends O(N)
    extra memory holding references the list already holds, which is exactly what the
    follow-up forbids. (Swapping values instead of nodes is not allowed at all.)
  brute_force_complexity: O(N) time, O(N) extra space — 5000 nodes means a 5000-entry array, when the follow-up asks for O(1) extra memory.
  key_insight: >-
    Treat each group as a small "reverse a list" problem with fixed boundaries. Before
    touching anything, walk k steps from `group_prev` to find the group's last node `kth`; if
    you fall off the end, the remaining group is short and stays as it is, so you're done.
    Otherwise remember `group_next = kth.next` and reverse the group with `prev` starting at
    `group_next` instead of `None`, so the old first node automatically points at the rest of
    the list. Finally, `group_prev.next = kth` attaches the reversed group, and the old first
    node (now the group's tail) becomes the next `group_prev`. A dummy node in front of the
    head means the first group needs no special case.
  real_world: >-
    The "node before the segment / node after the segment" bookkeeping is how kernel and
    embedded code splices sublists of intrusive linked lists in place (Linux's
    list_cut_position and list_splice work on exactly these two boundary pointers), and job
    schedulers that drain a linked run queue in fixed-size batches detach, reorder and
    reattach each batch the same way, without allocating anything on the hot path.

statement:
  clean: |
    Given the `head` of a linked list, **reverse the nodes of the list k at a time**, and
    return the modified list.

    `k` is a positive integer and is less than or equal to the length of the linked list. If
    the number of nodes is not a multiple of `k` then **left-out nodes, in the end, should
    remain as it is**.

    You may not alter the values in the list's nodes; only nodes themselves may be changed.

    **Follow-up:** can you solve the problem in O(1) extra memory space?
  oa_story: |
    **ReelRack Media — OA Round 2**

    ReelRack is a short-video app built in HSR Layout, and its new "flashback" mode replays a
    user's watch history in batches. The history is stored as a chain of reels, each reel
    knowing only the reel watched after it. Flashback mode takes the chain in consecutive
    batches of exactly `k` reels and plays each batch in reverse order, batch after batch. If
    the last few reels don't make a full batch of `k`, they are played in their original
    order.

    Reel IDs are fixed, so you can't just swap IDs between reels; you have to re-link the
    chain itself. The feature has to run on budget Android phones, so the re-linking must use
    only a constant amount of extra memory, even for a history of 5000 reels. Given the first
    reel and `k`, return the first reel of the re-linked chain.
  trigger_keywords: ["reverse the nodes of the list k at a time", "left-out nodes", "O(1) extra memory"]
  examples:
    - input: "head = [1,2,3,4,5], k = 2"
      output: "[2,1,4,3,5]"
      explanation: "Groups [1,2] and [3,4] are reversed; [5] is a short group and stays."
    - input: "head = [1,2,3,4,5], k = 3"
      output: "[3,2,1,4,5]"
      explanation: "Only one full group of 3; the left-out [4,5] keeps its order."
  constraints:
    - "The number of nodes in the list is n."
    - "1 <= k <= n <= 5000"
    - "0 <= Node.val <= 1000"

constraint_quiz:
  prompt: >-
    n is at most 5000 and the follow-up asks for O(1) extra memory. What should you aim for?
  options:
    - "O(N) time, O(N) space — copy the nodes into an array"
    - "O(N · k) time, O(1) space — re-walk each group once per node"
    - "O(N) time, O(1) space — count ahead, reverse each group in place, reconnect"
    - "O(N) time, O(N / k) space — recursion, one call per group"
  answer: 2
  explanation: >-
    The array version is O(N) time but O(N) space, which fails the follow-up. Re-walking a
    group for every node (like bubbling nodes into place) costs O(N · k), up to 2.5 × 10⁷
    here when k = n, and is pointless. Recursion that reverses a group and recurses on the
    rest is neat, but its call stack is O(N / k) frames, not O(1). Counting k ahead and
    reversing in place visits each node a constant number of times (once to count, once to
    reverse) with a handful of pointers: O(N) time, O(1) space.

pattern_quiz:
  prompt: >-
    You must reverse a linked list in consecutive chunks of k nodes, leave a short final
    chunk alone, and use O(1) extra memory. Which pattern fits?
  options:
    - "Fast/slow pointers to find the middle"
    - "A stack of k nodes per group"
    - "Dummy node + group_prev pointer, count k ahead, reverse the group in place, reconnect"
    - "Reverse the whole list, then reverse it back in chunks"
  answer: 2
  explanation: >-
    There's no middle to find here, so fast/slow doesn't help. A stack of k nodes works but
    uses O(k) memory, not O(1). Reversing the whole list scrambles which nodes belong to
    which group, especially the short final one. The trigger "reverse k at a time" + "left-out
    nodes remain" means in-place pointer reversal, one group at a time, with a counting step
    first (to protect the short group) and a dummy node + group_prev to reattach each
    reversed group.

