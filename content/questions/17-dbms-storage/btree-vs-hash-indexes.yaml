slug: btree-vs-hash-indexes
lc: 9302
citadel_id: sql_dbms
brick_layer: 2
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why shouldn't you always use a Hash Index since it has O(1) lookup time compared to B-Tree's O(log N)?"
    A Hash Index maps keys through a hash function into buckets. While ideal for exact equality (`WHERE id = 42`),
    hash functions completely randomize ordering: `hash(42)` and `hash(43)` land in unrelated buckets.
    Consequently, Hash Indexes cannot support range queries (`WHERE age BETWEEN 20 AND 30`), inequality (`<`, `>`),
    or `ORDER BY` clauses. B-Trees keep leaf pages sorted and linked in a doubly-linked chain, effortlessly supporting range scans.
  brute_force: >-
    Using Hash Indexes on columns frequently queried with range filters or timestamps.
    Because the hash index cannot satisfy range boundaries, the query planner abandons the index entirely
    and falls back to an expensive Sequential Table Scan.
  brute_force_complexity: O(1) point lookup, but O(N) table scan for range filters.
  key_insight: >-
    B-Tree traversal takes $O(\log_B N)$ root-to-leaf page hops. Once the starting leaf page is reached,
    the storage engine traverses leaf pointers horizontally across disk blocks, evaluating range scans in $O(\log N + K)$ time.
  real_world: >-
    PostgreSQL default indexing (B-Tree vs. Hash), MySQL InnoDB clustered indexes, and time-series database range lookups.

statement:
  clean: |
    Implement an index engine benchmark simulator using btree index traversal:
    `benchmark_index_lookup(keys: list[int], query_type: str, target: int, range_end: int = 0) -> dict`.
    
    Given a list of unique sorted integer keys present in a table:
    1. Calculate B-Tree Depth:
       - If `keys` is empty, `tree_depth = 0`.
       - Otherwise, calculate `tree_depth = math.floor(math.log2(len(keys))) + 1`.
    2. Evaluate based on `query_type`:
       - **Point Query (`query_type == "point"`)**:
         - Looking up `WHERE id = target`.
         - Hash Index: supports equality (`hash_supported = True`), requires `hash_hops = 1`.
         - B-Tree: supports equality (`btree_supported = True`), requires `btree_hops = tree_depth`.
         - Return `{"hash_supported": True, "hash_hops": 1, "btree_supported": True, "btree_hops": tree_depth}`.
       - **Range Query (`query_type == "range"`)**:
         - Looking up `WHERE id BETWEEN target AND range_end` (inclusive).
         - Hash Index: **cannot** support range queries (`hash_supported = False`, `hash_hops = 0`).
         - B-Tree: supports range queries (`btree_supported = True`).
           Traverses tree to leaf (`tree_depth`), then scans all keys in `[target, range_end]`.
           `btree_hops = tree_depth + count_of_matching_keys`.
         - Return `{"hash_supported": False, "hash_hops": 0, "btree_supported": True, "btree_hops": btree_hops}`.
  oa_story: |
    **DynamoDB to PostgreSQL Architecture Defense**
    
    In interview deep-dives regarding your database migration, interviewers will challenge you on indexing internals:
    "Why did you choose standard PostgreSQL B-Tree indexes over Hash indexes or DynamoDB partition keys?"
    
    Build this comparative simulation to demonstrate why B-Tree indexes are the universal default for relational workloads
    due to their combined support for logarithmic point lookups and sequential range scans.
  trigger_keywords: ["btree index traversal", "benchmark_index_lookup", "keys"]
  examples:
    - input: "keys = [10, 20, 30, 40], query_type = 'point', target = 20"
      output: "{'hash_supported': True, 'hash_hops': 1, 'btree_supported': True, 'btree_hops': 3}"
      explanation: "Point query: Hash takes 1 hop. 4 keys -> floor(log2(4)) + 1 = 3 hops for B-Tree."
    - input: "keys = [10, 20, 30, 40], query_type = 'range', target = 20, range_end = 35"
      output: "{'hash_supported': False, 'hash_hops': 0, 'btree_supported': True, 'btree_hops': 5}"
      explanation: "Range query: Hash unsupported (0 hops). B-Tree does 3 root-to-leaf hops + 2 matching keys (20, 30) = 5 hops."
  constraints:
    - "keys is a sorted list of unique integers"
    - "query_type is either 'point' or 'range'"

constraint_quiz:
  prompt: >-
    Why can't a standard Hash Index execute `WHERE salary >= 80000`?
  options:
    - "Because hash tables cannot store numbers larger than 65535"
    - "Because hash functions do not preserve mathematical ordering between keys"
    - "Because SQL syntax disallows >= with hash indexes"
    - "Because hash indexes require 4x more disk space"
  answer: 1
  explanation: >-
    Hash functions distribute keys pseudorandomly across buckets. There is no spatial locality or ordering between keys.

pattern_quiz:
  prompt: How are leaf nodes connected in a B+ Tree index to enable efficient range scans?
  options:
    - "Through random hash pointers"
    - "Via doubly-linked list pointers connecting adjacent leaf blocks sequentially"
    - "They are not connected; each range requires re-traversing from the root"
    - "Via circular ring buffers"
  answer: 1
  explanation: >-
    Leaf pages in B+ Trees maintain doubly linked pointers to their sibling leaves, allowing horizontal sequential scans.

