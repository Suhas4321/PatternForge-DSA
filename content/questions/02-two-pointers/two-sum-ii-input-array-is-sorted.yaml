slug: two-sum-ii-input-array-is-sorted
lc: 167

concept:
  problem_it_solves: >-
    "Which two numbers add up to the target?", but now the numbers are sorted. Sorted order means
    every sum you compute also tells you which direction to go: too small means you need a bigger
    number, too big means you need a smaller one. Two pointers at the ends use that signal to
    throw away one candidate per comparison, with no extra memory.
  brute_force: >-
    Check every pair (i, j) with two nested loops. It ignores the sorting completely: after
    learning that numbers[0] + numbers[n−1] is too small, it still goes on to test numbers[0]
    against every other (even smaller) partner. Binary-searching each complement is better but
    still only uses the order half-way.
  brute_force_complexity: >-
    O(N²) time, O(1) space — 3 × 10⁴ elements means ~4.5 × 10⁸ pair checks (binary search per
    element is O(N log N)).
  key_insight: >-
    Look at the smallest and largest remaining values. If their sum is too small, the smallest
    value is useless: even paired with the largest number available it falls short, so every
    other pairing with it is smaller still. Discard it (l += 1). If the sum is too big, the
    largest value is useless by the mirror argument (r -= 1). Each comparison eliminates a whole
    row or column of pairs, so N − 1 steps at most cover all N²/2 pairs.
  real_world: >-
    This is how a sort-merge join works in Postgres and Spark: when both inputs are already
    sorted, two cursors walk them in step instead of building a hash table, which is exactly
    the memory-for-order trade versus Two Sum's hash map. Order-matching engines and price
    comparison services use the same "too low, move up; too high, move down" walk over sorted
    price lists.

statement:
  clean: |
    Given a **1-indexed** array of integers `numbers` that is already
    **sorted in non-decreasing order**, find two numbers such that they **add up to** a specific
    `target` number. Let these two numbers be `numbers[index1]` and `numbers[index2]` where
    `1 <= index1 < index2 <= numbers.length`.

    Return the indices of the two numbers, `index1` and `index2`, **added by one** as an integer
    array `[index1, index2]` of length 2.

    The tests are generated such that there is **exactly one solution**. You may not use the
    same element twice.

    Your solution must use only **constant extra space**.
  oa_story: |
    **PaisaPath Payments — OA Round 2**

    PaisaPath is a UPI wallet popular with students in Bengaluru's PG hostels. When a merchant
    refund fails, support has to find the **two** cashback vouchers in the user's wallet whose
    values add up exactly to the refund amount `target`, and merge them. The wallet stores voucher
    values in ascending order of amount (ties allowed), and support agents number the rows
    starting from 1, so the answer must be the two row numbers, smaller one first.

    Product guarantees exactly one valid pair for every refund and a voucher can't be used twice.
    The matching job runs inside the app on low-end Android phones, so it may only use a fixed
    handful of variables no matter how many vouchers the user has (up to 30,000).
  trigger_keywords: ["sorted in non-decreasing order", "add up to", "constant extra space", "1-indexed"]
  examples:
    - input: "numbers = [2,7,11,15], target = 9"
      output: "[1,2]"
      explanation: "2 + 7 = 9, so index1 = 1 and index2 = 2 (1-indexed)."
    - input: "numbers = [2,3,4], target = 6"
      output: "[1,3]"
      explanation: "2 + 4 = 6. 3 + 3 would reuse the same element."
    - input: "numbers = [-1,0], target = -1"
      output: "[1,2]"
  constraints:
    - "2 <= numbers.length <= 3 * 10^4"
    - "-1000 <= numbers[i] <= 1000"
    - "numbers is sorted in non-decreasing order."
    - "-1000 <= target <= 1000"
    - "The tests are generated such that there is exactly one solution."

constraint_quiz:
  prompt: >-
    N can be 3 × 10⁴ and you may only use constant extra space. What should you aim for?
  options:
    - "O(N²) time, O(1) space"
    - "O(N) time, O(N) space"
    - "O(N log N) time, O(1) space"
    - "O(N) time, O(1) space"
  answer: 3
  explanation: >-
    O(N²) is ~4.5 × 10⁸ pair checks, too slow. O(N) time with O(N) space is Two Sum's hash map,
    which breaks the constant-space rule. Binary-searching the complement of each element is
    O(N log N) with O(1) space; it passes, but it uses the sorting only within each search.
    Two pointers from both ends use the order on every step: O(N) time, O(1) space.

pattern_quiz:
  prompt: >-
    The array is sorted, you need a pair summing to target, and extra space must be O(1).
    Which pattern fits?
  options:
    - "Hash map of value → index, as in Two Sum"
    - "Two pointers from both ends, moving inward"
    - "Sliding window"
    - "Prefix sums"
  answer: 1
  explanation: >-
    The hash map works on any order, but it costs O(N) space, which is forbidden here, and it
    throws away the sorted order you were given for free. A sliding window needs a contiguous
    range, but the two numbers can be far apart. Prefix sums answer range-sum questions, not pair
    sums. "Sorted" plus "pair that adds up to" plus "constant space" is the opposite-ends trigger:
    the sum's comparison with target tells you which end to discard.

