hints:
- 'If method == ''late_binding'', use [lambda x: x * m for m in multipliers].'
- 'If method == ''default_arg'', freeze with [lambda x, factor=m: x * factor for m in multipliers].'
- 'If method == ''factory_function'', use an enclosing def factory(f): return lambda x: x * f.'
solution:
  code: "class Solution:\n    def evaluate_closure_binding(self, multipliers: list[int], value: int, method: str) -> list[int]:\n\
    \        if not multipliers:\n            return []\n            \n        if method == \"late_binding\":\n          \
    \  funcs = [lambda x: x * m for m in multipliers]\n        elif method == \"default_arg\":\n            funcs = [lambda\
    \ x, factor=m: x * factor for m in multipliers]\n        elif method == \"factory_function\":\n            def make_multiplier(f):\n\
    \                return lambda x: x * f\n            funcs = [make_multiplier(m) for m in multipliers]\n        else:\n\
    \            return []\n            \n        return [f(value) for f in funcs]\n"
  explanation: Exposes how Python scopes closures by reference to enclosing frames, and demonstrates early-binding remedies
    using default parameters and factory closures.
  time: O(N) where N is the length of multipliers
  space: O(N) to store closure references and results
pitch_script: '**(Clarify)** "We need to demonstrate how closures capture variable references in Python loops, contrasting
  late binding against early binding via default arguments and factory functions."


  **(Basement Insight)** "Python functions capture variable names in closures rather than copying their values. When executed
  after the loop finishes, all lambdas look up the same final loop variable."


  **(Solution)** "We implement all three strategies: the standard late-binding loop, default parameter binding where values
  freeze at definition time, and factory functions that allocate separate stack frames."


  **(Complexity)** "Executes in O(N) time and O(N) space."

  '
