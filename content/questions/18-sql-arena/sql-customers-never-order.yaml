    hint: "Use `WHERE NOT EXISTS (SELECT 1 FROM Orders o WHERE o.customerId = c.id)`."

hints:
  - "Perform a `LEFT JOIN` from `Customers c` to `Orders o` on `c.id = o.customerId`."
  - "If a customer has no orders, all columns from `Orders` will be `NULL` in the result row."
  - "Add `WHERE o.id IS NULL` and alias the column as `Customers`."

solution:
  code: |
    SELECT c.name AS Customers
    FROM Customers c
    LEFT JOIN Orders o ON c.id = o.customerId
    WHERE o.id IS NULL;
  explanation: |
    1. `FROM Customers c LEFT JOIN Orders o ON c.id = o.customerId`: keeps every customer row.
       For customers with matching orders, order columns are populated; for customers with no orders,
       order columns are set to `NULL`.
    2. `WHERE o.id IS NULL`: filters out all rows where an order was found, leaving only customers with zero orders.
    3. `SELECT c.name AS Customers`: projects the requested column name.
  time: O(C + O) using hash anti-join
  space: O(O) for in-memory hash table of Orders

pitch_script: |
  **(Clarify)** "We need to return the names of all customers who do not have any corresponding records in the Orders table."

  **(Basement Insight)** "While `NOT IN (SELECT customerId FROM Orders)` seems intuitive, if `customerId` in Orders contains a single NULL value, three-valued SQL logic causes the entire query to evaluate to UNKNOWN and return zero rows. A `LEFT JOIN ... WHERE o.id IS NULL` Anti-Join is immune to NULL bugs and evaluates via a linear hash join."

  **(Solution)** "We LEFT JOIN `Customers c` with `Orders o` on `c.id = o.customerId`. For customers with no purchases, `o.id` evaluates to NULL. We filter `WHERE o.id IS NULL` and select `c.name AS Customers`."

  **(Complexity)** "Executes in O(C + O) time, requiring O(O) space for the join hash table."

twist:
  lc: 9314
  title: NOT EXISTS Correlated Subquery Optimization
  why: >-
    In modern query optimizers, SELECT c.name FROM Customers c WHERE NOT EXISTS (SELECT 1 FROM Orders o WHERE o.customerId = c.id)
    often produces an identical Hash Anti-Join execution plan while being even more readable.

