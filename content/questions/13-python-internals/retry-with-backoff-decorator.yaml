drills:
  - title: Basic function wrapper
    skill: setup
    goal: Wrap a function call with a decorator to double the returned integer.
    instructions: |
      Write a decorator `double_result` that doubles the return value of any function returning an integer.
    function:
      name: test_double
      params: [{name: val}]
    starter_code: |
      class Solution:
          def test_double(self, val: int) -> int:
              pass
    tests:
      - {args: [5], expected: 10}
      - {args: [0], expected: 0}
      - {args: [-3], expected: -6}
    solution: |
      import functools

      def double_result(fn):
          @functools.wraps(fn)
          def wrapper(*args, **kwargs):
              return fn(*args, **kwargs) * 2
          return wrapper

      class Solution:
          def test_double(self, val: int) -> int:
              @double_result
              def get_num(x):
                  return x
              return get_num(val)
    hint: "Return fn(*args, **kwargs) * 2 from the wrapper."

  - title: Exponential backoff calculation
    skill: core
    goal: Calculate backoff delay sequence.
    instructions: |
      Given `attempt_count` failures, return the list of delays `[2**(i-1) for i in 1..count]`.
    function:
      name: compute_delays
      params: [{name: count}]
    starter_code: |
      class Solution:
          def compute_delays(self, count: int) -> list[int]:
              pass
    tests:
      - {args: [1], expected: [1]}
      - {args: [3], expected: [1, 2, 4]}
      - {args: [0], expected: []}
    solution: |
      class Solution:
          def compute_delays(self, count: int) -> list[int]:
              return [2 ** i for i in range(count)]
    hint: "Use [2 ** i for i in range(count)]."

  - title: Exception catching helper
    skill: edge
    goal: Catch ConnectionError and record failure.
    instructions: |
      Call `fn()`. If it raises ConnectionError, return `"CAUGHT"`, otherwise return its result.
    function:
      name: safe_invoke
      params: [{name: should_fail}]
    starter_code: |
      class Solution:
          def safe_invoke(self, should_fail: bool) -> str:
              pass
    tests:
      - {args: [true], expected: "CAUGHT"}
      - {args: [false], expected: "OK"}
    solution: |
      class Solution:
          def safe_invoke(self, should_fail: bool) -> str:
              def worker():
                  if should_fail:
                      raise ConnectionError("drop")
                  return "OK"
              try:
                  return worker()
              except ConnectionError:
                  return "CAUGHT"
    hint: "Wrap call in try: ... except ConnectionError: return 'CAUGHT'."

hints:
  - "Track state: current attempt counter and a list to record delays."
  - "The worker raises ConnectionError until count reaches attempts_needed."
  - "Loop up to max_retries: if exception occurs, calculate delay = 2 ** (attempt - 1), append to delays, and continue."

solution:
  code: |
    import functools

    class Solution:
        def execute_resilient_call(self, attempts_needed: int, max_retries: int) -> dict:
            call_count = 0

            def flaky_worker():
                nonlocal call_count
                call_count += 1
                if call_count < attempts_needed:
                    raise ConnectionError(f"Transient error on attempt {call_count}")
                return "SUCCESS"

            def retry(max_attempts):
                def decorator(fn):
                    @functools.wraps(fn)
                    def wrapper():
                        delays = []
                        for attempt in range(1, max_attempts + 1):
                            try:
                                fn()
                                return {
                                    "success": True,
                                    "attempts": attempt,
                                    "delays": delays,
                                }
                            except ConnectionError:
                                delay = 2 ** (attempt - 1)
                                delays.append(delay)
                        return {
                            "success": False,
                            "attempts": max_attempts,
                            "delays": delays,
                        }
                    return wrapper
                return decorator

            wrapped_call = retry(max_attempts=max_retries)(flaky_worker)
            return wrapped_call()
  explanation: |
    The parameterized decorator `retry(max_attempts)` provides clean encapsulation.
    The outer factory receives `max_attempts`, the middle decorator takes `fn`, and the inner `wrapper`
    manages the retry loop.
    
    Inside `wrapper`, each failure appends `2 ** (attempt - 1)` to the delay log. If the worker succeeds,
    it returns immediately with `"success": True`. If the loop finishes without success, it safely returns
    `"success": False` with all recorded delays.
  time: O(M) where M is max_retries
  space: O(M) for the delay history

pitch_script: |
  **(Clarify)** "We need to construct a parameterized retry decorator that catches transient ConnectionErrors and applies exponential backoff delays."

  **(Basement Insight)** "A parameterized decorator in Python requires 3 closures: the factory that receives configuration, the decorator that receives the target callable, and the wrapper that intercepts runtime calls. Using `@functools.wraps` guarantees metadata preservation."

  **(Solution)** "We build `@retry(max_attempts=K)`. The wrapper runs a loop over attempts. When a `ConnectionError` is caught, we record the exponential backoff `2 ** (attempt - 1)` and retry. If attempts are exhausted, we suppress the failure and return structured telemetry."

  **(Complexity)** "Executes in O(K) where K is the number of attempts, using O(K) auxiliary space to log backoff delays."

twist:
  lc: 9205
  title: Jittered Backoff & Circuit Breaker Pattern
  why: >-
    In high-concurrency systems, simultaneous retries create a 'thundering herd' spike.
    Full jitter (randomizing delay between 0 and 2^k) and circuit breaking prevent backend saturation.

