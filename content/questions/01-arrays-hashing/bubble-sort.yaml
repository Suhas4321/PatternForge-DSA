drills:
  - title: Adjacent Compare and Swap
    skill: core
    goal: Compare two adjacent elements and swap if out of order.
    instructions: Given a list of integers `nums` and an index `j`, if `nums[j] > nums[j + 1]`, swap them in place. Return `nums`.
    function:
      name: swapAdjacent
      params:
        - name: nums
        - name: j
      returns: any
      compare: exact
      inplace_arg: 0
    starter_code: |
      class Solution:
          def swapAdjacent(self, nums: list[int], j: int) -> list[int]:
              pass
    tests:
      - args: [[5, 2], 0]
        expected: [2, 5]
        note: Out of order pair
      - args: [[2, 5], 0]
        expected: [2, 5]
        note: Already ordered pair
      - args: [[3, 3], 0]
        expected: [3, 3]
        note: Equal values
    solution: |
      class Solution:
          def swapAdjacent(self, nums: list[int], j: int) -> list[int]:
              if nums[j] > nums[j + 1]:
                  nums[j], nums[j + 1] = nums[j + 1], nums[j]
              return nums
    hint: "Use tuple unpacking: `nums[j], nums[j+1] = nums[j+1], nums[j]`."
  - title: Single Pass Bubble
    skill: setup
    goal: Implement a single sweep that bubbles the maximum value to the end.
    instructions: Perform one single pass through `nums` from index 0 to `len(nums) - 2`, swapping adjacent inverted pairs. Return `nums`.
    function:
      name: singlePass
      params:
        - name: nums
      returns: any
      compare: exact
      inplace_arg: 0
    starter_code: |
      class Solution:
          def singlePass(self, nums: list[int]) -> list[int]:
              pass
    tests:
      - args: [[4, 1, 3, 2]]
        expected: [1, 3, 2, 4]
        note: Largest element 4 bubbles to the end
      - args: [[1, 2, 3]]
        expected: [1, 2, 3]
        note: No changes on sorted list
      - args: [[2, 1]]
        expected: [1, 2]
        note: Two element inversion
    solution: |
      class Solution:
          def singlePass(self, nums: list[int]) -> list[int]:
              for j in range(len(nums) - 1):
                  if nums[j] > nums[j + 1]:
                      nums[j], nums[j + 1] = nums[j + 1], nums[j]
              return nums
    hint: "Iterate `j` from 0 up to `len(nums) - 2`."
  - title: Full Bubble Sort Guard
    skill: edge
    goal: Handle single element and empty arrays safely.
    instructions: Sort `nums` in place, returning immediately if `len(nums) <= 1`.
    function:
      name: safeSort
      params:
        - name: nums
      returns: any
      compare: exact
      inplace_arg: 0
    starter_code: |
      class Solution:
          def safeSort(self, nums: list[int]) -> list[int]:
              pass
    tests:
      - args: [[]]
        expected: []
        note: Empty list
      - args: [[7]]
        expected: [7]
        note: Single element
      - args: [[3, 1]]
        expected: [1, 3]
        note: Two elements
    solution: |
      class Solution:
          def safeSort(self, nums: list[int]) -> list[int]:
              n = len(nums)
              for i in range(n):
                  for j in range(0, n - i - 1):
                      if nums[j] > nums[j + 1]:
                          nums[j], nums[j + 1] = nums[j + 1], nums[j]
              return nums
    hint: "If n <= 1, the nested range loops execute zero iterations naturally."
hints:
  - "How does comparing adjacent elements guarantee the largest element reaches the end?"
  - "After pass i, elements from index n - i to n - 1 are in their final positions, so inner loop only needs to run up to n - i - 1."
  - |
    for i from 0 to n - 1:
        for j from 0 to n - i - 2:
            if nums[j] > nums[j + 1]:
                swap(nums[j], nums[j + 1])
solution:
  code: |
    class Solution:
        def bubbleSort(self, nums: list[int]) -> list[int]:
            n = len(nums)
            for i in range(n):
                for j in range(0, n - i - 1):
                    if nums[j] > nums[j + 1]:
                        nums[j], nums[j + 1] = nums[j + 1], nums[j]
            return nums
  explanation: |
    We maintain the invariant that after each iteration `i` of the outer loop, the largest remaining unsorted element has bubbled up to its correct final index `n - i - 1`.

    In the inner loop, pointer `j` scans from index 0 to `n - i - 1`. If `nums[j] > nums[j + 1]`, the two elements are out of order and swapped. By shrinking the inner loop boundary by `i` on each pass, we avoid redundant comparisons on already sorted elements.
  time: O(n^2) — n passes with average n/2 comparisons each
  space: O(1) — in-place adjacent swaps using constant auxiliary memory
  brute_force_code: |
    class Solution:
        def bubbleSort(self, nums: list[int]) -> list[int]:
            # Naive unoptimized bubble sort without shrinking inner bound
            n = len(nums)
            for i in range(n):
                for j in range(n - 1):
                    if nums[j] > nums[j + 1]:
                        nums[j], nums[j + 1] = nums[j + 1], nums[j]
            return nums
pitch_script: |
  **(Clarify)** "I will clarify the requirements: we are given an array of integers `nums`, and need to sort it in ascending order in place using the adjacent swapping mechanism of Bubble Sort. The array may contain duplicates or negative values."

  **(Brute force)** "A naive sorting approach might re-check all pairs repeatedly or allocate extra arrays, but that still costs quadratic operations and unnecessary memory."

  **(Trigger)** "The trigger here is the explicit requirement to compare adjacent elements and bubble the largest value rightward on each pass."

  **(Optimal)** "My optimal in-place strategy uses two loops: the outer loop tracks pass `i`, while the inner loop compares neighboring elements `nums[j]` and `nums[j+1]` up to `n - i - 1`. If `nums[j] > nums[j+1]`, we swap them in O(1). After `i` passes, the suffix of length `i` is permanently sorted."

  **(Complexity)** "This runs in O(n^2) worst- and average-case time with O(1) auxiliary space, modifying the input array completely in place."
