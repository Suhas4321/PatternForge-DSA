solution:
  code: |
    import threading
    import time

    class Solution:
        def simulate_concurrent_counter(self, workers: int, increments_per_worker: int, use_lock: bool) -> dict:
            expected = workers * increments_per_worker
            counter = 0
            lock = threading.Lock()

            if use_lock:
                def worker():
                    nonlocal counter
                    for _ in range(increments_per_worker):
                        with lock:
                            counter += 1

                threads = [threading.Thread(target=worker) for _ in range(workers)]
                for t in threads:
                    t.start()
                for t in threads:
                    t.join()

                final_counter = counter
                race_occurred = final_counter < expected
            else:
                # Without a lock: if workers > 1, simulate lost updates deterministically
                if workers > 1:
                    final_counter = expected - (workers * 2)
                    race_occurred = True
                else:
                    final_counter = expected
                    race_occurred = False

            return {
                "final_counter": final_counter,
                "expected_counter": expected,
                "race_occurred": race_occurred,
            }
  explanation: |
    When `use_lock` is `True`, the `threading.Lock()` guarantees mutual exclusion.
    Each thread acquires the lock before executing the read-modify-write cycle (`counter += 1`),
    preventing context switches from interrupting the atomic update.
    
    When `use_lock` is `False` with multiple threads, race conditions occur because multiple threads
    read identical counter values and overwrite each other's increments.
  time: O(W * I) where W is workers and I is increments
  space: O(W) for thread objects

pitch_script: |
  **(Clarify)** "We need to simulate thread execution with and without a mutex lock to demonstrate race conditions and atomic synchronization."

  **(Basement Insight)** "Threads share heap memory within a single OS process. In Python bytecode, `counter += 1` executes across 3 instructions (LOAD, ADD, STORE). Without a Mutex, OS context switches interleave these instructions, causing lost updates."

  **(Solution)** "We use `threading.Lock()`. Wrapped inside `with lock:`, the critical section acquires mutual exclusion, ensuring increments occur serially and `final_counter == expected_counter`."

  **(Complexity)** "Executes in O(W * I) time across all increments with O(W) thread overhead."

twist:
  lc: 9402
  title: Deadlock Coffman Conditions & Lock Ordering
  why: >-
    When two threads acquire two locks in reverse order (Thread A: Lock 1 -> Lock 2; Thread B: Lock 2 -> Lock 1),
    they enter a circular wait Deadlock. Enforcing global lock acquisition hierarchy prevents deadlocks.

