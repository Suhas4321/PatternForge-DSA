    - - T1
      - T2
    - - T3
  solution: "class Solution:\n    def drill_handoff(self, granted: list, waiting: list) -> list:\n        if waiting:\n  \
    \          granted.append(waiting.pop(0))\n        return [granted, waiting]\n"
  hint: Pop index 0 from waiting and append to granted.
- skill: edge
  title: Detect permit overflow
  goal: Check if release exceeds capacity.
  instructions: Return `True` if `available >= capacity and len(waiting) == 0`, else `False`.
  function:
    name: drill_is_overflow
    params:
    - name: available
    - name: capacity
    - name: waiting
  starter_code: "class Solution:\n    def drill_is_overflow(self, available: int, capacity: int, waiting: list) -> bool:\n\
    \        pass\n"
  tests:
  - args:
    - 2
    - 2
    - []
    expected: true
  - args:
    - 1
    - 2
    - []
    expected: false
  - args:
    - 2
    - 2
    - - T1
    expected: false
  solution: "class Solution:\n    def drill_is_overflow(self, available: int, capacity: int, waiting: list) -> bool:\n   \
    \     return available >= capacity and len(waiting) == 0\n"
  hint: Check if available >= capacity when waiting is empty.
hints:
- Initialize `available = capacity`, `granted = []`, `waiting = []`, and `overflow_errors = 0`.
- When releasing, if a thread is waiting, directly transfer the permit to it without incrementing `available`.
- '| # Pseudocode Blueprint

  | available = capacity, granted = [], waiting = []

  | for t, op in operations:

  |     if op == "ACQUIRE":

  |         if available > 0: available -= 1; granted.append(t)

  |         else: waiting.append(t)

  |     elif op == "RELEASE":

  |         if available >= capacity and not waiting: overflow += 1

  |         else:

  |             if t in granted: granted.remove(t)

  |             if waiting: granted.append(waiting.pop(0))

  |             else: available += 1'
solution:
  code: "class Solution:\n    def simulate_bounded_semaphore(self, capacity: int, operations: list[list[str]]) -> dict:\n\
    \        available = capacity\n        granted = []\n        waiting = []\n        overflow_errors = 0\n\n        for\
    \ thread_id, op in operations:\n            if op == \"ACQUIRE\":\n                if available > 0:\n               \
    \     available -= 1\n                    granted.append(thread_id)\n                else:\n                    waiting.append(thread_id)\n\
    \            elif op == \"RELEASE\":\n                if available >= capacity and not waiting:\n                    overflow_errors\
    \ += 1\n                else:\n                    if thread_id in granted:\n                        granted.remove(thread_id)\n\
    \                    if waiting:\n                        next_t = waiting.pop(0)\n                        granted.append(next_t)\n\
    \                    else:\n                        available += 1\n\n        return {\n            \"available_permits\"\
    : available,\n            \"granted\": granted,\n            \"waiting\": waiting,\n            \"overflow_errors\": overflow_errors,\n\
    \        }\n"
  explanation: A bounded semaphore guarantees that permits never exceed the initial capacity. When a thread releases a permit
    while others are waiting in the queue, the permit is directly transferred to the next waiting thread, maintaining constant
    permit volume.
  time: O(N) where N is the number of operations
  space: O(capacity + waiting_threads) for tracking permits and queue
pitch_script: '**(Clarify)** "We need to simulate a bounded semaphore with capacity limits, tracking granted threads, a FIFO
  waiting queue, and overflow errors."


  **(Brute force)** "An unbounded semaphore increments its permit counter indefinitely on release(), hiding bugs where release
  is invoked without a matching acquire."


  **(Trigger)** "Tracking a fixed capacity of permits with blocked threads entering a waiting list indicates a bounded semaphore
  simulator."


  **(Optimal)** "We maintain available permits and a waiting queue. On ACQUIRE, we grant immediately if available > 0, else
  queue. On RELEASE, if already at capacity with an empty queue, we record an overflow error. Otherwise, we pop from the waiting
  queue to grant the next thread or restore the permit."


  **(Complexity)** "Runs in O(N) time with O(C + W) space for granted and waiting queues." '
