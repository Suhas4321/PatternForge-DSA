slug: non-overlapping-intervals
lc: 435

concept:
  problem_it_solves: >-
    "What is the fewest I must throw away so nothing clashes?" That is the same as asking for
    the largest set of intervals that can all stay, because removals = N − kept. Keeping the most
    intervals on one shared resource is the classic activity-selection problem, and it has a
    one-pass greedy answer once you sort by end.
  brute_force: >-
    Try every subset of intervals, check whether it is clash-free, and keep the largest one. The
    work explodes because the same small conflicts are re-checked in every one of the 2ᴺ
    subsets that contain them. A smarter DP (longest chain ending at each interval) is still
    O(N²), re-scanning all earlier intervals for each one.
  brute_force_complexity: >-
    O(2ᴺ · N log N) time for subsets (sort and check each one), O(N²) for the DP — with 10⁵
    intervals even the DP is 10¹⁰ steps.
  key_insight: >-
    Sort by END, not by start. The interval that finishes first is always safe to keep: take
    any optimal answer and swap its first interval for the earliest-finishing one; that one ends
    no later, so it cannot clash with anything the optimal answer kept after it. Same count, so
    keeping it never hurts. Then repeat on whatever starts at or after its end. One pass, one
    variable (the end of the last kept interval), and the answer is N − kept.
  real_world: >-
    This is interval scheduling on a single resource: one meeting room, one GPU slot, one
    broadcast channel, one homepage banner. Ad servers and TV playout systems maximise the
    number of non-clashing slots this way, and job schedulers use earliest-deadline ordering
    for the same exchange-argument reason.

statement:
  clean: |
    Given an array of intervals `intervals` where `intervals[i] = [start_i, end_i]`, return the
    **minimum number of intervals you need to remove** to make the rest of the intervals
    **non-overlapping**.

    Note that intervals which **only touch at a point are non-overlapping**. For example,
    `[1,2]` and `[2,3]` are non-overlapping.
  oa_story: |
    **BazaarBeacon Deals — OA Round 1**

    BazaarBeacon is a hyperlocal deals app for Bengaluru neighbourhoods like Malleswaram and
    Indiranagar. Its homepage has one hero banner, and merchants bid for it with campaigns that
    run from hour `a` to hour `b` of the festival week. Only one campaign can be on the banner
    at any moment. A campaign ending at hour 14 and another starting at hour 14 can both run,
    since the banner switches over instantly.

    The approvals team wants to reject as few campaigns as possible so that the approved ones
    never need the banner at the same time. Given every submitted campaign as `[a, b]` (up to
    100,000 of them, in the order they were submitted), return the minimum number of campaigns
    that must be rejected.
  trigger_keywords: ["minimum number of intervals you need to remove", "non-overlapping", "only touch at a point are non-overlapping"]
  examples:
    - input: "intervals = [[1,2],[2,3],[3,4],[1,3]]"
      output: "1"
      explanation: "Remove [1,3] and the rest are non-overlapping."
    - input: "intervals = [[1,2],[1,2],[1,2]]"
      output: "2"
      explanation: "Only one copy of [1,2] can stay."
    - input: "intervals = [[1,2],[2,3]]"
      output: "0"
      explanation: "They only touch at 2, so nothing needs to be removed."
  constraints:
    - "1 <= intervals.length <= 10^5"
    - "intervals[i].length == 2"
    - "-5 * 10^4 <= start_i < end_i <= 5 * 10^4"

constraint_quiz:
  prompt: With up to 10⁵ intervals, what time complexity do you need?
  options: ["O(2ᴺ)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 2
  explanation: >-
    Trying subsets is exponential and hopeless past ~20 intervals. The O(N²) longest-chain DP
    is correct but 10¹⁰ steps at N = 10⁵. Sorting by end is O(N log N) and the greedy pass after
    it is O(N), so O(N log N) is the target. Plain O(N) isn't available because the input is
    unsorted and the greedy depends on processing intervals in end order.

pattern_quiz:
  prompt: >-
    You want to keep as many intervals as possible with no two overlapping. Which greedy rule is
    actually correct?
  options:
    - "Sort by start; keep an interval if it doesn't clash with the last kept one"
    - "Sort by end; keep an interval if it starts at or after the last kept end"
    - "Sort by length; keep the shortest intervals first"
    - "Keep intervals in input order and drop any that clash"
  answer: 1
  explanation: >-
    "Maximum number of non-overlapping" (and so "minimum removals") is the sort-by-end trigger.
    Sorting by start fails on [[1,100],[2,3],[4,5]]: [1,100] starts first, gets kept, and blocks
    two intervals. Shortest-first fails on [[1,5],[4,7],[6,10]]: the shortest, [4,7], clashes
    with both others, so you keep 1 instead of 2. Input order has no guarantee at all. Earliest
    end is the only rule with an exchange argument: it leaves the most room for everything else.

