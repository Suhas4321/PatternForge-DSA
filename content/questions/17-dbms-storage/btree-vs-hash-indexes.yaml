drills:
  - title: B-Tree depth calculation
    skill: setup
    goal: Calculate floor(log2(N)) + 1 depth.
    instructions: |
      Return `math.floor(math.log2(n)) + 1` if `n > 0`, else 0.
    function:
      name: calc_tree_depth
      params: [{name: n}]
    starter_code: |
      class Solution:
          def calc_tree_depth(self, n: int) -> int:
              pass
    tests:
      - {args: [4], expected: 3}
      - {args: [8], expected: 4}
      - {args: [0], expected: 0}
    solution: |
      import math

      class Solution:
          def calc_tree_depth(self, n: int) -> int:
              if n <= 0:
                  return 0
              return math.floor(math.log2(n)) + 1
    hint: "Use `math.floor(math.log2(n)) + 1` for n > 0."

  - title: Count keys in range
    skill: core
    goal: Count elements in inclusive interval [a, b].
    instructions: |
      Count how many numbers in sorted `keys` satisfy `a <= x <= b`.
    function:
      name: count_in_interval
      params: [{name: keys}, {name: a}, {name: b}]
    starter_code: |
      class Solution:
          def count_in_interval(self, keys: list[int], a: int, b: int) -> int:
              pass
    tests:
      - {args: [[10, 20, 30, 40], 20, 35], expected: 2}
      - {args: [[1, 2, 3], 10, 20], expected: 0}
    solution: |
      class Solution:
          def count_in_interval(self, keys: list[int], a: int, b: int) -> int:
              return sum(1 for x in keys if a <= x <= b)
    hint: "Use `sum(1 for x in keys if a <= x <= b)`."

  - title: Hash index point equality
    skill: edge
    goal: Check if target exists in hash set.
    instructions: |
      Return `1` if `target in set(keys)` else `0`.
    function:
      name: hash_contains
      params: [{name: keys}, {name: target}]
    starter_code: |
      class Solution:
          def hash_contains(self, keys: list[int], target: int) -> int:
              pass
    tests:
      - {args: [[1, 2, 3], 2], expected: 1}
      - {args: [[1, 2], 5], expected: 0}
    solution: |
      class Solution:
          def hash_contains(self, keys: list[int], target: int) -> int:
              return 1 if target in set(keys) else 0
    hint: "Check `target in set(keys)`."

hints:
  - "Import `math`. If `not keys`, set `tree_depth = 0`, else `math.floor(math.log2(len(keys))) + 1`."
  - "If `query_type == 'point'`, return `hash_supported: True, hash_hops: 1, btree_supported: True, btree_hops: tree_depth`."
  - "If `query_type == 'range'`, return `hash_supported: False, hash_hops: 0, btree_supported: True, btree_hops: tree_depth + count`."

solution:
  code: |
    import math

    class Solution:
        def benchmark_index_lookup(self, keys: list[int], query_type: str, target: int, range_end: int = 0) -> dict:
            if not keys:
                tree_depth = 0
            else:
                tree_depth = math.floor(math.log2(len(keys))) + 1

            if query_type == "point":
                return {
                    "hash_supported": True,
                    "hash_hops": 1,
                    "btree_supported": True,
                    "btree_hops": tree_depth,
                }
            elif query_type == "range":
                matching_count = sum(1 for k in keys if target <= k <= range_end)
                return {
                    "hash_supported": False,
                    "hash_hops": 0,
                    "btree_supported": True,
                    "btree_hops": tree_depth + matching_count,
                }
            else:
                return {}
  explanation: |
    For equality queries (`WHERE id = target`), a Hash index accesses the bucket in O(1) time (1 hop),
    while a B-Tree traverses down from root to leaf in O(log N) page hops.
    
    For range queries (`WHERE id BETWEEN target AND range_end`), Hash indexes cannot be used because
    hashing destroys order. The B-Tree locates the lower bound in `tree_depth` hops, then scans
    consecutive leaf pages horizontally, adding 1 hop per matching key.
  time: O(K) where K is matching keys in range query
  space: O(1) auxiliary working memory

pitch_script: |
  **(Clarify)** "We need to benchmark how Hash indexes and B-Tree indexes execute point equality versus range queries in database engines."

  **(Basement Insight)** "Hash indexes compute a bucket hash in O(1) time, but because hash functions do not preserve key ordering, they cannot perform range comparisons or ORDER BY operations. B-Trees maintain sorted, doubly-linked leaf pages, allowing logarithmic point searches followed by fast sequential leaf traversals."

  **(Solution)** "We calculate B-Tree depth as `floor(log2(N)) + 1`. For point queries, Hash takes 1 hop and B-Tree takes `depth` hops. For range queries, Hash is unsupported (0 hops) while B-Tree performs `depth` hops plus 1 hop per matched key."

  **(Complexity)** "Executes in O(K) time for range evaluation and O(1) space."

twist:
  lc: 9303
  title: Covering Index Only Scans
  why: >-
    If the index contains all columns requested by the SELECT statement (e.g. CREATE INDEX idx ON emp (dept, salary)),
    the engine skips reading the Heap page entirely. This is called an Index-Only (Covering) Scan.

