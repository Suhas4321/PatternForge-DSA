slug: flood-fill
lc: 733

concept:
  problem_it_solves: >-
    "Starting from one cell, which cells can I reach by stepping only onto cells like it?" That is
    a graph question in disguise: every cell is a node, and every pair of side-by-side cells is an
    edge. Once you see the grid as a graph, "recolour the whole region" is just "visit every node
    reachable from the start", which is exactly what depth-first search does.
  brute_force: >-
    Without a traversal you end up sweeping the whole image again and again: on each sweep, recolour
    any original-colour pixel that touches an already-filled pixel, and stop when a sweep changes
    nothing. A long snake-shaped region grows by only one pixel per sweep, so you re-read the entire
    image once for every pixel in the region, even though each sweep learns almost nothing new.
  brute_force_complexity: >-
    O((M·N)²) time, O(M·N) space for the filled set — a 50 × 50 image is 2,500 pixels, so a
    snake-shaped region costs up to ~6 × 10⁶ pixel reads, and the same idea on a 300 × 300 grid
    is ~8 × 10⁹.
  key_insight: >-
    Treat the grid as a graph: node = (r, c), edges = the 4 neighbours (r+1, c), (r-1, c),
    (r, c+1), (r, c-1). From the start pixel, a DFS steps to every neighbour that is (1) inside the
    grid and (2) still the original colour, and it recolours a pixel the moment it arrives. The
    recolouring doubles as the "visited" mark: a recoloured pixel no longer matches the original
    colour, so the DFS never walks back onto it. That is the whole grid-DFS template: bounds check,
    "is this a node I want?" check, mark, recurse into 4 neighbours. Each pixel is visited at most
    once, so the work is proportional to the image size. The one trap: if the new colour equals
    the original, recolouring marks nothing, the DFS bounces between two pixels forever, and you
    must return early.
  real_world: >-
    This is literally the bucket tool in MS Paint, Photoshop and Figma, and the "magic wand"
    selection in image editors. Game engines use the same region fill to compute territory in Go
    or to reveal empty areas in Minesweeper, and GIS tools use it to find all map tiles connected
    to a flooded area.

statement:
  clean: |
    An image is given as an `m x n` grid of integers `image`, where `image[i][j]` is the colour of
    one pixel. You are also given three integers `sr`, `sc` and `color`.

    Perform a **flood fill** starting from the pixel `image[sr][sc]`:

    - Change the starting pixel to `color`.
    - Then repeat for every pixel that is **directly adjacent** (sharing a side: up, down, left or
      right, never diagonal) to a pixel you just changed and has the
      **same color as the starting pixel** had originally.
    - Stop when no more adjacent pixels of the original colour are left.

    Return the modified image.
  oa_story: |
    **PaintPixel Studio — OA Round 1**

    PaintPixel is a Bengaluru design-tools startup whose browser editor is used by sticker artists
    in Indiranagar cafes. Their most-used feature is the bucket tool: an artist taps one pixel of
    the canvas and the editor repaints the whole patch of identically coloured pixels around it,
    spreading only through pixels that touch side by side, not corner to corner.

    The canvas is a grid of integer colour codes. Given the canvas, the row and column of the
    tapped pixel, and the new colour code, return the canvas after the bucket tool has finished.
    Pixels of the same colour that are cut off from the tapped patch must stay untouched, and
    tapping with the colour the patch already has must not hang the editor.
  trigger_keywords: ["flood fill", "directly adjacent", "same color as the starting pixel"]
  examples:
    - input: "image = [[1,1,1],[1,1,0],[1,0,1]], sr = 1, sc = 1, color = 2"
      output: "[[2,2,2],[2,2,0],[2,0,1]]"
      explanation: >-
        Every 1 connected to the centre by side-sharing steps becomes 2. The bottom-right 1 only
        touches the centre diagonally, so it is not filled.
    - input: "image = [[0,0,0],[0,0,0]], sr = 0, sc = 0, color = 0"
      output: "[[0,0,0],[0,0,0]]"
      explanation: "The starting pixel already has the target colour, so nothing changes."
  constraints:
    - "m == image.length"
    - "n == image[i].length"
    - "1 <= m, n <= 50"
    - "0 <= image[i][j], color < 2^16"
    - "0 <= sr < m"
    - "0 <= sc < n"

constraint_quiz:
  prompt: >-
    The image is at most 50 × 50 = 2,500 pixels, and the same template will later run on grids of
    10⁵ cells. What time complexity should a flood fill aim for?
  options:
    - "O((M·N)²) — sweep the image until nothing changes"
    - "O(M·N · log(M·N)) — sort the pixels by colour first"
    - "O(M·N) — visit each pixel at most once"
    - "O(M + N) — walk the start row and column"
  answer: 2
  explanation: >-
    Repeated sweeps re-read the whole image once per filled pixel: fine for 2,500 pixels, hopeless
    at 10⁵ cells (10¹⁰ reads). Sorting by colour groups pixels of equal colour but says nothing
    about which ones touch, so it doesn't even answer the question. Walking only the start row and
    column misses regions that bend around corners. A DFS visits each pixel at most once and checks
    4 neighbours per pixel, so it is O(M·N), and you can't beat that because the region itself can
    be the whole image.

pattern_quiz:
  prompt: >-
    You must change every cell reachable from one start cell through side-sharing steps onto cells
    of the same value. Which pattern fits?
  options:
    - "Dynamic programming over rows, top-left to bottom-right"
    - "DFS/BFS from the start cell, treating 4-neighbours as graph edges"
    - "Sliding window over each row"
    - "Sort the cells by value and binary search for the start"
  answer: 1
  explanation: >-
    "Reachable from a start cell through adjacent cells with the same value" is the definition of a
    connected component in the grid graph, and DFS or BFS is how you collect one. A top-left to
    bottom-right DP fails as soon as the region turns upward or leftward, a row window can't follow
    a region into other rows, and sorting destroys the adjacency information you need.

