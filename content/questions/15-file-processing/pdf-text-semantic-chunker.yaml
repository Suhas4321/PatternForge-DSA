drills:
  - title: De-hyphenate broken words
    skill: setup
    goal: Merge words split across line breaks.
    instructions: |
      Replace `word-\nbreak` patterns with `wordbreak`.
    function:
      name: clean_hyphens
      params: [{name: s}]
    starter_code: |
      class Solution:
          def clean_hyphens(self, s: str) -> str:
              pass
    tests:
      - {args: ["trans-\naction"], expected: "transaction"}
      - {args: ["auto-\n mated"], expected: "automated"}
      - {args: ["normal-hyphen"], expected: "normal-hyphen"}
    solution: |
      import re

      class Solution:
          def clean_hyphens(self, s: str) -> str:
              return re.sub(r'(\w+)-\s*\n\s*(\w+)', r'\1\2', s)
    hint: 'Use regex substitution to merge hyphenated words across line breaks.'

  - title: Sliding window slice indexing
    skill: core
    goal: Generate start indices with fixed step.
    instructions: |
      Given total length `n`, `chunk_size` and `overlap`, return list of start indices.
    function:
      name: get_start_indices
      params: [{name: n}, {name: chunk_size}, {name: overlap}]
    starter_code: |
      class Solution:
          def get_start_indices(self, n: int, chunk_size: int, overlap: int) -> list[int]:
              pass
    tests:
      - {args: [6, 3, 1], expected: [0, 2, 4]}
      - {args: [2, 5, 1], expected: [0]}
      - {args: [0, 3, 1], expected: []}
    solution: |
      class Solution:
          def get_start_indices(self, n: int, chunk_size: int, overlap: int) -> list[int]:
              if n == 0:
                  return []
              step = chunk_size - overlap
              return list(range(0, n, step))
    hint: "Use range(0, n, chunk_size - overlap)."

  - title: Construct chunk dictionary
    skill: edge
    goal: Package token slice into chunk dict.
    instructions: |
      Return `{"chunk_id": cid, "text": " ".join(tokens), "token_count": len(tokens)}`.
    function:
      name: make_chunk_dict
      params: [{name: cid}, {name: tokens}]
    starter_code: |
      class Solution:
          def make_chunk_dict(self, cid: int, tokens: list[str]) -> dict:
              pass
    tests:
      - {args: [0, ["A", "B"]], expected: {"chunk_id": 0, "text": "A B", "token_count": 2}}
      - {args: [1, []], expected: {"chunk_id": 1, "text": "", "token_count": 0}}
    solution: |
      class Solution:
          def make_chunk_dict(self, cid: int, tokens: list[str]) -> dict:
              return {"chunk_id": cid, "text": " ".join(tokens), "token_count": len(tokens)}
    hint: "Use `' '.join(tokens)` and `len(tokens)`."

hints:
  - 'Use regex substitution to merge hyphenated words across line breaks.'
  - "Split the normalized string by whitespace into a list of word tokens."
  - "Step through indices with `step = chunk_size - overlap`, slicing `tokens[start:start+chunk_size]`."

solution:
  code: |
    import re

    class Solution:
        def chunk_document(self, raw_text: str, chunk_size: int, overlap: int) -> list[dict]:
            # Step 1: De-hyphenate broken words across line breaks
            cleaned = re.sub(r'(\w+)-\s*\n\s*(\w+)', r'\1\2', raw_text)
            # Step 2: Normalize remaining whitespace and tokenize
            tokens = cleaned.split()
            if not tokens:
                return []

            step = chunk_size - overlap
            chunks = []
            chunk_id = 0

            for start in range(0, len(tokens), step):
                chunk_tokens = tokens[start : start + chunk_size]
                chunks.append({
                    "chunk_id": chunk_id,
                    "text": " ".join(chunk_tokens),
                    "token_count": len(chunk_tokens),
                })
                chunk_id += 1
                if start + chunk_size >= len(tokens):
                    break

            return chunks
  explanation: |
    The pipeline begins by healing broken words split across lines using regular expression capture groups.
    Next, it splits the normalized string into word tokens.
    
    A sliding window then moves across the token sequence with `step = chunk_size - overlap`.
    Each window slice is packaged into a structured dictionary with metadata (`chunk_id`, `text`, `token_count`),
    providing clean document ingestion for vector database embedding models.
  time: O(N) where N is text length
  space: O(N) for tokens and generated chunks

pitch_script: |
  **(Clarify)** "We need to clean OCR/PDF hyphenation artifacts from raw text and divide it into overlapping semantic chunks for RAG embedding generation."

  **(Basement Insight)** "PDF text extraction often splits hyphenated words across lines, producing fragmented tokens that cause embedding searches to fail. Furthermore, chunking without overlap splits sentences across vector boundaries, dropping crucial context."

  **(Solution)** "We apply a regex replacement to heal hyphenated tokens across line breaks, tokenize into words, and slide a window with `step = chunk_size - overlap`. Each chunk is enriched with `chunk_id` and `token_count` metadata."

  **(Complexity)** "Executes in O(N) time across N characters, using O(N) auxiliary memory for token chunks."

