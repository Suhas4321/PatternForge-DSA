slug: asyncio-event-loop-semaphore
lc: 9403
citadel_id: os_concurrency
brick_layer: 3
runner_type: python_practical

concept:
  problem_it_solves: >-
    "What happens when you launch 1,000 asynchronous API requests simultaneously with asyncio.gather()?"
    Dispatching 1,000 requests at once creates 1,000 open sockets, triggering `ConnectionResetError`,
    exhausting operating system file descriptors, and triggering HTTP 429 rate limits from downstream providers.
    An `asyncio.Semaphore(K)` bounds concurrency to exactly K active tasks at any moment.
  brute_force: >-
    Executing tasks sequentially in a loop with `for task in tasks: await task()`.
    While safe, this completely abandons concurrency, turning a 2-second batch into a 5-minute crawl.
  brute_force_complexity: O(N * T) serialized wall-clock time.
  key_insight: >-
    An `asyncio.Semaphore(K)` maintains an internal counter. When a coroutine executes `async with sem:`,
    the counter decrements. If the counter reaches zero, subsequent tasks yield execution to the Event Loop
    and wait in a FIFO queue until an active task exits the context manager and releases a permit.
    This achieves optimal concurrency without overwhelming downstream services.
  real_world: >-
    Suhas's Drizz testing pipeline (throttling 100 mobile UI journeys to 25x concurrency), web scrapers, and LLM batch evaluation.

statement:
  clean: |
    Implement an asynchronous concurrency throttle using asyncio semaphore throttling:
    `async def simulate_async_throttle(task_count: int, max_concurrency: int) -> dict`.
    
    You need to dispatch `task_count` concurrent async jobs while bounding the number of active jobs to `max_concurrency`:
    1. Initialize an `asyncio.Semaphore(max_concurrency)`.
    2. Track:
       - `active_workers`: integer counter of tasks currently inside the critical section.
       - `max_observed`: the maximum value of `active_workers` observed during the entire execution.
    3. Define an async worker function:
       - Enters the semaphore: `async with sem:`.
       - Increments `active_workers += 1`.
       - Updates `max_observed = max(max_observed, active_workers)`.
       - Yields execution cooperatively: `await asyncio.sleep(0.001)`.
       - Decrements `active_workers -= 1`.
    4. Run all `task_count` workers concurrently using `await asyncio.gather(...)`.
    5. Return a dictionary containing:
       - `tasks_completed`: total number of completed tasks.
       - `max_concurrent_observed`: peak simultaneous workers observed (must be `<= max_concurrency`).
  oa_story: |
    **Drizz Mobile Evaluation — 25x Concurrency Throttling**
    
    When testing 100 mobile UI paths concurrently, naively executing `asyncio.gather(*all_100_tasks)`
    saturated our WebSocket gateway and exhausted downstream LLM rate limits.
    
    Implement this Semaphore-bounded executor to throttle parallel execution to exactly K active workers at any instant.
  trigger_keywords: ["asyncio semaphore throttling", "simulate_async_throttle", "task_count"]
  examples:
    - input: "task_count = 10, max_concurrency = 3"
      output: "{'tasks_completed': 10, 'max_concurrent_observed': 3}"
      explanation: "All 10 tasks execute, but at no point do more than 3 tasks run concurrently."
    - input: "task_count = 2, max_concurrency = 5"
      output: "{'tasks_completed': 2, 'max_concurrent_observed': 2}"
      explanation: "Total tasks (2) is less than semaphore limit (5), peak concurrency is 2."
  constraints:
    - "task_count >= 0"
    - "max_concurrency >= 1"

constraint_quiz:
  prompt: >-
    How does `asyncio.Semaphore` block excess coroutines without freezing the operating system thread?
  options:
    - "It uses time.sleep() in a while loop"
    - "It voluntarily yields control back to the Event Loop, allowing other running tasks to make progress"
    - "It spawns a new process"
    - "It crashes with an exception"
  answer: 1
  explanation: >-
    In asyncio, awaiting a semaphore does not block the thread; it suspends the coroutine and allows the single-threaded Event Loop to run other tasks.

pattern_quiz:
  prompt: Which statement correctly acquires and releases an asyncio semaphore within a coroutine?
  options:
    - "async with sem:"
    - "with sem:"
    - "sem.acquire_sync()"
    - "await sem.lock()"
  answer: 0
  explanation: >-
    `async with sem:` is the standard asynchronous context manager syntax that acquires and releases permits cooperatively.

