slug: heap-pages-and-scans
lc: 9301
citadel_id: sql_dbms
brick_layer: 1
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does running SELECT * FROM logs WHERE user_id = 999 take 15 seconds on an unindexed table even when returning only 1 row?"
    Relational databases do not store rows as text lines in a flat file. PostgreSQL and SQLite organize data into fixed-size
    disk blocks (typically 8KB Heap Pages). Without an index, the storage engine has no idea which page holds the record,
    forcing an exhaustive Sequential Table Scan that loads every single 8KB disk block into RAM buffer pool memory.
  brute_force: >-
    Executing unindexed `WHERE` queries across massive tables. The database reads gigabytes of raw disk blocks from storage,
    saturating disk I/O channels and blowing out database cache hit ratios.
  brute_force_complexity: O(N) disk page reads — reading millions of 8KB blocks.
  key_insight: >-
    Rows inside 8KB heap pages are addressed by physical Tuple IDs (`ctid`: page number, item index).
    An index is an auxiliary sorted structure mapping search keys directly to `ctid` pointers,
    allowing the database to read exactly 1 disk page instead of scanning thousands.
  real_world: >-
    Suhas's DynamoDB to PostgreSQL migration (reducing latency from 200ms to 20ms by eliminating full-table scans with indexed lookups),
    and diagnosing PostgreSQL `EXPLAIN ANALYZE` reports showing `Seq Scan on large_table`.

statement:
  clean: |
    Implement a database disk page storage simulator using 8kb heap pages:
    `simulate_heap_scan(records: list[dict], page_capacity: int, search_id: int) -> dict`.
    
    Given a list of database records where each record contains `{"id": int, "data": str}`:
    1. Organize the records sequentially into fixed-size disk heap pages, where each page holds at most `page_capacity` records.
       - Page indices start at 0.
       - A record's physical tuple identifier `ctid` is a 2-element tuple: `(page_index, slot_index)`.
    2. Simulate an unindexed Sequential Table Scan searching for the record where `id == search_id`:
       - The storage engine scans pages sequentially starting from page 0.
       - For each page, it scans the slots from 0 to `page_capacity - 1`.
       - If the target `search_id` is found, the scan halts immediately on that page.
    3. Return a dictionary containing:
       - `total_pages`: total number of allocated pages (0 if records is empty).
       - `pages_scanned`: number of disk pages loaded into memory before the target was found or table exhausted.
       - `found`: boolean indicating if the record was located.
       - `ctid`: the `[page_index, slot_index]` if found, otherwise `null`.
  oa_story: |
    **PostgreSQL Storage Engine — Buffer Pool Diagnostic**
    
    After migrating our test execution ledger from DynamoDB to PostgreSQL, query latency plummeted from 200ms to 20ms.
    However, an unindexed status query began triggering high disk I/O alerts during QA test runs.
    The DBA determined that the database was reading 1,200 8KB disk pages from NVMe storage on every request because
    it was performing a Full Table Scan.
    
    Build this physical heap page simulator to demonstrate how page-packing and sequential scans operate at the disk block layer.
  trigger_keywords: ["8kb heap pages", "simulate_heap_scan", "records"]
  examples:
    - input: "records = [{'id': 1, 'data': 'A'}, {'id': 2, 'data': 'B'}, {'id': 3, 'data': 'C'}], page_capacity = 2, search_id = 3"
      output: "{'total_pages': 2, 'pages_scanned': 2, 'found': True, 'ctid': [1, 0]}"
      explanation: "Page 0 has ids [1, 2], Page 1 has id [3]. Found on Page 1 slot 0 after scanning 2 pages."
    - input: "records = [{'id': 1, 'data': 'A'}], page_capacity = 2, search_id = 99"
      output: "{'total_pages': 1, 'pages_scanned': 1, 'found': False, 'ctid': null}"
      explanation: "Scanned all pages, target not found."
  constraints:
    - "records contains between 0 and 10,000 items"
    - "page_capacity >= 1"

constraint_quiz:
  prompt: >-
    In PostgreSQL, what does a physical Tuple ID (`ctid`) such as `(42, 7)` represent?
  options:
    - "Transaction ID 42 and timestamp 7"
    - "Heap Page Block 42 and Line Pointer / Slot 7 within that page"
    - "User ID 42 and table ID 7"
    - "B-Tree depth 42 and offset 7"
  answer: 1
  explanation: >-
    In PostgreSQL internals, `ctid` points directly to the physical disk location: (block_number, tuple_index).

pattern_quiz:
  prompt: What is the typical default disk page size in PostgreSQL and MySQL InnoDB?
  options:
    - "8KB in PostgreSQL, 16KB in InnoDB"
    - "1MB in both"
    - "512 bytes"
    - "64KB"
  answer: 0
  explanation: >-
    PostgreSQL allocates 8KB heap pages by default, while MySQL InnoDB uses 16KB pages.

