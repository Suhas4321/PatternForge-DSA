drills:
  - title: Initialize asyncio semaphore
    skill: setup
    goal: Create semaphore with permit capacity.
    instructions: |
      Return `sem._value` from `asyncio.Semaphore(k)`.
    function:
      name: get_sem_capacity
      params: [{name: k}]
    starter_code: |
      class Solution:
          def get_sem_capacity(self, k: int) -> int:
              pass
    tests:
      - {args: [5], expected: 5}
      - {args: [25], expected: 25}
    solution: |
      import asyncio

      class Solution:
          def get_sem_capacity(self, k: int) -> int:
              sem = asyncio.Semaphore(k)
              return sem._value
    hint: "Use `asyncio.Semaphore(k)._value`."

  - title: Async with semaphore acquisition
    skill: core
    goal: Acquire semaphore in an async context manager.
    instructions: |
      Inside `async with sem:`, append 1 to `res` and return `res`.
    function:
      name: test_sem_acquire
      params: []
    starter_code: |
      class Solution:
          async def test_sem_acquire(self) -> list[int]:
              pass
    tests:
      - args: []
        expected: [1]
    solution: |
      import asyncio

      class Solution:
          async def test_sem_acquire(self) -> list[int]:
              sem = asyncio.Semaphore(2)
              res = []
              async with sem:
                  res.append(1)
              return res
    hint: "Use `async with sem:` inside an async function."

  - title: Bounded peak observation
    skill: edge
    goal: Verify observed <= limit.
    instructions: |
      Return `min(observed, limit)`.
    function:
      name: bound_metric
      params: [{name: observed}, {name: limit}]
    starter_code: |
