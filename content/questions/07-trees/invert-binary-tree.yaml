  - {args: [[2, 1, 3]], expected: [2, 3, 1]}
  - {args: [[]], expected: [], note: "empty tree: return None"}
  - {args: [[1]], expected: [1], note: single node is its own mirror}
  - {args: [[1, 2]], expected: [1, null, 2], note: "a lone left child becomes a lone right child"}
  - {args: [[1, 2, null, 3, null, 4]], expected: [1, null, 2, null, 3, null, 4], note: "left-skewed becomes right-skewed"}
  - {args: [[1, 2, 3, 4, null, null, 5, 6]], expected: [1, 3, 2, 5, null, null, 4, null, null, null, 6], note: "lopsided tree: the null gaps move too"}
  - {args: [[5, 3, 8, 1, 4, 7, 9, 0, 2]], expected: [5, 8, 3, 9, 7, 4, 1, null, null, null, null, null, null, 2, 0], note: "swaps happen at every level, not just the top"}
visualize_test: 0

drills:
  - title: Swap one node's children
    skill: setup
    goal: Swap a node's two child pointers in one step, handling the empty tree.
    instructions: |
      Swap the left and right children of the **root only** (don't go deeper) and return the
      root. An empty tree stays empty.

      This is the local edit every call of the full solution performs. In Python, write it as
      one tuple assignment, `root.left, root.right = root.right, root.left`: both right-hand
      values are read before either pointer changes. Two separate assignments would lose one
      child, the classic invert bug.
    function:
      name: swapChildren
      params: [{name: root, type: TreeNode}]
      returns: TreeNode
    starter_code: |
      class Solution:
          def swapChildren(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              pass
    tests:
      - {args: [[1, 2, 3]], expected: [1, 3, 2]}
      - {args: [[1, 2, 3, 4, 5]], expected: [1, 3, 2, null, null, 4, 5], note: "2's own children (4, 5) are not swapped"}
      - {args: [[1, null, 9]], expected: [1, 9], note: "swapping with None works too"}
      - {args: [[]], expected: [], note: empty tree}
    solution: |
      class Solution:
          def swapChildren(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              if root is None:
                  return None
              root.left, root.right = root.right, root.left
              return root
    hint: "Guard `root is None` first: an empty tree has no children to swap."

  - title: Return the mirrored subtree — build a mirror copy
    skill: core
    goal: Treat each call as "give me a subtree, I return the root of its mirror" and wire the returned roots crosswise.
    instructions: |
      Return a **new** tree that is the mirror image of the input, built from fresh
      `TreeNode`s (leave the input untouched).

      This isolates the contract of the full solution: a call returns the root of the mirrored
      subtree, and the parent plugs the mirror of its *right* subtree in as its *left* child
      and vice versa. Building a copy makes the return value impossible to ignore: if you
      don't use what the recursive calls return, your new tree has no children.
    function:
      name: mirrorCopy
      params: [{name: root, type: TreeNode}]
      returns: TreeNode
    starter_code: |
      class Solution:
          def mirrorCopy(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              pass
    tests:
      - {args: [[4, 2, 7, 1, 3, 6, 9]], expected: [4, 7, 2, 9, 6, 3, 1]}
      - {args: [[1, 2]], expected: [1, null, 2]}
      - {args: [[]], expected: []}
      - {args: [[3, null, 5, 4]], expected: [3, 5, null, null, 4]}
    solution: |
      class Solution:
          def mirrorCopy(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              if root is None:
                  return None
              return TreeNode(root.val, self.mirrorCopy(root.right), self.mirrorCopy(root.left))
    hint: "`TreeNode(val, left, right)`: which recursive call's result belongs in the left slot?"

  - title: Invert without recursion
    skill: edge
    goal: Invert iteratively with a queue, skipping None children and handling the empty tree.
    instructions: |
      Invert the tree **without recursion**: use a queue (BFS), swap the children of every
      node you pop, and push its non-empty children. Return the root.

      Interviewers often follow up with "what if the tree is 10⁵ levels deep?", where the
      recursive version overflows the call stack. The edge cases are the ones people get
      wrong in the iterative version: an empty tree must not put `None` in the queue, and
      `None` children must not be pushed either. The order you visit nodes in doesn't matter,
      since every node gets swapped exactly once.
    function:
      name: invertIterative
      params: [{name: root, type: TreeNode}]
      returns: TreeNode
    starter_code: |
      class Solution:
          def invertIterative(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              pass
    tests:
      - {args: [[4, 2, 7, 1, 3, 6, 9]], expected: [4, 7, 2, 9, 6, 3, 1]}
      - {args: [[]], expected: [], note: "empty tree: don't enqueue None"}
      - {args: [[1, 2, null, 3]], expected: [1, null, 2, null, 3]}
      - {args: [[1]], expected: [1]}
    solution: |
      class Solution:
          def invertIterative(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
              queue = deque([root] if root else [])
              while queue:
                  node = queue.popleft()
                  node.left, node.right = node.right, node.left
                  queue.extend(child for child in (node.left, node.right) if child)
              return root
    hint: "Start the queue empty when `root` is None, and only push children that exist."

hints:
  - >-
    Look at the root of the mirrored tree: which original subtree ends up as its left child?
    And what must have happened *inside* that subtree before it got there?
  - >-
    Make invertTree(node) mean "mirror this subtree and return its root". None mirrors to None.
    For a real node: mirror both children (trust the calls), attach them on swapped sides, and
    return the node itself.
  - |
    invertTree(node):
        if node is empty: return empty
        left  = invertTree(node.left)
        right = invertTree(node.right)
        node.left, node.right = right, left
        return node

solution:
  code: |
    class Solution:
        def invertTree(self, root: Optional[TreeNode]) -> Optional[TreeNode]:
            if root is None:  # the mirror of an empty tree is empty
                return None
            left = self.invertTree(root.left)  # trust it: the left subtree, mirrored
            right = self.invertTree(root.right)  # trust it: the right subtree, mirrored
            root.left, root.right = right, left  # attach them on the opposite sides
            return root  # same root, so the parent can plug it back in
  explanation: |
    **What does each call return to its parent?** The root of its subtree after mirroring.
    That's the same node it was given (mirroring never changes which node is on top), but
    returning it lets the parent wire the result straight into its own child pointer, and it
    makes `return None` for the empty tree fall out naturally.

    **Why it's correct.** The mirror of a tree with root `r`, left subtree `L` and right
    subtree `R` is `r` with mirror(`R`) on the left and mirror(`L`) on the right. The two
    recursive calls produce mirror(`L`) and mirror(`R`) (trust them; they're smaller trees),
    and the tuple assignment attaches them crosswise.

    **The overwrite trap.** A common bug is
    `root.left = self.invertTree(root.right)` followed by
    `root.right = self.invertTree(root.left)`: by the second line `root.left` already points
    at the inverted right subtree, so the original left subtree is lost. Saving both results
    first (or one tuple assignment) avoids it.

    **Order doesn't matter here.** Swapping first and then recursing (pre-order) works just as
    well as recursing first (post-order), because each node is swapped exactly once either
    way. In the visualizer, notice the edges cross after each swap: the node itself never
    moves, only its child pointers change. The iterative alternative is a BFS (or a stack)
    that swaps the children of each node it pops, as in the edge drill.
  time: O(N) — every node is visited once and swapped once
  space: O(H) — the recursion stack; O(log N) for a balanced tree, O(N) for a skewed one

pitch_script: |
  **(Clarify)** "So I mirror the tree, every node's left and right children swapped at every
  level, and return the root. Is modifying the tree in place fine, or do you want a copy? And
  an empty tree should just return null?"

  **(Brute force)** "One idea is to go level by level and reverse each level. But reversing
  values doesn't move the gaps, so I'd need every slot including empty ones, and for a skewed
  tree that's two to the power of the height. That doesn't scale."

  **(Trigger)** "Mirroring decomposes: the mirror of a tree is its root with the mirrored right
  subtree on the left and the mirrored left subtree on the right. So it's a recursive
  transform where each call returns the root of its mirrored subtree."

  **(Optimal)** "If the node is null I return null. Otherwise I recursively invert the left
  and right children, then attach them swapped in one assignment, so I don't overwrite one
  pointer before using it, and return the node. If the tree could be very deep, I'd do the
  same swap inside a BFS loop instead."

  **(Complexity)** "Each node is visited and swapped once, so O(N) time, and O(H) space for
  the call stack: log N when balanced, N in the worst case."

twist:
  lc: 101
  title: Symmetric Tree
  why: >-
    Instead of building the mirror, you check whether a tree already equals its own mirror,
    without modifying it. The swap becomes a crossed comparison: a helper isMirror(a, b) walks
    two subtrees at once and returns True only if a.val == b.val, isMirror(a.left, b.right) and
    isMirror(a.right, b.left). The call now returns a bool instead of a node, but it's still
    "what does this call report to its parent?", and you start it with isMirror(root.left,
    root.right).

viz: {}  # the tree is drawn automatically; left/right label the returned subtrees
