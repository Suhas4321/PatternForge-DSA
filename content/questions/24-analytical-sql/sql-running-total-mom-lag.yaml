slug: sql-running-total-mom-lag
lc: 9317
citadel_id: sql_dbms
brick_layer: 3
runner_type: sql_sqlite
concept:
  problem_it_solves: How do financial analytics platforms calculate cumulative annual revenue and month-over-month (MoM) growth
    rates in a single SQL query? Window functions (`SUM() OVER (...)` and `LAG() OVER (...)`) compute running totals and inspect
    previous row values across ordered time intervals without self-joins or nested loops.
  brute_force: Self-joining a sales table with itself on `t1.month = t2.month + 1`, resulting in quadratic O(N^2) complexity.
  brute_force_complexity: O(N^2) Cartesian join that chokes on time-series data.
  key_insight: '`LAG(revenue, 1) OVER (ORDER BY month)` accesses the previous month''s revenue in O(1) time during the window
    scan, enabling direct MoM percentage growth calculation.'
  real_world: SaaS Gross Merchandise Value (GMV) dashboards, Stripe financial reports, and e-commerce growth metrics.
statement:
  clean: "Write an analytical SQL query to calculate running total and month-over-month (MoM) revenue growth.\n\nTable schema:\n\
    ```sql\nCREATE TABLE MonthlyRevenue (\n    month TEXT PRIMARY KEY,\n    revenue INTEGER\n);\n```\n\nCompute for each month:\n\
    - `month`: calendar month string (e.g. `'2026-01'`)\n- `revenue`: revenue for that month\n- `running_total`: cumulative\
    \ sum of revenue up to and including current month (`SUM(revenue) OVER (ORDER BY month)`)\n- `prev_month_revenue`: revenue\
    \ from preceding month (`LAG(revenue, 1) OVER (ORDER BY month)`), or `NULL` for the first month\n- `mom_growth_pct`: percentage\
    \ growth calculated as:\n  `ROUND(((revenue - prev_month_revenue) * 100.0 / prev_month_revenue), 2)`, or `NULL` for the\
    \ first month\n\nOrder by `month` ascending."
  oa_story: '**SwiftCart Finance Analytics — Executive Revenue Dashboard**


    SwiftCart''s Chief Financial Officer requested an automated monthly revenue report showing cumulative GMV and month-over-month
    growth rates to present to board investors. The existing spreadsheet was prone to manual formula mistakes.


    Write an analytical window SQL query using `SUM() OVER ()` and `LAG()` to generate the financial metrics directly from
    the database in a single query.'
  trigger_keywords:
  - running total and month-over-month
  - MonthlyRevenue
  - mom_growth_pct
  examples:
  - input: 'MonthlyRevenue: [(''2026-01'', 10000), (''2026-02'', 12000)]'
    output: '[(''2026-01'', 10000, 10000, None, None), (''2026-02'', 12000, 22000, 10000, 20.0)]'
    explanation: Month 1 has running total 10000, prev None, MoM None. Month 2 has running total 22000, prev 10000, MoM 20.0%.
  constraints:
  - 1 <= len(MonthlyRevenue) <= 120
  - month format is YYYY-MM
  - revenue >= 0
constraint_quiz:
  prompt: What does `LAG(col, 1) OVER (ORDER BY date)` return for the very first row in an ordered partition?
  options:
  - '`NULL` (or None in Python), because there is no preceding row'
  - '`0`'
  - The current row value
  - An SQL exception is thrown
  answer: 0
  explanation: By default, LAG returns NULL when the offset extends beyond the window frame boundary before the first row.
pattern_quiz:
  prompt: Why does multiplying by `100.0` before division in SQL prevent silent zero-value results?
  options:
  - In SQL integer arithmetic, `(12000 - 10000) / 10000` performs integer division yielding `0`; multiplying by `100.0` forces
    float arithmetic
  - To format the number as a string
  - Because SQL requires all percentages to be over 100
  - To invert negative percentages
  answer: 0
  explanation: Dividing two integers in SQLite truncates the decimal remainder to 0. Multiplying by 100.0 promotes the numerator
    to a floating-point number.
