slug: maximum-subarray
lc: 53

concept:
  problem_it_solves: >-
    "Which contiguous stretch has the biggest total?" Checking every start and end re-adds
    the same numbers again and again. Kadane's algorithm answers a smaller question at each
    index, "what's the best sum of a stretch that ends right here?", and that answer can be
    built from the previous index's answer in O(1).
  brute_force: >-
    Fix every start i, extend the end j with a running sum, and keep the maximum. It wastes
    work because every new start rebuilds sums that an earlier start already computed, and it
    keeps extending stretches whose prefix is already dragging the total down.
  brute_force_complexity: O(N²) time, O(1) space — 10⁵ elements means ~5 × 10⁹ subarray sums.
  key_insight: >-
    Let cur be the best sum of a subarray that ends at index i. At the next element x there
    are only two choices: extend the best stretch ending at i (cur + x) or restart at x alone.
    So cur = max(x, cur + x), which means "drop the past the moment its total is negative,
    because a negative prefix can only make any future sum smaller". The answer is the
    largest cur ever seen.
  real_world: >-
    Trading and analytics dashboards (Zerodha Kite, Groww) use it to find the best
    buy-and-hold window in a series of daily returns. Monitoring systems use the same scan
    to find the worst stretch of net error budget burn, and genomics tools use it to find the
    highest-scoring segment of a sequence.

statement:
  clean: |
    Given an integer array `nums`, find the **subarray** with the **largest sum**, and return
    its sum.

    A subarray is a **contiguous** non-empty sequence of elements within an array. Values
    may be negative, and the subarray must contain at least one element.
  oa_story: |
    **ZaikaZone — OA Round 1**

    ZaikaZone is a cloud-kitchen brand running twelve kitchens across Indiranagar,
    Whitefield and Jayanagar. For one kitchen, finance records the net profit of each day
    in date order: positive on busy days, negative on days when ingredient wastage or
    marketing spend beat the orders. The founders want to showcase the kitchen's single best
    unbroken run of days in their investor deck.

    Given the list of daily net profits, return the highest total profit over any run of one
    or more consecutive days. Some kitchens have only had losing days so far, and the deck
    must still show their best (least bad) run, which must contain at least one day. A
    kitchen can have 100,000 days of history, so the report must run in a single pass.
  trigger_keywords: ["subarray", "largest sum", "contiguous"]
  examples:
    - input: "nums = [-2,1,-3,4,-1,2,1,-5,4]"
      output: "6"
      explanation: "The subarray [4,-1,2,1] has the largest sum, 6."
    - input: "nums = [1]"
      output: "1"
    - input: "nums = [5,4,-1,7,8]"
      output: "23"
      explanation: "The whole array: the -1 dip is worth keeping because 5 + 4 - 1 > 0."
  constraints:
    - "1 <= nums.length <= 10^5"
    - "-10^4 <= nums[i] <= 10^4"

constraint_quiz:
  prompt: With up to 10⁵ elements, what time complexity should you aim for?
  options: ["O(N³)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    O(N³) re-sums every subarray from scratch: ~10¹⁵ steps. O(N²) with a running sum is
    ~5 × 10⁹, still far too slow. Divide and conquer gives O(N log N) and would pass, and
    it's the classic follow-up, but Kadane's single pass is O(N) and simpler. Every element
    can change the answer, so you can't go below O(N).

pattern_quiz:
  prompt: >-
    Find the maximum sum over all contiguous subarrays, where values can be negative. Which
    pattern fits?
  options:
    - "Sliding window that shrinks when the sum drops"
    - "Kadane's: best sum ending here = max(x, previous best + x)"
    - "Prefix sums + hash map of seen prefixes"
    - "Sort the array and take the positive numbers"
  answer: 1
  explanation: >-
    A sliding window needs a rule for when to shrink, and with negatives the sum isn't
    monotonic, so there's no safe rule. A prefix-sum hash map answers "sum equals exactly
    k", not "maximum sum". Sorting destroys contiguity. "Largest sum of a contiguous
    subarray" is the textbook Kadane trigger: extend the current run or restart.

