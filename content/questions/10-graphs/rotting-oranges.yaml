slug: rotting-oranges
lc: 994

concept:
  problem_it_solves: >-
    "If something spreads one step per minute from several places at once, when does it reach
    everything?" The minute a cell is reached is its shortest distance to the *nearest* starting
    cell. BFS explores a graph in rings of increasing distance, so if you start it from every source
    at the same time, ring k is exactly the set of cells that rot at minute k.
  brute_force: >-
    Simulate minute by minute: scan the whole grid, collect every fresh orange that touches a rotten
    one, rot them all at once, and repeat until a minute changes nothing. Each minute re-reads every
    cell, including all the oranges that rotted long ago or that are nowhere near the spreading
    front, and a long chain of oranges needs as many minutes as it has cells.
  brute_force_complexity: >-
    O((M·N)²) time, O(M·N) space — fine for LeetCode's 10 × 10 grid, but a 1000 × 1000 warehouse
    floor with a snake-shaped chain needs up to ~5 × 10⁵ minutes × 10⁶ cells = 5 × 10¹¹ reads.
  key_insight: >-
    Put **all** rotten oranges in the queue before the BFS starts (multi-source BFS). Then process the
    queue one level at a time: everything in the queue right now rotted at the same minute, and every
    fresh neighbour they infect rots at the next minute. Counting levels counts minutes, and each
    orange enters the queue exactly once, so the whole spread is O(M·N). Two bookkeeping details
    finish it: count the fresh oranges up front and decrement as they rot (any left over means -1),
    and stop as soon as no fresh oranges remain so the last, empty level doesn't add a phantom minute.
  real_world: >-
    Multi-source BFS is how contact-tracing and epidemic models compute "infected by day k" from
    several patients zero, how ride-hailing apps (Ola, Uber) compute the distance from every map cell
    to the nearest available driver, and how game maps precompute distance-to-nearest-exit fields.
    Message propagation in gossip protocols (Cassandra, Consul) spreads in exactly these rounds.

statement:
  clean: |
    You are given an `m x n` grid where each cell has one of three values:

    - `0`: an empty cell,
    - `1`: a fresh orange,
    - `2`: a rotten orange.

    **Every minute**, any fresh orange that is **4-directionally adjacent** to a rotten orange becomes
    rotten.

    Return the **minimum number of minutes** that must elapse until no cell has a fresh orange. If
    this is impossible, return `-1`.
  oa_story: |
    **MangoMandi Fresh — OA Round 1**

    MangoMandi runs a cold-storage warehouse near the Yeshwanthpur APMC yard, where mango crates sit
    on a floor plan of slots. Each slot is empty (`0`), holds a fresh crate (`1`), or holds a crate
    that has started to spoil (`2`). Spoilage spreads through the ethylene gas a bad crate gives off:
    each minute, every fresh crate sharing a wall with a spoiled one (front, back, left or right, not
    corner to corner) spoils too. Empty slots stop the spread.

    The quality team wants to know how long they have before the entire stock is lost: the number of
    minutes until no fresh crate remains. If some fresh crates can never be reached by the spoilage,
    report `-1` so they know part of the stock is safe forever. If there are no fresh crates at all,
    the answer is `0`.
  trigger_keywords: ["every minute", "4-directionally adjacent", "minimum number of minutes"]
  examples:
    - input: "grid = [[2,1,1],[1,1,0],[0,1,1]]"
      output: "4"
      explanation: >-
        Minute 1 rots (0,1) and (1,0); minute 2 rots (0,2) and (1,1); minute 3 rots (2,1); minute 4
        rots (2,2).
    - input: "grid = [[2,1,1],[0,1,1],[1,0,1]]"
      output: "-1"
      explanation: >-
        The orange in the bottom-left corner has an empty cell above it and to its right, so rotting
        never reaches it.
    - input: "grid = [[0,2]]"
      output: "0"
      explanation: "There are no fresh oranges at minute 0, so the answer is 0."
  constraints:
    - "m == grid.length"
    - "n == grid[i].length"
    - "1 <= m, n <= 10"
    - "grid[i][j] is 0, 1, or 2"

constraint_quiz:
  prompt: >-
    LeetCode's grid is at most 10 × 10, but MangoMandi's real warehouse floor is 1000 × 1000 slots
    (10⁶ cells). What complexity should your solution have?
  options:
    - "O((M·N)²) — rescan the whole floor once per minute"
    - "O(M·N · log(M·N)) — Dijkstra from the rotten crates"
    - "O(M·N) — multi-source BFS, each cell enqueued at most once"
    - "O(M + N) — the answer is a distance, so walk rows and columns"
  answer: 2
  explanation: >-
    Rescanning per minute is quadratic: up to 10¹¹ reads or more on a long chain. Dijkstra gives the
    right answer but pays a heap log factor for nothing, because every step costs exactly one
    minute and BFS already processes cells in distance order. O(M + N) can't even read the floor.
    Multi-source BFS enqueues each crate once and checks 4 neighbours: O(M·N), about 4 × 10⁶ steps.

pattern_quiz:
  prompt: >-
    Several sources spread to their neighbours simultaneously, one step per minute, and you need the
    minute at which the last cell is reached. Which pattern fits?
  options:
    - "DFS from each rotten orange, recording the depth at which each fresh orange is reached"
    - "Multi-source BFS: start with every rotten orange in the queue and count levels"
    - "Run a single-source BFS from each rotten orange and take the maximum"
    - "Dynamic programming over the grid from top-left to bottom-right"
  answer: 1
  explanation: >-
    "Spread / minutes" from several places at once is the multi-source BFS trigger: one queue seeded
    with every source, processed level by level, where level k is minute k. DFS depth is the length
    of whatever path it happened to take, not the shortest one. Separate BFS runs per source cost
    O(sources · M·N) and taking their maximum is wrong: each orange rots from its *nearest* source,
    so you need the minimum over sources, which one combined BFS gives for free. A top-left DP can't
    see spread that comes from below or the right.

