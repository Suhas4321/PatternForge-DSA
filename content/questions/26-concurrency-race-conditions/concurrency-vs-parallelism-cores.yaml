slug: concurrency-vs-parallelism-cores
lc: 9413
citadel_id: os_concurrency
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: What is the concrete difference in execution latency between running tasks concurrently on 1 CPU core
    versus in parallel across N CPU cores? Concurrency on 1 core serializes CPU execution while adding context-switch penalties.
    Parallelism across multiple physical cores executes tasks simultaneously, bounded by the longest task duration and load
    balancing.
  brute_force: Assuming adding 4 cores automatically makes any program 4x faster without accounting for task granularity or
    context-switch overhead.
  brute_force_complexity: Flawed mental model ignoring Amdahl's law and scheduling costs.
  key_insight: Simulating task scheduling on 1 core (sum of durations plus context switches) versus N cores (greedy priority
    queue scheduling) computes the true speedup factor.
  real_world: Kubernetes pod CPU limit sizing, threadpool sizing for background video transcoders, and Celery worker allocation.
statement:
  clean: "Implement an execution time model to compare concurrency vs parallelism across CPU cores:\n`model_execution_time(tasks:\
    \ list[dict], cores: int, context_switch_ms: int) -> dict`.\n\nEach task has `{\"id\": str, \"duration_ms\": int}`.\n\n\
    Rules:\n1. If `tasks` is empty, return:\n   `{\"single_core_time_ms\": 0, \"multi_core_time_ms\": 0, \"speedup\": 1.0,\
    \ \"is_parallel_faster\": False}`.\n2. Single-Core Time (Concurrency on 1 core):\n   - All tasks run serially on 1 core:\
    \ sum of all `duration_ms`.\n   - Each task transition after the first incurs `context_switch_ms` overhead: `(len(tasks)\
    \ - 1) * context_switch_ms`.\n   - `single_core_time_ms = sum(durations) + (len(tasks) - 1) * context_switch_ms`.\n3.\
    \ Multi-Core Time (Parallelism across `cores` cores):\n   - Schedule tasks greedily across `cores` cores using a min-heap\
    \ tracking each core's finish time.\n   - For a core running its $k$-th task ($k > 1$), add `context_switch_ms` before\
    \ running that task.\n   - `multi_core_time_ms` is the maximum completion time among all cores.\n4. Calculate:\n   - `speedup\
    \ = round(single_core_time_ms / multi_core_time_ms, 2)` (or `1.0` if multi-core time is 0).\n   - `is_parallel_faster\
    \ = multi_core_time_ms < single_core_time_ms`.\n\nReturn the results dictionary."
  oa_story: '**RideMitra Dispatch Optimization — Core Allocation Benchmark**


    During peak Bengaluru traffic hours, RideMitra dispatches route calculation jobs. The DevOps team debated whether upgrading
    microservice worker instances from 1 vCPU to 4 vCPU justifies the cloud cost.


    Implement this concurrency vs parallelism execution time model to calculate the empirical speedup and scheduling overhead
    across varying task workloads.'
  trigger_keywords:
  - concurrency vs parallelism
  - execution time model
  - single_core_time_ms
  examples:
  - input: 'tasks = [{"id": "1", "duration_ms": 100}, {"id": "2", "duration_ms": 100}, {"id": "3", "duration_ms": 100}, {"id":
      "4", "duration_ms": 100}], cores = 4, context_switch_ms = 10'
    output: '{"single_core_time_ms": 430, "multi_core_time_ms": 100, "speedup": 4.3, "is_parallel_faster": True}'
    explanation: Single core takes 400 + 3*10 = 430ms. 4 cores run tasks in parallel with 0 switches on distinct cores, taking
      100ms. Speedup is 4.3x.
  constraints:
  - 0 <= len(tasks) <= 500
  - 1 <= cores <= 64
  - 0 <= context_switch_ms <= 100
constraint_quiz:
  prompt: Why can speedup exceed the number of cores (e.g. 4.3x on 4 cores) in this model?
  options:
  - Because parallel execution avoids the context switch overhead that penalizes single-core task switching
  - Because multi-core CPUs overclock automatically
  - Because Python doubles bytecode interpretation speed on 4 cores
  - Because memory caches double in bandwidth
  answer: 0
  explanation: Single-core execution suffers context-switch penalties between every task, whereas distributing tasks evenly
    across available cores eliminates those switches.
pattern_quiz:
  prompt: What data structure greedily schedules tasks to the earliest available CPU core in O(log C) time per task?
  options:
  - Min-Heap priority queue storing (finish_time, task_count, core_id)
  - Hash map without ordering
  - Doubly-linked list without pointers
  - Fixed circular array with linear scanning
  answer: 0
  explanation: A min-heap always pops the core with the earliest availability in O(log C) time.
