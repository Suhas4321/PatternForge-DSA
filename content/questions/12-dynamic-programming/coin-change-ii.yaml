slug: coin-change-ii
lc: 518

concept:
  problem_it_solves: >-
    "In how many different ways can I build this total?" where two piles with the same coins
    in a different order count as the SAME way. Counting by listing every pile explodes, but
    the number of ways to make a total only depends on smaller totals, so a table of counts,
    built one coin type at a time, adds them up without ever listing a single pile.
  brute_force: >-
    Recurse over the coins in a fixed order: at coin i with r left, either use one more of
    coin i (stay at i, r − coin) or move on to coin i + 1 for good. That counts each
    combination exactly once, but it enumerates every combination one by one, and the same
    (coin index, remaining) pair gets recomputed down countless branches.
  brute_force_complexity: >-
    Exponential time (at least one call per combination, and the answer itself can approach
    2³¹), O(C + A) recursion depth — amount 5000 with small coins is hopeless.
  key_insight: >-
    Order the coins and build every combination in that order: all the 1s first, then all the
    2s, then all the 5s. Then a combination is identified by how many of each coin it uses,
    and counting it once is easy. In table form that order is the LOOP order: put coins in the
    OUTER loop and amounts in the inner loop, so dp[a] += dp[a − coin] only ever adds a coin to
    piles that use the same or earlier coins. Swap the loops and you count ordered sequences
    instead: for amount 3 with [1, 2], amounts-outer counts 1+2 and 2+1 separately (3 ways),
    coins-outer counts {1, 2} once (2 ways).
  real_world: >-
    Payment and pricing teams count "how many bundles of items add up to this price" when
    designing combo offers, and capacity planners count the ways to fill a truck or a
    container from standard box sizes. The same additive DP over a total runs inside
    probability engines (counting dice outcomes, generating functions) and in fraud rules that
    ask how many distinct transaction mixes could explain a settlement amount.

statement:
  clean: |
    You are given an integer array `coins` representing coins of different denominations and
    an integer `amount` representing a total amount of money.

    Return the **number of combinations** that make up that amount. If that amount of money
    cannot be made up by any combination of the coins, return `0`.

    You may assume that you have an **infinite number of each kind of coin**.

    The answer is guaranteed to fit into a signed **32-bit** integer.
  oa_story: |
    **TokenTill Canteens — OA Round 1**

    TokenTill powers the cafeterias at tech parks along Outer Ring Road. Employees pay with
    prepaid meal tokens that come in a few fixed values, and they can hand over any number of
    tokens of each value. The finance team in Bellandur wants to know, for a given meal price,
    how many genuinely different token mixes could have paid it exactly. Handing over a ₹1
    token and then a ₹2 token is the same mix as ₹2 then ₹1: only the count of each token
    value matters.

    Write a function that takes the meal price and the list of token values in circulation,
    and returns the number of distinct mixes that add up to the price exactly. Return `0` if
    no mix works. Prices go up to ₹5,000, there are at most 300 token values, all different,
    and the count always fits in a 32-bit signed integer.
  trigger_keywords: ["number of combinations", "infinite number of each kind of coin"]
  examples:
    - input: "amount = 5, coins = [1,2,5]"
      output: "4"
      explanation: "5 = 5, 5 = 2 + 2 + 1, 5 = 2 + 1 + 1 + 1, 5 = 1 + 1 + 1 + 1 + 1."
    - input: "amount = 3, coins = [2]"
      output: "0"
      explanation: "3 can't be made from 2s alone."
    - input: "amount = 10, coins = [10]"
      output: "1"
  constraints:
    - "1 <= coins.length <= 300"
    - "1 <= coins[i] <= 5000"
    - "All the values of coins are unique."
    - "0 <= amount <= 5000"

constraint_quiz:
  prompt: >-
    The amount is at most 5000 and there are at most 300 coin types. What complexity should
    you aim for?
  options:
    - "Exponential — enumerate every combination"
    - "O(A · C) — one pass over the amounts per coin"
    - "O(A² · C) — for each amount and coin, try every count of that coin"
    - "O(A log A)"
  answer: 1
  explanation: >-
    Enumerating combinations is at least as slow as the answer is large, and the answer can
    approach the 32-bit limit of about 2 × 10⁹. Trying every count k of each coin (dp[a] += dp[a − k·coin])
    is correct but up to 5000 × 300 × 5000 steps. The trick dp[a] += dp[a − coin] reuses the
    cell that already allowed any number of that coin, so each (coin, amount) pair is O(1):
    5000 × 300 = 1.5 × 10⁶ steps. Nothing here is sorted or halved, so O(A log A) has no
    algorithm behind it.

pattern_quiz:
  prompt: >-
    You must count how many multisets of coins (order doesn't matter, unlimited reuse) sum to
    an amount. Which approach is correct?
  options:
    - "Greedy: count how many times each coin divides the amount"
    - "dp over amounts with coins in the OUTER loop: dp[a] += dp[a − coin]"
    - "dp over amounts with amounts in the OUTER loop: dp[a] += dp[a − coin]"
    - "Backtracking that lists every combination and adds them to a set"
  answer: 1
  explanation: >-
    "Number of combinations" with "infinite number of each kind" is unbounded knapsack
    counting. Both dp options use the same line of code, but amounts-outer lets any coin be
    the last one at every amount, so 1+2 and 2+1 are counted separately (that's permutations,
    Combination Sum IV). Coins-outer fixes the order in which coins are added, so each multiset
    is counted once. Backtracking with a set is correct but exponential.

