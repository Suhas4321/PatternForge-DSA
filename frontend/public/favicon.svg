<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#140F2D" />
      <stop offset="100%" stop-color="#07060F" />
    </radialGradient>
    
    <!-- Gold Circuit Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Purple Neural Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="14" stroke="#A855F7" stroke-opacity="0.25" stroke-width="1" />

  <!-- Subtle grid lines -->
  <path d="M8 32h48M32 8v48" stroke="#A855F7" stroke-opacity="0.1" stroke-width="0.75" />

  <!-- Bottom: Neural Network Graph (Purple Nodes & Connections) -->
  <g stroke="url(#purpleGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <line x1="12" y1="52" x2="22" y2="45" />
    <line x1="22" y1="45" x2="32" y2="56" />
    <line x1="32" y1="56" x2="42" y2="45" />
    <line x1="42" y1="45" x2="52" y2="52" />
    <line x1="22" y1="45" x2="32" y2="40" />
    <line x1="42" y1="45" x2="32" y2="40" />
    <line x1="12" y1="52" x2="32" y2="56" />
    <line x1="52" y1="52" x2="32" y2="56" />
  </g>

  <!-- Neural Nodes -->
  <circle cx="12" cy="52" r="2.2" fill="#C084FC" />
  <circle cx="52" cy="52" r="2.2" fill="#C084FC" />
  <circle cx="22" cy="45" r="2.8" fill="#E9D5FF" stroke="#A855F7" stroke-width="1.2" />
  <circle cx="42" cy="45" r="2.8" fill="#E9D5FF" stroke="#A855F7" stroke-width="1.2" />
  <circle cx="32" cy="40" r="3.2" fill="#FFFFFF" stroke="#9333EA" stroke-width="1.5" />
  <circle cx="32" cy="56" r="2.5" fill="#C084FC" />

  <!-- Mid & Top: Ascending Golden Circuit Traces (The Apex) -->
  <g stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <!-- Outer mountain silhouette -->
    <path d="M14 48 L22 36 L26 39 L32 14 L38 39 L42 36 L50 48" stroke-width="1.5" fill="none" opacity="0.85" />
    
    <!-- Central golden power bus / circuit paths -->
    <path d="M32 38 V24 M30 36 V28 L32 24 M34 36 V28 L32 24" stroke-width="1.8" />
    <path d="M26 39 L28 32 L31 27" stroke-width="1.2" opacity="0.9" />
    <path d="M38 39 L36 32 L33 27" stroke-width="1.2" opacity="0.9" />
  </g>

  <!-- Apex Pinnacle Glowing Crown -->
  <circle cx="32" cy="14" r="3" fill="#FEF08A" filter="url(#goldGlow)" />
  <circle cx="32" cy="14" r="1.5" fill="#FFFFFF" />
  <path d="M32 9 v3 M32 16 v3 M27 14 h3 M34 14 h3" stroke="#FEF08A" stroke-width="1" stroke-linecap="round" />
</svg>
