hints:
  - "If both lists are empty, return `[]` immediately."
  - "Use a `scores = {}` dictionary. Iterate `dense_ranks` with `rank = i + 1`, adding `1.0 / (k + rank)`. Do the same for `sparse_ranks`."
  - "Round scores to 6 decimal places, sort by `(-score, doc_id)`, and return `[{'doc_id': doc, 'rrf_score': score}, ...]`."

solution:
  code: |
    class Solution:
        def reciprocal_rank_fusion(self, dense_ranks: list[str], sparse_ranks: list[str], k: int = 60) -> list[dict]:
            if not dense_ranks and not sparse_ranks:
                return []

            scores: dict[str, float] = {}

            for idx, doc in enumerate(dense_ranks):
                rank = idx + 1
                scores[doc] = scores.get(doc, 0.0) + (1.0 / (k + rank))

            for idx, doc in enumerate(sparse_ranks):
                rank = idx + 1
                scores[doc] = scores.get(doc, 0.0) + (1.0 / (k + rank))

            ranked = [
                {"doc_id": doc, "rrf_score": round(score, 6)}
                for doc, score in scores.items()
            ]

            # Primary: score desc, Secondary: doc_id asc
            ranked.sort(key=lambda x: (-x["rrf_score"], x["doc_id"]))

            return ranked
  explanation: |
    Reciprocal Rank Fusion converts arbitrary rank orders into normalized reciprocal penalties.
    By iterating both candidate sets and accumulating `1.0 / (k + rank)`, items retrieved near the top
    of both dense and sparse pipelines achieve the highest compound score, balancing lexical precision and semantic recall.
  time: O(N + M + U log U) where N is dense length, M is sparse length, U is unique docs
  space: O(U) for dictionary and ranked output

pitch_script: |
  **(Clarify)** "We need to combine results from two search systems—dense vector embeddings and sparse BM25 keywords—using the Reciprocal Rank Fusion algorithm."

  **(Basement Insight)** "Directly adding BM25 scores to vector similarity fails because BM25 scores are unbounded while cosine similarity is bounded between -1 and 1. RRF normalizes across systems by evaluating only ordinal rank positions."

  **(Solution)** "For each document in both the dense and sparse result lists, we add `1.0 / (k + rank)` to its score accumulator. Documents retrieved by both systems receive compounded boosts. We round to 6 decimal places and sort by score descending with doc_id tie-breaking."

  **(Complexity)** "Runs in O(N + M + U log U) time and O(U) space."

