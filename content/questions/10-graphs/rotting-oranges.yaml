visualize_test: 0

drills:
  - title: Seed the queue with every source
    skill: setup
    goal: Do the one scan that finds all rotten oranges (the BFS sources) and counts the fresh ones.
    instructions: |
      Return `[sources, fresh]`, where `sources` is the list of `[r, c]` of every rotten orange (`2`)
      in row-major order and `fresh` is the number of fresh oranges (`1`).

      This single scan sets up the entire solution. Every rotten orange goes into the BFS queue
      **before** the BFS starts, because they all start spreading at minute 0; seeding only one of
      them and adding the others later would give them an unfair head start or delay. The fresh
      count is how you'll know at the end whether anything was left unreachable.
    function:
      name: seedSources
      params: [{name: grid}]
    starter_code: |
      class Solution:
          def seedSources(self, grid: List[List[int]]) -> List:
              pass
    tests:
      - {args: [[[2, 1, 1], [1, 1, 0], [0, 1, 1]]], expected: [[[0, 0]], 6]}
      - {args: [[[2, 1, 2], [0, 1, 0]]], expected: [[[0, 0], [0, 2]], 2], note: "two sources"}
      - {args: [[[1, 1]]], expected: [[], 2], note: "no sources at all"}
      - {args: [[[0]]], expected: [[], 0]}
    solution: |
      class Solution:
          def seedSources(self, grid: List[List[int]]) -> List:
              sources, fresh = [], 0
              for r in range(len(grid)):
                  for c in range(len(grid[0])):
                      if grid[r][c] == 2:
                          sources.append([r, c])
                      elif grid[r][c] == 1:
                          fresh += 1
              return [sources, fresh]
    hint: "One double loop with two branches: `== 2` appends to `sources`, `== 1` increments `fresh`."

  - title: One level of the queue is one minute
    skill: core
    goal: Process the BFS queue level by level with `for _ in range(len(queue))` and count what each level infects.
    instructions: |
      Run the spread and return a list with the number of oranges that rot at minute 1, minute 2, and
      so on. Don't include a final minute in which nothing rots.

      The level loop is the key move of every "minutes / steps / levels" BFS. `len(queue)` taken at the
      start of a level is the number of oranges that rotted in the previous minute; pop exactly that
      many, and everything they append belongs to the next minute. Mark a neighbour rotten (`2`) the
      moment you append it, so a fresh orange touching two rotten ones is only queued once.
    function:
      name: rotPerMinute
      params: [{name: grid}]
    starter_code: |
      class Solution:
          def rotPerMinute(self, grid: List[List[int]]) -> List[int]:
              pass
    tests:
      - {args: [[[2, 1, 1], [1, 1, 0], [0, 1, 1]]], expected: [2, 2, 1, 1]}
      - {args: [[[2, 1, 1, 1, 1, 2]]], expected: [2, 2], note: "both sources spread in the same minute"}
      - {args: [[[2, 1, 1], [0, 1, 1], [1, 0, 1]]], expected: [1, 2, 1, 1], note: "the unreachable orange never appears"}
      - {args: [[[2, 1], [1, 1]]], expected: [2, 1]}
      - {args: [[[0, 2]]], expected: [], note: "nothing to rot"}
    solution: |
      class Solution:
          def rotPerMinute(self, grid: List[List[int]]) -> List[int]:
              rows, cols = len(grid), len(grid[0])
              queue = deque((r, c) for r in range(rows) for c in range(cols) if grid[r][c] == 2)
              counts = []
              while queue:
                  rotted = 0
                  for _ in range(len(queue)):  # exactly this minute's oranges
                      r, c = queue.popleft()
                      for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                          if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:
                              grid[nr][nc] = 2
                              rotted += 1
                              queue.append((nr, nc))
                  if rotted:
                      counts.append(rotted)
              return counts
    hint: "Freeze the level size with `for _ in range(len(queue)):` before popping."

  - title: Zero, minus one, and the phantom minute
    skill: edge
    goal: Stop the BFS when nothing fresh is left and turn leftovers into -1.
    instructions: |
      The same spread on a single row: `row[i]` is `0`, `1` or `2`, and a rotten orange infects
      `i - 1` and `i + 1` each minute. Return the minutes until no fresh orange remains, or `-1` if
      that never happens.

      The three answers people get wrong: with **no fresh oranges** the answer is `0`, even if there
      are no rotten ones either. With fresh oranges but **no rotten** ones, it's `-1`. And if your loop
      is just `while queue:`, the last level (oranges that rotted but have nobody left to infect)
      still adds a minute. Loop `while queue and fresh > 0`, then return `minutes if fresh == 0 else -1`.
    function:
      name: rotRow
      params: [{name: row}]
    starter_code: |
      class Solution:
          def rotRow(self, row: List[int]) -> int:
              pass
    tests:
      - {args: [[2, 1, 1]], expected: 2}
      - {args: [[0, 0]], expected: 0, note: "no fresh oranges: 0"}
      - {args: [[1]], expected: -1, note: "no source"}
      - {args: [[2, 1, 0, 1]], expected: -1, note: "empty cell blocks the spread"}
      - {args: [[2]], expected: 0}
      - {args: [[2, 1, 1, 1, 2]], expected: 2, note: "the last level must not add a minute"}
    solution: |
      class Solution:
          def rotRow(self, row: List[int]) -> int:
              queue = deque(i for i, x in enumerate(row) if x == 2)
              fresh, minutes = row.count(1), 0
              while queue and fresh > 0:  # stop once nothing is left to rot
                  for _ in range(len(queue)):
                      i = queue.popleft()
                      for j in (i - 1, i + 1):
                          if 0 <= j < len(row) and row[j] == 1:
                              row[j] = 2
                              fresh -= 1
                              queue.append(j)
                  minutes += 1
              return minutes if fresh == 0 else -1
    hint: "Track `fresh`; it decides both when to stop and whether the answer is -1."

hints:
  - >-
    All the rotten oranges start spreading at the same moment. If you think of the grid as a graph,
    the minute an orange rots is its distance to the nearest rotten orange. Which traversal visits
    nodes in order of distance, and how do you give it several starting points?
  - >-
    Put every rotten orange in one queue and count the fresh ones. Then process the queue in levels:
    pop everything that's in it right now, rot their fresh neighbours and push them. One level = one
    minute. Every time an orange rots, decrement the fresh count.
  - |
    queue = every rotten (r, c);  fresh = number of 1s;  minutes = 0
    while queue not empty and fresh > 0:
        repeat len(queue) times:
            (r, c) = pop front
            for each in-bounds neighbour that is fresh:
                make it rotten, fresh -= 1, push it
        minutes += 1
    return minutes if fresh == 0 else -1

solution:
  code: |
    class Solution:
        def orangesRotting(self, grid: List[List[int]]) -> int:
            rows, cols = len(grid), len(grid[0])
            queue = deque()
            fresh = 0
            for r in range(rows):
                for c in range(cols):
                    if grid[r][c] == 2:
                        queue.append((r, c))  # every source starts at minute 0
                    elif grid[r][c] == 1:
                        fresh += 1

            minutes = 0
            while queue and fresh > 0:  # fresh > 0: don't count a final minute that rots nothing
                for _ in range(len(queue)):  # exactly the oranges that rotted last minute
                    r, c = queue.popleft()
                    for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                        nr, nc = r + dr, c + dc
                        if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1:
                            grid[nr][nc] = 2  # mark when enqueued, so it's queued once
                            fresh -= 1
                            queue.append((nr, nc))
                minutes += 1
            return minutes if fresh == 0 else -1
  explanation: |
    **One thing changed from the island problems: the traversal is BFS, and it starts everywhere at
    once.** The grid is still a graph with 4-neighbour edges. The minute an orange rots equals its
    shortest distance to the *nearest* rotten orange, and BFS is the traversal that visits nodes in
    order of distance.

    **Multi-source seeding.** All rotten oranges go into the queue before the loop. That's
    equivalent to a single BFS from an imaginary "super source" connected to every rotten orange,
    so each fresh orange is reached first by whichever rotten orange is closest. On `[2,1,1,1,1,2]`
    the two ends meet in the middle after 2 minutes; a BFS from just one end would say 4.

    **Levels are minutes.** At the start of each round, `len(queue)` is exactly the number of
    oranges that rotted in the previous minute. Popping that many and pushing their fresh
    neighbours builds the next minute's front. Marking a neighbour rotten *when it's pushed* (not
    when it's popped) stops a fresh orange between two rotten ones from being queued twice.

    **The three endings.**
    - No fresh oranges at the start: the loop never runs and the answer is `0`, even on `[[0]]`.
    - Fresh oranges left when the queue empties: some are walled off by empty cells, or there was no
      rotten orange at all, so return `-1`.
    - `fresh > 0` in the loop condition: the oranges that rot in the final minute are still in the
      queue afterwards. Without the check, the loop would process them, rot nothing, and add one
      extra minute.
  time: O(M·N) — the seeding scan reads every cell once, and each orange is enqueued and dequeued at most once
  space: O(M·N) — the queue can hold a large fraction of the grid (e.g. every rotten orange at the start)
  brute_force_code: |
    class Solution:
        def orangesRotting(self, grid: List[List[int]]) -> int:
            rows, cols = len(grid), len(grid[0])
            minutes = 0
            while True:
                # snapshot first: oranges rotting this minute must not infect others this minute
                to_rot = []
                for r in range(rows):
                    for c in range(cols):
                        if grid[r][c] != 1:
                            continue
                        for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 2:
                                to_rot.append((r, c))
                                break
                if not to_rot:
                    break
                for r, c in to_rot:
                    grid[r][c] = 2
                minutes += 1
            if any(cell == 1 for row in grid for cell in row):
                return -1
            return minutes

pitch_script: |
  **(Clarify)** "So rotting spreads up, down, left and right, one step per minute, from all rotten
  oranges simultaneously. I return the minutes until no fresh orange is left, -1 if some can never
  rot, and 0 if there are no fresh oranges to begin with. Right?"

  **(Brute force)** "I could simulate minute by minute: scan the grid, find fresh oranges next to
  rotten ones, rot them together, and repeat. That rescans every cell each minute, so it's O((M·N)²)
  in the worst case, like a long snake of oranges."

  **(Trigger)** "'Spreads every minute from several sources' means each orange rots at its shortest
  distance from the nearest rotten one. Shortest distance in an unweighted graph is BFS, and several
  simultaneous sources means a multi-source BFS: all the rotten oranges go into the queue first."

  **(Optimal)** "I scan once to enqueue every rotten orange and count the fresh ones. Then I process
  the queue level by level: for the current queue size, pop an orange and rot each fresh in-bounds
  neighbour, decrementing the fresh count and pushing it. Each level is one minute. I keep going while
  the queue is non-empty and fresh is still positive, so the last level doesn't add an extra minute.
  At the end, if fresh is zero I return the minutes, otherwise -1."

  **(Complexity)** "Every cell is enqueued at most once and checks four neighbours, so O(M·N) time
  and O(M·N) space for the queue."

twist:
  lc: 542
  title: 01 Matrix
  why: >-
    Now you return the distance from every cell to its nearest 0, not just the time the last cell is
    reached. Same multi-source BFS: seed the queue with every 0 at distance 0, mark every 1 as
    unvisited (e.g. distance -1), and when you pop a cell, give each unvisited neighbour
    distance = current + 1 and push it. You store a distance per cell instead of counting levels,
    and there's no "-1 if unreachable" case because the problem guarantees at least one 0.

