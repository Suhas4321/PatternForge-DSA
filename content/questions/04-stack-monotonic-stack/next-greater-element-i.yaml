slug: next-greater-element-i
lc: 496

concept:
  problem_it_solves: >-
    "For a given value, what is the first bigger value to its right?" Answering that once per
    query means scanning right again for every query. A monotonic stack answers it for *every*
    element of the array in one pass, so each query becomes a single dictionary lookup.
  brute_force: >-
    For each value in nums1, find where it sits in nums2, then walk right until something
    bigger shows up. On a falling array like [9, 8, 7, …] every query walks to the end, and
    different queries re-read the same stretch of nums2 again and again.
  brute_force_complexity: O(m · n) time, O(1) extra space — 1000 × 1000 means ~10⁶ comparisons, and it grows quadratically.
  key_insight: >-
    Stop answering queries one by one. Precompute the next greater value for *every* element
    of nums2 using the Daily Temperatures template: keep a stack of values still waiting for
    a bigger one (decreasing from bottom to top), and when a bigger value x arrives, pop the
    smaller ones and record "x is your answer". Because all values are distinct, you can key
    the answers by value, and each query is then an O(1) lookup.
  real_world: >-
    Price-alert services ("notify me when this stock trades above today's price") and
    e-commerce "next higher bid" logic use this precompute-then-lookup shape. It's the same
    idea as building an index once in a database so thousands of later queries don't each
    trigger a full table scan.

statement:
  clean: |
    The **next greater element** of some element `x` in an array is the
    **first greater element that is to the right** of `x` in the same array.

    You are given two **distinct** 0-indexed integer arrays `nums1` and `nums2`, where `nums1`
    is a subset of `nums2`.

    For each `0 <= i < nums1.length`, find the index `j` such that `nums1[i] == nums2[j]` and
    determine the next greater element of `nums2[j]` in `nums2`. If there is no next greater
    element, then the answer for this query is `-1`.

    Return an array `ans` of length `nums1.length` such that `ans[i]` is the next greater
    element as described above.

    **Follow up:** Could you find an `O(nums1.length + nums2.length)` solution?
  oa_story: |
    **GaanaGrid Music — OA Round 2**

    GaanaGrid publishes a "rising tracks" chart: every song in today's chart, in chart
    order, with its stream count, and no two songs ever have the same count. The growth team
    in Indiranagar wants a "you might like this next" nudge. For a song a listener has saved,
    the nudge points to the first song placed *after* it in today's chart that has strictly
    more streams.

    You're given `nums2`, the stream counts in chart order, and `nums1`, the stream counts of
    the listener's saved songs (every saved song is in today's chart). For each saved song,
    return the stream count of its nudge song, or `-1` if no later song in the chart has more
    streams. Return the answers in the same order as `nums1`. The service handles many
    listeners per chart, so the work per listener must stay tiny.
  trigger_keywords: ["next greater element", "first greater element that is to the right"]
  examples:
    - input: "nums1 = [4,1,2], nums2 = [1,3,4,2]"
      output: "[-1,3,-1]"
      explanation: "Nothing right of 4 is bigger. The first value right of 1 that's bigger is 3. 2 is last in nums2, so -1."
    - input: "nums1 = [2,4], nums2 = [1,2,3,4]"
      output: "[3,-1]"
      explanation: "The next greater element of 2 is 3; 4 is the largest and last, so -1."
  constraints:
    - "1 <= nums1.length <= nums2.length <= 1000"
    - "0 <= nums1[i], nums2[i] <= 10^4"
    - "All integers in nums1 and nums2 are unique."
    - "All the integers of nums1 also appear in nums2."

constraint_quiz:
  prompt: >-
    Both arrays have at most 1000 elements, but the follow-up asks for
    O(nums1.length + nums2.length). What should you aim for in the interview?
  options: ["O(m · n)", "O(n²)", "O(m + n)", "O((m + n) log n)"]
  answer: 2
  explanation: >-
    O(m · n) and O(n²) (scan right for each query) pass these small limits, but they are
    exactly what the follow-up rules out, and they explode on real-size inputs. O((m + n)
    log n) suggests sorting or a balanced tree, but sorting destroys the "to the right"
    order the question depends on. A monotonic stack over nums2 plus a hash map gives
    O(m + n): every element is pushed and popped once, and every query is one lookup.

pattern_quiz:
  prompt: >-
    For a set of query values you need the first strictly greater value to their right in
    another array. Which pattern fits?
  options:
    - "Sort nums2 and binary search each query"
    - "Monotonic decreasing stack over nums2, storing answers in a value → next-greater map"
    - "Two pointers moving through nums1 and nums2 together"
    - "Sliding window maximum over nums2"
  answer: 1
  explanation: >-
    "Next greater element … to the right" is the monotonic-stack trigger, the same as Daily
    Temperatures. The only new part is that queries come from a different array, so you
    store each answer in a map keyed by value (safe because values are unique) and look them
    up. Sorting loses positions, nums1 isn't in nums2's order so two pointers don't line up,
    and a window maximum answers a different question.

