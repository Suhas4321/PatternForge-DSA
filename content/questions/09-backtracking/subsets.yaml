slug: subsets
lc: 78

concept:
  problem_it_solves: >-
    "List every way of picking some of these items." Each item faces the same yes/no question
    on its own: is it in, or is it out? N independent yes/no questions give 2^N combinations of
    answers, and backtracking walks all of them with a single shared list: add an item on the
    way down, take it back out on the way up.
  brute_force: >-
    Count from 0 to 2^N − 1 and read each number's bits as include/exclude flags (bit b set
    means nums[b] is in). That is not slower: the output itself has 2^N subsets, so every
    correct approach is exponential. What it wastes is reusability. Each subset is rebuilt from
    scratch, nothing can be pruned early, and the trick falls apart the moment the problem says
    "skip duplicates", "order matters" or "stop when the sum gets too big". Backtracking handles
    all of those with one or two changed lines.
  brute_force_complexity: >-
    O(N · 2^N) time, O(N) extra space besides the output — the same as backtracking, because
    2^N subsets with up to N elements each is the size of the answer itself. N = 10 means
    1,024 subsets.
  key_insight: >-
    Draw the decisions as a tree. Level i of the tree decides about nums[i]: the left edge
    puts it in, the right edge leaves it out. After N levels every element has been decided,
    so each of the 2^N leaves *is* one subset. Code that tree as dfs(i): "choose" (append
    nums[i] to path), "explore" (dfs(i + 1)), "un-choose" (pop it), then explore the other
    branch (dfs(i + 1) again without it). The pop is what lets one list serve every branch.
  real_world: >-
    SQL's GROUP BY CUBE(a, b, c) computes an aggregate for every subset of the grouping
    columns, which is literally the power set (2³ = 8 grouping sets). Market-basket analysis
    (the Apriori algorithm behind "frequently bought together" on BigBasket or Amazon)
    enumerates item subsets and prunes the ones that can't be frequent, and CI systems such as
    GitHub Actions build matrices of feature-flag combinations to test.

statement:
  clean: |
    Given an integer array `nums` of **unique** elements, return **all possible subsets**
    (the power set).

    The solution set **must not** contain duplicate subsets. Return the solution in
    **any order**.
  oa_story: |
    **ThaliThink — OA Round 1**

    ThaliThink is a cloud kitchen in Indiranagar that lets customers build their own thali:
    plain rice and roti come by default, and the customer adds any selection from today's
    side dishes. Each side dish has a small integer dish code, and no two dishes share a code.
    Before lunch service the pricing engine wants to pre-compute the calorie count and price
    of every thali a customer could possibly order, including the one with no sides at all.

    Write a function that takes the list of dish codes and returns every possible thali as a
    list of dish codes. Two thalis with the same dishes are the same thali, so none may appear
    twice, and the order of the thalis (and of dishes inside a thali) doesn't matter. The menu
    never has more than 10 side dishes.
  trigger_keywords: ["all possible subsets", "power set"]
  examples:
    - input: "nums = [1,2,3]"
      output: "[[],[1],[2],[1,2],[3],[1,3],[2,3],[1,2,3]]"
      explanation: "3 elements, each in or out: 2 × 2 × 2 = 8 subsets, including the empty one."
    - input: "nums = [0]"
      output: "[[],[0]]"
      explanation: "One element gives two subsets: without it and with it."
  constraints:
    - "1 <= nums.length <= 10"
    - "-10 <= nums[i] <= 10"
    - "All the numbers of nums are unique."

constraint_quiz:
  prompt: >-
    nums.length is at most 10 and you must return every subset. What time complexity should
    you expect?
  options: ["O(N log N)", "O(N²)", "O(N · 2^N)", "O(N · N!)"]
  answer: 2
  explanation: >-
    The answer itself has 2^N subsets, and writing them out takes O(N) per subset, so nothing
    can beat O(N · 2^N); O(N log N) and O(N²) can't even print the output. O(N · N!) is the
    cost of generating permutations, where order matters: for N = 10 that's 3.6 × 10⁷
    results instead of 1,024. A tiny N like 10 is the signal that exponential is expected.

pattern_quiz:
  prompt: >-
    You must return every possible selection of elements from a small array. Which pattern
    fits?
  options:
    - "Sliding window over nums"
    - "Backtracking: for each element, branch on include / exclude"
    - "Sort, then two pointers from both ends"
    - "Dynamic programming over prefix sums"
  answer: 1
  explanation: >-
    "All possible subsets / combinations" plus N ≤ 10 is the backtracking trigger: you are
    asked to *generate* every candidate, not to optimise one number. A sliding window only
    sees contiguous runs, so it would miss [1, 3]. Two pointers and DP answer questions about
    one best value or a count; they don't produce the list of subsets.

