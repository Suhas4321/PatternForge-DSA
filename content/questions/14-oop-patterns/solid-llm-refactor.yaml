slug: solid-llm-refactor
lc: 9213
citadel_id: python_data
brick_layer: 3
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does adding support for a new LLM provider require modifying 15 different files and risking existing production traffic?"
    Monolithic code packed with `if provider == 'openai': elif provider == 'anthropic':` violates the Single Responsibility (SRP)
    and Open/Closed Principles (OCP). Software should be open for extension, but closed for modification.
  brute_force: >-
    Writing giant if/elif conditional chains throughout the routing and payload formatting layer.
    Whenever a new model is introduced, every condition must be found and edited, risking regressions across existing providers.
  brute_force_complexity: O(P) conditionals per request, but high cyclomatic complexity and brittle code architecture.
  key_insight: >-
    Extract provider-specific payload formatting into distinct handler strategy classes adhering to a common interface.
    Register handlers in an extensible dictionary registry. Adding a new provider requires only writing a new handler class
    and registering it, without altering any existing routing code.
  real_world: >-
    Multi-provider LLM gateways (Drizz testing framework, Portkey, LiteLLM), multi-cloud storage abstractions,
    and payment gateway integrations (Stripe, Razorpay, PayPal).

statement:
  clean: |
    Perform a SOLID refactoring on a multi-provider LLM request builder:
    `execute_provider_pipeline(requests: list[dict]) -> list[dict]`.
    
    Each item in `requests` is a dictionary:
    `{"provider": str, "prompt": str, "max_tokens": int}`.
    
    Refactor the formatting logic into individual strategy classes:
    1. `OpenAIHandler`:
       Formats payload as:
       `{"model": "gpt-4o", "messages": [{"role": "user", "content": prompt}], "max_tokens": max_tokens}`
    2. `AnthropicHandler`:
       Formats payload as:
       `{"model": "claude-3-5", "prompt": prompt, "max_tokens_to_sample": max_tokens}`
    3. `GeminiHandler`:
       Formats payload as:
       `{"contents": [{"parts": [{"text": prompt}]}], "generationConfig": {"maxOutputTokens": max_tokens}}`
    4. In `execute_provider_pipeline`:
       - Look up the provider's handler from an extensible registry.
       - If the provider is unsupported, return `{"error": f"Unknown provider: {provider}"}` for that item.
       - Return the list of formatted payloads.
  oa_story: |
    **Drizz Multi-LLM Testing Gateway — Architecture Overhaul**
    
    Our testing engine evaluates UI action predictions across OpenAI, Anthropic, and Gemini models.
    The original prototype used a monolithic 400-line class with nested `if/elif` statements checking `model_type`.
    When the team tried to add Gemini 1.5 Pro, an accidental typo in an `elif` branch broke existing Claude pipelines during a P1 release.
    
    Refactor this subsystem into decoupled Strategy classes adhering to the Open/Closed Principle.
  trigger_keywords: ["SOLID refactoring", "execute_provider_pipeline", "requests"]
  examples:
    - input: "requests = [{'provider': 'openai', 'prompt': 'hello', 'max_tokens': 100}]"
      output: "[{'model': 'gpt-4o', 'messages': [{'role': 'user', 'content': 'hello'}], 'max_tokens': 100}]"
      explanation: "OpenAIHandler formats message array and max_tokens parameter."
    - input: "requests = [{'provider': 'unknown', 'prompt': 'test', 'max_tokens': 50}]"
      output: "[{'error': 'Unknown provider: unknown'}]"
      explanation: "Unknown provider returns structured error dictionary."
  constraints:
    - "requests contains between 0 and 100 items"
    - "max_tokens is a positive integer"

constraint_quiz:
  prompt: >-
    Which SOLID principle states that classes should be open for extension but closed for modification?
  options:
    - "Single Responsibility Principle (SRP)"
    - "Open/Closed Principle (OCP)"
    - "Liskov Substitution Principle (LSP)"
    - "Interface Segregation Principle (ISP)"
  answer: 1
  explanation: >-
    The Open/Closed Principle (OCP) states that software entities should be open for extension without modifying existing tested code.

pattern_quiz:
  prompt: Which behavioral design pattern replaces conditional if/elif ladders by encapsulating algorithms in separate classes?
  options:
    - "Strategy Pattern"
    - "Singleton Pattern"
    - "Decorator Pattern"
    - "Facade Pattern"
  answer: 0
  explanation: >-
    The Strategy pattern defines a family of algorithms, encapsulates each one, and makes them interchangeable at runtime.

