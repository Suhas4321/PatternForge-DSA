      summary: "CPU-bound Python loops hold the GIL, serializing threads on 1 core. Use multiprocessing."

visualize_test: 0

drills:
  - title: Identify CPU-bound workload
    skill: setup
    goal: Detect if task is CPU-intensive.
    instructions: |
      Return `True` if `task_name` is in `['xml_pruning', 'image_resize', 'matrix_multiply']`, else `False`.
    function:
      name: is_cpu_bound
      params: [{name: task_name}]
    starter_code: |
      class Solution:
          def is_cpu_bound(self, task_name: str) -> bool:
              pass
    tests:
      - {args: ["xml_pruning"], expected: true}
      - {args: ["http_get"], expected: false}
    solution: |
      class Solution:
          def is_cpu_bound(self, task_name: str) -> bool:
              return task_name in {"xml_pruning", "image_resize", "matrix_multiply"}
    hint: "Check membership in set of CPU-bound task names."

  - title: Check GIL release during I/O
    skill: core
    goal: Return whether GIL is released.
    instructions: |
      Given `"io"`, return `True`, given `"cpu"`, return `False`.
    function:
      name: releases_gil
      params: [{name: kind}]
    starter_code: |
      class Solution:
          def releases_gil(self, kind: str) -> bool:
              pass
    tests:
      - {args: ["io"], expected: true}
      - {args: ["cpu"], expected: false}
    solution: |
      class Solution:
          def releases_gil(self, kind: str) -> bool:
              return kind == "io"
    hint: "I/O releases the GIL; CPU-bound Python bytecode retains it."

  - title: Core allocation calculation
    skill: edge
    goal: Compute cores used based on runtime model.
    instructions: |
      If runtime is `"multiprocessing"`, return `workers`, else return `1`.
    function:
      name: cores_used
      params: [{name: runtime}, {name: workers}]
    starter_code: |
      class Solution:
          def cores_used(self, runtime: str, workers: int) -> int:
              pass
    tests:
      - {args: ["multiprocessing", 4], expected: 4}
      - {args: ["asyncio", 100], expected: 1}
    solution: |
      class Solution:
          def cores_used(self, runtime: str, workers: int) -> int:
              return workers if runtime == "multiprocessing" else 1
    hint: "Return workers if runtime == 'multiprocessing' else 1."

hints:
  - "Check `if workload_type == 'cpu_bound':`."
  - "For CPU tasks: `gil_contention: True, recommended_runtime: 'multiprocessing', core_utilization: worker_count`."
  - "For I/O tasks: `gil_contention: False, recommended_runtime: 'asyncio', core_utilization: 1`."

solution:
  code: |
    class Solution:
        def classify_concurrency_workload(self, workload_type: str, worker_count: int) -> dict:
            if workload_type == "cpu_bound":
                return {
                    "gil_contention": True,
                    "recommended_runtime": "multiprocessing",
                    "core_utilization": worker_count,
                    "summary": "CPU-bound Python loops hold the GIL, serializing threads on 1 core. Use multiprocessing.",
                }
            elif workload_type == "io_bound":
                return {
                    "gil_contention": False,
                    "recommended_runtime": "asyncio",
                    "core_utilization": 1,
                    "summary": "I/O bound tasks release the GIL during network/disk wait. Use asyncio.",
                }
            else:
                return {"error": f"Unknown workload: {workload_type}"}
  explanation: |
    In CPython, the Global Interpreter Lock prevents multiple threads from executing Python bytecode in parallel.
    For CPU-bound tasks, threads serialize on a single core; spawning processes via `multiprocessing` bypasses
    the GIL to achieve true multi-core speedups.
    
    For I/O-bound tasks, threads and async tasks release the GIL while waiting on network sockets,
    making single-threaded `asyncio` extremely fast and capable of managing 10,000+ connections with low memory overhead.
  time: O(1) decision classification
  space: O(1) dictionary response

pitch_script: |
  **(Clarify)** "We need to categorize workloads as CPU-bound or I/O-bound, diagnosing GIL contention and recommending the optimal Python concurrency runtime."

  **(Basement Insight)** "CPython's GIL protects memory reference counts by restricting execution to one OS thread at any instant. For CPU-bound tasks, threading fails because threads contest the GIL on a single core. In contrast, during I/O operations, Python drops the GIL, allowing concurrent I/O progress."

  **(Solution)** "For CPU workloads, we recommend `multiprocessing` to run independent interpreters on multiple cores. For I/O workloads, we recommend `asyncio` to multiplex sockets on an event loop without OS thread switching overhead."

  **(Complexity)** "Executes in O(1) time and space."

twist:
  lc: 9403
  title: Free-Threaded Python 3.13 (PEP 703)
  why: >-
    Python 3.13 introduces experimental free-threaded builds (--disable-gil) replacing the global lock
    with mimalloc thread-safe memory allocation, allowing true multi-threaded CPU execution.

