hints:
- Use `LEFT JOIN Orders o ON u.id = o.user_id` so users without orders are not dropped.
- Group by `u.id, u.name` and use `COUNT(o.id)` (not `COUNT(*)`, which would count 1 for NULL rows).
- '| # Pseudocode Blueprint

  | SELECT u.id AS user_id, u.name,

  |        COUNT(o.id) AS total_orders,

  |        COALESCE(SUM(o.amount), 0) AS total_spent,

  |        COALESCE(MAX(o.order_date), ''NO_ORDERS'') AS latest_order_date

  | FROM Users u LEFT JOIN Orders o ON u.id = o.user_id

  | GROUP BY u.id, u.name

  | ORDER BY u.id;'
solution:
  code: "SELECT\n    u.id AS user_id,\n    u.name,\n    COUNT(o.id) AS total_orders,\n    COALESCE(SUM(o.amount), 0) AS total_spent,\n\
    \    COALESCE(MAX(o.order_date), 'NO_ORDERS') AS latest_order_date\nFROM Users u\nLEFT JOIN Orders o ON u.id = o.user_id\n\
    GROUP BY u.id, u.name\nORDER BY u.id;\n"
  explanation: A single LEFT JOIN links all orders to their parent users. Grouping by user id aggregates order counts, total
    spending, and latest order dates in a single query pass. Using COALESCE provides default values for users who have placed
    zero orders, preventing NULL display bugs.
  time: O(U + O) using hash/merge join and group aggregation
  space: O(U) for grouping hash table
pitch_script: '**(Clarify)** "We need to eliminate N+1 query loops by aggregating each user''s total orders, cumulative spending,
  and latest order date in a single relational query."


  **(Brute force)** "Fetching users and then issuing a separate SELECT query in a loop for each user creates hundreds of network
  roundtrips, causing API timeouts."


  **(Trigger)** "Aggregating child metrics per parent entity in a single query signals a LEFT JOIN with GROUP BY."


  **(Optimal)** "We execute `FROM Users u LEFT JOIN Orders o ON u.id = o.user_id`. We group by user id and name. We compute
  `COUNT(o.id)` so users with no orders show 0, and wrap `SUM` and `MAX` in `COALESCE` to default to 0 and ''NO_ORDERS'' respectively."


  **(Complexity)** "Executes in O(U + O) time and O(U) space." '
