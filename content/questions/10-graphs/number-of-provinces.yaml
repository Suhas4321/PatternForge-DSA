slug: number-of-provinces
lc: 547

concept:
  problem_it_solves: >-
    "How many separate groups are there, when membership spreads through friends of friends?" It is
    Number of Islands again, but the graph is no longer drawn as a grid. The nodes are cities
    0..n-1 and the edges are listed in an n × n adjacency matrix. Counting provinces is counting
    connected components, and the same "for each unvisited node: count it, then traverse its whole
    component" loop answers it.
  brute_force: >-
    Work out, for every pair of cities, whether one can reach the other through any chain of roads,
    by repeatedly asking "can i reach j through some middle city k?" for every i, j and k
    (Floyd–Warshall transitive closure). Then count the cities that no smaller-numbered city can
    reach. It computes the full n × n reachability table even though you only need to know which
    group each city falls into.
  brute_force_complexity: >-
    O(n³) time, O(n²) space — n = 200 is 8 × 10⁶ steps, which passes here, but it is a factor of n
    slower than reading the matrix once, and at n = 10⁴ it would be 10¹² steps.
  key_insight: >-
    A province is just a connected component, so you don't need all-pairs reachability: a single DFS
    from any city reaches exactly its province. Keep one `visited` set for the whole run. Scan cities
    0..n-1; whenever you find one that isn't visited, it's in a province you haven't seen, so count
    it and DFS from it, marking everything reachable. Each city is visited once and each matrix row
    is read once, so the work is O(n²), the size of the input. The only real change from the grid
    problems is how you find a node's neighbours: "every j with isConnected[i][j] == 1" instead of
    "the 4 cells around (r, c)".
  real_world: >-
    Telecom and cloud teams run this after an outage to find how many isolated network segments
    exist (which routers can still reach each other). Social platforms count friend clusters, payment
    fraud teams group accounts linked by shared devices or cards into rings, and Kubernetes network
    policy tools find which pods can talk to each other. At scale, these systems usually use
    Union-Find, because links arrive one at a time.

statement:
  clean: |
    There are `n` cities. Some of them are connected, while some are not. If city `a` is connected
    directly with city `b`, and city `b` is connected directly with city `c`, then city `a` is
    **connected indirectly** with city `c`.

    A **province** is a group of directly or indirectly connected cities, with no other cities
    outside the group.

    You are given an `n x n` **adjacency matrix** `isConnected`, where `isConnected[i][j] = 1` if
    the `i`th city and the `j`th city are directly connected, and `isConnected[i][j] = 0` otherwise.

    Return the **total number of provinces**.
  oa_story: |
    **StateLink Telecom — OA Round 1**

    StateLink operates microwave towers across Karnataka, from Bengaluru Urban to Mysuru and
    Hubballi. After a cyclone warning, the network team needs to plan backup satellite uplinks. Two
    towers with a working direct link can relay traffic to each other, and traffic can hop through
    any number of towers, so a group of towers that can all reach each other only needs one uplink
    between them.

    The link status is reported as an `n x n` table: entry `[i][j]` is `1` if towers `i` and `j`
    currently have a direct link and `0` otherwise (the table is symmetric and every tower is linked
    to itself). With up to 200 towers, return the minimum number of satellite uplinks
    needed so that every tower has a path to one.
  trigger_keywords: ["connected indirectly", "province", "adjacency matrix", "total number of provinces"]
  examples:
    - input: "isConnected = [[1,1,0],[1,1,0],[0,0,1]]"
      output: "2"
      explanation: "Cities 0 and 1 form one province; city 2 is alone in the other."
    - input: "isConnected = [[1,0,0],[0,1,0],[0,0,1]]"
      output: "3"
      explanation: "No two cities are connected, so each city is its own province."
  constraints:
    - "1 <= n <= 200"
    - "n == isConnected.length"
    - "n == isConnected[i].length"
    - "isConnected[i][j] is 1 or 0"
    - "isConnected[i][i] == 1"
    - "isConnected[i][j] == isConnected[j][i]"

constraint_quiz:
  prompt: >-
    n is at most 200, and the input is an n × n matrix. What is the best time complexity you can
    aim for?
  options:
    - "O(n) — one step per city"
    - "O(n log n) — sort the cities"
    - "O(n²) — read each matrix entry a constant number of times"
    - "O(n³) — compute reachability for every pair"
  answer: 2
  explanation: >-
    The input itself has n² = 4 × 10⁴ entries, and any one of them could be the link that joins two
    groups, so you must read them all: O(n) and O(n log n) are impossible. O(n³) Floyd–Warshall
    (8 × 10⁶ steps) would pass at this size, but it does n times more work than needed. A DFS (or
    Union-Find) over the matrix reads each row once: O(n²).

pattern_quiz:
  prompt: >-
    Cities are linked directly or through chains of other cities, and you must count the separate
    groups. Which approach fits?
  options:
    - "Count rows of the matrix that contain a 1"
    - "Count connected components: DFS/BFS from each unvisited city, or Union-Find"
    - "Sort the cities by number of direct connections and group greedily"
    - "Dijkstra from city 0"
  answer: 1
  explanation: >-
    "Directly or indirectly connected" is the definition of a connected component, so this is the
    count-components template. Every row has a 1 (the diagonal), so counting rows says nothing.
    Grouping by degree ignores who is connected to whom. Dijkstra finds weighted distances from one
    source; it would only tell you city 0's province, and there are no weights.

