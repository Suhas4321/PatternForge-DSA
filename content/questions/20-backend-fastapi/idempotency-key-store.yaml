slug: idempotency-key-store
lc: 9505
citadel_id: backend_apis
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: When a network drop occurs right after a customer clicks 'Pay Rs 5,000', the client retries the request.
    How does a payment gateway ensure the customer is charged exactly once? In HTTP RFC 9110, GET, PUT, and DELETE are idempotent
    by definition. Non-idempotent methods (POST, PATCH) use an `Idempotency-Key` header. If a key is presented again with
    the exact same payload, the server returns the cached response with HTTP 200 without re-executing the charge.
  brute_force: Processing every incoming POST request unconditionally, causing duplicate financial debits and double-ordered
    inventory.
  brute_force_complexity: Critical data corruption and revenue loss.
  key_insight: Map idempotency keys to their original request payload and response. Identical retries return cached responses,
    payload mismatches trigger 422 conflicts, and first-time keys execute and return 201 Created.
  real_world: Stripe `Idempotency-Key` header, Razorpay order deduplication, and AWS API Gateway request caching.
statement:
  clean: "Implement an HTTP request handler with an idempotency key store:\n`handle_idempotent_request(method: str, idempotency_key:\
    \ str | None, payload: dict, store: dict) -> dict`.\n\nInputs:\n- `method`: HTTP method string (e.g. `\"GET\"`, `\"POST\"\
    `, `\"PUT\"`).\n- `idempotency_key`: optional string header value, or `None`.\n- `payload`: client request payload dictionary.\n\
    - `store`: in-memory storage dictionary tracking processed keys.\n\nProtocol Rules:\n1. Idempotent Methods (`GET`, `HEAD`,\
    \ `PUT`, `DELETE`):\n   - Inherently idempotent: return `{\"status_code\": 200, \"cached\": False, \"idempotent\": True,\
    \ \"response\": {\"action\": f\"{method}_success\"}}`.\n2. Non-Idempotent Methods (`POST`, `PATCH`):\n   - Missing Header:\
    \ if `not idempotency_key`, return `{\"status_code\": 400, \"cached\": False, \"idempotent\": False, \"error\": \"Missing\
    \ Idempotency-Key header\"}`.\n   - Key Exists in Store:\n     - If `store[key][\"payload\"] == payload`: return `{\"\
    status_code\": 200, \"cached\": True, \"idempotent\": True, \"response\": store[key][\"response\"]}`.\n     - If `store[key][\"\
    payload\"] != payload`: return `{\"status_code\": 422, \"cached\": False, \"idempotent\": False, \"error\": \"Idempotency\
    \ key payload mismatch conflict\"}`.\n   - New Key:\n     - Generate response: `{\"order_id\": f\"ORD_{idempotency_key[:6]}\"\
    , \"status\": \"CONFIRMED\"}`.\n     - Save to store: `store[idempotency_key] = {\"payload\": payload, \"response\": response}`.\n\
    \     - Return `{\"status_code\": 201, \"cached\": False, \"idempotent\": True, \"response\": response}`.\n3. Unsupported\
    \ Methods: return `{\"status_code\": 405, \"cached\": False, \"idempotent\": False, \"error\": \"Method Not Allowed\"\
    }`."
  oa_story: '**PayLoop Merchant Checkout — Double Charge Disaster**


    During a mobile app network glitch, a PayLoop customer''s UPI payment timed out. The user tapped ''Retry'' 3 times in
    4 seconds. The backend processed 3 separate debit transactions of Rs 2,500 each, triggering customer complaints and regulatory
    fines.


    The engineering lead mandated idempotency keys on all payment endpoints. Implement this idempotency store to prevent duplicate
    transactions on network retries.'
  trigger_keywords:
  - idempotency key store
  - handle_idempotent_request
  - idempotency_key
  examples:
  - input: 'method = "POST", idempotency_key = "key_abc_123", payload = {"amount": 500}, store = {}'
    output: '{"status_code": 201, "cached": False, "idempotent": True, "response": {"order_id": "ORD_key_ab", "status": "CONFIRMED"}}'
    explanation: First request creates the order and caches the response under the key.
  - input: 'method = "POST", idempotency_key = "key_abc_123", payload = {"amount": 500}, store = {"key_abc_123": {"payload":
      {"amount": 500}, "response": {"order_id": "ORD_key_ab", "status": "CONFIRMED"}}}'
    output: '{"status_code": 200, "cached": True, "idempotent": True, "response": {"order_id": "ORD_key_ab", "status": "CONFIRMED"}}'
    explanation: Repeated request with identical payload returns cached response with HTTP 200.
  constraints:
  - method is a valid HTTP verb
  - store is a mutable dictionary
constraint_quiz:
  prompt: According to RFC 9110, which HTTP methods are idempotent by specification?
  options:
  - GET, HEAD, PUT, DELETE
  - POST, PATCH, CONNECT
  - Only GET
  - All HTTP methods are idempotent
  answer: 0
  explanation: RFC 9110 defines GET, HEAD, PUT, and DELETE as idempotent, meaning making multiple identical requests has the
    same intended effect as making one single request.
pattern_quiz:
  prompt: What should an API return if a client sends an existing Idempotency-Key with a different payload body?
  options:
  - HTTP 422 Unprocessable Entity or HTTP 409 Conflict indicating a payload mismatch for that key
  - HTTP 200 with the original payload
  - HTTP 500 Internal Server Error
  - HTTP 301 Moved Permanently
  answer: 0
  explanation: Reusing an idempotency key with conflicting payload parameters represents a client bug or race condition and
    must be rejected with 422 or 409.
