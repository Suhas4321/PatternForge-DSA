drills:
- skill: setup
  title: Lock acquire and release
  goal: Track the single lock holder thread.
  instructions: If action is 'ACQUIRE' and holder is None, set holder to thread_id. If 'RELEASE' and holder matches thread_id,
    set holder to None. Return holder.
  function:
    name: drill_mutex_toggle
    params:
    - name: holder
    - name: thread_id
    - name: action
  starter_code: "class Solution:\n    def drill_mutex_toggle(self, holder: str, thread_id: str, action: str) -> str:\n   \
    \     pass\n"
  tests:
  - args:
    - null
    - T1
    - ACQUIRE
    expected: T1
  - args:
    - T1
    - T1
    - RELEASE
    expected: null
  solution: "class Solution:\n    def drill_mutex_toggle(self, holder: str, thread_id: str, action: str) -> str:\n       \
    \ if action == \"ACQUIRE\" and holder is None:\n            return thread_id\n        if action == \"RELEASE\" and holder\
    \ == thread_id:\n            return None\n        return holder\n"
  hint: Check action string and update holder accordingly.
- skill: core
  title: Check lock ownership
  goal: Verify whether current thread owns the lock.
  instructions: Return `True` if `holder == thread_id`, else `False`.
  function:
    name: drill_is_holder
    params:
    - name: holder
    - name: thread_id
  starter_code: "class Solution:\n    def drill_is_holder(self, holder: str, thread_id: str) -> bool:\n        pass\n"
  tests:
  - args:
    - T1
    - T1
    expected: true
  - args:
    - T1
    - T2
    expected: false
  - args:
    - null
    - T1
    expected: false
  solution: "class Solution:\n    def drill_is_holder(self, holder: str, thread_id: str) -> bool:\n        return holder ==\
    \ thread_id\n"
  hint: Return `holder == thread_id`.
- skill: edge
  title: Assess execution safety
  goal: Confirm no blocked acquires or unprotected ops occurred.
  instructions: Return `True` if `unprotected == 0 and blocked == 0`, else `False`.
  function:
    name: drill_check_safe
    params:
    - name: unprotected
    - name: blocked
  starter_code: "class Solution:\n    def drill_check_safe(self, unprotected: int, blocked: int) -> bool:\n        pass\n"
  tests:
  - args:
    - 0
    - 0
    expected: true
  - args:
    - 1
    - 0
    expected: false
  - args:
    - 0
    - 2
    expected: false
  solution: "class Solution:\n    def drill_check_safe(self, unprotected: int, blocked: int) -> bool:\n        return unprotected\
    \ == 0 and blocked == 0\n"
  hint: Return True only when both counts are 0.
hints:
- Track `lock_holder` initialized to `None`.
- Only permit READ, ADD, and WRITE if `lock_holder == thread_id`. Otherwise increment `unprotected_operations`.
- '| # Pseudocode Blueprint

  | lock_holder = None, counter = 0

  | for thread_id, op in steps:

  |     if op == "ACQUIRE":

  |         if lock_holder is None: lock_holder = thread_id

  |         elif lock_holder != thread_id: blocked += 1

  |     elif op == "RELEASE":

  |         if lock_holder == thread_id: lock_holder = None

  |     elif lock_holder != thread_id: unprotected += 1

  |     else: execute read/add/write'
solution:
  code: "class Solution:\n    def simulate_locked_counter(self, steps: list[list[str]]) -> dict:\n        counter = 0\n  \
    \      registers: dict[str, int] = {}\n        lock_holder = None\n        total_writes = 0\n        unprotected_ops =\
    \ 0\n        blocked_acquires = 0\n\n        for thread_id, op in steps:\n            if op == \"ACQUIRE\":\n        \
    \        if lock_holder is None:\n                    lock_holder = thread_id\n                elif lock_holder != thread_id:\n\
    \                    blocked_acquires += 1\n            elif op == \"RELEASE\":\n                if lock_holder == thread_id:\n\
    \                    lock_holder = None\n            else:\n                if lock_holder != thread_id:\n           \
    \         unprotected_ops += 1\n                else:\n                    if op == \"READ\":\n                      \
    \  registers[thread_id] = counter\n                    elif op == \"ADD\":\n                        registers[thread_id]\
    \ = registers.get(thread_id, 0) + 1\n                    elif op == \"WRITE\":\n                        counter = registers.get(thread_id,\
    \ 0)\n                        total_writes += 1\n\n        return {\n            \"final_counter\": counter,\n       \
    \     \"total_writes\": total_writes,\n            \"unprotected_operations\": unprotected_ops,\n            \"blocked_acquires\"\
    : blocked_acquires,\n            \"safe_execution\": unprotected_ops == 0 and blocked_acquires == 0,\n        }\n"
  explanation: A Mutex enforces mutual exclusion over the critical section. Any thread attempting to read or write without
    acquiring the lock triggers an unprotected operation violation, while acquire requests while the lock is held register
    as blocked acquires.
  time: O(N) where N is the total number of operations
  space: O(T) for registers and lock state
pitch_script: '**(Clarify)** "We need to simulate a mutex lock guarding shared counter increments, detecting any unprotected
  critical section access and blocked acquire attempts."


  **(Brute force)** "Allowing threads to execute read-modify-write steps freely leads to data corruption under context switches."


  **(Trigger)** "The problem introduces ACQUIRE and RELEASE lifecycle events alongside memory mutations, signaling a mutual
  exclusion state simulator."


  **(Optimal)** "We track `lock_holder`. During ACQUIRE, if the lock is held by another thread, we record a blocked acquire.
  If memory operations occur without holding the lock, we record an unprotected operation. Otherwise, we execute the increment
  cleanly."


  **(Complexity)** "Runs in O(N) time with O(T) space for thread registers." '
twist:
  lc: 9421
  title: Bounded Semaphore Permit Management
  why: A mutex allows only 1 holder; a semaphore expands this to N permits with a FIFO waiting queue and bounded release limits.
