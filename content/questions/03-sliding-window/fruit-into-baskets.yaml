tests:
  - {args: [[1, 2, 1]], expected: 3}
  - {args: [[0, 1, 2, 2]], expected: 3}
  - {args: [[1, 2, 3, 2, 2]], expected: 4}
  - {args: [[3, 3, 3, 1, 2, 1, 1, 2, 3, 3, 4]], expected: 5, note: "best run [1,2,1,1,2] sits in the middle"}
  - {args: [[5]], expected: 1, note: single tree}
  - {args: [[4, 4, 4, 4]], expected: 4, note: "one type only: the second basket stays empty"}
  - {args: [[1, 2, 1, 3, 3, 3, 1]], expected: 5, note: best run is at the end}
  - {args: [[0, 1, 6, 6, 4, 4, 6]], expected: 5, note: "two shrinks, each dropping a type"}
  - {args: [[1, 2, 1, 2, 1, 3, 3]], expected: 5, note: "one shrink removes four fruits before a type reaches zero"}
visualize_test: 7

drills:
  - title: Add the right fruit to a count map
    skill: setup
    goal: Maintain a dict of value → count while expanding the window to the right.
    instructions: |
      Walk `fruits` from left to right, keeping a dictionary from fruit type to how many times
      it has appeared so far. Return, for every position, the count of that position's type
      **right after** adding it.

      This is the "expand" half of the window. A set can tell you a type is present, but
      only a count can tell you whether it is *still* present after one fruit leaves, which
      is what the shrink step will need.
    function:
      name: typeCountSoFar
      params: [{name: fruits}]
    starter_code: |
      class Solution:
          def typeCountSoFar(self, fruits: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 1, 1]], expected: [1, 1, 2, 3]}
      - {args: [[3, 3, 3]], expected: [1, 2, 3]}
      - {args: [[5]], expected: [1]}
      - {args: [[0, 1, 0, 1]], expected: [1, 1, 2, 2]}
    solution: |
      class Solution:
          def typeCountSoFar(self, fruits: List[int]) -> List[int]:
              count = {}
              out = []
              for f in fruits:
                  count[f] = count.get(f, 0) + 1
                  out.append(count[f])
              return out
    hint: "`count[f] = count.get(f, 0) + 1` handles a type you've never seen before."

  - title: Shrink until only two types remain
    skill: core
    goal: Move l right, decrementing counts, while the window holds more than two distinct types.
    instructions: |
      Run the full window: add `fruits[r]` to the count map, then **while** the map has more
      than 2 keys, remove `fruits[l]` (decrement, delete the key at zero) and move `l` right.
      Return the value of `l` after the shrink, for every `r`.

      The shrink may need several steps: the window only becomes valid once some type's count
      hits zero, and that can take more than one removal (see `[1,2,1,2,1,3,3]`).
    function:
      name: leftBoundsTwoTypes
      params: [{name: fruits}]
    starter_code: |
      class Solution:
          def leftBoundsTwoTypes(self, fruits: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[0, 1, 6, 6, 4, 4, 6]], expected: [0, 0, 1, 1, 2, 2, 2]}
      - {args: [[1, 2, 3, 2, 2]], expected: [0, 0, 1, 1, 1]}
      - {args: [[3, 3, 3]], expected: [0, 0, 0]}
      - {args: [[1, 2, 1, 2, 1, 3, 3]], expected: [0, 0, 0, 0, 0, 4, 4], note: "the shrink takes four steps"}
    solution: |
      class Solution:
          def leftBoundsTwoTypes(self, fruits: List[int]) -> List[int]:
              count, l, out = {}, 0, []
              for r in range(len(fruits)):
                  count[fruits[r]] = count.get(fruits[r], 0) + 1
                  while len(count) > 2:
                      count[fruits[l]] -= 1
                      if count[fruits[l]] == 0:
                          del count[fruits[l]]
                      l += 1
                  out.append(l)
              return out
    hint: "Loop `while len(count) > 2`, and only `del` the key when its count reaches 0."

  - title: Delete keys at zero, or len() lies
    skill: edge
    goal: Remove a key the moment its count hits zero so len(count) equals the number of distinct values.
    instructions: |
      Using a fixed window of size `k` (as in Maximum Average Subarray), return the number of
      **distinct** values in every window, from left to right.

      When an element leaves the window, decrement its count, and if the count reaches `0`,
      **delete the key**. If you leave a zero-count key behind, `len(count)` still counts a
      value that is no longer in the window: in `[1, 2, 3, 4]` with `k = 2`, the window
      `[2, 3]` would report 3 distinct values. In Fruit Into Baskets the same bug makes the
      shrink loop think there are still three types and drain the window too far.
    function:
      name: distinctInWindows
      params: [{name: nums}, {name: k}]
    starter_code: |
      class Solution:
          def distinctInWindows(self, nums: List[int], k: int) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 1, 3, 4], 3], expected: [2, 3, 3]}
      - {args: [[1, 2, 3, 4], 2], expected: [2, 2, 2], note: every leaving value must be deleted}
      - {args: [[1, 1, 1], 2], expected: [1, 1]}
      - {args: [[1, 2, 3], 1], expected: [1, 1, 1]}
      - {args: [[4, 4, 5, 4], 2], expected: [1, 2, 2]}
    solution: |
      class Solution:
          def distinctInWindows(self, nums: List[int], k: int) -> List[int]:
              count, out = {}, []
              for r, x in enumerate(nums):
                  count[x] = count.get(x, 0) + 1
                  if r >= k:  # nums[r - k] leaves the window
                      old = nums[r - k]
                      count[old] -= 1
                      if count[old] == 0:
                          del count[old]
                  if r >= k - 1:
                      out.append(len(count))
              return out
    hint: "After `count[old] -= 1`, check `if count[old] == 0: del count[old]` before reading `len(count)`."

hints:
  - >-
    Forget the baskets for a moment. The trees you pick from are a contiguous stretch, and
    the only rule is about how many different types that stretch contains. What exactly is
    the question, in one sentence?
  - >-
    Grow a window on the right and keep a map from fruit type to its count inside the
    window. When the map has three keys, shrink from the left. When can a type actually be
    removed from the map, and why is a plain set not enough to know that?
  - |
    count = empty map, l = 0, best = 0
    for r from 0 to n-1:
        count[fruits[r]] = count[fruits[r]] + 1
        while number of keys in count > 2:
            count[fruits[l]] = count[fruits[l]] - 1
            if count[fruits[l]] is 0: remove that key
            l = l + 1
        best = max(best, r - l + 1)
    return best

solution:
  code: |
    class Solution:
        def totalFruit(self, fruits: List[int]) -> int:
            count = {}  # fruit type -> how many of it are inside fruits[l..r]
            l = 0
            best = 0
            for r in range(len(fruits)):
                count[fruits[r]] = count.get(fruits[r], 0) + 1
                while len(count) > 2:  # a third type: shrink until one type is gone
                    left_fruit = fruits[l]
                    count[left_fruit] -= 1
                    if count[left_fruit] == 0:
                        del count[left_fruit]  # keep len(count) == distinct types
                    l += 1
                best = max(best, r - l + 1)
            return best
  explanation: |
    "Pick from every tree while moving right, stop when a fruit doesn't fit" means the trees
    you pick from form a **contiguous window**, and "two baskets, one type each" means the
    window may contain **at most 2 distinct types**. So the answer is the longest window with
    at most 2 distinct values.

    It's the same three-step template as Max Consecutive Ones III: **expand** with `r`,
    **shrink** with `l` while the window is invalid, then **score** `r - l + 1`. Only the
    window's state changed: instead of one zero counter, it's a map from type to count, and
    "invalid" means `len(count) > 2`.

    Why counts and not a set? When `fruits[l]` leaves, the window may still contain other
    fruits of that type, and only a count tells you whether that type is truly gone. When a
    count hits `0` we **delete the key**; otherwise `len(count)` keeps counting a type that
    isn't in the window anymore, and the shrink loop never stops at the right place.

    The window rule is monotonic (extending a window can only add types), so `l` never moves
    back, and each tree enters and leaves the window at most once: O(N) in total. The map
    never holds more than 3 keys, so space is O(1).
  time: O(N) — every tree is added once and removed at most once
  space: O(1) — the count map holds at most 3 fruit types at any time
  brute_force_code: |
    class Solution:
        def totalFruit(self, fruits: List[int]) -> int:
            best = 0
            for l in range(len(fruits)):
                types = set()
                for r in range(l, len(fruits)):
                    types.add(fruits[r])
                    if len(types) > 2:
                        break
                    best = max(best, r - l + 1)
            return best

pitch_script: |
  **(Clarify)** "So I pick from a contiguous run of trees going right, the run can contain at
  most two fruit types, and I return the length of the longest such run? There's always at
  least one tree?"

  **(Brute force)** "The simple approach tries every starting tree and walks right with a set
  until a third type appears. That's O(N²) time, which is billions of steps at 10⁵ trees."

  **(Trigger)** "Once I remove the story, it's the longest contiguous subarray with at most
  two distinct values. 'Longest contiguous' with an 'at most K' rule is a variable sliding
  window, and because the rule is about distinct values, I'll track the window with a count
  map."

  **(Optimal)** "I move r to the right and increment the count of fruits[r]. If the map now
  has three types, I shrink from the left: decrement fruits[l], delete the key when its count
  hits zero, and move l, until only two types remain. Then r minus l plus one is a valid
  window and I update the best. Deleting zero-count keys is what keeps the map's size equal
  to the number of types in the window."

  **(Complexity)** "Each tree enters and leaves the window at most once, so it's O(N) time.
  The map never holds more than three keys, so the extra space is O(1)."

twist:
  lc: 992
  title: Subarrays with K Different Integers
  why: >-
    Now you count subarrays with exactly K distinct values instead of finding the longest
    one with at most 2. "Exactly" doesn't shrink cleanly, so reuse this window as a helper:
    atMost(K) adds r − l + 1 at every step (all the valid windows ending at r), and the
    answer is atMost(K) − atMost(K − 1). Same count map, same delete-at-zero rule.

