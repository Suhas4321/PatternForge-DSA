  - {args: ["a", "a"], expected: true, note: single character}
  - {args: ["aacc", "ccac"], expected: false, note: "same letters and length, different counts"}
  - {args: ["ab", "ba"], expected: true}
  - {args: ["aab", "abb"], expected: false, note: "a set check would wrongly say true"}
  - {args: ["listen", "silent"], expected: true}
visualize_test: 7

drills:
  - title: Count every character
    skill: setup
    goal: Build a character → count dictionary in one loop over a string.
    instructions: |
      Return the character counts of `s` as a list of `[char, count]` pairs, in the order
      each character **first appears**.

      This is the "count up" half of the anagram check. Python dicts keep insertion order,
      so building the dict in one loop and reading `.items()` gives you exactly this order.
    function:
      name: charCounts
      params: [{name: s}]
    starter_code: |
      class Solution:
          def charCounts(self, s: str) -> List[List]:
              pass
    tests:
      - {args: ["banana"], expected: [["b", 1], ["a", 3], ["n", 2]]}
      - {args: ["z"], expected: [["z", 1]]}
      - {args: ["abab"], expected: [["a", 2], ["b", 2]]}
      - {args: [""], expected: []}
    solution: |
      class Solution:
          def charCounts(self, s: str) -> List[List]:
              count = {}
              for ch in s:
                  count[ch] = count.get(ch, 0) + 1
              return [[ch, c] for ch, c in count.items()]
    hint: "`count.get(ch, 0) + 1` handles the first time you meet a character."

  - title: Spend the counts
    skill: core
    goal: Decrement a count for each character you use and fail the moment a count would go negative.
    instructions: |
      Return `true` if `word` can be spelled using the letters in `tiles`, each tile used at
      most once (leftover tiles are fine), otherwise `false`.

      This is the "count down" half of the anagram check: count the supply, then walk the
      demand and spend one unit per character. If the count is already 0 when you need it,
      the demand has one more copy than the supply, so stop right there.
    function:
      name: canSpell
      params: [{name: word}, {name: tiles}]
    starter_code: |
      class Solution:
          def canSpell(self, word: str, tiles: str) -> bool:
              pass
    tests:
      - {args: ["aab", "baa"], expected: true}
      - {args: ["aa", "ab"], expected: false}
      - {args: ["cat", "tacos"], expected: true}
      - {args: ["", "xyz"], expected: true}
      - {args: ["zz", "z"], expected: false}
    solution: |
      class Solution:
          def canSpell(self, word: str, tiles: str) -> bool:
              count = Counter(tiles)
              for ch in word:
                  if count[ch] == 0:
                      return False
                  count[ch] -= 1
              return True
    hint: "Check `count[ch] == 0` *before* subtracting, so a missing letter is caught immediately."

  - title: Why the length check finishes the job
    skill: edge
    goal: Use the length-mismatch exit so that "never went negative" proves every count is zero.
    instructions: |
      Diagnose a pair of strings. Return `"length"` if their lengths differ, `"count"` if the
      lengths match but some character's count doesn't, and `"anagram"` if `t` is an anagram
      of `s`.

      "Spend the counts" alone allows leftovers: `t = "ab"` fits inside `s = "abc"`. Checking
      lengths first closes that gap. If both strings have the same total and `t` never
      overdraws a count, nothing can be left over, so you never need a final "are all counts
      zero?" pass.
    function:
      name: anagramVerdict
      params: [{name: s}, {name: t}]
    starter_code: |
      class Solution:
          def anagramVerdict(self, s: str, t: str) -> str:
              pass
    tests:
      - {args: ["abc", "ab"], expected: "length"}
      - {args: ["aacc", "ccac"], expected: "count"}
      - {args: ["ab", "ba"], expected: "anagram"}
      - {args: ["a", "b"], expected: "count"}
      - {args: ["", ""], expected: "anagram"}
    solution: |
      class Solution:
          def anagramVerdict(self, s: str, t: str) -> str:
              if len(s) != len(t):
                  return "length"
              count = Counter(s)
              for ch in t:
                  if count[ch] == 0:
                      return "count"
                  count[ch] -= 1
              return "anagram"
    hint: "Do the cheap O(1) length comparison before you build any counts."

hints:
  - >-
    The order of letters doesn't matter at all. If you threw the letters of each string into
    two bags, what would you need to compare about the bags?
  - >-
    Count each character of s up by one. Then walk t and count each character down by one.
    When does t prove it isn't an anagram mid-walk, and what quick check before counting
    guarantees that "never went below zero" means "everything is exactly zero"?
  - |
    if lengths differ: return false
    count = empty map
    for each ch in s: count[ch] += 1
    for each ch in t:
        if count[ch] is 0: return false
        count[ch] -= 1
    return true

solution:
  code: |
    class Solution:
        def isAnagram(self, s: str, t: str) -> bool:
            if len(s) != len(t):
                return False  # a spare letter on either side can never balance out
            count = {}  # char -> how many more of it s has than t (so far)
            for i, ch in enumerate(s):
                count[ch] = count.get(ch, 0) + 1
            for j, ch in enumerate(t):
                if count.get(ch, 0) == 0:
                    return False  # t needs one more ch than s has
                count[ch] -= 1
            return True
  explanation: |
    Anagrams are defined by character counts, not positions. Count every character of `s` up,
    then walk `t` and spend those counts. The moment `t` asks for a character whose count is
    already 0 (or that `s` never had), `t` has an extra copy, so the answer is `false`.

    The length check up front is the subtle part. Without it, `s = "abc"`, `t = "ab"` would
    pass the spending loop with a `'c'` left over. With equal lengths, `t` spends exactly
    `len(s)` units, and since no count ever went negative, every count must end at exactly
    0. That's why no final "all zeros?" scan is needed.

    **Unicode follow-up:** interviewers often ask "what if the strings contain Unicode
    characters?" A 26-slot array indexed by `ord(ch) - ord('a')` breaks, but this dict (or a
    `Counter`) works unchanged because it keys on any character. Mention that visually
    identical strings can differ in code points (é as one character vs e + a combining
    accent), so real systems normalise first, e.g. with `unicodedata.normalize("NFC", s)`.
  time: O(N) — one pass over each string, O(1) average per dict operation
  space: O(1) — at most 26 keys for lowercase English letters (O(K) for an alphabet of size K)
  brute_force_code: |
    class Solution:
        def isAnagram(self, s: str, t: str) -> bool:
            if len(s) != len(t):
                return False
            remaining = list(t)
            for ch in s:
                for k in range(len(remaining)):
                    if remaining[k] == ch:
                        remaining.pop(k)  # cross off one matching letter
                        break
                else:
                    return False
            return True

pitch_script: |
  **(Clarify)** "Just to confirm: an anagram must use every letter exactly once, so lengths
  have to match, and the strings are only lowercase English letters? Is it case-sensitive,
  and could there be Unicode later?"

  **(Brute force)** "The naive way is to take each character of s and search t for an
  unused match, crossing it off. That's O(N²) in the worst case. Sorting both strings and
  comparing is better, O(N log N), but sorting does work I don't need, because order is
  exactly what anagrams ignore."

  **(Trigger)** "What defines an anagram is how many times each character appears. So this
  is a frequency-count problem: if the counts match, the strings are anagrams."

  **(Optimal)** "First, if the lengths differ, I return false. Then I count each character of
  s in a map, walk t and decrement. If t ever needs a character whose count is already zero,
  I return false. Because the lengths are equal and nothing went negative, every count must
  be zero at the end, so I can return true without a final check."

  **(Complexity)** "That's O(N) time. Space is O(1), at most 26 entries for lowercase
  letters. For Unicode I'd keep the same hash-map approach, since it keys on any character,
  and I'd normalise the strings first so combined and decomposed accents compare equal."

twist:
  lc: 383
  title: Ransom Note
  why: >-
    Now the counts only need to cover, not match: every letter of ransomNote must be available in
    magazine, but magazine may have extras. Same 26-slot counter, but you decrement for the note
    and fail the moment a count goes negative, and the length check changes from == to <=.

