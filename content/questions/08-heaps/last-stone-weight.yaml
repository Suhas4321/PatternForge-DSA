slug: last-stone-weight
lc: 1046

concept:
  problem_it_solves: >-
    "Repeatedly take the biggest items, combine them, and put the result back." The collection
    changes after every step, so whatever order you computed before is out of date the moment
    the leftover goes back in. A max-heap keeps "the biggest right now" one O(log N) operation
    away, no matter how the collection changes.
  brute_force: >-
    Each turn, sort the stones, take the last two, and append the difference if it isn't zero.
    Sorting orders every stone each turn, even though only two stones left and at most one came
    back, so almost all of that ordering work is repeated from the previous turn.
  brute_force_complexity: >-
    O(N² log N) time (up to N − 1 turns, each with an O(N log N) sort), O(1) extra space — fine
    for N = 30, but 10⁵ stones would mean ~1.7 × 10¹¹ steps.
  key_insight: >-
    The only questions you ask each turn are "what are the two heaviest stones?" and "put this
    new stone back". That is exactly what a max-heap is for: pop twice, push at most once, each
    O(log N). Python's heapq only gives a min-heap, so store every weight negated: the most
    negative number (the heaviest stone) then sits at the root. Negate on the way in, negate on
    the way out. Every turn destroys at least one stone, so there are at most N − 1 turns.
  real_world: >-
    Huffman coding (inside gzip, PNG and JPEG) runs the same loop on a min-heap: pop the two
    lightest nodes, merge them, push the merged node back, until one tree remains. Job schedulers
    and load balancers keep "the most loaded worker" at the top of a heap so they can drain or
    rebalance it, and order-matching engines repeatedly pair the best bid with the best ask.

statement:
  clean: |
    You are given an array of integers `stones` where `stones[i]` is the weight of the `i`th
    stone.

    We are playing a game with the stones. On each turn, we choose the **heaviest two stones**
    and **smash them together**. Suppose the heaviest two stones have weights `x` and `y` with
    `x <= y`. The result of this smash is:

    - If `x == y`, both stones are destroyed, and
    - If `x != y`, the stone of weight `x` is destroyed, and the stone of weight `y` has new
      weight `y - x`.

    At the end of the game, there is at most one stone left.

    Return the weight of the **last remaining stone**. If there are no stones left, return `0`.
  oa_story: |
    **KabadiKart Recycling — OA Round 1**

    KabadiKart collects scrap metal from apartments across Bengaluru and processes it at a yard
    in Peenya. The yard's press works on two bundles at a time and the operator always feeds it
    the two heaviest bundles currently on the floor. The press recovers the lighter bundle's
    weight from both: if the two bundles weigh the same, both are fully processed; otherwise the
    lighter one is fully processed and the heavier one goes back on the floor, lighter by that
    amount.

    The yard keeps feeding the press until fewer than two bundles remain. Given the list of
    bundle weights at the start of the shift, return the weight of the bundle left on the floor
    at the end, or `0` if nothing is left. Shift managers run this for every truckload, so it
    must be quick.
  trigger_keywords: ["heaviest two stones", "smash them together", "last remaining stone"]
  examples:
    - input: "stones = [2,7,4,1,8,1]"
      output: "1"
      explanation: "Smash 8 and 7 → 1, stones [2,4,1,1,1]. Smash 4 and 2 → 2, stones [2,1,1,1]. Smash 2 and 1 → 1, stones [1,1,1]. Smash 1 and 1 → both destroyed, stones [1]. The last stone weighs 1."
    - input: "stones = [1]"
      output: "1"
      explanation: "With one stone there is nothing to smash."
  constraints:
    - "1 <= stones.length <= 30"
    - "1 <= stones[i] <= 1000"

constraint_quiz:
  prompt: >-
    stones.length is at most 30. Which statement about the time complexity is accurate?
  options:
    - "Only an O(N log N) solution will pass"
    - "Re-sorting every turn (O(N² log N)) passes easily; a heap matters because it scales to large N"
    - "You need O(N) because every stone must be read once"
    - "The answer can be computed in O(1) from the sum of the weights"
  answer: 1
  explanation: >-
    With N = 30, even re-sorting every turn is about 30 × 30 × 5 ≈ 4,500 steps, so it passes.
    Reading constraints honestly is part of the skill, but interviewers will ask "what if N is
    10⁵?", and then the re-sort is ~10¹¹ steps while the heap's O(N log N) is a few million steps. O(N)
    isn't achievable, since every turn needs the current two heaviest stones. The sum alone
    doesn't determine the answer: [2,2] and [1,3] both sum to 4 but end at 0 and 2.

pattern_quiz:
  prompt: >-
    Each turn you need the two largest values, and then a new value is put back into the
    collection. Which approach fits?
  options:
    - "Sort once and walk two pointers from the end"
    - "A max-heap (negated min-heap) simulation"
    - "A monotonic decreasing stack"
    - "Greedily pair stones after a single sort"
  answer: 1
  explanation: >-
    "Repeatedly take the largest" plus "insert the result back" is the max-heap simulation
    trigger. Sorting once breaks the moment y − x goes back in, because it has to land in the
    right position and could be the next-heaviest stone or one of the lightest. A stack only
    sees the most recent element, and fixed pairings after one sort ignore the leftovers. A heap
    gives the current maximum after every insert, in O(log N).

