  - {args: [[]], expected: [], note: "no lists at all"}
  - {args: [[[]]], expected: [], note: "one list that is empty"}
  - {args: [[[], [2], [], [1, 3]]], expected: [1, 2, 3], note: "empty lists mixed in must be skipped"}
  - {args: [[[1, 2, 3]]], expected: [1, 2, 3], note: "a single list comes back unchanged"}
  - {args: [[[1, 1, 1], [1, 1], [1]]], expected: [1, 1, 1, 1, 1, 1], note: "all values equal: the index tie-breaker is what keeps heapq from comparing nodes"}
  - {args: [[[-10, -5, 0], [-7, -5, 8]]], expected: [-10, -7, -5, -5, 0, 8], note: "negatives and a duplicate across lists"}
  - {args: [[[5], [4], [3], [2], [1]]], expected: [1, 2, 3, 4, 5], note: "many one-node lists in reverse order"}
  - {args: [[[10000], [-10000, 0, 10000]]], expected: [-10000, 0, 10000, 10000], note: "extremes, with a tie on the last value"}
visualize_test: 0

drills:
  - title: Seed the heap, with a tie-breaker
    skill: setup
    goal: Push one (value, list index, node) entry per non-empty list and see the order heapq releases them in.
    instructions: |
      Push the **head** of every non-empty list into a min-heap as `(node.val, i, node)`, then
      pop everything and return the list indices `i` in the order they come out.

      Two things to get right before the merge loop even starts. Empty lists (`None` heads)
      must be skipped, or `node.val` crashes. And the index `i` must sit **between** the value
      and the node: when two values tie, Python compares the next tuple element, and comparing
      two `ListNode`s raises `TypeError`. Each list has at most one node in the heap at a time,
      so `i` is always unique and the comparison never reaches the node.
    function:
      name: headOrder
      params: [{name: lists, type: "ListNode[]"}]
    starter_code: |
      class Solution:
          def headOrder(self, lists: List[Optional[ListNode]]) -> List[int]:
              pass
    tests:
      - {args: [[[1, 4, 5], [1, 3, 4], [2, 6]]], expected: [0, 1, 2], note: "heads 1 and 1 tie: index decides"}
      - {args: [[[2], [], [1]]], expected: [2, 0], note: "the empty list is skipped"}
      - {args: [[[7], [7], [7]]], expected: [0, 1, 2], note: "three-way tie"}
      - {args: [[]], expected: []}
      - {args: [[[], []]], expected: []}
    solution: |
      class Solution:
          def headOrder(self, lists: List[Optional[ListNode]]) -> List[int]:
              heap = []
              for i, node in enumerate(lists):
                  if node:
                      heapq.heappush(heap, (node.val, i, node))
              order = []
              while heap:
                  order.append(heapq.heappop(heap)[1])
              return order
    hint: "`if node:` filters out empty lists; the tuple is `(node.val, i, node)` in that order."

  - title: Replace the popped item with its successor
    skill: core
    goal: In a k-way merge, after popping the smallest item, push the next item from the same source.
    instructions: |
      Merge `k` sorted **arrays** (plain Python lists, not linked lists) into one sorted list.
      Use a heap of `(value, array index, position in that array)`.

      This is the heart of every k-way merge: the heap always holds exactly one candidate per
      source that still has items. When you pop the smallest, its source loses its candidate,
      so you push that source's next item (if it has one). With linked lists "the next item"
      is `node.next`; with arrays it is position `j + 1`. The same move solves Kth Smallest in
      a Sorted Matrix and Smallest Range Covering Elements from K Lists.
    function:
      name: mergeKArrays
      params: [{name: arrays}]
    starter_code: |
      class Solution:
          def mergeKArrays(self, arrays: List[List[int]]) -> List[int]:
              pass
    tests:
      - {args: [[[1, 4, 5], [1, 3, 4], [2, 6]]], expected: [1, 1, 2, 3, 4, 4, 5, 6]}
      - {args: [[[], [3], [1, 2]]], expected: [1, 2, 3], note: "empty array: never seeded"}
      - {args: [[[5, 6, 7], [1]]], expected: [1, 5, 6, 7], note: "one source runs out first"}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def mergeKArrays(self, arrays: List[List[int]]) -> List[int]:
              heap = [(arr[0], i, 0) for i, arr in enumerate(arrays) if arr]
              heapq.heapify(heap)
              out = []
              while heap:
                  val, i, j = heapq.heappop(heap)
                  out.append(val)
                  if j + 1 < len(arrays[i]):
                      heapq.heappush(heap, (arrays[i][j + 1], i, j + 1))
              return out
    hint: "After `val, i, j = heappop(heap)`, the only new candidate is `arrays[i][j + 1]`."

  - title: Dummy head and the leftover tail
    skill: edge
    goal: Splice nodes onto a dummy head, attach whatever is left over, and return dummy.next.
    instructions: |
      Merge **two** sorted linked lists `a` and `b` by relinking their nodes, and return the
      head of the merged list.

      This is the building block of the divide-and-conquer alternative (merge the lists in
      pairs, halving their number each round, also O(N log k)), and it drills the splice
      mechanics the heap solution relies on. The edges people get wrong: either list (or both)
      can be empty, the leftover of the longer list must be attached in one step
      (`tail.next = a or b`), and the answer is `dummy.next`, not `dummy`.
    function:
      name: mergeTwo
      params: [{name: a, type: ListNode}, {name: b, type: ListNode}]
      returns: ListNode
    starter_code: |
      class Solution:
          def mergeTwo(self, a: Optional[ListNode], b: Optional[ListNode]) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[1, 3, 5], [2, 4]], expected: [1, 2, 3, 4, 5]}
      - {args: [[], []], expected: [], note: both empty}
      - {args: [[], [0]], expected: [0], note: one side empty}
      - {args: [[1, 1], [1]], expected: [1, 1, 1]}
      - {args: [[1, 2], [5, 6, 7]], expected: [1, 2, 5, 6, 7], note: "a runs out: attach all of b at once"}
    solution: |
      class Solution:
          def mergeTwo(self, a: Optional[ListNode], b: Optional[ListNode]) -> Optional[ListNode]:
              dummy = tail = ListNode()
              while a and b:
                  if a.val <= b.val:
                      tail.next, a = a, a.next
                  else:
                      tail.next, b = b, b.next
                  tail = tail.next
              tail.next = a or b  # at most one list still has nodes
              return dummy.next
    hint: "When the loop ends, at most one of `a`, `b` is non-empty and it is already sorted."

hints:
  - >-
    At any moment, only k nodes can possibly be the next smallest: the current head of each
    list. How can you keep the smallest of k changing candidates available without scanning
    all k every time?
  - >-
    Put the k heads in a min-heap. Pop the smallest, link it after your tail, and push its
    `next` into the heap if it exists. In Python, store (value, list index, node) so ties on
    value never make heapq compare two ListNodes.
  - |
    heap = [(head.val, i, head) for every non-empty list i]
    heapify(heap)
    dummy = tail = new node
    while heap not empty:
        val, i, node = pop smallest
        tail.next = node; tail = node
        if node.next exists: push (node.next.val, i, node.next)
    return dummy.next

solution:
  code: |
    class Solution:
        def mergeKLists(self, lists: List[Optional[ListNode]]) -> Optional[ListNode]:
            # (value, list index, node): the index breaks ties, so heapq never compares nodes
            heap = [(node.val, i, node) for i, node in enumerate(lists) if node]
            heapq.heapify(heap)
            dummy = tail = ListNode()
            while heap:
                val, i, node = heapq.heappop(heap)
                tail.next = node  # reuse the node itself, no copying
                tail = node
                if node.next:
                    heapq.heappush(heap, (node.next.val, i, node.next))
            return dummy.next
  explanation: |
    **Why only k candidates.** Every list is sorted, so the smallest node that hasn't been
    merged yet must be the current head of some list. The heap holds exactly those heads, one
    per non-empty list, so it never has more than `k` entries. Pop the smallest, splice it
    onto the result, and the only thing that changed is that its list has a new head:
    `node.next`. Push that, and the invariant holds again.

    **Why the index is in the tuple.** `heapq` compares tuples element by element. If two
    heads have the same value, it moves on to the second element; if that were the node,
    Python would try `ListNode < ListNode` and raise `TypeError`, because `ListNode` defines no
    ordering. Putting the list index `i` second fixes it, and `i` is always unique in the heap
    because each list has at most one node in it at a time. (If a problem lets one source have
    several entries in the heap, use a global counter instead.)

    **Edge cases.** `if node` skips empty lists both in `[]` and `[[]]`, so the heap starts
    empty and `dummy.next` is `None`, the empty list. The dummy head means the first splice
    needs no special case.

    **Alternative.** Divide and conquer: merge lists in pairs (0 with 1, 2 with 3, …), halving
    the number of lists each round. Every node is touched once per round and there are
    `log k` rounds, so it is also O(N log k), with O(1) extra space if done iteratively.
  time: O(N log k) — each of the N nodes is pushed and popped once, and the heap holds at most k entries
  space: O(k) — the heap; the merged list reuses the input nodes
  brute_force_code: |
    class Solution:
        def mergeKLists(self, lists: List[Optional[ListNode]]) -> Optional[ListNode]:
            heads = list(lists)
            dummy = tail = ListNode()
            while True:
                best = -1
                for i, node in enumerate(heads):  # rescan all k heads for every node
                    if node and (best == -1 or node.val < heads[best].val):
                        best = i
                if best == -1:
                    return dummy.next
                tail.next = heads[best]
                tail = tail.next
                heads[best] = heads[best].next

pitch_script: |
  **(Clarify)** "So I get k linked lists, each sorted ascending, and I return one sorted list.
  Some lists, or the whole input, can be empty, and I can reuse the existing nodes instead of
  creating new ones, right?"

  **(Brute force)** "The simplest correct approach scans all k heads at every step, takes the
  smallest and advances that list. That's O(N times k), up to 10⁸ comparisons here, and almost
  all of that work re-compares heads that didn't change. Collecting everything and sorting is
  O(N log N) but ignores the fact that the lists are already sorted."

  **(Trigger)** "k sorted sources and I keep needing the smallest current front: that's a k-way
  merge, and a min-heap is the natural structure for 'smallest of k candidates that keep
  getting replaced'."

  **(Optimal)** "I put the head of every non-empty list into a min-heap as a tuple of value,
  list index and node. The index is there because in Python, if two values tie, heapq would
  compare the nodes and crash. Then I pop the smallest, attach it to a dummy-headed result,
  and push its next node if it has one. When the heap is empty I return dummy.next."

  **(Complexity)** "Every node goes into and out of a heap of size at most k, so O(N log k)
  time and O(k) extra space. An alternative is divide and conquer, merging lists in pairs for
  log k rounds, which is also O(N log k) and can be done with O(1) extra space."

twist:
  lc: 378
  title: Kth Smallest Element in a Sorted Matrix
  why: >-
    Each row of an n × n matrix is a sorted "list", and you want the kth item of their merge
    rather than the whole merge. Seed the heap with (matrix[r][0], r, 0) for each row, then pop
    k times, pushing (matrix[r][c + 1], r, c + 1) after each pop; the kth pop is the answer.
    Same replace-with-successor move, stopped early, in O(k log n).

