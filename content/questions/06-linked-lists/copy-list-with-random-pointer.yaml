slug: copy-list-with-random-pointer
lc: 138

concept:
  problem_it_solves: >-
    "When I copy a node, what should its pointers point to?" Copying `val` is easy; the hard
    part is that `random` can point anywhere, including to nodes you haven't copied yet. A
    map from every original node to its copy answers "where is the copy of *that* node?" in
    O(1), so every pointer in the original can be translated into the matching pointer in
    the copy.
  brute_force: >-
    Copy the values and `next` pointers first. Then, for each node, find its random target's
    position by walking from the head until you reach that exact node, and walk the same
    number of steps in the copy to find the matching new node. Every random pointer costs a
    fresh walk, re-discovering positions you already walked past for the previous node.
  brute_force_complexity: O(N²) time, O(1) extra space — 1000 nodes means up to ~10⁶ hops; a 10⁵-node list would need ~10¹⁰.
  key_insight: >-
    Separate creating nodes from wiring them. Pass 1 creates a copy of every node and records
    `old → new` in a dictionary keyed by the node object itself (not its value, because
    values repeat). Once every copy exists, pass 2 is pure translation:
    `new.next = map[old.next]` and `new.random = map[old.random]`. Forward random pointers
    stop being a problem because nothing is wired until every target already exists. Seed the
    map with `None → None` and null pointers translate with no special case.
  real_world: >-
    Every deep-copy routine with shared references works this way: Python's copy.deepcopy keeps
    a `memo` dict from id(original) to copy, and serialisers (pickle, Java serialization,
    Protocol Buffers with references) keep the same object → id table so shared objects and
    cycles are written once. Copy-on-write snapshots in databases and editors remap internal
    pointers to the new versions the same way.

statement:
  clean: |
    A linked list of length `n` is given such that each node contains an additional
    **random pointer**, which could point to any node in the list, or `null`.

    Construct a **deep copy** of the list. The deep copy should consist of exactly `n`
    brand new nodes, where each new node has its value set to the value of its corresponding
    original node. Both the `next` and `random` pointer of the new nodes should point to new
    nodes in the copied list such that the pointers in the original list and copied list
    represent the same list state. **None of the pointers in the new list should point to
    nodes in the original list.**

    For example, if there are two nodes `X` and `Y` in the original list, where
    `X.random --> Y`, then for the corresponding two nodes `x` and `y` in the copied list,
    `x.random --> y`.

    Return the head of the copied linked list.

    The list is represented in the input/output as a list of `n` nodes. Each node is
    represented as a pair of `[val, random_index]` where `val` is `Node.val` and
    `random_index` is the index of the node (0 to n-1) that the random pointer points to, or
    `null` if it does not point to any node. Your code is only given the `head` of the
    original linked list.
  oa_story: |
    **DocuDhan Fintech — OA Round 2**

    DocuDhan stores a small business's ledger as a chain of entries, each entry linking to the
    entry recorded after it. Many entries also carry a "settles" link to some other entry in
    the same ledger (a refund settling a sale, a credit note settling an invoice), and that
    link can point earlier or later in the chain, or nowhere. Two entries can easily have the
    same amount, so amounts can't be used to tell entries apart.

    Before a GST audit, the compliance team in Indiranagar wants a sandbox ledger: a full,
    independent duplicate that auditors can edit freely. Every duplicated entry must carry the
    same amount, and both its "next" and "settles" links must lead to the matching duplicated
    entries, never back into the live ledger. Given the first entry of the live ledger, build
    the duplicate and return its first entry.
  trigger_keywords: ["random pointer", "deep copy", "brand new nodes"]
  examples:
    - input: "head = [[7,null],[13,0],[11,4],[10,2],[1,0]]"
      output: "[[7,null],[13,0],[11,4],[10,2],[1,0]]"
      explanation: "Node 11's random points forward to node 1 (index 4), which doesn't exist in the copy yet when you first reach 11."
    - input: "head = [[1,1],[2,1]]"
      output: "[[1,1],[2,1]]"
      explanation: "Both randoms point at the second node, including the second node's own random."
    - input: "head = [[3,null],[3,0],[3,null]]"
      output: "[[3,null],[3,0],[3,null]]"
      explanation: "All values are 3, so a value → node map would mix the nodes up."
  constraints:
    - "0 <= n <= 1000"
    - "-10^4 <= Node.val <= 10^4"
    - "Node.random is null or is pointing to some node in the linked list."

constraint_quiz:
  prompt: >-
    n is at most 1000, but the interviewer wants the solution you'd ship for a million-node
    list. What should you aim for?
  options: ["O(N²) time, O(1) extra space", "O(N log N) time", "O(N) time, O(N) extra space for a map", "O(log N) time"]
  answer: 2
  explanation: >-
    Walking from the head to locate every random target is O(N²): fine for 1000 nodes, but a
    million nodes means ~10¹² hops. Nothing here is sorted or ordered, so O(N log N) has no
    source. O(log N) is impossible because you must create all N new nodes. Two linear passes
    with an old → new dictionary give O(N) time and O(N) space (an interleaving trick can
    even remove the map, for O(1) extra space).

pattern_quiz:
  prompt: >-
    You must deep-copy a structure where any node can point to any other node, including
    ones you haven't copied yet. Which pattern fits?
  options:
    - "Dictionary from value → new node"
    - "Dictionary from original node → its copy, filled in a first pass, used to wire pointers in a second pass"
    - "Copy next pointers and set random = the original node's random"
    - "Recursively copy next, and copy random when you reach it"
  answer: 1
  explanation: >-
    Values repeat, so value → node collapses distinct nodes. Reusing the original's random
    pointer leaves the copy pointing into the original list, which the problem forbids. Naive
    recursion that copies random "when you reach it" creates the same node twice unless it
    also keeps a map. The trigger "deep copy" + "pointers to arbitrary nodes" means: keep an
    identity map from old node to new node, so every pointer can be translated.

function:
  name: copyRandomList
  params: [{name: head, type: RandomListNode}]
  returns: RandomListNode

