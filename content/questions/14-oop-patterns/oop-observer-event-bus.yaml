slug: oop-observer-event-bus
lc: 9216
citadel_id: python_data
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How do backend architectures decouple order placement from side effects (sending email, updating inventory,
    alerting fraud detection) without tight class coupling? The Observer pattern (Publish-Subscribe) maintains a registry
    of listeners per event type. When an event is published, all subscribed observers are notified in sequence without the
    publisher needing to know their identities.
  brute_force: The order service directly calling EmailService.send(), InventoryService.reserve(), and AnalyticsService.log()
    synchronously.
  brute_force_complexity: Tight coupling where modifying or adding a side effect requires altering the core order service.
  key_insight: 'Inverting dependency: the event bus maintains the observer registry so publishers remain completely unaware
    of consumers.'
  real_world: Django signals, Node.js EventEmitter, and microservice message brokers like Kafka and RabbitMQ.
statement:
  clean: "Implement the Observer design pattern event bus:\n`simulate_event_pipeline(self, operations: list[dict]) -> list[dict]`.\n\
    \nEventBus Specifications:\n- `subscribe(event_type: str, listener_id: str)`: registers a listener for an event type.\
    \ If already subscribed, do not add duplicates.\n- `unsubscribe(event_type: str, listener_id: str)`: removes listener\
    \ from that event type if present.\n- `publish(event_type: str, payload: dict) -> list[dict]`: notifies all current listeners\
    \ registered for `event_type` in chronological registration order. For each listener, records a delivery receipt:\n  `{'event_type':\
    \ event_type, 'listener_id': listener_id, 'payload': payload}`.\n\nOperations List:\n- Input is a list of sequential action\
    \ dicts:\n  - `{'action': 'subscribe', 'event_type': '...', 'listener_id': '...'}`\n  - `{'action': 'unsubscribe', 'event_type':\
    \ '...', 'listener_id': '...'}`\n  - `{'action': 'publish', 'event_type': '...', 'payload': {...}}`\n\nReturn Value:\n\
    - Return the list of all delivery receipts produced across all `'publish'` operations in chronological order."
  oa_story: '**KiranaKart Checkout Engine — Decoupled Event Notification Bus**


    Whenever a KiranaKart customer places an order, multiple downstream systems must react: warehouse inventory reservation,
    push notification dispatch, loyalty coin crediting, and fraud evaluation. Earlier code invoked all these services directly
    inside the checkout endpoint. If the push notification service stalled, checkout transactions timed out.


    The platform team decoupled checkout using an in-memory Observer event bus. Implement this pub-sub event bus.'
  trigger_keywords:
  - Observer design pattern event bus
  - simulate_event_pipeline
  - listener_id
  examples:
  - input: 'operations = [{''action'': ''subscribe'', ''event_type'': ''order_created'', ''listener_id'': ''email''}, {''action'':
      ''publish'', ''event_type'': ''order_created'', ''payload'': {''id'': 1}}]'
    output: '[{''event_type'': ''order_created'', ''listener_id'': ''email'', ''payload'': {''id'': 1}}]'
    explanation: Event published to the single registered listener email.
  constraints:
  - 0 <= len(operations) <= 100
  - action in ['subscribe', 'unsubscribe', 'publish']
constraint_quiz:
  prompt: What major design benefit does the Observer pattern provide to distributed systems?
  options:
  - 'Loose coupling: publishers emit events without knowing how many or which observers exist'
  - Guaranteed zero network latency
  - Automatic database compression
  - Elimination of all exception handling
  answer: 0
  explanation: Publishers and subscribers remain mutually independent. Observers can be added, removed, or scaled dynamically
    without altering the publisher.
pattern_quiz:
  prompt: What data structure typically represents the observer registry inside an EventBus?
  options:
  - A dictionary mapping event types (keys) to lists or sets of registered listeners (values)
  - A binary search tree of integers
  - A circular linked list of file descriptors
  - A fixed-size byte array
  answer: 0
  explanation: A hash map of event_type -> list of listeners allows O(1) lookup of interested listeners upon event publication.
