slug: flatten-nested-json-telemetry
lc: 9221
citadel_id: python_data
brick_layer: 1
runner_type: python_practical

concept:
  problem_it_solves: >-
    "How do we feed complex, deeply nested JSON API payloads from third-party services into relational tables, Pandas DataFrames, or parquet files?"
    Hierarchical JSON contains arbitrarily nested sub-dictionaries and lists. Flattening unwraps nested structures into a flat,
    one-level dictionary using composite dot-separated keys (e.g. `client.device.os: 'iOS'`).
  brute_force: >-
    Writing dozens of hardcoded nested dictionary gets: `val = data.get('a', {}).get('b', {}).get('c')`.
    Any slight variation in schema throws `AttributeError` or produces incomplete columns.
  brute_force_complexity: O(N) operations, but brittle manual extraction code.
  key_insight: >-
    Recursively traverse the dictionary with a running prefix path. When the value is another dictionary,
    recurse with `f"{prefix}.{key}"`. When the value is a primitive (or empty collection), write the compound key
    to the output dictionary.
  real_world: >-
    OpenTelemetry trace export, Segment/Snowplow event flattening, and BigQuery JSON column ingestion pipelines.

statement:
  clean: |
    Implement a hierarchical telemetry flattener to flatten nested json structures:
    `flatten_telemetry(payload: dict) -> dict`.
    
    Given a deeply nested JSON object (dictionary), flatten it so that all values exist in a single flat dictionary.
    
    Rules:
    1. Keys of nested dictionaries must be joined with a period `.` (e.g. `{"meta": {"env": "prod"}}` becomes `{"meta.env": "prod"}`).
    2. If a dictionary is empty `{}`, it can be omitted from output.
    3. Primitive values (strings, integers, floats, booleans, and lists) are preserved as terminal values under the flattened key.
    4. If the input dictionary is empty, return an empty dictionary `{}`.
  oa_story: |
    **Drizz Telemetry Collector — Log Normalization Engine**
    
    Our mobile app testing agents collect runtime device diagnostics, memory stats, and network telemetry
    formatted in deeply nested JSON structures from Android ADB and iOS idevicesyslog.
    To feed these traces into our real-time visualization tables and SQLite database, all nested keys must be
    flattened into top-level columns.
    
    Implement a robust flattening algorithm that transforms arbitrary hierarchical dictionaries into dot-delimited flat records.
  trigger_keywords: ["flatten nested json", "flatten_telemetry", "payload"]
  examples:
    - input: "payload = {'device': {'os': 'Android', 'version': 14}, 'status': 'PASS'}"
      output: "{'device.os': 'Android', 'device.version': 14, 'status': 'PASS'}"
      explanation: "Nested keys under 'device' are flattened using dot notation."
    - input: "payload = {'meta': {'run': {'id': 101, 'agent': {'name': 'BotA'}}}}"
      output: "{'meta.run.id': 101, 'meta.run.agent.name': 'BotA'}"
      explanation: "Multiple levels of nesting are flattened into compound keys."
  constraints:
    - "payload is a valid JSON dictionary"
    - "nesting depth is between 1 and 10 levels"

constraint_quiz:
  prompt: >-
    What is the time complexity of recursively flattening a nested JSON dictionary with K total leaf values?
  options:
    - "O(K) where K is the total number of nodes"
    - "O(K^2)"
    - "O(2^K)"
    - "O(1)"
  answer: 0
  explanation: >-
    Each key and value in the dictionary tree is visited exactly once during recursive traversal, giving O(K) time.

pattern_quiz:
  prompt: What data structure or technique naturally handles arbitrarily deep nested dictionary traversal?
  options:
    - "Recursion / DFS Traversal"
    - "Binary Search"
    - "Two Pointers"
    - "Monotonic Stack"
  answer: 0
  explanation: >-
    Depth-First Search (DFS) via recursion or an explicit stack is the canonical approach to traverse nested trees and dictionaries.

