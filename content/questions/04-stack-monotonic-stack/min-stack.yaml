slug: min-stack
lc: 155

concept:
  problem_it_solves: >-
    "What is the smallest thing in this collection right now?", asked after every push and
    pop, in O(1). A single "current minimum" variable breaks the moment you pop the minimum,
    because you no longer know what the minimum was before it. The fix is to remember the
    minimum *as of every level* of the stack, so popping simply reveals the old answer.
  brute_force: >-
    Keep a plain list and make getMin scan the whole list with min(). Push, pop and top stay
    O(1), but every getMin re-reads every element, even though almost nothing changed since
    the last call.
  brute_force_complexity: O(N) per getMin, O(1) for the rest — 1.5 × 10⁴ pushes followed by 1.5 × 10⁴ getMin calls means ~2 × 10⁸ comparisons.
  key_insight: >-
    A stack only ever changes at the top, so the minimum of everything at or below a given
    entry never changes while that entry is on the stack. Store that minimum alongside each
    entry: a second stack where min_stack[k] = min(stack[0..k]). Push computes
    min(val, previous min) once; pop removes both tops, and the entry underneath already
    holds the correct older minimum. Nothing ever needs recomputing.
  real_world: >-
    Undo stacks in editors and design tools keep a snapshot of derived state (like the
    current selection bounds) with each action so undo restores it instantly. Trading
    systems that support "cancel last order" keep the best price per level the same way, and
    database transaction savepoints store state per level so a rollback is O(1).

statement:
  clean: |
    Design a stack that supports push, pop, top, and
    **retrieving the minimum element in constant time**.

    Implement the `MinStack` class:

    - `MinStack()` initializes the stack object.
    - `void push(int val)` pushes the element `val` onto the stack.
    - `void pop()` removes the element on the top of the stack.
    - `int top()` gets the top element of the stack.
    - `int getMin()` retrieves the minimum element in the stack.

    You must implement a solution with **O(1) time complexity for each function**.
  oa_story: |
    **ChalChal Rides — OA Round 2**

    In ChalChal's "name your fare" mode, a rider in Whitefield posts a trip and drivers send
    fare quotes one after another. Each new quote is shown on top of the rider's quote card.
    A driver can withdraw only the most recent quote (the app's "undo" button works on the
    latest quote only), and the rider's screen must always show the latest quote and the
    cheapest quote currently on the card.

    Implement a `MinStack` class for the quote card with `push(val)` (a new quote arrives),
    `pop()` (the latest quote is withdrawn), `top()` (the latest quote) and `getMin()` (the
    cheapest active quote). Withdraw, latest and cheapest are only ever requested when at
    least one quote is on the card. A busy surge evening sends tens of thousands of
    operations per trip, and the screen refreshes on every one, so every operation must be
    instant, no matter how many quotes are on the card.
  trigger_keywords: ["retrieving the minimum element in constant time", "O(1) time complexity for each function"]
  examples:
    - input: |
        ["MinStack","push","push","push","getMin","pop","top","getMin"]
        [[],[-2],[0],[-3],[],[],[],[]]
      output: "[null,null,null,null,-3,null,0,-2]"
      explanation: "After pushing -2, 0, -3 the minimum is -3. Popping -3 leaves [-2, 0]: the top is 0 and the minimum is back to -2."
    - input: |
        ["MinStack","push","push","getMin","pop","getMin"]
        [[],[1],[1],[],[],[]]
      output: "[null,null,null,1,null,1]"
      explanation: "Two copies of the minimum: popping one must not forget the other."
  constraints:
    - "-2^31 <= val <= 2^31 - 1"
    - "Methods pop, top and getMin operations will always be called on non-empty stacks."
    - "At most 3 * 10^4 calls will be made to push, pop, top, and getMin."

constraint_quiz:
  prompt: >-
    Up to 3 × 10⁴ calls, and the statement demands O(1) for each function. What must getMin
    cost?
  options: ["O(N) — scan the list", "O(log N) — a heap next to the stack", "O(1) — read a stored value", "O(1) amortized — recompute the min only after a pop"]
  answer: 2
  explanation: >-
    Scanning makes getMin O(N), which breaks the requirement and is ~2 × 10⁸ steps in the
    worst case here. A heap makes push O(log N), and removing the stack's top (which can sit
    anywhere in the heap) needs lazy deletion, so it is not O(1). "Recompute after a pop" is O(N) per pop in the worst case
    (push 1, 2, 3 … then pop repeatedly), so it isn't amortized O(1) at all. Storing the
    minimum per level makes every operation a true O(1) read or write.

pattern_quiz:
  prompt: >-
    A stack must report its minimum in O(1), even after the minimum itself is popped. Which
    pattern fits?
  options:
    - "One variable holding the current minimum"
    - "A min-heap alongside the stack"
    - "An auxiliary stack holding the running minimum at every level"
    - "Keep the elements in a sorted list with binary-search insertion"
  answer: 2
  explanation: >-
    The trigger is "minimum in constant time" plus "pop": you need the minimum to roll back
    when the top is removed. A single variable can't roll back (after popping the minimum,
    what was the old one?). A heap can't remove the stack's top in O(1). A sorted list costs
    O(N) per insert. A parallel stack of running minimums rolls back for free, because pop
    removes the newest minimum and exposes the previous one.

