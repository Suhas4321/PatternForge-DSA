drills:
  - title: Calculate budget penalty
    skill: setup
    goal: Return 0.0 if tokens <= budget, else round((tokens - budget) * 0.01, 4).
    instructions: |
      Return `round((tokens - budget) * 0.01, 4)` if tokens > budget else 0.0.
    function:
      name: calc_penalty
      params: [{name: tokens}, {name: budget}]
    starter_code: |
      class Solution:
          def calc_penalty(self, tokens: int, budget: int) -> float:
              pass
    tests:
      - {args: [150, 100], expected: 0.5}
      - {args: [80, 100], expected: 0.0}
    solution: |
      class Solution:
          def calc_penalty(self, tokens: int, budget: int) -> float:
              return round((tokens - budget) * 0.01, 4) if tokens > budget else 0.0
    hint: "Use conditional check on tokens > budget."

  - title: Fitness calculation
    skill: core
    goal: Compute round(acc - penalty, 4).
    instructions: |
      Return `round(acc - penalty, 4)`.
    function:
      name: calc_fitness
      params: [{name: acc}, {name: penalty}]
    starter_code: |
      class Solution:
          def calc_fitness(self, acc: float, penalty: float) -> float:
              pass
    tests:
      - {args: [0.95, 0.5], expected: 0.45}
    solution: |
      class Solution:
          def calc_fitness(self, acc: float, penalty: float) -> float:
              return round(acc - penalty, 4)
    hint: "Return round(acc - penalty, 4)."

  - title: Candidate comparison key
    skill: edge
    goal: Generate sort tuple (-fitness, tokens, idx).
    instructions: |
      Return `(-fitness, tokens, idx)`.
    function:
      name: sort_key
      params: [{name: fitness}, {name: tokens}, {name: idx}]
    starter_code: |
      class Solution:
          def sort_key(self, fitness: float, tokens: int, idx: int) -> tuple:
              pass
    tests:
      - {args: [0.9, 80, 0], expected: [-0.9, 80, 0]}
    solution: |
      class Solution:
          def sort_key(self, fitness: float, tokens: int, idx: int) -> tuple:
              return (-fitness, tokens, idx)
    hint: "Return (-fitness, tokens, idx)."

hints:
  - "If `not candidates`, return `{'selected_id': None, 'tokens': 0, 'accuracy': 0.0, 'cost_penalty': 0.0, 'fitness': 0.0}`."
  - "For each candidate, compute `cost_penalty = round((tokens - token_budget) * 0.01, 4)` if `tokens > token_budget` else `0.0`."
  - "Compute `fitness = round(accuracy - cost_penalty, 4)`. Sort with key `(-fitness, tokens, idx)` and return the top candidate."

solution:
  code: |
    class Solution:
        def optimize_prompt_generation(self, candidates: list[dict], token_budget: int) -> dict:
            if not candidates:
                return {
                    "selected_id": None,
                    "tokens": 0,
                    "accuracy": 0.0,
                    "cost_penalty": 0.0,
                    "fitness": 0.0,
                }

            evaluated = []
            for idx, c in enumerate(candidates):
                tokens = c.get("tokens", 0)
                accuracy = c.get("accuracy", 0.0)

                if tokens > token_budget:
                    cost_penalty = round((tokens - token_budget) * 0.01, 4)
                else:
                    cost_penalty = 0.0

                fitness = round(accuracy - cost_penalty, 4)

                evaluated.append({
                    "selected_id": c.get("prompt_id"),
                    "tokens": tokens,
                    "accuracy": accuracy,
                    "cost_penalty": cost_penalty,
                    "fitness": fitness,
                    "_order": idx,
                })

            evaluated.sort(key=lambda x: (-x["fitness"], x["tokens"], x["_order"]))
            best = evaluated[0]

            return {
                "selected_id": best["selected_id"],
                "tokens": best["tokens"],
                "accuracy": best["accuracy"],
                "cost_penalty": best["cost_penalty"],
                "fitness": best["fitness"],
            }
  explanation: |
    The GEPA optimizer evaluates each candidate against a combined fitness objective:
    rewarding high eval accuracy while penalizing token counts that exceed the budget.
    Sorting by `(-fitness, tokens, original_index)` guarantees the selection of the most concise,
    highest-performing prompt variant.
  time: O(N log N) sorting
  space: O(N) candidate records

pitch_script: |
  **(Clarify)** "We need to evaluate candidate prompt variations against a token budget, computing fitness based on accuracy penalized by excess tokens, and selecting the optimal prompt variant."

  **(Basement Insight)** "Manual prompt edits are unscientific and result in prompt bloat. Applying an evolutionary fitness objective penalizes verbosity while rewarding accuracy, automatically pruning filler tokens and discovering compressed prompt formulations."

  **(Solution)** "For each candidate, we calculate penalty = (tokens - budget) * 0.01 for any excess tokens, yielding fitness = accuracy - penalty. We sort candidates by (-fitness, tokens, index) to break ties in favor of conciseness and return the best candidate."

  **(Complexity)** "Runs in O(N log N) time and O(N) space."

