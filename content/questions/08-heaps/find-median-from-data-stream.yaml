visualize_test: 6

drills:
  - title: A max-heap by negation
    skill: setup
    goal: Push into heapq with negated values so heap[0] is the maximum, and read it back with a second negation.
    instructions: |
      Push the numbers one by one into a heap that behaves like a **max-heap**, and after
      every push record the current maximum. Return the recorded list.

      `heapq` is a min-heap only. Storing `-x` turns the largest number into the smallest
      stored value, so `-heap[0]` is the maximum. The lower half `small` in Median Finder is
      exactly this kind of heap, and forgetting one of the two negations is the classic bug.
    function:
      name: runningMax
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def runningMax(self, nums: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[3, 1, 4, 1, 5]], expected: [3, 3, 4, 4, 5]}
      - {args: [[-5, -2, -9]], expected: [-5, -2, -2], note: "negatives: -2 is the max"}
      - {args: [[7]], expected: [7]}
      - {args: [[0, 0]], expected: [0, 0]}
    solution: |
      class Solution:
          def runningMax(self, nums: List[int]) -> List[int]:
              heap = []
              out = []
              for x in nums:
                  heapq.heappush(heap, -x)
                  out.append(-heap[0])
              return out
    hint: "Negate on the way in, negate again when you read `heap[0]`."

  - title: Route through small, then rebalance
    skill: core
    goal: Insert each number so that small ≤ large holds and len(small) − len(large) stays 0 or 1.
    instructions: |
      Feed `nums` into two heaps the way `addNum` does: push into the max-heap `small`
      (negated), move `small`'s largest value into the min-heap `large`, and if `large` is now
      bigger than `small`, move `large`'s smallest value back. Return
      `[sorted values of small, sorted values of large]` at the end.

      Routing every number through `small` first guarantees the **ordering invariant**: the
      biggest of the lower half is what moves up, so nothing in `small` is ever larger than
      anything in `large`. The rebalance step keeps the **size invariant**. Because both
      invariants hold, the halves are fully determined: `small` holds the lower ⌈N/2⌉ values.
    function:
      name: splitHalves
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def splitHalves(self, nums: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[1, 2, 3]], expected: [[1, 2], [3]]}
      - {args: [[5, 4, 3, 2, 1]], expected: [[1, 2, 3], [4, 5]]}
      - {args: [[1, 10, 2, 9]], expected: [[1, 2], [9, 10]]}
      - {args: [[7]], expected: [[7], []], note: "odd count: small holds the extra one"}
      - {args: [[4, 4]], expected: [[4], [4]]}
    solution: |
      class Solution:
          def splitHalves(self, nums: List[int]) -> List[List[int]]:
              small, large = [], []  # small: max-heap via negation, large: min-heap
              for x in nums:
                  heapq.heappush(small, -x)
                  heapq.heappush(large, -heapq.heappop(small))
                  if len(large) > len(small):
                      heapq.heappush(small, -heapq.heappop(large))
              return [sorted(-v for v in small), sorted(large)]
    hint: "Two moves always, a third only when `len(large) > len(small)`."

  - title: Read the median off the two tops
    skill: edge
    goal: Return small's top for an odd count and the true-division average of both tops for an even count.
    instructions: |
      You are given the two heaps exactly as Median Finder stores them: `small` holds the
      **negated** lower half in heap order, `large` the upper half in heap order, and
      `len(small)` is `len(large)` or one more. Return the median as a float.

      Three edges hide in two lines: the odd case comes from `small` (it holds the extra
      element, so `large` may even be empty), `small`'s top must be negated back, and the even
      case needs true division, because `(-1 + -2) // 2` is `-2`, not `-1.5`.
    function:
      name: medianFromHeaps
      params: [{name: small}, {name: large}]
      compare: float
    starter_code: |
      class Solution:
          def medianFromHeaps(self, small: List[int], large: List[int]) -> float:
              pass
    tests:
      - {args: [[-2, -1], [3]], expected: 2.0, note: "values 1, 2 | 3: odd, answer is small's top"}
      - {args: [[-1], [2]], expected: 1.5}
      - {args: [[-5], []], expected: 5.0, note: "a single number: large is empty"}
      - {args: [[2], [-1]], expected: -1.5, note: "values -2 | -1: floor division would give -2"}
      - {args: [[3, 4], [-2]], expected: -3.0, note: "values -4, -3 | -2"}
    solution: |
      class Solution:
          def medianFromHeaps(self, small: List[int], large: List[int]) -> float:
              if len(small) > len(large):
                  return float(-small[0])  # odd count: the extra element is small's top
              return (-small[0] + large[0]) / 2  # even count: true division
    hint: "Compare the sizes first; never touch `large[0]` when the count is odd."

hints:
  - >-
    The median only depends on the values right at the middle. If you kept the lower half and
    the upper half separately, which single value of each half would you need to look at?
  - >-
    Keep a max-heap `small` (lower half, negated) and a min-heap `large` (upper half). On
    every add, push into small, move small's top to large, and if large got bigger than
    small, move large's top back. Then small has the same size as large or one more.
  - |
    init: small = empty max-heap, large = empty min-heap
    addNum(num):
        push num into small
        move the top of small into large      (keeps every small <= every large)
        if size(large) > size(small):
            move the top of large into small  (keeps sizes equal or small + 1)
    findMedian():
        if size(small) > size(large): return top of small
        return (top of small + top of large) / 2

solution:
  code: |
    class MedianFinder:

        def __init__(self):
            self.small = []  # lower half as a max-heap (values negated)
            self.large = []  # upper half as a min-heap

        def addNum(self, num: int) -> None:
            # Route through small, so the largest of the lower half is what moves up:
            # every value in small stays <= every value in large.
            heapq.heappush(self.small, -num)
            heapq.heappush(self.large, -heapq.heappop(self.small))
            # Sizes: small may hold at most one extra element, never fewer than large.
            if len(self.large) > len(self.small):
                heapq.heappush(self.small, -heapq.heappop(self.large))

        def findMedian(self) -> float:
            if len(self.small) > len(self.large):
                return float(-self.small[0])
            return (-self.small[0] + self.large[0]) / 2
  explanation: |
    **The invariant.** Two facts are true after every `addNum`:

    1. **Order:** every value in `small` ≤ every value in `large`.
    2. **Size:** `len(small) - len(large)` is 0 or 1.

    Together they mean `small` is exactly the lower ⌈N/2⌉ numbers and `large` the upper
    ⌊N/2⌋. So for an odd count the median is the largest value in `small` (`-small[0]`), and
    for an even count it is the average of `small`'s largest and `large`'s smallest.

    **Why push into small and then move its top.** Pushing `num` into `small` and moving
    `small`'s maximum into `large` means whatever crosses over is the biggest value of the
    lower half, so it can't break the order invariant, no matter where `num` belongs. This
    avoids the "compare num with small's top, but what if small is empty?" branching. After
    that step `large` has gained one element, so if it is now bigger than `small`, its minimum
    moves back, and both invariants hold again.

    **Edge details.** `small` stores negated values, so read it as `-small[0]`. The odd case
    comes from `small`, which is why `large` can be empty after the first number without any
    special case. Use `/ 2`, never `// 2`: with negatives, floor division rounds `-1.5` down
    to `-2`. An equally valid convention lets `large` hold the extra element; what matters is
    picking one and making `findMedian` agree with it.
  time: O(log N) per addNum — at most three heap pushes/pops; O(1) per findMedian — just the two tops
  space: O(N) — every number is stored in exactly one of the two heaps
  brute_force_code: |
    class MedianFinder:

        def __init__(self):
            self.nums = []

        def addNum(self, num: int) -> None:
            self.nums.append(num)

        def findMedian(self) -> float:
            s = sorted(self.nums)  # re-sorts the whole stream on every query
            mid = len(s) // 2
            if len(s) % 2:
                return float(s[mid])
            return (s[mid - 1] + s[mid]) / 2

pitch_script: |
  **(Clarify)** "So numbers arrive one at a time, findMedian can be called any time after at
  least one number, and for an even count I return the average of the two middle values as a
  float. Calls can be interleaved in any order, up to 5 × 10⁴ in total?"

  **(Brute force)** "The simplest version stores everything and sorts on every findMedian:
  O(N log N) per query. Keeping a sorted list with binary insertion makes the query O(1), but
  each insert still shifts up to N elements, so it's O(N) per add and O(N²) overall."

  **(Trigger)** "Median of a stream is the two-heaps pattern. The median only depends on the
  largest value of the lower half and the smallest value of the upper half, so I keep the
  lower half in a max-heap and the upper half in a min-heap."

  **(Optimal)** "I'll keep two invariants: everything in the lower heap is at most everything
  in the upper heap, and the lower heap has the same size or one more. To add, I push into
  the lower heap, which in Python is a min-heap of negated values, move its top to the upper
  heap, and if the upper heap became bigger I move its top back. Then the median is the lower
  heap's top for an odd count, or the average of both tops for an even count."

  **(Complexity)** "addNum is a constant number of heap operations, so O(log N), findMedian is
  O(1), and space is O(N). If all numbers were in 0 to 100, I'd drop the heaps and use a
  101-slot count array instead."

twist:
  lc: 480
  title: Sliding Window Median
  why: >-
    Now the median is over the last k numbers only, so numbers must also **leave**. Heaps
    can't delete from the middle, so you keep the same two heaps plus a "to delete" counter
    (lazy deletion): mark the outgoing number, adjust a balance count for whichever half it
    belonged to, and only pop it for real when it surfaces at a heap's top. The invariants are
    the same; you just measure sizes by valid elements instead of len().

viz:
  heaps: [self.small, self.large]
  watch: [num]
