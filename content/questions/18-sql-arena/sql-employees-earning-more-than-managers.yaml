    hint: "Use `WHERE e.salary > (SELECT m.salary FROM Employee m WHERE m.id = e.managerId)`."

hints:
  - "Alias the `Employee` table twice: `FROM Employee e JOIN Employee m ON e.managerId = m.id`."
  - "Compare their salaries: `WHERE e.salary > m.salary`."
  - "Select `e.name AS Employee`."

solution:
  code: |
    SELECT e.name AS Employee
    FROM Employee e
    JOIN Employee m ON e.managerId = m.id
    WHERE e.salary > m.salary;
  explanation: |
    1. `FROM Employee e JOIN Employee m ON e.managerId = m.id`:
       Treats `e` as the employee and `m` as the corresponding manager.
       Top-level employees whose `managerId IS NULL` are automatically dropped by the inner join.
    2. `WHERE e.salary > m.salary`: filters for records where the employee's salary exceeds the manager's.
    3. `SELECT e.name AS Employee`: outputs the subordinate's name with the requested column alias.
  time: O(N) using in-memory hash join on managerId
  space: O(N) for hash join table

pitch_script: |
  **(Clarify)** "We need to return the names of all employees who earn strictly more than their direct managers."

  **(Basement Insight)** "Because hierarchical employee relationships reside in a single table, we perform a Self-Join by assigning distinct table aliases `e` (subordinate) and `m` (manager). An INNER JOIN naturally drops employees who have no manager (NULL `managerId`)."

  **(Solution)** "We query `FROM Employee e JOIN Employee m ON e.managerId = m.id WHERE e.salary > m.salary`, projecting `e.name AS Employee`."

  **(Complexity)** "Executes in O(N) time with a hash join or O(N log N) with an index on `id`."

