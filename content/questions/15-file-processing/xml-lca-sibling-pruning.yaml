slug: xml-lca-sibling-pruning
lc: 9222
citadel_id: python_data
brick_layer: 2
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does feeding full mobile UI view hierarchies into LLMs cost a fortune and cause context window overflow?"
    A raw Android or iOS accessibility XML dump contains 5,000+ nodes—most of which are passive layout wrappers,
    invisible spacers, or static background shapes. Pruning non-interactive sibling subtrees cuts token costs by 67%
    while preserving every interactive target for the AI agent.
  brute_force: >-
    Sending the entire uncompressed 50KB XML DOM string to the LLM. In addition to consuming 15,000+ tokens per UI step,
    the excessive noise confuses the LLM's vision-language reasoning, leading to missed tap coordinates.
  brute_force_complexity: O(N) tokens sent over network, causing 3x higher cost and 2x higher inference latency.
  key_insight: >-
    Using `xml.etree.ElementTree`, traverse the DOM hierarchy post-order. A node is marked 'relevant' if it possesses
    `active="true"` or if at least one of its subtree descendants is relevant. Any child node that is not relevant
    is detached from its parent. This preserves the exact Lowest Common Ancestor (LCA) path to active elements while dropping dead foliage.
  real_world: >-
    Suhas's Drizz active-based sibling pruning algorithm (reducing token consumption by 67%), Appium mobile automation,
    and Web scraping DOM summarizers.

statement:
  clean: |
    Implement an active sibling tree reduction algorithm using xml element tree and lca tree pruning:
    `prune_ui_tree(xml_str: str) -> str`.
    
    Given an XML string representing a mobile application view hierarchy:
    1. Parse the string into an ElementTree using `xml.etree.ElementTree.fromstring(xml_str)`.
    2. An element is defined as "relevant" if:
       - It has the attribute `active="true"`, OR
       - Any of its recursive descendants is "relevant".
    3. For every parent element, iterate over its direct children and remove (prune) any child that is NOT "relevant".
    4. If the root element itself has no relevant descendants and lacks `active="true"`, return an empty string `""`.
    5. Otherwise, serialize the pruned tree back to an XML string using `xml.etree.ElementTree.tostring(root, encoding="unicode").strip()`.
  oa_story: |
    **Drizz Mobile Testing Framework — The 67% Token Reduction Algorithm**
    
    During automated mobile app evaluation on Android devices, each screen transition dumped an XML hierarchy
    of up to 8,000 nodes. Passing this dump directly to vision-language models exhausted token budgets and caused
    catastrophic rate limiting.
    
    Build the exact Lowest Common Ancestor (LCA) Sibling Pruner from Suhas's resume that recursively prunes
    un-interactive branches while retaining the structural ancestor spine leading to active UI elements.
  trigger_keywords: ["xml element tree", "lca tree pruning", "xml_str"]
  examples:
    - input: "xml_str = '<root><button active=\"true\">Submit</button><label>Header</label></root>'"
      output: "'<root><button active=\"true\">Submit</button></root>'"
      explanation: "The <label> node has no active='true' attribute or active descendants, so it is pruned."
    - input: "xml_str = '<screen><nav><icon /></nav><main><input active=\"true\" /></main></screen>'"
      output: "'<screen><main><input active=\"true\" /></main></screen>'"
      explanation: "The entire <nav> subtree contains no active elements and is detached."
  constraints:
    - "xml_str is well-formed XML"
    - "total elements in the tree is between 1 and 500"

constraint_quiz:
  prompt: >-
    In what order should a tree be traversed when deciding whether parent nodes can safely discard child nodes?
  options:
    - "Pre-order (Root -> Left -> Right)"
    - "Post-order / Bottom-up (Children first, then Parent)"
    - "Breadth-First Search only"
    - "In-order traversal"
  answer: 1
  explanation: >-
    Post-order traversal inspects all descendants first. A parent can only determine if its children contain active nodes after the children are evaluated.

