slug: retry-backoff-injected-sleep
lc: 9206
citadel_id: python_data
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: How do distributed backend systems handle intermittent network hiccups without blocking unit tests for
    seconds or minutes? An exponential backoff retry decorator retries failed operations with escalating delays (1s, 2s, 4s).
    Injecting a mock sleep function allows unit tests to execute instantaneously and verify the exact delay sequence deterministically.
  brute_force: Hardcoding time.sleep() directly inside business logic, making automated unit tests painfully slow and flaky.
  brute_force_complexity: High test execution time with non-deterministic test flakiness.
  key_insight: Dependency injection of the sleep function makes time-dependent retry policies 100% deterministic and instantaneous
    to test.
  real_world: Tenacity library in Python, Stripe API SDK retries, and AWS boto3 client retry configurations.
statement:
  clean: "Implement a deterministic retry decorator with exponential backoff and injected sleep:\n`execute_retry_workflow(self,\
    \ failures_before_success: int, max_attempts: int, initial_delay: float, backoff_factor: float) -> dict`.\n\nInputs:\n\
    - `failures_before_success`: number of failures before the target operation succeeds (`failures_before_success >= 0`)\n\
    - `max_attempts`: maximum attempts allowed (`max_attempts >= 1`)\n- `initial_delay`: initial sleep duration in seconds\
    \ (e.g. `1.0`)\n- `backoff_factor`: multiplication factor applied per retry (e.g. `2.0`)\n\nExecution Rules:\n1. Maintain\
    \ an injected `sleep_log` list to record sleep durations without blocking:\n   `def injected_sleep(duration): sleep_log.append(round(duration,\
    \ 2))`\n2. Track attempts starting at `attempts = 0` and `current_delay = initial_delay`.\n3. In each attempt:\n   - Increment\
    \ `attempts += 1`.\n   - If `attempts <= failures_before_success`:\n     - The operation fails.\n     - If `attempts <\
    \ max_attempts`, call `injected_sleep(current_delay)` and update `current_delay *= backoff_factor`.\n   - If `attempts\
    \ > failures_before_success`:\n     - The operation succeeds: set `success = True`, `result = 'Success'`, and break.\n\
    4. If attempts reach `max_attempts` without succeeding:\n   - Set `success = False` and `result = None`.\n5. Return dict:\n\
    \   `{'success': success, 'attempts': attempts, 'delays': sleep_log, 'result': result}`."
  oa_story: '**PayLoop Payment Switch — Flaky Bank Gateway Retry Handler**


    During peak bank clearing hours, partner bank webhooks threw transient HTTP 503 errors. PayLoop engineers implemented
    an exponential backoff decorator to retry failed settlements. However, running integration tests with real `time.sleep`
    slowed the CI/CD pipeline from 3 minutes to 45 minutes.


    The Principal Engineer instructed the team to refactor the retry decorator to accept an injected sleep function. Implement
    this deterministic retry workflow.'
  trigger_keywords:
  - retry decorator with exponential backoff and injected sleep
  - execute_retry_workflow
  - failures_before_success
  examples:
  - input: failures_before_success = 0, max_attempts = 3, initial_delay = 1.0, backoff_factor = 2.0
    output: '{''success'': True, ''attempts'': 1, ''delays'': [], ''result'': ''Success''}'
    explanation: Operation succeeds on first attempt with 0 sleep calls.
  - input: failures_before_success = 2, max_attempts = 3, initial_delay = 1.0, backoff_factor = 2.0
    output: '{''success'': True, ''attempts'': 3, ''delays'': [1.0, 2.0], ''result'': ''Success''}'
    explanation: Operation fails twice, sleeps 1.0s and 2.0s, and succeeds on 3rd attempt.
  constraints:
  - 0 <= failures_before_success <= 10
  - 1 <= max_attempts <= 10
  - initial_delay > 0
  - backoff_factor >= 1.0
constraint_quiz:
  prompt: Why should sleep functions be injected into retry decorators rather than imported directly as time.sleep?
  options:
  - To enable deterministic testing of retry delays in milliseconds without introducing real wall-clock delays in CI test
    suites
  - Because time.sleep is deprecated in Python 3.12
  - To avoid running out of RAM
  - To allow the function to run on microcontrollers
  answer: 0
  explanation: Injecting sleep decouples time simulation from real time, allowing tests to run instantly while recording the
    exact sequence of backoff durations.
pattern_quiz:
  prompt: What formula defines standard exponential backoff delay at retry attempt k (0-indexed)?
  options:
  - delay = initial_delay * (backoff_factor ** k)
  - delay = initial_delay + k
  - delay = initial_delay / (k + 1)
  - delay = initial_delay ** (k + 1)
  answer: 0
  explanation: Exponential backoff multiplies the initial delay by the backoff factor raised to the power of the retry count
    (e.g. 1s, 2s, 4s, 8s).
