  - {args: [[10, 20, 30, 40, 50, 60, 70]], expected: [10, 70, 20, 60, 30, 50, 40]}
visualize_test: 1

drills:
  - title: Find the middle and cut the list in two
    skill: setup
    goal: Use slow/fast pointers to stop slow at the last node of the first half, then cut there.
    instructions: |
      Move `slow` one step and `fast` two steps while `fast.next` and `fast.next.next` exist.
      `slow` then sits on the **last node of the first half**. Cut the list after `slow`
      (`slow.next = None`) and return the head of the second half.

      For `[1,2,3,4]` the second half is `[3,4]`; for `[1,2,3,4,5]` it is `[4,5]` (the first
      half keeps the extra node). Reorder List needs exactly this split: if you don't cut,
      the first half still runs into the second and the merge creates a cycle.
    function:
      name: cutSecondHalf
      params: [{name: head, type: ListNode}]
      returns: ListNode
    starter_code: |
      class Solution:
          def cutSecondHalf(self, head: Optional[ListNode]) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[1, 2, 3, 4]], expected: [3, 4]}
      - {args: [[1, 2, 3, 4, 5]], expected: [4, 5], note: the first half keeps the middle}
      - {args: [[1, 2]], expected: [2]}
      - {args: [[1]], expected: [], note: a single node has an empty second half}
      - {args: [[1, 2, 3, 4, 5, 6]], expected: [4, 5, 6]}
    solution: |
      class Solution:
          def cutSecondHalf(self, head: Optional[ListNode]) -> Optional[ListNode]:
              slow, fast = head, head
              while fast.next and fast.next.next:
                  slow = slow.next
                  fast = fast.next.next
              second = slow.next
              slow.next = None  # cut, so the first half ends at slow
              return second
    hint: "Checking `fast.next and fast.next.next` (not `fast and fast.next`) stops slow one node earlier on even lengths."

  - title: Reverse the second half in place
    skill: core
    goal: Reverse a list with prev/cur/nxt, saving next before you rewire.
    instructions: |
      Reverse the list and return its new head. Keep three pointers: `prev` (the reversed part
      so far, starting at `None`), `cur` (the node being flipped) and `nxt` (saved *before*
      `cur.next` is overwritten, or you lose the rest of the list).

      In Reorder List this is what turns `Ln-1 → Ln` into `Ln → Ln-1`, so the back half can be
      read from the end while still only walking forward.
    function:
      name: reverseChain
      params: [{name: head, type: ListNode}]
      returns: ListNode
    starter_code: |
      class Solution:
          def reverseChain(self, head: Optional[ListNode]) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[3, 4]], expected: [4, 3]}
      - {args: [[4, 5, 6]], expected: [6, 5, 4]}
      - {args: [[7]], expected: [7]}
      - {args: [[]], expected: [], note: an empty second half (single-node list) must not crash}
    solution: |
      class Solution:
          def reverseChain(self, head: Optional[ListNode]) -> Optional[ListNode]:
              prev, cur = None, head
              while cur:
                  nxt = cur.next  # save before rewiring
                  cur.next = prev
                  prev, cur = cur, nxt
              return prev
    hint: "Save `nxt = cur.next` first; then point `cur.next` back at `prev`."

  - title: Zip two halves, first half one longer
    skill: edge
    goal: Merge alternately, saving both next pointers, and stop when the shorter second half runs out.
    instructions: |
      `first` and `second` are two separate lists; `first` has the same length as `second` or
      exactly one more node. Link them alternately (first, second, first, second, …) by
      rewiring nodes and return the head of the merged list.

      The edge people get wrong: loop **while `second`**, not while `first`. When the lengths
      differ, the leftover node of `first` is the middle of the original list; it is already
      in the right place and its `next` is already `None` because of the cut. Save
      `first.next` and `second.next` before rewiring either one.
    function:
      name: zipHalves
      params: [{name: first, type: ListNode}, {name: second, type: ListNode}]
      returns: ListNode
    starter_code: |
      class Solution:
          def zipHalves(self, first: Optional[ListNode], second: Optional[ListNode]) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[1, 2, 3], [5, 4]], expected: [1, 5, 2, 4, 3], note: the extra first-half node stays last}
      - {args: [[1, 2], [4, 3]], expected: [1, 4, 2, 3]}
      - {args: [[1], []], expected: [1], note: nothing to merge}
      - {args: [[1], [2]], expected: [1, 2]}
      - {args: [[7, 8, 9], [1, 2]], expected: [7, 1, 8, 2, 9]}
    solution: |
      class Solution:
          def zipHalves(self, first: Optional[ListNode], second: Optional[ListNode]) -> Optional[ListNode]:
              head = first
              while second:
                  first_next, second_next = first.next, second.next
                  first.next = second
                  second.next = first_next
                  first, second = first_next, second_next
              return head
    hint: "Two temporaries: `first_next, second_next = first.next, second.next`, then rewire, then advance both."

hints:
  - >-
    A singly linked list can only walk forward, but the answer needs the last node, then the
    second-last… How could you make the back half of the list readable from its end while
    still only walking forward?
  - >-
    Split the list at the middle (slow moves 1, fast moves 2), cut the link so the halves are
    separate, reverse the second half, then take one node from each half in turn. Which half
    keeps the extra node when the length is odd, and what does that mean for when the merge
    loop stops?
  - |
    slow, fast = head, head
    while fast.next and fast.next.next: slow = slow.next; fast = fast.next.next
    second = slow.next; slow.next = None          # cut
    reverse second  -> prev is the new head of the back half
    first, second = head, prev
    while second:
        save first.next and second.next
        first.next = second; second.next = saved first.next
        move first and second to the saved nodes

solution:
  code: |
    class Solution:
        def reorderList(self, head: Optional[ListNode]) -> None:
            # 1. find the middle: slow stops at the last node of the first half
            slow, fast = head, head
            while fast.next and fast.next.next:
                slow = slow.next
                fast = fast.next.next

            # 2. cut after slow and reverse the second half
            second = slow.next
            slow.next = None
            prev = None
            while second:
                nxt = second.next
                second.next = prev
                prev = second
                second = nxt

            # 3. zip: one node from the front half, one from the reversed back half
            first, second = head, prev
            while second:
                first_next, second_next = first.next, second.next
                first.next = second
                second.next = first_next
                first, second = first_next, second_next
  explanation: |
    The target order is the first half merged alternately with the second half *reversed*.
    So the solution is three linear passes.

    **Middle.** With the loop condition `fast.next and fast.next.next`, `slow` stops on the
    last node of the first half: node 2 of `[1,2,3,4]`, node 3 of `[1,2,3,4,5]`. The first
    half therefore has the same length as the second, or one more. Setting `slow.next = None`
    matters: without the cut, the end of the first half still points into the second half
    and the merge builds a cycle.

    **Reverse.** Standard in-place reversal; `nxt` is saved before `second.next` is
    overwritten so the rest of the list isn't lost. `prev` ends as the head of the reversed
    back half (`Ln`).

    **Zip.** Take one node from each half in turn, saving both `next` pointers before
    rewiring. The loop runs while `second` exists: when the length is odd, the first half's
    extra node (the original middle) is left at the end, where it belongs, already pointing
    to `None` because of the cut. A single-node list skips both loops and stays as it is.
  time: O(N) — three passes (half the list for the middle, half to reverse, the whole list to zip)
  space: O(1) — only a fixed number of pointers; nodes are rewired, never copied
  brute_force_code: |
    class Solution:
        def reorderList(self, head: Optional[ListNode]) -> None:
            cur = head
            while cur and cur.next and cur.next.next:
                # walk to the node just before the tail: O(N) every time
                before_tail = cur
                while before_tail.next.next:
                    before_tail = before_tail.next
                tail = before_tail.next
                before_tail.next = None
                tail.next = cur.next  # splice the tail in after cur
                cur.next = tail
                cur = tail.next

pitch_script: |
  **(Clarify)** "So I rearrange the nodes in place into first, last, second, second-last and so
  on, I can't just swap values, and I don't return anything. The list has at least one node,
  right?"

  **(Brute force)** "The direct way is to walk to the tail, unhook it and splice it in after the
  current node, then repeat. Every splice re-walks the rest of the list, so that's O(N²). I
  could also copy the nodes into an array and use two indices, which is O(N) time but O(N)
  extra space."

  **(Trigger)** "The order is really the first half merged alternately with the second half
  read backwards. On a singly linked list, 'read backwards' means reverse it, and to reverse
  the second half I first need the middle, which is slow and fast pointers."

  **(Optimal)** "Step one: slow moves one, fast moves two, and slow stops at the end of the
  first half; I cut the list there. Step two: I reverse the second half in place. Step three:
  I zip them, taking one node from each half, saving both next pointers before I rewire.
  The loop runs while the second half has nodes, because on odd lengths the first half has
  the extra middle node, which just stays at the end."

  **(Complexity)** "Three linear passes, so O(N) time, and only a few pointers, so O(1) extra
  space. No values are touched; only the next pointers change."

twist:
  lc: 234
  title: Palindrome Linked List
  why: >-
    The same first two steps, a different third one. Find the middle with slow/fast pointers
    and reverse the second half, but instead of zipping the halves together, walk both halves
    side by side and compare values; any mismatch means it isn't a palindrome. That gives the
    O(1)-space follow-up, and a polite answer reverses the second half back afterwards so the
    caller's list is left intact.
