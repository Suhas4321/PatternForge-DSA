drills:
  - title: Initialize and acquire threading lock
    skill: setup
    goal: Acquire and release a lock using context manager.
    instructions: |
      Increment `val` inside `with lock:` and return it.
    function:
      name: test_lock_inc
      params: [{name: val}]
    starter_code: |
      class Solution:
          def test_lock_inc(self, val: int) -> int:
              pass
    tests:
      - {args: [5], expected: 6}
      - {args: [0], expected: 1}
    solution: |
      import threading

      class Solution:
          def test_lock_inc(self, val: int) -> int:
              lock = threading.Lock()
              with lock:
                  val += 1
              return val
    hint: "Use `with lock: val += 1`."

  - title: Spawn and join thread
    skill: core
    goal: Create a thread, start it, and join.
    instructions: |
      Spawn a thread to append `x` to `out`, join it, and return `out`.
    function:
      name: spawn_and_join
      params: [{name: x}]
    starter_code: |
      class Solution:
          def spawn_and_join(self, x: int) -> list[int]:
              pass
    tests:
      - {args: [42], expected: [42]}
      - {args: [10], expected: [10]}
    solution: |
      import threading

      class Solution:
          def spawn_and_join(self, x: int) -> list[int]:
              out = []
              t = threading.Thread(target=lambda: out.append(x))
              t.start()
              t.join()
              return out
    hint: "Call `t.start()` then `t.join()`."

