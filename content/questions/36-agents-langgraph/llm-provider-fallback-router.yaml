slug: llm-provider-fallback-router
lc: 9633
citadel_id: ai_resume
brick_layer: 5
runner_type: python_practical
concept:
  problem_it_solves: How do production AI applications maintain 99.99% uptime when upstream LLM APIs suffer rate limits (429),
    capacity overload (503), or network timeouts? A resilient gateway attempts the primary provider with retries, and upon
    repeated failure, automatically falls back to an alternate provider (e.g., Anthropic -> Gemini or OpenAI -> Local Llama).
  brute_force: Failing user requests immediately upon receiving a single 429 or 503 response from the primary vendor.
  brute_force_complexity: High error rates during upstream provider brownouts.
  key_insight: Layering retry attempts on the primary provider with an automatic secondary fallback trigger isolates applications
    from single-vendor outages.
  real_world: Portkey AI Gateway, LiteLLM proxy, and enterprise LangChain multi-provider routers.
statement:
  clean: "Implement a multi-provider gateway with retry and fallback routing:\n`route_request(self, prompt: str, primary_provider:\
    \ str, secondary_provider: str, mock_responses: dict, max_retries: int = 2) -> dict`.\n\nInputs:\n- `prompt`: request\
    \ string\n- `primary_provider`: name of primary LLM vendor (e.g. `'anthropic'`)\n- `secondary_provider`: name of fallback\
    \ LLM vendor (e.g. `'gemini'`)\n- `mock_responses`: dict mapping provider name to a list of sequential response dicts:\n\
    \  `{'status_code': int, 'text': str | None, 'error': str | None}`\n- `max_retries`: maximum retry attempts on primary\
    \ provider (`max_retries >= 0`). Total attempts allowed on primary is `1 + max_retries`.\n\nRouting Rules:\n1. Attempt\
    \ `primary_provider` up to `1 + max_retries` times.\n2. If primary returns `status_code == 200`:\n   return immediately:\n\
    \   `{'status': 'success', 'provider_used': primary_provider, 'attempts': total_attempts, 'response': text, 'fallback_triggered':\
    \ False}`.\n3. If primary fails across all attempts (all non-200 status codes):\n   trigger fallback to `secondary_provider`.\n\
    4. Attempt `secondary_provider` (1 attempt).\n   - If secondary succeeds (`status_code == 200`):\n     return:\n     `{'status':\
    \ 'success', 'provider_used': secondary_provider, 'attempts': total_attempts, 'response': text, 'fallback_triggered':\
    \ True}`.\n   - If secondary also fails (non-200):\n     return:\n     `{'status': 'failed', 'provider_used': None, 'attempts':\
    \ total_attempts, 'response': None, 'fallback_triggered': True}`."
  oa_story: '**KiranaKart AI Catalog — High-Availability LLM Ingestion Gateway**


    During grocery inventory onboarding, KiranaKart''s catalog enrichment pipeline sent 500,000 product descriptions to Anthropic
    Claude for attribute extraction. Periodic 429 rate limits caused batch jobs to fail, halting supplier listings.


    The infra team implemented an automated gateway: transient 429s trigger retries on the primary model, while persistent
    503 outages seamlessly fall back to Google Gemini. Implement this gateway routing logic.'
  trigger_keywords:
  - multi-provider gateway with retry and fallback routing
  - mock_responses
  - fallback_triggered
  examples:
  - input: 'prompt = ''Translate hello'', primary = ''anthropic'', secondary = ''gemini'', mock_responses = {''anthropic'':
      [{''status_code'': 200, ''text'': ''Bonjour''}]}, max_retries = 2'
    output: '{''status'': ''success'', ''provider_used'': ''anthropic'', ''attempts'': 1, ''response'': ''Bonjour'', ''fallback_triggered'':
      False}'
    explanation: Primary succeeds on attempt 1 with zero retries.
  - input: 'prompt = ''Analyze text'', primary = ''anthropic'', secondary = ''gemini'', mock_responses = {''anthropic'': [{''status_code'':
      503}, {''status_code'': 503}, {''status_code'': 503}], ''gemini'': [{''status_code'': 200, ''text'': ''Summary''}]},
      max_retries = 2'
    output: '{''status'': ''success'', ''provider_used'': ''gemini'', ''attempts'': 4, ''response'': ''Summary'', ''fallback_triggered'':
      True}'
    explanation: Primary fails 3 times (1 initial + 2 retries), triggering fallback to Gemini which succeeds.
  constraints:
  - 0 <= max_retries <= 5
  - mock_responses contains list of dicts with status_code
constraint_quiz:
  prompt: Why should an LLM gateway fail over to a secondary provider only after exhausting primary retries?
  options:
  - To preserve quality consistency and negotiated prompt optimizations on the primary model before accepting potential behavioral
    discrepancies on a secondary model
  - Because secondary models are always free of charge
  - To avoid running Python garbage collection
  - Because DNS resolution takes 5 minutes per provider
  answer: 0
  explanation: Different LLMs exhibit subtle prompt sensitivities and output formats. Retrying the primary model first preserves
    consistency; falling back is reserved for actual vendor outages.
pattern_quiz:
  prompt: Which resilience pattern describes switching to an alternative provider when the primary provider encounters repeated
    errors?
  options:
  - Fallback / Hedged Request pattern
  - Singleton pattern
  - Flyweight pattern
  - Two-Phase Commit pattern
  answer: 0
  explanation: The Fallback pattern gracefully degrades or reroutes failed upstream operations to a standby provider.
