  title: Multi-Objective Pareto Frontier Domination
  why: >-
    Instead of a single scalar fitness formula with a fixed penalty multiplier,
    compute the Non-Dominated Sorting (NSGA-II) Pareto frontier across 3 dimensions: latency, token cost, and eval score.

