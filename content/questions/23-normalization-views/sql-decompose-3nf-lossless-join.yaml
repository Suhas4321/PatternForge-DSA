concept:
  problem_it_solves: Why does storing customer addresses and product prices repeatedly inside an order item row cause data
    corruption? In an unnormalized flat table, updating a product price requires updating thousands of historical rows, risking
    inconsistent data. Decomposing into Third Normal Form (3NF) isolates distinct entities (Customers, Products, OrderItems),
    removing transitive dependencies and guaranteeing the Lossless Join property.
  brute_force: Keeping a single wide table with 40 columns, leading to update anomalies, deletion anomalies, and severe storage
    bloat.
  brute_force_complexity: O(N) redundant data storage and prone to data inconsistency.
  key_insight: A 3NF decomposition is validated by performing an INNER JOIN across the normalized tables. If the joined output
    reconstructs the exact original line items without spurious tuples, the decomposition is mathematically lossless.
  real_world: Relational schema design for ERPs, e-commerce order databases, and microservice domain entities.
statement:
  clean: "Write a SQL query to verify a 3NF database decomposition by reconstructing order line items through a lossless join.\n\
    \nNormalized Table Schemas:\n```sql\nCREATE TABLE Customers (\n    customer_id INTEGER PRIMARY KEY,\n    customer_name\
    \ TEXT,\n    customer_email TEXT\n);\n\nCREATE TABLE Products (\n    product_id INTEGER PRIMARY KEY,\n    product_name\
    \ TEXT,\n    category TEXT,\n    price INTEGER\n);\n\nCREATE TABLE OrderItems (\n    order_id INTEGER,\n    customer_id\
    \ INTEGER,\n    product_id INTEGER,\n    quantity INTEGER,\n    PRIMARY KEY(order_id, product_id)\n);\n```\n\nTask:\n\
    Reconstruct the complete order item records by joining `OrderItems`, `Customers`, and `Products`.\n\nReturn columns:\n\
    - `order_id`: from `OrderItems`\n- `customer_name`: from `Customers`\n- `product_name`: from `Products`\n- `price`: unit\
    \ price from `Products`\n- `quantity`: order quantity from `OrderItems`\n- `item_total`: computed as `price * quantity`\n\
    \nOrder by `order_id` ascending, then `product_name` ascending."
  oa_story: '**BlinkFast Inventory Architecture — Normalization Migration**


    BlinkFast''s quick-commerce orders were initially dumped into a single denormalized table. When brand names were updated,
    old orders retained stale manufacturer names, creating tax reporting discrepancies.


    The database architect decomposed the schema into 3NF (`Customers`, `Products`, and `OrderItems`). Write the verification
    query to prove that joining these normalized tables losslessly reconstructs complete order details.'
  trigger_keywords:
  - 3nf database decomposition
  - OrderItems
  - lossless join
  examples:
  - input: 'OrderItems: [(1001, 1, 101, 1), (1001, 1, 102, 2)]; Customers: [(1, ''Aarav'')]; Products: [(101, ''Headphones'',
      4000), (102, ''Keyboard'', 3000)]'
    output: '[(1001, ''Aarav'', ''Headphones'', 4000, 1, 4000), (1001, ''Aarav'', ''Keyboard'', 3000, 2, 6000)]'
    explanation: 3NF normalized tables join losslessly to reconstruct line item totals.
  constraints:
  - Primary keys are strictly enforced
  - Foreign keys match valid parent entity IDs
constraint_quiz:
  prompt: What mathematical property ensures that decomposing a table into multiple normalized tables does not lose information
    or introduce phantom rows?
  options:
  - Lossless-Join Property (Lossless Decomposition)
  - B-Tree index rebalancing
  - ACID Durability
  - UTF-8 character collation
  answer: 0
  explanation: A decomposition is lossless if and only if natural joining the decomposed tables produces exactly the original
    relation with no missing or spurious records.
pattern_quiz:
  prompt: What functional dependency defines Third Normal Form (3NF)?
  options:
  - Every non-key attribute must be non-transitively dependent on the primary key ('The key, the whole key, and nothing but
    the key, so help me Codd')
  - All column names must start with a vowel
  - Every table must have exactly 3 columns
  - Tables must be stored in separate database files
  answer: 0
  explanation: '3NF requires a table to be in 2NF with no transitive dependencies: non-key columns cannot depend on other
    non-key columns.'
