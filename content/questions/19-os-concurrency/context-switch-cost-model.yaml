hints:
- Check whether `switch_type == 'thread'` or `'process'` to choose base and TLB constants.
- Multiply overhead per switch by total switches, then divide by 1,000,000 to get milliseconds.
- '| # Pseudocode Blueprint

  | if switch_type == "thread":

  |     base = 1200, tlb = 0, cache = int(rate * 3000)

  | else:

  |     base = 3500, tlb = 4500, cache = int(rate * 12000)

  | overhead = base + tlb + cache

  | total_ns = overhead * switches

  | return total_ns, round(total_ns / 1e6, 4)'
solution:
  code: "class Solution:\n    def compare_context_switch_costs(self, switches: int, switch_type: str, cache_miss_rate: float)\
    \ -> dict:\n        if switch_type == \"thread\":\n            base_ns = 1200\n            tlb_ns = 0\n            cache_ns\
    \ = int(cache_miss_rate * 3000)\n        else:\n            base_ns = 3500\n            tlb_ns = 4500\n            cache_ns\
    \ = int(cache_miss_rate * 12000)\n\n        overhead_per_switch = base_ns + tlb_ns + cache_ns\n        total_ns = overhead_per_switch\
    \ * switches\n        total_ms = round(total_ns / 1_000_000, 4)\n\n        return {\n            \"switch_type\": switch_type,\n\
    \            \"switches\": switches,\n            \"overhead_per_switch_ns\": overhead_per_switch,\n            \"total_latency_ns\"\
    : total_ns,\n            \"total_latency_ms\": total_ms,\n        }\n"
  explanation: Threads share virtual memory page tables, so thread switching incurs zero TLB flush penalty and minimal cache
    disturbance. Process switching invalidates the CPU TLB and forces high cache miss penalties, making process context switches
    5x to 10x more expensive.
  time: O(1) arithmetic calculation
  space: O(1) returned dictionary
pitch_script: '**(Clarify)** "We need to calculate the context switch latency overhead for threads versus processes based
  on base register swaps, TLB flushes, and cache miss rates."


  **(Brute force)** "Treating thread and process scheduling costs identically leads to poor architectural sizing in high-concurrency
  systems."


  **(Trigger)** "Quantifying context switch penalties based on hardware cache misses and TLB invalidation signals an OS latency
  model."


  **(Optimal)** "For threads, base latency is 1200ns with 0ns TLB cost and low cache penalty. For processes, changing address
  space requires a 4500ns TLB flush and 4x cache miss penalty. Multiplying by switch count yields exact microsecond and millisecond
  figures."


  **(Complexity)** "Executes in O(1) time and space." '
