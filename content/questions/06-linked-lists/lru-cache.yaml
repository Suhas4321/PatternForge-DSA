drills:
  - title: Insert right after the dummy head
    skill: setup
    goal: Set up dummy head and tail sentinels and insert nodes at the front with all four pointer writes.
    instructions: |
      Keys are used in the order given. Starting from an empty list with a dummy `head` and a
      dummy `tail` (`head.next = tail`, `tail.prev = head`), insert each key **right after
      `head`**, so the most recently used key is always first. Return
      `[forward, backward]`: the keys walking `head → tail` via `next`, and walking
      `tail → head` via `prev`.

      Inserting after the head takes four pointer writes: the new node's `prev` and `next`,
      the old first node's `prev`, and `head.next`. Forget one and the backward walk gives a
      different answer from the forward walk, which is exactly the kind of bug that makes an
      LRU cache evict the wrong key.
    function:
      name: frontInserts
      params: [{name: keys}]
    starter_code: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      class Solution:
          def frontInserts(self, keys: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[1, 2, 3]], expected: [[3, 2, 1], [1, 2, 3]]}
      - {args: [[7]], expected: [[7], [7]]}
      - {args: [[]], expected: [[], []], note: "only the two sentinels: head.next is tail"}
      - {args: [[4, 9]], expected: [[9, 4], [4, 9]]}
    solution: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      class Solution:
          def frontInserts(self, keys: List[int]) -> List[List[int]]:
              head, tail = Node(), Node()
              head.next, tail.prev = tail, head
              for k in keys:
                  node = Node(k)
                  node.prev, node.next = head, head.next
                  head.next.prev = node
                  head.next = node
              forward, cur = [], head.next
              while cur is not tail:
                  forward.append(cur.key)
                  cur = cur.next
              backward, cur = [], tail.prev
              while cur is not head:
                  backward.append(cur.key)
                  cur = cur.prev
              return [forward, backward]
    hint: "Wire the new node first (`node.prev, node.next = head, head.next`), then fix its neighbours."

  - title: Touch a key, move it to the front
    skill: core
    goal: Unlink a node from the middle in O(1) using prev/next, then reinsert it after the head.
    instructions: |
      The list is built for you from `keys` (most recent first), with a `nodes` dictionary
      from key to node, exactly like the cache's map. Key `key` has just been used: unlink its
      node from where it is and insert it right after `head`. Return the keys from most to
      least recent.

      This is what `get` and an updating `put` do. Unlinking needs only the node itself:
      `node.prev.next = node.next` and `node.next.prev = node.prev`. Thanks to the dummy
      sentinels, the first and last real nodes have neighbours too, so there are no special
      cases.
    function:
      name: touch
      params: [{name: keys}, {name: key}]
    starter_code: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      def build(keys):
          """dummy head <-> keys... <-> dummy tail; returns head, tail and {key: node}."""
          head, tail = Node(), Node()
          head.next, tail.prev = tail, head
          nodes = {}
          for k in keys:
              node = Node(k)
              node.prev, node.next = tail.prev, tail
              tail.prev.next = node
              tail.prev = node
              nodes[k] = node
          return head, tail, nodes


      class Solution:
          def touch(self, keys: List[int], key: int) -> List[int]:
              head, tail, nodes = build(keys)
              pass
    tests:
      - {args: [[1, 2, 3], 3], expected: [3, 1, 2], note: the least recent key jumps to the front}
      - {args: [[1, 2, 3], 2], expected: [2, 1, 3]}
      - {args: [[1, 2, 3], 1], expected: [1, 2, 3], note: already the most recent}
      - {args: [[5], 5], expected: [5], note: the only real node}
    solution: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      def build(keys):
          """dummy head <-> keys... <-> dummy tail; returns head, tail and {key: node}."""
          head, tail = Node(), Node()
          head.next, tail.prev = tail, head
          nodes = {}
          for k in keys:
              node = Node(k)
              node.prev, node.next = tail.prev, tail
              tail.prev.next = node
              tail.prev = node
              nodes[k] = node
          return head, tail, nodes


      class Solution:
          def touch(self, keys: List[int], key: int) -> List[int]:
              head, tail, nodes = build(keys)
              node = nodes[key]
              node.prev.next = node.next  # unlink: neighbours skip over node
              node.next.prev = node.prev
              node.prev, node.next = head, head.next  # reinsert after head
              head.next.prev = node
              head.next = node
              order, cur = [], head.next
              while cur is not tail:
                  order.append(cur.key)
                  cur = cur.next
              return order
    hint: "Unlink first, then insert; if you insert first, `node.prev`/`node.next` no longer describe where it was."

  - title: Evict from the tail, and know which key you evicted
    skill: edge
    goal: After inserting a new key, evict tail.prev when over capacity and remove it from the map using the node's key.
    instructions: |
      The list is built for you from `keys` (most recent first) with a `nodes` map. A **new**
      key `key` is put: insert it after `head` and add it to `nodes`. If `len(nodes)` now
      exceeds `capacity`, evict the least recently used node, `tail.prev`: unlink it and
      delete it from `nodes`. Return `[order, evicted]`, where `order` is the keys from most
      to least recent and `evicted` is the evicted key, or `-1` if nothing was evicted.

      Two classic mistakes live here: evicting before inserting (which can throw out a key
      when there was still room), and not knowing which map entry to delete. The list node is
      the only thing that knows its key at eviction time, which is why cache nodes store the
      key and not just the value.
    function:
      name: putNew
      params: [{name: keys}, {name: capacity}, {name: key}]
    starter_code: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      def build(keys):
          """dummy head <-> keys... <-> dummy tail; returns head, tail and {key: node}."""
          head, tail = Node(), Node()
          head.next, tail.prev = tail, head
          nodes = {}
          for k in keys:
              node = Node(k)
              node.prev, node.next = tail.prev, tail
              tail.prev.next = node
              tail.prev = node
              nodes[k] = node
          return head, tail, nodes


      class Solution:
          def putNew(self, keys: List[int], capacity: int, key: int) -> List:
              head, tail, nodes = build(keys)
              pass
    tests:
      - {args: [[2, 1], 2, 3], expected: [[3, 2], 1], note: "full: the tail end (key 1) is evicted"}
      - {args: [[4, 3], 3, 9], expected: [[9, 4, 3], -1], note: "still room: nothing is evicted"}
      - {args: [[1], 1, 2], expected: [[2], 1], note: capacity 1}
      - {args: [[], 1, 5], expected: [[5], -1], note: empty cache}
      - {args: [[8, 6, 7], 3, 1], expected: [[1, 8, 6], 7]}
    solution: |
      class Node:
          def __init__(self, key=0):
              self.key = key
              self.prev = None
              self.next = None


      def build(keys):
          """dummy head <-> keys... <-> dummy tail; returns head, tail and {key: node}."""
          head, tail = Node(), Node()
          head.next, tail.prev = tail, head
          nodes = {}
          for k in keys:
              node = Node(k)
              node.prev, node.next = tail.prev, tail
              tail.prev.next = node
              tail.prev = node
              nodes[k] = node
          return head, tail, nodes


      class Solution:
          def putNew(self, keys: List[int], capacity: int, key: int) -> List:
              head, tail, nodes = build(keys)
              node = Node(key)
              nodes[key] = node
              node.prev, node.next = head, head.next
              head.next.prev = node
              head.next = node
              evicted = -1
              if len(nodes) > capacity:  # insert first, then check
                  lru = tail.prev
                  lru.prev.next = tail  # unlink the last real node
                  tail.prev = lru.prev
                  del nodes[lru.key]  # the node knows its own key
                  evicted = lru.key
              order, cur = [], head.next
              while cur is not tail:
                  order.append(cur.key)
                  cur = cur.next
              return [order, evicted]
    hint: "The least recently used node is always `tail.prev`; read `lru.key` before you lose the node."

hints:
  - >-
    A dictionary finds a key in O(1) but forgets order; a list remembers order but finding a
    key in it is O(N). What if the dictionary pointed straight at the key's position in an
    ordered list, and that list let you cut a node out from the middle in O(1)?
  - >-
    Keep a doubly linked list in recency order between a dummy head (most recent side) and a
    dummy tail (least recent side), and a dict key → node. get: look up the node, move it to
    the front, return its value. put: update-and-move, or create-and-insert at the front; if
    the dict is now larger than capacity, remove tail.prev from the list and its key from the
    dict.
  - |
    init: cache = {}; head <-> tail (dummy sentinels)
    remove(node):   node.prev.next = node.next; node.next.prev = node.prev
    add_front(node): link node between head and head.next
    get(key):
        if key not in cache: return -1
        node = cache[key]; remove(node); add_front(node); return node.val
    put(key, value):
        if key in cache: node = cache[key]; node.val = value; remove(node)
        else: node = new Node(key, value); cache[key] = node
        add_front(node)
        if len(cache) > capacity: lru = tail.prev; remove(lru); delete cache[lru.key]

solution:
  code: |
    class Node:
        def __init__(self, key=0, val=0):
            self.key = key  # stored so eviction knows which map entry to delete
            self.val = val
            self.prev = None
            self.next = None


    class LRUCache:

        def __init__(self, capacity: int):
            self.capacity = capacity
            self.cache = {}  # key -> Node
            # sentinels: head.next is the most recent entry, tail.prev the least recent
            self.head, self.tail = Node(), Node()
            self.head.next, self.tail.prev = self.tail, self.head

        def _remove(self, node):
            before, after = node.prev, node.next
            before.next, after.prev = after, before

        def _add_front(self, node):
            first = self.head.next
            node.prev, node.next = self.head, first
            first.prev = node
            self.head.next = node

        def get(self, key: int) -> int:
            if key not in self.cache:
                return -1
            node = self.cache[key]
            self._remove(node)  # a read is a use: move to the front
            self._add_front(node)
            return node.val

        def put(self, key: int, value: int) -> None:
            if key in self.cache:
                node = self.cache[key]
                node.val = value
                self._remove(node)
            else:
                node = Node(key, value)
                self.cache[key] = node
            self._add_front(node)
            if len(self.cache) > self.capacity:
                lru = self.tail.prev  # least recently used sits just before the tail
                self._remove(lru)
                del self.cache[lru.key]
  explanation: |
    Two structures, each covering the other's weakness. The dictionary `cache` maps a key to
    its node in O(1). The doubly linked list keeps the nodes in recency order: `head.next` is
    the most recently used, `tail.prev` the least. Because each node has `prev` and `next`,
    `_remove` can cut it out of the middle with two pointer writes, and `_add_front` links it
    back in after the head with four.

    **get** is a use, so a hit moves the node to the front before returning its value; a miss
    changes nothing. **put** on an existing key updates the value and moves the node to the
    front (it's a use, and it must not create a second node). A new key gets a new node at
    the front; only then, if the cache holds more than `capacity` keys, the node at
    `tail.prev` is evicted. Inserting first and evicting after means an update on a full
    cache never evicts anything, because the size didn't grow.

    The node stores its `key` because at eviction time all you have is the node, and you
    still need to delete its entry from the dictionary. The dummy `head` and `tail` mean every
    real node always has two neighbours, so neither helper ever checks for `None`.

    **The shortcut.** In Python, `collections.OrderedDict` with `move_to_end(key)` and
    `popitem(last=False)` does all of this in about ten lines. Mention it, but many
    interviewers will then ask you to build the linked list yourself, because that is the
    skill being tested.
  time: O(1) — get and put each do one dict operation and a constant number of pointer writes (average, because of hashing)
  space: O(capacity) — at most capacity + 1 nodes and dict entries (briefly one over before eviction), plus two sentinels
  brute_force_code: |
    class LRUCache:

        def __init__(self, capacity: int):
            self.capacity = capacity
            self.values = {}
            self.order = []  # keys, least recent first

        def get(self, key: int) -> int:
            if key not in self.values:
                return -1
            self.order.remove(key)  # O(capacity) scan
            self.order.append(key)
            return self.values[key]

        def put(self, key: int, value: int) -> None:
            if key in self.values:
                self.order.remove(key)
            elif len(self.values) == self.capacity:
                oldest = self.order.pop(0)  # O(capacity) shift
                del self.values[oldest]
            self.values[key] = value
            self.order.append(key)

pitch_script: |
  **(Clarify)** "So get returns the value or -1, put inserts or updates, and both count as a
  use. When a put pushes the size over capacity I evict the least recently used key, and both
  operations should be O(1) on average. Capacity is at least 1, right?"

  **(Brute force)** "A dict for values plus a list of keys in recency order works, but every
  get has to find the key in the list and move it, and evicting from the front shifts the
  list, so each call is O(capacity)."

  **(Trigger)** "O(1) lookup by key plus O(1) 'move this to the most-recent end' and 'drop
  the oldest' is the hash map plus doubly linked list design. The map jumps to the node, and
  prev and next pointers let me unlink it from anywhere in constant time."

  **(Optimal)** "I keep a dict from key to node and a doubly linked list between a dummy head
  and a dummy tail, with the most recent entry right after the head. get looks up the node,
  moves it to the front and returns its value. put updates and moves an existing node, or
  creates a new one at the front; then, if the size is over capacity, I remove tail.prev and
  delete its key from the dict, which is why every node stores its key. The sentinels mean I
  never special-case an empty list."

  **(Complexity)** "Every operation is one dict lookup and a constant number of pointer
  changes, so O(1) average time, and O(capacity) space. In production Python I'd reach for
  OrderedDict with move_to_end and popitem(last=False), but I'm happy to build the list by
  hand, since that's the part being tested."

twist:
  lc: 460
  title: LFU Cache
  why: >-
    Now you evict the *least frequently* used key, breaking ties by least recently used. One
    recency list isn't enough: keep a dict from frequency → its own LRU doubly linked list,
    the key → node map, and a `min_freq` counter. A get or put moves the node from the list
    for frequency f to the front of the list for f + 1 (bumping min_freq if list f became
    empty); eviction removes the tail of the min_freq list. Same unlink/insert-at-front moves,
    just one list per frequency.

viz:
  layout: current
  maps: [self.cache]
  watch: [key, value]
