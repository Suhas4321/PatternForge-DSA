  solution: "class Solution:\n    def step_list(self, lst: list, token: str, default: any) -> any:\n        if isinstance(lst,\
    \ list) and token.isdigit():\n            idx = int(token)\n            if 0 <= idx < len(lst):\n                return\
    \ lst[idx]\n        return default\n"
  hint: Verify token.isdigit() and bound checks.
hints:
- Return data immediately if path is empty.
- Iterate tokens from path.split('.').
- Handle isinstance(current, dict) and isinstance(current, list); return default on lookup failure.
solution:
  code: "class Solution:\n    def safe_resolve_path(self, data: dict | list, path: str, default: any = None) -> any:\n   \
    \     if not path:\n            return data\n            \n        tokens = path.split(\".\")\n        current = data\n\
    \        \n        for token in tokens:\n            if isinstance(current, dict):\n                if token in current:\n\
    \                    current = current[token]\n                else:\n                    return default\n           \
    \ elif isinstance(current, list):\n                if token.isdigit():\n                    idx = int(token)\n       \
    \             if 0 <= idx < len(current):\n                        current = current[idx]\n                    else:\n\
    \                        return default\n                else:\n                    return default\n            else:\n\
    \                return default\n                \n        return current\n"
  explanation: Traverses nested collections iteratively, checking types and bounds at every step to prevent KeyError or IndexError
    crashes.
  time: O(T) where T is the number of tokens in the path
  space: O(T) to store parsed path tokens
pitch_script: '**(Clarify)** "We need to safely navigate deep nested JSON trees supporting dot-separated dictionary keys and
  list index tokens with fallback defaults."


  **(Basement Insight)** "Relying on direct dictionary indexing crashes when payloads are sparse or irregular. A robust path
  resolver traverses step-by-step with defensive type and boundary checks."


  **(Solution)** "We split the path on dots and advance through dicts or lists sequentially. If a key is missing or index
  out of range, we return the default value safely."


  **(Complexity)** "Executes in O(T) time where T is token depth, using O(T) space."

  '
