slug: valid-parentheses
lc: 20

concept:
  problem_it_solves: >-
    "Does every closing thing match the most recent thing that is still open?" Nested
    structures close in the reverse order they opened, so the only opener a closer may ever
    match is the newest unclosed one. A stack keeps exactly that newest-unclosed opener on top,
    so each check is O(1).
  brute_force: >-
    Repeatedly delete every adjacent matched pair ("()", "[]", "{}") from the string until
    nothing changes; the string is valid if it ends up empty. Each pass rescans and rebuilds
    the whole string just to peel off the innermost layer, so a deeply nested input like
    "((((…))))" needs N/2 passes.
  brute_force_complexity: O(N²) time, O(N) space — 10⁴ characters means up to ~5 × 10⁷ character copies.
  key_insight: >-
    You never need to look back past the newest unclosed opener. When a closer arrives, it
    must match the opener on top of the stack, or the string is broken right there. Push
    openers, and for each closer check-and-pop the top. Valid means no closer ever failed
    *and* the stack is empty at the end.
  real_world: >-
    Every JSON, XML and HTML parser keeps a stack of open tags or braces and errors out the
    moment a closer doesn't match the top. Code editors like VS Code use the same stack to
    highlight matching brackets, and linters use it to report "unclosed {" at the exact line.

statement:
  clean: |
    Given a string `s` containing just the characters `'('`, `')'`, `'{'`, `'}'`, `'['` and
    `']'`, determine if the input string is valid.

    An input string is valid if:

    1. Open brackets must be closed by the **same type** of brackets.
    2. Open brackets must be closed in the **correct order**.
    3. **Every close bracket has a corresponding open bracket** of the same type.
  oa_story: |
    **PinCodePost Logistics — OA Round 1**

    PinCodePost's sorting hub in Hoskote packs parcels inside crates, crates inside cages,
    and sometimes cages inside crates again. Every time a handler starts filling a container
    the scanner logs an "open" code for that container type, and when they seal it the scanner
    logs a "seal" code: `(` and `)` for pouches, `[` and `]` for crates, `{` and `}` for cages.
    A container can only be sealed after everything placed inside it has been sealed.

    Given one handler's scanner log for a shift as a string, return `true` if the log is
    consistent: every seal code seals a container of the same type, containers are sealed in
    an order that is physically possible, and nothing is sealed that was never opened or left
    open at the end. Logs can be up to 10,000 codes long.
  trigger_keywords: ["same type", "correct order", "every close bracket has a corresponding open bracket"]
  examples:
    - input: "s = \"()\""
      output: "true"
    - input: "s = \"()[]{}\""
      output: "true"
      explanation: "Each opener is closed immediately by its own type."
    - input: "s = \"([)]\""
      output: "false"
      explanation: "The ')' arrives while '[' is the most recent open bracket, so the order is wrong even though the counts balance."
  constraints:
    - "1 <= s.length <= 10^4"
    - "s consists of parentheses only '()[]{}'"

constraint_quiz:
  prompt: With a string of up to 10⁴ characters, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(1)"]
  answer: 2
  explanation: >-
    O(N²) (the "delete matched pairs until nothing changes" approach) is ~5 × 10⁷ character
    operations on deeply nested input: it might squeak through but it is the answer an
    interviewer pushes back on. O(N log N) implies sorting, and sorting destroys the order
    that decides validity. O(1) is impossible because you must read every character. One
    left-to-right pass with a stack is O(N).

pattern_quiz:
  prompt: >-
    Open brackets must be closed by the same type and in the correct order. Which pattern
    fits?
  options:
    - "Count each bracket type and check the counts are equal"
    - "Stack of unclosed openers; each closer must match the top"
    - "Two pointers from both ends, matching outer pairs inward"
    - "Hash set of the brackets seen so far"
  answer: 1
  explanation: >-
    "Correct order" for nested pairs is the matching-stack trigger: the last opener is the
    first one that must close (LIFO). Counting fails on "([)]", where every count balances
    but the order is wrong. Two pointers fail on "()[]", where the outer characters '(' and
    ']' don't pair. A set forgets order entirely.

