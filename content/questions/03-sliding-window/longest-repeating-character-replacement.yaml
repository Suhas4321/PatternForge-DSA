slug: longest-repeating-character-replacement
lc: 424

concept:
  problem_it_solves: >-
    "How long can a stretch be if I'm allowed to fix up to k cells in it?" For any window,
    the cheapest way to make it one letter is to keep its most frequent letter and replace
    everything else, so the window costs (length − maxFreq) replacements. The question
    becomes: what is the longest contiguous window whose cost is at most k?
  brute_force: >-
    For every start i, extend j one step at a time with a 26-slot count, and after each step
    check whether (j − i + 1) − max(count) <= k. Every start rebuilds the counts from nothing,
    re-counting letters that the previous start had already counted.
  brute_force_complexity: >-
    O(N² · 26) time (O(N²) if you track the max incrementally), O(26) space — 10⁵ letters
    means ~5 × 10⁹ window checks.
  key_insight: >-
    A window is valid while (r − l + 1) − maxFreq <= k: the non-majority letters are the ones
    you'd replace. Since you only care about the *longest* valid window, the window never has
    to shrink: when it becomes invalid, slide it (move l by one) instead. And maxFreq never
    has to go down, because a window longer than your best can only exist if some letter
    reaches a count higher than any maxFreq you've already seen. A stale, too-high maxFreq
    just makes the window slide at its current size; it can never record a length that no
    valid window achieved.
  real_world: >-
    Error-tolerant matching in genomics and log analytics ("longest run of the same reading
    allowing k glitches") uses this window. Data-quality jobs in pipelines (Airflow, dbt)
    look for the longest stretch of a sensor or metric that is uniform up to k outliers, and
    networking stacks size bursts with the same "length minus majority" budget.

statement:
  clean: |
    You are given a string `s` and an integer `k`. You can choose any character of the
    string and change it to any other uppercase English character. You can perform this
    operation **at most k times**.

    Return the length of the **longest substring containing the same letter** you can get
    after performing the above operations.
  oa_story: |
    **RailRaja Mobility — OA Round 2**

    RailRaja helps Indian Railways plan special rakes for festival rush on the
    Bengaluru–Mysuru line. A rake is described as a string of uppercase letters, one letter
    per coach in order from the engine, where each letter is the coach's class (S for
    sleeper, B for third AC, and so on).

    A large tour group wants one unbroken block of adjacent coaches that are all the same
    class. The yard can re-fit at most `k` coaches to a different class before departure.
    Given the rake string and `k`, return the number of coaches in the largest such block
    the yard can produce. Rakes in the planning tool are simulated with up to 100,000 coaches,
    and the answer is needed for every candidate rake in a single nightly batch.
  trigger_keywords: ["at most k times", "longest substring containing the same letter"]
  examples:
    - input: "s = \"ABAB\", k = 2"
      output: "4"
      explanation: "Replace the two 'A's with two 'B's or vice versa."
    - input: "s = \"AABABBA\", k = 1"
      output: "4"
      explanation: "Replace the one 'A' in the middle with 'B' and form \"AABBBBA\". The substring \"BBBB\" has the longest repeating letters, which is 4."
  constraints:
    - "1 <= s.length <= 10^5"
    - "s consists of only uppercase English letters."
    - "0 <= k <= s.length"

constraint_quiz:
  prompt: With s up to 10⁵ characters, what time complexity should you aim for?
  options: ["O(N² · 26)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    O(N² · 26) is ~10¹¹ and O(N²) is ~5 × 10⁹, both far too slow. O(N log N) would pass
    (binary search on the answer length with a fixed window check), but it is more code and
    slower than needed. A single sliding window is O(N) (or O(26 · N) if you recompute the
    max over 26 counts each step), and both pass easily.

pattern_quiz:
  prompt: >-
    Find the longest contiguous stretch that can be made all one letter with at most k
    changes. Which pattern fits?
  options:
    - "Greedy: always replace the k least frequent letters in the whole string"
    - "Variable sliding window with letter counts, valid while length − maxFreq <= k"
    - "Prefix sums + hash map"
    - "Dynamic programming over (index, replacements left)"
  answer: 1
  explanation: >-
    "Longest substring" plus "at most k" is the variable-window trigger you used for Max
    Consecutive Ones III. The only new part is what "bad" means: in a window, every letter
    that isn't the majority letter is a replacement, so the cost is length − maxFreq. Global
    greedy ignores contiguity, prefix sums suit "sum equals k", and the DP is O(N · k).

