slug: middle-of-the-linked-list
lc: 876

concept:
  problem_it_solves: >-
    "Where is the halfway point when I don't know how long the list is?" A linked list has no
    length field and no indexing, so "go to index n / 2" means first discovering n. Two
    pointers moving at different speeds measure the halfway point while walking, in a single
    pass and without counting.
  brute_force: >-
    Copy every node into an array and return `nodes[len(nodes) // 2]`, or walk once to count
    the nodes and walk again n // 2 steps. Both are linear, but the array costs O(N) memory and
    the counting version walks the first half of the list twice. More importantly, neither
    teaches the move that Linked List Cycle, Reorder List and Palindrome Linked List depend on.
  brute_force_complexity: >-
    O(N) time with O(N) extra space for the array, or O(N) time and O(1) space in two passes
    (about 1.5 N steps) for the counting version.
  key_insight: >-
    Send `fast` two nodes per step and `slow` one node per step, both from the head. After k
    steps slow is at index k and fast is at index 2k, so slow has always covered exactly half
    of fast's distance. When fast can't take another double step, it has reached the end, and
    slow is at the halfway point. The loop guard `while fast and fast.next` stops at the right
    moment for both odd and even lengths, and for even lengths it leaves slow on the second
    middle.
  real_world: >-
    Splitting a linked list in half is the first step of merge sort on linked lists, which is
    how sorted linked structures are sorted without random access (GNU libstdc++'s
    `std::list::sort` is a merge sort). The same "two readers at different speeds" idea finds
    the halfway point of a stream of unknown length in one pass, for example when splitting a
    work queue between two consumers.

statement:
  clean: |
    Given the `head` of a singly linked list, return the **middle node** of the linked list.

    If there are **two middle nodes**, return the **second middle** node.
  oa_story: |
    **QueueKart — OA Round 1**

    QueueKart runs 10-minute grocery delivery out of dark stores in Whitefield. Orders waiting
    for dispatch form a chain: each order slip stores a bill amount and a reference to the
    slip packed after it, and nobody keeps a count of how many slips are in the chain. When a
    rush hits, the chain is split between two riders: the first rider takes the front half and
    the second rider starts at the halfway slip.

    Given the first slip of a non-empty chain, return the slip where the second rider starts,
    so that the second rider's chain is that slip and everything after it. With an odd number
    of slips, the second rider starts at the exact centre. With an even number, there are two
    central slips, and the second rider starts at the later one. The dispatch screen must
    respond after reading the chain only once.
  trigger_keywords: ["middle node", "two middle nodes", "second middle"]
  examples:
    - input: "head = [1,2,3,4,5]"
      output: "[3,4,5]"
      explanation: "The middle node is 3; returning it means returning the list 3 -> 4 -> 5."
    - input: "head = [1,2,3,4,5,6]"
      output: "[4,5,6]"
      explanation: "There are two middle nodes, 3 and 4. We return the second one, 4."
  constraints:
    - "The number of nodes in the list is in the range [1, 100]."
    - "1 <= Node.val <= 100"

constraint_quiz:
  prompt: >-
    The list has at most 100 nodes, so almost anything passes on time. What should you aim
    for to give the answer interviewers actually want?
  options:
    - "O(N²) time — for each node, count the nodes after it"
    - "O(N) time, O(N) space — copy nodes into an array and index the middle"
    - "O(N) time, O(1) space, one pass — slow and fast pointers"
    - "O(log N) time — binary search for the middle"
  answer: 2
  explanation: >-
    With N = 100, even O(N²) is only 10⁴ steps, so the constraint is not the filter here; the
    interviewer is checking whether you know fast/slow pointers. Counting the suffix for every
    node is pointless repeated work. The array works but spends O(N) memory. Binary search is
    impossible because a linked list has no random access: reaching any node costs walking to
    it. Slow and fast pointers find the middle in one pass with two variables.

pattern_quiz:
  prompt: >-
    You need the middle of a singly linked list of unknown length, ideally in one pass with
    O(1) extra space. Which pattern fits?
  options:
    - "Dummy head node"
    - "Reverse the list, then walk half of it"
    - "Fast and slow pointers"
    - "Hash map from index to node"
  answer: 2
  explanation: >-
    "Middle" of a linked list is the fast/slow trigger: fast moves two steps, slow moves one,
    so slow is at the halfway point when fast reaches the end. A dummy head helps when the
    head might be removed, which doesn't happen here. Reversing doesn't tell you the length.
    An index map is just the O(N)-space array approach in disguise.

