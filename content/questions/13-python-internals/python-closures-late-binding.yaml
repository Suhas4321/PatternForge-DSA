slug: python-closures-late-binding
lc: 9205
citadel_id: python_data
brick_layer: 1
runner_type: python_practical
concept:
  problem_it_solves: Why do closures defined inside Python loops frequently produce identical, unexpected values? In Python,
    closures bind variable names, not values, at function definition time. When the returned function finally executes, it
    resolves the variable in the enclosing scope where it has already reached the loop's final iteration value. Fixing this
    requires binding the variable early using default arguments or an enclosing factory function.
  brute_force: 'Writing [lambda x: x * m for m in multipliers] and wondering why every multiplier function multiplies by the
    final element.'
  brute_force_complexity: Silent logic bugs across dynamically registered callback handlers.
  key_insight: 'Default arguments are evaluated at function definition time, freezing the current loop value into the closure''s
    local scope: lambda x, factor=m: x * factor.'
  real_world: UI button click handler registration, Flask/FastAPI dynamic endpoint generation, and Airflow dynamic DAG task
    generation.
statement:
  clean: "Demonstrate and resolve the Python closure late binding trap:\n`evaluate_closure_binding(self, multipliers: list[int],\
    \ value: int, method: str) -> list[int]`.\n\nGiven:\n- `multipliers`: list of integer factors (e.g. `[1, 2, 3]`)\n- `value`:\
    \ input integer to evaluate\n- `method`: closure creation strategy:\n  - `'late_binding'`: standard loop closures `[lambda\
    \ x: x * m for m in multipliers]`. Due to late binding, every closure looks up `m` at execution time, which equals `multipliers[-1]`.\
    \ Returns `[value * multipliers[-1]] * len(multipliers)`.\n  - `'default_arg'`: early binding via default arguments `[lambda\
    \ x, factor=m: x * factor for m in multipliers]`. Each closure preserves its respective factor.\n  - `'factory_function'`:\
    \ early binding using an enclosing helper function:\n    ```python\n    def make_multiplier(factor):\n        return lambda\
    \ x: x * factor\n    funcs = [make_multiplier(m) for m in multipliers]\n    ```\n\nRules:\n1. If `multipliers` is empty,\
    \ return `[]`.\n2. Apply each function in `funcs` to `value`.\n3. Return list of evaluated integer results: `[f(value)\
    \ for f in funcs]`."
  oa_story: '**RideMitra Pricing Engine — Fare Surge Multiplier Registry**


    RideMitra''s dynamic pricing microservice dynamically registers surge pricing tiers based on traffic density: `[1.2x,
    1.5x, 2.0x, 3.0x]`. A junior backend engineer generated discount calculator callbacks inside a list comprehension.


    During the Bengaluru monsoon rush, all riders were unexpectedly billed the maximum 3.0x surge tier, even in low-demand
    suburbs, because Python closures bound the surge variable late. Implement this diagnostic module to demonstrate and fix
    the late binding trap.'
  trigger_keywords:
  - Python closure late binding trap
  - evaluate_closure_binding
  - late_binding
  examples:
  - input: multipliers = [1, 2, 3], value = 10, method = 'late_binding'
    output: '[30, 30, 30]'
    explanation: Because m ends at 3, all closures multiply value 10 by 3.
  - input: multipliers = [1, 2, 3], value = 10, method = 'default_arg'
    output: '[10, 20, 30]'
    explanation: 'Default argument captures factor at definition time: 10*1, 10*2, 10*3.'
  constraints:
  - 0 <= len(multipliers) <= 100
  - method in ['late_binding', 'default_arg', 'factory_function']
constraint_quiz:
  prompt: 'Why does lambda x, factor=m: x * factor avoid the closure late binding trap?'
  options:
  - Because default argument values are evaluated and bound to the function object at definition time, not execution time
  - Because default arguments run in a separate C thread
  - Because Python converts default arguments into global constants
  - Because lambdas with default arguments are compiled to WebAssembly
  answer: 0
  explanation: In Python, default parameter expressions are evaluated when the def/lambda statement executes, binding the
    snapshot value to __defaults__.
pattern_quiz:
  prompt: How does an enclosing factory function solve the late binding trap without using default arguments?
  options:
  - Calling make_multiplier(m) creates a distinct new local scope (frame) where m is preserved in the closure's __closure__
    cell
  - It writes the value to a temporary SQLite database
  - It deletes the variable from the global scope
  - It forces Python to use call-by-reference
  answer: 0
  explanation: Each invocation of the factory creates a unique enclosing stack frame whose local variables are captured as
    an immutable cell object.
