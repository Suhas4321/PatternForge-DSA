slug: retry-with-backoff-decorator
lc: 9204
citadel_id: python_data
brick_layer: 4
runner_type: python_practical

concept:
  problem_it_solves: >-
    "How do we handle transient network glitches when calling external LLMs or third-party APIs without polluting every function with while loops?"
    Decorators wrap function behavior using lexical closures. An adaptive retry decorator intercepts exceptions, records latency,
    and applies exponential backoff delays transparently.
  brute_force: >-
    Writing an inline `for attempt in range(3): try... except:` loop around every individual API call across the entire codebase.
    This creates massive code duplication and violates the DRY (Don't Repeat Yourself) principle.
  brute_force_complexity: O(1) runtime, but extreme boilerplate and inconsistent retry policies across services.
  key_insight: >-
    A parameterized decorator is a function that returns a decorator, which in turn returns a wrapper.
    Using `@functools.wraps(fn)` preserves function docstrings and signatures. The wrapper catches transient exceptions,
    retries up to `max_attempts`, and computes exponential delays (`base_delay * 2 ** (attempt - 1)`).
  real_world: >-
    FitLabs GPU inference cold-start retries, GEPA LLM rate-limit backoffs (HTTP 429), and Stripe/Razorpay webhook delivery retry queues.

statement:
  clean: |
    Implement an adaptive retry wrapper using a custom decorator:
    `execute_resilient_call(attempts_needed: int, max_retries: int) -> dict`.
    
    In a distributed microservice architecture, API calls occasionally encounter transient network failures.
    You need to simulate this behavior:
    1. Define a flaky worker function that raises `ConnectionError("transient network drop")` for the first
       `attempts_needed - 1` invocations, and returns `"SUCCESS"` on the `attempts_needed`-th invocation.
    2. Write a parameterized decorator `@retry(max_attempts=max_retries)` using `@functools.wraps`.
    3. The decorator must catch `ConnectionError`, record each attempted retry, and compute the cumulative backoff delays
       where each backoff delay equals `2 ** (attempt - 1)` (e.g. attempt 1 fails -> delay 1s, attempt 2 fails -> delay 2s).
    4. If the worker succeeds within `max_retries`, return:
       `{"success": True, "attempts": attempts_taken, "delays": list_of_delays}`.
    5. If all `max_retries` fail, suppress the final exception and return:
       `{"success": False, "attempts": max_retries, "delays": list_of_delays}`.
  oa_story: |
    **GEPA Optimization Engine — Resilient LLM Invocation**
    
    During genetic prompt mutation cycles, our pipeline dispatches thousands of parallel LLM calls to benchmark candidate prompts.
    Due to provider rate limits (HTTP 429 and transient 503s), up to 4% of calls fail on the first attempt.
    
    Build a reusable decorator that encapsulates exponential backoff retry logic, ensuring transient glitches resolve
    automatically without crashing the long-running optimization run.
  trigger_keywords: ["custom decorator", "execute_resilient_call", "attempts_needed"]
  examples:
    - input: "attempts_needed = 2, max_retries = 3"
      output: "{'success': True, 'attempts': 2, 'delays': [1]}"
      explanation: "Attempt 1 fails and backs off by 1s (2^0). Attempt 2 succeeds."
    - input: "attempts_needed = 4, max_retries = 3"
      output: "{'success': False, 'attempts': 3, 'delays': [1, 2, 4]}"
      explanation: "Attempts 1, 2, and 3 all fail with delays [1, 2, 4]. Max retries reached."
  constraints:
    - "attempts_needed >= 1"
    - "max_retries >= 1"

constraint_quiz:
  prompt: >-
    Why is `@functools.wraps(func)` considered standard practice when writing Python decorators?
  options:
    - "It speeds up Python code by 2x"
    - "It preserves the original function's name, docstring, and annotations"
    - "It allows the function to run asynchronously"
    - "It automatically catches all exceptions"
  answer: 1
  explanation: >-
    Without @functools.wraps, the wrapped function's __name__ becomes 'wrapper' and docstrings are lost,
    breaking introspection and debuggers.

pattern_quiz:
  prompt: How many levels of nested functions are required for a decorator that accepts parameters (e.g. @retry(max_attempts=3))?
  options:
    - "1 level"
    - "2 levels"
    - "3 levels"
    - "4 levels"
  answer: 2
  explanation: >-
    A parameterized decorator has 3 levels: (1) decorator factory taking parameters, (2) actual decorator taking the function, (3) wrapper executing the call.

