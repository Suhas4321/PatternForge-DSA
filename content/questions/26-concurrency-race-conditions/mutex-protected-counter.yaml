slug: mutex-protected-counter
lc: 9412
citadel_id: os_concurrency
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How does a mutual exclusion lock (Mutex) eliminate race conditions and guarantee atomic updates? By requiring
    threads to acquire a lock before entering the critical section and release it upon exit, the OS guarantees that only one
    thread executes the read-modify-write cycle at any given moment.
  brute_force: Relying on cooperative yielding or hoping operations complete before context switches occur.
  brute_force_complexity: O(1) syntax, but silent data corruption in multi-core environments.
  key_insight: A mutex tracks a single owner thread. Any thread attempting an operation without holding the lock causes an
    unprotected operation violation, while acquire attempts on a held lock are blocked.
  real_world: Thread-safe connection pooling, banking balance transfers, and shared metrics counters in production services.
statement:
  clean: "Implement a mutex-protected counter to verify mutual exclusion over critical sections:\n`simulate_locked_counter(steps:\
    \ list[list[str]]) -> dict`.\n\nEach step is a list `[thread_id, operation]` where operation is one of `\"ACQUIRE\"`,\
    \ `\"RELEASE\"`, `\"READ\"`, `\"ADD\"`, `\"WRITE\"`.\n\nRules:\n1. `lock_holder` is initially `None`.\n2. `\"ACQUIRE\"\
    `:\n   - If `lock_holder is None`: `lock_holder = thread_id`.\n   - If `lock_holder != thread_id`: the thread is blocked,\
    \ increment `blocked_acquires`.\n3. `\"RELEASE\"`:\n   - If `lock_holder == thread_id`: release the lock (`lock_holder\
    \ = None`).\n4. `\"READ\"`, `\"ADD\"`, `\"WRITE\"`:\n   - If `lock_holder != thread_id`: the thread attempted unprotected\
    \ operations outside a held lock, increment `unprotected_operations`.\n   - If `lock_holder == thread_id`: execute the\
    \ operation safely using thread-local registers and shared counter.\n\nReturn a dictionary containing:\n- `\"final_counter\"\
    `: `int`\n- `\"total_writes\"`: `int`\n- `\"unprotected_operations\"`: `int`\n- `\"blocked_acquires\"`: `int`\n- `\"safe_execution\"\
    `: `bool` (`True` if `unprotected_operations == 0` and `blocked_acquires == 0`)"
  oa_story: '**PayLoop Wallet Transfer Engine — Concurrency Audit**


    During high-throughput UPI transactions, PayLoop engineers noticed balance discrepancies when multiple services credited
    the same merchant wallet simultaneously. A junior developer forgot to wrap the balance calculation inside a mutex lock.


    Implement this lock-verified execution engine to prove that properly acquiring and releasing mutexes enforces safe critical
    section execution with zero unprotected operations.'
  trigger_keywords:
  - mutex-protected counter
  - unprotected operations
  - blocked_acquires
  examples:
  - input: steps = [["T1", "ACQUIRE"], ["T1", "READ"], ["T1", "ADD"], ["T1", "WRITE"], ["T1", "RELEASE"], ["T2", "ACQUIRE"],
      ["T2", "READ"], ["T2", "ADD"], ["T2", "WRITE"], ["T2", "RELEASE"]]
    output: '{"final_counter": 2, "total_writes": 2, "unprotected_operations": 0, "blocked_acquires": 0, "safe_execution":
      True}'
    explanation: Both threads acquire and release properly, yielding 0 violations.
  - input: steps = [["T1", "READ"], ["T1", "WRITE"]]
    output: '{"final_counter": 0, "total_writes": 0, "unprotected_operations": 2, "blocked_acquires": 0, "safe_execution":
      False}'
    explanation: Operations executed without acquiring lock count as unprotected operations.
  constraints:
  - 0 <= len(steps) <= 1000
  - Operations are strictly ACQUIRE, RELEASE, READ, ADD, WRITE
constraint_quiz:
  prompt: What happens if a thread tries to acquire a mutex that is already held by another thread?
  options:
  - The thread is blocked from entering the critical section until the holder releases the lock
  - The operating system terminates the process with SIGSEGV
  - The lock is automatically cloned into a distributed semaphore
  - The second thread executes in parallel without waiting
  answer: 0
  explanation: Mutual exclusion specifies that an acquired mutex blocks any subsequent thread until released by the current
    holder.
pattern_quiz:
  prompt: What constitutes an 'unprotected operation' in this critical section simulation?
  options:
  - A READ, ADD, or WRITE operation executed by a thread that does not currently hold the mutex
  - An ACQUIRE called when the lock is free
  - A RELEASE called by the lock holder
  - Reading a counter whose value is 0
  answer: 0
  explanation: A critical section operation is unprotected whenever it executes without the executing thread holding the mutex.
function:
  name: simulate_locked_counter
  params:
  - name: steps
  returns: any
  compare: exact
starter_code: "class Solution:\n    def simulate_locked_counter(self, steps: list[list[str]]) -> dict:\n        pass\n"
