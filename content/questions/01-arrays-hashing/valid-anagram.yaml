slug: valid-anagram
lc: 242

concept:
  problem_it_solves: >-
    "Do these two collections contain exactly the same items, the same number of times,
    ignoring order?" Order is noise here. What actually defines the answer is how many times
    each character appears, and a frequency map captures exactly that and nothing else.
  brute_force: >-
    For every character of s, scan t for an unused matching character and cross it off. Each
    search re-reads t from the start even though you already walked past those characters,
    so the work repeats for every single character of s.
  brute_force_complexity: O(N²) time, O(N) space — 5 × 10⁴ characters means ~2.5 × 10⁹ scans in the worst case.
  key_insight: >-
    Two strings are anagrams exactly when their character counts are equal. So stop matching
    characters to characters: count s once (+1 per char), then walk t and spend those counts
    (−1 per char). If t ever needs a character whose count is already 0, it has one too many.
    With equal lengths, never going below zero means everything balances out to exactly zero.
  real_world: >-
    Frequency maps are how search engines like Elasticsearch store term frequencies for
    scoring, and how fraud and abuse teams compare "bag of events" fingerprints regardless of
    order. Inventory reconciliation (does the dispatched crate match the order's item counts?)
    is the same count-up, count-down check.

statement:
  clean: |
    Given two strings `s` and `t`, return `true` if `t` is an **anagram** of `s`, and `false`
    otherwise.

    An anagram is a word formed by rearranging the letters of another word, **using all the
    original letters exactly once**. Both strings consist of **lowercase English letters**.
  oa_story: |
    **PadhaiPal Learning — OA Round 1**

    PadhaiPal's Bengaluru product team is shipping a vocabulary game for school students.
    Each round the app deals a row of letter tiles, `s`, and the student types a word, `t`.
    The word only scores if the student laid down **every tile on the table**, each tile
    exactly once, in whatever order they like.

    Tiles show lowercase English letters, and a row can be long during the bonus round.
    Write the scoring check: return `true` if the typed word uses up the dealt tiles exactly,
    and `false` if a tile is left over or the word needs a tile that wasn't dealt.
  trigger_keywords: ["anagram", "rearranging the letters", "exactly once"]
  examples:
    - input: "s = \"anagram\", t = \"nagaram\""
      output: "true"
      explanation: "Both contain a×3, n×1, g×1, r×1, m×1."
    - input: "s = \"rat\", t = \"car\""
      output: "false"
      explanation: "t has a 'c' that s doesn't, and s has a 't' that t doesn't."
  constraints:
    - "1 <= s.length, t.length <= 5 * 10^4"
    - "s and t consist of lowercase English letters."

constraint_quiz:
  prompt: >-
    Each string can be 5 × 10⁴ characters long. What time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) is ~2.5 × 10⁹ operations, far too slow. Sorting both strings and comparing is
    O(N log N) and does pass, but it does more work than needed: you don't care about order,
    only counts. Counting is a single O(N) pass over each string. O(log N) is impossible
    because every character has to be read at least once.

pattern_quiz:
  prompt: You must check that two strings use the same letters the same number of times. Which pattern fits?
  options:
    - "Hash set of characters in s"
    - "Frequency count of characters (count up, count down)"
    - "Two pointers from both ends"
    - "Sliding window"
  answer: 1
  explanation: >-
    "Rearranging", "all the letters", "exactly once" all point at multiplicity, which is a
    frequency-count trigger. A set loses multiplicity: "aacc" and "ccac" have the same set
    {a, c} but aren't anagrams. Two pointers compares positions (palindromes), and a sliding
    window is for anagrams of a *substring* (that's the twist, #438).

