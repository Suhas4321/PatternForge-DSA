hints:
- Check for empty inputs and return [] immediately.
- Convert to DataFrames and merge on 'model_id'.
- Group by ['model_name', 'provider'] and compute count, quantile(0.95), and mean.
solution:
  code: "import pandas as pd\n\nclass Solution:\n    def compute_model_p95_latencies(self, requests_data: list[dict], models_data:\
    \ list[dict]) -> list[dict]:\n        if not requests_data or not models_data:\n            return []\n            \n\
    \        req_df = pd.DataFrame(requests_data)\n        mod_df = pd.DataFrame(models_data)\n        \n        merged =\
    \ pd.merge(req_df, mod_df, on=\"model_id\", how=\"inner\")\n        if merged.empty:\n            return []\n        \
    \    \n        def agg_stats(group):\n            return pd.Series({\n                \"request_count\": int(len(group)),\n\
    \                \"p95_latency\": round(float(group[\"latency_ms\"].quantile(0.95)), 2),\n                \"mean_latency\"\
    : round(float(group[\"latency_ms\"].mean()), 2),\n            })\n            \n        grouped = merged.groupby([\"model_name\"\
    , \"provider\"], as_index=False).apply(agg_stats)\n        grouped.sort_values(by=[\"p95_latency\", \"model_name\"], ascending=[False,\
    \ True], inplace=True)\n        \n        result = []\n        for _, row in grouped.iterrows():\n            result.append({\n\
    \                \"model_name\": str(row[\"model_name\"]),\n                \"provider\": str(row[\"provider\"]),\n  \
    \              \"request_count\": int(row[\"request_count\"]),\n                \"p95_latency\": float(row[\"p95_latency\"\
    ]),\n                \"mean_latency\": float(row[\"mean_latency\"]),\n            })\n        return result\n"
  explanation: Merges request telemetry with metadata in Pandas, grouping by model and provider to compute statistical tail
    latency percentiles.
  time: O(N + M + G log G) where N is requests, M is models, and G is grouped models
  space: O(N + M) for dataframes and grouped aggregations
pitch_script: '**(Clarify)** "We need to analyze AI inference request telemetry by merging it with model metadata and calculating
  P95 tail latency along with average and volume metrics."


  **(Basement Insight)** "Average latency masks severe tail latency degradation. Grouping requests and computing quantile(0.95)
  exposes the experience of the slowest 5% of users."


  **(Solution)** "We load requests and models into Pandas DataFrames, inner-merge on model_id, and group by model_name and
  provider. We calculate count, P95 quantile, and mean, sorting by P95 descending."


  **(Complexity)** "Executes in O(N + M) vectorized time and O(N + M) space."

  '
