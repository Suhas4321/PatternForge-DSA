visualize_test: 0

drills:
  - title: Count pieces under a limit
    skill: setup
    goal: Greedily count how many contiguous pieces you need when no piece may exceed a given sum.
    instructions: |
      Return the minimum number of contiguous pieces `nums` must be cut into so that every
      piece sum is at most `limit` (assume `limit >= max(nums)`).

      Walk the array with `pieces = 1` and a running `current` sum. When `current + x`
      would exceed `limit`, close the piece (`pieces += 1`, `current = 0`) and start the new
      piece with `x`. Extending a piece as far as possible is optimal: cutting earlier only
      pushes more elements onto later pieces. This is the same greedy as the shipping
      problem's day counter, and it's the feasibility engine of the whole solution.
    function:
      name: piecesNeeded
      params: [{name: nums}, {name: limit}]
    starter_code: |
      class Solution:
          def piecesNeeded(self, nums: List[int], limit: int) -> int:
              pass
    tests:
      - {args: [[7, 2, 5, 10, 8], 18], expected: 2}
      - {args: [[7, 2, 5, 10, 8], 14], expected: 3}
      - {args: [[1, 2, 3, 4, 5], 9], expected: 2}
      - {args: [[1, 4, 4], 4], expected: 3, note: every element alone}
      - {args: [[12, 34, 67, 90], 113], expected: 2}
    solution: |
      class Solution:
          def piecesNeeded(self, nums: List[int], limit: int) -> int:
              pieces, current = 1, 0
              for x in nums:
                  if current + x > limit:  # x would overflow: it starts a new piece
                      pieces += 1
                      current = 0
                  current += x
              return pieces
    hint: "Only cut when adding the next element would break the limit, never earlier."

  - title: The Allocate Books feasibility check
    skill: core
    goal: Decide whether a page limit works for k students, using "at most k" and the two impossibility guards.
    instructions: |
      Books are in order with `pages[i]` pages. Return `True` if the books can be given to
      exactly `students` students, each getting a contiguous run of **at least one** book,
      so that nobody reads more than `limit` pages.

      Three decisions make this correct:

      - If any single book has more than `limit` pages, it's impossible.
      - If there are more students than books, it's impossible (the GfG version of this
        problem returns -1 in that case; LeetCode guarantees `k <= n`).
      - Otherwise, count the greedy pieces and accept when the count is **<=** `students`,
        not `==`. With fewer pieces, peel single books off pieces to hand to the extra
        students; that never raises anyone's total.
    function:
      name: canAllocate
      params: [{name: pages}, {name: students}, {name: limit}]
    starter_code: |
      class Solution:
          def canAllocate(self, pages: List[int], students: int, limit: int) -> bool:
              pass
    tests:
      - {args: [[12, 34, 67, 90], 2, 113], expected: true}
      - {args: [[12, 34, 67, 90], 2, 112], expected: false, note: one below the answer}
      - {args: [[5, 1, 1, 1], 3, 5], expected: true, note: "greedy uses 2 pieces: still feasible for 3"}
      - {args: [[10, 20], 3, 100], expected: false, note: more students than books}
      - {args: [[12, 34, 67, 90], 4, 80], expected: false, note: the 90-page book can't fit}
    solution: |
      class Solution:
          def canAllocate(self, pages: List[int], students: int, limit: int) -> bool:
              if students > len(pages) or max(pages) > limit:
                  return False
              count, current = 1, 0
              for p in pages:
                  if current + p > limit:
                      count, current = count + 1, 0
                  current += p
              return count <= students
    hint: "Rule out the two impossible situations first, then compare the greedy count with `<=`."

  - title: Show who reads what
    skill: edge
    goal: Rebuild the actual contiguous pieces for a limit, since interviewers often ask for the split itself.
    instructions: |
      Return the greedy split of `nums` as a list of pieces (each a list), where every piece
      sum is at most `limit` (assume `limit >= max(nums)`).

      The binary search only returns a number. A common follow-up is "which books does each
      student get?" Once you know the optimal limit, one more greedy pass rebuilds a valid
      split. Two details people miss: append the **last** open piece after the loop, and
      remember the greedy may return fewer than `k` pieces (`[5, 1, 1, 1]` at limit 5 gives 2
      pieces). For exactly `k`, split any piece with two or more elements further.
    function:
      name: splitAtLimit
      params: [{name: nums}, {name: limit}]
    starter_code: |
      class Solution:
          def splitAtLimit(self, nums: List[int], limit: int) -> List[List[int]]:
              pass
    tests:
      - {args: [[7, 2, 5, 10, 8], 18], expected: [[7, 2, 5], [10, 8]]}
      - {args: [[1, 2, 3, 4, 5], 9], expected: [[1, 2, 3], [4, 5]]}
      - {args: [[12, 34, 67, 90], 113], expected: [[12, 34, 67], [90]]}
      - {args: [[5, 1, 1, 1], 5], expected: [[5], [1, 1, 1]], note: fewer pieces than k = 3}
      - {args: [[4], 4], expected: [[4]], note: the last piece must still be appended}
    solution: |
      class Solution:
          def splitAtLimit(self, nums: List[int], limit: int) -> List[List[int]]:
              parts, piece, current = [], [], 0
              for x in nums:
                  if current + x > limit:
                      parts.append(piece)
                      piece, current = [], 0
                  piece.append(x)
                  current += x
              parts.append(piece)  # close the final piece
              return parts
    hint: "Keep the open piece as a list, and don't forget it when the loop ends."

hints:
  - >-
    Picking the cuts directly is hard. What if someone told you "no piece may exceed X"? Could
    you then check in one pass whether k pieces are enough? And what happens to that answer as
    X grows?
  - >-
    The answer lies in [max(nums), sum(nums)]. For a candidate X, cut greedily whenever the
    next element would push the current piece over X, and count pieces. If the count is <= k,
    X is feasible, so try smaller; otherwise try larger. Find the first feasible X.
  - |
    pieces_needed(X):
        pieces = 1, current = 0
        for each x in nums:
            if current + x > X: pieces += 1, current = 0
            current += x
        return pieces
    lo = max(nums), hi = sum(nums)
    while lo < hi:
        mid = middle of lo and hi
        if pieces_needed(mid) <= k:  hi = mid
        else:                        lo = mid + 1
    return lo

solution:
  code: |
    class Solution:
        def splitArray(self, nums: List[int], k: int) -> int:
            def pieces_needed(limit):
                pieces, current = 1, 0
                for x in nums:
                    if current + x > limit:  # x would overflow this piece: cut before it
                        pieces += 1
                        current = 0
                    current += x
                return pieces

            # largest sum is at least the biggest element and at most the whole array
            lo, hi = max(nums), sum(nums)
            while lo < hi:  # first limit that needs at most k pieces
                mid = (lo + hi) // 2
                if pieces_needed(mid) <= k:
                    hi = mid  # feasible: the answer is mid or smaller
                else:
                    lo = mid + 1  # needs too many pieces: the limit must grow
            return lo
  explanation: |
    This is the shipping problem with "days" renamed to "pieces", and it's the template behind
    every "minimise the maximum" question:

    1. **Answer space.** The largest piece sum is at least `max(nums)` (that element sits in
       some piece) and at most `sum(nums)` (one piece). For Allocate Books: at least the
       thickest book, at most all the pages.
    2. **Predicate.** `pieces_needed(X) <= k`. Greedy is optimal for a fixed `X`: extending
       the current piece as long as it fits leaves the least for the remaining pieces.
    3. **Monotonic.** A bigger limit never needs more pieces, so the predicate is
       F ... F T ... T, and the first-true loop finds the minimum feasible `X`.

    The subtle decision is `<= k` rather than `== k`. At the optimal limit the greedy might
    use fewer pieces (`[5, 1, 1, 1]` with `k = 3` needs only 2 at limit 5), but you can always
    split a piece with two or more elements further without increasing any sum, and since
    `k <= n` there are always enough elements to do so. Requiring exactly `k` would wrongly
    reject the optimum.

    The answer is always the sum of some real piece: the first feasible `X` is tight, because
    if no piece summed to exactly `X`, then `X - 1` would also be feasible. Zeros are fine
    (`[0, 0, 0, 0]` gives `lo == hi == 0`), because values are non-negative. With negative
    values the greedy and the monotonicity both break, which is why the constraint says
    `0 <= nums[i]`.
  time: O(n log S) — about log₂(sum − max) ≤ 30 iterations, each an O(n) greedy pass
  space: O(1) — a few counters
  brute_force_code: |
    from itertools import combinations

    class Solution:
        def splitArray(self, nums: List[int], k: int) -> int:
            n = len(nums)
            best = sum(nums)
            for cuts in combinations(range(1, n), k - 1):  # every way to place k - 1 cuts
                bounds = (0,) + cuts + (n,)
                largest = max(sum(nums[a:b]) for a, b in zip(bounds, bounds[1:]))
                best = min(best, largest)
            return best

pitch_script: |
  **(Clarify)** "So I split into exactly k non-empty contiguous subarrays and minimise the
  largest subarray sum. Values are non-negative and k is at most n. This is the same as the
  Allocate Minimum Pages problem with books and students, right?"

  **(Brute force)** "I could try every placement of the k − 1 cuts and take the best maximum,
  but that's combinatorial. A DP over prefix and number of pieces brings it to O(k · n²),
  about 5 × 10⁷ here, and it doesn't scale to the n = 10⁵ version."

  **(Trigger)** "'Minimise the largest sum' is a minimise-the-maximum problem, which tells me
  to binary search the answer. If I fix a limit X, checking whether k pieces suffice is easy
  with a greedy pass, and a bigger X never needs more pieces, so feasibility is monotonic."

  **(Optimal)** "The answer is between max(nums) and sum(nums). For each mid I greedily build
  pieces, cutting only when the next element would exceed mid, and count them. If the count is
  at most k, mid is feasible and I set hi = mid; otherwise lo = mid + 1. I accept fewer than k
  pieces because I can always split a piece further without raising the maximum."

  **(Complexity)** "About log₂ of the total sum, at most 30 iterations, each O(n), so
  O(n log S) time and O(1) space. If they want the actual split, one more greedy pass at the
  final limit reconstructs it."

twist:
  lc: 2064
  title: Minimized Maximum of Products Distributed to Any Store
  why: >-
    Painter's Partition, the other classic in this family, is not on LeetCode (it's Split Array
    with every sum multiplied by a time per unit), so practise with this one. You hand
    quantities of m product types to n stores, each store gets at most one type, and you
    minimise the maximum any store receives. Same "minimise the maximum" search over [1,
    max(quantities)], but the pieces are no longer contiguous: a product type of quantity q
    needs ceil(q / x) stores at limit x, so feasible(x) is sum(ceil(q / x)) <= n. It's Split
    Array's goal with Koko's ceil-division predicate, which shows the template cares only
    about monotonic feasibility, not about subarrays.

viz:
  arrays: [nums]
  # lo and hi are candidate sums, not indices into nums: point the window at names that don't
  # exist so the visualizer doesn't draw a misleading [lo..hi] box over the nums array.
  window: null  # lo/hi are answer values, not indices: no range box
  watch: [lo, hi, mid, limit, pieces, current, k]
