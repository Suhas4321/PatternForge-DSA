slug: sql-employees-earning-more-than-managers
lc: 9314
citadel_id: sql_dbms
brick_layer: 4
runner_type: sql_sqlite

concept:
  problem_it_solves: >-
    "How do we compare records against other records stored inside the exact same table (such as an employee vs. their manager)?"
    A table cannot be joined to itself without giving it two distinct aliases.
    A Self-Join aliases the same physical table twice (`Employee e` and `Employee m`), linking `e.managerId = m.id`
    so the query engine can directly compare attributes between manager and subordinate.
  brute_force: >-
    Using a correlated subquery for every row: `WHERE salary > (SELECT salary FROM Employee m WHERE m.id = e.managerId)`.
    This performs repeated nested index probes rather than a single efficient hash join.
  brute_force_complexity: O(N * log N) correlated subquery probes.
  key_insight: >-
    Aliasing the table as `e` (subordinate) and `m` (manager) allows an `INNER JOIN Employee m ON e.managerId = m.id`.
    Subordinates without a manager (`managerId IS NULL`) are automatically excluded, and filtering `WHERE e.salary > m.salary`
    identifies employees earning more than their supervisors in a single relational pass.
  real_world: >-
    LeetCode 181 (Employees Earning More Than Their Managers), organizational hierarchy auditing, and graph edge traversal in SQL.

statement:
  clean: |
    Write a SQL query using a self join managers query to find the employees who earn more than their managers.
    
    Table schema:
    ```sql
    CREATE TABLE Employee (
      id INTEGER PRIMARY KEY,
      name TEXT,
      salary INTEGER,
      managerId INTEGER
    );
    ```
    
    Return the result table with column name: `Employee`.
  oa_story: |
    **Compensation & HR Equity Analytics — Compensation Inversion Audit**
    
    In specialized AI research teams, senior staff engineers occasionally earn higher base salaries than their administrative managers.
    HR requested an automated quarterly audit query to flag all instances of salary inversion across the company.
    
    Write an optimal SQL self-join query that identifies every employee whose salary strictly exceeds that of their direct manager.
  trigger_keywords: ["self join managers", "Employee", "salary"]
  examples:
    - input: "Employee table: (1, 'Joe', 70000, 3), (2, 'Henry', 80000, 4), (3, 'Sam', 60000, Null), (4, 'Max', 90000, Null)"
      output: "Employee: Joe"
      explanation: "Joe's manager is Sam (id 3). Joe earns 70,000 while Sam earns 60,000. Henry earns 80,000 while his manager Max earns 90,000."
  constraints:
    - "Employee table contains between 0 and 10^5 rows"
    - "managerId refers to a valid id in Employee or is NULL"

constraint_quiz:
  prompt: >-
    Why is an INNER JOIN preferable to a LEFT JOIN when finding employees earning more than their managers?
  options:
    - "Because employees with managerId IS NULL cannot have a manager to compare against, and INNER JOIN automatically filters them out"
    - "Because LEFT JOIN is not supported on self-joins"
    - "Because INNER JOIN is always 100x faster"
    - "Because NULL comparisons raise an error in SQL"
  answer: 0
  explanation: >-
    An INNER JOIN requires a match on `e.managerId = m.id`, cleanly dropping top-level managers whose `managerId IS NULL`.

pattern_quiz:
  prompt: What SQL technique joins a table to itself using two distinct aliases?
  options:
    - "Self-Join"
    - "Natural Join"
    - "Cross Apply"
    - "Lateral Join"
  answer: 0
  explanation: >-
    A Self-Join references the same table multiple times with distinct table aliases (e.g. `Employee e` and `Employee m`).

schema_sql: |
  CREATE TABLE Employee (
    id INTEGER PRIMARY KEY,
    name TEXT,
    salary INTEGER,
    managerId INTEGER
  );

seed_sql: |
  INSERT INTO Employee (id, name, salary, managerId) VALUES
    (1, 'Joe', 70000, 3),
    (2, 'Henry', 80000, 4),
    (3, 'Sam', 60000, NULL),
    (4, 'Max', 90000, NULL);

