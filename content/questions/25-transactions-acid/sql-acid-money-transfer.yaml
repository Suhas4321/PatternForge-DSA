slug: sql-acid-money-transfer
lc: 9321
citadel_id: sql_dbms
brick_layer: 4
runner_type: sql_sqlite
concept:
  problem_it_solves: How do banking database systems guarantee that a money transfer between two accounts never debits the
    sender without crediting the receiver? Under ACID Atomicity ('all-or-nothing'), a transaction must either complete all
    operations or abort completely. If the sender's account has insufficient funds, the transaction rolls back, leaving all
    balances unchanged.
  brute_force: Executing two separate un-fenced UPDATE statements across network calls without transaction boundaries, risking
    balance loss if the network crashes between queries.
  brute_force_complexity: Severe data corruption and phantom money loss.
  key_insight: 'A transaction evaluates preconditions atomically: if the sender balance check passes, both balances adjust;
    otherwise, neither balance changes and the transaction reports a rollback.'
  real_world: UPI peer-to-peer transfers, Stripe wallet payouts, and banking ledger debits.
statement:
  clean: "Write a SQL query to simulate an atomic money transfer transaction between accounts:\nTransfer `200` units from\
    \ Account `1` (`Aarav`) to Account `2` (`Priya`).\n\nTable schema:\n```sql\nCREATE TABLE Accounts (\n    id INTEGER PRIMARY\
    \ KEY,\n    owner TEXT,\n    balance INTEGER\n);\n```\n\nTransaction Rules:\n1. Verify whether Account `1` has at least\
    \ `200` units: `(SELECT balance FROM Accounts WHERE id = 1) >= 200`.\n2. If sufficient funds exist, the transaction COMMITS:\n\
    \   - Account `1` balance decreases by `200`.\n   - Account `2` balance increases by `200`.\n   - Status column is `'COMMITTED'`.\n\
    3. If insufficient funds exist, the transaction ROLLS BACK:\n   - All account balances remain unchanged.\n   - Status\
    \ column is `'ROLLEDBACK'`.\n\nReturn columns: `id`, `owner`, `balance`, `status` ordered by `id` ascending."
  oa_story: '**PayLoop Core Banking Engine — Uncommitted Ledger Recovery**


    During peak UPI transaction hours, network drops between PayLoop''s switch and partner bank servers severed connections
    midway through wallet debits. Because legacy scripts lacked atomic rollback checks, sender balances were debited but receiver
    accounts never received funds.


    Implement this SQL transaction simulation to model how ACID atomicity enforces all-or-nothing balance transfers and preserves
    ledger consistency.'
  trigger_keywords:
  - atomic money transfer transaction
  - Accounts
  - ROLLEDBACK
  examples:
  - input: 'Accounts: [(1, ''Aarav'', 1000), (2, ''Priya'', 500)], transfer 200 from 1 to 2'
    output: '[(1, ''Aarav'', 800, ''COMMITTED''), (2, ''Priya'', 700, ''COMMITTED'')]'
    explanation: 'Aarav has 1000 >= 200, so transfer commits: Aarav becomes 800, Priya becomes 700.'
  constraints:
  - Accounts table contains between 2 and 1000 rows
  - balance >= 0
constraint_quiz:
  prompt: What does the 'A' (Atomicity) in ACID guarantee during a multi-row database transaction?
  options:
  - Either all SQL modifications in the transaction succeed and commit, or all are completely undone (rolled back)
  - Transactions execute on only one CPU core
  - Transactions run in zero nanoseconds
  - Data is compressed using gzip
  answer: 0
  explanation: 'Atomicity ensures all-or-nothing execution: if any statement in the transaction fails or aborts, all prior
    changes made within the transaction are rolled back.'
pattern_quiz:
  prompt: How does a SQL CASE statement simulate conditional transaction execution in a single query?
  options:
  - By checking the subquery predicate `(SELECT balance FROM Accounts WHERE id = 1) >= 200` inside the CASE expression
  - By creating an asynchronous thread in SQLite
  - By dropping the table on error
  - By converting integer balances to floating-point numbers
  answer: 0
  explanation: Evaluating the sender balance check in the outer CASE branch determines whether to apply the balance shift
    or keep the original balance untouched.
