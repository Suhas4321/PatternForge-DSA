slug: insert-interval
lc: 57

concept:
  problem_it_solves: >-
    "Where does one new range go in a list that is already clean?" The list is sorted and has no
    overlaps, so it splits into three runs: intervals entirely before the new one, intervals
    that collide with it, and intervals entirely after it. Recognising those three runs lets you
    rebuild the list in one linear pass, with no sorting at all.
  brute_force: >-
    Append the new interval and run Merge Intervals: sort everything by start, then merge. It is
    correct, but it throws away the gift in the input. The list was already sorted and
    non-overlapping, and the sort pays O(N log N) to rediscover an order you were handed for
    free.
  brute_force_complexity: >-
    O(N log N) time, O(N) space — fine for 10⁴ intervals, but an interviewer asking this
    question wants to see that you use the sortedness and finish in O(N).
  key_insight: >-
    In a sorted, non-overlapping list, the intervals that overlap the new one form one
    contiguous run. Everything ending before the new start comes first and is copied as is;
    then every interval starting at or before the new end is absorbed into it (min of starts,
    max of ends); whatever remains starts after the merged interval and is copied as is. Three
    while-loops sharing one index i, each interval touched once.
  real_world: >-
    TCP receivers keep a sorted list of byte ranges already received (SACK blocks) and merge
    each arriving segment into it exactly this way. The Linux kernel merges a new memory mapping
    into the sorted list of a process's virtual memory areas, and booking systems (Calendly,
    Google Calendar) insert a new event into a user's sorted busy list before recomputing free
    slots.

statement:
  clean: |
    You are given an array of non-overlapping intervals `intervals` where
    `intervals[i] = [start_i, end_i]`, **sorted in ascending order by start_i**, and an interval
    `newInterval = [start, end]`.

    **Insert newInterval** into `intervals` so that the result is still sorted by start and
    still has **no overlapping intervals** (merge overlapping intervals if necessary). Intervals
    that share an endpoint count as overlapping. Return the resulting array. You do not need to
    modify `intervals` in place.
  oa_story: |
    **QuizQuest EdTech — OA Round 2**

    QuizQuest hosts live quiz battles for JEE and NEET aspirants, and every teacher has a busy
    calendar of blocked slots, stored as `[from, to]` minutes since the start of the week. The
    calendar service guarantees that the blocks are kept in order of their start time and that
    no two blocks run into each other.

    A teacher in Jayanagar just scheduled one more live quiz, `[from, to]`. Update the calendar:
    the new quiz must be added, and any existing blocks it runs into (including a block that ends
    exactly when it starts, or starts exactly when it ends) must be fused with it into one block.
    Return the updated calendar, still in start order with no two blocks running into each other.
    Calendars hold up to 10,000 blocks and the update runs on every booking, so re-sorting the
    whole calendar each time is not acceptable.
  trigger_keywords: ["sorted in ascending order by start_i", "insert newInterval", "no overlapping intervals"]
  examples:
    - input: "intervals = [[1,3],[6,9]], newInterval = [2,5]"
      output: "[[1,5],[6,9]]"
      explanation: "[2,5] overlaps [1,3], so they merge into [1,5]. [6,9] starts after 5."
    - input: "intervals = [[1,2],[3,5],[6,7],[8,10],[12,16]], newInterval = [4,8]"
      output: "[[1,2],[3,10],[12,16]]"
      explanation: "[4,8] overlaps [3,5], [6,7] and touches [8,10], so all four become [3,10]."
  constraints:
    - "0 <= intervals.length <= 10^4"
    - "intervals[i].length == 2"
    - "0 <= start_i <= end_i <= 10^5"
    - "intervals is sorted by start_i in ascending order."
    - "newInterval.length == 2"
    - "0 <= start <= end <= 10^5"

constraint_quiz:
  prompt: >-
    The list (up to 10⁴ intervals) is already sorted and non-overlapping. What time complexity
    should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) would come from inserting into the middle of a Python list repeatedly while merging,
    which is wasteful. O(N log N) is what append-then-sort costs, and it ignores the fact that
    the input is already sorted. O(N) is achievable with one pass. O(log N) is impossible: binary
    search can find where the new interval goes, but you still have to build and return a list of
    up to N + 1 intervals, which is O(N) work by itself.

pattern_quiz:
  prompt: >-
    A sorted, non-overlapping list gets one new interval that may collide with several existing
    ones. Which approach fits best?
  options:
    - "Append it and re-run Merge Intervals (sort by start, then merge)"
    - "Three-phase linear scan: copy the ones before, absorb the overlapping run, copy the rest"
    - "Binary search for its position and insert it there without merging"
    - "Push everything into a min-heap keyed by start and pop to rebuild"
  answer: 1
  explanation: >-
    The trigger is "already sorted and non-overlapping, insert one more". That guarantees the
    collisions form one contiguous run, so a single scan in three phases does it in O(N).
    Append-and-sort is correct but pays O(N log N) for nothing. Binary search alone breaks as
    soon as the new interval overlaps anything, because it may swallow many intervals. A heap
    just re-sorts the data in O(N log N).

