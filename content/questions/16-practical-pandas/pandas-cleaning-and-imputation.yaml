drills:
  - title: Deduplicate subset keep last
    skill: setup
    goal: Drop earlier duplicate records.
    instructions: |
      Return records after running `df.drop_duplicates(subset=['id'], keep='last')`.
    function:
      name: dedupe_last
      params: [{name: items}]
    starter_code: |
      class Solution:
          def dedupe_last(self, items: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"id": 1, "v": "a"}, {"id": 1, "v": "b"}]], expected: [{"id": 1, "v": "b"}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def dedupe_last(self, items: list[dict]) -> list[dict]:
              if not items:
                  return []
              df = pd.DataFrame(items)
              return df.drop_duplicates(subset=["id"], keep="last").to_dict(orient="records")
    hint: "Use `df.drop_duplicates(subset=['id'], keep='last')`."

  - title: Drop rows with NaN subset
    skill: core
    goal: Remove rows where a specified column is missing.
    instructions: |
      Drop any row where `name` is null.
    function:
      name: drop_missing_name
      params: [{name: items}]
    starter_code: |
      class Solution:
          def drop_missing_name(self, items: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"name": "Alice"}, {"name": null}]], expected: [{"name": "Alice"}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def drop_missing_name(self, items: list[dict]) -> list[dict]:
              if not items:
                  return []
              df = pd.DataFrame(items)
              return df.dropna(subset=["name"]).to_dict(orient="records")
    hint: "Use `df.dropna(subset=['name'])`."

  - title: Fillna with column median
    skill: edge
    goal: Impute missing numerical values with median.
    instructions: |
      Fill missing values in column `val` with the median of `val`.
    function:
      name: impute_median
      params: [{name: items}]
    starter_code: |
      class Solution:
          def impute_median(self, items: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"val": 10.0}, {"val": 30.0}, {"val": null}]], expected: [{"val": 10.0}, {"val": 30.0}, {"val": 20.0}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def impute_median(self, items: list[dict]) -> list[dict]:
              if not items:
                  return []
              df = pd.DataFrame(items)
              med = df["val"].median()
              df["val"] = df["val"].fillna(med)
              return df.to_dict(orient="records")
    hint: "Compute `med = df['val'].median()` then call `.fillna(med)`."

hints:
  - "If `records` is empty, return `[]`."
  - "Call `df = df.drop_duplicates(subset=['test_id'], keep='last')` and `df = df.dropna(subset=['device'])`."
  - "Compute `median_latency = df['latency_ms'].median()`. If NaN, use `0.0`. Fillna with `float(median_latency)` and sort by `test_id`."

solution:
  code: |
    import pandas as pd

    class Solution:
        def clean_telemetry_df(self, records: list[dict]) -> list[dict]:
            if not records:
                return []
            df = pd.DataFrame(records)

            # Step 1: Deduplicate on test_id keeping last
            df = df.drop_duplicates(subset=["test_id"], keep="last")

            # Step 2: Drop rows where device is null
            df = df.dropna(subset=["device"])

            if df.empty:
                return []

            # Step 3: Compute median latency
            med = df["latency_ms"].median()
            median_val = float(med) if pd.notna(med) else 0.0

            # Step 4: Impute missing latency
            df["latency_ms"] = df["latency_ms"].fillna(median_val).astype(float)

            # Step 5: Sort by test_id
            df = df.sort_values(by="test_id", ascending=True)

            return df.to_dict(orient="records")
  explanation: |
    The cleaning pipeline chains canonical Pandas operations.
    `.drop_duplicates(subset=['test_id'], keep='last')` discards stale retry traces.
    `.dropna(subset=['device'])` removes incomplete foreign key rows.
    
    The median of remaining valid latencies is calculated and applied via `.fillna(median_val)`.
    Sorting by `test_id` guarantees deterministic output order.
  time: O(N log N) dominated by sorting
  space: O(N) for DataFrame memory

pitch_script: |
  **(Clarify)** "We need to clean a test telemetry dataset by deduplicating on `test_id` keeping the last retry, dropping rows with missing device names, imputing missing latency values with the median, and sorting by ID."

  **(Basement Insight)** "Outliers in telemetry data heavily distort arithmetic means. Imputing with the median provides robust central tendency estimation. Chaining vectorized Pandas operations executes in C rather than Python loops, processing tens of thousands of rows efficiently."

  **(Solution)** "We build a DataFrame, apply `drop_duplicates(subset=['test_id'], keep='last')`, filter with `dropna(subset=['device'])`, calculate the median latency, fill nulls with `.fillna(median_val)`, and sort by `test_id`."

  **(Complexity)** "Executes in O(N log N) time due to sorting, using O(N) memory for the DataFrame."

twist:
  lc: 9233
  title: Group-Specific Median Imputation
  why: >-
    Instead of a global dataset median, impute missing latency using the median of that specific device model:
    df['latency_ms'] = df.groupby('device')['latency_ms'].transform(lambda g: g.fillna(g.median())).

