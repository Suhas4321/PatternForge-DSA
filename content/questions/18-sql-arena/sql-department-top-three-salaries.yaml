solution:
  code: |
    WITH Ranked AS (
      SELECT
        d.name AS Department,
        e.name AS Employee,
        e.salary AS Salary,
        DENSE_RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC) AS rk
      FROM Employee e
      JOIN Department d ON e.departmentId = d.id
    )
    SELECT Department, Employee, Salary
    FROM Ranked
    WHERE rk <= 3;
  explanation: |
    1. The CTE `Ranked` performs an inner join between `Employee` and `Department`.
    2. `DENSE_RANK() OVER (PARTITION BY e.departmentId ORDER BY e.salary DESC)` partitions calculations by department.
       Because it uses dense ranking, employees with identical salaries share the exact same rank tier without creating gaps.
    3. The outer query filters `WHERE rk <= 3`, capturing all employees whose salary falls within the top three unique tiers.
  time: O(N log N) for sorting partitioned windows
  space: O(N) for CTE intermediate table state

pitch_script: |
  **(Clarify)** "We need to identify all employees who earn in the top three unique salaries for each department, correctly handling tied earnings."

  **(Basement Insight)** "Correlated subqueries that count distinct higher salaries run in O(N^2) quadratic time. Using the window function `DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC)` partitions and ranks rows in a single O(N log N) sorted pass."

  **(Solution)** "We join Employee with Department inside a CTE and compute `DENSE_RANK()`. In the outer query, we filter `WHERE rk <= 3` and project `Department`, `Employee`, and `Salary`."

  **(Complexity)** "Runs in O(N log N) time, with O(N) space for the CTE materialization."

