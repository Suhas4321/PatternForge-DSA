drills:
  - title: Filter with yield
    skill: setup
    goal: Write a simple generator that yields only numbers meeting a threshold.
    instructions: |
      Return a list of all numbers in `nums` that are >= `threshold`.
    function:
      name: filter_ge
      params: [{name: nums}, {name: threshold}]
    starter_code: |
      class Solution:
          def filter_ge(self, nums: list[int], threshold: int) -> list[int]:
              pass
    tests:
      - {args: [[100, 500, 200, 503], 500], expected: [500, 503]}
      - {args: [[200, 201, 204], 300], expected: []}
      - {args: [[], 100], expected: []}
    solution: |
      class Solution:
          def filter_ge(self, nums: list[int], threshold: int) -> list[int]:
              def _gen():
                  for x in nums:
                      if x >= threshold:
                          yield x
              return list(_gen())
    hint: "Use `yield x` inside the loop and wrap the generator in `list()`."

  - title: Parse single line token
    skill: core
    goal: Extract typed values from a structured log line.
    instructions: |
      Given a line `"TIME STATUS PATH LATENCY"`, return a dict `{"status": int(STATUS), "latency": int(LATENCY)}`.
    function:
      name: parse_line_metrics
      params: [{name: line}]
    starter_code: |
      class Solution:
          def parse_line_metrics(self, line: str) -> dict:
              pass
    tests:
      - {args: ["2026-10-15T10:00:00 500 /api/run 450"], expected: {"status": 500, "latency": 450}}
      - {args: ["2026-10-15T10:00:01 200 /ping 1"], expected: {"status": 200, "latency": 1}}
    solution: |
      class Solution:
          def parse_line_metrics(self, line: str) -> dict:
              parts = line.strip().split()
              return {"status": int(parts[1]), "latency": int(parts[3])}
    hint: "Use line.strip().split() and convert indices 1 and 3 to int."

  - title: Lazy batch chunking
    skill: edge
    goal: Yield fixed-size batches from an iterator.
    instructions: |
      Group items into sublists of size `k` (the last sublist may have fewer than `k` items).
    function:
      name: chunk_list
      params: [{name: items}, {name: k}]
    starter_code: |
      class Solution:
          def chunk_list(self, items: list[int], k: int) -> list[list[int]]:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], 2], expected: [[1, 2], [3, 4], [5]]}
      - {args: [[1, 2], 3], expected: [[1, 2]]}
      - {args: [[], 2], expected: []}
    solution: |
      class Solution:
          def chunk_list(self, items: list[int], k: int) -> list[list[int]]:
              res = []
              for i in range(0, len(items), k):
                  res.append(items[i : i + k])
              return res
    hint: "Use range(0, len(items), k) to slice items[i:i+k]."

