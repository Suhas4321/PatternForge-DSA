drills:
  - title: Count the levels with BFS
    skill: setup
    goal: Set up the deque and the per-level round so you know when one level ends.
    instructions: |
      Return the **number of levels** in the tree (its height), using a level-by-level BFS.
      An empty tree has 0 levels.

      Every per-level question, including the right side view, is built on this loop: each
      round of the `while` drains exactly `len(queue)` nodes, which is one whole level. Count
      the rounds and you have the height; pick one node per round and you have a view.
    function:
      name: countLevels
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def countLevels(self, root: Optional[TreeNode]) -> int:
              pass
    tests:
      - {args: [[1, 2, 3, null, 5, null, 4]], expected: 3}
      - {args: [[1, 2, 3, 4, null, null, null, 5]], expected: 4}
      - {args: [[]], expected: 0, note: empty tree}
      - {args: [[7]], expected: 1}
    solution: |
      class Solution:
          def countLevels(self, root: Optional[TreeNode]) -> int:
              levels = 0
              queue = deque([root] if root else [])
              while queue:
                  levels += 1
                  for _ in range(len(queue)):
                      node = queue.popleft()
                      queue.extend(c for c in (node.left, node.right) if c)
              return levels
    hint: "One trip around the `while` loop is one level; increment a counter per trip."

  - title: Pick a node by its position in the level
    skill: core
    goal: Use the index inside the level round to choose which node represents the level.
    instructions: |
      Return the **left side view**: the first node of each level, top to bottom.

      This is the mirror of the real problem and trains the same micro-skill. Inside a round,
      `for i in range(size)` pops the level's nodes left to right, so `i == 0` is the leftmost
      and `i == size - 1` is the rightmost. Which side you "see" is only a question of which
      index you keep. Children must still be pushed left then right, or the positions stop
      meaning left-to-right.
    function:
      name: leftSideView
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def leftSideView(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3, null, 5, null, 4]], expected: [1, 2, 5]}
      - {args: [[1, null, 3, 4]], expected: [1, 3, 4], note: "right-only nodes are visible from the left too"}
      - {args: [[]], expected: []}
      - {args: [[1, 2, 3, 4, 5, 6, 7]], expected: [1, 2, 4]}
    solution: |
      class Solution:
          def leftSideView(self, root: Optional[TreeNode]) -> List[int]:
              view = []
              queue = deque([root] if root else [])
              while queue:
                  size = len(queue)
                  for i in range(size):
                      node = queue.popleft()
                      if i == 0:
                          view.append(node.val)
                      queue.extend(c for c in (node.left, node.right) if c)
              return view
    hint: "Freeze `size = len(queue)` before the `for`, and keep the node where `i == 0`."

  - title: Right-first DFS with a depth check
    skill: edge
    goal: Solve the view with DFS by visiting right before left and recording a node only when its depth is new.
    instructions: |
      Return the right side view again, but with a **recursive DFS** instead of BFS.

      Pass the depth **down** the recursion and visit the right child before the left. The
      first node a right-first DFS reaches at any depth is the rightmost node there. You know
      a depth is new when `depth == len(view)`: `view` already has one entry for each depth
      0 .. depth - 1. This handles the classic edge case, a left node sticking out below a
      shorter right subtree, without any special code: the DFS falls back to the left subtree
      and finds that depth unseen.
    function:
      name: rightViewDFS
      params: [{name: root, type: TreeNode}]
    starter_code: |
      class Solution:
          def rightViewDFS(self, root: Optional[TreeNode]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3, null, 5, null, 4]], expected: [1, 3, 4]}
      - {args: [[1, 2, 3, 4]], expected: [1, 3, 4], note: "the left node 4 is still the rightmost at depth 2"}
      - {args: [[1, 2, 3, 4, null, null, null, 5]], expected: [1, 3, 4, 5]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def rightViewDFS(self, root: Optional[TreeNode]) -> List[int]:
              view = []

              def dfs(node, depth):
                  if not node:
                      return
                  if depth == len(view):  # first visit to this depth = rightmost node
                      view.append(node.val)
                  dfs(node.right, depth + 1)
                  dfs(node.left, depth + 1)

              dfs(root, 0)
              return view
    hint: "Swap the usual order: recurse on `node.right` first."

hints:
  - >-
    Is the visible node always reachable by going right from the root? Draw [1,2,3,4] and
    check. If not, what property does the visible node on each level actually have?
  - >-
    The visible node is the last node of its level when read left to right. Run a level BFS,
    snapshot size = len(queue) at the start of each round, and record the node popped at
    position size - 1.
  - |
    if root is empty: return []
    view = [], queue = [root]
    while queue is not empty:
        size = len(queue)
        for i from 0 to size - 1:
            node = pop from the front
            if i is size - 1: add node.val to view
            push node.left, node.right (if they exist)
    return view

solution:
  code: |
    class Solution:
        def rightSideView(self, root: Optional[TreeNode]) -> List[int]:
            if not root:
                return []
            view = []
            queue = deque([root])
            while queue:
                size = len(queue)  # nodes on the current level, left to right
                for i in range(size):
                    node = queue.popleft()
                    if i == size - 1:  # last on its level: the one you see
                        view.append(node.val)
                    if node.left:
                        queue.append(node.left)
                    if node.right:
                        queue.append(node.right)
            return view
  explanation: |
    This is the level-order BFS with one change: instead of keeping the whole level, keep the
    node at position `size - 1`. At the top of each round the queue holds exactly one level in
    left-to-right order (children are pushed left before right), so that position is the
    rightmost node on the level, which is precisely the node you can see from the right.

    The subtle part is the definition of "visible". Following `.right` pointers fails on
    `[1,2,3,4]`: node 4 is a left descendant, but nothing else is on level 2, so it is
    visible. Thinking "last node per level" instead of "go right" makes that case automatic.

    The DFS alternative passes the depth down and visits **right before left**; whenever
    `depth == len(view)` it is the first node seen at that depth, hence the rightmost. It uses
    O(H) stack space instead of O(W) queue space, so it is better on wide, shallow trees and
    worse on deep, narrow ones. Both are O(N) time.
  time: O(N) — each node is pushed and popped once
  space: O(W) — the queue holds at most one level (plus the next level's partial fill), W = widest level
  brute_force_code: |
    class Solution:
        def rightSideView(self, root: Optional[TreeNode]) -> List[int]:
            def height(node):
                return 0 if not node else 1 + max(height(node.left), height(node.right))

            def rightmost_at(node, d):  # re-walks from the root for every depth
                if not node:
                    return None
                if d == 0:
                    return node.val
                found = rightmost_at(node.right, d - 1)
                return found if found is not None else rightmost_at(node.left, d - 1)

            return [rightmost_at(root, d) for d in range(height(root))]

pitch_script: |
  **(Clarify)** "So I return one value per level, top to bottom, and it's the rightmost node on
  that level, even if it's a left child, as long as nothing is to its right on that level?
  And an empty tree gives an empty list?"

  **(Brute force)** "Following right pointers alone is wrong, for example in 1, 2, 3, 4 the
  node 4 is a left child but it's visible. A correct naive way is, for each depth, search the
  tree for the rightmost node at that depth, which is O(N times H)."

  **(Trigger)** "'One node per level' is a level-order BFS signal. If I process the tree one
  level at a time, left to right, the visible node is simply the last one I pop in each
  level."

  **(Optimal)** "I keep a queue starting with the root. At the start of each round I store the
  queue's size, which is the number of nodes on this level. I pop that many nodes, pushing
  their children left then right, and when the index equals size minus one I record that
  node's value. Alternatively, a DFS that goes right before left and records a node whenever
  its depth equals the length of my answer list gives the same result."

  **(Complexity)** "Each node is visited once, so O(N) time. The queue holds at most about one
  level, so O(W) space for BFS, or O(H) recursion stack for the DFS version."

twist:
  lc: 515
  title: Find Largest Value in Each Tree Row
  why: >-
    Still one answer per level, but now it depends on every node in the level, not just the
    last one. Keep the same BFS with the size snapshot, start each round with
    level_max = -infinity, update it on every pop, and append it after the round. Values can be
    as small as -2^31, so starting the running max at 0 or at a small constant is the bug to
    avoid.

