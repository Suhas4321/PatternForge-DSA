slug: rearrange-array-elements-by-sign
lc: 2149

concept:
  problem_it_solves: >-
    "Merge two interleaved streams into fixed alternating slots, without losing either stream's
    order." Once you see that the answer's shape is fixed (positives at even indices, negatives at
    odd ones), every element's destination is known the moment you read it. Two write pointers,
    one per stream, hand out those slots in order.
  brute_force: >-
    Walk the array slot by slot; whenever slot i holds the wrong sign, scan ahead for the next
    element with the right sign and shift everything in between one step right to make room.
    Shifting keeps the order correct, but the same elements are moved again and again, once for
    every misplaced element in front of them.
  brute_force_complexity: >-
    O(N²) time, O(1) extra space — 2 × 10⁵ elements with all negatives first means ~10¹⁰
    element shifts.
  key_insight: >-
    You don't have to search for where an element goes; the shape of the answer already says.
    The k-th positive always lands at index 2k and the k-th negative at index 2k + 1. So keep
    `pos` (next even slot, starts at 0) and `neg` (next odd slot, starts at 1), read the input
    once left to right, drop each element into its pointer's slot and advance that pointer by 2.
    Reading left to right is what preserves each sign's original order.
  real_world: >-
    Feed-blending services (LinkedIn, Instagram, Flipkart's home page) interleave sponsored and
    organic items into fixed alternating slots while keeping each list's ranking intact. RAID 0
    and Kafka partitioners stripe records round-robin across fixed positions, and counting sort /
    radix sort compute each element's destination from a running counter in exactly this way,
    which is also why they are stable.

statement:
  clean: |
    You are given a **0-indexed** integer array `nums` of **even** length consisting of an
    **equal number of positive and negative integers**.

    Rearrange the elements of `nums` such that the modified array follows the given conditions:

    1. Every consecutive pair of integers have **opposite signs**.
    2. For all integers with the same sign, the **order in which they were present** in `nums`
       is preserved.
    3. The rearranged array **begins with a positive** integer.

    Return the modified array after rearranging the elements to satisfy the aforementioned
    conditions. It is not required to do the modifications in-place.
  oa_story: |
    **NammaRide Mobility — OA Round 1**

    NammaRide runs a bike-taxi pooling service around Electronic City. Every few seconds the
    dispatcher receives a batch of check-ins: drivers are logged with positive IDs, riders with
    negative IDs, all mixed in the order they checked in. Each batch always contains the same
    number of drivers and riders.

    The matching screen must display the batch as driver, rider, driver, rider, …, starting with
    a driver, so that each driver is paired with the rider shown right after them. Fairness rules
    say drivers must appear in the order they checked in, and so must riders. Return the batch in
    display order. Batches during the evening rush can hold up to 200,000 check-ins, and the
    dispatcher must refresh instantly.
  trigger_keywords: ["equal number of positive and negative integers", "opposite signs", "order in which they were present", "begins with a positive"]
  examples:
    - input: "nums = [3,1,-2,-5,2,-4]"
      output: "[3,-2,1,-5,2,-4]"
      explanation: "Positives in order are 3, 1, 2 and negatives in order are -2, -5, -4; interleaving them, positive first, gives the answer."
    - input: "nums = [-1,1]"
      output: "[1,-1]"
      explanation: "The only positive, 1, must come first."
  constraints:
    - "2 <= nums.length <= 2 * 10^5"
    - "nums.length is even"
    - "1 <= |nums[i]| <= 10^5"
    - "nums consists of equal number of positive and negative integers."

constraint_quiz:
  prompt: With up to 2 × 10⁵ elements, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    Shifting misplaced elements into position is O(N²), up to ~10¹⁰ moves, which is far too slow.
    A stable sort by sign followed by interleaving is O(N log N); it passes, but sorting is wasted
    work because you already know every element's destination. A single pass with two write
    pointers is O(N). O(log N) is impossible since every element must be read and written.

pattern_quiz:
  prompt: >-
    Alternate positives and negatives starting with a positive, keeping each sign's original
    order, with equal counts guaranteed. Which pattern fits?
  options:
    - "Two pointers from both ends, swapping a misplaced positive with a misplaced negative"
    - "Two write pointers into a result array: even slots for positives, odd slots for negatives"
    - "Sort by absolute value, then interleave"
    - "Monotonic stack"
  answer: 1
  explanation: >-
    Swapping from both ends puts signs in the right places but scrambles the order within each
    sign. Sorting by absolute value destroys the original order entirely. A monotonic stack
    answers "next greater" questions, not placement. "Equal number of positive and negative"
    plus "opposite signs" plus "order preserved" means each sign owns a fixed set of slots
    (even or odd), so two write pointers stepping by 2 place every element directly.

