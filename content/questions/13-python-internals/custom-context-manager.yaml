concept:
  problem_it_solves: >-
    "What happens to database connections, file locks, and state when an exception crashes midway through a function?"
    Without deterministic cleanup, sockets leak, transactions hang uncommitted, and in-memory caches remain corrupted.
    Context managers implement the `__enter__` and `__exit__` protocol to guarantee cleanup regardless of unhandled exceptions.
  brute_force: >-
    Wrapping every single database write or critical section in repetitive `try...finally` blocks manually.
    Engineers frequently forget the `finally` block or fail to rollback corrupted intermediate mutations.
  brute_force_complexity: O(1) runtime, but high maintenance overhead and prone to resource leak bugs.
  key_insight: >-
    By implementing `__enter__` to create a snapshot of state and `__exit__(self, exc_type, exc_val, exc_tb)` to inspect
    whether an exception occurred, the context manager can restore the snapshot on failure and return `True` to suppress
    or cleanly propagate the error.
  real_world: >-
    SQLAlchemy session management (`with session.begin():`), file handling (`with open() as f:`), Redis distributed lock
    acquisition/release, and PyTorch inference mode (`with torch.no_grad():`).

statement:
  clean: |
    Implement a safe in-memory transaction runner `simulate_transaction(initial_state: dict, operations: list[dict]) -> dict`
    using a custom context manager.
    
    You need to manage state mutations against a dictionary.
    Each operation in `operations` is a dictionary:
    - `{"op": "set", "key": str, "val": any}`: updates `state[key] = val`
    - `{"op": "delete", "key": str}`: deletes `key` from `state` if present
    - `{"op": "abort", "reason": str}`: simulates an unexpected failure by raising a `RuntimeError(reason)`
    
    Rules:
    1. If all operations complete without errors, the transaction commits, and the final mutated dictionary is returned.
    2. If any operation raises an exception (such as `op == "abort"`), your context manager must automatically rollback
       all mutations and restore `initial_state` exactly as it was prior to the transaction.
    3. The function should safely suppress the error and return the restored initial state.
  oa_story: |
    **Drizz Billing Engine — Idempotent Credit Ledger**
    
    During automated mobile device testing runs, credit balances are deducted from user accounts as virtual devices are booted.
    If a device allocation times out halfway through provisioning, the billing ledger was left in a half-deducted state because
    the exception bypassed the balance commit.
    
    Build a transactional context manager that creates a snapshot before execution and rolls back all modified keys
    if any step fails.
  trigger_keywords: ["context manager", "simulate_transaction", "operations"]
  examples:
    - input: "initial_state = {'credits': 100}, operations = [{'op': 'set', 'key': 'credits', 'val': 80}]"
      output: "{'credits': 80}"
      explanation: "Transaction succeeded, updated state committed."
    - input: "initial_state = {'credits': 100}, operations = [{'op': 'set', 'key': 'credits', 'val': 50}, {'op': 'abort', 'reason': 'timeout'}]"
      output: "{'credits': 100}"
      explanation: "Transaction aborted midway, state rolled back to original snapshot."
  constraints:
    - "initial_state is a valid dictionary"
    - "operations contains between 0 and 100 operations"

constraint_quiz:
  prompt: >-
    What value must __exit__ return in Python to suppress an exception raised within the with block?
  options:
    - "None"
    - "False"
    - "True"
    - "0"
  answer: 2
  explanation: >-
    Returning True from __exit__ indicates to the Python interpreter that the exception was handled
    and should not be re-raised to the outer scope.

pattern_quiz:
  prompt: What are the two essential dunder methods of a Python context manager?
  options:
    - "__init__ and __del__"
    - "__enter__ and __exit__"
    - "__start__ and __stop__"
    - "__call__ and __iter__"
  answer: 1
  explanation: >-
    The context manager protocol requires `__enter__` (setup) and `__exit__` (teardown/cleanup).

