      params: [{name: records}]
    starter_code: |
      class Solution:
          def df_row_count(self, records: list[dict]) -> int:
              pass
    tests:
      - {args: [[{"a": 1}, {"a": 2}]], expected: 2}
      - {args: [[]], expected: 0}
    solution: |
      import pandas as pd

      class Solution:
          def df_row_count(self, records: list[dict]) -> int:
              df = pd.DataFrame(records)
              return len(df)
    hint: "Use `len(pd.DataFrame(records))`."

  - title: Vectorized boolean equality mask
    skill: core
    goal: Create mask selecting rows matching string.
    instructions: |
      Return records where `category == 'A'` using `df.loc[df['category'] == 'A']`.
    function:
      name: filter_category_a
      params: [{name: records}]
    starter_code: |
      class Solution:
          def filter_category_a(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"id": 1, "category": "A"}, {"id": 2, "category": "B"}]], expected: [{"id": 1, "category": "A"}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def filter_category_a(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              filtered = df.loc[df["category"] == "A"]
              return filtered.to_dict(orient="records")
    hint: "Use `df.loc[df['category'] == 'A'].to_dict(orient='records')`."

  - title: Combined bitwise and condition
    skill: edge
    goal: Combine two Series conditions with bitwise &.
    instructions: |
      Return records where `val > 10` and `flag == True`.
    function:
      name: filter_both
      params: [{name: records}]
    starter_code: |
      class Solution:
          def filter_both(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"val": 15, "flag": true}, {"val": 5, "flag": true}]], expected: [{"val": 15, "flag": true}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def filter_both(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              mask = (df["val"] > 10) & (df["flag"] == True)
              return df.loc[mask].to_dict(orient="records")
    hint: "Wrap each comparison in parentheses: `(cond1) & (cond2)`."

