slug: koko-eating-bananas
lc: 875

concept:
  problem_it_solves: >-
    "What is the smallest setting that still gets the job done?" Nothing here is sorted, so
    there's no array to binary search. But the candidate answers (speeds 1, 2, 3, ...) are
    ordered, and the yes/no question "can she finish at speed k?" flips from no to yes exactly
    once as k grows. Any question with that shape can be binary searched on the answer itself.
  brute_force: >-
    Try k = 1, 2, 3, ... and, for each one, add up the hours every pile takes; return the
    first k that fits in h hours. Each check is a cheap O(N) pass, but you may run up to
    max(piles) of them, and almost all of those checks are pointless: once you know speed 50
    is too slow, testing 1 to 49 tells you nothing new.
  brute_force_complexity: >-
    O(N · M) time, O(1) space, where M = max(piles) — 10⁴ piles and piles up to 10⁹ means up to
    10¹³ steps.
  key_insight: >-
    Stop searching the input and search the answer space. The speed lies in [1, max(piles)]:
    speed 1 is the slowest possible, and at speed max(piles) every pile takes exactly one
    hour, so n <= h hours always suffices. Define feasible(k) = "total hours at speed k <= h".
    Faster never hurts, so feasible is monotonic: F F F ... F T T T ... T. The answer is the
    first T, and a binary search finds it with about 30 feasibility checks instead of 10⁹.
    Each pile at speed k takes ceil(p / k) hours, computed in integers as (p + k - 1) // k.
  real_world: >-
    Capacity planning is binary search on the answer: "what is the smallest number of Kafka
    consumers / pods / worker threads that clears this backlog before the SLA?" Autoscalers and
    load-testing tools (k6, Locust ramp tests) search for the lowest replica count or the
    highest request rate that still meets a latency target, and rate limiters are tuned by
    searching for the lowest refill rate that drains queued requests in time.

statement:
  clean: |
    Koko loves to eat bananas. There are `n` piles of bananas, the `i`th pile has `piles[i]`
    bananas. The guards have gone and will come back in `h` hours.

    Koko can decide her bananas-per-hour **eating speed** of `k`. Each hour, she chooses some
    pile of bananas and eats `k` bananas from that pile. If the pile has less than `k`
    bananas, she eats all of them instead and will not eat any more bananas during this hour.

    Koko likes to eat slowly but still wants to finish eating all the bananas before the
    guards return.

    Return the **minimum integer k** such that she can eat all the bananas
    **within h hours**.
  oa_story: |
    **HostelHub Rentals — OA Round 1**

    HostelHub manages PG accommodations across Koramangala, HSR Layout and Marathahalli.
    Before the July move-in rush, every tenant application must have its KYC documents
    verified. Applications are grouped by building: building `i` has `piles[i]` documents in
    its queue. One verification agent handles everything, and the compliance team wants all
    queues cleared within `h` working hours.

    The agent works building by building: in each hour they pick one building and verify up
    to `k` of its documents. If that building has fewer than `k` documents left, they finish
    them and spend the rest of the hour on paperwork, never switching buildings mid-hour.
    Verifying faster costs money (the agent needs more tooling), so HostelHub wants the
    smallest whole number `k` that still clears every queue in time. There are up to 10⁴
    buildings, a queue can hold up to 10⁹ documents, and `h` is at least the number of
    buildings.
  trigger_keywords: ["eating speed", "minimum integer k", "within h hours"]
  examples:
    - input: "piles = [3,6,7,11], h = 8"
      output: "4"
      explanation: "At k = 4 the piles take 1 + 2 + 2 + 3 = 8 hours. At k = 3 they take 1 + 2 + 3 + 4 = 10 > 8."
    - input: "piles = [30,11,23,4,20], h = 5"
      output: "30"
      explanation: "Five piles in five hours: each pile must be finished in one hour, so k = max(piles)."
    - input: "piles = [30,11,23,4,20], h = 6"
      output: "23"
      explanation: "At k = 23 only the 30-pile needs two hours: 2 + 1 + 1 + 1 + 1 = 6."
  constraints:
    - "1 <= piles.length <= 10^4"
    - "piles.length <= h <= 10^9"
    - "1 <= piles[i] <= 10^9"

constraint_quiz:
  prompt: >-
    There are up to 10⁴ piles and each pile can hold up to 10⁹ bananas. Checking one speed
    takes O(N). What overall complexity should you aim for?
  options:
    - "O(N · max(piles)) — try every speed"
    - "O(N log N) — sort the piles first"
    - "O(N · log(max(piles))) — binary search the speed"
    - "O(log(max(piles))) — binary search alone"
  answer: 2
  explanation: >-
    Trying every speed is up to 10⁹ checks of 10⁴ piles each, about 10¹³ steps. Sorting the
    piles costs O(N log N) but doesn't tell you the speed; the order of the piles doesn't
    even matter. O(log M) alone is impossible because each feasibility check must read every
    pile. Binary searching the speed needs about log₂(10⁹) ≈ 30 checks of O(N) each, around
    3 × 10⁵ steps.

pattern_quiz:
  prompt: >-
    You need the minimum speed such that a total time stays within a limit, and a higher speed
    never takes longer. Which pattern fits?
  options:
    - "Greedy: sort the piles and eat the biggest first"
    - "Binary search on the answer (the speed) with a feasibility check"
    - "Sliding window over the piles"
    - "Max-heap of the remaining piles"
  answer: 1
  explanation: >-
    "Minimum k such that ... within h hours" plus "faster is never worse" is the binary search
    on answer trigger: the yes/no question is monotonic in k, so you can binary search k
    directly. The order in which she eats piles doesn't change the total, so sorting or a heap
    adds nothing, and there's no contiguous range to slide a window over.

