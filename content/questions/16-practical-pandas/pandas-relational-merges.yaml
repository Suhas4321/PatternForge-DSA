drills:
  - title: Simple two-table inner merge
    skill: setup
    goal: Merge two DataFrames on a single shared key.
    instructions: |
      Merge `left` and `right` on `"id"` using an inner join and return records.
    function:
      name: merge_on_id
      params: [{name: left}, {name: right}]
    starter_code: |
      class Solution:
          def merge_on_id(self, left: list[dict], right: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"id": 1, "a": "x"}], [{"id": 1, "b": "y"}]], expected: [{"id": 1, "a": "x", "b": "y"}]}
      - {args: [[{"id": 1}], [{"id": 2}]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def merge_on_id(self, left: list[dict], right: list[dict]) -> list[dict]:
              if not left or not right:
                  return []
              df_l = pd.DataFrame(left)
              df_r = pd.DataFrame(right)
              merged = pd.merge(df_l, df_r, on="id", how="inner")
              return merged.to_dict(orient="records")
    hint: "Use `pd.merge(df_l, df_r, on='id', how='inner')`."

  - title: Filter merged records by condition
    skill: core
    goal: Slice rows based on column value after join.
    instructions: |
      Given records with `severity`, return only rows where `severity == 'P1'`.
    function:
      name: filter_p1
      params: [{name: records}]
    starter_code: |
      class Solution:
          def filter_p1(self, records: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"id": 1, "severity": "P1"}, {"id": 2, "severity": "P2"}]], expected: [{"id": 1, "severity": "P1"}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def filter_p1(self, records: list[dict]) -> list[dict]:
              if not records:
                  return []
              df = pd.DataFrame(records)
              return df.loc[df["severity"] == "P1"].to_dict(orient="records")
    hint: "Use `df.loc[df['severity'] == 'P1']`."

  - title: Deduplicate on key and sort
    skill: edge
    goal: Drop duplicate user records and sort by ID.
    instructions: |
      Drop duplicate `user_id`s and sort by `user_id` ascending.
    function:
      name: dedupe_and_sort
      params: [{name: users}]
    starter_code: |
      class Solution:
          def dedupe_and_sort(self, users: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"user_id": 5}, {"user_id": 2}, {"user_id": 5}]], expected: [{"user_id": 2}, {"user_id": 5}]}
      - {args: [[]], expected: []}
    solution: |
      import pandas as pd

      class Solution:
          def dedupe_and_sort(self, users: list[dict]) -> list[dict]:
              if not users:
                  return []
              df = pd.DataFrame(users)
              deduped = df.drop_duplicates(subset=["user_id"]).sort_values(by="user_id", ascending=True)
              return deduped.to_dict(orient="records")
    hint: "Use `.drop_duplicates(subset=['user_id']).sort_values(by='user_id')`."

hints:
  - "Check if any of `users`, `test_runs`, or `incidents` is empty; if so, return `[]`."
  - "Merge `test_runs` and `incidents` on `run_id`, then merge with `users` on `user_id`."
  - "Filter where `severity == 'P1'`, select columns `['user_id', 'name', 'email']`, deduplicate on `user_id`, and sort."

solution:
  code: |
    import pandas as pd

    class Solution:
        def find_affected_customers(self, users: list[dict], test_runs: list[dict], incidents: list[dict]) -> list[dict]:
            if not users or not test_runs or not incidents:
                return []

            df_users = pd.DataFrame(users)
            df_runs = pd.DataFrame(test_runs)
            df_incidents = pd.DataFrame(incidents)

            # Step 1: Join runs and incidents on run_id
            runs_incidents = pd.merge(df_runs, df_incidents, on="run_id", how="inner")

            # Step 2: Join with users on user_id
            full_df = pd.merge(runs_incidents, df_users, on="user_id", how="inner")

            # Step 3: Filter for P1 incidents
            p1_df = full_df.loc[full_df["severity"] == "P1"]

            if p1_df.empty:
                return []

            # Step 4: Extract columns, deduplicate, and sort
            client_cols = ["user_id", "name", "email"]
            result_df = p1_df[client_cols].drop_duplicates(subset=["user_id"]).sort_values(by="user_id", ascending=True)

            return result_df.to_dict(orient="records")
  explanation: |
    We perform relational hash joins using `pd.merge(..., how='inner')`.
    First, `runs_incidents` correlates each test run with its recorded incident alerts.
    Next, joining with `df_users` maps the incident back to the owning customer.
    
    Filtering by `severity == 'P1'` isolates critical failures.
    Finally, `.drop_duplicates(subset=['user_id'])` collapses multiple failed runs by the same customer
    into a single notification record, and `sort_values` provides ordered output.
  time: O(U + R + I) hash join complexity
  space: O(U + R + I) for DataFrames

pitch_script: |
  **(Clarify)** "We need to identify all distinct customer accounts affected by P1 incidents by joining users, test runs, and incidents tables."

  **(Basement Insight)** "Nested loop joins in procedural Python scale in O(N * M) polynomial time. `pd.merge` uses vectorized hash joins in compiled C, executing in linear O(N + M) time by hashing the join keys."

  **(Solution)** "We load the three datasets into DataFrames. We inner-join `test_runs` with `incidents` on `run_id`, then join the result with `users` on `user_id`. We filter rows where `severity == 'P1'`, project `[user_id, name, email]`, deduplicate on `user_id`, and sort."

  **(Complexity)** "Executes in O(U + R + I) time across all records with O(U + R + I) space."

