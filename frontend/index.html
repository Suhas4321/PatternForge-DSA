<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatternForge DSA</title>
    <script>
      // Apply the saved theme before first paint (no flash). Default: carbon-dark.
      try {
        var t = localStorage.getItem('pf-theme')
        document.documentElement.dataset.theme = (t === 'paper' || t === 'studio-contrast') ? 'paper' : 'carbon-dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'carbon-dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
