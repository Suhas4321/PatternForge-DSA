hints:
  - "If `not requests`, return `{'total_requests': 0, 'compute_calls': 0, 'results': []}` immediately."
  - "Maintain a dictionary `in_flight = {}`. When a key is requested, check if `key in in_flight`."
  - "If not present, increment `compute_calls += 1`, create an async task that sleeps briefly and returns `f'result_{key}'`, store it in `in_flight[key]`, await it, and in a `finally` block delete `key` from `in_flight`."

solution:
  code: |
    import asyncio

    class Solution:
        async def simulate_single_flight(self, requests: list[str]) -> dict:
            if not requests:
                return {
                    "total_requests": 0,
                    "compute_calls": 0,
                    "results": [],
                }

            in_flight: dict[str, asyncio.Task] = {}
            compute_calls = 0

            async def execute_request(key: str) -> str:
                nonlocal compute_calls
                if key in in_flight:
                    return await in_flight[key]

                async def worker() -> str:
                    await asyncio.sleep(0.001)
                    return f"result_{key}"

                compute_calls += 1
                task = asyncio.create_task(worker())
                in_flight[key] = task
                try:
                    return await task
                finally:
                    in_flight.pop(key, None)

            results = await asyncio.gather(*[execute_request(k) for k in requests])

            return {
                "total_requests": len(requests),
                "compute_calls": compute_calls,
                "results": list(results),
            }
  explanation: |
    The Single-Flight pattern registers the first caller's computation in an `in_flight` dictionary as an `asyncio.Task`.
    Any simultaneous caller requesting the identical key detects the active task and awaits it directly,
    bypassing the backend computation.
    
    Once the task resolves, all waiting coroutines receive the result concurrently, and the `finally` block
    clears the key from `in_flight` to allow subsequent requests to compute fresh data.
  time: O(K) wall-clock time where K is unique keys in flight, O(N) memory for coroutines
  space: O(N) for request futures and results

pitch_script: |
  **(Clarify)** "We need to build a single-flight request coalescer that prevents cache stampedes by ensuring concurrent requests for the same key share a single backend execution."

  **(Basement Insight)** "When a high-traffic cache key expires or misses, hundreds of simultaneous incoming requests independently query the downstream database or GPU worker. This thundering herd causes cascading failure. Single-Flight coalesces concurrent in-flight requests into a single task."

  **(Solution)** "We track an `in_flight` dictionary of active `asyncio.Task` instances. The first caller creates the task, increments our compute counter, and registers it. Concurrent callers finding the key in `in_flight` simply await that task. A `finally` block ensures the key is deregistered when complete."

  **(Complexity)** "Reduces backend compute load from O(N) callers down to O(U) where U is the count of unique keys."

