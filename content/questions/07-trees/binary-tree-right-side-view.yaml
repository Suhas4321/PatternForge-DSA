slug: binary-tree-right-side-view
lc: 199

concept:
  problem_it_solves: >-
    "Which node is the last one on each level?" Standing to the right of the tree, you see one
    node per depth: the rightmost node at that depth. That is a per-level question, so the
    level-by-level BFS from the previous lesson answers it directly; you just keep one value per
    round instead of the whole level.
  brute_force: >-
    The tempting shortcut is to follow `.right` pointers from the root, but it is wrong: in
    [1,2,3,4] the node 4 hangs off the *left* side and is still visible, because nothing is to
    its right on that level. A correct naive approach finds the height H and, for each depth d,
    runs a fresh DFS from the root to find the rightmost node at depth d, re-walking the upper
    levels every time.
  brute_force_complexity: O(N · H) time, O(H) space — on a skewed tree that is O(N²) node visits.
  key_insight: >-
    "Visible from the right" means "last in its level", not "reachable by going right". Run
    the level BFS: at the start of each round, size = len(queue) is the number of nodes on the
    level, and they come out left to right. The node popped at position size - 1 is the one
    you see. Equivalently, a DFS that visits right before left sees each depth's rightmost
    node first, so it records a node whenever its depth equals the number of values recorded
    so far.
  real_world: >-
    UIs that collapse a hierarchy into one row per tier (org charts, network topology maps,
    nested comment threads in "compact" mode) walk the tree level by level and keep a single
    representative per depth. More generally, "BFS, then one summary per level" (last item,
    max, count) is how monitoring tools report per-hop figures for a request fan-out tree, for
    example how many downstream calls a gateway made at depth 1, 2 and 3.

statement:
  clean: |
    Given the `root` of a binary tree, imagine yourself standing on the **right side** of it.
    Return the values of the nodes **you can see**, ordered from **top to bottom**.

    You see exactly one node per level: the rightmost node on that level, even if it is a left
    child. An empty tree returns an empty list.
  oa_story: |
    **TowerTrack Networks — OA Round 1**

    TowerTrack maintains the mobile tower backbone for a telecom operator across Bengaluru. The
    network is organised as a hierarchy: a core switch at Whitefield feeds up to two
    aggregation towers, each of which feeds up to two more, and so on. On the topology screen
    every tier is drawn as one row, with each tower's west feed drawn to the left of its east
    feed.

    The NOC wall display is narrow, so it shows a single tower ID per tier: the one drawn at
    the far east end of that row, because that is where the newest fibre links land. Given the
    hierarchy, return the tower IDs the wall display shows, from the core switch's tier down to
    the deepest tier. A tower can be the easternmost of its row even if it is a west feed, as
    long as nothing in that row is drawn east of it. With no towers, the display is empty.
  trigger_keywords: ["right side", "you can see", "top to bottom"]
  examples:
    - input: "root = [1,2,3,null,5,null,4]"
      output: "[1,3,4]"
      explanation: "Levels are [1], [2,3], [5,4]. The last node of each level is 1, 3, 4."
    - input: "root = [1,2,3,4,null,null,null,5]"
      output: "[1,3,4,5]"
      explanation: "Levels 2 and 3 contain only left-side nodes (4, then 5), so you still see them."
    - input: "root = [1,null,3]"
      output: "[1,3]"
  constraints:
    - "The number of nodes in the tree is in the range [0, 100]"
    - "-100 <= Node.val <= 100"

constraint_quiz:
  prompt: >-
    N is at most 100 here, so almost anything passes. In an interview, what complexity should
    you present as optimal, and why?
  options:
    - "O(H) — just follow the right pointers"
    - "O(N · H) — find the rightmost node at each depth separately"
    - "O(N) — one BFS or DFS over the whole tree"
    - "O(N log N) — sort nodes by (depth, position)"
  answer: 2
  explanation: >-
    Following right pointers is O(H) but gives the wrong answer whenever a left subtree is
    deeper than the right one. A search per depth is correct but re-walks the top levels, O(N²)
    on a chain. Sorting by position adds a log factor for an order BFS already produces. You
    can't do better than O(N) in general: the visible node on the bottom level could be any
    node, so every node might need to be looked at. Interviewers expect O(N) regardless of the
    small limit.

pattern_quiz:
  prompt: >-
    You need exactly one node per depth, the last one on that level when read left to right.
    Which pattern fits?
  options:
    - "Walk the right spine: root, root.right, root.right.right, ..."
    - "Level-order BFS, keeping the last node of each level"
    - "In-order traversal, keeping the last value"
    - "Binary search on the depth"
  answer: 1
  explanation: >-
    "One value per level" plus "rightmost" is the level-BFS trigger: with the len(queue)
    snapshot you know exactly which pop is the last one on its level. The right spine misses
    left nodes that stick out below a shorter right subtree. In-order and binary search don't
    group nodes by depth at all.

