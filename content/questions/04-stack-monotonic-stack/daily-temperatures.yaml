slug: daily-temperatures
lc: 739

concept:
  problem_it_solves: >-
    "For every element, what is the next element to its right that beats it?" Asking that
    question separately for each element means scanning forward again and again. A monotonic
    stack keeps only the elements still waiting for an answer, and resolves several of them
    the moment a bigger value shows up.
  brute_force: >-
    For each day i, walk forward j = i+1, i+2, … until temperatures[j] > temperatures[i].
    On a falling sequence like [90, 89, 88, …] every day scans to the end, re-reading the same
    days over and over.
  brute_force_complexity: O(N²) time, O(1) extra space — 10⁵ days means up to 5 × 10⁹ comparisons.
  key_insight: >-
    Flip the direction of the question. Instead of each day looking forward for its answer,
    let each new day *answer the waiting days*. Keep a stack of indices whose answer is still
    unknown; their temperatures are decreasing from bottom to top. When a warmer day arrives,
    pop every colder day off the stack: today is their answer. Each index is pushed once and
    popped once, so the whole scan is O(N).
  real_world: >-
    Stock tickers and trading dashboards use the same "next greater / previous greater" scan for
    span and breakout indicators. Monitoring systems use it to find "how long until this metric
    was exceeded", and browsers use stacks of pending elements while parsing nested HTML.

statement:
  clean: |
    Given an array of integers `temperatures` representing the daily temperatures, return an
    array `answer` such that `answer[i]` is the **number of days you have to wait** after the
    `i`th day to get a **warmer temperature**.

    If there is no future day for which this is possible, keep `answer[i] == 0` instead.
  oa_story: |
    **ChaiCloud Energy — OA Round 1**

    ChaiCloud runs smart thermostats in co-working spaces across Koramangala and HSR Layout.
    The ops dashboard receives one reading per day for a building, in order. For each day, the
    facilities team wants to know how many days they'll wait until a reading that is strictly
    higher than that day's, so they can schedule AC servicing before the heat arrives.

    Write a function that takes the list of daily readings and returns, for each day, the
    number of days until a strictly higher reading. If no later day is higher, report 0 for
    that day. Buildings can have up to 100,000 days of history, so the report must be fast.
  trigger_keywords: ["number of days you have to wait", "warmer temperature"]
  examples:
    - input: "temperatures = [73,74,75,71,69,72,76,73]"
      output: "[1,1,4,2,1,1,0,0]"
      explanation: "Day 2 (75) waits until day 6 (76): 4 days. Days 3 and 4 are both answered by day 5 (72)."
    - input: "temperatures = [30,40,50,60]"
      output: "[1,1,1,0]"
    - input: "temperatures = [30,60,90]"
      output: "[1,1,0]"
  constraints:
    - "1 <= temperatures.length <= 10^5"
    - "30 <= temperatures[i] <= 100"

constraint_quiz:
  prompt: With up to 10⁵ days, what time complexity do you need?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(N · 100)"]
  answer: 2
  explanation: >-
    O(N²) is up to 10¹⁰ steps on a decreasing input, which is far too slow. O(N log N) would
    pass but nothing needs sorting here. O(N) is achievable because each index enters and
    leaves the stack once. O(N · 100) (scanning by temperature value) also technically passes
    because temperatures are bounded, but it is a trick that breaks if the range grows; the
    stack works for any values.

pattern_quiz:
  prompt: >-
    For each element you need the next element to the right that is strictly greater.
    Which pattern fits?
  options:
    - "Sliding window"
    - "Monotonic decreasing stack of indices"
    - "Binary search on each suffix"
    - "Two pointers from both ends"
  answer: 1
  explanation: >-
    "Next greater element" is the textbook monotonic-stack trigger. Unresolved days form a
    decreasing sequence, so the newest one is always on top; a warmer day pops and answers them
    in order. A window doesn't fit because the answer isn't about contiguous ranges, and
    suffixes aren't sorted, so binary search doesn't apply.

