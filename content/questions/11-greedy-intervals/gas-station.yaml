slug: gas-station
lc: 134

concept:
  problem_it_solves: >-
    "On a loop of stops with gains and costs, where can I start so my running balance never
    goes negative?" Simulating from every start repeats the same arithmetic N times. Two
    facts collapse it to one pass: if the total gain covers the total cost a valid start
    must exist, and a start that fails at station k rules out every station between it and
    k as well.
  brute_force: >-
    Try every station as the start and drive the full loop, failing as soon as the tank goes
    negative. It wastes work because after a start s fails at station k, it goes on to try
    s + 1, s + 2, … k, re-driving the same stretch of road, even though none of those
    starts can possibly do better.
  brute_force_complexity: O(N²) time, O(1) space — 10⁵ stations means up to 10¹⁰ steps.
  key_insight: >-
    Drive once from station 0 with a running tank. When the tank goes negative at station
    k, don't retry s + 1: every station between s and k was reached with a non-negative
    tank, so starting there with an empty tank is never better, and it would fail at k too.
    Jump the candidate straight to k + 1 with an empty tank. Separately, if sum(gas) ≥
    sum(cost), the last candidate standing is guaranteed to complete the circuit.
  real_world: >-
    EV fleet operators (Ather, Yulu) and logistics teams plan loop routes the same way:
    find the depot from which a vehicle never runs dry. Cash-management systems use it to
    pick the day to start a recurring cycle of inflows and outflows so the balance never
    dips below zero, and stream processors use the reset trick to find where a running
    budget first becomes sustainable.

statement:
  clean: |
    There are `n` gas stations along a **circular route**, where the amount of gas at the
    `i`th station is `gas[i]`.

    You have a car with an unlimited gas tank, and it costs `cost[i]` of gas to travel from
    the `i`th station to the next `(i + 1)`th station. You begin the journey with an
    **empty tank** at one of the gas stations.

    Given two integer arrays `gas` and `cost`, return the
    **starting gas station's index** if you can **travel around the circuit once** in the
    clockwise direction, otherwise return `-1`. If there exists a solution, it is
    guaranteed to be **unique**.
  oa_story: |
    **ClinicQ — OA Round 2**

    ClinicQ runs a mobile health van that loops through a fixed circuit of neighbourhood
    camps around Bengaluru: Yelahanka, Hebbal, RT Nagar and onward, eventually back to the
    first camp. At each camp the van collects a known number of vaccine cold-packs donated
    by local clinics, and the trip from that camp to the next one uses up a known number of
    cold-packs to keep the vials at temperature. The van leaves its first camp with no
    packs on board and cannot carry a deficit.

    Given the packs collected at each camp and the packs used on the leg to the next camp,
    return the index of the camp where the van should begin so it completes one full loop
    without ever running out, or `-1` if no such camp exists. Planning guarantees at most
    one valid camp. Circuits can have 100,000 camps, so the planner must work in one pass.
  trigger_keywords: ["circular route", "starting gas station's index", "travel around the circuit once"]
  examples:
    - input: "gas = [1,2,3,4,5], cost = [3,4,5,1,2]"
      output: "3"
      explanation: >-
        Start at station 3 and fill up with 4. Tank after arriving and filling up at each
        next station: 4 - 1 + 5 = 8, 8 - 2 + 1 = 7, 7 - 3 + 2 = 6, 6 - 4 + 3 = 5. The last
        leg back to station 3 costs 5, leaving exactly 0, so it never goes negative.
    - input: "gas = [2,3,4], cost = [3,4,3]"
      output: "-1"
      explanation: "Total gas is 9 but total cost is 10, so no start can work."
  constraints:
    - "n == gas.length == cost.length"
    - "1 <= n <= 10^5"
    - "0 <= gas[i], cost[i] <= 10^4"
    - "The input is generated such that the answer is unique."

constraint_quiz:
  prompt: With up to 10⁵ stations, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(N) per candidate start"]
  answer: 2
  explanation: >-
    Simulating from every start is O(N²), up to 10¹⁰ steps. Nothing benefits from sorting
    (the order of stations is the whole problem), so O(N log N) isn't a natural target.
    O(N) per candidate start is just the brute force again. A single pass with the reset
    trick is O(N), because each station is visited exactly once.

pattern_quiz:
  prompt: >-
    A circular list of gains and costs; find the unique start where the running balance
    never goes negative. Which pattern fits?
  options:
    - "Two pointers closing in from both ends"
    - "Greedy one pass: reset the start after any station where the tank goes negative"
    - "Sliding window of fixed size n over the doubled array"
    - "Sort stations by gas − cost and start at the best one"
  answer: 1
  explanation: >-
    The running balance from a failed start tells you about every station in between, so
    the greedy can skip them all and reset after the failure point. That's the reset-start
    trigger. Sorting by surplus breaks the circular order, and starting at the biggest
    surplus isn't always right. A window over a doubled array can work but is clumsier, and
    two pointers don't model a running balance.

