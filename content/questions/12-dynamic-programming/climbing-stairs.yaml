slug: climbing-stairs
lc: 70

concept:
  problem_it_solves: >-
    "In how many different ways can I build up to a target, when every move is one of a few
    small choices?" Listing every sequence of moves explodes, but the count for a target only
    depends on the counts for slightly smaller targets. Dynamic programming is just this:
    answer each smaller version of the question once, write it down, and build the big
    answer out of the stored small ones.
  brute_force: >-
    Recurse: ways(n) = ways(n − 1) + ways(n − 2), with ways(0) = ways(1) = 1. It's correct,
    but draw the call tree for ways(5): ways(3) is computed twice, ways(2) three times,
    ways(1) five times. The two branches keep re-solving the same small staircases from
    scratch. Worse, the only numbers ever returned at the bottom are 1s, so the recursion
    literally counts the answer one route at a time: it makes exactly 2 × answer − 1 calls.
  brute_force_complexity: >-
    O(φⁿ) ≈ O(1.618ⁿ) time (often loosely called O(2ⁿ)), O(N) recursion stack — n = 45 has
    1,836,311,903 routes, so the plain recursion makes about 3.7 × 10⁹ calls.
  key_insight: >-
    Think about the LAST move, not the first. Every route that ends on step i arrives either
    with a 1-step from step i − 1 or with a 2-step from step i − 2. Those two groups never
    overlap (the last move differs) and together they cover every route, so
    ways(i) = ways(i − 1) + ways(i − 2). There are only n + 1 different questions (steps 0 to
    n), so store each answer in dp[i] the first time you compute it, and fill the table from
    the bottom up. That is the whole of DP: a recurrence plus a memory, never solving the
    same subproblem twice.
  real_world: >-
    Memoisation is caching: the same idea as putting a computed result in Redis or
    functools.lru_cache so an identical request never recomputes it. Bottom-up tabulation is
    how a spreadsheet engine recalculates (each cell is computed once, after the cells it
    depends on), and how build systems like Bazel reuse the output of identical sub-builds
    instead of rebuilding them for every target that needs them.

statement:
  clean: |
    You are climbing a staircase. It takes `n` steps to reach the top.

    Each time you can either climb 1 or 2 steps. In **how many distinct ways** can you climb
    to the top?
  oa_story: |
    **StepSathi Fitness — OA Round 1**

    StepSathi runs a stair-climbing challenge at Namma Metro stations: users climb the
    station stairwell and the app records their stride on every move. A stride is either a
    single step or a long stride that skips one step, and the app treats two climbs as
    different if their sequences of strides differ, even when they use the same number of
    each.

    For a new "never repeat a pattern" badge, StepSathi needs to know how many different
    stride sequences exist for a stairwell of `n` steps, ending exactly on the top step.
    Stairwells in the network have at most 45 steps, and the badge service must answer
    instantly for any of them.
  trigger_keywords: ["how many distinct ways", "1 or 2 steps"]
  examples:
    - input: "n = 2"
      output: "2"
      explanation: "1 step + 1 step, or a single 2-step."
    - input: "n = 3"
      output: "3"
      explanation: "1 + 1 + 1, 1 + 2, or 2 + 1. Order matters: 1 + 2 and 2 + 1 are different ways."
  constraints:
    - "1 <= n <= 45"

constraint_quiz:
  prompt: >-
    n is at most 45. Plain recursion makes about 2 × answer calls, and the answer for n = 45 is
    about 1.8 × 10⁹. What complexity should you aim for?
  options:
    - "O(2ⁿ) — recursion is fine because n is small"
    - "O(N) — compute the count for each step exactly once"
    - "O(N²) — for each step, sum over every earlier step"
    - "O(log N) — binary search the number of 2-steps"
  answer: 1
  explanation: >-
    "n is small" is a trap here: the recursion makes about 3.7 × 10⁹ calls at n = 45, which
    takes minutes in Python. There are only 46 different subproblems (steps 0 to 45), and each
    needs just the two before it, so O(N) is natural. O(N²) would technically pass for n = 45,
    but nothing needs a scan over every earlier step: only the last move matters. Binary
    search doesn't apply because no monotonic yes/no question is being asked; we are counting.
    (There is an O(log N) matrix-power trick, but it isn't what this option describes and no
    interviewer expects it.)

pattern_quiz:
  prompt: >-
    You must count all distinct move sequences, the count for step n depends on smaller
    staircases, and the same smaller staircases come up again and again. Which pattern fits?
  options:
    - "Greedy: take as many 2-steps as possible"
    - "Backtracking: generate every sequence and count them"
    - "1D dynamic programming: dp[i] = dp[i − 1] + dp[i − 2]"
    - "Sliding window over the steps"
  answer: 2
  explanation: >-
    "How many distinct ways" plus "each move is a small fixed choice" is the counting-DP
    trigger, and the repeated smaller staircases are the overlapping subproblems that make
    storing answers pay off. Greedy finds one route, not the number of routes. Backtracking
    is correct but enumerates ~1.8 × 10⁹ sequences for n = 45. There is no contiguous range
    with a window condition here, so a sliding window has nothing to slide over.

