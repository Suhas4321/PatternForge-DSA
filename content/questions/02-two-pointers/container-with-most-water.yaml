    6: "Water capacity is limited by the shorter line multiplied by the distance."
    7: "Record maximum area seen across all container widths."
    9: "The shorter line height[l] is the bottleneck; move l inward to seek a taller wall."
    12: "The shorter line height[r] is the bottleneck; move r inward to seek a taller wall."
