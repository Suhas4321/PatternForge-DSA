slug: invert-binary-tree
lc: 226

concept:
  problem_it_solves: >-
    "Build the mirror image of this tree." Mirroring looks like a global operation (the leftmost
    leaf must end up rightmost), but it decomposes into one tiny local job: at every node, swap
    the two children. Asking "what does each call hand back to its parent?" turns it into a
    three-line transform DFS.
  brute_force: >-
    Think in levels: write the tree into a padded array, one slot per possible position
    (slot i has children 2i+1 and 2i+2, empty positions included), reverse each level's slice,
    and rebuild the tree from the array. Reversing values without the empty slots would put
    nodes under the wrong parents, so the padding is required, and padding is where it
    explodes: a level at depth d has 2^d slots whether or not any nodes live there.
  brute_force_complexity: >-
    O(2^H) time and space, where H is the height — a skewed tree of 100 nodes needs 2¹⁰⁰ slots,
    even though only 100 of them hold a node.
  key_insight: >-
    Give each call a contract: "invertTree(node) mirrors the subtree rooted at node and returns
    its root." The mirror of an empty tree is empty. For a real node, trust the two recursive
    calls to mirror the left and right subtrees, then attach them on the opposite sides. The
    node stays the root of its own subtree, so you return the same node. Write the swap as one
    tuple assignment: assigning root.left first and then reading root.left again would read the
    value you just overwrote.
  real_world: >-
    Right-to-left UI support (Android's layoutDirection, Flutter's Directionality, CSS logical
    properties) mirrors a layout tree so Arabic and Urdu screens read correctly. Compilers and
    tools like Babel, ESLint autofixers and Python's ast.NodeTransformer use the same "visit a
    node, transform it, return the new subtree to the parent" DFS to rewrite syntax trees.

statement:
  clean: |
    Given the `root` of a binary tree, **invert the tree**, and return its root.

    Inverting a tree produces its **mirror image**: every node's left and right children are
    swapped, at every level of the tree.
  oa_story: |
    **MenuMitra — OA Round 1**

    MenuMitra powers the in-app menus for thousands of restaurants on food-delivery apps
    across Bengaluru. Every menu is a hierarchy of categories: "Mains" splits into at most two
    sub-sections ("Veg" shown first, "Non-Veg" shown second), each of those can split again,
    and so on. The app stores the menu starting from its top-level category, and each category
    links to its first and second sub-sections, if present.

    MenuMitra is launching an Urdu interface, which reads right to left. The design team
    wants every menu flipped so it reads correctly: at every category, the sub-section shown
    second must now be shown first and vice versa, all the way down. Write a function that
    flips a menu in place and returns its top-level category. A menu can have up to 100
    categories, and an empty menu stays empty.
  trigger_keywords: ["invert the tree", "mirror image"]
  examples:
    - input: "root = [4,2,7,1,3,6,9]"
      output: "[4,7,2,9,6,3,1]"
      explanation: "7 moves to the left of 4 and 2 to the right, and inside each, the children swap as well."
    - input: "root = [2,1,3]"
      output: "[2,3,1]"
    - input: "root = []"
      output: "[]"
  constraints:
    - "The number of nodes in the tree is in the range [0, 100]."
    - "-100 <= Node.val <= 100"

constraint_quiz:
  prompt: >-
    The tree has at most 100 nodes, which sounds tiny. What complexity should you still aim for,
    and why?
  options:
    - "O(N) — each node needs exactly one swap"
    - "O(N log N) — sort each level"
    - "O(N²) — fine, N is only 100"
    - "O(2^H) — fine, the tree is small"
  answer: 0
  explanation: >-
    Every node must have its children swapped, so O(N) is both necessary and enough. O(N log N)
    and O(N²) would pass at N = 100 but do work no step of the problem needs, and nothing here
    benefits from sorting. O(2^H) is the trap of the padded level-array approach: 100 nodes can
    form a chain of height 100, and 2¹⁰⁰ slots will never finish. Small N doesn't make an
    exponential approach safe when the exponent is the height.

pattern_quiz:
  prompt: >-
    You must change the shape of the tree, and the change at each node is the same small local
    edit. Which approach fits?
  options:
    - "Transform DFS: invert both subtrees, attach them swapped, return the node"
    - "Reverse the in-order traversal array and rebuild the tree from it"
    - "Sort the values on each level in descending order"
    - "Two pointers moving inward over the level-order array"
  answer: 0
  explanation: >-
    "Mirror / invert / flip" is the transform-DFS trigger: each call fixes its own subtree and
    returns the root to its parent. A reversed in-order list doesn't determine a unique tree,
    so you can't rebuild from it. Sorting levels changes which values sit where (a mirror keeps
    each node's value). The level-order array has null gaps that two pointers would put under
    the wrong parents. (A BFS queue that swaps each popped node's children also works; it's the
    iterative alternative.)

