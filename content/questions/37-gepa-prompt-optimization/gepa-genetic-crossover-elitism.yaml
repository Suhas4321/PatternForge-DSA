drills:
- title: Select Top Elites
  skill: setup
  goal: Preserve top k individuals by fitness.
  instructions: Sort by -fitness, id and return top k.
  function:
    name: get_elites
    params:
    - name: pop
      type: any
    - name: k
      type: any
  starter_code: "class Solution:\n    def get_elites(self, pop: list, k: int) -> list:\n        pass\n"
  tests:
  - args:
    - - id: b
        fitness: 0.8
      - id: a
        fitness: 0.9
    - 1
    expected:
    - id: a
      fitness: 0.9
  solution: "class Solution:\n    def get_elites(self, pop: list, k: int) -> list:\n        return sorted(pop, key=lambda\
    \ x: (-x[\"fitness\"], x[\"id\"]))[:k]\n"
  hint: Sort by -fitness, id.
- title: Combine Parent Instructions
  skill: core
  goal: Cross over role from p1 and instruction from p2.
  instructions: Return dict with id, role p1, instruction p2, avg fitness.
  function:
    name: combine_parents
    params:
    - name: p1
      type: any
    - name: p2
      type: any
  starter_code: "class Solution:\n    def combine_parents(self, p1: dict, p2: dict) -> dict:\n        pass\n"
  tests:
  - args:
    - id: a
      role: r1
      instruction: i1
      fitness: 0.8
    - id: b
      role: r2
      instruction: i2
      fitness: 0.6
    expected:
      id: child_a_b
      role: r1
      instruction: i2
      fitness: 0.7
  solution: "class Solution:\n    def combine_parents(self, p1: dict, p2: dict) -> dict:\n        return {\n            \"\
    id\": f\"child_{p1['id']}_{p2['id']}\",\n            \"role\": p1[\"role\"],\n            \"instruction\": p2[\"instruction\"\
    ],\n            \"fitness\": round((p1[\"fitness\"] + p2[\"fitness\"]) / 2.0, 2),\n        }\n"
  hint: Take role from p1 and instruction from p2.
- title: Apply Mutation Cost
  skill: edge
  goal: Adjust fitness after mutation operation.
  instructions: Return round(fitness - 0.05, 2).
  function:
    name: deduct_mutation_cost
    params:
    - name: fitness
      type: any
  starter_code: "class Solution:\n    def deduct_mutation_cost(self, fitness: float) -> float:\n        pass\n"
  tests:
  - args:
    - 0.85
    expected: 0.8
  solution: "class Solution:\n    def deduct_mutation_cost(self, fitness: float) -> float:\n        return round(fitness -\
    \ 0.05, 2)\n"
  hint: Subtract 0.05 and round to 2 decimals.
hints:
- Sort population by fitness descending with id tie-breaker.
- Copy top elite_k individuals to next_gen.
- Iterate crossover pairs to construct children, then apply mutation rules.
solution:
  code: "class Solution:\n    def evolve_prompt_generation(self, population: list[dict], elite_k: int = 2, crossover_pairs:\
    \ list[list[int]] = None, mutation_rules: list[dict] = None) -> list[dict]:\n        if not population:\n            return\
    \ []\n            \n        sorted_pop = sorted(population, key=lambda x: (-x[\"fitness\"], x[\"id\"]))\n        next_gen\
    \ = []\n        \n        # 1. Elitism\n        elites = [dict(p) for p in sorted_pop[:elite_k]]\n        next_gen.extend(elites)\n\
    \        \n        # 2. Crossover\n        crossover_pairs = crossover_pairs or []\n        for pair in crossover_pairs:\n\
    \            p1_idx, p2_idx = pair[0], pair[1]\n            p1 = sorted_pop[p1_idx]\n            p2 = sorted_pop[p2_idx]\n\
    \            child = {\n                \"id\": f\"child_{p1['id']}_{p2['id']}\",\n                \"role\": p1[\"role\"\
    ],\n                \"instruction\": p2[\"instruction\"],\n                \"fitness\": round((p1[\"fitness\"] + p2[\"\
    fitness\"]) / 2.0, 2),\n            }\n            next_gen.append(child)\n            \n        # 3. Mutation\n     \
    \   mutation_rules = mutation_rules or []\n        for rule in mutation_rules:\n            t_id = rule.get(\"target_id\"\
    )\n            m_type = rule.get(\"mutation_type\")\n            val = rule.get(\"value\", \"\")\n            for ind\
    \ in next_gen:\n                if ind[\"id\"] == t_id:\n                    if m_type == \"append_constraint\":\n   \
    \                     ind[\"instruction\"] = f\"{ind['instruction']} Constraint: {val}\"\n                    elif m_type\
    \ == \"replace_role\":\n                        ind[\"role\"] = val\n                    ind[\"fitness\"] = round(ind[\"\
    fitness\"] - 0.05, 2)\n                    break\n                    \n        return next_gen\n"
  explanation: Executes one evolutionary generation combining elitist selection, instruction crossover, and semantic mutations.
  time: O(P log P + C + M) where P is population, C is crossovers, M is mutations
  space: O(P) for next generation population
pitch_script: '**(Clarify)** "We need to implement one discrete generation of genetic prompt optimization using elitism, prompt
  component crossover, and targeted mutations."


  **(Basement Insight)** "Finding effective prompt variations manually is slow and un-reproducible. Genetic algorithms treat
  prompts as modular genomes, systematically recombining high-performing instructions while protecting top candidates."


  **(Solution)** "We sort prompts by fitness. We carry over the top elite candidates, generate offspring by crossing over
  parent roles and instructions, and apply semantic mutations with calibrated cost penalties."


  **(Complexity)** "Executes in O(P log P) time dominated by sorting, using O(P) space."

  '
