    return 0

solution:
  code: |
    class Solution:
        def ladderLength(self, beginWord: str, endWord: str, wordList: List[str]) -> int:
            if endWord not in wordList:
                return 0
            # bucket words by wildcard pattern: "*ot" -> ["hot", "dot", "lot"]
            patterns = defaultdict(list)
            for word in wordList:
                for i in range(len(word)):
                    patterns[word[:i] + "*" + word[i + 1:]].append(word)

            dist = {beginWord: 1}  # word -> words in the shortest sequence ending at it (also the visited set)
            queue = deque([beginWord])
            while queue:
                word = queue.popleft()
                if word == endWord:
                    return dist[word]
                for i in range(len(word)):
                    for nxt in patterns[word[:i] + "*" + word[i + 1:]]:
                        if nxt not in dist:
                            dist[nxt] = dist[word] + 1
                            queue.append(nxt)
            return 0
  explanation: |
    The words form an **implicit graph**: an edge joins two words that differ in one letter. Every
    edge costs 1, so the shortest sequence is a **BFS** from `beginWord`. BFS dequeues words in
    order of distance, so the first time `endWord` comes out of the queue, its distance is minimal.

    The bottleneck is finding neighbours. Comparing against every word costs O(N · L) per word.
    Instead, index the dictionary by **wildcard patterns**: "dot" goes into "*ot", "d*t" and "do*".
    Two words are neighbours exactly when they share a pattern, so a word's neighbours are the
    union of its L buckets. The word itself shows up in its own buckets, but it's already in
    `dist`, so it's skipped.

    Three details decide correctness. The early `endWord not in wordList` check handles example 2
    (every intermediate word *and* the last one must come from the list). `dist[beginWord] = 1`
    because the answer counts words, not moves (test 3). And a word is marked when it is
    **enqueued**; marking on dequeue lets the same word be queued many times through different
    neighbours, which blows up on a 5000-word list.

    An optional speed-up is to clear a bucket after scanning it (`patterns[key] = []`): every
    word in it is now queued, so scanning it again from another word finds nothing new. For even
    larger inputs, bidirectional BFS from both ends meets in the middle and explores far fewer
    words.
  time: O(N · L²) — N·L patterns of length L to build, and each bucket holds at most 26 words, so the BFS scans O(N · L · 26) entries
  space: O(N · L²) — N·L pattern keys of length L, plus the dist map and queue
  brute_force_code: |
    class Solution:
        def ladderLength(self, beginWord: str, endWord: str, wordList: List[str]) -> int:
            def one_apart(a, b):
                return sum(x != y for x, y in zip(a, b)) == 1

            dist = {beginWord: 1}
            queue = deque([beginWord])
            while queue:
                word = queue.popleft()
                if word == endWord:
                    return dist[word]
                for nxt in wordList:  # compare against every word: O(N * L) per dequeue
                    if nxt not in dist and one_apart(word, nxt):
                        dist[nxt] = dist[word] + 1
                        queue.append(nxt)
            return 0

pitch_script: |
  **(Clarify)** "Each step changes exactly one letter, every word after beginWord must be in the
  list, and I return the number of words in the shortest sequence, including both ends, or 0. So
  if endWord isn't in the list the answer is immediately 0, right?"

  **(Brute force)** "If I treat words as nodes and one-letter differences as edges, this is a
  shortest path with unit weights. Building the edges by comparing every pair is O(N² · L), about
  2.5 × 10⁸ for 5000 words of length 10, which is too slow."

  **(Trigger)** "Shortest number of transformations, each of cost one, means BFS over an implicit
  graph. The trick is generating neighbours fast: words that differ in one position share a
  wildcard pattern like h-star-t."

  **(Optimal)** "I build a map from each pattern to the words that match it. Then BFS from
  beginWord with a distance map starting at 1. For each dequeued word I look up its L patterns,
  and every unvisited word in those buckets gets distance plus one and joins the queue. I mark
  words when I enqueue them, and the first time I dequeue endWord I return its distance. If the
  queue empties, I return 0."

  **(Complexity)** "Building the buckets is O(N · L²) because each word has L patterns of length
  L, and the BFS is the same order since each bucket has at most 26 words. Space is O(N · L²) for
  the pattern map. If it needed to be faster, I'd run bidirectional BFS."

twist:
  lc: 433
  title: Minimum Genetic Mutation
  why: >-
    Same implicit-graph BFS on a smaller alphabet: genes are 8-character strings over A, C, G, T,
    and each mutation changes one character to another valid gene from the bank. Two changes to
    the template: you return the number of mutations (edges, not words), so start the level at 0
    instead of 1, and you return -1 instead of 0 when the target is unreachable. With only 4
    letters, trying every letter at every position (the 26-letter drill with "ACGT") is simpler
    than wildcard buckets. The next step up is Word Ladder II (#126), which asks for every shortest
    sequence and needs a BFS that records parents level by level plus a backtracking pass.

