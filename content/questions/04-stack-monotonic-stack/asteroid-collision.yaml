slug: asteroid-collision
lc: 735

concept:
  problem_it_solves: >-
    "When a new item arrives, does it cancel out the most recent survivor, and maybe the one
    before that too?" Collisions only ever happen between the newest arrival and whatever is
    still standing right next to it. A stack keeps the survivors in order, so the one a new
    arrival can hit is always on top, and a chain reaction is just popping in a loop.
  brute_force: >-
    Simulate the physics literally: scan the row for the first adjacent pair where a
    right-mover sits just left of a left-mover, resolve that one crash, then rescan from the
    start. Each crash removes at least one asteroid, but every rescan re-reads all the
    survivors that already settled and will never move again.
  brute_force_complexity: >-
    O(N²) time, O(N) space — up to N crashes, each followed by an O(N) rescan, so
    10⁴ asteroids means around 10⁸ steps.
  key_insight: >-
    Process asteroids left to right and keep the survivors on a stack. A collision is only
    possible when the incoming asteroid moves **left** (negative) and the top of the stack
    moves **right** (positive); every other pair is moving apart or in the same direction and
    never meets. When they do meet there are exactly three outcomes: the incoming one is
    smaller (it explodes, stop), the top is smaller (pop it and check the new top), or they're
    equal (pop the top, and the incoming one is gone too). Each asteroid is pushed once and
    popped at most once, so the chain reactions add up to O(N) total.
  real_world: >-
    Order-book matching engines at exchanges like NSE resolve an incoming sell order against
    the most recent resting buy orders the same way: the larger side survives with the
    remainder. Text editors collapse backspaces with a stack, and Git-style undo/redo or
    "cancel the last pending operation" queues in payment systems are the same collapse rule.

statement:
  clean: |
    We are given an array `asteroids` of integers representing asteroids in a row. The
    indices of the asteroids in the array represent their relative position in space.

    For each asteroid, the **absolute value represents its size**, and the
    **sign represents its direction** (positive meaning right, negative meaning left). Each
    asteroid moves at the same speed.

    Find out the state of the asteroids after all collisions. If two asteroids meet, the
    smaller one will explode. If both are the same size, both will explode. **Two asteroids
    moving in the same direction will never meet.**
  oa_story: |
    **AnnapurnaFoods — Online Assessment, SDE-1**

    AnnapurnaFoods runs a central kitchen in Peenya that supplies its cloud kitchens across
    Bengaluru. Food trolleys move through a single narrow service corridor. Each trolley is
    logged as a signed integer: the number is its load in kilograms, positive if it is being
    pushed towards the dispatch bay (to the right) and negative if it is returning to the wash
    area (to the left). The log lists trolleys in their order along the corridor, and all of
    them move at the same pace.

    The corridor is too narrow to pass. When two trolleys meet head-on, the lighter one is
    shunted into a side bay and leaves the corridor; if they weigh the same, both are shunted.
    Trolleys heading the same way never meet. Return the trolleys still in the corridor once
    nothing else can meet, in their original left-to-right order, so the floor manager knows
    which ones to expect at each end.
  trigger_keywords: ["absolute value represents its size", "sign represents its direction", "moving in the same direction will never meet"]
  examples:
    - input: "asteroids = [5,10,-5]"
      output: "[5,10]"
      explanation: "The 10 and -5 collide, leaving the 10. The 5 and 10 never collide."
    - input: "asteroids = [8,-8]"
      output: "[]"
      explanation: "The 8 and -8 are the same size, so both explode."
    - input: "asteroids = [10,2,-5]"
      output: "[10]"
      explanation: "The 2 and -5 collide, leaving the -5. Then the 10 and -5 collide, leaving the 10."
  constraints:
    - "2 <= asteroids.length <= 10^4"
    - "-1000 <= asteroids[i] <= 1000"
    - "asteroids[i] != 0"

constraint_quiz:
  prompt: With up to 10⁴ asteroids and chain reactions possible, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(N · 1000)"]
  answer: 2
  explanation: >-
    Repeated rescanning is O(N²), about 10⁸ steps here: it might squeak through in C++ but is
    the answer interviewers want you to improve on. O(N log N) would suggest sorting, but
    sorting destroys the left-to-right order that decides who meets whom. O(N) is achievable
    because each asteroid is pushed once and popped at most once. O(N · 1000) ties the cost to
    the size range, which has nothing to do with the number of collisions.

pattern_quiz:
  prompt: >-
    Items arrive in order, and each new item may cancel the most recent survivors, possibly
    several in a row. Which pattern fits?
  options:
    - "Two pointers from both ends"
    - "Sliding window"
    - "Stack of survivors that the incoming item collapses"
    - "Sort by size and process largest first"
  answer: 2
  explanation: >-
    "The newest arrival interacts with the most recent survivor, and a win lets it hit the one
    before" is the collapse-stack trigger: the most recent unresolved thing is the one that
    matters. Two pointers from both ends would pair the wrong asteroids (the leftmost and
    rightmost never meet first), a window has no fixed boundary rule here, and sorting by size
    throws away positions, which decide who meets whom.

