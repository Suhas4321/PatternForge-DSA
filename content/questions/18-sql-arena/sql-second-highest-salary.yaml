slug: sql-second-highest-salary
lc: 9311
citadel_id: sql_dbms
brick_layer: 1
runner_type: sql_sqlite

concept:
  problem_it_solves: >-
    "How do we query the 2nd highest salary in SQL while correctly handling ties and returning NULL if only one distinct salary exists?"
    A naive `ORDER BY salary DESC LIMIT 1 OFFSET 1` fails when there are multiple employees tied for 1st place
    (e.g. two people making $300k, so offset 1 returns $300k instead of the 2nd highest salary).
    Furthermore, if only one salary exists in the entire company, `OFFSET 1` returns an empty result set (0 rows) instead of `NULL`.
  brute_force: >-
    Using `SELECT salary FROM Employee ORDER BY salary DESC LIMIT 2` and attempting to inspect the second row in Python application code.
    This pushes data over the network and fails to handle tied salaries.
  brute_force_complexity: O(N log N) sorting without handling duplicate ties or empty null edge cases.
  key_insight: >-
    Wrap a subquery in `SELECT (...) AS SecondHighestSalary`. If the subquery produces 0 rows, SQL automatically casts
    the scalar projection to `NULL`. Using `SELECT DISTINCT salary` ensures that ties for the top compensation tier
    collapse into a single rank, guaranteeing that `LIMIT 1 OFFSET 1` targets the true second-highest tier.
  real_world: >-
    LeetCode 176 (Second Highest Salary), compensation banding analytics, and extracting p99 vs p95 percentile latency thresholds in SQL.

statement:
  clean: |
    Write a SQL query using offset or dense rank salary to find the second highest distinct salary from the `Employee` table.
    If there is no second highest salary, the query should report `null` (or `NULL` in SQL).
    
    Table schema:
    ```sql
    CREATE TABLE Employee (
      id INTEGER PRIMARY KEY,
      salary INTEGER
    );
    ```
    
    Result column name: `SecondHighestSalary`.
  oa_story: |
    **Compensation & Equity Analytics — Banding Audit**
    
    During annual engineering reviews, leadership requested an automated SQL query to compute the second-highest
    distinct salary tier across engineering levels.
    When tested on smaller teams where all members shared the same initial base pay, naive queries returned empty tables
    instead of properly reporting `NULL`.
    
    Write an optimal, production-grade SQL query that handles duplicate salaries and returns `NULL` when no second distinct tier exists.
  trigger_keywords: ["dense rank salary", "Employee", "SecondHighestSalary"]
  examples:
    - input: "Employee table: id=[1, 2, 3], salary=[100, 200, 300]"
      output: "SecondHighestSalary = 200"
      explanation: "200 is the second highest distinct salary."
    - input: "Employee table: id=[1], salary=[100]"
      output: "SecondHighestSalary = null"
      explanation: "Only one salary exists, so the query must return null."
  constraints:
    - "Employee table contains between 0 and 10^5 rows"
    - "salary is a positive integer"

constraint_quiz:
  prompt: >-
    Why does wrapping a subquery `SELECT (SELECT ... ) AS col` produce `NULL` when the subquery returns 0 rows?
  options:
    - "Because scalar subqueries evaluate to NULL when their result set is empty"
    - "Because SQLite automatically inserts 0"
    - "Because of the WHERE clause"
    - "Because integers cannot be empty"
  answer: 0
  explanation: >-
    In ANSI SQL, a scalar subquery in the SELECT clause evaluates to NULL if it returns zero rows.

pattern_quiz:
  prompt: What SQL clause ensures that duplicate tied values are collapsed before applying LIMIT and OFFSET?
  options:
    - "DISTINCT"
    - "UNIQUE"
    - "GROUP"
    - "HAVING"
  answer: 0
  explanation: >-
    `SELECT DISTINCT salary` eliminates duplicates, ensuring OFFSET 1 steps over all tied 1st-place salaries.

