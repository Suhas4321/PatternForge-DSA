drills:
  - title: Strategy handler interface
    skill: setup
    goal: Create a strategy class with a single formatting method.
    instructions: |
      Implement `UpperStrategy` with method `format(val: str) -> str` that returns `val.upper()`.
    function:
      name: test_upper_strat
      params: [{name: val}]
    starter_code: |
      class Solution:
          def test_upper_strat(self, val: str) -> str:
              pass
    tests:
      - {args: ["hello"], expected: "HELLO"}
      - {args: ["abc"], expected: "ABC"}
    solution: |
      class UpperStrategy:
          def format(self, val: str) -> str:
              return val.upper()

      class Solution:
          def test_upper_strat(self, val: str) -> str:
              return UpperStrategy().format(val)
    hint: "Implement UpperStrategy with def format(self, val): return val.upper()."

  - title: Strategy registry dictionary
    skill: core
    goal: Retrieve a strategy object by key from a registry.
    instructions: |
      Given a key `"double"` or `"triple"`, return `x * 2` or `x * 3` using a registry dictionary.
    function:
      name: apply_op
      params: [{name: key}, {name: x}]
    starter_code: |
      class Solution:
          def apply_op(self, key: str, x: int) -> int:
              pass
    tests:
      - {args: ["double", 10], expected: 20}
      - {args: ["triple", 5], expected: 15}
    solution: |
      class Solution:
          def apply_op(self, key: str, x: int) -> int:
              registry = {
                  "double": lambda v: v * 2,
                  "triple": lambda v: v * 3,
              }
              return registry[key](x)
    hint: "Use a dictionary mapping string keys to callable operations."

  - title: Defensive fallback for missing key
    skill: edge
    goal: Handle unknown keys gracefully with default error dictionary.
    instructions: |
      If `key` is in `registry`, call it with `x`. Otherwise return `{"error": f"Missing {key}"}`.
    function:
      name: safe_lookup
      params: [{name: key}, {name: x}]
    starter_code: |
      class Solution:
          def safe_lookup(self, key: str, x: int) -> dict:
              pass
    tests:
      - {args: ["add1", 5], expected: {"result": 6}}
      - {args: ["missing", 5], expected: {"error": "Missing missing"}}
    solution: |
      class Solution:
          def safe_lookup(self, key: str, x: int) -> dict:
              registry = {"add1": lambda v: {"result": v + 1}}
              if key in registry:
                  return registry[key](x)
              return {"error": f"Missing {key}"}
    hint: "Check `if key in registry:` before lookup."

hints:
  - "Create three handler classes: `OpenAIHandler`, `AnthropicHandler`, and `GeminiHandler`."
  - "Give each class a method `format(prompt: str, max_tokens: int) -> dict`."
  - "Store instances in a dictionary: `REGISTRY = {'openai': OpenAIHandler(), ...}`."

solution:
  code: |
    class OpenAIHandler:
        def format(self, prompt: str, max_tokens: int) -> dict:
            return {
                "model": "gpt-4o",
                "messages": [{"role": "user", "content": prompt}],
                "max_tokens": max_tokens,
            }

    class AnthropicHandler:
        def format(self, prompt: str, max_tokens: int) -> dict:
            return {
                "model": "claude-3-5",
                "prompt": prompt,
                "max_tokens_to_sample": max_tokens,
            }

    class GeminiHandler:
        def format(self, prompt: str, max_tokens: int) -> dict:
            return {
                "contents": [{"parts": [{"text": prompt}]}],
                "generationConfig": {"maxOutputTokens": max_tokens},
            }

    class Solution:
        def execute_provider_pipeline(self, requests: list[dict]) -> list[dict]:
            registry = {
                "openai": OpenAIHandler(),
                "anthropic": AnthropicHandler(),
                "gemini": GeminiHandler(),
            }
            results = []
            for req in requests:
                provider = req.get("provider")
                prompt = req.get("prompt", "")
                max_tokens = req.get("max_tokens", 100)
                if provider in registry:
                    results.append(registry[provider].format(prompt, max_tokens))
                else:
                    results.append({"error": f"Unknown provider: {provider}"})
            return results
  explanation: |
    By refactoring into the Strategy pattern, each provider's formatting rules are cleanly isolated
    within its own class (Single Responsibility).
    
    Adding a new provider like DeepSeek or Mistral simply requires adding `DeepSeekHandler` and registering it
    in the `registry` dictionary. The core loop in `execute_provider_pipeline` never requires modification (Open/Closed).
  time: O(N) where N is number of requests
  space: O(N) for formatted payload dictionaries

pitch_script: |
  **(Clarify)** "We need to refactor a multi-provider LLM payload builder away from nested if/elif ladders and into clean SOLID Strategy classes."

  **(Basement Insight)** "Monolithic if/elif trees violate both the Single Responsibility and Open/Closed Principles. Adding or changing a provider modifies the same core function, causing regression hazards and increasing cyclomatic complexity."

  **(Solution)** "We implement dedicated strategy classes (`OpenAIHandler`, `AnthropicHandler`, `GeminiHandler`) conforming to a unified `format(prompt, max_tokens)` contract, registered inside a strategy dictionary. The dispatch loop looks up the handler in O(1) time and delegates execution."

  **(Complexity)** "Runs in O(N) time across N requests, using O(N) space for the resulting payloads."

twist:
  lc: 9214
  title: Dynamic Plugin Discovery via Entry Points or Decorator Registration
  why: >-
    Instead of hardcoding the registry in source code, use a @register_provider('name') decorator
    so third-party extensions can register themselves automatically at module import time.

