drills:
  - title: Validate recognized topic
    skill: setup
    goal: Check if topic is in allowed set.
    instructions: |
      Return `topic in {"dynamodb_migration", "drizz_async", "gepa_prompt", "fitlabs_vton"}`.
    function:
      name: is_valid_topic
      params: [{name: topic}]
    starter_code: |
      class Solution:
          def is_valid_topic(self, topic: str) -> bool:
              pass
    tests:
      - {args: ["dynamodb_migration"], expected: true}
      - {args: ["unknown_topic"], expected: false}
    solution: |
      class Solution:
          def is_valid_topic(self, topic: str) -> bool:
              return topic in {"dynamodb_migration", "drizz_async", "gepa_prompt", "fitlabs_vton"}
    hint: "Use `return topic in {...}`."

  - title: Metric claim threshold
    skill: core
    goal: Verify claimed number exceeds minimum requirement.
    instructions: |
      Return `claims.get(key, 0) >= min_val`.
    function:
      name: verify_metric
      params: [{name: claims}, {name: key}, {name: min_val}]
    starter_code: |
      class Solution:
          def verify_metric(self, claims: dict, key: str, min_val: int) -> bool:
              pass
    tests:
      - {args: [{"boost": 25}, "boost", 20], expected: true}
      - {args: [{}, "boost", 20], expected: false}
    solution: |
      class Solution:
          def verify_metric(self, claims: dict, key: str, min_val: int) -> bool:
              return claims.get(key, 0) >= min_val
    hint: "Check claims.get(key, 0) >= min_val."

  - title: Dict key equality
    skill: edge
    goal: Return True if answers.get(k) == expected.
    instructions: |
      Return `answers.get(k) == expected`.
    function:
      name: check_answer
      params: [{name: answers}, {name: k}, {name: expected}]
    starter_code: |
      class Solution:
          def check_answer(self, answers: dict, k: str, expected: str) -> bool:
              pass
    tests:
      - {args: [{"engine": "postgres"}, "engine", "postgres"], expected: true}
    solution: |
      class Solution:
          def check_answer(self, answers: dict, k: str, expected: str) -> bool:
              return answers.get(k) == expected
    hint: "Return answers.get(k) == expected."

hints:
  - "First check `if topic not in {'dynamodb_migration', 'drizz_async', 'gepa_prompt', 'fitlabs_vton'}:` and return score 0 REJECT."
  - "Evaluate the topic-specific requirements: check metric thresholds in `claims` and architectural keys in `architectural_answers`."
  - "If all criteria pass, return score 100 STRONG_HIRE, otherwise return score 40 LEAN_NO_HIRE."

solution:
  code: |
    class Solution:
        def evaluate_resume_defense(self, defense_submission: dict) -> dict:
            topic = defense_submission.get("topic")
            valid_topics = {"dynamodb_migration", "drizz_async", "gepa_prompt", "fitlabs_vton"}

            if topic not in valid_topics:
                return {
                    "verified": False,
                    "score": 0,
                    "verdict": "REJECT",
                    "feedback": f"Unknown resume project topic '{topic}'",
                }

            claims = defense_submission.get("claims") or {}
            answers = defense_submission.get("architectural_answers") or {}

            passed = False
            if topic == "dynamodb_migration":
                passed = (
                    claims.get("latency_reduction_pct", 0) >= 80 and
                    answers.get("storage_engine") == "postgresql" and
                    answers.get("index_strategy") == "composite_btree" and
                    answers.get("connection_pooler") == "pgbouncer"
                )
            elif topic == "drizz_async":
                passed = (
                    claims.get("concurrency_boost", 0) >= 20 and
                    answers.get("concurrency_primitive") == "asyncio_semaphore" and
                    answers.get("max_workers") == 25
                )
            elif topic == "gepa_prompt":
                passed = (
                    claims.get("cost_reduction_pct", 0) >= 60 and
                    answers.get("optimizer") == "genetic_algorithm" and
                    answers.get("objective") == "accuracy_minus_token_penalty"
                )
            elif topic == "fitlabs_vton":
                passed = (
                    answers.get("polling_pattern") == "http_202_accepted" and
                    answers.get("stampede_protection") == "single_flight_lock"
                )

            if passed:
                return {
                    "verified": True,
                    "score": 100,
                    "verdict": "STRONG_HIRE",
                    "feedback": "Architectural defenses, trade-offs, and quantitative metrics rigorously verified",
                }
            else:
                return {
                    "verified": False,
                    "score": 40,
                    "verdict": "LEAN_NO_HIRE",
                    "feedback": "Superficial defense: missing critical trade-offs or unverified metric claims",
                }
  explanation: |
    The evaluator applies strict rubrics based on real-world engineering trade-offs:
    verifying that candidates understand the physical constraints of their systems
    (e.g., PostgreSQL connection pooling via PgBouncer, concurrency limits on external APIs, and cache stampede locks).
  time: O(1) dictionary checks
  space: O(1)

pitch_script: |
  **(Clarify)** "We need to evaluate a candidate's resume defense against technical project rubrics, scoring the rigor of their architectural choices and trade-offs."

  **(Basement Insight)** "Claiming big performance wins without knowing the underlying mechanics—like mentioning PostgreSQL without knowing why PgBouncer is necessary—signals superficial understanding. Senior engineers must defend both the quantitative win and the physical constraints."

  **(Solution)** "We validate the project topic against known resume domains. Next, we check specific metric thresholds (such as 80%+ latency reduction or 20x concurrency boost) alongside required architectural design choices. If all pass, we award STRONG_HIRE (100); otherwise LEAN_NO_HIRE (40)."

  **(Complexity)** "Executes in O(1) time and space."

