slug: rag-text-chunker-with-overlap
lc: 9606
citadel_id: ai_resume
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: Why do naive sentence splits ruin RAG retrieval quality? If an embedding model has an 8192-token context
    limit, splitting documents into fixed non-overlapping chunks frequently severs sentences in half, stranding subjects from
    verbs across chunk boundaries. Sliding window chunking with character or token overlap guarantees semantic continuity.
  brute_force: Arbitrary non-overlapping string slicing that cuts critical definitions in half, producing orphaned phrases
    with degraded embedding fidelity.
  brute_force_complexity: Loss of semantic context at boundary cut points.
  key_insight: Advancing chunk start positions by (chunk_size - chunk_overlap) ensures that facts located near boundaries
    appear completely in at least one retrieved chunk.
  real_world: LangChain CharacterTextSplitter, LlamaIndex TokenChunker, and WisdomBot aerospace document ingestion pipeline.
statement:
  clean: "Implement a deterministic text chunker with sliding window overlap and metadata:\n`chunk_document(self, doc_id:\
    \ str, text: str, chunk_size: int, chunk_overlap: int) -> list[dict]`.\n\nGiven:\n- `doc_id`: unique document identifier\
    \ string\n- `text`: document text string\n- `chunk_size`: maximum characters per chunk (`chunk_size >= 1`)\n- `chunk_overlap`:\
    \ character overlap between consecutive chunks (`0 <= chunk_overlap < chunk_size`)\n\nChunking Rules:\n1. If `text` is\
    \ empty, return `[]`.\n2. If `chunk_size <= 0` or `chunk_overlap < 0` or `chunk_overlap >= chunk_size`, return `[]`.\n\
    3. The step advance between consecutive chunk start positions is `step = chunk_size - chunk_overlap`.\n4. Iterate `start`\
    \ from `0` with increment `step`:\n   - `end = min(start + chunk_size, len(text))`\n   - `chunk_str = text[start:end]`\n\
    \   - `chunk_id = f'{doc_id}_c{chunk_index}'` (0-indexed `chunk_index`)\n   - Metadata payload:\n     `{'chunk_id': chunk_id,\
    \ 'doc_id': doc_id, 'chunk_index': chunk_index, 'start_char': start, 'end_char': end, 'char_count': len(chunk_str), 'text':\
    \ chunk_str}`\n   - If `end >= len(text)`, stop iteration.\n5. Return list of chunk metadata dictionaries."
  oa_story: '**WisdomBot Knowledge Base — Technical Manual Ingestion Pipeline**


    WisdomBot''s enterprise RAG pipeline ingests 500-page aircraft maintenance manuals. Early pilots suffered retrieval failures
    when technician prompts searched for valve torque specs: the specification number was on line 50 and the torque value
    on line 51, split squarely across non-overlapping chunk boundaries.


    The search engineering team added sliding window chunking with an overlap buffer and coordinate metadata (`start_char`,
    `end_char`). Implement this deterministic text chunker.'
  trigger_keywords:
  - deterministic text chunker with sliding window overlap
  - chunk_document
  - chunk_id
  examples:
  - input: doc_id = 'doc_001', text = 'abcdefghijklmnopqrstuvwxyz', chunk_size = 10, chunk_overlap = 3
    output: '[{''chunk_id'': ''doc_001_c0'', ''doc_id'': ''doc_001'', ''chunk_index'': 0, ''start_char'': 0, ''end_char'':
      10, ''char_count'': 10, ''text'': ''abcdefghij''}, {''chunk_id'': ''doc_001_c1'', ''doc_id'': ''doc_001'', ''chunk_index'':
      1, ''start_char'': 7, ''end_char'': 17, ''char_count'': 10, ''text'': ''hijklmnopq''}, {''chunk_id'': ''doc_001_c2'',
      ''doc_id'': ''doc_001'', ''chunk_index'': 2, ''start_char'': 14, ''end_char'': 24, ''char_count'': 10, ''text'': ''opqrstuvwx''},
      {''chunk_id'': ''doc_001_c3'', ''doc_id'': ''doc_001'', ''chunk_index'': 3, ''start_char'': 21, ''end_char'': 26, ''char_count'':
      5, ''text'': ''vwxyz''}]'
    explanation: Chunks advance with step 10 - 3 = 7 characters until end of string.
  constraints:
  - 0 <= len(text) <= 10^5
  - 1 <= chunk_size <= 2000
  - 0 <= chunk_overlap < chunk_size
constraint_quiz:
  prompt: What happens if chunk_overlap is equal to or greater than chunk_size?
  options:
  - The step size becomes zero or negative, creating an infinite loop that produces infinite identical chunks
  - The text is automatically translated to Spanish
  - The embedding model doubles its vector dimensions
  - The database automatically creates a B-Tree index
  answer: 0
  explanation: Because step = chunk_size - chunk_overlap, if overlap >= size, step <= 0, causing the sliding window pointer
    to stall or move backwards forever.
pattern_quiz:
  prompt: Why do production RAG pipelines inject start_char and end_char coordinate metadata into every chunk?
  options:
  - To enable accurate UI passage highlighting and exact quote verification in the source document viewer
  - To compress the text using Huffman encoding
  - To convert ASCII strings to Unicode UTF-32
  - To sort the chunks alphabetically
  answer: 0
  explanation: Recording exact character offsets allows frontend interfaces (like PDF viewers) to highlight the exact grounding
    passage supporting an LLM answer.
