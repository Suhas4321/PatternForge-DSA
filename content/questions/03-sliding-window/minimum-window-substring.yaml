slug: minimum-window-substring
lc: 76

concept:
  problem_it_solves: >-
    "What is the shortest stretch of s that contains everything t asks for, duplicates
    included?" Coverage only gets easier as a window grows and harder as it shrinks. So you
    grow the right end until the window covers t, then squeeze the left end for as long as
    it still covers t, recording the smallest valid window you pass through.
  brute_force: >-
    For every start i, extend j until s[i..j] covers t, checking coverage by comparing counts
    for every distinct character of t, and keep the shortest. Every new start rebuilds its
    counts from scratch and re-scans characters the previous start already counted, and the
    coverage check itself repeats work after every single character.
  brute_force_complexity: >-
    O(m² · Σ) time, O(Σ) space, where Σ is the number of distinct characters in t (at most
    52) — m = 10⁵ means ~5 × 10⁹ extensions before the coverage checks.
  key_insight: >-
    Two ideas. First, the window only needs two moves: expand r until valid, then shrink l
    while still valid, and both pointers only ever move right, so the work is O(m + n).
    Second, don't re-check coverage character by character. Keep `formed`, the number of
    distinct characters of t whose required count the window currently meets. It goes up
    exactly when a count reaches its requirement (window[c] == need[c]) and down exactly when
    a count drops below it (window[c] < need[c]). The window is valid precisely when
    formed == required, an O(1) test.
  real_world: >-
    Search engines build result snippets by finding the shortest passage of a document that
    contains every query term (Elasticsearch highlighters do a version of this). Log and
    trace tools look for the tightest time range containing all the events of an incident,
    and genomics pipelines search reads for the shortest region containing a required set of
    markers.

statement:
  clean: |
    Given two strings `s` and `t` of lengths `m` and `n` respectively, return the
    **minimum window** substring of `s` such that every character in `t`
    (**including duplicates**) is included in the window. If there is no such substring, return the **empty string**
    `""`.

    The test cases are generated so that the answer is **unique**. Uppercase and lowercase
    letters are different characters.
  oa_story: |
    **DhabaDirect Food Tech — OA Round 3**

    DhabaDirect powers the kitchen displays of highway dhabas on the Bengaluru–Tumakuru
    stretch. Every dish that leaves the pass is logged as one letter, in order, so a
    kitchen's day is one long string. Uppercase letters are full plates and lowercase are
    half plates, so `P` and `p` are different dishes.

    For a big family order, operations has the combo as a string of dish letters, and a dish
    can appear more than once (two butter naan, one dal). They want the shortest unbroken
    stretch of the dispatch log during which the kitchen sent out at least every dish in the
    combo, with the right quantities, to estimate the fastest the combo could have been
    assembled. Return that stretch of the log exactly as logged. If the combo was never fully
    covered on that day, return an empty string. Logs and combos can each have up to
    100,000 entries.
  trigger_keywords: ["minimum window", "including duplicates", "empty string"]
  examples:
    - input: "s = \"ADOBECODEBANC\", t = \"ABC\""
      output: "\"BANC\""
      explanation: "The minimum window substring \"BANC\" includes 'A', 'B', and 'C' from string t."
    - input: "s = \"a\", t = \"a\""
      output: "\"a\""
      explanation: "The entire string s is the minimum window."
    - input: "s = \"a\", t = \"aa\""
      output: "\"\""
      explanation: "Both 'a's from t must be included in the window. Since s has only one 'a', return the empty string."
  constraints:
    - "m == s.length"
    - "n == t.length"
    - "1 <= m, n <= 10^5"
    - "s and t consist of uppercase and lowercase English letters."

constraint_quiz:
  prompt: >-
    s and t can each have 10⁵ characters, and the follow-up asks for an algorithm that runs
    in O(m + n). What should you aim for?
  options: ["O(m² · n)", "O(m²)", "O(m log m · 52)", "O(m + n)"]
  answer: 3
  explanation: >-
    O(m² · n) re-checks coverage against t for every substring, astronomically slow. O(m²)
    is ~5 × 10⁹ for m = 10⁵. Binary searching on the window length with a fixed-window
    coverage check works (coverage is monotone in length) and is O(m log m · 52), but it is
    slower and more code than needed. Expand/shrink with a `formed` counter touches each
    character of s at most twice and reads t once: O(m + n).

pattern_quiz:
  prompt: >-
    You want the shortest contiguous part of s that contains all of t's characters with
    multiplicity. Which pattern fits?
  options:
    - "Fixed-size sliding window of length len(t)"
    - "Variable window: expand until it covers t, shrink while it still does, with need/have counts"
    - "Prefix sums + hash map of counts"
    - "Two pointers moving inward from both ends of s"
  answer: 1
  explanation: >-
    "Minimum window" with a "contains everything" condition is the shrinking variable-window
    trigger. Unlike the "longest" windows earlier in this world, you record the answer while
    the window is valid and keep shrinking to beat it. A fixed window of length len(t) only
    works when the answer has no extra characters, which "BANC" for "ABC" already
    disproves. Inward two pointers can't tell which end to move.

