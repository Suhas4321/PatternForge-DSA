drills:
- skill: setup
  title: Check method idempotency
  goal: Verify if an HTTP method is inherently idempotent.
  instructions: Return `True` if method is in GET, HEAD, PUT, DELETE.
  function:
    name: drill_is_idempotent_verb
    params:
    - name: method
  starter_code: "class Solution:\n    def drill_is_idempotent_verb(self, method: str) -> bool:\n        pass\n"
  tests:
  - args:
    - GET
    expected: true
  - args:
    - POST
    expected: false
  solution: "class Solution:\n    def drill_is_idempotent_verb(self, method: str) -> bool:\n        return method.upper()\
    \ in [\"GET\", \"HEAD\", \"PUT\", \"DELETE\"]\n"
  hint: Check `method.upper() in ['GET', 'HEAD', 'PUT', 'DELETE']`.
- skill: core
  title: Detect payload conflict
  goal: Compare incoming payload with stored payload.
  instructions: Return `True` if stored != incoming, else `False`.
  function:
    name: drill_is_mismatch
    params:
    - name: stored
    - name: incoming
  starter_code: "class Solution:\n    def drill_is_mismatch(self, stored: dict, incoming: dict) -> bool:\n        pass\n"
  tests:
  - args:
    - a: 1
    - a: 2
    expected: true
  - args:
    - a: 1
    - a: 1
    expected: false
  solution: "class Solution:\n    def drill_is_mismatch(self, stored: dict, incoming: dict) -> bool:\n        return stored\
    \ != incoming\n"
  hint: Return stored != incoming.
- skill: edge
  title: Cache new order response
  goal: Write payload and response to key store.
  instructions: 'Set `store[key] = {''payload'': payload, ''response'': resp}` and return `store`.'
  function:
    name: drill_save_key
    params:
    - name: store
    - name: key
    - name: payload
    - name: resp
  starter_code: "class Solution:\n    def drill_save_key(self, store: dict, key: str, payload: dict, resp: dict) -> dict:\n\
    \        pass\n"
  tests:
  - args:
    - {}
    - k1
    - x: 1
    - ok: true
    expected:
      k1:
        payload:
          x: 1
        response:
          ok: true
  solution: "class Solution:\n    def drill_save_key(self, store: dict, key: str, payload: dict, resp: dict) -> dict:\n  \
    \      store[key] = {\"payload\": payload, \"response\": resp}\n        return store\n"
  hint: Assign to store[key].
hints:
- Check inherently idempotent methods (`GET`, `PUT`, `DELETE`) first.
- For `POST`/`PATCH`, check for `None` key, then lookup in `store` to compare payloads.
- '| # Pseudocode Blueprint

  | if method in [GET, HEAD, PUT, DELETE]: return 200, idempotent = True

  | if not key: return 400 missing header

  | if key in store:

  |     if store[key].payload == payload: return 200, cached = True

  |     else: return 422 conflict

  | resp = {"order_id": ...}

  | store[key] = {payload, resp}

  | return 201, cached = False'
solution:
  code: "class Solution:\n    def handle_idempotent_request(self, method: str, idempotency_key: str | None, payload: dict,\
    \ store: dict) -> dict:\n        method = method.upper()\n        if method in [\"GET\", \"HEAD\", \"PUT\", \"DELETE\"\
    ]:\n            return {\n                \"status_code\": 200,\n                \"cached\": False,\n                \"\
    idempotent\": True,\n                \"response\": {\"action\": f\"{method}_success\"},\n            }\n\n        if method\
    \ in [\"POST\", \"PATCH\"]:\n            if not idempotency_key:\n                return {\n                    \"status_code\"\
    : 400,\n                    \"cached\": False,\n                    \"idempotent\": False,\n                    \"error\"\
    : \"Missing Idempotency-Key header\",\n                }\n\n            if idempotency_key in store:\n               \
    \ entry = store[idempotency_key]\n                if entry[\"payload\"] == payload:\n                    return {\n  \
    \                      \"status_code\": 200,\n                        \"cached\": True,\n                        \"idempotent\"\
    : True,\n                        \"response\": entry[\"response\"],\n                    }\n                else:\n  \
    \                  return {\n                        \"status_code\": 422,\n                        \"cached\": False,\n\
    \                        \"idempotent\": False,\n                        \"error\": \"Idempotency key payload mismatch\
    \ conflict\",\n                    }\n\n            created_response = {\"order_id\": f\"ORD_{idempotency_key[:6]}\",\
    \ \"status\": \"CONFIRMED\"}\n            store[idempotency_key] = {\"payload\": payload, \"response\": created_response}\n\
    \            return {\n                \"status_code\": 201,\n                \"cached\": False,\n                \"idempotent\"\
    : True,\n                \"response\": created_response,\n            }\n\n        return {\"status_code\": 405, \"cached\"\
    : False, \"idempotent\": False, \"error\": \"Method Not Allowed\"}\n"
  explanation: 'Idempotent HTTP methods return immediately without side effects. For mutating requests, checking the idempotency
    key in an atomic store enables safe deduplication: identical requests return the cached HTTP 200 response, conflicting
    payloads are rejected with HTTP 422, and first-time requests commit with HTTP 201.'
  time: O(1) dictionary key lookup and payload comparison
  space: O(K) where K is the number of stored idempotency keys
pitch_script: '**(Clarify)** "We need to design an idempotency store that safely executes non-idempotent HTTP methods (POST,
  PATCH) while replaying cached responses on identical retries."


  **(Brute force)** "Executing every request directly causes double charges and duplicate resource creation when network retries
  occur."


  **(Trigger)** "Distinguishing HTTP method idempotency and matching Idempotency-Key headers signals an idempotent request
  router."


  **(Optimal)** "GET, PUT, and DELETE return immediately as inherently idempotent. For POST and PATCH, we require an Idempotency-Key
  header. If the key exists with an identical payload, we return the cached response with 200 OK. If the payload differs,
  we reject with 422 Unprocessable Entity. A new key records the transaction and returns 201 Created."


  **(Complexity)** "Executes in O(1) time and O(K) storage space." '
