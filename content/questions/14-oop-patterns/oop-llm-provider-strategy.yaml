hints:
- Define concrete strategy classes implementing generate(prompt, config).
- Store strategy instances in a dictionary keyed by lowercase provider name.
- 'If provider not in dict, return {''error'': f''Unsupported provider: {provider}''}.'
solution:
  code: "from abc import ABC, abstractmethod\n\nclass LLMProviderStrategy(ABC):\n    @abstractmethod\n    def generate(self,\
    \ prompt: str, config: dict) -> dict:\n        pass\n\nclass OpenAIStrategy(LLMProviderStrategy):\n    def generate(self,\
    \ prompt: str, config: dict) -> dict:\n        model = config.get(\"model\", \"gpt-4o\")\n        return {\n         \
    \   \"provider\": \"openai\",\n            \"model\": model,\n            \"tokens\": len(prompt.split()) + 20,\n    \
    \        \"response\": f\"OpenAI: {prompt}\",\n        }\n\nclass AnthropicStrategy(LLMProviderStrategy):\n    def generate(self,\
    \ prompt: str, config: dict) -> dict:\n        model = config.get(\"model\", \"claude-3-5-sonnet\")\n        return {\n\
    \            \"provider\": \"anthropic\",\n            \"model\": model,\n            \"tokens\": len(prompt.split())\
    \ + 25,\n            \"response\": f\"Anthropic: {prompt}\",\n        }\n\nclass OllamaStrategy(LLMProviderStrategy):\n\
    \    def generate(self, prompt: str, config: dict) -> dict:\n        model = config.get(\"model\", \"llama3\")\n     \
    \   return {\n            \"provider\": \"ollama\",\n            \"model\": model,\n            \"tokens\": len(prompt.split())\
    \ + 15,\n            \"response\": f\"Ollama: {prompt}\",\n        }\n\nclass Solution:\n    def dispatch_llm_strategy(self,\
    \ provider: str, prompt: str, model_config: dict = None) -> dict:\n        config = model_config or {}\n        strategies\
    \ = {\n            \"openai\": OpenAIStrategy(),\n            \"anthropic\": AnthropicStrategy(),\n            \"ollama\"\
    : OllamaStrategy(),\n        }\n        strat = strategies.get(provider.lower())\n        if not strat:\n            return\
    \ {\"error\": f\"Unsupported provider: {provider}\"}\n        return strat.generate(prompt, config)\n"
  explanation: Decouples provider-specific request formats into isolated Strategy classes behind a uniform generate() interface.
  time: O(W) where W is the word count of the prompt
  space: O(1) constant auxiliary space
pitch_script: '**(Clarify)** "We need to structure an LLM inference dispatcher using the Strategy design pattern to support
  multiple AI vendors."


  **(Basement Insight)** "Embedding provider-specific logic directly in controllers violates the Open-Closed Principle. The
  Strategy pattern encapsulates each vendor into its own class behind a common contract."


  **(Solution)** "We define an abstract base strategy with a generate method. Concrete classes implement OpenAI, Anthropic,
  and Ollama execution. A dictionary dispatcher resolves the provider at runtime."


  **(Complexity)** "Executes in O(W) time for string tokenization and O(1) space."

  '
