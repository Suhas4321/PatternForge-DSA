slug: edit-distance
lc: 72

concept:
  problem_it_solves: >-
    "What is the cheapest way to turn this string into that one?" Every spell checker, fuzzy
    search and DNA aligner needs that number. Trying edit sequences directly is hopeless, but
    the cheapest way to fix the *last* character only depends on the cheapest way to fix
    shorter prefixes, so a table over pairs of prefixes answers it exactly.
  brute_force: >-
    Recurse on positions i in word1 and j in word2: if the characters match, move both on for
    free; otherwise try all three operations (insert, delete, replace), each costing 1, and
    keep the cheapest. Every mismatch branches three ways, and the same (i, j) pair is reached
    through many different orders of edits ("delete then insert" and "insert then delete" land
    in the same place), so the same subproblem is solved over and over.
  brute_force_complexity: >-
    Exponential time (up to about 3^(m+n) calls on strings with no matches), O(m + n) recursion
    depth — two 500-character words would never finish.
  key_insight: >-
    Let dp[i][j] be the fewest operations to turn the first i characters of word1 into the
    first j characters of word2. Decide only what happens to the last characters. If
    word1[i − 1] == word2[j − 1], they're already fine: dp[i − 1][j − 1]. Otherwise you pay 1
    for exactly one of three last moves, and each is one neighbouring cell: **delete**
    word1[i − 1] → dp[i − 1][j] (up), **insert** word2[j − 1] → dp[i][j − 1] (left),
    **replace** word1[i − 1] with word2[j − 1] → dp[i − 1][j − 1] (diagonal). The empty-prefix
    row and column are the base cases: turning i characters into nothing takes i deletes, and
    nothing into j characters takes j inserts.
  real_world: >-
    Autocorrect and "did you mean?" ranking use Levenshtein distance (often with keyboard-aware
    costs). Elasticsearch and Lucene's `fuzziness` option match terms within edit distance 1 or 2
    using Levenshtein automata, KYC and dedup pipelines at banks compare names like "Suhas K"
    and "Suhaas K" with it, and bioinformatics aligns DNA with the same table plus custom
    scores.

statement:
  clean: |
    Given two strings `word1` and `word2`, return the **minimum number of operations** required
    to **convert word1 to word2**.

    You have the following three operations permitted on a word:

    - **Insert** a character
    - **Delete** a character
    - **Replace** a character
  oa_story: |
    **TypoTamer Search — OA Round 1**

    TypoTamer builds the search bar for a quick-commerce app that delivers groceries across
    Bengaluru in ten minutes. Users type fast on crowded buses, so queries like `"biryni"` or
    `"panner"` arrive constantly. To rank suggestions, the ranking service needs a typo score
    for each (query, product name) pair: the fewest single-keystroke fixes that turn the query
    `word1` into the product name `word2`.

    A single fix is one of: type a missing character anywhere, remove one character, or
    overwrite one character with a different one. Each fix costs 1. Return the smallest total
    cost. Queries and product names are lowercase, each up to 500 characters long, and either
    one may be empty.
  trigger_keywords: ["minimum number of operations", "convert word1 to word2"]
  examples:
    - input: "word1 = \"horse\", word2 = \"ros\""
      output: "3"
      explanation: "horse → rorse (replace 'h' with 'r') → rose (delete 'r') → ros (delete 'e')."
    - input: "word1 = \"intention\", word2 = \"execution\""
      output: "5"
      explanation: "intention → inention (delete 't') → enention (replace 'i' with 'e') → exention (replace 'n' with 'x') → exection (replace 'n' with 'c') → execution (insert 'u')."
  constraints:
    - "0 <= word1.length, word2.length <= 500"
    - "word1 and word2 consist of lowercase English letters."

constraint_quiz:
  prompt: Both words can be up to 500 characters. What complexity should you aim for?
  options:
    - "O(3^(m+n)): try every sequence of operations"
    - "O(m · n): one table cell per pair of prefixes"
    - "O(m + n): walk both strings with two pointers and fix mismatches greedily"
    - "O(m · n · (m + n)): for each pair of prefixes, try every split point"
  answer: 1
  explanation: >-
    Every edit sequence is exponential. m · n = 2.5 × 10⁵ cells with O(1) work each is
    instant. A greedy two-pointer walk has to guess whether a mismatch is an insert, a delete
    or a replace, and the right guess depends on characters far ahead ("abc" → "yabd" wants an
    insert first, not three replaces), so it can be wrong. Trying split points adds a factor
    you don't need, since each cell depends on just three neighbours.

pattern_quiz:
  prompt: >-
    Two strings, three edit operations of cost 1, and you want the minimum total. Which pattern
    fits?
  options:
    - "BFS over all strings reachable by one edit at a time"
    - "Two-string DP: dp[i][j] over prefixes, each operation is one neighbouring cell"
    - "Longest common substring, then edit the rest"
    - "Sort both strings and count the differences"
  answer: 1
  explanation: >-
    "Minimum operations to convert one string into another" is the two-string DP trigger: the
    state is a pair of prefix lengths, and the last operation is the last choice. BFS over
    strings is technically correct but the number of reachable strings explodes (26 letters at
    every position). A common substring ignores the cheaper ways to fix the rest, and sorting
    destroys the order that the edits depend on.

function:
  name: minDistance
  params: [{name: word1}, {name: word2}]

starter_code: |
  class Solution:
      def minDistance(self, word1: str, word2: str) -> int:
          pass

tests:
  - {args: ["horse", "ros"], expected: 3}
  - {args: ["intention", "execution"], expected: 5}
  - {args: ["", ""], expected: 0, note: both empty}
  - {args: ["", "abc"], expected: 3, note: "empty word1: insert everything (the base row)"}
  - {args: ["abc", ""], expected: 3, note: "empty word2: delete everything (the base column)"}
  - {args: ["abc", "abc"], expected: 0, note: identical strings}
  - {args: ["abc", "yabd"], expected: 2, note: "insert 'y', then replace 'c' with 'd'"}
  - {args: ["kitten", "sitting"], expected: 3}
  - {args: ["ab", "ba"], expected: 2, note: "two replaces; no swap operation exists"}
visualize_test: 0

drills:
  - title: The base row and column
    skill: setup
    goal: Build the (m + 1) × (n + 1) table with dp[i][0] = i and dp[0][j] = j.
    instructions: |
      Return the edit-distance table **before** any inner cell is filled: `len(word1) + 1` rows,
      `len(word2) + 1` columns, with `dp[i][0] = i`, `dp[0][j] = j`, and `0` everywhere else.

      These are the base cases, and each one has a meaning. `dp[i][0]`: turning the first `i`
      characters of word1 into the empty string needs exactly `i` deletes. `dp[0][j]`: turning
      the empty string into the first `j` characters of word2 needs exactly `j` inserts.
      Unlike LCS, the border is **not** all zeros, and leaving it at zero is the most common
      edit-distance bug.
    function:
      name: baseTable
      params: [{name: word1}, {name: word2}]
    starter_code: |
      class Solution:
          def baseTable(self, word1: str, word2: str) -> List[List[int]]:
              pass
    tests:
      - {args: ["ab", "abc"], expected: [[0, 1, 2, 3], [1, 0, 0, 0], [2, 0, 0, 0]]}
      - {args: ["", "ab"], expected: [[0, 1, 2]], note: only the base row}
      - {args: ["abc", ""], expected: [[0], [1], [2], [3]], note: only the base column}
      - {args: ["a", "b"], expected: [[0, 1], [1, 0]]}
    solution: |
      class Solution:
          def baseTable(self, word1: str, word2: str) -> List[List[int]]:
              m, n = len(word1), len(word2)
              dp = [[0] * (n + 1) for _ in range(m + 1)]
              for i in range(m + 1):
                  dp[i][0] = i
              for j in range(n + 1):
                  dp[0][j] = j
              return dp
    hint: "Two separate loops: one down column 0, one along row 0. dp[0][0] is 0 either way."

  - title: Three operations, three neighbours
    skill: core
    goal: Compute one cell from its last characters and its up, left and diagonal neighbours.
    instructions: |
      `a` is `word1[i - 1]`, `b` is `word2[j - 1]`, and `up`, `left`, `diag` are
      `dp[i - 1][j]`, `dp[i][j - 1]` and `dp[i - 1][j - 1]`. Return `dp[i][j]`.

      If `a == b`, the last characters already agree: `dp[i][j] = diag`, no cost. Otherwise
      the last move costs 1, and which neighbour you came from tells you what it was:

      - **up** (`dp[i - 1][j]`) = **delete** `a`: fix `word1[:i - 1]` into `word2[:j]`, then
        delete the extra character of word1.
      - **left** (`dp[i][j - 1]`) = **insert** `b`: fix `word1[:i]` into `word2[:j - 1]`, then
        append the missing character of word2.
      - **diag** (`dp[i - 1][j - 1]`) = **replace** `a` with `b`: fix both shorter prefixes,
        then overwrite the last character.

      Memory trick: an operation moves the index of the string whose character it uses up.
      Delete consumes a character of word1 (i − 1), insert produces one of word2 (j − 1), and
      replace does both.
    function:
      name: editCell
      params: [{name: a}, {name: b}, {name: up}, {name: left}, {name: diag}]
    starter_code: |
      class Solution:
          def editCell(self, a: str, b: str, up: int, left: int, diag: int) -> int:
              pass
    tests:
      - {args: ["s", "s", 1, 1, 1], expected: 1, note: "match: copy the diagonal for free"}
      - {args: ["r", "o", 1, 2, 1], expected: 2}
      - {args: ["a", "b", 0, 3, 3], expected: 1, note: "delete is cheapest (up)"}
      - {args: ["a", "b", 3, 0, 3], expected: 1, note: "insert is cheapest (left)"}
      - {args: ["a", "b", 2, 2, 0], expected: 1, note: "replace is cheapest (diagonal)"}
    solution: |
      class Solution:
          def editCell(self, a: str, b: str, up: int, left: int, diag: int) -> int:
              if a == b:
                  return diag
              return 1 + min(up, left, diag)
    hint: "A match costs nothing and needs only `diag`; a mismatch is 1 plus the cheapest neighbour."

  - title: Two rows, and the base column on every row
    skill: edge
    goal: Space-optimise to two rows while remembering that each new row starts with dp[i][0] = i.
    instructions: |
      Return the edit distance using only two rows of length `len(word2) + 1`: `prev` (row
      `i - 1`) and `cur` (row `i`).

      Each cell reads up (`prev[j]`), diagonal (`prev[j - 1]`) and left (`cur[j - 1]`), so two
      rows are enough. The edge case people miss: `cur[0]` is the base column, the cost of
      deleting all `i` characters, so every new row must start with `cur[0] = i`. Leave it at 0
      and `"abc"` vs `""` returns 0 instead of 3. Start with `prev = [0, 1, ..., n]`, the base
      row.
    function:
      name: minDistanceTwoRows
      params: [{name: word1}, {name: word2}]
    starter_code: |
      class Solution:
          def minDistanceTwoRows(self, word1: str, word2: str) -> int:
              pass
    tests:
      - {args: ["horse", "ros"], expected: 3}
      - {args: ["abc", ""], expected: 3, note: "the answer is cur[0] itself"}
      - {args: ["", "abc"], expected: 3, note: "no rows after the base row: the answer is prev[n]"}
      - {args: ["ab", "ba"], expected: 2}
      - {args: ["sunday", "saturday"], expected: 3}
    solution: |
      class Solution:
          def minDistanceTwoRows(self, word1: str, word2: str) -> int:
              n = len(word2)
              prev = list(range(n + 1))
              for i in range(1, len(word1) + 1):
                  cur = [i] + [0] * n
                  for j in range(1, n + 1):
                      if word1[i - 1] == word2[j - 1]:
                          cur[j] = prev[j - 1]
                      else:
                          cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])
                  prev = cur
              return prev[n]
    hint: "Build each row as `[i] + [0] * n`, not `[0] * (n + 1)`."

hints:
  - >-
    Look only at the last character of each word. If they're equal, do you need to touch them?
    If they're different, what are the only three things the very last operation could have
    been?
  - >-
    dp[i][j] = fewest operations to turn word1[:i] into word2[:j]. Equal last characters:
    dp[i − 1][j − 1]. Otherwise 1 + min(delete → dp[i − 1][j], insert → dp[i][j − 1], replace →
    dp[i − 1][j − 1]). The empty prefixes give dp[i][0] = i and dp[0][j] = j.
  - |
    m, n = lengths
    dp = (m + 1) x (n + 1) grid
    dp[i][0] = i for every i       (delete everything)
    dp[0][j] = j for every j       (insert everything)
    for i in 1..m:
        for j in 1..n:
            if word1[i - 1] == word2[j - 1]: dp[i][j] = dp[i - 1][j - 1]
            else: dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])
    return dp[m][n]

solution:
  code: |
    class Solution:
        def minDistance(self, word1: str, word2: str) -> int:
            m, n = len(word1), len(word2)
            # dp[i][j] = fewest operations to turn word1[:i] into word2[:j]
            dp = [[0] * (n + 1) for _ in range(m + 1)]
            for i in range(m + 1):
                dp[i][0] = i  # word1[:i] -> "": i deletes
            for j in range(n + 1):
                dp[0][j] = j  # "" -> word2[:j]: j inserts
            for i in range(1, m + 1):
                for j in range(1, n + 1):
                    if word1[i - 1] == word2[j - 1]:
                        dp[i][j] = dp[i - 1][j - 1]  # last characters already agree: free
                    else:
                        # up = delete word1[i - 1], left = insert word2[j - 1], diagonal = replace
                        dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])
            return dp[m][n]
  explanation: |
    **The 5-step DP recipe:**

    1. **Define dp in words.** `dp[i][j]` = the minimum number of operations to turn the first
       `i` characters of `word1` into the first `j` characters of `word2`.
    2. **Recurrence from the last choice.** Look at `word1[i - 1]` and `word2[j - 1]`.
       - **Equal:** leave them alone, `dp[i][j] = dp[i - 1][j - 1]`. This is always safe:
         neighbouring cells differ by at most 1, so neither other option can beat it.
       - **Different:** the last operation cost 1 and was one of three:
         - **Delete** `word1[i - 1]`: first turn `word1[:i - 1]` into `word2[:j]`, then remove
           the leftover character. Cost `dp[i - 1][j] + 1`, the cell **above**.
         - **Insert** `word2[j - 1]`: first turn `word1[:i]` into `word2[:j - 1]`, then append
           the missing character. Cost `dp[i][j - 1] + 1`, the cell to the **left**.
         - **Replace** `word1[i - 1]` with `word2[j - 1]`: turn both shorter prefixes into each
           other, then overwrite the last character. Cost `dp[i - 1][j - 1] + 1`, the
           **diagonal**.

         Take the minimum of the three. The rule of thumb: the index that shrinks belongs to
         the string whose character the operation used up.
    3. **Base cases.** `dp[i][0] = i` (delete all `i` characters) and `dp[0][j] = j` (insert
       all `j` characters). Unlike LCS, the border isn't zero.
    4. **Fill order.** Top to bottom, left to right, so up, left and diagonal are ready.
    5. **Answer location.** `dp[m][n]`, the bottom-right cell.

    In the visualizer, rows are labelled with `word1`'s characters and columns with `word2`'s.
    A green cell reading only its blue diagonal is a free match; reading all three blue
    neighbours is a paid edit.

    **Stepping stone and space.** The memoised recursion `dist(i, j)` with the same three
    branches has (m + 1)(n + 1) states. The table is the same thing bottom-up, and since every
    row reads only the row above plus its own left cell, two rows suffice (O(n) space), as
    long as each new row starts with `i` in column 0.
  time: O(m · n) — one O(1) cell per pair of prefixes, at most 501 × 501
  space: O(m · n) for the table; O(n) with two rolling rows
  brute_force_code: |
    class Solution:
        def minDistance(self, word1: str, word2: str) -> int:
            def dist(i, j):
                if i == len(word1):
                    return len(word2) - j  # insert the rest of word2
                if j == len(word2):
                    return len(word1) - i  # delete the rest of word1
                if word1[i] == word2[j]:
                    return dist(i + 1, j + 1)
                return 1 + min(dist(i + 1, j), dist(i, j + 1), dist(i + 1, j + 1))

            return dist(0, 0)

pitch_script: |
  **(Clarify)** "So insert, delete and replace each cost 1, there's no swap of adjacent
  characters, and either string can be empty? I return just the minimum count, not the
  sequence of edits?"

  **(Brute force)** "Recursively, if the current characters match I move both pointers;
  otherwise I try all three operations and take the cheapest plus one. That's exponential,
  because different orders of edits keep reaching the same pair of positions."

  **(Trigger)** "'Minimum operations to convert one string into another' is a two-string DP.
  The recursion only depends on how much of each string is left, so there are just m times n
  distinct subproblems."

  **(Optimal)** "dp of i, j is the cost to turn the first i characters of word1 into the first
  j of word2. The first column is i, since I delete everything, and the first row is j, since I
  insert everything. If the last characters match I copy the diagonal. If not, it's one plus
  the minimum of the cell above, which is a delete, the cell to the left, which is an insert,
  and the diagonal, which is a replace. The answer is the bottom-right cell."

  **(Complexity)** "O(m times n) time and space, at most about 250,000 cells. Each row only
  needs the previous row, so I can bring space down to O(n) with two rows, as long as each new
  row starts with i in column zero."

twist:
  lc: 583
  title: Delete Operation for Two Strings
  why: >-
    Now the only operation is deleting a character, from either string, and you want the
    minimum number of deletions to make them equal. Replace and insert are gone, so the diagonal
    is only used on a match (for free), and a mismatch is 1 + min(delete from word1 → up, delete
    from word2 → left). The base row and column are still j and i. Equivalently, the answer is
    m + n − 2 × LCS(word1, word2): everything outside the longest common subsequence gets
    deleted.

