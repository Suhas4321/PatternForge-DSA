  - {args: [[[2, 3], [2, 2], [3, 3], [1, 3], [5, 7], [2, 2], [4, 6]]], expected: [[1, 3], [4, 7]], note: duplicates and zero-length intervals}
  - {args: [[[0, 0], [0, 0]]], expected: [[0, 0]], note: identical points at zero}
visualize_test: 0

drills:
  - title: Sort by start, compare only neighbours
    skill: setup
    goal: Sort intervals by start and walk them comparing each one only with the previous one.
    instructions: |
      Return `True` if **any** two intervals share at least one point (touching counts), and
      `False` otherwise. The input is unsorted.

      After sorting by start you never need to compare all pairs. If interval `i` overlaps an
      earlier interval `j`, then interval `i - 1` starts somewhere between them, inside `j`, so
      an overlap would already show up between consecutive intervals. The first overlap is
      always between neighbours. This "sort, then only look back one step" loop is the
      skeleton of the full merge.
    function:
      name: hasOverlap
      params: [{name: intervals}]
    starter_code: |
      class Solution:
          def hasOverlap(self, intervals: List[List[int]]) -> bool:
              pass
    tests:
      - {args: [[[1, 3], [2, 6], [8, 10]]], expected: true}
      - {args: [[[1, 4], [4, 5]]], expected: true, note: touching counts}
      - {args: [[[5, 6], [1, 2], [3, 4]]], expected: false, note: unsorted and disjoint}
      - {args: [[[7, 9], [1, 2], [8, 8]]], expected: true, note: overlap only visible after sorting}
      - {args: [[[1, 2]]], expected: false}
    solution: |
      class Solution:
          def hasOverlap(self, intervals: List[List[int]]) -> bool:
              intervals = sorted(intervals, key=lambda iv: iv[0])
              for i in range(1, len(intervals)):
                  if intervals[i][0] <= intervals[i - 1][1]:
                      return True
              return False
    hint: "Sort with `key=lambda iv: iv[0]`, then compare `intervals[i][0]` with `intervals[i - 1][1]`."

  - title: Extend or append
    skill: core
    goal: Decide whether a new interval extends the last merged block or starts a new one.
    instructions: |
      You are given `last`, the last merged block, and `cur`, the next interval in start order
      (so `cur[0] >= last[0]`). Return the new tail of the merged list: either a single merged
      interval `[[a, b]]` or both intervals `[last, cur]`.

      This is the only decision in Merge Intervals. Two details: touching (`cur[0] == last[1]`)
      merges, and the new end is `max(last[1], cur[1])`, because `cur` might sit entirely
      inside `last`.
    function:
      name: absorb
      params: [{name: last}, {name: cur}]
    starter_code: |
      class Solution:
          def absorb(self, last: List[int], cur: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[1, 3], [2, 6]], expected: [[1, 6]]}
      - {args: [[1, 4], [4, 5]], expected: [[1, 5]], note: touching}
      - {args: [[1, 10], [2, 3]], expected: [[1, 10]], note: "contained: keep the bigger end"}
      - {args: [[1, 2], [3, 4]], expected: [[1, 2], [3, 4]], note: gap}
      - {args: [[1, 5], [1, 7]], expected: [[1, 7]], note: same start}
    solution: |
      class Solution:
          def absorb(self, last: List[int], cur: List[int]) -> List[List[int]]:
              if cur[0] <= last[1]:  # shares a point with the block
                  return [[last[0], max(last[1], cur[1])]]
              return [last, cur]
    hint: "Overlap test is `cur[0] <= last[1]`; the merged end is a `max`, not `cur[1]`."

  - title: Count blocks without losing the end
    skill: edge
    goal: Track only the running block end and count blocks, keeping the end correct for contained intervals.
    instructions: |
      Return **how many** blocks remain after merging, without building the merged list. The
      input is unsorted and may be empty.

      You only need one number of state: the end of the current block. The classic bug is
      `cur_end = end` on overlap instead of `cur_end = max(cur_end, end)`: with
      `[[1,10],[2,3],[4,5]]` that shrinks the block to end at 3, so `[4,5]` wrongly opens a
      second block.
    function:
      name: countMerged
      params: [{name: intervals}]
    starter_code: |
      class Solution:
          def countMerged(self, intervals: List[List[int]]) -> int:
              pass
    tests:
      - {args: [[[1, 10], [2, 3], [4, 5]]], expected: 1, note: "overwriting the end gives 2"}
      - {args: [[[1, 4], [4, 5]]], expected: 1}
      - {args: [[]], expected: 0, note: empty input}
      - {args: [[[3, 4], [1, 2]]], expected: 2}
      - {args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], expected: 3}
    solution: |
      class Solution:
          def countMerged(self, intervals: List[List[int]]) -> int:
              blocks = 0
              cur_end = None
              for start, end in sorted(intervals, key=lambda iv: iv[0]):
                  if cur_end is None or start > cur_end:
                      blocks += 1
                      cur_end = end
                  else:
                      cur_end = max(cur_end, end)
              return blocks
    hint: "On overlap, the block's end can only grow: `cur_end = max(cur_end, end)`."

hints:
  - >-
    If the intervals were sorted by start, which already-merged block could a new interval
    possibly overlap? Could it ever need to reach back past the most recent one?
  - >-
    Keep a list of merged blocks. For each interval in start order, compare its start with the
    end of the last block: if it is less than or equal, the block absorbs it and its end becomes
    the larger of the two ends; otherwise the interval starts a new block.
  - |
    sort intervals by start
    merged = empty list
    for each [start, end] in intervals:
        if merged not empty and start <= end of last block:
            end of last block = max(end of last block, end)
        else:
            append [start, end] to merged
    return merged

solution:
  code: |
    class Solution:
        def merge(self, intervals: List[List[int]]) -> List[List[int]]:
            intervals.sort(key=lambda iv: iv[0])  # sort by START so only the last block can overlap
            merged = []
            for i in range(len(intervals)):
                start, end = intervals[i]
                if merged and start <= merged[-1][1]:  # overlaps or touches the current block
                    merged[-1][1] = max(merged[-1][1], end)
                else:
                    merged.append([start, end])  # gap: the previous block is final
            return merged
  explanation: |
    **Why sort by start?** Merging is about chains: a block keeps growing as long as the next
    interval starts inside it. After sorting by start, every later interval begins at or after
    the current one, so the moment an interval starts *after* the current block's end, no later
    interval can reach back into that block either. The block is final, and we only ever compare
    against `merged[-1]`.

    Sorting by end does not give that guarantee: in `[[2,3],[4,5],[1,10]]` (already in end
    order) `[1,10]` arrives last and swallows two blocks you had already closed.

    Two details decide correctness. The test is `start <= merged[-1][1]`, so touching
    intervals like `[1,4]` and `[4,5]` merge, as the problem requires. And the new end is
    `max(...)`, because a short interval can sit entirely inside the block (`[2,3]` inside
    `[1,10]`); overwriting the end would shrink the block. Appending a fresh `[start, end]`
    list (rather than the input list itself) means updating `merged[-1][1]` never edits the
    caller's intervals by accident.
  time: O(N log N) — the sort dominates; the merge pass is O(N)
  space: O(N) — the output list (plus O(N) for Python's sort in the worst case)
  brute_force_code: |
    class Solution:
        def merge(self, intervals: List[List[int]]) -> List[List[int]]:
            ivs = [list(iv) for iv in intervals]
            changed = True
            while changed:
                changed = False
                for i in range(len(ivs)):
                    for j in range(i + 1, len(ivs)):
                        a, b = ivs[i], ivs[j]
                        if a[0] <= b[1] and b[0] <= a[1]:
                            ivs[i] = [min(a[0], b[0]), max(a[1], b[1])]
                            ivs.pop(j)
                            changed = True
                            break
                    if changed:
                        break
            return ivs

pitch_script: |
  **(Clarify)** "So the input can be in any order, intervals are closed, and two intervals that
  just touch, like 1 to 4 and 4 to 5, should merge into one? And I can return the result in any
  order?"

  **(Brute force)** "The naive way is to keep scanning all pairs, merge any two that overlap,
  and restart until nothing changes. Merges can cascade, so that's up to O(N³), far too slow for
  10⁴ intervals."

  **(Trigger)** "'Merge overlapping intervals' tells me to sort by start. Once the intervals are
  sorted by start, a new interval can only overlap the block I'm currently building, because
  everything after it starts even later. So I only ever compare with the last merged interval."

  **(Optimal)** "I sort by start and walk the list with an output list. If the current interval
  starts at or before the end of the last merged block, I extend that block's end to the max of
  the two ends; the max matters for intervals that are fully contained. Otherwise there's a gap,
  so the last block is final and I append the current interval as a new block."

  **(Complexity)** "Sorting is O(N log N) and the pass is O(N), so O(N log N) overall, with O(N)
  space for the output. If someone asks why not sort by end: with end order a long interval
  that starts early can arrive last and swallow blocks I've already closed."

twist:
  lc: 986
  title: Interval List Intersections
  why: >-
    Now you get two lists, each already sorted and internally disjoint, and you want the
    overlaps between them instead of the union. No sort is needed: walk both lists with two
    pointers, the intersection of the current pair is [max(starts), min(ends)] if that range is
    non-empty, and you advance whichever interval ends first, since it cannot overlap anything
    further in the other list. Same "compare with the current block" logic, applied across two
    lists.

