concept:
  problem_it_solves: >-
    "Why does looping through a 100,000-row Pandas DataFrame with for row in df.iterrows(): take 45 seconds when SQL takes 5ms?"
    Python for loops incur heavy CPython object boxing and unboxing overhead on every iteration.
    Vectorized boolean indexing with `.loc[mask]` executes across contiguous C-arrays in NumPy, filtering 100,000 rows in under 2 milliseconds.
  brute_force: >-
    Using `df.iterrows()` or `df.apply()` with an inline Python function containing `if row['status'] == 'FAIL' and row['latency'] > 500:`.
    This bypasses SIMD CPU vectorization and serializes memory access.
  brute_force_complexity: O(N) operations in Python bytecode — 100x slower than vectorized C-loops.
  key_insight: >-
    Construct boolean Series masks using bitwise operators (`&`, `|`, `~`). In Pandas, `(df['status'] == 'FAIL') & (df['latency_ms'] > threshold)`
    computes an aligned boolean array in compiled C code. Passing this mask into `.loc[mask]` returns filtered records in a single vectorized pass.
  real_world: >-
    Real-time fraud detection pipelines, test failure triage dashboards, and telemetry anomaly alerting engines.

statement:
  clean: |
    Implement high-speed vectorized filtering using boolean indexing loc:
    `filter_slow_failures(data: list[dict], threshold_ms: int) -> list[dict]`.
    
    Given a list of device test run dictionaries with keys:
    `test_id` (int), `device` (str), `status` (str), and `latency_ms` (int).
    
    Tasks:
    1. Load `data` into a `pandas.DataFrame`.
    2. If `data` is empty, return `[]`.
    3. Construct a vectorized boolean mask that selects rows where:
       - `status == "FAIL"`, AND
       - `latency_ms > threshold_ms`.
    4. Slice the DataFrame using `.loc[mask]`.
    5. Return the resulting rows as a list of dictionaries via `.to_dict(orient="records")`.
  oa_story: |
    **Drizz Mobile CI/CD — Flaky Device Triage**
    
    Every night, our test automation cluster runs 50,000 automated UI journeys across 80 physical Android devices.
    The triage script was lagging by 20 minutes because it checked every row with a Python `for row in df.iterrows():` loop.
    
    Refactor this filter into a vectorized `.loc` query so the CI/CD pipeline can isolate slow failed runs instantaneously.
  trigger_keywords: ["boolean indexing loc", "filter_slow_failures", "data"]
  examples:
    - input: "data = [{'test_id': 1, 'device': 'Pixel 8', 'status': 'FAIL', 'latency_ms': 600}, {'test_id': 2, 'device': 'S23', 'status': 'PASS', 'latency_ms': 700}], threshold_ms = 500"
      output: "[{'test_id': 1, 'device': 'Pixel 8', 'status': 'FAIL', 'latency_ms': 600}]"
      explanation: "Row 1 failed and latency 600 > 500. Row 2 passed, so it is excluded."
  constraints:
    - "data contains between 0 and 50,000 records"
    - "threshold_ms is a positive integer"

constraint_quiz:
  prompt: >-
    Why must you use bitwise `&` instead of Python's logical `and` when combining boolean Series in Pandas?
  options:
    - "Because `and` evaluates truth value of the entire Series object rather than element-wise"
    - "Because bitwise operators are slower"
    - "Because `and` only works on numbers"
    - "Because `&` allocates more RAM"
  answer: 0
  explanation: >-
    Python's `and` evaluates whether the whole container is truthy (raising ValueError in Pandas), while `&` evaluates element-wise boolean operations across arrays.

pattern_quiz:
  prompt: Which Pandas method provides label-based slicing using boolean series masks?
  options:
    - ".loc[]"
    - ".iloc[]"
    - ".filter()"
    - ".where()"
  answer: 0
  explanation: >-
    `.loc[boolean_mask]` is the idiomatic Pandas method for label-based and boolean-condition row selection.

