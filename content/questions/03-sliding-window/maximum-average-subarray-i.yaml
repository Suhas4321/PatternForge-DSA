  - {args: [[3, 1, 2], 3], expected: 2.0, note: "k == n leaves exactly one window"}
  - {args: [[1, 2, 3, 4, 10], 2], expected: 7.0, note: best window is the last one}
  - {args: [[7, 1, 1, 1, 1], 2], expected: 4.0, note: best window is the very first one}
  - {args: [[2, 3, 4, 1, 5], 2], expected: 3.5, note: fractional average}
  - {args: [[-10000, -10000], 1], expected: -10000.0, note: extreme negative values}
visualize_test: 0

drills:
  - title: Where does each window start and end?
    skill: setup
    goal: Turn the right end r of a size-k window into its left end with l = r − k + 1.
    instructions: |
      Given an array length `n` and a window size `k`, return the `[l, r]` bounds (inclusive)
      of every window of size `k`, from left to right.

      Off-by-one errors are the number one reason fixed windows break in interviews. The
      first full window ends at `r = k - 1`, the last one ends at `r = n - 1`, and the window
      ending at `r` starts at `l = r - k + 1`. Get these three facts right and the slide is easy.
    function:
      name: windowBounds
      params: [{name: n}, {name: k}]
    starter_code: |
      class Solution:
          def windowBounds(self, n: int, k: int) -> List[List[int]]:
              pass
    tests:
      - {args: [6, 4], expected: [[0, 3], [1, 4], [2, 5]]}
      - {args: [3, 3], expected: [[0, 2]]}
      - {args: [4, 1], expected: [[0, 0], [1, 1], [2, 2], [3, 3]]}
      - {args: [1, 1], expected: [[0, 0]]}
    solution: |
      class Solution:
          def windowBounds(self, n: int, k: int) -> List[List[int]]:
              out = []
              for r in range(k - 1, n):
                  l = r - k + 1
                  out.append([l, r])
              return out
    hint: "Loop `r` from `k - 1` to `n - 1`; the window ending at `r` has `k` elements, so it starts at `r - k + 1`."

  - title: Slide the sum, don't recompute it
    skill: core
    goal: Update a running window sum in O(1) by adding the entering element and subtracting the leaving one.
    instructions: |
      Return a list with the sum of **every** window of size `k`, from left to right.

      Build the first window's sum once, then for each new right end `r`, add `nums[r]` and
      subtract `nums[r - k]`, the element that just fell out of the left side. Do **not** call
      `sum()` on each window: that is the O(N·K) brute force in disguise.
    function:
      name: windowSums
      params: [{name: nums}, {name: k}]
    starter_code: |
      class Solution:
          def windowSums(self, nums: List[int], k: int) -> List[int]:
              pass
    tests:
      - {args: [[1, 12, -5, -6, 50, 3], 4], expected: [2, 51, 42]}
      - {args: [[5], 1], expected: [5]}
      - {args: [[1, 2, 3, 4], 2], expected: [3, 5, 7]}
      - {args: [[-1, -2, -3], 3], expected: [-6]}
    solution: |
      class Solution:
          def windowSums(self, nums: List[int], k: int) -> List[int]:
              window_sum = sum(nums[:k])  # built once
              sums = [window_sum]
              for r in range(k, len(nums)):
                  window_sum += nums[r] - nums[r - k]
                  sums.append(window_sum)
              return sums
    hint: "When `nums[r]` enters a size-`k` window, the element leaving is `nums[r - k]`."

  - title: Seed the best from a real window
    skill: edge
    goal: Initialise the best from the first window (not 0) and keep the earliest winner on ties.
    instructions: |
      Return the **start index** `l` of the size-`k` window with the largest sum. If several
      windows tie, return the **earliest** one.

      Two classic bugs live here. Starting `best = 0` silently fails when every window sum is
      negative: no window ever "beats" 0, so you return a start that was never compared.
      Seed `best` with the first window instead. And use a strict `>` so a later tie doesn't
      overwrite an earlier winner.
    function:
      name: bestWindowStart
      params: [{name: nums}, {name: k}]
    starter_code: |
      class Solution:
          def bestWindowStart(self, nums: List[int], k: int) -> int:
              pass
    tests:
      - {args: [[1, 12, -5, -6, 50, 3], 4], expected: 1}
      - {args: [[-3, -1, -2, -5], 2], expected: 1, note: "all sums negative: -4, -3, -7"}
      - {args: [[2, 2, 2], 1], expected: 0, note: all tie so keep the earliest}
      - {args: [[1, 2, 3, 9], 2], expected: 2, note: best at the end}
      - {args: [[4, 1, 1, 4], 2], expected: 0, note: first and last windows tie}
    solution: |
      class Solution:
          def bestWindowStart(self, nums: List[int], k: int) -> int:
              window_sum = sum(nums[:k])
              best, best_l = window_sum, 0  # a real window, not 0
              for r in range(k, len(nums)):
                  window_sum += nums[r] - nums[r - k]
                  if window_sum > best:  # strict: ties keep the earlier start
                      best, best_l = window_sum, r - k + 1
              return best_l
    hint: "Seed `best` with the first window's sum and only replace it when a later window is strictly bigger."

hints:
  - >-
    The window starting at i and the window starting at i + 1 share k − 1 elements. If you
    already know the first sum, how much new work do you really need to get the second?
  - >-
    Keep window_sum for nums[l..r]. Each step right, one element enters on the right and one
    leaves on the left: add nums[r], subtract nums[l], move l forward. Since every window has
    the same length, which number should you track as "best", the sum or the average?
  - |
    window_sum = sum of nums[0 .. k-1]
    best = window_sum
    l = 0
    for r from k to n-1:
        window_sum = window_sum + nums[r] - nums[l]
        l = l + 1
        best = max(best, window_sum)
    return best / k

solution:
  code: |
    class Solution:
        def findMaxAverage(self, nums: List[int], k: int) -> float:
            l = 0
            window_sum = 0
            for r in range(k):  # build the first window nums[0..k-1]
                window_sum += nums[r]
            best = window_sum  # seed with a real window: sums can be negative
            for r in range(k, len(nums)):
                window_sum += nums[r] - nums[l]  # nums[r] enters, nums[l] leaves
                l += 1  # the window is nums[l..r] again, still k long
                best = max(best, window_sum)
            return best / k
  explanation: |
    The window is always `nums[l..r]` with exactly `k` elements. First we build the sum of
    the first window, `nums[0..k-1]`. Then each step moves both ends right by one: `nums[r]`
    joins, `nums[l]` drops out, and the sum is fixed with one addition and one subtraction.
    That is the entire sliding-window idea: **don't recompute the window, update it.**

    Two small decisions matter. `best` starts as the first window's sum, not `0`, because
    every window can be negative (`[-1, -12, -5, -6, -50, -3]` with `k = 2` has answer
    `-5.5`). And we compare **sums**, dividing by `k` only once at the end: with a fixed `k`,
    the largest sum is the largest average, and integer sums avoid floating-point drift
    along the way.

    The order inside the loop is "add the new element, remove the old one, then score".
    Every variable-size window you meet next uses the same rhythm; the only thing that
    changes is *when* `l` moves.
  time: O(N) — k steps to build the first window, then one O(1) update per remaining element
  space: O(1) — just the running sum, the best sum and two indices
  brute_force_code: |
    class Solution:
        def findMaxAverage(self, nums: List[int], k: int) -> float:
            best = None
            for i in range(len(nums) - k + 1):
                total = sum(nums[i:i + k])  # recomputed from scratch every time
                if best is None or total > best:
                    best = total
            return best / k

pitch_script: |
  **(Clarify)** "So the subarray has to be contiguous and exactly k long, values can be
  negative, and I return the average as a float, with a small tolerance allowed. k is always
  between 1 and n, so at least one window exists?"

  **(Brute force)** "The direct approach sums every window of length k from scratch. That's
  O(N·K) time and O(1) space. With N at 10⁵ and k around half of that, it's billions of
  additions, so I want something linear."

  **(Trigger)** "'Contiguous' and 'length exactly k' tell me it's a fixed-size sliding window.
  Two neighbouring windows share k minus 1 elements, so the second sum is just the first sum
  plus the element that came in minus the element that went out."

  **(Optimal)** "I'll compute the sum of the first k elements and use it as my best. Then I
  slide: add nums[r], subtract nums[l], move l forward, and update the best sum. Because the
  length is fixed, the maximum sum gives the maximum average, so I divide by k once at the
  end. I seed best with the first window rather than zero since everything could be negative."

  **(Complexity)** "That's O(N) time, one add and one subtract per step, and O(1) extra space."

twist:
  lc: 1343
  title: Number of Sub-arrays of Size K and Average Greater than or Equal to Threshold
  why: >-
    Same fixed window of size k and the same add-right, subtract-left update, but instead of
    keeping the best sum you count how many windows qualify. Multiply instead of dividing:
    a window qualifies when window_sum >= threshold * k, which keeps everything in integers.

viz:
  arrays: [nums]
  pointers: [l, r]
  window: [l, r]
  watch: [window_sum, best, k]
