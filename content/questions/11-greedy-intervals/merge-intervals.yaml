slug: merge-intervals
lc: 56

concept:
  problem_it_solves: >-
    "Which ranges are really one continuous block?" Two ranges belong together when they share
    at least one point, and chains of such overlaps glue many ranges into one. Once the ranges
    are sorted by start, every range can only ever glue onto the block you are currently
    building, so one left-to-right pass collapses them all.
  brute_force: >-
    Repeatedly scan every pair of intervals; whenever two overlap, replace them with their union
    and start the scan again, until no pair overlaps. Each merge can create a new overlap with a
    range you already checked ([1,3] and [5,7] are separate until [2,6] arrives), so the scan is
    rerun again and again over pairs that were already compared.
  brute_force_complexity: >-
    O(N³) time in the worst case (up to N merges, each found by an O(N²) pair scan), O(1) extra
    space — 10⁴ intervals means up to 10¹² pair checks.
  key_insight: >-
    Sort by start. Now the current block is the only one a new interval can touch: every later
    interval starts at or after this one, so if it starts after the block's end, nothing that
    comes after it can reach back into the block either. The whole decision collapses to one
    comparison with the last merged interval: start <= last end means extend it (to the max of
    the two ends), otherwise the block is finished and a new one begins.
  real_world: >-
    Calendar services (Google Calendar free/busy, Outlook scheduling assistant) merge everyone's
    busy events into busy blocks before showing free slots. Memory allocators coalesce adjacent
    free blocks, firewalls and CDNs aggregate overlapping IP ranges, and incident tooling at
    companies like Swiggy merges overlapping outage windows so SLA downtime isn't double-counted.

statement:
  clean: |
    Given an array of `intervals` where `intervals[i] = [start_i, end_i]`,
    **merge all overlapping intervals** and return an array of the
    **non-overlapping intervals** that cover all the intervals in the input.

    Two intervals overlap if they share at least one point, so intervals that only touch,
    like `[1,4]` and `[4,5]`, are merged into `[1,5]`. The input is **not necessarily sorted**,
    and the output may be returned in any order.
  oa_story: |
    **ShuttleSetu Mobility — OA Round 1**

    ShuttleSetu runs electric employee shuttles for tech parks along Outer Ring Road. Every
    shuttle that plugs into the single fast charger at the Whitefield depot books a window
    `[from, to]` in minutes after midnight. Bookings come from different shift managers, so the
    list arrives in no particular order and windows often run into each other.

    The depot dashboard must show the charger's busy periods: each busy period is one stretch of
    time during which the charger is never free. If one booking ends at the exact minute the
    next one begins, the charger never frees up, so that is a single busy period. Given all
    bookings (up to 10,000 a day), return the list of busy periods, in any order.
  trigger_keywords: ["merge all overlapping intervals", "non-overlapping intervals", "not necessarily sorted"]
  examples:
    - input: "intervals = [[1,3],[2,6],[8,10],[15,18]]"
      output: "[[1,6],[8,10],[15,18]]"
      explanation: "[1,3] and [2,6] overlap, so they merge into [1,6]. The others stand alone."
    - input: "intervals = [[1,4],[4,5]]"
      output: "[[1,5]]"
      explanation: "They share the point 4, which counts as overlapping."
    - input: "intervals = [[4,7],[1,4]]"
      output: "[[1,7]]"
      explanation: "Unsorted input: after sorting, [1,4] touches [4,7]."
  constraints:
    - "1 <= intervals.length <= 10^4"
    - "intervals[i].length == 2"
    - "0 <= start_i <= end_i <= 10^4"

constraint_quiz:
  prompt: >-
    There can be 10⁴ intervals in any order. What time complexity should you aim for?
  options: ["O(N³)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 2
  explanation: >-
    Repeated pairwise merging is O(N³) in the worst case, about 10¹² steps. Even a single O(N²)
    pass over all pairs is 10⁸ comparisons and still isn't enough on its own, because merges
    cascade. Sorting by start costs O(N log N) and then one linear pass finishes the job, so
    O(N log N) is the target. Plain O(N) would need the input already sorted (or a bucket trick
    on the small coordinate range), which an interviewer won't expect here.

pattern_quiz:
  prompt: >-
    You must collapse every chain of overlapping ranges into one range, and the input is
    unsorted. Which pattern fits?
  options:
    - "Sort by start, then extend the last merged interval or append a new one"
    - "Sort by end, then greedily keep the earliest-finishing interval"
    - "Union-find over every overlapping pair"
    - "Two pointers from both ends of the array"
  answer: 0
  explanation: >-
    "Merge overlapping intervals" is the sort-by-start trigger: after sorting by start, a new
    interval can only overlap the block you are currently building, so one comparison per
    interval decides everything. Sort by end is the rule for *keeping* the most disjoint
    intervals, not for merging: with [[2,3],[4,5],[1,10]] the end order puts [1,10] last and it
    has to swallow blocks you already closed. Union-find works but needs O(N²) pair checks to
    find the edges, and two pointers has nothing to squeeze from both ends.

