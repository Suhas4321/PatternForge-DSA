slug: two-sum
lc: 1

concept:
  problem_it_solves: >-
    "Have I already seen the value I need?" Without memory, answering that means re-scanning
    everything to your left, every single time. A hash map remembers every value you've passed
    (and where), so the question becomes a single O(1) lookup.
  brute_force: >-
    Try every pair (i, j) with two nested loops and check nums[i] + nums[j] == target.
    The inner loop keeps re-reading values the outer loop has already seen.
  brute_force_complexity: O(N²) time, O(1) space — 10⁴ elements means ~5 × 10⁷ pair checks.
  key_insight: >-
    Flip the question. Instead of "which pair sums to target?", stand at x and ask "have I
    already seen target − x?". Store each value → index in a map *after* checking, and the
    answer appears the moment the second half of the pair arrives.
  real_world: >-
    Payment reconciliation at fintechs (Razorpay, PhonePe): match a refund against two prior
    transactions. Fraud engines and dedup pipelines use the same "seen-before" hash lookup,
    and database hash joins are exactly this idea at scale.

statement:
  clean: |
    Given an array of integers `nums` and an integer `target`, return the **indices** of the
    two numbers that **add up to target**.

    You may assume that each input has **exactly one solution**, and you may not use the
    same element twice. You can return the answer in any order.
  oa_story: |
    **SwiftCart Logistics — OA Round 1**

    SwiftCart's Bengaluru dark-store team packs combo orders into insulated bags. Each bag
    must be filled to an exact weight, `target` grams, using **exactly two** items from
    today's packing queue so riders aren't overloaded on Outer Ring Road.

    The packing queue is a list of item weights in the order they arrived. The warehouse
    system needs the **queue positions** (0-indexed) of the two items to pick. Operations
    guarantees that exactly one valid pair exists for every bag, and an item can't be picked
    twice. Return the two positions in any order.
  trigger_keywords: ["indices", "add up to target", "exactly one solution"]
  examples:
    - input: "nums = [2,7,11,15], target = 9"
      output: "[0,1]"
      explanation: "nums[0] + nums[1] = 2 + 7 = 9."
    - input: "nums = [3,2,4], target = 6"
      output: "[1,2]"
      explanation: "3 + 3 would need the same element twice, so the answer is 2 + 4."
    - input: "nums = [3,3], target = 6"
      output: "[0,1]"
  constraints:
    - "2 <= nums.length <= 10^4"
    - "-10^9 <= nums[i] <= 10^9"
    - "-10^9 <= target <= 10^9"
    - "Only one valid answer exists."

constraint_quiz:
  prompt: >-
    N can be 10⁴ and the follow-up asks for "less than O(N²)". What time complexity should
    you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) is ~10⁸ operations in the worst case, which is too slow for the follow-up.
    Sorting gives O(N log N) but scrambles the original indices you must return. A single
    pass with a hash map is O(N). O(log N) is impossible because you have to read every
    element at least once.

pattern_quiz:
  prompt: The array is unsorted and you must return original indices. Which pattern fits?
  options:
    - "Two pointers from both ends"
    - "Hash map of value → index (complement lookup)"
    - "Sliding window"
    - "Binary search for the complement"
  answer: 1
  explanation: >-
    Two pointers and binary search both need sorted data, and sorting destroys the indices
    you must return. "Return indices of a pair that sums to X" on unsorted data is the
    classic complement-lookup trigger: remember what you've seen, look up target − x.

