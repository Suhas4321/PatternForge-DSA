hints:
- Use `SUM(revenue) OVER (ORDER BY month)` to calculate the cumulative running total.
- Use `LAG(revenue, 1) OVER (ORDER BY month)` to look back at the previous month's value.
- '| # Pseudocode Blueprint

  | SELECT

  |     month,

  |     revenue,

  |     SUM(revenue) OVER (ORDER BY month) AS running_total,

  |     LAG(revenue, 1) OVER (ORDER BY month) AS prev_month_revenue,

  |     ROUND(((revenue - LAG(revenue, 1) OVER (ORDER BY month)) * 100.0 /

  |            LAG(revenue, 1) OVER (ORDER BY month)), 2) AS mom_growth_pct

  | FROM MonthlyRevenue

  | ORDER BY month;'
solution:
  code: "SELECT\n    month,\n    revenue,\n    SUM(revenue) OVER (ORDER BY month) AS running_total,\n    LAG(revenue, 1) OVER\
    \ (ORDER BY month) AS prev_month_revenue,\n    ROUND(((revenue - LAG(revenue, 1) OVER (ORDER BY month)) * 100.0 / LAG(revenue,\
    \ 1) OVER (ORDER BY month)), 2) AS mom_growth_pct\nFROM MonthlyRevenue\nORDER BY month;\n"
  explanation: Window functions evaluate running aggregates in a single sequential pass. `SUM() OVER (ORDER BY month)` aggregates
    all prior rows to compute cumulative revenue. `LAG(revenue, 1) OVER (ORDER BY month)` retrieves the previous row's value,
    enabling direct calculation of month-over-month growth with float precision.
  time: O(N log N) sorting by month
  space: O(N) for window frame evaluation
pitch_script: '**(Clarify)** "We need to calculate cumulative running totals and month-over-month revenue growth percentage
  for each calendar month."


  **(Brute force)** "Self-joining the table on date offsets requires O(N^2) time and fails when dates have gaps."


  **(Trigger)** "Calculating cumulative sums and referencing prior time periods signals window functions: `SUM() OVER ()`
  and `LAG()`."


  **(Optimal)** "We select `month` and `revenue`. We compute `SUM(revenue) OVER (ORDER BY month)` for running totals. We use
  `LAG(revenue, 1) OVER (ORDER BY month)` to fetch the prior month, and compute percentage growth with `ROUND(((revenue -
  prev) * 100.0 / prev), 2)`. The first month safely evaluates to NULL."


  **(Complexity)** "Executes in O(N log N) time and O(N) space." '
