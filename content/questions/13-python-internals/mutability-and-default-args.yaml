drills:
  - title: Initialize on None
    skill: setup
    goal: Create a new container only when the argument is None.
    instructions: |
      Return `target` if it is not None, otherwise return an empty list `[]`.
    function:
      name: ensure_list
      params: [{name: target}]
    starter_code: |
      class Solution:
          def ensure_list(self, target: list = None) -> list:
              pass
    tests:
      - {args: [null], expected: []}
      - {args: [[1, 2, 3]], expected: [1, 2, 3]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def ensure_list(self, target: list = None) -> list:
              if target is None:
                  return []
              return target
    hint: "Use if target is None: return []"

  - title: Defensive shallow copying
    skill: core
    goal: Prevent caller mutations from altering stored state.
    instructions: |
      Return a shallow copy of the input dictionary `data` using `.copy()`.
    function:
      name: copy_dict
      params: [{name: data}]
    starter_code: |
      class Solution:
          def copy_dict(self, data: dict) -> dict:
              pass
    tests:
      - {args: [{"a": 1, "b": 2}], expected: {"a": 1, "b": 2}}
      - {args: [{}], expected: {}}
      - {args: [{"key": "val"}], expected: {"key": "val"}}
    solution: |
      class Solution:
          def copy_dict(self, data: dict) -> dict:
              return data.copy()
    hint: "Call data.copy() to duplicate the dictionary references."

  - title: Is vs Equals Identity check
    skill: edge
    goal: Understand object identity with 'is' versus structural equality with '=='.
    instructions: |
      Return `True` if `a` and `b` refer to the exact same object in memory (`a is b`), else `False`.
    function:
      name: same_identity
      params: [{name: a}, {name: b}]
    starter_code: |
      class Solution:
          def same_identity(self, a: list, b: list) -> bool:
              pass
    tests:
      - {args: [[1], [1]], expected: false}
      - {args: [[], []], expected: false}
      - {args: [null, null], expected: true}
    solution: |
      class Solution:
          def same_identity(self, a: list, b: list) -> bool:
              return a is b
    hint: "Use the `is` operator to compare heap pointer addresses."

hints:
  - "Default parameter values are created once at definition time, not on every function call."
  - "Use store = None in the method signature, and check `if store is None:` inside the method."
  - "Append `record.copy()` to make sure the stored item cannot be mutated from outside."

solution:
  code: |
    class Solution:
        def append_record(self, record: dict, store: list = None) -> list:
            if store is None:
                store = []
            store.append(record.copy())
            return store
  explanation: |
    By setting `store = None` as the default argument, we avoid binding a single mutable list
    to the function definition. Inside the function, `if store is None:` instantiates a brand new
    list on the heap specifically for this invocation.
    
    Calling `record.copy()` ensures that if the caller mutates their local dictionary after passing
    it into `append_record`, the internal record inside `store` remains intact.
  time: O(1) — dictionary copy and list append are constant time
  space: O(1) extra space beyond the newly allocated copy

pitch_script: |
  **(Clarify)** "We need to fix the classic mutable default argument issue where omitted arguments share state across invocations, while also guarding against external mutation via shallow copying."

  **(Basement Insight)** "In Python, default arguments are evaluated when the function definition is executed, storing references on the function object's `__defaults__` tuple. If you use a mutable list `store=[]`, all calls that omit the argument mutate the exact same object on the heap."

  **(Solution)** "We use `None` as a sentinel default. Inside the body, if `store is None`, we allocate a fresh list `[]`. We then append `record.copy()` to defend against caller side-effects."

  **(Complexity)** "This runs in O(K) time where K is the number of keys in the record, using O(K) space for the defensive copy."

twist:
  lc: 9202
  title: Deepcopy vs Shallow Copy in Nested Telemetry
  why: >-
    If the record dictionary contains nested sub-dictionaries (e.g. {'user': {'id': 1}}), shallow copy
    still shares the inner dictionary. For deeply nested structures, copy.deepcopy() is required.

