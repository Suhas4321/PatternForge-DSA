concept:
  problem_it_solves: Why do high-scale vector databases (Pinecone, Milvus, Qdrant) require embedding vectors to be L2-normalized
    upon ingestion? Cosine similarity requires computing vector magnitudes ||u|| and ||v|| using square roots on every distance
    calculation. If vectors are unit length (||u|| = 1), cosine similarity identically equals the dot product (u . v), saving
    billions of CPU/GPU square-root operations per second.
  brute_force: Re-calculating square roots and vector norms for millions of vector comparisons during real-time query serving.
  brute_force_complexity: O(D) arithmetic operations with expensive sqrt overhead per vector comparison.
  key_insight: 'Pre-normalizing vectors to unit length converts cosine similarity into a pure dot product: cos(u, v) = u .
    v.'
  real_world: Pinecone index metric selection, OpenAI text-embedding-3 normalization, and Milvus vector search engine.
statement:
  clean: "Implement vector nearest neighbors search comparing cosine similarity and dot product:\n`find_nearest_neighbors(self,\
    \ query_vector: list[float], candidates: list[dict], k: int = 3, metric: str = 'cosine') -> list[dict]`.\n\nGiven:\n-\
    \ `query_vector`: list of float embedding dimensions\n- `candidates`: list of candidate dicts: `{'id': str, 'vector':\
    \ list[float]}`\n- `k`: number of nearest neighbors to retrieve (`k >= 1`)\n- `metric`: `'cosine'` or `'dot_product'`\n\
    \nDistance Metrics:\n- Dot Product: `sum(u_i * v_i)`\n- L2 Norm: `sqrt(sum(v_i^2))`\n- Cosine Similarity: `dot(u, v) /\
    \ (norm(u) * norm(v))` (if either norm is `0.0`, return `0.0`).\n- If `metric == 'cosine'`: compute cosine similarity.\n\
    - If `metric == 'dot_product'`: compute dot product.\n- Round similarity score to 5 decimal places: `round(score, 5)`.\n\
    \nOrdering Rules:\n1. Sort candidates:\n   - Primary: `score` descending\n   - Secondary (tie-breaker): `id` alphabetically\
    \ ascending\n2. Return top `min(k, len(candidates))` candidates: `[{'id': id, 'score': score}, ...]`.\n3. If `candidates`\
    \ is empty, return `[]`."
  oa_story: '**OlaCabs Rider Matching — Geospatial Driver Embedding Search**


    OlaCabs uses learned driver-rider spatial embeddings to match premium airport pickups in Bengaluru. The latency SLA for
    dispatching ride offers is under 5 milliseconds.


    The engineering lead discovered that computing cosine similarity with vector magnitude square roots accounted for 40%
    of matching latency. By verifying when dot product matches cosine similarity under normalized vectors, the cluster doubled
    search throughput. Implement this comparative vector search module.'
  trigger_keywords:
  - vector nearest neighbors search comparing cosine similarity and dot product
  - find_nearest_neighbors
  - query_vector
  examples:
  - input: 'query_vector = [1.0, 0.0], candidates = [{''id'': ''v1'', ''vector'': [1.0, 0.0]}, {''id'': ''v2'', ''vector'':
      [0.0, 1.0]}], k = 2, metric = ''cosine'''
    output: '[{''id'': ''v1'', ''score'': 1.0}, {''id'': ''v2'', ''score'': 0.0}]'
    explanation: v1 is parallel to query with cosine similarity 1.0; v2 is orthogonal with similarity 0.0.
  constraints:
  - 0 <= len(candidates) <= 500
  - 1 <= len(query_vector) <= 1536
  - metric in ['cosine', 'dot_product']
constraint_quiz:
  prompt: Under what condition is dot product mathematically identical to cosine similarity?
  options:
  - When both vectors have an L2 norm equal to 1.0 (unit length / L2-normalized)
  - When all vector components are positive integers
  - When the vector dimensionality is exactly 128
  - When the metric is run on an Apple Silicon M-series chip
  answer: 0
  explanation: Because cos(u, v) = (u . v) / (||u|| * ||v||), when ||u|| = 1 and ||v|| = 1, the denominator equals 1 and cos(u,
    v) = u . v.
pattern_quiz:
  prompt: Why is dot product computationally faster than cosine similarity on modern hardware?
  options:
  - It requires only multiply-accumulate (MAC) SIMD instructions without square root or division operations
  - It bypasses the L1 cache
  - It uses quantum computing gates
  - It does not require floating point numbers
  answer: 0
  explanation: Dot products map directly to hardware Fused Multiply-Add (FMA) vector instructions, avoiding non-linear square
    root and division bottlenecks.
