slug: longest-substring-without-repeating-characters
lc: 3

concept:
  problem_it_solves: >-
    "What is the longest unbroken stretch where nothing repeats?" A stretch that is valid
    stays valid when you drop characters from its left, and becomes invalid the moment a
    duplicate enters on its right. So instead of re-checking every substring, you keep one
    window, grow it on the right, and shrink it on the left only as far as needed to push
    the duplicate out.
  brute_force: >-
    Fix every start i, then extend j one character at a time with a fresh set, stopping at
    the first repeat and recording j − i. Every new start throws the set away and re-reads
    characters the previous start had already checked: for "abcdef…", start 1 re-verifies
    almost exactly what start 0 just verified.
  brute_force_complexity: >-
    O(N · min(N, Σ)) time, O(min(N, Σ)) space, where Σ is the alphabet size. With an
    unbounded alphabet that is O(N²): 5 × 10⁴ characters means ~1.25 × 10⁹ steps. Checking
    every substring from scratch instead is O(N³).
  key_insight: >-
    When s[r] creates a duplicate, every window that starts at the current l (or anywhere
    before the earlier copy of s[r]) and reaches r is invalid too. So you never need to go
    back: slide l forward until the earlier copy leaves, and the window is valid again. l and
    r both only move right, so each character enters the window once and leaves at most once.
    Measure r − l + 1 right after the shrink, when the window is guaranteed valid.
  real_world: >-
    Music and video apps (Spotify shuffle, YouTube autoplay) keep a window of recently played
    items so nothing repeats within it. Ad servers do frequency capping over a sliding window
    of impressions, and stream processors (Kafka Streams, Flink) run "deduplicate within the
    last N events" with exactly this add-on-the-right, evict-on-the-left bookkeeping.

statement:
  clean: |
    Given a string `s`, find the length of the **longest substring** **without repeating
    characters**.

    A substring is a **contiguous** non-empty sequence of characters within the string. `s`
    may contain English letters, digits, symbols and spaces, and every one of them counts as
    a character.
  oa_story: |
    **CloudKirana Quick Commerce — OA Round 1**

    CloudKirana runs 10-minute grocery dark stores across Whitefield and Bellandur. Every
    time a picker scans an item, the handheld logs the shelf code of that item as a single
    character, so a picker's whole shift becomes one long string of shelf codes in scan
    order. Shelf codes can be letters, digits, symbols or even a space for the loose-produce
    counter.

    The operations team believes a picker is in "flow" when they visit a run of shelves
    back-to-back without returning to any shelf they already visited in that run. Given a
    picker's scan log, return the number of scans in their longest such run of consecutive
    scans. Shift logs can have 50,000 scans, and the report runs for every picker every night.
  trigger_keywords: ["longest substring", "without repeating", "contiguous"]
  examples:
    - input: "s = \"abcabcbb\""
      output: "3"
      explanation: "The answer is \"abc\", with length 3."
    - input: "s = \"bbbbb\""
      output: "1"
      explanation: "The answer is \"b\", with length 1."
    - input: "s = \"pwwkew\""
      output: "3"
      explanation: "The answer is \"wke\". \"pwke\" is a subsequence, not a substring."
  constraints:
    - "0 <= s.length <= 5 * 10^4"
    - "s consists of English letters, digits, symbols and spaces."

constraint_quiz:
  prompt: >-
    s can be 5 × 10⁴ characters long and contain letters, digits, symbols and spaces. What
    time complexity should you aim for?
  options: ["O(N³)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    O(N³) re-checks every substring from scratch, about 2 × 10¹³ steps. O(N²) is ~1.25 × 10⁹
    in the worst case and interviewers treat it as the brute force. O(N log N) has no natural
    source here: sorting destroys the contiguity the question is about. A sliding window is
    O(N) because l and r each move right at most N times.

pattern_quiz:
  prompt: >-
    You need the longest contiguous stretch of a string in which no character appears twice.
    Which pattern fits?
  options:
    - "Sort the characters and scan for duplicates"
    - "Variable sliding window with a hash map (or set) of the window's characters"
    - "Prefix sums + hash map of counts"
    - "Two pointers moving inward from both ends"
  answer: 1
  explanation: >-
    "Longest substring" plus a property that breaks when a bad element enters ("without
    repeating") is the variable-window trigger: grow on the right, shrink on the left until
    valid. Sorting destroys order, prefix sums answer "sum equals k" questions, and inward
    two pointers need a sorted or symmetric structure, which a substring scan doesn't have.

