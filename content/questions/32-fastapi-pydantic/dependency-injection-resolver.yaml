    - get_auth
    expected: false
  solution: "class Solution:\n    def drill_is_cached(self, cache: dict, node: str) -> bool:\n        return node in cache\n"
  hint: Return `node in cache`.
- skill: core
  title: Post-order recursive visit
  goal: Visit children before adding parent to order.
  instructions: Append all dependencies to order before appending parent.
  function:
    name: drill_post_order
    params:
    - name: node
    - name: graph
  starter_code: "class Solution:\n    def drill_post_order(self, node: str, graph: dict) -> list[str]:\n        pass\n"
  tests:
  - args:
    - a
    - a:
      - b
      b: []
    expected:
    - b
    - a
  solution: "class Solution:\n    def drill_post_order(self, node: str, graph: dict) -> list[str]:\n        order = []\n \
    \       for dep in graph.get(node, []):\n            order.append(dep)\n        order.append(node)\n        return order\n"
  hint: Iterate dependencies, append them, then append node.
- skill: edge
  title: Get provider fallback
  goal: Return provider value or default mock string.
  instructions: Return `providers.get(node, f'mock_{node}')`.
  function:
    name: drill_provider_val
    params:
    - name: providers
    - name: node
  starter_code: "class Solution:\n    def drill_provider_val(self, providers: dict, node: str) -> str:\n        pass\n"
  tests:
  - args:
    - a: real_a
    - a
    expected: real_a
  - args:
    - {}
    - b
    expected: mock_b
  solution: "class Solution:\n    def drill_provider_val(self, providers: dict, node: str) -> str:\n        return providers.get(node,\
    \ f\"mock_{node}\")\n"
  hint: Use providers.get with mock fallback.
hints:
- Use a recursive DFS helper function `resolve(node)`.
- 'If `node in resolved_values`: increment `cached_hits` and return immediately.'
- '| # Pseudocode Blueprint

  | def resolve(node):

  |     if node in resolved: cached_hits += 1; return

  |     for dep in graph.get(node, []): resolve(dep)

  |     order.append(node)

  |     resolved[node] = providers.get(node, f"mock_{node}")

  | resolve(endpoint)

  | return order, resolved, cached_hits'
solution:
  code: "class Solution:\n    def resolve_dependencies(self, endpoint: str, dependency_graph: dict[str, list[str]], providers:\
    \ dict[str, str]) -> dict:\n        resolution_order: list[str] = []\n        resolved_values: dict[str, str] = {}\n \
    \       cached_hits = 0\n\n        def resolve(node: str):\n            nonlocal cached_hits\n            if node in resolved_values:\n\
    \                cached_hits += 1\n                return\n            for dep in dependency_graph.get(node, []):\n  \
    \              resolve(dep)\n            resolution_order.append(node)\n            resolved_values[node] = providers.get(node,\
    \ f\"mock_{node}\")\n\n        resolve(endpoint)\n        return {\n            \"resolution_order\": resolution_order,\n\
    \            \"resolved_values\": resolved_values,\n            \"cached_hits\": cached_hits,\n        }\n"
  explanation: A recursive post-order traversal traverses child dependencies first, ensuring dependencies are fully resolved
    before their dependents execute. Caching resolved values in `resolved_values` ensures shared dependencies like database
    connections are instantiated exactly once per request.
  time: O(V + E) where V is dependency nodes and E is dependency edges
  space: O(V) for the resolved values cache and recursion stack
pitch_script: '**(Clarify)** "We need to resolve a dependency DAG for a FastAPI endpoint, ordering resolutions in topological
  post-order and caching shared dependencies."


  **(Brute force)** "Instantiating dependencies eagerly without a cache creates duplicate database connections and repeats
  authentication computations."


  **(Trigger)** "Resolving a hierarchy of dependent components with sub-tree sharing triggers topological post-order traversal
  with memoization."


  **(Optimal)** "We define a recursive resolver. If a node is already in the resolution cache, we increment cached hits and
  return immediately. Otherwise, we recursively resolve each dependency before appending the current node to the resolution
  order and caching its value."


  **(Complexity)** "Executes in O(V + E) time and O(V) space." '
