tests:
  - {args: [[1, 2, 3], [1, 1]], expected: 1}
  - {args: [[1, 2], [1, 2, 3]], expected: 2}
  - {args: [[1, 2], [2, 1]], expected: 2, note: "unsorted cookies: giving the 2 to greed 1 would starve greed 2"}
  - {args: [[1, 2, 3], []], expected: 0, note: no cookies at all}
  - {args: [[5], [1, 2, 3]], expected: 0, note: every cookie too small}
  - {args: [[10, 9, 8, 7], [5, 6, 7, 8]], expected: 2, note: both lists unsorted}
  - {args: [[1, 1, 1], [1, 1, 1]], expected: 3, note: "duplicates; size equal to greed is enough"}
  - {args: [[2, 3, 4], [3, 1, 2, 5]], expected: 3, note: smallest cookie must be skipped}
  - {args: [[7, 8, 9, 10], [5, 6, 7, 8]], expected: 2, note: two small cookies are wasted}
visualize_test: 7

drills:
  - title: Find the smallest sufficient cookie
    skill: setup
    goal: Pick the smallest value that is still large enough, which is the greedy choice for one child.
    instructions: |
      Given cookie sizes `s` (unsorted) and one child's greed `need`, return the **smallest**
      cookie size that is `>= need`, or `-1` if no cookie is big enough.

      This is the single decision the full algorithm makes over and over. A bigger cookie
      would also satisfy this child, but it's wasted: someone greedier might have needed it.
    function:
      name: smallestSufficient
      params: [{name: s}, {name: need}]
    starter_code: |
      class Solution:
          def smallestSufficient(self, s: List[int], need: int) -> int:
              pass
    tests:
      - {args: [[4, 1, 3, 2], 3], expected: 3}
      - {args: [[1, 2], 5], expected: -1}
      - {args: [[9, 7, 8], 1], expected: 7}
      - {args: [[], 1], expected: -1}
    solution: |
      class Solution:
          def smallestSufficient(self, s: List[int], need: int) -> int:
              best = -1
              for size in s:
                  if size >= need and (best == -1 or size < best):
                      best = size
              return best
    hint: "Track the best candidate so far; only accept sizes that are `>= need` and smaller than it."

  - title: Two pointers over sorted lists
    skill: core
    goal: Move the cookie pointer every step and the child pointer only when a child is fed.
    instructions: |
      Both `g` and `s` are already **sorted** ascending. Return a list where position `i`
      holds the index (in `s`) of the cookie child `i` receives, or `-1` if child `i` gets
      nothing, using the greedy rule: the current cookie goes to the current least greedy
      unfed child if it's big enough, otherwise it's discarded.

      This is the heart of the solution. A cookie too small for the least greedy remaining
      child is too small for every child after them too, so it can be thrown away forever.
    function:
      name: assignIndices
      params: [{name: g}, {name: s}]
    starter_code: |
      class Solution:
          def assignIndices(self, g: List[int], s: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3], [1, 1]], expected: [0, -1, -1]}
      - {args: [[1, 2], [1, 2, 3]], expected: [0, 1]}
      - {args: [[2, 3, 4], [1, 2, 3, 5]], expected: [1, 2, 3]}
      - {args: [[5], [1, 2]], expected: [-1]}
    solution: |
      class Solution:
          def assignIndices(self, g: List[int], s: List[int]) -> List[int]:
              result = [-1] * len(g)
              child = 0
              for j in range(len(s)):
                  if child < len(g) and s[j] >= g[child]:
                      result[child] = j
                      child += 1
              return result
    hint: "Loop over cookies; `child` advances only inside the `if s[j] >= g[child]` branch."

  - title: Who goes home hungry?
    skill: edge
    goal: Sort both inputs yourself and read the unfed children off the child pointer when cookies run out.
    instructions: |
      `g` and `s` are **unsorted**. Run the greedy match and return the greed values of the
      children who get **no** cookie, in ascending order.

      Two details people get wrong: forgetting to sort (the greedy is only safe on sorted
      lists), and handling the end. When the cookies run out, every child from the child
      pointer onward is unfed, including the case where `s` is empty and nobody is fed.
    function:
      name: unfedChildren
      params: [{name: g}, {name: s}]
    starter_code: |
      class Solution:
          def unfedChildren(self, g: List[int], s: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[3, 1, 2], [1, 1]], expected: [2, 3]}
      - {args: [[2, 1], [3, 1, 2]], expected: []}
      - {args: [[4, 2], []], expected: [2, 4], note: no cookies}
      - {args: [[10, 9, 8, 7], [8, 7, 6, 5]], expected: [9, 10]}
    solution: |
      class Solution:
          def unfedChildren(self, g: List[int], s: List[int]) -> List[int]:
              g, s = sorted(g), sorted(s)
              child = 0
              for size in s:
                  if child < len(g) and size >= g[child]:
                      child += 1
              return g[child:]
    hint: "After the loop, `child` counts the fed children, so the unfed ones are exactly `g[child:]`."

hints:
  - >-
    Think about the least greedy child. Which cookie should they get: the biggest one, or the
    smallest one that still makes them happy? What do you lose with the other choice?
  - >-
    Sort both lists. Keep one pointer on the least greedy unfed child and walk through the
    cookies from smallest. If the cookie satisfies that child, feed them and move both
    pointers; if not, the cookie is useless to everyone, so move only the cookie pointer.
  - |
    sort g, sort s
    child = 0
    for each size in s (smallest first):
        if child < len(g) and size >= g[child]:
            child = child + 1
    return child

solution:
  code: |
    class Solution:
        def findContentChildren(self, g: List[int], s: List[int]) -> int:
            g.sort()
            s.sort()
            child = 0  # least greedy child not yet fed
            for cookie in s:  # smallest cookie first
                if child < len(g) and cookie >= g[child]:
                    child += 1  # feed this child with the smallest sufficient cookie
            return child
  explanation: |
    After sorting, walk the cookies from smallest to largest while `child` points at the
    least greedy child who hasn't been fed. If the cookie is big enough, that child takes it
    and `child` moves on. If it isn't, the cookie is too small for this child and, because
    `g` is sorted, for every child after them too, so it's discarded.

    **Why greedy is safe (exchange argument).** Take any optimal assignment. Suppose it feeds
    the least greedy child with some cookie `B` instead of the smallest sufficient cookie
    `A`. If `A` was unused, swap: give the child `A`. If `A` went to another child `X`, swap
    `A` and `B` between them: the least greedy child is fine with `A`, and `X` needed at
    most `A`, so `X` is fine with the larger `B`. The count is unchanged, so there's always
    an optimal answer that makes our greedy first move, and the same argument repeats on
    what's left.

    `child` doubles as the answer: it counts exactly the children fed. Sizes equal to greed
    count as content, hence `>=`, and an empty `s` just skips the loop and returns 0.
  time: O(N log N + M log M) — the two sorts dominate; the matching pass is O(N + M)
  space: O(1) extra beyond the in-place sorts (Python's Timsort may use up to O(N + M) scratch)
  brute_force_code: |
    class Solution:
        def findContentChildren(self, g: List[int], s: List[int]) -> int:
            used = [False] * len(s)

            def best(i):
                if i == len(g):
                    return 0
                result = best(i + 1)  # child i gets nothing
                for j in range(len(s)):
                    if not used[j] and s[j] >= g[i]:
                        used[j] = True
                        result = max(result, 1 + best(i + 1))
                        used[j] = False
                return result

            return best(0)

pitch_script: |
  **(Clarify)** "Each child gets at most one cookie, each cookie goes to at most one child,
  and a cookie works if its size is at least the greed factor, so equal is fine? The lists
  aren't sorted, and I can reorder them?"

  **(Brute force)** "The brute force tries every assignment with backtracking: for each
  child, skip them or give them any unused cookie that fits. That's exponential, so it's
  only useful as a correctness check."

  **(Trigger)** "'Maximum number of' matches where each item is used once and the test is
  just size ≥ need tells me to think greedy with sorting. The least greedy child is the
  easiest to please, so I should please them with the smallest cookie that works and keep
  the big cookies for greedier kids."

  **(Optimal)** "I sort both arrays and walk the cookies from smallest, with a pointer on
  the least greedy unfed child. If the cookie fits, that child is fed and the pointer moves.
  If it doesn't fit, it can't fit anyone after them either, so I drop it. Why is this safe?
  Exchange argument: in any optimal plan, if that child got a bigger cookie, I can swap in
  the smallest sufficient one, and whoever had it can take the bigger one, so the count
  never gets worse."

  **(Complexity)** "Sorting is O(N log N + M log M) and the scan is O(N + M), so sorting
  dominates. Extra space is O(1) apart from what the sort itself uses."

twist:
  lc: 2410
  title: Maximum Matching of Players With Trainers
  why: >-
    Identical shape with new names: players have abilities, trainers have capacities, and each
    trainer can train one player whose ability is at most its capacity. Sort both, walk two
    pointers, give each player the smallest trainer that fits. If you can explain why the cookie
    greedy is safe, the same exchange argument proves this one.

