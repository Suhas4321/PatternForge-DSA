slug: sql-lost-update-optimistic-lock
lc: 9322
citadel_id: sql_dbms
brick_layer: 4
runner_type: sql_sqlite
concept:
  problem_it_solves: When two concurrent transactions read the same inventory item at stock = 10, both subtract 1 and write
    stock = 9 back, losing one update! Optimistic Concurrency Control (OCC) solves this by appending a `version` column to
    the record. When updating, the client specifies the version it read (`WHERE id = 1 AND version = client_version`). If
    another transaction incremented the version first, the update affects 0 rows, preventing the lost update.
  brute_force: Pessimistic table locking (`LOCK TABLES Inventory WRITE`), serializing all reads and crippling database throughput.
  brute_force_complexity: High lock contention and severe latency bottlenecks under concurrent traffic.
  key_insight: Checking `client_version = current_version` verifies that no intervening transaction modified the row since
    it was read, allowing safe commits while rejecting stale versions.
  real_world: E-commerce checkout stock decrements, flight seat reservation, and Google Docs collaborative editing.
statement:
  clean: "Write a SQL query to simulate optimistic locking and lost update detection on inventory purchase orders.\n\nTable\
    \ schemas:\n```sql\nCREATE TABLE Inventory (\n    id INTEGER PRIMARY KEY,\n    product TEXT,\n    stock INTEGER,\n   \
    \ version INTEGER\n);\n\nCREATE TABLE PurchaseOrders (\n    order_id INTEGER PRIMARY KEY,\n    product_id INTEGER,\n \
    \   quantity INTEGER,\n    client_version INTEGER\n);\n```\n\nEvaluation Rules:\n1. Join `PurchaseOrders po` with `Inventory\
    \ i` on `po.product_id = i.id`.\n2. Compare `po.client_version` against `i.version`:\n   - If `po.client_version = i.version`:\
    \ update is safe, `outcome = 'SUCCESS_COMMITTED'`.\n   - If `po.client_version != i.version`: lost update collision detected,\
    \ `outcome = 'REJECTED_STALE_VERSION'`.\n3. Return columns:\n   - `order_id`\n   - `product`\n   - `quantity`\n   - `client_version`\n\
    \   - `current_version`: aliased from `i.version`\n   - `outcome`\n\nOrder by `po.order_id` ascending."
  oa_story: '**KiranaKart Flash Sale — Concurrency Collision Audit**


    During a 60-second flash sale for 10 flagship smartphones, 5,000 customers checked out simultaneously. Two users both
    submitted order forms showing stock version 1. The database processed both requests, selling 11 units when only 10 existed
    in the warehouse.


    Implement this optimistic locking query to reject stale versions and prove how version-checked updates prevent lost updates
    under concurrency.'
  trigger_keywords:
  - optimistic locking and lost update
  - Inventory
  - PurchaseOrders
  examples:
  - input: 'Inventory: [(1, ''Laptop'', 10, 1)]; PurchaseOrders: [(101, 1, 1, 1), (102, 1, 1, 2)]'
    output: '[(101, ''Laptop'', 1, 1, 1, ''SUCCESS_COMMITTED''), (102, ''Laptop'', 1, 1, 2, ''REJECTED_STALE_VERSION'')]'
    explanation: Order 101 matches current version 1 (committed). Order 102 expects version 2 when current is 1 (rejected).
  constraints:
  - 1 <= len(Inventory) <= 1000
  - 1 <= len(PurchaseOrders) <= 1000
constraint_quiz:
  prompt: How does Optimistic Concurrency Control (OCC) prevent the Lost Update anomaly without holding long database locks?
  options:
  - By verifying that the row's version number in the database has not changed since the client read it
  - By forcing all database clients to disconnect during writes
  - By making the database read-only
  - By using Redis instead of SQL
  answer: 0
  explanation: Optimistic locking checks `WHERE id = ? AND version = ?`. If another transaction already committed and bumped
    the version, the update affects 0 rows, signaling a collision.
pattern_quiz:
  prompt: When is Optimistic Locking preferred over Pessimistic Locking (`SELECT FOR UPDATE`)?
  options:
  - When read operations far outnumber write operations and lock conflicts are infrequent
  - When write conflicts occur on 99% of transactions
  - Only when tables have fewer than 10 rows
  - When tables lack primary keys
  answer: 0
  explanation: Optimistic locking avoids locking overhead during reads, making it ideal for high-read, low-contention workloads.
schema_sql: "CREATE TABLE Inventory (\n    id INTEGER PRIMARY KEY,\n    product TEXT,\n    stock INTEGER,\n    version INTEGER\n\
