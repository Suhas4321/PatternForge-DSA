slug: database-normalization
lc: 9304
citadel_id: sql_dbms
brick_layer: 4
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does storing department names and office locations inside the employee table cause data anomalies?"
    In an unnormalized table, if an engineering department changes its location, you must update 50,000 employee rows!
    If one row is missed, data becomes inconsistent (Update Anomaly).
    If a department has no employees currently hired, you cannot record its existence without creating dummy employees (Insertion Anomaly).
    If the last employee leaves, the entire department is accidentally deleted (Deletion Anomaly).
  brute_force: >-
    Keeping all attributes in a single wide table (denormalization).
    While fast for simple reads, it creates massive data redundancy, storage bloat, and write anomalies.
  brute_force_complexity: O(1) reads, but O(N) expensive and risky multi-row updates.
  key_insight: >-
    Third Normal Form (3NF) states that every non-key attribute must depend on the primary key, the whole primary key,
    and nothing but the primary key ("so help me Codd").
    Because `dept_name` depends on `dept_id` rather than directly on `emp_id` (a Transitive Dependency),
    the table must be decomposed into two related tables: `employees` and `departments`.
  real_world: >-
    Relational database architecture, DynamoDB single-table design vs PostgreSQL schema normalization, and microservice domain modeling.

statement:
  clean: |
    Implement a schema decomposition algorithm using database normalization:
    `decompose_to_3nf(unnormalized: list[dict]) -> dict`.
    
    Given a list of unnormalized records containing transitive dependencies:
    `{"emp_id": int, "emp_name": str, "dept_id": int, "dept_name": str, "dept_location": str}`.
    
    Tasks:
    1. If `unnormalized` is empty, return `{"employees": [], "departments": []}`.
    2. Decompose the data into two 3NF-compliant relational tables:
       - `employees`: list of `{"emp_id": int, "emp_name": str, "dept_id": int}`.
       - `departments`: list of `{"dept_id": int, "dept_name": str, "dept_location": str}`.
    3. Ensure `departments` is deduplicated on `dept_id` so each department appears exactly once.
    4. Sort `employees` by `emp_id` ascending.
    5. Sort `departments` by `dept_id` ascending.
    6. Return `{"employees": employees_list, "departments": departments_list}`.
  oa_story: |
    **DynamoDB to PostgreSQL Migration — Normalizing Legacy Tables**
    
    In DynamoDB, we previously dumped raw JSON documents where department metadata was embedded inside employee documents.
    During our migration to PostgreSQL to eliminate 200ms scan latencies, the schema had to be normalized to 3NF
    with strict foreign key constraints.
    
    Build this decomposition function to extract normalized entities and eliminate transitive update anomalies.
  trigger_keywords: ["database normalization", "decompose_to_3nf", "unnormalized"]
  examples:
    - input: "unnormalized = [{'emp_id': 101, 'emp_name': 'Alex', 'dept_id': 1, 'dept_name': 'AI', 'dept_location': 'BLR'}, {'emp_id': 102, 'emp_name': 'Priya', 'dept_id': 1, 'dept_name': 'AI', 'dept_location': 'BLR'}]"
      output: "{'employees': [{'emp_id': 101, 'emp_name': 'Alex', 'dept_id': 1}, {'emp_id': 102, 'emp_name': 'Priya', 'dept_id': 1}], 'departments': [{'dept_id': 1, 'dept_name': 'AI', 'dept_location': 'BLR'}]}"
      explanation: "Department 1 is deduplicated into a single row in departments."
  constraints:
    - "unnormalized contains between 0 and 5,000 items"
    - "emp_id and dept_id are positive integers"

constraint_quiz:
  prompt: >-
    What type of dependency is eliminated when converting a table from Second Normal Form (2NF) to Third Normal Form (3NF)?
  options:
    - "Partial dependency on a composite key"
    - "Transitive dependency (where a non-key column depends on another non-key column)"
    - "Repeating groups / non-atomic values"
    - "Foreign key constraints"
  answer: 1
  explanation: >-
    3NF eliminates transitive dependencies (e.g. emp_id -> dept_id -> dept_name).

pattern_quiz:
  prompt: What phrase summarizes the essence of Boyce-Codd / 3NF Normalization?
  options:
    - "Every attribute depends on the key, the whole key, and nothing but the key"
    - "Keep all columns in a single table for maximum performance"
    - "Always use surrogate integer keys"
    - "Never use foreign keys"
  answer: 0
  explanation: >-
    This classic mnemonic by Bill Kent captures 1NF (the key), 2NF (the whole key), and 3NF (nothing but the key).

