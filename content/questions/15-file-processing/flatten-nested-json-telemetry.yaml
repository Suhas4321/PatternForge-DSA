drills:
  - title: Single-level nested dict unwrap
    skill: setup
    goal: Flatten a single dictionary with one level of nesting.
    instructions: |
      If a value is a dictionary, prepend its key and a period to its inner keys.
    function:
      name: flatten_one_level
      params: [{name: d}]
    starter_code: |
      class Solution:
          def flatten_one_level(self, d: dict) -> dict:
              pass
    tests:
      - {args: [{"a": {"x": 1, "y": 2}}], expected: {"a.x": 1, "a.y": 2}}
      - {args: [{"b": 10}], expected: {"b": 10}}
    solution: |
      class Solution:
          def flatten_one_level(self, d: dict) -> dict:
              res = {}
              for k, v in d.items():
                  if isinstance(v, dict):
                      for sub_k, sub_v in v.items():
                          res[f"{k}.{sub_k}"] = sub_v
                  else:
                      res[k] = v
              return res
    hint: "Check `if isinstance(v, dict):` and join keys with `f'{k}.{sub_k}'`."

  - title: Build compound prefix key
    skill: core
    goal: Create dot-delimited key names.
    instructions: |
      Return `f"{prefix}.{key}"` if `prefix` is non-empty, else return `key`.
    function:
      name: make_prefix_key
      params: [{name: prefix}, {name: key}]
    starter_code: |
      class Solution:
          def make_prefix_key(self, prefix: str, key: str) -> str:
              pass
    tests:
      - {args: ["meta", "env"], expected: "meta.env"}
      - {args: ["", "status"], expected: "status"}
    solution: |
      class Solution:
          def make_prefix_key(self, prefix: str, key: str) -> str:
              return f"{prefix}.{key}" if prefix else key
    hint: "Use `f'{prefix}.{key}' if prefix else key`."

  - title: Extract only primitive values
    skill: edge
    goal: Filter out nested dictionaries from top-level keys.
    instructions: |
      Return a dict containing only keys whose values are not dictionaries.
    function:
      name: filter_primitives
      params: [{name: d}]
    starter_code: |
      class Solution:
          def filter_primitives(self, d: dict) -> dict:
              pass
    tests:
      - {args: [{"a": 1, "b": {"c": 2}}], expected: {"a": 1}}
      - {args: [{"nested": {}}], expected: {}}
    solution: |
      class Solution:
          def filter_primitives(self, d: dict) -> dict:
              return {k: v for k, v in d.items() if not isinstance(v, dict)}
    hint: "Use dict comprehension with `if not isinstance(v, dict)`."

hints:
  - "Use a recursive helper `_flatten(current_dict, prefix)`."
  - "If `isinstance(v, dict)`, recurse with the new prefix `f'{prefix}.{k}' if prefix else k`."
  - "Otherwise, store `flat_dict[new_prefix] = v`."

solution:
  code: |
    class Solution:
        def flatten_telemetry(self, payload: dict) -> dict:
            flat = {}

            def _recurse(d: dict, prefix: str):
                for k, v in d.items():
                    key_name = f"{prefix}.{k}" if prefix else k
                    if isinstance(v, dict) and v:  # Non-empty dict -> recurse
                        _recurse(v, key_name)
                    elif isinstance(v, dict) and not v:
                        continue  # Skip empty dicts
                    else:
                        flat[key_name] = v

            _recurse(payload, "")
            return flat
  explanation: |
    The `_recurse` helper traverses the JSON tree using Depth-First Search.
    For each key-value pair, it constructs the composite dot-delimited key name.
    If the value is a nested dictionary, it dives deeper with the new prefix.
    When a leaf primitive is reached, it assigns the value directly into `flat`.
  time: O(N) where N is total nodes in the dictionary
  space: O(D) recursion stack where D is maximum nesting depth

pitch_script: |
  **(Clarify)** "We need to unwrap a hierarchical nested JSON object into a flat dictionary where compound keys are joined with dots."

  **(Basement Insight)** "Nested JSON payloads are tree structures. A recursive Depth-First Search naturally processes each branch, carrying the prefix accumulator down the call stack until reaching leaf primitive nodes."

  **(Solution)** "We implement `_recurse(d, prefix)`. For each key, we form `f'{prefix}.{k}' if prefix else k`. If the value is a nested dict, we recurse; otherwise we record it into the flattened output map."

  **(Complexity)** "Runs in O(N) time where N is the total number of keys, using O(D) recursion space proportional to nesting depth."

