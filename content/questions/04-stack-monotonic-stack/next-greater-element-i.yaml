solution:
  code: |
    class Solution:
        def nextGreaterElement(self, nums1: List[int], nums2: List[int]) -> List[int]:
            next_greater = {}  # value -> first greater value to its right in nums2
            stack = []  # values still waiting; decreasing from bottom to top
            for i, x in enumerate(nums2):
                while stack and stack[-1] < x:
                    next_greater[stack.pop()] = x
                stack.append(x)
            # values left on the stack never met a bigger value: default -1
            return [next_greater.get(v, -1) for v in nums1]
  explanation: |
    This is Daily Temperatures with two changes: the answer is the bigger **value** instead of
    a distance, and the questions come from a different array.

    The stack holds the values of nums2 that haven't seen anything bigger yet. They're
    decreasing from bottom to top, because a bigger value would already have popped the
    smaller ones beneath it. When `x` arrives, every smaller value on top has just met its
    first greater element to the right, and it's `x`. Pop them, record the answer, push `x`.

    Using the value itself as the map key is safe only because all values are unique. Values
    left on the stack at the end are never recorded, so `.get(v, -1)` supplies the `-1`. The
    comparison is strict `<` to match "greater"; with unique values it can't tie anyway.
  time: O(m + n) — each value of nums2 is pushed and popped at most once, and each query is an O(1) average lookup
  space: O(n) — the map and the stack each hold at most n values of nums2
  brute_force_code: |
    class Solution:
        def nextGreaterElement(self, nums1: List[int], nums2: List[int]) -> List[int]:
            ans = []
            for v in nums1:
                j = nums2.index(v)
                found = -1
                for k in range(j + 1, len(nums2)):
                    if nums2[k] > v:
                        found = nums2[k]
                        break
                ans.append(found)
            return ans

pitch_script: |
  **(Clarify)** "So for each value in nums1, I find it in nums2 and return the first strictly
  bigger value to its right, or -1. All values are unique and nums1 is a subset of nums2, so
  every query has a well-defined position, right?"

  **(Brute force)** "The direct way is: for each query, find its index in nums2 and scan right
  until something is bigger. That's O(m times n), and the follow-up asks for linear."

  **(Trigger)** "'Next greater element to the right' tells me monotonic stack, the same
  template as Daily Temperatures. Since many queries share one array, I'll precompute the
  answer for every element of nums2 and then just look queries up."

  **(Optimal)** "I scan nums2 with a stack of values that haven't found a bigger one yet.
  When a value x comes in, I pop every smaller value and record in a hash map that its next
  greater is x, then push x. Because values are unique I can key by value. Finally I map each
  value in nums1 through the dictionary, with -1 as the default for anything never popped."

  **(Complexity)** "Every element of nums2 is pushed and popped at most once, and each query is
  an O(1) lookup, so O(m plus n) time and O(n) space for the stack and the map."

twist:
  lc: 503
  title: Next Greater Element II
  why: >-
    The array becomes circular, so the next greater element can wrap around to the start,
    and values can repeat. Keep the same decreasing stack but store indices (so duplicates
    don't collide) and loop i from 0 to 2n − 1 using nums[i % n]; the second lap lets values
    near the end be answered by values near the start. Only push during the first lap.

