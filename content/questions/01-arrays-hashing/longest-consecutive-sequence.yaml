slug: longest-consecutive-sequence
lc: 128

concept:
  problem_it_solves: >-
    "How long is the longest unbroken run of values, ignoring the order they arrived in?"
    Sorting answers it, but costs O(N log N). A hash set lets you ask "does x + 1 exist?" in
    O(1), so you can walk each run directly without ever putting the array in order.
  brute_force: >-
    For every value x, keep checking whether x + 1, x + 2, ... exist by scanning the array,
    and record the longest run. It wastes work twice over: each membership check is a full
    O(N) scan, and every element in the middle of a run starts its own walk, re-counting a
    tail that a smaller start already counted.
  brute_force_complexity: >-
    O(N³) time, O(1) space with list scans (O(N²) even with a set, if every element starts a
    walk) — 10⁵ elements means far more than 10¹⁰ steps.
  key_insight: >-
    Only start counting at the beginning of a run. A value x is a run start exactly when
    x − 1 is not in the set. Every run has one start, so every value is walked over at most
    once in total, and the whole thing is O(N) even though there is a while loop inside the
    for loop.
  real_world: >-
    Streak features (Duolingo, fitness apps, GitHub contribution graphs) compute the longest
    run of consecutive active days from an unordered set of activity dates. Message brokers
    such as Kafka consumers and TCP receivers do the same thing with sequence numbers to find
    the longest contiguous block received so far, and gap detection in ID allocators uses the
    "is x − 1 present?" check to find where ranges begin.

statement:
  clean: |
    Given an **unsorted array** of integers `nums`, return the length of the
    **longest consecutive elements sequence**: the largest set of values
    `x, x + 1, x + 2, ...` that all appear in `nums`. The elements do not need to be
    adjacent in the array, and duplicates count only once.

    You must write an algorithm that runs in **O(n) time**.
  oa_story: |
    **FitMitra Health — OA Round 1**

    FitMitra's Bengaluru growth team wants to reward users who show up day after day. Every
    time a user's watch syncs, it uploads the day numbers on which a workout was logged.
    Syncs from the phone, the watch and the gym kiosk at Koramangala all arrive at different
    times, so the uploaded list is in no particular order and the same day can appear more
    than once.

    For the "Unbroken Streak" badge, the backend must report the length of the user's
    longest streak: the most days in a row (day d, d + 1, d + 2, ...) on which at least one
    workout was logged. An empty upload means a streak of 0. Some power users have 10⁵
    entries, and the leaderboard refresh has a strict linear-time budget.
  trigger_keywords: ["unsorted array", "longest consecutive elements sequence", "O(n) time"]
  examples:
    - input: "nums = [100,4,200,1,3,2]"
      output: "4"
      explanation: "The longest consecutive sequence is [1, 2, 3, 4], so its length is 4."
    - input: "nums = [0,3,7,2,5,8,4,6,0,1]"
      output: "9"
      explanation: "0 through 8 are all present (0 appears twice but counts once)."
    - input: "nums = [1,0,1,2]"
      output: "3"
  constraints:
    - "0 <= nums.length <= 10^5"
    - "-10^9 <= nums[i] <= 10^9"

constraint_quiz:
  prompt: >-
    N can be 10⁵ and the statement explicitly demands O(n) time. What time complexity should
    you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) is 10¹⁰ steps at N = 10⁵, far too slow. Sorting and then scanning for runs is
    O(N log N): it would pass the time limit, but it violates the stated O(n) requirement and
    an interviewer will push you past it. A hash set gives O(N). O(log N) is impossible
    because every element must be read at least once.

pattern_quiz:
  prompt: >-
    You need the longest run of consecutive values in an unsorted array, in O(n). Which
    pattern fits?
  options:
    - "Sort, then scan adjacent elements"
    - "Hash set + only start counting where x − 1 is missing"
    - "Sliding window over the original array"
    - "Two pointers from both ends"
  answer: 1
  explanation: >-
    "Consecutive" here is about values, not positions, so sliding windows and two pointers
    over the original order are meaningless. Sorting works but is O(N log N), ruled out by
    "O(n) time". "Does the neighbouring value exist?" is a membership question, which is a
    hash set; the sequence-start check (x − 1 absent) is what keeps it linear.

