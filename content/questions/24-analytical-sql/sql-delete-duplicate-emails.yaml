slug: sql-delete-duplicate-emails
lc: 9318
citadel_id: sql_dbms
brick_layer: 3
runner_type: sql_sqlite
concept:
  problem_it_solves: When an application bug inserts duplicate user or contact rows with identical emails, how do data engineers
    identify and purge the redundant duplicate rows while keeping the original account? In SQL, grouping by the unique key
    (email) finds the minimum `id` (`SELECT MIN(id) FROM Contacts GROUP BY email`). Any record whose `id` is NOT in that minimum
    set is a redundant duplicate to be purged.
  brute_force: Exporting the entire table into Python, deduplicating with a dictionary, dropping the table, and re-importing
    all rows.
  brute_force_complexity: Severe downtime, table locks, and memory exhaustion.
  key_insight: A subquery with `MIN(id) GROUP BY email` identifies the single survivor for each duplicate group. Filtering
    with `id NOT IN (...)` isolates the exact rows to delete.
  real_world: LeetCode 196 (Delete Duplicate Emails), CRM customer deduplication, and database cleanup scripts.
statement:
  clean: "Write a SQL query to identify and isolate duplicate contact records that should be purged, keeping only the entry\
    \ with the lowest id.\n\nTable schema:\n```sql\nCREATE TABLE Contacts (\n    id INTEGER PRIMARY KEY,\n    name TEXT,\n\
    \    email TEXT\n);\n```\n\nTask:\nIdentify all rows that have a duplicate `email` and whose `id` is NOT the minimum `id`\
    \ for that email address.\n\nReturn columns: `id`, `name`, `email` ordered by `id` ascending."
  oa_story: '**KiranaKart Customer CRM — Duplicate Account Purge**


    A buggy mobile app signup screen allowed users to repeatedly click ''Submit'', creating multiple account entries with
    the identical email address under different user IDs.


    The CRM team needs to clean up the database by identifying all duplicate customer rows that should be purged, preserving
    only the original account with the lowest ID. Write the SQL query to locate these redundant rows.'
  trigger_keywords:
  - isolate duplicate contact records
  - Contacts
  - lowest id
  examples:
  - input: 'Contacts: [(1, ''Aarav'', ''a@test.in''), (2, ''Priya'', ''p@test.in''), (3, ''Aarav Dup'', ''a@test.in'')]'
    output: '[(3, ''Aarav Dup'', ''a@test.in'')]'
    explanation: Email 'a@test.in' has IDs 1 and 3. ID 1 is the lowest, so ID 3 is the duplicate to be purged.
  constraints:
  - 1 <= len(Contacts) <= 1000
  - id is a unique integer primary key
constraint_quiz:
  prompt: How does `WHERE id NOT IN (SELECT MIN(id) FROM Contacts GROUP BY email)` identify duplicate rows?
  options:
  - '`MIN(id) GROUP BY email` returns the earliest ID for each email; any row whose ID is NOT in this set is a duplicate'
  - It deletes all rows whose email contains '@'
  - It sorts the table by name
  - It counts the number of letters in each email
  answer: 0
  explanation: Because MIN(id) per email picks the single original record, any row with a higher ID for that email is excluded
    from the subquery and caught by NOT IN.
pattern_quiz:
  prompt: What window function alternative can also identify duplicate rows keeping the lowest id?
  options:
  - '`ROW_NUMBER() OVER (PARTITION BY email ORDER BY id) AS rn ... WHERE rn > 1`'
  - '`DENSE_RANK() OVER (ORDER BY id)`'
  - '`NTILE(4) OVER ()`'
  - '`LEAD(email) OVER ()`'
  answer: 0
  explanation: Assigning row numbers partitioned by email assigns 1 to the lowest id; filtering for `rn > 1` isolates all
    duplicates.
