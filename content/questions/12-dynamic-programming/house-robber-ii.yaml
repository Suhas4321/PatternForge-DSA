tests:
  - {args: [[2, 3, 2]], expected: 3}
  - {args: [[1, 2, 3, 1]], expected: 4}
  - {args: [[1, 2, 3]], expected: 3}
  - {args: [[5]], expected: 5, note: "one house: both slices would be empty, so handle it first"}
  - {args: [[1, 7]], expected: 7, note: "two houses are neighbours on both sides"}
  - {args: [[200, 3, 140, 20, 10]], expected: 340, note: "the linear answer 350 uses both ends"}
  - {args: [[2, 1, 1, 2]], expected: 3, note: "linear best is 2 + 2 at the two ends, which now touch"}
  - {args: [[5, 1, 1, 5]], expected: 6, note: "patching the linear answer gives 5; re-solving gives 5 + 1"}
  - {args: [[4, 1, 2, 7, 5, 3, 1]], expected: 14, note: "the best line plan already avoids the seam"}
visualize_test: 1

drills:
  - title: Linear robber on a slice
    skill: setup
    goal: Run the linear take-or-skip table on nums[lo..hi] with the index offset written correctly.
    instructions: |
      Return the most money you can rob from the **straight line** of houses
      `nums[lo..hi]` (both inclusive). If `lo > hi` the line is empty and the answer is 0.

      The circular problem is solved by running the linear robber on two different stretches
      of the same array, so you need it as a reusable piece that works on any range. Use a
      table of length `hi - lo + 2` where `dp[k]` is the best from the first `k` houses of
      the stretch; house `k` of the stretch is `nums[lo + k - 1]`. Slicing (`nums[lo:hi+1]`)
      also works, but writing the offset yourself is the skill that transfers to languages
      without cheap slices.
    function:
      name: robRange
      params: [{name: nums}, {name: lo}, {name: hi}]
    starter_code: |
      class Solution:
          def robRange(self, nums: List[int], lo: int, hi: int) -> int:
              pass
    tests:
      - {args: [[2, 7, 9, 3, 1], 1, 3], expected: 10, note: "7 + 3 from [7, 9, 3]"}
      - {args: [[2, 7, 9, 3, 1], 0, 4], expected: 12, note: "the whole array"}
      - {args: [[5, 1, 1, 5], 1, 2], expected: 1}
      - {args: [[4, 1, 2], 2, 2], expected: 2, note: "a single house"}
      - {args: [[1, 2], 1, 0], expected: 0, note: "empty range"}
    solution: |
      class Solution:
          def robRange(self, nums: List[int], lo: int, hi: int) -> int:
              dp = [0] * (hi - lo + 2)  # dp[k] = best from the first k houses of nums[lo..hi]
              for k in range(1, hi - lo + 2):
                  take = (dp[k - 2] if k >= 2 else 0) + nums[lo + k - 1]
                  dp[k] = max(dp[k - 1], take)
              return dp[hi - lo + 1]
    hint: "The stretch has `hi - lo + 1` houses; the k-th of them (1-based) sits at `nums[lo + k - 1]`."

  - title: Break the circle into two lines
    skill: core
    goal: Compute both cases of the case split, "without the last house" and "without the first house".
    instructions: |
      `nums` has at least 2 houses on a circle. Return `[a, b]` where `a` is the best linear
      robbery of `nums[:-1]` (the last house is never robbed) and `b` is the best linear
      robbery of `nums[1:]` (the first house is never robbed).

      This is the whole idea of House Robber II. Any valid circular plan leaves out the first
      house or the last house, so it is counted in `a` or in `b`, and neither line contains
      both ends, so neither can break the circle rule. The answer is `max(a, b)`. Use a
      rolling take/skip pair for the line this time, to practise the O(1)-space form.
    function:
      name: bothCases
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def bothCases(self, nums: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[2, 3, 2]], expected: [3, 3]}
      - {args: [[1, 2, 3, 1]], expected: [4, 3]}
      - {args: [[200, 3, 140, 20, 10]], expected: [340, 150]}
      - {args: [[1, 7]], expected: [1, 7], note: "each line is a single house"}
      - {args: [[2, 1, 1, 2]], expected: [3, 3]}
    solution: |
      class Solution:
          def bothCases(self, nums: List[int]) -> List[int]:
              def line(houses):
                  take, skip = 0, 0
                  for x in houses:
                      take, skip = skip + x, max(take, skip)
                  return max(take, skip)

              return [line(nums[:-1]), line(nums[1:])]
    hint: "`nums[:-1]` drops the last house and `nums[1:]` drops the first; run the same line DP on each."

  - title: Fix the seam house yourself
    skill: edge
    goal: Get the slice boundaries right when house 0 is forced into the plan, including n = 1, 2 and 3.
    instructions: |
      Return the most money you can rob from the circle **given that house 0 must be
      robbed**.

      This is the other way to split a circle: "house 0 taken" vs "house 0 skipped".
      If house 0 is taken, both its neighbours, house 1 and house `n - 1`, are off-limits, so
      the rest of the plan is a linear robbery of `nums[2..n-2]`. The edge cases are all in
      that range: for `n = 1, 2, 3` it is empty, and an off-by-one includes a neighbour of
      house 0. (The full answer would be `max(this, linear robbery of nums[1:])`.)
    function:
      name: robCircleTakeFirst
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def robCircleTakeFirst(self, nums: List[int]) -> int:
              pass
    tests:
      - {args: [[2, 3, 2]], expected: 2, note: "both other houses are neighbours of house 0"}
      - {args: [[1, 2, 3, 1]], expected: 4, note: "only house 2 is left: 1 + 3"}
      - {args: [[5]], expected: 5}
      - {args: [[5, 1]], expected: 5}
      - {args: [[1, 5, 1, 10, 1]], expected: 11, note: "1 + 10 from the middle stretch [1, 10]"}
      - {args: [[200, 3, 140, 20, 10]], expected: 340}
    solution: |
      class Solution:
          def robCircleTakeFirst(self, nums: List[int]) -> int:
              inner = nums[2:len(nums) - 1]  # houses 1 and n - 1 are house 0's neighbours
              prev2, prev1 = 0, 0
              for x in inner:
                  prev2, prev1 = prev1, max(prev1, prev2 + x)
              return nums[0] + prev1
    hint: "Write down which indices are still allowed once house 0 is taken, then check that slice for n = 1, 2, 3."

hints:
  - >-
    The circle only adds one new rule compared with House Robber: the first and last house
    can't both be robbed. In any valid plan, what can you say for certain about at least one
    of those two houses?
  - >-
    Every valid plan skips house 0 or skips house n − 1. So the answer is the better of the
    linear robber on nums[1:] and the linear robber on nums[:-1]. With a single house both
    slices are empty, so return nums[0] first.
  - |
    if n == 1: return nums[0]
    rob_line(houses):
        dp = len(houses) + 1 zeros, dp[1] = houses[0]
        for i from 2 to len(houses):
            dp[i] = max(dp[i - 1], dp[i - 2] + houses[i - 1])
        return dp[len(houses)]
    return max(rob_line(nums without last), rob_line(nums without first))

solution:
  code: |
    class Solution:
        def rob(self, nums: List[int]) -> int:
            if len(nums) == 1:
                return nums[0]  # one house has no neighbour to clash with

            def rob_line(houses):
                # dp[i] = most money from the first i houses of this straight line
                dp = [0] * (len(houses) + 1)
                dp[1] = houses[0]
                for i in range(2, len(houses) + 1):
                    # skip house i - 1, or take it and skip its neighbour
                    dp[i] = max(dp[i - 1], dp[i - 2] + houses[i - 1])
                return dp[len(houses)]

            # house 0 and house n - 1 touch, so every valid plan leaves out at least one of them
            return max(rob_line(nums[:-1]), rob_line(nums[1:]))
  explanation: |
    **Turn the circle into lines.** The only difference from House Robber is that house 0
    and house `n - 1` are now neighbours. A valid plan can't rob both, so it leaves out
    house `n - 1` (then it's a plan for the line `nums[0..n-2]`) or leaves out house 0 (a plan
    for `nums[1..n-1]`). Each line is an ordinary House Robber with no seam. Every circular
    plan is valid in at least one of the two lines, and every line plan is valid on the
    circle, so `max` of the two is exactly the answer.

    **The recipe inside `rob_line`** is the House Robber one:

    1. **State.** `dp[i]` = most money from the first `i` houses of this line (`n + 1` cells,
       so `dp[0]` = no houses).
    2. **Recurrence.** Skip house `i - 1` (`dp[i - 1]`) or take it and skip its neighbour
       (`dp[i - 2] + houses[i - 1]`); take the max.
    3. **Base cases.** `dp[0] = 0`, `dp[1] = houses[0]`.
    4. **Fill order.** `i = 2 .. len(houses)`, left to right.
    5. **Answer.** `dp[len(houses)]`; then the outer answer is the max over the two lines.

    **Edge case: one house.** With `n = 1` both slices are empty, but the single house is
    its own "first and last" and is perfectly safe to rob, so return `nums[0]` up front.
    (Without that check, `rob_line([])` would crash on `houses[0]`.) Two houses work
    without special handling: each slice is one house, and the max picks the richer one.

    **Why not fix the linear answer?** On `[5, 1, 1, 5]` the line answer takes both 5s.
    Dropping one end gives 5, but the true answer is 6 (5 + 1): once an end is excluded, the
    rest of the plan should re-optimise. That's why we re-run the DP on each line instead of
    patching one result.

    Each line DP is O(N) and can be rolled into two variables for O(1) space, as in House
    Robber. A memoised recursion would need a flag for "house 0 was taken", which is why the
    case split is the cleaner way to think about it.
  time: O(N) — two linear passes of N − 1 houses each
  space: O(N) — the slices and the dp table (O(1) with rolling variables and index ranges)
  brute_force_code: |
    class Solution:
        def rob(self, nums: List[int]) -> int:
            n = len(nums)
            best = 0
            for mask in range(1 << n):  # every subset of houses
                if mask & (mask >> 1):
                    continue  # two neighbours in a row
                if n > 1 and mask & 1 and mask >> (n - 1) & 1:
                    continue  # first and last house touch on the circle
                best = max(best, sum(nums[i] for i in range(n) if mask >> i & 1))
            return best

pitch_script: |
  **(Clarify)** "Same as House Robber, but the houses form a circle, so the first and last
  are neighbours. Amounts are non-negative, there's at least one house, and with a single
  house I can just rob it. Right?"

  **(Brute force)** "I could try every subset and reject the ones with neighbours, including
  the wraparound pair. That's 2 to the n subsets, which is far too many for 100 houses."

  **(Trigger)** "It's still take-or-skip DP. The only new thing is one extra constraint, the
  first and last house can't both be taken, and a single binary constraint like that is
  handled with a case split rather than a new DP."

  **(Optimal)** "Any valid plan skips the first house or the last house. So I run the normal
  linear House Robber on nums without the last house, and again on nums without the first
  house, and return the larger. Inside, dp of i is the best from the first i houses of that
  line: max of dp of i minus 1, or dp of i minus 2 plus the current house. I return nums of
  0 directly when there's one house, since both slices would be empty."

  **(Complexity)** "Two O(N) passes, so O(N) time. O(N) space as written; with two rolling
  variables and index bounds instead of slices, it's O(1)."

twist:
  lc: 337
  title: House Robber III
  why: >-
    Now the houses form a binary tree and you can't rob a parent and its child together.
    There is no left-to-right order, so the table becomes a post-order recursion: each node
    returns a pair (best if I rob this node, best if I don't). Robbing the node adds its value
    to its children's "not robbed" totals; skipping it adds the better of each child's two
    totals. It's the take/skip two-state idea from the core drill of House Robber, moved onto
    a tree.

