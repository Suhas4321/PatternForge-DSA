slug: maximum-average-subarray-i
lc: 643

concept:
  problem_it_solves: >-
    "Of all the contiguous stretches of exactly k elements, which one is best?" Neighbouring
    stretches overlap in k − 1 elements, so recomputing each one from scratch re-adds almost
    everything. A sliding window keeps one running sum and updates it with the single element
    that enters and the single element that leaves.
  brute_force: >-
    For every start i, add up nums[i..i+k−1] with a fresh loop (or sum() on a slice) and keep
    the largest total. Moving the start by one throws away a sum that was correct for k − 1 of
    the k elements, then adds those same k − 1 elements again.
  brute_force_complexity: >-
    O(N·K) time, O(1) space — with N = 10⁵ and k = 5 × 10⁴ that is about 2.5 × 10⁹ additions.
  key_insight: >-
    Don't recompute the window, update it. When the window slides one step right, exactly one
    element enters (nums[r]) and exactly one leaves (nums[l]), so new_sum = old_sum + nums[r]
    − nums[l]: O(1) per step. And because k is fixed, the window with the biggest sum is the
    window with the biggest average, so compare sums and divide by k once at the very end.
  real_world: >-
    Monitoring systems (Prometheus, Grafana, Datadog) compute "average latency over the last
    5 minutes" by adding the newest sample and dropping the oldest, never by re-scanning the
    whole window. Trading charts on apps like Zerodha Kite draw 20-day and 50-day moving
    averages the same way, and rate limiters keep running counts over a fixed time window.

statement:
  clean: |
    You are given an integer array `nums` consisting of `n` elements, and an integer `k`.

    Find a **contiguous subarray** whose **length is equal to k** that has the
    **maximum average value**, and return this value. Any answer with a calculation error
    less than `10^-5` will be accepted.
  oa_story: |
    **ScoopSaathi — OA Round 1**

    ScoopSaathi delivers ice cream across Indiranagar and Koramangala from one cloud kitchen.
    Every hour the kitchen logs its net margin in rupees: positive when orders pour in, and
    negative when a freezer hiccup forces them to bin melted tubs. The hourly numbers for the
    day are stored in order.

    The ops team can afford one extra rider for a shift of exactly `k` back-to-back hours, and
    wants to place that shift where the kitchen historically does best. Given the hourly
    margins and `k`, return the highest possible average margin per hour over any block of
    `k` consecutive hours (answers within `10^-5` are accepted). A day's log can hold up to
    100,000 entries, so the check has to run in a single pass.
  trigger_keywords: ["contiguous subarray", "length is equal to k", "maximum average"]
  examples:
    - input: "nums = [1,12,-5,-6,50,3], k = 4"
      output: "12.75000"
      explanation: "The window [12,-5,-6,50] sums to 51, and 51 / 4 = 12.75. No other window of length 4 does better."
    - input: "nums = [5], k = 1"
      output: "5.00000"
  constraints:
    - "n == nums.length"
    - "1 <= k <= n <= 10^5"
    - "-10^4 <= nums[i] <= 10^4"

constraint_quiz:
  prompt: >-
    N can be 10⁵ and k can be anywhere from 1 to N. What time complexity should you aim for?
  options: ["O(N·K)", "O(N log N)", "O(N)", "O(K)"]
  answer: 2
  explanation: >-
    O(N·K) looks fine when k is tiny, but k is allowed to be ~N/2, which gives ~2.5 × 10⁹
    additions. O(N log N) would pass, but there is nothing to sort, and sorting would destroy
    contiguity anyway. O(N) is achievable because each slide costs one add and one subtract.
    O(K) is impossible: when k = 1 you still have to read all N elements to find the best one.

pattern_quiz:
  prompt: >-
    Every candidate is a contiguous block of exactly k elements, and consecutive blocks overlap
    in k − 1 elements. Which pattern fits?
  options:
    - "Sort the array and average the k largest values"
    - "Fixed-size sliding window with a running sum"
    - "Monotonic stack"
    - "Binary search on the answer"
  answer: 1
  explanation: >-
    Sorting picks the k largest values, but they are usually not next to each other, so the
    answer must stay contiguous. A monotonic stack answers "next greater" questions, not range
    totals. Binary search on the average is the tool for the Hard follow-up (#644) where the
    length is "at least k"; with a fixed length it is overkill. "Contiguous" plus "length
    exactly k" is the textbook fixed-window trigger: keep one running sum and slide it.

function:
