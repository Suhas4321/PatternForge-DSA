slug: majority-element
lc: 169

concept:
  problem_it_solves: >-
    "Which value occurs more often than everything else put together?" The obvious tool is a
    frequency map, which costs O(N) memory. But a value that owns more than half the array
    can't be outvoted, and that lets you find it with just two variables.
  brute_force: >-
    For each element, loop over the whole array again and count its copies, returning the
    first one whose count exceeds n / 2. Every copy of the same value recounts the same
    array from scratch, so the work repeats once per element.
  brute_force_complexity: O(N²) time, O(1) space — 5 × 10⁴ elements means up to 2.5 × 10⁹ comparisons.
  key_insight: >-
    Pair each element with a *different* element and cancel both. Every cancellation removes
    at most one copy of the majority but always removes one non-majority element, and the
    majority has more copies than all others combined, so it is the only value that can be
    left standing. Boyer-Moore voting does this pairing on the fly with one candidate and
    one counter.
  real_world: >-
    Boyer-Moore's generalisation, the Misra-Gries algorithm, finds "heavy hitters" in streams
    with a fixed number of counters. Network monitoring and DDoS detection use it to spot the
    one IP sending most of the traffic through a router or CDN edge, where keeping a counter
    per IP would blow the memory budget.

statement:
  clean: |
    Given an array `nums` of size `n`, return the **majority element**.

    The majority element is the element that appears **more than ⌊n / 2⌋ times**. You may
    assume that the majority element **always exists** in the array.

    **Follow-up:** could you solve it in linear time and O(1) extra space?
  oa_story: |
    **DabbaDash Cloud Kitchens — OA Round 2**

    DabbaDash runs a cloud kitchen in HSR Layout, and the order tablet at the pass logs the
    dish ID of every ticket during the lunch rush. On rush days one dish, the office-crowd
    favourite, is ordered on **more than half** of all tickets, and the kitchen wants the
    tablet to flash that dish ID so the line cooks can batch it.

    You get the list of dish IDs for the rush, in order. The dominant dish is guaranteed to
    exist. The tablet's firmware leaves only a couple of integer registers free for this
    feature, so the head of engineering wants the check to run in a single pass without
    building any lookup table. Return the dish ID.
  trigger_keywords: ["majority element", "more than ⌊n / 2⌋ times", "always exists"]
  examples:
    - input: "nums = [3,2,3]"
      output: "3"
      explanation: "n = 3, so the majority must appear more than 1 time. 3 appears twice."
    - input: "nums = [2,2,1,1,1,2,2]"
      output: "2"
      explanation: "2 appears 4 times out of 7."
  constraints:
    - "n == nums.length"
    - "1 <= n <= 5 * 10^4"
    - "-10^9 <= nums[i] <= 10^9"
    - "The majority element always exists."

constraint_quiz:
  prompt: >-
    N can be 5 × 10⁴ and the follow-up asks for linear time and O(1) extra space. What should
    you aim for?
  options:
    - "O(N²) time, O(1) space"
    - "O(N log N) time, O(1) space"
    - "O(N) time, O(N) space"
    - "O(N) time, O(1) space"
  answer: 3
  explanation: >-
    O(N²) is ~2.5 × 10⁹ comparisons, far too slow. Sorting and returning nums[n // 2] is
    correct (the majority must cover the middle) but O(N log N) isn't linear. A hash map of
    counts is O(N) time but uses O(N) space, breaking the follow-up. Boyer-Moore voting hits
    both targets: one pass, two variables.

pattern_quiz:
  prompt: Which technique finds the majority element in one pass with O(1) extra space?
  options:
    - "Hash map of value → count"
    - "Sort and return nums[n // 2]"
    - "Boyer-Moore voting (one candidate + one counter)"
    - "Two pointers from both ends"
  answer: 2
  explanation: >-
    All of the first three find the right answer, but only one meets the follow-up. The
    hash map is O(N) space, sorting is O(N log N) time, and two pointers has no meaning on
    unsorted data here. "More than ⌊n / 2⌋ times" plus "always exists" is the Boyer-Moore
    trigger: a value that beats everyone else combined survives pairwise cancellation.

