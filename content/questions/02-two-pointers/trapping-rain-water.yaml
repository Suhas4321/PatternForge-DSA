slug: trapping-rain-water
lc: 42

concept:
  problem_it_solves: >-
    "How much water sits on top of each bar?" Water above bar i rises to the lower of the
    tallest wall on its left and the tallest wall on its right, so the answer is a sum of
    min(maxLeft, maxRight) − height[i]. The whole problem is getting those two maxima for
    every bar cheaply: prefix/suffix arrays do it in O(N) space, and two pointers do it in
    O(1) by noticing you only ever need the smaller of the two.
  brute_force: >-
    For every bar, scan all the way left for the tallest wall and all the way right for the
    tallest wall, then add min of the two minus the bar's height. Neighbouring bars share
    almost the same left and right scans, yet each bar redoes them from scratch.
  brute_force_complexity: O(N²) time, O(1) space — 2 × 10⁴ bars means about 4 × 10⁸ reads.
  key_insight: >-
    Water at i only depends on the *smaller* of maxLeft and maxRight. With l and r at the
    two ends and running maxima on each side, if height[l] < height[r] then the right side
    is already guaranteed to have a wall at least height[r], which is at least as tall as
    anything the left side has produced so far. So the left side is the bottleneck for bar l, its
    water is exactly left_max − height[l], and l can be settled and moved, without knowing
    the true maxRight. Mirror the argument when the right bar is the shorter one.
  real_world: >-
    Hydrology and GIS tools (flood-fill on digital elevation models, used by city drainage
    planners like Bengaluru's BBMP storm-water projects) compute exactly this "level is
    bounded by the lower rim" quantity. In systems work, the same running-max-from-both-
    sides idea appears in computing water marks and envelopes over metric time series, and
    in finding how much capacity sits idle between two peaks.

statement:
  clean: |
    Given `n` non-negative integers representing an **elevation map** where the
    **width of each bar is 1**, compute how much water it can **trap after raining**.
  oa_story: |
    **MetroMitra Mobility — OA Round 2**

    MetroMitra's commute app warns riders about waterlogged stretches near metro stations
    after Bengaluru's evening downpours. The civic data team has surveyed a road stretch
    near the Silk Board junction in 1-metre segments and recorded the ground level of each
    segment, in centimetres above a reference point. During a heavy shower, water collects
    wherever lower segments are boxed in by higher ground on both sides, and runs off the
    two ends of the stretch.

    Given the list of segment levels from one end of the stretch to the other, return the
    total amount of water (in centimetre-metres) that stays on the road once the rain
    stops. Surveys can have up to 20,000 segments, and the alert must be computed on a
    phone with very little memory to spare.
  trigger_keywords: ["elevation map", "width of each bar is 1", "trap after raining"]
  examples:
    - input: "height = [0,1,0,2,1,0,1,3,2,1,2,1]"
      output: "6"
      explanation: "Bars 2, 4, 5, 6 and 9 hold 1, 1, 2, 1 and 1 units: 6 in total."
    - input: "height = [4,2,0,3,2,5]"
      output: "9"
      explanation: "The 4 on the left is the lower rim, so the water level is 4 over bars 1 to 4: 2 + 4 + 1 + 2 = 9."
  constraints:
    - "n == height.length"
    - "1 <= n <= 2 * 10^4"
    - "0 <= height[i] <= 10^5"

constraint_quiz:
  prompt: >-
    N is up to 2 × 10⁴. You present a prefix-max / suffix-max solution and the interviewer
    asks "can you do it without the extra arrays?". What are you aiming for now?
  options:
    - "O(N²) time, O(1) space"
    - "O(N log N) time, O(1) space"
    - "O(N) time, O(N) space"
    - "O(N) time, O(1) space"
  answer: 3
  explanation: >-
    O(N²) is about 4 × 10⁸ reads, too slow, and it's the brute force you started from.
    Nothing here needs sorting, and sorting destroys the positions that decide which walls
    surround each bar, so O(N log N) isn't a real option. O(N) time with O(N) space is the
    answer you already gave. "Without the extra arrays" means keeping O(N) time while
    replacing the two arrays with two running maxima: O(N) time, O(1) space.

pattern_quiz:
  prompt: >-
    Each bar's water depends on the tallest wall to its left and the tallest wall to its
    right. Which approach gives O(N) time and O(1) extra space?
  options:
    - "Monotonic stack of decreasing bar indices"
    - "Two pointers from both ends with running left_max and right_max"
    - "Sliding window between consecutive tall bars"
    - "Sort the bars by height and fill from the tallest down"
  answer: 1
  explanation: >-
    A monotonic stack also solves it in O(N) time, but the stack can hold O(N) indices, so
    it misses the O(1) space target. A window between "tall bars" fails because a later,
    taller wall changes the level of an earlier stretch. Sorting loses positions. "Max from
    both sides" plus "constant space" is the two-pointer trigger: process from whichever end
    has the lower wall, because that side is the bottleneck.

