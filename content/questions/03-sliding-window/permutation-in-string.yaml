slug: permutation-in-string
lc: 567

concept:
  problem_it_solves: >-
    "Does some stretch of s2 contain exactly the same letters as s1, in any order?" Order
    doesn't matter, so a permutation is fully described by its letter counts. Any matching
    stretch must have length len(s1), so you slide one fixed-size window across s2 and ask
    "do the window's counts equal s1's counts?" at each position.
  brute_force: >-
    Generating every permutation of s1 and searching for each one is O(k!) and hopeless. The
    usual brute force takes every window of length k = len(s1) in s2 and sorts it (or counts
    it from scratch) to compare with s1. Neighbouring windows share k − 1 letters, yet each
    window is re-counted from nothing.
  brute_force_complexity: >-
    O((n − k + 1) · k log k) time with sorting, O((n − k + 1) · k) with fresh counts, O(k)
    space — with n = 10⁴ and k = 5 × 10³ that is ~2.5 × 10⁷ letter reads before the log
    factor, and it grows quadratically with n.
  key_insight: >-
    Moving the window one step changes exactly two counts: s2[r] comes in on the right and
    s2[r − k] leaves on the left. Keep a 26-slot count array for the window, update those two
    slots per step, and compare it with s1's array. Comparing two length-26 arrays is O(26),
    a constant, so the whole scan is O(26 · n).
  real_world: >-
    Network intrusion detection (Snort-style signatures) and plagiarism or spam detectors
    use rolling fingerprints over fixed-size windows of a stream, where the fingerprint must
    be updatable in O(1) as one item enters and one leaves. Rabin–Karp hashing, used by rsync
    and many dedup systems, is the same "update, don't recompute" window.

statement:
  clean: |
    Given two strings `s1` and `s2`, return `true` if `s2` **contains a permutation** of
    `s1`, or `false` otherwise.

    In other words, return `true` if one of `s1`'s permutations is a **substring** of `s2`.
    A substring is a contiguous sequence of characters, so any match has exactly
    `s1.length` characters.
  oa_story: |
    **SwasthyaSync Diagnostics — OA Round 1**

    SwasthyaSync runs the sample-processing software for diagnostic labs across Jayanagar
    and Indiranagar. A health-checkup package is described as a string of lowercase test
    codes, one letter per test (a package can include the same test twice, for example two
    blood-sugar readings). The lab analyser logs every test it processes during the day as
    another string of letters, in processing order.

    A package counts as "processed in one sitting" if the analyser ran exactly that
    package's tests back-to-back, in any order, with nothing else in between. Given the
    package string and the day's log, return `true` if the package was processed in one
    sitting at some point, otherwise `false`. Logs can have 10,000 entries and packages can
    be just as long.
  trigger_keywords: ["contains a permutation", "substring", "contiguous"]
  examples:
    - input: "s1 = \"ab\", s2 = \"eidbaooo\""
      output: "true"
      explanation: "s2 contains one permutation of s1 (\"ba\")."
    - input: "s1 = \"ab\", s2 = \"eidboaoo\""
      output: "false"
      explanation: "The letters a and b both appear, but never next to each other."
  constraints:
    - "1 <= s1.length, s2.length <= 10^4"
    - "s1 and s2 consist of lowercase English letters."

constraint_quiz:
  prompt: >-
    Both strings can have up to 10⁴ letters, and there are only 26 possible letters. What
    time complexity should you aim for?
  options: ["O(k! · n)", "O(n · k log k)", "O(n²)", "O(26 · n)"]
  answer: 3
  explanation: >-
    Generating permutations is O(k!), which explodes past k ≈ 10. Sorting every window is
    O(n · k log k), about 3 × 10⁸ steps when k is around n / 2. Re-counting every window is
    O(n²) in the worst case, ~2.5 × 10⁷ letter reads, slow in Python and exactly the
    repeated work the interviewer wants removed. Updating two counts per slide and comparing
    26-slot arrays is O(26 · n), about 2.6 × 10⁵ steps.

pattern_quiz:
  prompt: >-
    You must check whether any length-k stretch of s2 is a rearrangement of s1. Which
    pattern fits?
  options:
    - "Generate all permutations of s1 and search for each"
    - "Fixed-size sliding window with letter-count arrays"
    - "Variable sliding window that grows until a letter is repeated"
    - "Sort s2 and binary search for s1's letters"
  answer: 1
  explanation: >-
    "Permutation" means "same letter counts", and "substring" with a known length means a
    window of size exactly len(s1). That is the fixed-window trigger: one letter in, one
    letter out, compare counts. A variable window has no "longest/shortest" to optimise
    here, and sorting s2 destroys the contiguity the question depends on.

