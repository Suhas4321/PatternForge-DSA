drills:
- skill: setup
  title: Validate request origin
  goal: Check if origin matches whitelist or wildcard.
  instructions: Return `True` if `origin in allowed or '*' in allowed`.
  function:
    name: drill_check_origin
    params:
    - name: origin
    - name: allowed
  starter_code: "class Solution:\n    def drill_check_origin(self, origin: str, allowed: list[str]) -> bool:\n        pass\n"
  tests:
  - args:
    - https://app.com
    - - https://app.com
    expected: true
  - args:
    - https://evil.com
    - - https://app.com
    expected: false
  solution: "class Solution:\n    def drill_check_origin(self, origin: str, allowed: list[str]) -> bool:\n        return origin\
    \ in allowed or \"*\" in allowed\n"
  hint: Check `origin in allowed or '*' in allowed`.
- skill: core
  title: Verify non-simple headers
  goal: Confirm all requested headers are in allowed set or simple list.
  instructions: Check case-insensitively against allowed headers plus simple defaults.
  function:
    name: drill_check_headers
    params:
    - name: headers
    - name: allowed
  starter_code: "class Solution:\n    def drill_check_headers(self, headers: list[str], allowed: list[str]) -> bool:\n   \
    \     pass\n"
  tests:
  - args:
    - - Authorization
    - - authorization
    expected: true
  - args:
    - - X-Custom
    - - authorization
    expected: false
  solution: "class Solution:\n    def drill_check_headers(self, headers: list[str], allowed: list[str]) -> bool:\n       \
    \ safe = {h.lower() for h in allowed} | {\"content-type\", \"accept\", \"origin\"}\n        return all(h.lower() in safe\
    \ for h in headers)\n"
  hint: Convert to lower case and check subset.
- skill: edge
  title: Construct CORS 204 headers
  goal: Build preflight response headers dictionary.
  instructions: Format Access-Control headers with comma separated methods and headers.
  function:
    name: drill_cors_dict
    params:
    - name: origin
    - name: methods
    - name: headers
  starter_code: "class Solution:\n    def drill_cors_dict(self, origin: str, methods: list[str], headers: list[str]) -> dict:\n\
    \        pass\n"
  tests:
  - args:
    - https://a.com
    - - GET
      - POST
    - - Auth
    expected:
      Access-Control-Allow-Origin: https://a.com
      Access-Control-Allow-Methods: GET, POST
      Access-Control-Allow-Headers: Auth
      Access-Control-Max-Age: '86400'
  solution: "class Solution:\n    def drill_cors_dict(self, origin: str, methods: list[str], headers: list[str]) -> dict:\n\
    \        return {\n            \"Access-Control-Allow-Origin\": origin,\n            \"Access-Control-Allow-Methods\"\
    : \", \".join(methods),\n            \"Access-Control-Allow-Headers\": \", \".join(headers),\n            \"Access-Control-Max-Age\"\
    : \"86400\",\n        }\n"
  hint: Join with comma and space.
hints:
- Validate origin against `allowed_origins` and `*`.
- Verify method case-insensitively, then verify requested headers.
- '| # Pseudocode Blueprint

  | if origin not in allowed and "*" not in allowed: return False, 403

  | if method.upper() not in [m.upper() for m in allowed_methods]: return False, 405

  | safe = {h.lower() for h in allowed_headers} | {content-type, accept, origin}

  | if any(h.lower() not in safe for h in headers): return False, 400

  | return True, 204, {Access-Control headers}'
solution:
  code: "class Solution:\n    def evaluate_cors_preflight(self, origin: str, method: str, headers: list[str], allowed_origins:\
    \ list[str], allowed_methods: list[str], allowed_headers: list[str]) -> dict:\n        if origin not in allowed_origins\
    \ and \"*\" not in allowed_origins:\n            return {\"allowed\": False, \"status_code\": 403, \"headers\": {}}\n\n\
    \        if method.upper() not in [m.upper() for m in allowed_methods]:\n            return {\"allowed\": False, \"status_code\"\
    : 405, \"headers\": {}}\n\n        allowed_h_lower = {h.lower() for h in allowed_headers} | {\"content-type\", \"accept\"\
    , \"origin\"}\n        for h in headers:\n            if h.lower() not in allowed_h_lower:\n                return {\"\
    allowed\": False, \"status_code\": 400, \"headers\": {}}\n\n        resp_headers = {\n            \"Access-Control-Allow-Origin\"\
    : origin if \"*\" not in allowed_origins else \"*\",\n            \"Access-Control-Allow-Methods\": \", \".join(allowed_methods),\n\
    \            \"Access-Control-Allow-Headers\": \", \".join(allowed_headers),\n            \"Access-Control-Max-Age\":\
    \ \"86400\",\n        }\n        return {\"allowed\": True, \"status_code\": 204, \"headers\": resp_headers}\n"
  explanation: Validating the preflight request verifies the origin against the allowed whitelist (returning 403 on mismatch),
    confirms the HTTP method (405 on unsupported verbs), and checks non-simple headers (400 on unpermitted headers). On approval,
    it returns HTTP 204 with complete `Access-Control-*` headers.
  time: O(H) where H is the count of requested headers
  space: O(1) returned dictionary
pitch_script: '**(Clarify)** "We need to evaluate a browser CORS preflight OPTIONS request by checking Origin, Method, and
  Headers against security policies and returning 204 No Content with appropriate headers."


  **(Brute force)** "Using wildcard `*` origins on authenticated endpoints permits malicious third-party websites to make
  unauthorized authenticated requests on behalf of users."


  **(Trigger)** "Evaluating preflight request parameters against security policies signals an HTTP OPTIONS decision engine."


  **(Optimal)** "We validate Origin against the whitelist (rejecting with 403), check the method against allowed verbs (rejecting
  with 405), and check non-simple headers against allowed headers (rejecting with 400). If valid, we return HTTP 204 with
  `Access-Control-Allow-Origin`, `-Methods`, `-Headers`, and a 24-hour `-Max-Age` cache."


  **(Complexity)** "Executes in O(H) time and O(1) space." '
