slug: assign-cookies
lc: 455

concept:
  problem_it_solves: >-
    "How do I match two lists so the most pairs are satisfied, when each item can be used at
    most once?" Trying every assignment blows up exponentially. Sorting both lists makes the
    right match obvious: the smallest thing that still works goes to the easiest customer,
    and you never have to look back.
  brute_force: >-
    Try every way of handing out cookies: for each child, either skip them or give them any
    unused cookie that is big enough, and keep the best count. It wastes work because it
    keeps exploring assignments that hand a big cookie to an easy child, which can never beat
    handing that child a smaller one.
  brute_force_complexity: >-
    Exponential time (on the order of (M + 1)^N assignments to explore), O(N + M) recursion
    and bookkeeping space. Even 20 children and 20 cookies is far beyond any time limit, and N
    and M go up to 3 × 10⁴.
  key_insight: >-
    Sort both lists, then walk them with two pointers. Give the least greedy unfed child the
    smallest cookie that satisfies them. A cookie too small for the least greedy child is too
    small for everyone, so throw it away. The proof is an exchange argument: if some optimal
    plan feeds that child a bigger cookie, swap in the smaller one. The child is still happy,
    and the bigger cookie is now free for someone else, so the count never drops.
  real_world: >-
    Cloud schedulers (Kubernetes bin-packing, AWS spot fleets) place each workload on the
    smallest machine that fits, so big machines stay free for big jobs. Food-delivery and
    ride-hailing dispatch (Swiggy, Ola) use the same "smallest sufficient resource" rule when
    matching riders or cabs of different capacities to orders.

statement:
  clean: |
    You are a parent who wants to give your children cookies, but each child can get
    **at most one cookie**.

    Child `i` has a **greed factor** `g[i]`: the minimum cookie size that will make them
    content. Cookie `j` has a size `s[j]`. If `s[j] >= g[i]`, you can assign cookie `j` to
    child `i` and child `i` will be content.

    Return the **maximum number of** content children.
  oa_story: |
    **CampusCart — OA Round 1**

    CampusCart delivers snacks and stationery to college hostels around Electronic City and
    Bommanahalli. During exam week the ops team runs a promo: each student on the waitlist
    gets at most one free voucher, and a student only redeems a voucher whose value is at
    least the minimum value they told CampusCart they'd bother with (otherwise they ignore
    it).

    You are given the list of minimum values students will accept, and the list of voucher
    values left in the promo budget, both in no particular order. Each voucher can go to only
    one student. Return the largest number of students who can be made happy. The waitlist
    and voucher pool can each hold 30,000 entries, and the job runs on every app refresh, so
    it must be fast.
  trigger_keywords: ["at most one cookie", "greed factor", "maximum number of"]
  examples:
    - input: "g = [1,2,3], s = [1,1]"
      output: "1"
      explanation: "Both cookies have size 1, so only the child with greed 1 can be content."
    - input: "g = [1,2], s = [1,2,3]"
      output: "2"
      explanation: "Give size 1 to greed 1 and size 2 to greed 2. The size-3 cookie is left over."
  constraints:
    - "1 <= g.length <= 3 * 10^4"
    - "0 <= s.length <= 3 * 10^4"
    - "1 <= g[i], s[j] <= 2^31 - 1"

constraint_quiz:
  prompt: >-
    There can be 3 × 10⁴ children and 3 × 10⁴ cookies. What time complexity should you aim
    for?
  options: ["Exponential (try all assignments)", "O(N · M)", "O(N log N + M log M)", "O(N + M)"]
  answer: 2
  explanation: >-
    Trying all assignments is exponential and hopeless. O(N · M) (for each child, scan all
    cookies for the best fit) is ~9 × 10⁸ steps, too slow. Sorting both lists costs
    O(N log N + M log M) and the two-pointer match after that is linear, which is the target.
    O(N + M) would need the lists already sorted (or a counting sort), and sizes go up to
    2³¹ − 1, so counting sort is out.

pattern_quiz:
  prompt: >-
    Match items from two lists, each used at most once, to maximise how many "size ≥ need"
    pairs you form. Which pattern fits?
  options:
    - "Dynamic programming over (child, cookie) pairs"
    - "Sort both lists, then two pointers giving the smallest sufficient cookie"
    - "Hash map from greed value to cookie"
    - "Sliding window over the cookie sizes"
  answer: 1
  explanation: >-
    "Maximum number of" pairs plus "each item used at most once" with a simple ≥ test is the
    classic sort-and-match greedy trigger. Once both lists are sorted, the exchange argument
    shows the smallest sufficient cookie is always a safe choice, so no DP is needed. A hash
    map only finds exact matches, and there's no contiguous range to slide a window over.

