solution:
  code: |
    import pandas as pd

    class Solution:
        def filter_slow_failures(self, data: list[dict], threshold_ms: int) -> list[dict]:
            if not data:
                return []
            df = pd.DataFrame(data)
            mask = (df["status"] == "FAIL") & (df["latency_ms"] > threshold_ms)
            filtered_df = df.loc[mask]
            return filtered_df.to_dict(orient="records")
  explanation: |
    By instantiating a `pd.DataFrame`, the columnar data is stored in contiguous C-arrays.
    The compound condition `(df["status"] == "FAIL") & (df["latency_ms"] > threshold_ms)`
    executes via vectorized CPU operations without running Python bytecode on each row.
    
    Using `.loc[mask]` slices the qualifying rows instantly and `.to_dict(orient="records")`
    serializes the result into a clean list of row dictionaries.
  time: O(N) vectorized C-speed execution
  space: O(N) for DataFrame memory

pitch_script: |
  **(Clarify)** "We need to filter device run records for failed tests where latency exceeds a threshold, returning the result as a list of records."

  **(Basement Insight)** "Iterating over DataFrames using `iterrows()` is notoriously slow because it converts each row into a Python Series object on every step. Vectorized operations using bitwise `&` on boolean Series evaluate at compiled C speed directly on NumPy memory buffers."

  **(Solution)** "We build a DataFrame, construct a vectorized boolean mask `(df['status'] == 'FAIL') & (df['latency_ms'] > threshold_ms)`, slice with `.loc[mask]`, and serialize with `.to_dict(orient='records')`."

  **(Complexity)** "Runs in O(N) vectorized time across N rows, using O(N) space for the DataFrame."

