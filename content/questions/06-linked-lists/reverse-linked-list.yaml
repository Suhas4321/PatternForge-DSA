slug: reverse-linked-list
lc: 206

concept:
  problem_it_solves: >-
    "How do I turn every arrow around when each node only knows the node after it?" A singly
    linked list has no index and no way back, so the moment you overwrite a node's `next`, the
    rest of the list is unreachable unless you saved it first. Reversal is the smallest problem
    that forces you to do pointer bookkeeping in the right order.
  brute_force: >-
    Walk the list, copy every value into an array (or push every node onto a stack), then build
    a brand-new list from the back of the array to the front. It works, but it stores a second
    copy of the whole list and creates N new nodes, when every node you need already exists and
    only its one `next` field is pointing the wrong way.
  brute_force_complexity: >-
    O(N) time, O(N) extra space — 5000 nodes means a 5000-entry array plus 5000 freshly
    allocated nodes, all to change one field per node.
  key_insight: >-
    You don't need to move any nodes; you only need to flip each arrow. Split the list into two
    parts: a reversed part (headed by `prev`) and a not-yet-reversed part (headed by `cur`).
    Each step moves one node from the front of the second part to the front of the first. The
    only danger is that `cur.next = prev` destroys your only link to the rest of the list, so
    save it in `nxt` first. Save, rewire, advance, advance: four lines, O(1) space.
  real_world: >-
    Functional runtimes (Erlang, Haskell, Elixir) build lists by prepending, which produces them
    backwards, and then reverse once at the end: Erlang's `lists:reverse` is a built-in for
    exactly this. Git commits point to their parents, so showing history oldest-first
    (`git log --reverse`) means reversing a parent chain. Undo/redo and browser back/forward
    histories flip singly linked chains the same way.

statement:
  clean: |
    Given the `head` of a **singly linked list**, **reverse the list**, and return the
    **reversed list**.

    **Follow up:** A linked list can be reversed either iteratively or recursively. Could you
    implement both?
  oa_story: |
    **PlaylistPeacock — OA Round 1**

    PlaylistPeacock is a music-streaming startup in Indiranagar. Every playlist is stored as a
    chain of track records: each record holds a track ID and a reference to the record that
    plays after it. The last record refers to nothing. A new "Rewind Mode" for late-night
    commutes on the Purple Line plays the entire playlist from the last track to the first.

    Storage is tight on the low-end phones PlaylistPeacock targets, so the team does not want a
    second copy of the playlist. Given the first record of a playlist (possibly empty), relink
    the existing records so the playlist plays in exactly the opposite order, and return the
    record that now plays first. Playlists can have up to 5000 tracks.
  trigger_keywords: ["singly linked list", "reverse the list", "reversed list"]
  examples:
    - input: "head = [1,2,3,4,5]"
      output: "[5,4,3,2,1]"
      explanation: "Every arrow is flipped: 1 now points to nothing, and 5 is the new head."
    - input: "head = [1,2]"
      output: "[2,1]"
    - input: "head = []"
      output: "[]"
      explanation: "An empty list reversed is still empty, so the answer is None."
  constraints:
    - "The number of nodes in the list is in the range [0, 5000]."
    - "-5000 <= Node.val <= 5000"

constraint_quiz:
  prompt: >-
    The list has up to 5000 nodes, and the interviewer adds "do it without allocating new
    nodes or an extra array". What should you aim for?
  options:
    - "O(N²) time, O(1) space — repeatedly walk to the tail and detach it"
    - "O(N) time, O(N) space — copy values into an array and rebuild"
    - "O(N) time, O(1) space — flip each next pointer in one pass"
    - "O(log N) time — reverse halves recursively"
  answer: 2
  explanation: >-
    Detaching the tail repeatedly re-walks the list each time, about 1.25 × 10⁷ steps for 5000
    nodes, which is wasteful. The array rebuild is O(N) time but breaks the "no extra array"
    rule. O(log N) is impossible: every one of the N next pointers has to change, so you must
    touch every node. One pass with three pointers flips each arrow once: O(N) time, O(1) space.

pattern_quiz:
  prompt: >-
    You must reverse a singly linked list in place, and each node only knows its successor.
    Which approach fits?
  options:
    - "Two pointers from both ends, swapping values"
    - "Iterative pointer reversal with prev / cur / nxt"
    - "Fast and slow pointers"
    - "Sort the nodes by their original position, descending"
  answer: 1
  explanation: >-
    "Reverse" plus "in place" on a singly linked list is the pointer-reversal trigger. Two
    pointers from both ends needs a way to walk backwards, which a singly linked list doesn't
    have. Fast/slow pointers find middles and cycles, not reversals. Sorting is O(N log N) and
    still needs somewhere to store the order. Flipping each `next` while remembering the rest
    of the list is the direct answer.

