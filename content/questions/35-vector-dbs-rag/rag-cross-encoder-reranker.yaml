drills:
- title: Extract Lowercase Tokens
  skill: setup
  goal: Tokenize text into sorted unique lowercase words.
  instructions: Return sorted(list(set(re.findall(r'\w+', s.lower())))).
  function:
    name: extract_tokens
    params:
    - name: s
      type: any
  starter_code: "class Solution:\n    def extract_tokens(self, s: str) -> list:\n        pass\n"
  tests:
  - args:
    - Fast vector search!
    expected:
    - fast
    - search
    - vector
  solution: "import re\nclass Solution:\n    def extract_tokens(self, s: str) -> list:\n        return sorted(list(set(re.findall(r'\\\
    w+', s.lower()))))\n"
  hint: Use sorted(list(set(re.findall(r'\w+', s.lower())))).
- title: Calculate Lexical Coverage
  skill: core
  goal: Compute fraction of query words present in document.
  instructions: Return len(set(q_words) & set(d_words)) / max(len(q_words), 1).
  function:
    name: calc_coverage
    params:
    - name: q_words
      type: any
    - name: d_words
      type: any
  starter_code: "class Solution:\n    def calc_coverage(self, q_words: list, d_words: list) -> float:\n        pass\n"
  tests:
  - args:
    - - a
      - b
    - - a
      - c
    expected: 0.5
  solution: "class Solution:\n    def calc_coverage(self, q_words: list, d_words: list) -> float:\n        return len(set(q_words)\
    \ & set(d_words)) / max(len(q_words), 1)\n"
  hint: Divide intersection size of sets by query word count.
- title: Sort and Rank Top Candidates
  skill: edge
  goal: Sort by -score, id and assign 1-based ranks.
  instructions: Sort items and assign item['rank'] = i + 1.
  function:
    name: rank_top_k
    params:
    - name: items
      type: any
    - name: k
      type: any
  starter_code: "class Solution:\n    def rank_top_k(self, items: list, k: int) -> list:\n        pass\n"
  tests:
  - args:
    - - doc_id: b
        score: 0.8
      - doc_id: a
        score: 0.9
    - 1
    expected:
    - doc_id: a
      score: 0.9
      rank: 1
  solution: "class Solution:\n    def rank_top_k(self, items: list, k: int) -> list:\n        items.sort(key=lambda x: (-x[\"\
    score\"], x[\"doc_id\"]))\n        top = items[:k]\n        for idx, item in enumerate(top):\n            item[\"rank\"\
    ] = idx + 1\n        return top\n"
  hint: Sort by (-score, doc_id) and iterate to set rank.
hints:
- Tokenize query words using regex \w+.
- Compute coverage as len(q_words & d_words) / len(q_words).
- Calculate cross_score = round(0.5 * coverage + 0.3 * phrase_bonus + 0.2 * bi_score, 4).
solution:
  code: "import re\n\nclass Solution:\n    def rerank_passages(self, query: str, candidates: list[dict], top_k: int = 3) ->\
    \ list[dict]:\n        if not candidates:\n            return []\n        q_clean = query.lower().strip()\n        q_words\
    \ = set(re.findall(r'\\w+', q_clean))\n        \n        scored = []\n        for doc in candidates:\n            d_id\
    \ = doc[\"doc_id\"]\n            d_text = doc[\"text\"]\n            d_words = re.findall(r'\\w+', d_text.lower())\n \
    \           \n            # Coverage\n            matched = q_words.intersection(set(d_words))\n            coverage =\
    \ len(matched) / max(len(q_words), 1)\n            \n            # Phrase bonus\n            phrase_bonus = 1.0 if q_clean\
    \ in d_text.lower() else 0.0\n            \n            # Bi-encoder score\n            bi_score = float(doc.get(\"biencoder_score\"\
    , 0.0))\n            \n            cross_score = round((0.5 * coverage) + (0.3 * phrase_bonus) + (0.2 * bi_score), 4)\n\
    \            scored.append({\n                \"doc_id\": d_id,\n                \"cross_score\": cross_score,\n     \
    \       })\n            \n        # Sort desc by cross_score, tie-break doc_id asc\n        scored.sort(key=lambda x:\
    \ (-x[\"cross_score\"], x[\"doc_id\"]))\n        \n        top = scored[:top_k]\n        for idx, item in enumerate(top):\n\
    \            item[\"rank\"] = idx + 1\n            \n        return top\n"
  explanation: Calculates composite relevance combining keyword coverage, exact phrase bonus, and prior bi-encoder signal,
    outputting ranked passages.
  time: O(C * L + C log C) where C is candidate count and L is average passage length
  space: O(C) for scored results
pitch_script: '**(Clarify)** "We need to rerank candidate passages retrieved by vector search using a deterministic cross-encoder
  scoring formula that rewards lexical coverage and exact phrase matches."


  **(Basement Insight)** "Bi-encoders decouple query and passage encoding, creating semantic blind spots for exact phrasing
  and terminology. A cross-encoder reranking stage evaluates joint interactions to surface the most relevant text."


  **(Solution)** "We extract word sets from the query and each passage. We compute the coverage ratio, check for exact substring
  matches, and combine them with the prior bi-encoder score, sorting by cross-encoder score descending."


  **(Complexity)** "Runs in O(C * L + C log C) time and O(C) space."

  '
