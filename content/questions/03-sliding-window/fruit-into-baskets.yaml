slug: fruit-into-baskets
lc: 904

concept:
  problem_it_solves: >-
    "What is the longest contiguous stretch that contains at most 2 different values?" The
    story about baskets hides a variable window whose rule depends on *how many distinct
    values* are inside it. A count map tells you that number at any moment, and lets the
    left edge drop elements one at a time without losing track.
  brute_force: >-
    For every starting tree l, walk right adding fruit types to a set until a third type
    appears, and keep the longest walk. The next start l + 1 re-walks almost the same
    stretch and rebuilds the same set from scratch, even though only one fruit left the
    window.
  brute_force_complexity: >-
    O(N²) time, O(1) extra space (the set never holds more than 3 types) — 10⁵ trees means up
    to about 5 × 10⁹ steps when the array has only two types.
  key_insight: >-
    Strip the story: you pick a contiguous run of trees, and the run may contain at most 2
    fruit types. That is the same longest-window template as Max Consecutive Ones III,
    except the rule is "distinct types <= 2" instead of "zeros <= k". Counting distinct
    values needs a map of type → count inside the window: when a count drops to zero, delete
    the key, so len(map) is always the number of distinct types.
  real_world: >-
    Log and analytics pipelines look for the longest burst of requests that touched at most
    K distinct backend services or shards, so a batch can reuse a small number of
    connections. Recommendation teams (Flipkart, Swiggy) measure the longest browsing session
    that stayed within K categories, and a cache that holds K entries is reused for exactly
    as long as consecutive requests stay within K distinct keys.

statement:
  clean: |
    You are visiting a farm with a single row of fruit trees arranged from left to right. The
    trees are given as an integer array `fruits`, where `fruits[i]` is the **type** of fruit
    the `i`th tree produces.

    You want to collect as much fruit as possible, but the owner has strict rules:

    - You only have **two baskets**, and each basket can hold only a **single type** of
      fruit. There is no limit on how many fruits a basket can hold.
    - Starting from any tree you choose, you must pick exactly one fruit from **every tree**
      (including the starting tree) while **moving to the right**. Every picked fruit must
      fit in one of your baskets.
    - As soon as you reach a tree whose fruit doesn't fit in either basket, you must stop.

    Given the integer array `fruits`, return the **maximum number of fruits** you can pick.
  oa_story: |
    **VidyaVerse — OA Round 1**

    VidyaVerse is an edtech app used by engineering students across Bengaluru colleges. A
    course playlist is a list of short video lessons in a fixed order, and each lesson is
    tagged with a subject ID. The new "Focus Sprint" mode lets a student start at any lesson
    and then watch every lesson after it, in order, with no skipping.

    The sprint's side panel can keep notes open for only two subjects at a time, and a sprint
    ends the moment a lesson from a third subject comes up. Given the playlist's subject IDs,
    return the largest number of lessons a single Focus Sprint can contain. Playlists can
    hold up to 100,000 lessons, and the app suggests the best sprint instantly when a
    playlist is opened.
  trigger_keywords: ["two baskets", "single type", "moving to the right", "maximum number of fruits"]
  examples:
    - input: "fruits = [1,2,1]"
      output: "3"
      explanation: "Only two types exist, so you can pick from all three trees."
    - input: "fruits = [0,1,2,2]"
      output: "3"
      explanation: "Pick from trees [1,2,2]. Starting at tree 0 you could only pick [0,1] before type 2 forces a stop."
    - input: "fruits = [1,2,3,2,2]"
      output: "4"
      explanation: "Pick from trees [2,3,2,2]. Starting at tree 0 you could only pick [1,2]."
  constraints:
    - "1 <= fruits.length <= 10^5"
    - "0 <= fruits[i] < fruits.length"

constraint_quiz:
  prompt: With up to 10⁵ trees, what time complexity should you aim for?
  options: ["O(N²)", "O(N · number of types)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    Trying every starting tree is O(N²), about 5 × 10⁹ steps on a two-type array. Looping
    over every pair of types and scanning for each pair is O(N · T²) and T can be close to N.
    O(N log N) would pass but there's nothing to sort, and sorting destroys the left-to-right
    order. A variable sliding window with a count map is O(N): each tree enters the window
    once and leaves at most once.

pattern_quiz:
  prompt: >-
    Strip away the story: you want the longest contiguous run containing at most 2 distinct
    values. Which pattern fits?
  options:
    - "Find the two most frequent types in the whole array and add their counts"
    - "Variable sliding window with a count map, shrinking while it holds more than 2 types"
    - "Fixed-size sliding window of length 2"
    - "Sort the fruits by type and take the two biggest groups"
  answer: 1
  explanation: >-
    The two most frequent types overall are usually not next to each other, and sorting
    loses the order: both ignore "every tree while moving to the right", which means
    contiguous. A fixed window has the wrong shape because the answer's length is what
    you're searching for. "Longest contiguous run" plus "at most K distinct" is the variable
    window trigger, and "distinct" means you need counts, not just a set.

