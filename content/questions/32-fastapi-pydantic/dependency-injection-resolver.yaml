slug: dependency-injection-resolver
lc: 9512
citadel_id: backend_apis
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How does FastAPI instantiate complex request contexts without instantiating duplicate database sessions
    or re-verifying auth tokens multiple times in a single request? FastAPI's `Depends()` framework models dependencies as
    a Directed Acyclic Graph (DAG). It resolves sub-dependencies in topological post-order and caches resolved instances within
    the request scope.
  brute_force: Instantiating database connections inside every helper function, exhausting connection pools.
  brute_force_complexity: O(N) connection allocations per API request.
  key_insight: Topological post-order depth-first traversal resolves child dependencies first, while a request-scoped cache
    returns existing instances on duplicate references.
  real_world: FastAPI `Depends(get_db)` session scoping, NestJS dependency injection, and Spring Boot request-scoped beans.
statement:
  clean: "Implement a dependency injection graph resolver modeling FastAPI's `Depends()` mechanism:\n`resolve_dependencies(endpoint:\
    \ str, dependency_graph: dict[str, list[str]], providers: dict[str, str]) -> dict`.\n\nInputs:\n- `endpoint`: name of\
    \ the root endpoint function to resolve.\n- `dependency_graph`: dictionary mapping each function name to its list of direct\
    \ dependencies (e.g. `{\"checkout\": [\"get_auth\", \"get_db\"]}`).\n- `providers`: dictionary mapping dependency function\
    \ names to their mock returned value (e.g. `{\"get_db\": \"session_pgsql_1\"}`).\n\nRules:\n1. Post-order DFS Resolution:\n\
    \   - For any node, resolve all of its dependencies first before appending the node itself to `resolution_order`.\n2.\
    \ Request-Scope Caching:\n   - Maintain `resolved_values = {}` mapping node name to its resolved provider value.\n   -\
    \ If a dependency node is already in `resolved_values`, do NOT re-resolve it or re-visit its sub-dependencies. Increment\
    \ `cached_hits` by 1 and return.\n   - If a node is not in `providers`, fallback to `f\"mock_{node}\"`.\n\nReturn a dictionary\
    \ containing:\n- `\"resolution_order\"`: `list[str]` (exact order nodes were resolved)\n- `\"resolved_values\"`: `dict[str,\
    \ str]` (mapping of node to provider value)\n- `\"cached_hits\"`: `int` (number of times a cached dependency was reused)"
  oa_story: '**KiranaKart Checkout Pipeline — Duplicate DB Session Leak**


    KiranaKart''s checkout endpoint called `get_current_user`, `get_wallet_balance`, and `validate_cart`. Each function independently
    called `get_db()`, creating 3 separate PostgreSQL database connections per user checkout. Under flash-sale concurrency,
    PgBouncer ran out of server connections.


    Implement this dependency graph resolver to prove how FastAPI''s request-scoped dependency cache reuses single instances
    across shared dependency sub-trees.'
  trigger_keywords:
  - dependency injection graph resolver
  - resolve_dependencies
  - cached_hits
  examples:
  - input: 'endpoint = "checkout_endpoint", dependency_graph = {"checkout_endpoint": ["get_auth", "get_db"], "get_auth": ["get_db"],
      "get_db": []}, providers = {"get_db": "session_pgsql_1", "get_auth": "user_id_42"}'
    output: '{"resolution_order": ["get_db", "get_auth", "checkout_endpoint"], "resolved_values": {"get_db": "session_pgsql_1",
      "get_auth": "user_id_42", "checkout_endpoint": "mock_checkout_endpoint"}, "cached_hits": 1}'
    explanation: '`get_db` is resolved once for `get_auth`. When `checkout_endpoint` requests `get_db`, it reuses the cached
      value (1 cache hit).'
  constraints:
  - 1 <= len(dependency_graph) <= 100
  - Graph is a guaranteed Directed Acyclic Graph (DAG)
constraint_quiz:
  prompt: Why must dependencies be resolved in topological post-order rather than pre-order?
  options:
  - Because a parent function cannot execute until all of its argument dependencies are already instantiated
  - Because pre-order requires multi-threading
  - Because post-order reduces memory allocation by 50%
  - Because HTTP headers arrive after the request body
  answer: 0
  explanation: If function `A` depends on `B` and `C`, `B` and `C` must be fully instantiated and evaluated so their return
    values can be passed into `A`.
pattern_quiz:
  prompt: What design pattern does FastAPI's Depends() implement?
  options:
  - Inversion of Control (IoC) / Dependency Injection
  - Abstract Factory without parameters
  - Observer Pattern with publish-subscribe
  - Decorator Pattern for route registering
  answer: 0
  explanation: 'Dependency Injection inverts control: rather than functions instantiating their own resources, the framework
    injects them from an external configuration.'
