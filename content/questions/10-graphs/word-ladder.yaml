slug: word-ladder
lc: 127

concept:
  problem_it_solves: >-
    "What is the fewest number of moves between two states, when each move changes the state a
    little?" Nobody hands you a graph: the nodes are words and an edge joins two words that differ
    in one letter. Once you see the implicit graph, "shortest transformation sequence" is just
    shortest path in an unweighted graph, which is BFS. The real work is generating each word's
    neighbours quickly.
  brute_force: >-
    Build the graph explicitly by comparing every pair of words letter by letter, then BFS. Most
    pairs differ in several letters, so almost all of those N² comparisons find no edge, and you pay
    for them before the search even starts. (Trying every possible sequence with DFS is far worse:
    exponential.)
  brute_force_complexity: >-
    O(N² · L) time, O(N²) space for the edges — 5000 words of length 10 means about 2.5 × 10⁸
    character comparisons.
  key_insight: >-
    Don't search for neighbours, index them. Replace each position of a word with a wildcard:
    "hot" belongs to the buckets "*ot", "h*t" and "ho*". Two words are one letter apart exactly
    when they share a bucket, so a dictionary from pattern to words gives every neighbour of a word
    by looking up its L patterns: O(L²) per word instead of O(N · L). Then BFS from beginWord:
    BFS explores words in order of distance, so the first time endWord is dequeued, its level is
    the length of the shortest sequence. Count words, not moves: beginWord is level 1.
  real_world: >-
    Spell checkers and search autocorrect find "one edit away" candidates with the same indexing
    trick (SymSpell's symmetric-delete index, Elasticsearch fuzzy queries) instead of comparing
    against the whole dictionary. Bioinformatics tools search for single-mutation neighbours of a
    DNA sequence this way, and puzzle solvers and game AIs BFS over implicit state graphs that are
    far too large to build up front.

statement:
  clean: |
    A **transformation sequence** from word `beginWord` to word `endWord` using a dictionary
    `wordList` is a sequence of words `beginWord -> s1 -> s2 -> ... -> sk` such that:

    - Every adjacent pair of words **differs by a single letter**.
    - Every `si` for `1 <= i <= k` is in `wordList`. Note that `beginWord` does not need to be in
      `wordList`.
    - `sk == endWord`

    Given two words, `beginWord` and `endWord`, and a dictionary `wordList`, return the
    **number of words in the shortest** transformation sequence from `beginWord` to `endWord`, or
    `0` if no such sequence exists.
  oa_story: |
    **ShabdSetu — OA Round 1**

    ShabdSetu makes daily word puzzles for commuters stuck on Silk Board junction. In today's
    "word bridge", the player starts from a given word and must reach a target word by changing
    exactly one letter per move. Every word they create along the way (including the target) has
    to be in the puzzle's approved dictionary; the starting word itself may be any word.

    Before a puzzle is published, the content team needs its par score: the length of the shortest
    possible bridge, counted as the number of words on it including the starting word and the
    target. If the target can't be reached at all (for instance, because it isn't in the approved
    dictionary), the score is 0 and the puzzle is discarded. Dictionaries hold up to 5000 words of
    up to 10 lowercase letters.
  trigger_keywords: ["transformation sequence", "differs by a single letter", "number of words in the shortest"]
  examples:
    - input: "beginWord = \"hit\", endWord = \"cog\", wordList = [\"hot\",\"dot\",\"dog\",\"lot\",\"log\",\"cog\"]"
      output: "5"
      explanation: "One shortest sequence is hit → hot → dot → dog → cog, which has 5 words."
    - input: "beginWord = \"hit\", endWord = \"cog\", wordList = [\"hot\",\"dot\",\"dog\",\"lot\",\"log\"]"
      output: "0"
      explanation: "endWord \"cog\" is not in wordList, so no valid sequence exists."
  constraints:
    - "1 <= beginWord.length <= 10"
    - "endWord.length == beginWord.length"
    - "1 <= wordList.length <= 5000"
    - "wordList[i].length == beginWord.length"
    - "beginWord, endWord, and wordList[i] consist of lowercase English letters."
    - "beginWord != endWord"
    - "All the words in wordList are unique."

constraint_quiz:
  prompt: >-
    N = 5000 words of length L = 10. What should building the graph and searching it cost?
  options:
    - "O(N!) — DFS through every possible sequence"
    - "O(N² · L) — compare every pair of words to find edges"
    - "O(N · L²) — wildcard buckets (or try 26 letters per position)"
    - "O(N log N) — sort the words and compare neighbours in sorted order"
  answer: 2
  explanation: >-
    Enumerating sequences is exponential. Pairwise comparison is about 2.5 × 10⁸ character checks,
    too slow in Python. Sorting puts "hot" next to "hou", not next to "dot", so one-letter
    neighbours aren't adjacent in sorted order. With wildcard buckets each word has L patterns of
    length L, so indexing and BFS cost O(N · L²) ≈ 5 × 10⁵; trying all 26 letters per position is
    O(N · 26 · L²) ≈ 1.3 × 10⁷, also fine.

pattern_quiz:
  prompt: >-
    You move from word to word, one letter change at a time, and want the fewest words to reach a
    target. Which pattern fits?
  options:
    - "DFS with backtracking, keeping the shortest sequence found"
    - "BFS over an implicit graph whose neighbours are generated by wildcard patterns"
    - "Dynamic programming over prefixes of endWord"
    - "Dijkstra with edit distance as the edge weight"
  answer: 1
  explanation: >-
    "Shortest", "transform", "one change at a time" are the implicit-graph BFS triggers: each
    word is a node, each one-letter change is an edge of cost 1, and BFS finds the fewest steps.
    DFS would explore exponentially many sequences and can't stop at the first hit. There's no
    prefix structure for DP, and every edge costs exactly 1, so Dijkstra adds a heap for nothing.

function:
  name: ladderLength
  params: [{name: beginWord}, {name: endWord}, {name: wordList}]

starter_code: |
  class Solution:
      def ladderLength(self, beginWord: str, endWord: str, wordList: List[str]) -> int:
          pass

tests:
  - {args: ["hit", "cog", ["hot", "dot", "dog", "lot", "log", "cog"]], expected: 5}
  - {args: ["hit", "cog", ["hot", "dot", "dog", "lot", "log"]], expected: 0, note: endWord missing from wordList}
  - {args: ["a", "c", ["a", "b", "c"]], expected: 2, note: "one change: two words, not one move"}
  - {args: ["hot", "dog", ["hot", "dog"]], expected: 0, note: "beginWord is in the list, but hot and dog differ in two letters"}
  - {args: ["hot", "dog", ["hot", "dog", "dot"]], expected: 3}
  - {args: ["cat", "dog", ["cot", "cog", "dog", "bat", "bag", "bog"]], expected: 4, note: "two routes (4 and 5 words): BFS returns the shorter"}
  - {args: ["abc", "xyz", ["abd", "xyz"]], expected: 0, note: "endWord is in the list but unreachable"}
  - {args: ["lost", "cost", ["most", "mist", "cost"]], expected: 2, note: endWord is a direct neighbour}
visualize_test: 5

drills:
  - title: One word, L wildcard patterns
    skill: setup
    goal: Generate every wildcard pattern of a word by replacing one position with "*".
    instructions: |
      Return the patterns of `word`, one per position, in position order: replace the letter at
      index `i` with `*`.

      These patterns are the bucket keys of the whole solution. Two words differ in exactly one
      letter if and only if they produce a common pattern ("hot" and "dot" both make "*ot"), so a
      dictionary from pattern to words turns "find all neighbours" into L lookups.
    function:
      name: wildcardPatterns
      params: [{name: word}]
    starter_code: |
      class Solution:
          def wildcardPatterns(self, word: str) -> List[str]:
              pass
    tests:
      - {args: ["hit"], expected: ["*it", "h*t", "hi*"]}
      - {args: ["a"], expected: ["*"], note: single letter}
      - {args: ["dog"], expected: ["*og", "d*g", "do*"]}
      - {args: ["aaaa"], expected: ["*aaa", "a*aa", "aa*a", "aaa*"], note: repeated letters still give one pattern per position}
    solution: |
      class Solution:
          def wildcardPatterns(self, word: str) -> List[str]:
              return [word[:i] + "*" + word[i + 1:] for i in range(len(word))]
    hint: "Slice around index i: `word[:i] + \"*\" + word[i + 1:]`."

  - title: Try all 26 letters
    skill: core
    goal: Generate a word's neighbours the other way, by trying every letter at every position against a set.
    instructions: |
      Return, sorted, every word in `wordList` that differs from `word` in **exactly one**
      position. Build a set from `wordList`, then for each position try all 26 lowercase letters
      and keep the candidates that are in the set.

      This is the alternative to wildcard buckets: no preprocessing, O(26 · L²) per word, and easy
      to write under pressure. The `cand != word` check matters: putting the original letter back
      reproduces the word itself, which must not count as its own neighbour (test 3).
    function:
      name: neighbors
      params: [{name: word}, {name: wordList}]
    starter_code: |
      class Solution:
          def neighbors(self, word: str, wordList: List[str]) -> List[str]:
              pass
    tests:
      - {args: ["hot", ["hot", "dot", "dog", "lot", "log", "cog"]], expected: ["dot", "lot"]}
      - {args: ["hit", ["hot", "dot", "dog"]], expected: ["hot"]}
      - {args: ["dog", ["dog"]], expected: [], note: a word is not its own neighbour}
      - {args: ["abc", ["xyz", "abd", "bbc", "acc", "abc"]], expected: ["abd", "acc", "bbc"]}
      - {args: ["a", ["a", "b", "c"]], expected: ["b", "c"]}
    solution: |
      class Solution:
          def neighbors(self, word: str, wordList: List[str]) -> List[str]:
              words = set(wordList)
              out = []
              for i in range(len(word)):
                  for ch in string.ascii_lowercase:
                      cand = word[:i] + ch + word[i + 1:]
                      if cand != word and cand in words:
                          out.append(cand)
              return sorted(out)
    hint: "`string.ascii_lowercase` is \"abcdefghijklmnopqrstuvwxyz\"; skip the candidate equal to `word`."

  - title: Count words, not moves
    skill: edge
    goal: BFS on an explicit graph that returns the number of nodes on the shortest path, 1 when start is the target, and 0 when unreachable.
    instructions: |
      `graph[u]` lists the neighbours of node `u` (undirected). Return the number of **nodes** on
      the shortest path from `start` to `end`, or `0` if `end` can't be reached.

      This is the result extraction Word Ladder gets wrong most often. Start the start node at
      level **1**, not 0, because the answer counts words, and a path of one move has two words.
      Record a node's level when you **enqueue** it, so nobody is queued twice. And when the queue
      runs dry without meeting `end`, the answer is `0`, not some leftover level.
    function:
      name: shortestHops
      params: [{name: graph}, {name: start}, {name: end}]
    starter_code: |
      class Solution:
          def shortestHops(self, graph: List[List[int]], start: int, end: int) -> int:
              pass
    tests:
      - {args: [[[1], [0, 2], [1, 3], [2]], 0, 3], expected: 4, note: "3 moves = 4 nodes"}
      - {args: [[[1], [0]], 0, 1], expected: 2}
      - {args: [[[1], [0], []], 0, 2], expected: 0, note: unreachable}
      - {args: [[[1, 2], [0, 3], [0, 3], [1, 2]], 0, 3], expected: 3, note: two equally short routes}
      - {args: [[[]], 0, 0], expected: 1, note: start is the target}
    solution: |
      class Solution:
          def shortestHops(self, graph: List[List[int]], start: int, end: int) -> int:
              level = {start: 1}  # the start node already counts as one node
              queue = deque([start])
              while queue:
                  u = queue.popleft()
                  if u == end:
                      return level[u]
                  for v in graph[u]:
                      if v not in level:
                          level[v] = level[u] + 1
                          queue.append(v)
              return 0
    hint: "Use a dict `level` as both the visited set and the distance table."

hints:
  - >-
    Picture every word as a node and draw an edge between words that differ in one letter. What
    question about that graph is "the shortest transformation sequence"? And which search answers
    it when every edge costs the same?
  - >-
    BFS from beginWord. The hard part is listing a word's neighbours without comparing it to all
    5000 words. "hot" and "dot" both match the pattern "*ot". Could you group the dictionary by such
    patterns in advance?
  - |
    if endWord not in wordList: return 0
    patterns = map from "h*t"-style pattern -> list of words
    for each word in wordList, for each position i: add word to patterns[pattern_i(word)]
    dist = {beginWord: 1}; queue = [beginWord]
    while queue:
        word = pop front
        if word == endWord: return dist[word]
        for each position i:
            for nxt in patterns[pattern_i(word)]:
