tests:
  - {args: [[[1, 2, 2, 3, 5], [3, 2, 3, 4, 4], [2, 4, 5, 3, 1], [6, 7, 1, 4, 5], [5, 1, 1, 2, 4]]], expected: [[0, 4], [1, 3], [1, 4], [2, 2], [3, 0], [3, 1], [4, 0]]}
  - {args: [[[1]]], expected: [[0, 0]]}
  - {args: [[[3, 1, 4, 1, 5]]], expected: [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]], note: "one row: every cell touches the top (Pacific) and the bottom (Atlantic)"}
  - {args: [[[2], [9], [4]]], expected: [[0, 0], [1, 0], [2, 0]], note: "one column: every cell touches the left and right edges"}
  - {args: [[[3, 3, 3], [3, 1, 3], [3, 3, 3]]], expected: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]], note: "equal heights flow (>=, not >); the pit in the middle is trapped"}
  - {args: [[[1, 2, 3], [8, 9, 4], [7, 6, 5]]], expected: [[0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]], note: "spiral: the Pacific climb winds all the way to the 9"}
  - {args: [[[5, 4, 3], [4, 3, 2], [3, 2, 1]]], expected: [[0, 0], [0, 1], [0, 2], [1, 0], [2, 0]], note: "everything slopes to the Atlantic corner; only Pacific border cells qualify"}
  - {args: [[[1, 2], [4, 3]]], expected: [[0, 1], [1, 0], [1, 1]], note: "the top-left 1 only touches the Pacific"}
visualize_test: 5

drills:
  - title: Seed one ocean's border
    skill: setup
    goal: List the starting cells of a multi-source search, the Pacific border, each cell exactly once.
    instructions: |
      Return every cell that touches the **Pacific** (the whole top row plus the whole left
      column) as `[r, c]` pairs, in any order, **with no duplicates**.

      These cells are the sources of the reverse search: all of them go into the queue at the
      start, just like the rotten oranges in a multi-source BFS. The corner `(0, 0)` belongs to
      both the top row and the left column, so loop the column from row 1 to avoid adding it twice.
      Single-row and single-column grids are where off-by-one mistakes show up.
    function:
      name: pacificBorder
      params: [{name: heights}]
      compare: unordered
    starter_code: |
      class Solution:
          def pacificBorder(self, heights: List[List[int]]) -> List[List[int]]:
              pass
    tests:
      - {args: [[[1, 2], [3, 4]]], expected: [[0, 0], [0, 1], [1, 0]]}
      - {args: [[[5]]], expected: [[0, 0]], note: the corner appears once}
      - {args: [[[1, 2, 3]]], expected: [[0, 0], [0, 1], [0, 2]], note: one row}
      - {args: [[[1], [2], [3]]], expected: [[0, 0], [1, 0], [2, 0]], note: one column}
      - {args: [[[1, 1, 1], [1, 1, 1], [1, 1, 1]]], expected: [[0, 0], [0, 1], [0, 2], [1, 0], [2, 0]]}
    solution: |
      class Solution:
          def pacificBorder(self, heights: List[List[int]]) -> List[List[int]]:
              rows, cols = len(heights), len(heights[0])
              cells = [[0, c] for c in range(cols)]  # top row, including the corner
              for r in range(1, rows):  # left column, skipping the corner
                  cells.append([r, 0])
              return cells
    hint: "Top row is `[0, c]` for every c; the left column is `[r, 0]` for r starting at 1."

  - title: Flip the edge direction
    skill: core
    goal: From a cell, find the neighbours water could have come from, i.e. in-bounds neighbours with height >= the current height.
    instructions: |
      Return the in-bounds 4-directional neighbours `[nr, nc]` of `(r, c)` whose height is
      **greater than or equal to** `heights[r][c]`, in any order.

      This is the whole trick of the problem. Water flows *down* to a lower-or-equal neighbour, so
      when you walk *backwards* from the ocean you may only climb to a higher-or-equal neighbour.
      Get the comparison backwards (`<=`) and you're simulating rain instead of reversing it; drop
      the `=` and plateaus stop the search.
    function:
      name: uphillNeighbors
      params: [{name: heights}, {name: r}, {name: c}]
      compare: unordered
    starter_code: |
      class Solution:
          def uphillNeighbors(self, heights: List[List[int]], r: int, c: int) -> List[List[int]]:
              pass
    tests:
      - {args: [[[1, 2, 3], [8, 9, 4], [7, 6, 5]], 0, 0], expected: [[1, 0], [0, 1]]}
      - {args: [[[1, 2, 2, 3, 5], [3, 2, 3, 4, 4], [2, 4, 5, 3, 1], [6, 7, 1, 4, 5], [5, 1, 1, 2, 4]], 2, 2], expected: [], note: "a local peak: no water flows into it"}
      - {args: [[[3, 3], [3, 3]], 0, 1], expected: [[1, 1], [0, 0]], note: equal heights count}
      - {args: [[[7]], 0, 0], expected: [], note: no in-bounds neighbours}
      - {args: [[[1, 5, 1], [5, 2, 5], [1, 5, 1]], 1, 1], expected: [[0, 1], [2, 1], [1, 0], [1, 2]]}
    solution: |
      class Solution:
          def uphillNeighbors(self, heights: List[List[int]], r: int, c: int) -> List[List[int]]:
              rows, cols = len(heights), len(heights[0])
              out = []
              for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                  if 0 <= nr < rows and 0 <= nc < cols and heights[nr][nc] >= heights[r][c]:
                      out.append([nr, nc])
              return out
    hint: "Check bounds first, then `heights[nr][nc] >= heights[r][c]`: the neighbour must be at least as high."

  - title: Climb from the whole border at once
    skill: edge
    goal: Run one reverse search seeded with every Pacific border cell and count what it reaches, with plateaus and pits handled correctly.
    instructions: |
      Return **how many cells** can drain into the Pacific.

      Seed a visited set and a stack with every top-row and left-column cell, then climb: pop a
      cell, push every unvisited neighbour that is at least as high. Mark cells visited when you
      **push** them, so no cell is pushed twice. This drill uses an explicit stack (iterative DFS)
      to show that the visiting order doesn't matter for reachability: BFS or DFS reach the same
      set. Watch the tests: a flat plateau is fully reachable, and a pit surrounded by higher walls
      is not, because water can't flow uphill out of it.
    function:
      name: pacificReach
      params: [{name: heights}]
    starter_code: |
      class Solution:
          def pacificReach(self, heights: List[List[int]]) -> int:
              pass
    tests:
      - {args: [[[1, 2, 2, 3, 5], [3, 2, 3, 4, 4], [2, 4, 5, 3, 1], [6, 7, 1, 4, 5], [5, 1, 1, 2, 4]]], expected: 16}
      - {args: [[[1, 1], [1, 1]]], expected: 4, note: "a flat plateau: equal heights flow"}
      - {args: [[[3, 3, 3], [3, 1, 3], [3, 3, 3]]], expected: 8, note: the pit can't drain anywhere}
      - {args: [[[1, 2, 3], [8, 9, 4], [7, 6, 5]]], expected: 9, note: one long uphill path}
      - {args: [[[5, 4, 3], [4, 3, 2], [3, 2, 1]]], expected: 5, note: interior cells slope away from the Pacific}
    solution: |
      class Solution:
          def pacificReach(self, heights: List[List[int]]) -> int:
              rows, cols = len(heights), len(heights[0])
              seen = {(0, c) for c in range(cols)} | {(r, 0) for r in range(rows)}
              stack = list(seen)
              while stack:
                  r, c = stack.pop()
                  for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                      if 0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in seen and heights[nr][nc] >= heights[r][c]:
                          seen.add((nr, nc))
                          stack.append((nr, nc))
              return len(seen)
    hint: "A set comprehension builds the border without duplicates; `len(seen)` at the end is the count."

hints:
  - >-
    Asking "where does this cell's water end up?" separately for 4 × 10⁴ cells repeats the same
    exploration over and over. What if you asked from the ocean's side instead: which cells could
    have sent water to me?
  - >-
    Walk the flow backwards: from a cell you may step to a neighbour that is at least as high. Start
    one search from all Pacific border cells at once and another from all Atlantic border cells.
    A cell is in the answer if it ends up in both visited sets.
  - |
    climb(starts):
        visited = set(starts), queue = starts
        while queue:
            pop (r, c)
            for each in-bounds neighbour (nr, nc) not in visited:
                if heights[nr][nc] >= heights[r][c]: mark visited, push
        return visited
    pacific  = climb(top row + left column)
    atlantic = climb(bottom row + right column)
    return every cell in pacific AND atlantic

solution:
  code: |
    class Solution:
        def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]:
            rows, cols = len(heights), len(heights[0])

            def climb(starts):
                # multi-source BFS from one ocean's border, walking the flow backwards (uphill or level)
                visited = set(starts)
                queue = deque(starts)
                while queue:
                    r, c = queue.popleft()
                    for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                        if (0 <= nr < rows and 0 <= nc < cols
                                and (nr, nc) not in visited
                                and heights[nr][nc] >= heights[r][c]):
                            visited.add((nr, nc))
                            queue.append((nr, nc))
                return visited

            pacific = climb([(0, c) for c in range(cols)] + [(r, 0) for r in range(1, rows)])
            atlantic = climb([(rows - 1, c) for c in range(cols)] + [(r, cols - 1) for r in range(rows - 1)])
            return [[r, c] for r, c in pacific & atlantic]
  explanation: |
    Think of the grid as a directed graph: there is an edge from a cell to each neighbour that is
    lower or equal, because water can move that way. "Can this cell reach the Pacific?" is a
    reachability question on that graph. Asking it from every cell is the slow part, so **reverse
    every edge** and ask it once from the ocean: starting at the Pacific border, step to any
    neighbour that is **higher or equal**. Every cell this climb reaches has a downhill path into
    the Pacific, and every cell with such a path gets reached (the climb is that path walked
    backwards).

    The border cells are the sources of a **multi-source BFS**: they all start in the queue,
    because each of them drains into the ocean directly. Run the climb twice, once per ocean, and
    the cells in **both** visited sets are the answer.

    Two details decide correctness. The comparison is `>=`: on a plateau of equal heights water
    flows freely, so the climb must cross it (test 5). And cells are marked visited when they are
    **pushed**, which guarantees each cell enters each queue at most once. The corner cells are
    seeded once per ocean by starting the second range at 1 (or ending it one early). BFS is used
    instead of recursive DFS because a 200 × 200 snake-shaped path would recurse 4 × 10⁴ levels
    deep, past Python's default recursion limit.
  time: O(m·n) — each climb visits every cell at most once and checks 4 neighbours per cell
  space: O(m·n) — two visited sets and a queue, each holding at most m·n cells
  brute_force_code: |
    class Solution:
        def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]:
            rows, cols = len(heights), len(heights[0])
            result = []
            for sr in range(rows):
                for sc in range(cols):
                    # follow water downhill from (sr, sc) and note which oceans it touches
                    seen = {(sr, sc)}
                    stack = [(sr, sc)]
                    pac = atl = False
                    while stack:
                        r, c = stack.pop()
                        if r == 0 or c == 0:
                            pac = True
                        if r == rows - 1 or c == cols - 1:
                            atl = True
                        for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                            if (0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in seen
                                    and heights[nr][nc] <= heights[r][c]):
                                seen.add((nr, nc))
                                stack.append((nr, nc))
                    if pac and atl:
                        result.append([sr, sc])
            return result

pitch_script: |
  **(Clarify)** "Water moves to a neighbour that's lower or equal, so plateaus let it through. The
  Pacific is the top and left edges, the Atlantic the bottom and right edges, and I return the
  cells that can reach both, in any order. The grid is at least 1 by 1, right?"

  **(Brute force)** "The direct approach starts a DFS from every cell, follows water downhill and
  checks whether it touches both oceans. With 4 × 10⁴ cells, each search can cover the whole
  grid, so that's O((m·n)²), around 10⁹ steps, and neighbouring searches redo the same work."

  **(Trigger)** "Every cell asks the same question about a fixed target, 'can I reach this
  ocean?'. That tells me to search backwards from the target once instead of forwards from every
  cell. Reversing the flow means climbing: from a cell I can step to a neighbour that's higher or
  equal."

  **(Optimal)** "I run a multi-source BFS seeded with all the Pacific border cells, climbing to
  neighbours with height at least the current one, and collect what it reaches. Then the same from
  the Atlantic border. The answer is the intersection of the two visited sets. I mark cells when I
  push them so nothing is queued twice, and I use BFS rather than recursion so a 200 by 200 grid
  can't overflow the stack."

  **(Complexity)** "Each search visits each cell once and looks at four neighbours, so O(m·n) time,
  and O(m·n) space for the two visited sets and the queue."

twist:
  lc: 130
  title: Surrounded Regions
  why: >-
    Same "start from the border, not from every cell" idea, with a different goal. Instead of
    asking which 'O' regions are surrounded (hard to decide while you're inside one), DFS/BFS
    inward from every 'O' on the border and mark everything connected to it as safe. Any 'O' that
    the border search never reached must be enclosed, so flip it to 'X', then restore the safe
    marks. One border search, no height comparison, and the board is modified in place.

viz:
  grid: heights
  cell: [r, c]
  visited: [visited, pacific, atlantic]
  watch: [nr, nc]
