slug: generators-memory-streaming
lc: 9202
citadel_id: python_data
brick_layer: 2
runner_type: python_practical

concept:
  problem_it_solves: >-
    "How do we process a 10GB log file on a server with only 1GB of RAM?" Calling .readlines() or loading
    everything into a list attempts to allocate all 10GB at once on the heap, instantly triggering an Out-Of-Memory (OOM)
    kill from the OS kernel. Generators using yield retain O(1) memory overhead by producing one item at a time.
  brute_force: >-
    Reading the entire file into a massive list, running a list comprehension to filter errors, and running
    another comprehension to parse strings into dicts. This creates multiple redundant 10GB intermediate lists.
  brute_force_complexity: O(N) time, O(N) memory — fails with OOM when N exceeds physical RAM.
  key_insight: >-
    A generator function freezes its local stack frame at the `yield` expression and yields control back to the caller.
    By chaining generator pipelines (read line -> filter 5xx -> parse json), each record moves through the entire pipeline
    before the next line is read from disk, consuming O(1) working memory.
  real_world: >-
    Large-scale log ingestion in Datadog or ELK pipelines, streaming large CSV/Parquet dumps in data engineering,
    and streaming tokens from LLMs (OpenAI, Anthropic, Gemini) via server-sent events (SSE).

statement:
  clean: |
    Implement an error log streaming parser `parse_error_logs(raw_lines: list[str]) -> list[dict]`.
    
    In a high-throughput backend, raw web logs arrive in the format:
    `"TIMESTAMP STATUS_CODE PATH LATENCY_MS"` (e.g. `"2026-10-15T10:00:00 500 /api/v1/predict 142"`).
    
    You need to build a generator streaming pipeline that:
    1. Iterates over each log line.
    2. Strips whitespace and skips empty lines.
    3. Identifies lines where `STATUS_CODE` is a 5xx server error (`500 <= int(STATUS_CODE) <= 599`).
    4. Parses these matching lines into a dictionary:
       `{"status": int, "path": str, "latency": int}`.
    5. Returns the collected list of parsed error dictionaries in chronological order.
  oa_story: |
    **FitLabs ZeroGPU Pipeline — Memory Crash Recovery**
    
    During peak traffic for virtual try-on models, our inference gateway began crashing with OS kernel OOM kills.
    An engineer had written an analytics utility that read the entire 20GB daily access log into memory using
    `logs = file.readlines()`, exhausting all RAM on the monitoring node.
    
    Refactor this parser into a lazy generator-driven pipeline that processes lines sequentially without
    accumulating intermediate string arrays in memory.
  trigger_keywords: ["generator streaming", "parse_error_logs", "raw_lines"]
  examples:
    - input: "raw_lines = ['2026-10-15T10:00:00 200 /health 5', '2026-10-15T10:00:01 500 /api/try-on 1250']"
      output: "[{'status': 500, 'path': '/api/try-on', 'latency': 1250}]"
      explanation: "Only the 500 error line is captured and parsed."
    - input: "raw_lines = ['2026-10-15T10:00:02 503 /api/model 3200', '', '2026-10-15T10:00:03 404 /unknown 12']"
      output: "[{'status': 503, 'path': '/api/model', 'latency': 3200}]"
      explanation: "The 503 line is included; empty line and 404 client error are skipped."
  constraints:
    - "raw_lines contains between 0 and 10^5 string records"
    - "valid lines contain 4 whitespace-separated tokens"

constraint_quiz:
  prompt: >-
    What is the space complexity of a Python generator that yields items one-by-one from an iterator?
  options:
    - "O(N) where N is total items"
    - "O(1) auxiliary memory"
    - "O(N^2) memory"
    - "O(log N) memory"
  answer: 1
  explanation: >-
    Generators retain only their current execution frame on the heap, producing items on demand with O(1) space.

pattern_quiz:
  prompt: Which Python keyword transforms a standard function into a generator iterator?
  options:
    - "return"
    - "yield"
    - "async"
    - "lambda"
  answer: 1
  explanation: >-
    The presence of the `yield` keyword in a function body transforms it into a generator function.

