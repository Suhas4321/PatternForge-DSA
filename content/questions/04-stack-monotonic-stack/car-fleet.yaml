visualize_test: 0

drills:
  - title: Line the cars up from the front
    skill: setup
    goal: Sort the cars by position, closest to the target first, and turn each one into its unblocked arrival time.
    instructions: |
      Return the list of arrival times `(target - position) / speed`, ordered from the car
      **closest to the target** to the car furthest back.

      This is the setup for the whole problem. Sorting puts "the car ahead of me" right
      before me in the list, and converting to time removes speed and distance from the
      picture: from here on, a car only cares whether its time beats the fleet in front.
      Zipping `position` with `speed` before sorting keeps each car's speed attached to it.
    function:
      name: arrivalTimesFromFront
      params: [{name: target}, {name: position}, {name: speed}]
      compare: float
    starter_code: |
      class Solution:
          def arrivalTimesFromFront(self, target: int, position: List[int], speed: List[int]) -> List[float]:
              pass
    tests:
      - {args: [12, [10, 8, 0, 5, 3], [2, 4, 1, 1, 3]], expected: [1.0, 1.0, 7.0, 3.0, 12.0]}
      - {args: [10, [6, 8], [3, 2]], expected: [1.0, 1.3333333333333333], note: input is not sorted}
      - {args: [10, [3], [3]], expected: [2.3333333333333335]}
      - {args: [100, [0, 2, 4], [4, 2, 1]], expected: [96.0, 49.0, 25.0]}
    solution: |
      class Solution:
          def arrivalTimesFromFront(self, target: int, position: List[int], speed: List[int]) -> List[float]:
              cars = sorted(zip(position, speed), reverse=True)
              return [(target - p) / s for p, s in cars]
    hint: "`sorted(zip(position, speed), reverse=True)` sorts by position, largest first."

  - title: Push only the cars that can't catch up
    skill: core
    goal: Count fleets with a stack that grows only when a car is strictly slower to arrive than the fleet ahead.
    instructions: |
      You're given `times`: unblocked arrival times, already ordered from the car closest to
      the target backwards. Return the number of fleets.

      Keep a stack of fleet arrival times. If the stack is empty, or the current time is
      **strictly greater** than the top, this car can never catch the fleet ahead: push its
      time, it leads a new fleet. Otherwise it catches up and is absorbed, so do nothing.

      The trap: compare against the **fleet** on top of the stack, not the previous car. A
      fast car that joined a slow fleet arrives at the fleet's time, not its own.
    function:
      name: countFleets
      params: [{name: times}]
    starter_code: |
      class Solution:
          def countFleets(self, times: List[float]) -> int:
              pass
    tests:
      - {args: [[1.0, 1.0, 7.0, 3.0, 12.0]], expected: 3}
      - {args: [[3.0, 1.0, 2.0]], expected: 1, note: "2.0 is slower than the car ahead but still catches the fleet at 3.0"}
      - {args: [[1.0, 2.0, 3.0]], expected: 3}
      - {args: [[5.0]], expected: 1}
      - {args: [[4.0, 4.0, 4.0]], expected: 1, note: equal times arrive together}
    solution: |
      class Solution:
          def countFleets(self, times: List[float]) -> int:
              stack = []
              for t in times:
                  if not stack or t > stack[-1]:
                      stack.append(t)
              return len(stack)
    hint: "Push only when `not stack or t > stack[-1]`; the answer is `len(stack)`."

  - title: Catching up at the target, without floats
    skill: edge
    goal: Decide with integer arithmetic whether the car behind reaches the car ahead by the target, counting an exact tie as caught.
    instructions: |
      Car A is ahead at `posA` with speed `speedA`; car B is behind at `posB` (so
      `posB < posA`) with speed `speedB`. Return `True` if B catches A at or before
      `target` (so they form one fleet) and `False` otherwise.

      B catches A exactly when B's arrival time is **less than or equal to** A's:
      `(target - posB) / speedB <= (target - posA) / speedA`. Two things go wrong here.
      Using `<` drops the tie, but "catches up at the target" still counts. And float
      division can misjudge a near-tie with large values. Multiply both sides by
      `speedA * speedB` (both positive, so the direction of `<=` is safe) to compare exact
      integers instead.
    function:
      name: catchesUp
      params: [{name: target}, {name: posA}, {name: speedA}, {name: posB}, {name: speedB}]
    starter_code: |
      class Solution:
          def catchesUp(self, target: int, posA: int, speedA: int, posB: int, speedB: int) -> bool:
              pass
    tests:
      - {args: [10, 5, 1, 0, 2], expected: true, note: "both arrive at time 5: a tie at the target counts"}
      - {args: [10, 8, 2, 6, 3], expected: false, note: "4/3 > 1: falls just short"}
      - {args: [12, 10, 2, 8, 4], expected: true}
      - {args: [10, 5, 2, 0, 1], expected: false, note: the car behind is slower}
      - {args: [1000000, 999999, 1, 0, 1000000], expected: true, note: "another exact tie, with big numbers"}
    solution: |
      class Solution:
          def catchesUp(self, target: int, posA: int, speedA: int, posB: int, speedB: int) -> bool:
              # timeB <= timeA, cross-multiplied so no division happens
              return (target - posB) * speedA <= (target - posA) * speedB
    hint: "Compare `(target - posB) * speedA` with `(target - posA) * speedB`; equality means caught."

hints:
  - >-
    If a slow car is somewhere ahead of you on a road with no overtaking, does your own speed
    matter for when you arrive? Which car decides when a whole group reaches the target?
  - >-
    Sort cars by position, closest to the target first, and compute each car's unblocked
    arrival time. Keep a stack of fleet arrival times: a car whose time is greater than the
    top starts a new fleet (push); a car whose time is ≤ the top catches up and joins it.
  - |
    cars = pairs (position, speed) sorted by position, largest first
    stack = empty  (arrival time of each fleet)
    for (p, s) in cars:
        time = (target - p) / s
        if stack empty or time > top:
            push time        # can't catch the fleet ahead: new fleet
        # else: it catches up and arrives with that fleet
    return size of stack

solution:
  code: |
    class Solution:
        def carFleet(self, target: int, position: List[int], speed: List[int]) -> int:
            cars = sorted(zip(position, speed), reverse=True)  # closest to the target first
            stack = []  # arrival time of each fleet; strictly increasing from bottom to top
            for p, s in cars:
                time = (target - p) / s  # arrival time if nobody were in the way
                if not stack or time > stack[-1]:
                    stack.append(time)  # too slow to catch the fleet ahead: a new fleet
                # otherwise it catches up and arrives at stack[-1] with that fleet
            return len(stack)
  explanation: |
    Sorting by position from the target backwards means that when we look at a car, every car
    ahead of it has already been grouped into fleets, and the only one that matters is the
    fleet **directly** ahead: the top of the stack.

    Why does the fleet ahead cap this car? Its arrival time `T` on the stack is set by its
    slowest member. If this car's unblocked time is `≤ T`, it would reach the target no later
    than the fleet, but it can't pass, so it must catch up at or before the target and then
    arrive exactly at `T` with them (a tie at the target counts too, so `≤`, not `<`). It
    joins, and the stack doesn't change. If its time is strictly greater than `T`, it never
    catches up; it becomes a new fleet, and its time is pushed because it now caps every car
    behind it. That's why we compare with `stack[-1]` and never with the previous car's own
    time: a fast car that got absorbed arrives at the fleet's time, not its own.

    Times are floats, but the answer is the integer `len(stack)`. Because Python's division is
    correctly rounded, two equal fractions always produce the same float, so exact ties work.
    If you're worried about near-ties in another language, compare
    `(target - p1) * s2` with `(target - p2) * s1` using integers instead.

    Since times on the stack only ever increase, you could replace the stack with a single
    variable holding the top; the stack makes the "fleet ahead" idea visible, and it's what
    the interviewer usually expects to hear.
  time: O(N log N) — sorting dominates; the stack pass is O(N)
  space: O(N) — the sorted list of cars, plus up to N fleet times on the stack
  brute_force_code: |
    class Solution:
        def carFleet(self, target: int, position: List[int], speed: List[int]) -> int:
            n = len(position)
            fleets = 0
            for i in range(n):
                mine = (target - position[i]) / speed[i]
                blocked = False
                for j in range(n):
                    # a car ahead that arrives no earlier will hold car i up
                    if position[j] > position[i] and (target - position[j]) / speed[j] >= mine:
                        blocked = True
                        break
                if not blocked:
                    fleets += 1  # nobody ahead caps car i: it leads its own fleet
            return fleets

pitch_script: |
  **(Clarify)** "So nobody can overtake, a car that catches up just moves with the slower one,
  and catching up exactly at the target still counts as one fleet. Positions are all distinct
  but not sorted, right?"

  **(Brute force)** "A car leads its own fleet only if no car ahead of it would arrive at the
  same time or later. Checking that for every car against every car ahead is O(N²), which is
  10¹⁰ for 10⁵ cars."

  **(Trigger)** "'Can't pass' means order on the road is what matters, so I'll sort by position.
  Then each car only interacts with the group directly in front of it, the most recent fleet,
  which is a stack."

  **(Optimal)** "I sort cars by position, closest to the target first, and compute each car's
  arrival time if the road were empty. I keep a stack of fleet arrival times. If a car's time
  is strictly greater than the top, it can never catch that fleet, so it starts a new one and I
  push its time. If it's less than or equal, it catches up and arrives with that fleet, so I
  skip it. The answer is the stack size."

  **(Complexity)** "Sorting is O(N log N) and the pass is O(N), so O(N log N) overall, with
  O(N) space for the sorted cars and the stack."

twist:
  lc: 1776
  title: Car Fleet II
  why: >-
    Now you must return the exact time each car collides with the car ahead, and a car ahead
    can itself merge into something slower and disappear before you reach it. Scan from the
    front again, but keep a monotonic stack of candidate cars ahead: pop a car if it is at
    least as fast as you (you'll never catch it) or if it merges into a slower car before you
    would reach it. The first car left on top is the one you actually hit, and the collision
    time comes from relative speed and gap.

