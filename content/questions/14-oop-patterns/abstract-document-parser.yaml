drills:
  - title: Enforce abstract method definition
    skill: setup
    goal: Define a simple ABC with one abstract method.
    instructions: |
      Define `BaseTransformer(abc.ABC)` with abstract method `transform(text: str) -> str`.
      Implement `UpperTransformer` which returns `text.upper()`.
    function:
      name: test_upper
      params: [{name: s}]
    starter_code: |
      class Solution:
          def test_upper(self, s: str) -> str:
              pass
    tests:
      - {args: ["hello"], expected: "HELLO"}
      - {args: [""], expected: ""}
    solution: |
      import abc

      class BaseTransformer(abc.ABC):
          @abc.abstractmethod
          def transform(self, text: str) -> str:
              pass

      class UpperTransformer(BaseTransformer):
          def transform(self, text: str) -> str:
              return text.upper()

      class Solution:
          def test_upper(self, s: str) -> str:
              return UpperTransformer().transform(s)
    hint: "Inherit from abc.ABC and decorate transform with @abc.abstractmethod."

  - title: Markdown header filter
    skill: core
    goal: Extract lines starting with '#'.
    instructions: |
      Return all lines from `text` that start with `#` after trimming whitespace.
    function:
      name: filter_headers
      params: [{name: text}]
    starter_code: |
      class Solution:
          def filter_headers(self, text: str) -> list[str]:
              pass
    tests:
      - {args: ["# H1\nsome body\n## H2"], expected: ["# H1", "## H2"]}
      - {args: ["no headers here"], expected: []}
    solution: |
      class Solution:
          def filter_headers(self, text: str) -> list[str]:
              lines = text.splitlines()
              return [line.strip() for line in lines if line.strip().startswith("#")]
    hint: "Use line.strip().startswith('#')."

  - title: CSV line delimiter parser
    skill: edge
    goal: Parse comma tokens cleanly.
    instructions: |
      Split `raw` by commas, trim whitespace from each piece, and exclude empty strings.
    function:
      name: parse_csv_tokens
      params: [{name: raw}]
    starter_code: |
      class Solution:
          def parse_csv_tokens(self, raw: str) -> list[str]:
              pass
    tests:
      - {args: ["a, b, , c"], expected: ["a", "b", "c"]}
      - {args: ["   "], expected: []}
    solution: |
      class Solution:
          def parse_csv_tokens(self, raw: str) -> list[str]:
              tokens = [t.strip() for t in raw.split(",")]
              return [t for t in tokens if t]
    hint: "Use [t.strip() for t in raw.split(',')] and filter truthy tokens."

hints:
  - "Import `abc` and subclass `abc.ABC`."
  - "Decorate `parse` in `BaseParser` with `@abc.abstractmethod`."
  - "In `MarkdownParser`, filter lines starting with `#`; in `CSVParser`, split by `,` and discard empty pieces."

solution:
  code: |
    import abc

    class BaseParser(abc.ABC):
        @abc.abstractmethod
        def parse(self, raw: str) -> list[str]:
            pass

    class MarkdownParser(BaseParser):
        def parse(self, raw: str) -> list[str]:
            result = []
            for line in raw.splitlines():
                stripped = line.strip()
                if stripped.startswith("#"):
                    result.append(stripped)
            return result

    class CSVParser(BaseParser):
        def parse(self, raw: str) -> list[str]:
            tokens = [t.strip() for t in raw.split(",")]
            return [t for t in tokens if t]

    class Solution:
        def process_corpus(self, documents: list[dict]) -> list[list[str]]:
            parsers = {
                "markdown": MarkdownParser(),
                "csv": CSVParser(),
            }
            output = []
            for doc in documents:
                doc_type = doc.get("type")
                content = doc.get("content", "")
                if doc_type in parsers:
                    output.append(parsers[doc_type].parse(content))
                else:
                    output.append(["UNSUPPORTED"])
            return output
  explanation: |
    `BaseParser` establishes the formal interface contract using `abc.ABC`.
    `MarkdownParser` and `CSVParser` each supply their specialized extraction logic.
    In `process_corpus`, polymorphism allows callers to dispatch `.parse(content)` uniformly
    without caring about the internal tokenization mechanics.
  time: O(N * L) where N is number of documents and L is average length
  space: O(N * L) for storing parsed string chunks

pitch_script: |
  **(Clarify)** "We need to build a document processing pipeline using an Abstract Base Class to enforce uniform parsing methods across Markdown and CSV formats."

  **(Basement Insight)** "In Python, `abc.ABC` combined with `@abstractmethod` guarantees that subclasses must implement required methods before instantiation. Attempting to instantiate an incomplete subclass raises a `TypeError` immediately."

  **(Solution)** "We define `BaseParser` with an abstract `.parse(raw)` method. We implement concrete `MarkdownParser` and `CSVParser`. A parser registry maps document types to their singleton parser instance, providing clean polymorphic execution."

  **(Complexity)** "Runs in O(T) where T is total characters across all documents, using O(T) space for the resulting tokens."

