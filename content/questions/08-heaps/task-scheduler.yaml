slug: task-scheduler
lc: 621

concept:
  problem_it_solves: >-
    "Which job should run in this slot so that, in the end, I waste the fewest slots?" Every
    task type has a cooldown, so the CPU sometimes has to sit idle. The answer is greedy: in
    every slot, run the available task with the **most copies left**, because that task is the
    bottleneck. A max-heap keeps "the task with the most copies left" one pop away, and a
    queue keeps the tasks that are cooling down out of the way until they are allowed back.
  brute_force: >-
    Simulate the CPU one slot at a time and, at every slot, scan all task types to find the
    available one with the most copies left (trying every possible ordering instead would be
    factorial). The scan re-reads every task type in every slot, and idle slots are stepped
    through one by one even when you already know nothing can run until a known future time.
  brute_force_complexity: >-
    O(T · K) time, O(K) space, where T is the schedule length and K ≤ 26 the number of task
    types — with 10⁴ copies of one task and n = 100, T ≈ 10⁶ slots, each rescanning all types.
  key_insight: >-
    The most frequent task decides the shape of the schedule: each of its copies forces n slots
    before the next one, so if you leave it for later, it piles up at the end with nothing to
    fill the gaps. So always run the available task with the most copies left (max-heap), and
    park every task you just ran in a FIFO cooldown queue tagged with the time it becomes free
    again. Tasks leave the queue in the same order they entered, because every task has the
    same cooldown n. Counting the result gives a closed formula too:
    max(len(tasks), (maxCount − 1) · (n + 1) + numMax).
  real_world: >-
    Job schedulers that rate-limit per tenant or per downstream API (Sidekiq and Celery rate
    limits, Kubernetes CronJob backoff) solve exactly this: pick the highest-priority job that
    isn't cooling down. Linux's CFS and Go's goroutine scheduler also keep "who should run
    next" in a priority structure instead of rescanning every runnable task each tick.

statement:
  clean: |
    You are given an array of CPU `tasks`, each labelled with an uppercase letter from `A` to
    `Z`, and a number `n` called the **cooling time**. Each CPU interval can either complete
    one task or stay idle. Tasks can be completed in any order, but
    **identical tasks must be separated by at least n intervals**, because of the cooling time.

    Return the **minimum number of intervals** the CPU needs to complete all the tasks.
  oa_story: |
    **CronKaro — OA Round 1**

    CronKaro runs scheduled jobs for D2C brands in Bengaluru: invoice generation, GST filing
    syncs, WhatsApp reminders. Each brand's batch lands on a single worker that can execute one
    job per tick or sit idle for that tick. Every job is tagged with a one-letter job type, and
    jobs of the same type hit the same partner API, which throttles CronKaro if two calls of
    the same type arrive less than `n + 1` ticks apart (so at least `n` other ticks must pass
    between them).

    Given the list of job type tags in a batch (in any order, and the worker may run them in
    any order it likes) and the throttle gap `n`, return the smallest number of ticks the
    worker needs to finish the whole batch, counting the idle ticks. Batches can have up to
    10,000 jobs and gaps up to 100 ticks.
  trigger_keywords: ["cooling time", "identical tasks must be separated by at least n intervals", "minimum number of intervals"]
  examples:
    - input: 'tasks = ["A","A","A","B","B","B"], n = 2'
      output: "8"
      explanation: "A -> B -> idle -> A -> B -> idle -> A -> B. After running A you must wait 2 intervals before the next A."
    - input: 'tasks = ["A","C","A","B","D","B"], n = 1'
      output: "6"
      explanation: "A -> B -> C -> D -> A -> B. There are enough different tasks to fill every gap, so no interval is idle."
    - input: 'tasks = ["A","A","A","B","B","B"], n = 3'
      output: "10"
      explanation: "A -> B -> idle -> idle -> A -> B -> idle -> idle -> A -> B."
  constraints:
    - "1 <= tasks.length <= 10^4"
    - "tasks[i] is an uppercase English letter."
    - "0 <= n <= 100"

constraint_quiz:
  prompt: >-
    Up to 10⁴ tasks, at most 26 task types, cooling time up to 100. What time complexity
    should you aim for?
  options:
    - "O(N!) — try every order of the tasks"
    - "O(N²) — for every task, scan the schedule for the earliest legal slot"
    - "O(N) — count, then O(log 26) heap work per task, or a closed formula"
    - "O(log N)"
  answer: 2
  explanation: >-
    Trying every order is hopeless even for 12 tasks. Scanning the schedule for each task is
    O(N²), ~10⁸ steps, and the "earliest legal slot" greedy isn't even optimal. Counting the
    tasks is O(N), and after that the heap holds at most 26 entries, so each push and pop is
    O(log 26) = O(1); the counting formula is O(N) too. O(log N) is impossible because you
    must read every task at least once to count it.

pattern_quiz:
  prompt: >-
    Every interval you must choose which task to run, the same task needs a cooldown, and you
    want the fewest intervals overall. Which pattern fits?
  options:
    - "Sort the tasks and run them in alphabetical order, adding idles when needed"
    - "Max-heap of remaining counts plus a cooldown queue: always run the available task with the most copies left"
    - "Sliding window of size n + 1 over the task list"
    - "Binary search on the answer"
  answer: 1
  explanation: >-
    "Schedule by priority" is the heap trigger: at each step you need the best available item
    right now, and the best item changes as counts drop. Alphabetical order ignores which task
    is the bottleneck (A×1, B×5 would leave B's copies stacked at the end). The order of the
    input doesn't matter, so a window over it means nothing, and binary search would still need
    a feasibility check that is the same greedy anyway.

