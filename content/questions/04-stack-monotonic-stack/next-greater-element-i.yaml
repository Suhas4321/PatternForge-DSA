  - {args: [[4, 1, 2], [1, 3, 4, 2]], expected: [-1, 3, -1]}
  - {args: [[2, 4], [1, 2, 3, 4]], expected: [3, -1]}
  - {args: [[1], [1]], expected: [-1], note: single element}
  - {args: [[1, 2, 3], [3, 2, 1]], expected: [-1, -1, -1], note: "strictly decreasing: nothing ever resolves"}
  - {args: [[4, 1, 3], [1, 2, 3, 4]], expected: [-1, 2, 4], note: "strictly increasing: each value is answered by its neighbour"}
  - {args: [[5, 2, 6], [2, 6, 1, 5, 3, 7]], expected: [7, 6, 7], note: "the first greater, not the largest: 2 gets 6, not 7"}
  - {args: [[4, 6], [6, 5, 4, 3, 8]], expected: [8, 8], note: one big value resolves many waiting values}
  - {args: [[1, 3, 4, 2], [1, 3, 4, 2]], expected: [3, 4, -1, -1], note: nums1 is all of nums2}
visualize_test: 5

drills:
  - title: Keep the values that are still waiting
    skill: setup
    goal: Scan the array and maintain a stack of values that haven't met a bigger value yet.
    instructions: |
      Walk `nums` left to right. Before pushing each value `x`, pop every value on top of the
      stack that is **smaller** than `x`. Return the stack left at the end.

      The values left over are the ones with **no** next greater element. Notice the stack is
      always decreasing from bottom to top; that ordering is what lets one big value resolve
      many waiting values at once. Here the stack holds **values**, not indices, because the
      answer you need is a value.
    function:
      name: pendingValues
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def pendingValues(self, nums: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1, 3, 4, 2]], expected: [4, 2]}
      - {args: [[5, 4, 3]], expected: [5, 4, 3]}
      - {args: [[1, 2, 3]], expected: [3]}
      - {args: [[6, 5, 4, 3, 8]], expected: [8]}
    solution: |
      class Solution:
          def pendingValues(self, nums: List[int]) -> List[int]:
              stack = []
              for x in nums:
                  while stack and stack[-1] < x:
                      stack.pop()
                  stack.append(x)
              return stack
    hint: "`while stack and stack[-1] < x: stack.pop()`, then push `x`."

  - title: Record an answer at the moment you pop
    skill: core
    goal: Every value popped by x has just found its next greater element, which is x.
    instructions: |
      Same loop, but every time `x` pops a value `v`, record the pair `[v, x]`. Return the
      list of pairs **in the order they were recorded**.

      This is the moment the whole algorithm turns on: the popped value gets its answer, and
      it's the current element. Watch the order on `[3, 2, 1, 6]`: the top of the stack (the
      most recent, smallest value) is answered first. In the full problem you write each pair
      into a map `next_greater[v] = x` instead of a list.
    function:
      name: resolvedPairs
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def resolvedPairs(self, nums: List[int]) -> List[List[int]]:
              pass
    tests:
      - {args: [[2, 1, 3]], expected: [[1, 3], [2, 3]]}
      - {args: [[1, 3, 4, 2]], expected: [[1, 3], [3, 4]]}
      - {args: [[3, 2, 1, 6]], expected: [[1, 6], [2, 6], [3, 6]], note: top of the stack resolves first}
      - {args: [[5, 4, 3]], expected: [], note: nothing ever resolves}
    solution: |
      class Solution:
          def resolvedPairs(self, nums: List[int]) -> List[List[int]]:
              pairs = []
              stack = []
              for x in nums:
                  while stack and stack[-1] < x:
                      pairs.append([stack.pop(), x])
                  stack.append(x)
              return pairs
    hint: "Pop and record in one step: `pairs.append([stack.pop(), x])`."

  - title: Why keying by value needs distinct values
    skill: edge
    goal: Default unresolved answers to -1 and switch to an index stack when values can repeat.
    instructions: |
      Now `nums` **may contain duplicates**. Return, for every position `i`, the next greater
      **value** to the right of `nums[i]`, or `-1` if there is none.

      A value-keyed map breaks here: in `[2, 3, 2, 1]` the first 2 is answered by 3, but the
      second 2 has no answer, and a map can't hold both. Next Greater Element I avoids this
      because its values are unique. When they aren't, push **indices** and write into a
      result array that starts as all `-1`, so unresolved positions already hold the default.
    function:
      name: nextGreaterValues
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def nextGreaterValues(self, nums: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[2, 3, 2, 1]], expected: [3, -1, -1, -1], note: the two 2s have different answers}
      - {args: [[2, 1, 2, 3]], expected: [3, 2, 3, -1]}
      - {args: [[1, 1, 1]], expected: [-1, -1, -1], note: equal is not greater}
      - {args: [[5]], expected: [-1]}
      - {args: [[1, 3, 4, 2]], expected: [3, 4, -1, -1]}
    solution: |
      class Solution:
          def nextGreaterValues(self, nums: List[int]) -> List[int]:
              result = [-1] * len(nums)
              stack = []  # indices
              for i, x in enumerate(nums):
                  while stack and nums[stack[-1]] < x:
                      result[stack.pop()] = x
                  stack.append(i)
              return result
    hint: "Compare `nums[stack[-1]] < x`, and write `x` (the value) into `result` at the popped index."

hints:
  - >-
    Can you compute the next greater element for *every* value in nums2 first, so each
    query in nums1 becomes a lookup? Which earlier values does a big new value answer?
  - >-
    Scan nums2 with a stack of values waiting for something bigger (decreasing upward). For
    each x, pop every smaller value v and record next_greater[v] = x, then push x. Then map
    each value in nums1 through next_greater, defaulting to -1.
