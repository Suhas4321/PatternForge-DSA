drills:
  - title: A max-heap from a min-heap
    skill: setup
    goal: Build a max-heap by negating values, then pop them out heaviest first, negating back.
    instructions: |
      Return the stones' weights from **heaviest to lightest** by building a heap of negated
      weights with `heapq.heapify` and popping until it is empty.

      `heapq` only knows how to keep the *smallest* value at the root. Storing `-w` instead of
      `w` flips the order: the heaviest stone becomes the most negative number, so it's the
      root. The two rules to remember are "negate on the way in" and "negate on the way out".
    function:
      name: heaviestFirst
      params: [{name: stones}]
    starter_code: |
      class Solution:
          def heaviestFirst(self, stones: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[2, 7, 4, 1, 8, 1]], expected: [8, 7, 4, 2, 1, 1]}
      - {args: [[5]], expected: [5]}
      - {args: [[3, 3, 1]], expected: [3, 3, 1]}
      - {args: [[1, 1000, 500]], expected: [1000, 500, 1]}
    solution: |
      class Solution:
          def heaviestFirst(self, stones: List[int]) -> List[int]:
              heap = [-s for s in stones]
              heapq.heapify(heap)
              out = []
              while heap:
                  out.append(-heapq.heappop(heap))
              return out
    hint: "`heap = [-s for s in stones]`, heapify it, and remember the minus sign when popping."

  - title: One smash
    skill: core
    goal: Pop the two heaviest stones, compare them, and push the difference back only if it is non-zero.
    instructions: |
      Perform **exactly one** turn of the game (there are always at least two stones) and
      return the remaining stones sorted from heaviest to lightest.

      This is the state transition of the whole problem. The first pop is the heaviest `y`, the
      second is `x <= y`. If they're equal, push nothing; otherwise push `y - x` back as a
      negated value so it competes again in the next turn, possibly as the new heaviest.
    function:
      name: smashOnce
      params: [{name: stones}]
    starter_code: |
      class Solution:
          def smashOnce(self, stones: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[2, 7, 4, 1, 8, 1]], expected: [4, 2, 1, 1, 1]}
      - {args: [[2, 2]], expected: [], note: equal stones leave nothing behind}
      - {args: [[3, 7, 2]], expected: [4, 2]}
      - {args: [[10, 1, 1]], expected: [9, 1]}
      - {args: [[6, 6, 1]], expected: [1]}
    solution: |
      class Solution:
          def smashOnce(self, stones: List[int]) -> List[int]:
              heap = [-s for s in stones]
              heapq.heapify(heap)
              y = -heapq.heappop(heap)
              x = -heapq.heappop(heap)
              if y != x:
                  heapq.heappush(heap, -(y - x))
              return sorted((-v for v in heap), reverse=True)
    hint: "Push `-(y - x)`, not `y - x`: everything in the heap must stay negated."

  - title: Stop at one stone, answer 0 at none
    skill: edge
    goal: Loop only while at least two stones remain, then extract the answer safely from a heap that may be empty.
    instructions: |
      Play the full game and return `[smashes, last]`: how many smashes happened, and the
      weight of the last stone (`0` if none is left).

      Two details break most first attempts. The loop must be `while len(heap) > 1`; `while
      heap` tries to pop a second stone that doesn't exist when one is left. And when the game
      ends the heap holds either one stone or none, so the answer is `-heap[0]` only if the heap
      is non-empty.
    function:
      name: gameSummary
      params: [{name: stones}]
    starter_code: |
      class Solution:
          def gameSummary(self, stones: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1]], expected: [0, 1], note: no smash at all}
      - {args: [[2, 2]], expected: [1, 0]}
      - {args: [[2, 7, 4, 1, 8, 1]], expected: [4, 1]}
      - {args: [[1, 1, 1, 1]], expected: [2, 0]}
      - {args: [[5, 5, 5]], expected: [1, 5]}
    solution: |
      class Solution:
          def gameSummary(self, stones: List[int]) -> List[int]:
              heap = [-s for s in stones]
              heapq.heapify(heap)
              smashes = 0
              while len(heap) > 1:
                  y, x = -heapq.heappop(heap), -heapq.heappop(heap)
                  smashes += 1
                  if y != x:
                      heapq.heappush(heap, x - y)
              return [smashes, -heap[0] if heap else 0]
    hint: "`x - y` is already the negated form of `y - x`."

hints:
  - >-
    Every turn asks for the two heaviest stones, and then a new stone may appear. Which data
    structure gives you "the largest right now" cheaply even after you insert something new?
  - >-
    Use a max-heap by storing negated weights in heapq. While at least two stones remain, pop
    the heaviest y and the next x; if they differ, push back y − x (negated). At the end the heap
    has one stone or none.
  - |
    heap = negated stones; heapify(heap)
    while size(heap) > 1:
        y = -pop(heap); x = -pop(heap)
        if y != x: push(heap, -(y - x))
    return -heap root if heap not empty else 0

solution:
  code: |
    class Solution:
        def lastStoneWeight(self, stones: List[int]) -> int:
            heap = [-s for s in stones]  # heapq is a min-heap: negate so the heaviest is the root
            heapq.heapify(heap)
            while len(heap) > 1:
                y = -heapq.heappop(heap)  # heaviest
                x = -heapq.heappop(heap)  # second heaviest, x <= y
                if y != x:
                    heapq.heappush(heap, -(y - x))  # the survivor competes again
            return -heap[0] if heap else 0
  explanation: |
    The game is a simulation where the only thing you ever need is "the largest stone right
    now", twice per turn, plus "insert this new stone". That's precisely the interface of a
    max-heap: O(1) to see the top, O(log N) to pop it or push a new value.

    Python's `heapq` is a min-heap, so we store `-weight`. The heaviest stone is then the most
    negative value, which the heap keeps at `heap[0]`. Popping twice gives `y` then `x` with
    `x <= y` automatically. If they're equal, both are gone; otherwise `y - x` goes back in
    (negated), and the heap re-positions it, whether it is now the heaviest or the lightest.

    Every turn removes at least one stone, so there are at most N − 1 turns. The loop condition
    `len(heap) > 1` stops when fewer than two stones remain, and the final line handles both
    endings: one stone left (return its weight) or none (return 0).
  time: O(N log N) — heapify is O(N), then at most N − 1 turns of two pops and one push at O(log N) each
  space: O(N) — the negated copy of the stones
  brute_force_code: |
    class Solution:
        def lastStoneWeight(self, stones: List[int]) -> int:
            stones = list(stones)
            while len(stones) > 1:
                stones.sort()  # re-sort every turn
                y = stones.pop()
                x = stones.pop()
                if y != x:
                    stones.append(y - x)
            return stones[0] if stones else 0

pitch_script: |
  **(Clarify)** "So each turn I smash the two heaviest, equal stones both disappear, otherwise
  the heavier one survives with the difference, and I return the last weight or 0. There's at
  least one stone and the weights are positive, right?"

  **(Brute force)** "The direct way is to sort every turn and take the last two. With N up to
  30 that's actually fine, but it's O(N² log N), so if N were 10⁵ it would fall over. Most of
  each sort is redoing work from the previous turn."

  **(Trigger)** "What I really need every turn is 'the current maximum, twice' and then 'insert
  a new value'. That's exactly a max-heap. Python's heapq is a min-heap, so I'll store negated
  weights."

  **(Optimal)** "I negate the stones and heapify. While there are at least two stones, I pop the
  heaviest y and the next x. If they differ, I push y minus x back, negated. When the loop ends
  there's one stone or none, so I return its weight or 0."

  **(Complexity)** "Heapify is O(N). Each turn destroys at least one stone, so there are at most
  N minus one turns, each with two pops and one push at O(log N). That's O(N log N) time and
  O(N) space for the heap."

twist:
  lc: 2558
  title: Take Gifts From the Richest Pile
  why: >-
    Same max-heap simulation via negation, but each step touches only the single largest pile:
    pop it, push back floor(sqrt(pile)), and repeat for exactly k seconds instead of "until one
    is left". The survivor rule changes from y − x to isqrt(x), and the answer becomes the sum of
    what remains in the heap.

