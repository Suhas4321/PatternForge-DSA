slug: network-delay-time
lc: 743

concept:
  problem_it_solves: >-
    "What is the fastest way to get from one source to every node when edges have different
    costs?" BFS answers that only when every edge costs the same. With weights, the node you
    discover first is not necessarily the one you can reach soonest, so you need an order that
    always settles the closest unsettled node next. That is Dijkstra's algorithm.
  brute_force: >-
    Bellman-Ford: relax every edge (if dist[u] + w < dist[v], improve dist[v]) and repeat the
    whole pass n − 1 times, since a shortest path uses at most n − 1 edges. It works, but most
    passes re-relax edges out of nodes whose distance hasn't changed, which is wasted work.
  brute_force_complexity: >-
    O(V · E) time, O(V) space — fine for n = 100 and 6000 edges (6 × 10⁵ steps), but 10⁵ nodes
    and 2 × 10⁵ edges would be 2 × 10¹⁰ steps.
  key_insight: >-
    Process nodes in order of their arrival time. Keep a min-heap of (time, node). The smallest
    time popped is final: every other route to that node would have to go through some node still
    in the heap with an equal or larger time, and weights are never negative, so it can't arrive
    earlier. When you pop a node, relax its outgoing edges and push any improved neighbour times.
    A node can be pushed several times as better routes appear; when an older, larger entry is
    popped later, skip it (it's stale). The signal reaches everyone when the slowest node gets it,
    so the answer is the maximum shortest time, or −1 if some node is never reached.
  real_world: >-
    Link-state routing protocols (OSPF, IS-IS) run Dijkstra on every router to build forwarding
    tables from link latencies. Google Maps and Ola/Uber ETA engines run Dijkstra variants (A*,
    contraction hierarchies) on road graphs weighted by travel time, and CDN and service-mesh
    controllers pick lowest-latency paths between points of presence the same way.

statement:
  clean: |
    You are given a network of `n` nodes, labelled from `1` to `n`. You are also given `times`, a
    list of travel times as **directed edges** `times[i] = (ui, vi, wi)`, where `ui` is the source
    node, `vi` is the target node, and `wi` is the time it takes for a signal to travel from the
    source to the target.

    We will send a signal from a given node `k`. Return the **minimum time** it takes for
    **all the n nodes to receive the signal**. If it is impossible for all the `n` nodes to receive
    the signal, return `-1`.
  oa_story: |
    **PingPeacock — OA Round 1**

    PingPeacock runs a CDN for Indian OTT apps, with edge servers numbered `1` to `n` in data
    centres from Whitefield to Chennai. When a cricket highlight is re-encoded, the origin server
    `k` sends a cache-purge message. Servers forward it along one-way replication links; the link
    `[u, v, w]` means server `u` forwards to server `v` and the hop takes `w` milliseconds. A server
    forwards the purge on all its links as soon as it first receives it.

    The SRE team needs to know how many milliseconds after the purge starts every server has
    received it, so they can tell the product team when stale highlights are gone everywhere. If
    some server can never receive the purge through the links, report `-1` so the team can fix
    the replication topology. There are at most 100 servers and 6000 links, and hop times are
    between 0 and 100 ms.
  trigger_keywords: ["directed edges", "minimum time", "all the n nodes to receive the signal"]
  examples:
    - input: "times = [[2,1,1],[2,3,1],[3,4,1]], n = 4, k = 2"
      output: "2"
      explanation: "Nodes 1 and 3 receive the signal at time 1, node 4 at time 2 via 3."
    - input: "times = [[1,2,1]], n = 2, k = 1"
      output: "1"
    - input: "times = [[1,2,1]], n = 2, k = 2"
      output: "-1"
      explanation: "The only edge points from 1 to 2, so node 1 can never hear from node 2."
  constraints:
    - "1 <= k <= n <= 100"
    - "1 <= times.length <= 6000"
    - "times[i].length == 3"
    - "1 <= ui, vi <= n"
    - "ui != vi"
    - "0 <= wi <= 100"
    - "All the pairs (ui, vi) are unique (no multiple edges)."

constraint_quiz:
  prompt: >-
    With n <= 100 and 6000 edges, several approaches pass. Which complexity is the one to present
    as optimal, the one that still works if n grows to 10⁵ with 2 × 10⁵ edges?
  options:
    - "O(V³) — Floyd–Warshall, all pairs"
    - "O(V · E) — Bellman-Ford"
    - "O(E log V) — Dijkstra with a binary heap"
    - "O(V + E) — plain BFS"
  answer: 2
  explanation: >-
    Floyd–Warshall computes every pair (10¹⁵ steps at 10⁵ nodes) when only one source matters.
    Bellman-Ford is 2 × 10¹⁰ at that size. Plain BFS is fast but wrong: it finds the fewest hops,
    not the least time, so a 1-hop edge of weight 10 beats a 2-hop route of total 3. Dijkstra with
    a heap is O(E log V), a few million steps, and it needs non-negative weights, which the
    constraints guarantee.

pattern_quiz:
  prompt: >-
    Directed, weighted edges with non-negative weights, one source, and you need the earliest
    arrival time at every node. Which pattern fits?
  options:
    - "BFS level by level from k"
    - "Dijkstra: min-heap of (time, node), skipping stale entries"
    - "Topological sort, then relax edges in order"
    - "Union-Find to check that all nodes are connected"
  answer: 1
  explanation: >-
    "Minimum time", "weighted" and "from a source" are the shortest-path triggers, and
    non-negative weights mean Dijkstra applies. BFS ignores weights. A topological-order
    relaxation only works on DAGs, and this graph may have cycles. Union-Find tells you whether
    nodes are connected (and ignores direction) but says nothing about times.

