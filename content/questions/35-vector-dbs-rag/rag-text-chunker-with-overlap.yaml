      type: any
    - name: start
      type: any
    - name: size
      type: any
  starter_code: "class Solution:\n    def slice_text(self, text: str, start: int, size: int) -> str:\n        pass\n"
  tests:
  - args:
    - abcdef
    - 0
    - 4
    expected: abcd
  - args:
    - abcdef
    - 4
    - 4
    expected: ef
  solution: "class Solution:\n    def slice_text(self, text: str, start: int, size: int) -> str:\n        return text[start:min(start\
    \ + size, len(text))]\n"
  hint: Slice from start to min(start + size, len(text)).
- title: Format Chunk Metadata
  skill: edge
  goal: Assemble dictionary representation of chunk.
  instructions: Return dict with chunk_id, doc_id, chunk_index, start_char, end_char, char_count, text.
  function:
    name: make_chunk_dict
    params:
    - name: doc_id
      type: any
    - name: idx
      type: any
    - name: start
      type: any
    - name: end
      type: any
    - name: chunk_str
      type: any
  starter_code: "class Solution:\n    def make_chunk_dict(self, doc_id: str, idx: int, start: int, end: int, chunk_str: str)\
    \ -> dict:\n        pass\n"
  tests:
  - args:
    - d1
    - 0
    - 0
    - 5
    - hello
    expected:
      chunk_id: d1_c0
      doc_id: d1
      chunk_index: 0
      start_char: 0
      end_char: 5
      char_count: 5
      text: hello
  solution: "class Solution:\n    def make_chunk_dict(self, doc_id: str, idx: int, start: int, end: int, chunk_str: str) ->\
    \ dict:\n        return {\n            \"chunk_id\": f\"{doc_id}_c{idx}\",\n            \"doc_id\": doc_id,\n        \
    \    \"chunk_index\": idx,\n            \"start_char\": start,\n            \"end_char\": end,\n            \"char_count\"\
    : len(chunk_str),\n            \"text\": chunk_str,\n        }\n"
  hint: Build the metadata dict.
hints:
- 'Check validation boundaries: if overlap >= chunk_size or text is empty, return [].'
- Use step = chunk_size - chunk_overlap to advance the pointer.
- Slice text[start:min(start + chunk_size, len(text))] and break when end reaches len(text).
solution:
  code: "class Solution:\n    def chunk_document(self, doc_id: str, text: str, chunk_size: int, chunk_overlap: int) -> list[dict]:\n\
    \        if not text:\n            return []\n        if chunk_size <= 0 or chunk_overlap < 0 or chunk_overlap >= chunk_size:\n\
    \            return []\n            \n        step = chunk_size - chunk_overlap\n        chunks = []\n        chunk_idx\
    \ = 0\n        start = 0\n        n = len(text)\n        \n        while start < n:\n            end = min(start + chunk_size,\
    \ n)\n            chunk_str = text[start:end]\n            chunks.append({\n                \"chunk_id\": f\"{doc_id}_c{chunk_idx}\"\
    ,\n                \"doc_id\": doc_id,\n                \"chunk_index\": chunk_idx,\n                \"start_char\": start,\n\
    \                \"end_char\": end,\n                \"char_count\": len(chunk_str),\n                \"text\": chunk_str,\n\
    \            })\n            if end >= n:\n                break\n            start += step\n            chunk_idx +=\
    \ 1\n            \n        return chunks\n"
  explanation: Advances start by step = chunk_size - chunk_overlap, generating structured metadata chunks while preventing
    semantic truncation.
  time: O(N) where N is the character length of the text
  space: O(N) to store chunk strings and metadata
pitch_script: '**(Clarify)** "We need to implement a deterministic sliding-window text chunker for RAG document ingestion
  that emits chunk metadata with configurable overlap."


  **(Basement Insight)** "Arbitrary document chunking severs sentences and separates entities from their relational context.
  Overlapping chunks ensure that boundaries maintain semantic continuity."


  **(Solution)** "We validate input parameters, compute the step advance as `chunk_size - chunk_overlap`, and slice the text
  incrementally until the entire document is processed, tagging each chunk with unique coordinates."


  **(Complexity)** "Runs in O(N) linear time and space proportional to document length."

  '
