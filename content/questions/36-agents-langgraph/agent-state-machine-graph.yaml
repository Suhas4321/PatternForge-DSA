drills:
- title: Classify User Intent
  skill: setup
  goal: Extract intent string based on query keyword matching.
  instructions: Return 'billing' if 'refund' in query.lower(), 'auth' if 'reset' in query.lower(), else 'general'.
  function:
    name: classify_intent
    params:
    - name: query
      type: any
  starter_code: "class Solution:\n    def classify_intent(self, query: str) -> str:\n        pass\n"
  tests:
  - args:
    - Need a refund
    expected: billing
  - args:
    - Reset my PIN
    expected: auth
  - args:
    - Hello bot
    expected: general
  solution: "class Solution:\n    def classify_intent(self, query: str) -> str:\n        q = query.lower()\n        if \"\
    refund\" in q:\n            return \"billing\"\n        if \"reset\" in q:\n            return \"auth\"\n        return\
    \ \"general\"\n"
  hint: Check query.lower() for keywords 'refund' and 'reset'.
- title: Conditional Edge Routing
  skill: core
  goal: Map intent string to destination node ID.
  instructions: Return 'billing_agent' for 'billing', 'auth_agent' for 'auth', and 'general_agent' for 'general'.
  function:
    name: route_edge
    params:
    - name: intent
      type: any
  starter_code: "class Solution:\n    def route_edge(self, intent: str) -> str:\n        pass\n"
  tests:
  - args:
    - billing
    expected: billing_agent
  - args:
    - auth
    expected: auth_agent
  - args:
    - general
    expected: general_agent
  solution: "class Solution:\n    def route_edge(self, intent: str) -> str:\n        if intent == \"billing\":\n         \
    \   return \"billing_agent\"\n        if intent == \"auth\":\n            return \"auth_agent\"\n        return \"general_agent\"\
    \n"
  hint: Match intent against agent node names.
- title: Check Step Budget
  skill: edge
  goal: Evaluate whether step budget has been exhausted.
  instructions: Return True if steps >= max_steps, otherwise False.
  function:
    name: is_budget_exhausted
    params:
    - name: steps
      type: any
    - name: max_steps
      type: any
  starter_code: "class Solution:\n    def is_budget_exhausted(self, steps: int, max_steps: int) -> bool:\n        pass\n"
  tests:
  - args:
    - 10
    - 10
    expected: true
  - args:
    - 3
    - 10
    expected: false
  solution: "class Solution:\n    def is_budget_exhausted(self, steps: int, max_steps: int) -> bool:\n        return steps\
    \ >= max_steps\n"
  hint: Return steps >= max_steps.
hints:
- Initialize state copy and start at node 'classifier'.
- In each step, record current_node into visited_nodes and increment step counter.
- Inspect state intent to pick next node, or transition to '__end__' after agent execution.
solution:
  code: "class Solution:\n    def run_state_graph(self, initial_state: dict, max_steps: int = 10) -> dict:\n        state\
    \ = dict(initial_state)\n        state[\"log\"] = list(state.get(\"log\", []))\n        visited_nodes = []\n        current_node\
    \ = \"classifier\"\n        steps = 0\n        \n        while current_node != \"__end__\" and steps < max_steps:\n  \
    \          visited_nodes.append(current_node)\n            steps += 1\n            \n            if current_node == \"\
    classifier\":\n                q = state.get(\"query\", \"\").lower()\n                if \"refund\" in q:\n         \
    \           state[\"intent\"] = \"billing\"\n                elif \"reset\" in q:\n                    state[\"intent\"\
    ] = \"auth\"\n                else:\n                    state[\"intent\"] = \"general\"\n                state[\"log\"\
    ].append(\"classified\")\n                \n                # Conditional edge routing\n                if state[\"intent\"\
    ] == \"billing\":\n                    current_node = \"billing_agent\"\n                elif state[\"intent\"] == \"\
    auth\":\n                    current_node = \"auth_agent\"\n                else:\n                    current_node =\
    \ \"general_agent\"\n            elif current_node == \"billing_agent\":\n                state[\"log\"].append(\"billing_resolved\"\
    )\n                state[\"resolved\"] = True\n                current_node = \"__end__\"\n            elif current_node\
    \ == \"auth_agent\":\n                state[\"log\"].append(\"auth_resolved\")\n                state[\"resolved\"] =\
    \ True\n                current_node = \"__end__\"\n            elif current_node == \"general_agent\":\n            \
    \    state[\"log\"].append(\"general_resolved\")\n                state[\"resolved\"] = True\n                current_node\
    \ = \"__end__\"\n                \n        status = \"completed\" if current_node == \"__end__\" else \"max_steps_exceeded\"\
    \n        return {\n            \"final_state\": state,\n            \"visited_nodes\": visited_nodes,\n            \"\
    status\": status,\n        }\n"
  explanation: The graph executor cleanly separates node state mutation from conditional edge transitions. By checking the
    step budget at each iteration, it prevents infinite execution loops.
  time: O(S) where S is the number of executed steps (bounded by max_steps)
  space: O(S + N) for state log and visited nodes trail
pitch_script: '**(Clarify)** "We are implementing an agentic StateGraph finite state machine where a shared state dictionary
  transitions across nodes via conditional routing edges."


  **(Basement Insight)** "Without formal state machines, agent code quickly degrades into deeply nested try-catch if-else
  blocks. Modeling workflows as graphs provides deterministic replay, step budgeting, and explicit state handoffs."


  **(Solution)** "We start at the classifier node to categorize query intent. A conditional routing edge inspects this intent
  and directs execution to the appropriate specialist agent node, which mutates the state and routes to __end__. A max_steps
  guard stops rogue loops."


  **(Complexity)** "Executes in O(S) time and O(S) space bounded by max_steps."

  '
