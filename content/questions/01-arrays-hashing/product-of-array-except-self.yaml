slug: product-of-array-except-self
lc: 238

concept:
  problem_it_solves: >-
    "What is the combined effect of everything except this one item?" Everything except index i
    splits cleanly into two parts: everything to the left of i and everything to the right of
    i. If you precompute running totals from both ends, each answer is just left part × right
    part, and no work is ever repeated.
  brute_force: >-
    For each index i, loop over the whole array again and multiply every element except
    nums[i]. Neighbouring answers share almost all of their factors, yet each one recomputes
    the product from scratch. The tempting shortcut, total product ÷ nums[i], is banned, and it
    breaks on zeros anyway.
  brute_force_complexity: >-
    O(N²) time, O(1) extra space — 10⁵ elements means 10¹⁰ multiplications.
  key_insight: >-
    answer[i] = (product of everything left of i) × (product of everything right of i). Both
    halves are running products: sweep left to right carrying a prefix product, then right to
    left carrying a suffix product. Store the prefix in the output array itself and fold the
    suffix in on the way back, so the only extra memory is two numbers.
  real_world: >-
    Prefix/suffix aggregates power "leave-one-out" analysis: in ML feature attribution and
    A/B experiment dashboards, you measure the effect of removing one factor from a pipeline.
    Range-query systems and time-series databases store running aggregates for the same reason
    (any range answer becomes a combination of two precomputed values), and the two-pass
    left/right sweep shows up in stock-span and rain-water style analytics.

statement:
  clean: |
    Given an integer array `nums`, return an array `answer` such that `answer[i]` is equal to
    the **product of all the elements** of `nums` **except nums[i]**.

    The product of any prefix or suffix of `nums` is guaranteed to fit in a 32-bit integer.

    You must write an algorithm that runs in O(n) time and
    **without using the division operation**.

    **Follow-up:** can you solve it with O(1) extra space? (The output array does not count as
    extra space.)
  oa_story: |
    **AutoSawari Pricing — OA Round 2**

    AutoSawari runs auto-rickshaw bookings across Bengaluru. A fare passes through a chain of
    pricing stages (base distance, rain surge, Silk Board traffic factor, night charge,
    promo), and each stage multiplies the fare by an integer factor `nums[i]`. A stage that is
    switched off for maintenance reports a factor of `0`, and promo stages can report negative
    adjustment factors.

    For a "what if we dropped this stage?" report, the pricing team needs, for every stage
    `i`, the combined factor of **all the other stages** multiplied together. The pricing
    service runs on a legacy embedded module that has no division instruction, the chain can
    have up to 10⁵ stages, and the report must be produced in linear time using no memory
    beyond the output list. Every partial product along the chain fits in a 32-bit integer.
  trigger_keywords: ["product of all the elements", "except nums[i]", "without using the division operation"]
  examples:
    - input: "nums = [1,2,3,4]"
      output: "[24,12,8,6]"
      explanation: "answer[0] = 2·3·4 = 24, answer[1] = 1·3·4 = 12, answer[2] = 1·2·4 = 8, answer[3] = 1·2·3 = 6."
    - input: "nums = [-1,1,0,-3,3]"
      output: "[0,0,9,0,0]"
      explanation: "Every product that includes the 0 is 0. Only answer[2] skips it: -1·1·-3·3 = 9."
  constraints:
    - "2 <= nums.length <= 10^5"
    - "-30 <= nums[i] <= 30"
    - "The product of any prefix or suffix of nums fits in a 32-bit integer."

constraint_quiz:
  prompt: >-
    N can be 10⁵ and the statement demands O(n) time with no division. What time complexity
    should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(1)"]
  answer: 2
  explanation: >-
    O(N²) is 10¹⁰ multiplications, far too slow, and the statement asks for O(n) directly.
    O(N log N) usually means sorting, which scrambles the positions every answer[i] belongs to
    and is slower than required. O(1) is impossible because you must produce N outputs. Two
    linear sweeps (prefix then suffix) give O(N).

pattern_quiz:
  prompt: >-
    Each answer[i] combines everything except position i, division is banned, and the result
    must be O(n). Which pattern fits?
  options:
    - "Compute the total product, then divide by nums[i]"
    - "Prefix products × suffix products"
    - "Sliding window of fixed size"
    - "Hash map from value → product"
  answer: 1
  explanation: >-
    "Everything except i" is the prefix/suffix trigger: the excluded element splits the array
    into a left part and a right part, and both can be built as running products. Division is
    explicitly banned and fails on zeros. A sliding window covers a contiguous range, but
    "everything except i" is two ranges with a hole. A hash map doesn't help because the
    answer depends on positions, not on value lookups.

