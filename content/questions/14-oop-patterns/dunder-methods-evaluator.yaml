slug: dunder-methods-evaluator
lc: 9211
citadel_id: python_data
brick_layer: 1
runner_type: python_practical

concept:
  problem_it_solves: >-
    "How do we make our custom Python objects sortable, callable, and comparable like built-in types?"
    Instead of writing clumsy helper functions like `is_better(a, b)` or `obj.evaluate()`, Python provides
    dunder (double underscore) magic methods. Implementing `__lt__` makes objects work natively with `sorted()`,
    `__call__` turns instances into callables, and `__eq__` enables clean set/dict deduplication.
  brute_force: >-
    Writing ad-hoc procedural comparison loops with multiple dictionary lookups everywhere in business logic.
    This leads to brittle code where sorting criteria change in one place but break in five others.
  brute_force_complexity: O(N log N) sorting, but tightly coupled procedural code prone to maintenance bugs.
  key_insight: >-
    By implementing `__lt__(self, other)` to define strict order (e.g. higher accuracy first, lower latency on ties)
    and `__call__(self, threshold)` to test qualification, our classes integrate seamlessly with Python's standard library.
  real_world: >-
    PyTorch Modules (`model(inputs)` uses `__call__`), Pandas Series indexing (`__getitem__`), and automated LLM benchmark
    evaluation leaderboards (Drizz and GEPA prompt ranking).

statement:
  clean: |
    Implement an evaluation ranking system using Python dunder methods:
    `rank_benchmarks(records: list[dict], min_accuracy: float) -> list[str]`.
    
    Each item in `records` is a dictionary:
    `{"model": str, "latency": float, "accuracy": float}`.
    
    You need to:
    1. Define a class `BenchmarkResult` with attributes `model`, `latency`, and `accuracy`.
    2. Implement `__call__(self, min_acc: float) -> bool`: returns `True` if `self.accuracy >= min_acc`.
    3. Implement `__lt__(self, other: BenchmarkResult) -> bool`:
       - A model is "less than" another if its `accuracy` is strictly lower.
       - If accuracies are equal, the model with **higher** latency is "less than" the model with lower latency
         (meaning faster latency is ranked higher!).
    4. In `rank_benchmarks`:
       - Instantiate `BenchmarkResult` for each record.
       - Filter out any models where `model(min_accuracy)` returns `False`.
       - Sort the surviving models in descending order (highest ranked first).
       - Return the list of model names in sorted order.
  oa_story: |
    **GEPA Benchmarking Suite — Automated Leaderboard**
    
    In the prompt optimization framework, hundreds of mutated prompts and multi-provider models are benchmarked
    against validation suites. The evaluation team needs a clean, object-oriented scoring engine that ranks models
    by accuracy while using response latency as a tiebreaker.
    
    Implement `BenchmarkResult` with standard Python dunder methods so it natively supports callable filtering
    and Python's built-in `sorted(..., reverse=True)`.
  trigger_keywords: ["dunder methods", "rank_benchmarks", "records"]
  examples:
    - input: "records = [{'model': 'gpt-4o', 'latency': 450, 'accuracy': 0.95}, {'model': 'claude-3-5', 'latency': 320, 'accuracy': 0.95}], min_accuracy = 0.90"
      output: "['claude-3-5', 'gpt-4o']"
      explanation: "Both have 0.95 accuracy; claude-3-5 has lower latency (320ms < 450ms), so it ranks higher."
    - input: "records = [{'model': 'llama-3', 'latency': 150, 'accuracy': 0.80}], min_accuracy = 0.85"
      output: "[]"
      explanation: "Llama-3 fails the 0.85 accuracy threshold."
  constraints:
    - "records contains between 0 and 1000 items"
    - "accuracies are floats between 0.0 and 1.0"
    - "latencies are positive floats"

constraint_quiz:
  prompt: >-
    Which dunder method must you implement so that `obj(arg)` works like a function call?
  options:
    - "__init__"
    - "__call__"
    - "__invoke__"
    - "__exec__"
  answer: 1
  explanation: >-
    Implementing `__call__` allows an instance of a class to be called directly as a callable.

pattern_quiz:
  prompt: For `sorted(objects, reverse=True)` to work correctly, which comparison dunder method is primarily evaluated by Python?
  options:
    - "__lt__ (less than)"
    - "__gt__ (greater than)"
    - "__cmp__"
    - "__sort__"
  answer: 0
  explanation: >-
    Python's Timsort relies primarily on `__lt__` to order elements.

