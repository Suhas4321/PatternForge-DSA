tests:
  - {args: ["aab"], expected: [["a", "a", "b"], ["aa", "b"]]}
  - {args: ["a"], expected: [["a"]], note: single character}
  - {args: ["ab"], expected: [["a", "b"]], note: "no palindrome longer than 1: only single letters"}
  - {args: ["aaa"], expected: [["a", "a", "a"], ["a", "aa"], ["aa", "a"], ["aaa"]], note: "all same: every one of the 2^(N-1) cuttings is valid"}
  - {args: ["abba"], expected: [["a", "b", "b", "a"], ["a", "bb", "a"], ["abba"]], note: even-length palindromes}
  - {args: ["efe"], expected: [["e", "f", "e"], ["efe"]], note: "odd-length palindrome; \"ef\" and \"fe\" fail"}
  - {args: ["abc"], expected: [["a", "b", "c"]]}
  - {args: ["racecar"], expected: [["r", "a", "c", "e", "c", "a", "r"], ["r", "a", "cec", "a", "r"], ["r", "aceca", "r"], ["racecar"]], note: nested palindromes}
  - {args: ["aabb"], expected: [["a", "a", "b", "b"], ["a", "a", "bb"], ["aa", "b", "b"], ["aa", "bb"]]}
visualize_test: 0

drills:
  - title: Check a slice without slicing
    skill: setup
    goal: Test whether s[l..r] (inclusive) is a palindrome with two pointers moving inward.
    instructions: |
      Return `True` if the substring of `s` from index `l` to index `r` **inclusive** is a
      palindrome.

      Use two pointers that move toward each other and stop at the first mismatch, instead of
      building `s[l:r + 1]` and reversing it. In the full problem this check runs for every
      candidate piece, so it should work on indices and give up early. Note the inclusive
      `r`: the recursion talks about "the piece from start to end", and off-by-one here
      silently drops the last letter.
    function:
      name: isPal
      params: [{name: s}, {name: l}, {name: r}]
    starter_code: |
      class Solution:
          def isPal(self, s: str, l: int, r: int) -> bool:
              pass
    tests:
      - {args: ["aab", 0, 1], expected: true}
      - {args: ["aab", 0, 2], expected: false}
      - {args: ["racecar", 0, 6], expected: true}
      - {args: ["abca", 1, 2], expected: false}
      - {args: ["x", 0, 0], expected: true, note: a single letter is always a palindrome}
    solution: |
      class Solution:
          def isPal(self, s: str, l: int, r: int) -> bool:
              while l < r:
                  if s[l] != s[r]:
                      return False
                  l += 1
                  r -= 1
              return True
    hint: "`while l < r`: compare `s[l]` and `s[r]`, then move both pointers inward."

  - title: Choose where the next piece ends
    skill: core
    goal: Write the partition-backtracking skeleton that tries every end index for the next piece.
    instructions: |
      Return **every** way to cut `s` into contiguous non-empty pieces, with no palindrome
      condition at all. Any order of the cuttings is fine.

      This is the skeleton of the real solution: `dfs(start)` loops `end` from `start` to
      `len(s) - 1`, chooses the piece `s[start:end + 1]`, recurses from `end + 1`, and pops.
      When `start == len(s)` the pieces cover the whole string, so record a copy of `path`.
      For a string of length N you should get 2^(N−1) cuttings; the real problem only adds
      one `if` before choosing a piece.
    function:
      name: allPartitions
      params: [{name: s}]
      compare: unordered
    starter_code: |
      class Solution:
          def allPartitions(self, s: str) -> List[List[str]]:
              pass
    tests:
      - {args: ["ab"], expected: [["a", "b"], ["ab"]]}
      - {args: ["abc"], expected: [["a", "b", "c"], ["a", "bc"], ["ab", "c"], ["abc"]]}
      - {args: ["a"], expected: [["a"]]}
      - {args: ["aaa"], expected: [["a", "a", "a"], ["a", "aa"], ["aa", "a"], ["aaa"]], note: equal pieces in different positions are different cuttings}
    solution: |
      class Solution:
          def allPartitions(self, s: str) -> List[List[str]]:
              res, path = [], []

              def dfs(start):
                  if start == len(s):
                      res.append(path[:])
                      return
                  for end in range(start, len(s)):
                      path.append(s[start:end + 1])
                      dfs(end + 1)
                      path.pop()

              dfs(0)
              return res
    hint: "The base case is `start == len(s)`, not `end == len(s) - 1`; the piece is `s[start:end + 1]`."

  - title: Precompute every palindrome check
    skill: edge
    goal: Fill the pal[i][j] table in the right order so every substring check becomes O(1).
    instructions: |
      Return an `n x n` table where `pal[i][j]` is `True` exactly when `s[i..j]` (inclusive)
      is a palindrome; entries with `j < i` stay `False`.

      The recurrence is `pal[i][j] = s[i] == s[j] and (j - i < 2 or pal[i + 1][j - 1])`. Two
      details decide correctness. The `j - i < 2` guard covers lengths 1 and 2, where there
      is no inner substring (and `pal[i + 1][j - 1]` would read below the diagonal). And
      `pal[i][j]` needs `pal[i + 1][...]`, the row *below*, so `i` must run from `n - 1` down
      to 0. Filling top-down reads rows that haven't been computed yet. With this table the
      backtracking checks `pal[start][end]` in O(1).
    function:
      name: palTable
      params: [{name: s}]
    starter_code: |
      class Solution:
          def palTable(self, s: str) -> List[List[bool]]:
              pass
    tests:
      - {args: ["aab"], expected: [[true, true, false], [false, true, false], [false, false, true]]}
      - {args: ["aba"], expected: [[true, false, true], [false, true, false], [false, false, true]], note: "pal[0][2] depends on pal[1][1]"}
      - {args: ["abba"], expected: [[true, false, false, true], [false, true, true, false], [false, false, true, false], [false, false, false, true]], note: "length 2 uses the j - i < 2 guard"}
      - {args: ["a"], expected: [[true]]}
    solution: |
      class Solution:
          def palTable(self, s: str) -> List[List[bool]]:
              n = len(s)
              pal = [[False] * n for _ in range(n)]
              for i in range(n - 1, -1, -1):
                  for j in range(i, n):
                      pal[i][j] = s[i] == s[j] and (j - i < 2 or pal[i + 1][j - 1])
              return pal
    hint: "Loop `i` backwards (`range(n - 1, -1, -1)`) and `j` forwards from `i`."

hints:
  - >-
    Forget cuts for a moment. If you're standing at index start, what is the only decision you
    have to make before you can recurse on the rest of the string? How many options does it
    have, and which of them are allowed?
  - >-
    dfs(start): if start == len(s), path holds a full partition, so record a copy. Otherwise,
    for every end from start to len(s) − 1, if s[start..end] is a palindrome, push that piece,
    recurse with dfs(end + 1), then pop it.
  - |
    dfs(start):
        if start == len(s): record copy of path; return
        for end from start to len(s) - 1:
            if s[start..end] is a palindrome:
                push s[start..end]; dfs(end + 1); pop
    dfs(0)

solution:
  code: |
    class Solution:
        def partition(self, s: str) -> List[List[str]]:
            res, path = [], []

            def is_pal(l, r):  # is s[l..r] (inclusive) a palindrome?
                while l < r:
                    if s[l] != s[r]:
                        return False
                    l += 1
                    r -= 1
                return True

            def dfs(start):
                if start == len(s):
                    res.append(path[:])  # the pieces cover all of s
                    return
                for end in range(start, len(s)):  # choose where the next piece ends
                    if is_pal(start, end):
                        path.append(s[start:end + 1])  # choose
                        dfs(end + 1)  # explore the rest of the string
                        path.pop()  # un-choose

            dfs(0)
            return res
  explanation: |
    This is **partition backtracking**: the state is just `start`, the index where the next
    piece begins. The loop decides the piece's end, so the branches at each level are the
    pieces `s[start..start]`, `s[start..start+1]`, …, `s[start..n-1]`. Only palindromic pieces
    are chosen, which prunes a whole subtree the moment a piece fails: for "aab", the branch
    starting with "aab" is never explored, and neither is anything starting "ab".

    The base case is `start == len(s)`: every character has been placed in some piece, so
    `path` is a complete partition. Recording `path[:]` (a copy) matters because `path` is
    popped back to empty by the end. The pieces in `path` are always in left-to-right order,
    which is why the compare mode only ignores the order of the partitions, not the order
    inside one.

    **Optimisation:** the same substring is checked many times across branches. Precompute
    `pal[i][j] = s[i] == s[j] and (j - i < 2 or pal[i + 1][j - 1])`, filling `i` from
    `n - 1` down, in O(N²) time and space; then each check in the loop is a table lookup. It
    doesn't change the exponential bound (the output dominates) but removes the repeated
    two-pointer scans.
  time: >-
    O(N · 2^N) — "aaa…a" has 2^(N−1) partitions and each is copied in O(N); a two-pointer
    check costs O(N), or O(1) with the precomputed pal table
  space: O(N) — recursion depth and path, excluding the output (O(N²) more with the pal table)
  brute_force_code: |
    class Solution:
        def partition(self, s: str) -> List[List[str]]:
            n = len(s)
            res = []
            for mask in range(1 << (n - 1)):  # bit g set = cut after index g
                pieces, begin = [], 0
                for g in range(n - 1):
                    if mask >> g & 1:
                        pieces.append(s[begin:g + 1])
                        begin = g + 1
                pieces.append(s[begin:])
                if all(p == p[::-1] for p in pieces):
                    res.append(pieces)
            return res

pitch_script: |
  **(Clarify)** "I need every way to cut s into contiguous pieces where each piece is a
  palindrome, and the pieces stay in their original order inside each answer. The answers
  themselves can come in any order. Length is at most 16, lowercase only?"

  **(Brute force)** "There are N − 1 gaps, each cut or not, so 2^(N−1) cuttings. I could
  generate them all and filter, which is O(N · 2^N), but it keeps generating cuttings whose
  first piece already failed."

  **(Trigger)** "'Partition' plus 'all possible' is partition backtracking. Since N is tiny
  and the output can be exponential, the goal isn't polynomial time, it's not wasting work
  on dead branches."

  **(Optimal)** "I write dfs(start). If start equals the length, the path is a complete
  partition and I save a copy. Otherwise I try every end from start onward; if s[start..end]
  is a palindrome, I push it, recurse from end + 1, and pop it. A failing piece prunes its
  whole subtree. If the interviewer wants faster checks, I precompute a pal[i][j] table
  bottom-up so each check is O(1)."

  **(Complexity)** "Worst case is a string of one repeated letter, where all 2^(N−1)
  cuttings are valid, so O(N · 2^N) time because each answer is copied in O(N). Extra space
  is O(N) for recursion and the path, or O(N²) if I add the table."

twist:
  lc: 132
  title: Palindrome Partitioning II
  why: >-
    Now you only need the minimum number of cuts, not the partitions, and s can be 2000 long,
    so enumerating 2^N cuttings is out. Keep the same "where does the next piece end?" idea,
    but turn it into DP: cuts[i] = min over j ≤ i with pal[j][i] of cuts[j − 1] + 1 (0 when
    pal[0][i]). The pal table from this lesson's optimisation becomes mandatory, and the whole
    thing runs in O(N²).

