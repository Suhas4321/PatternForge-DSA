hints:
- Initialize sleep_log = [] and current_delay = initial_delay.
- Loop while attempts < max_attempts.
- If attempts <= failures_before_success and attempts < max_attempts, sleep and scale delay.
solution:
  code: "class Solution:\n    def execute_retry_workflow(self, failures_before_success: int, max_attempts: int, initial_delay:\
    \ float, backoff_factor: float) -> dict:\n        sleep_log = []\n        def injected_sleep(duration):\n            sleep_log.append(round(duration,\
    \ 2))\n            \n        attempts = 0\n        current_delay = initial_delay\n        success = False\n        result\
    \ = None\n        \n        while attempts < max_attempts:\n            attempts += 1\n            if attempts <= failures_before_success:\n\
    \                # Operation failed\n                if attempts < max_attempts:\n                    injected_sleep(current_delay)\n\
    \                    current_delay *= backoff_factor\n            else:\n                success = True\n            \
    \    result = \"Success\"\n                break\n                \n        return {\n            \"success\": success,\n\
    \            \"attempts\": attempts,\n            \"delays\": sleep_log,\n            \"result\": result,\n        }\n"
  explanation: Executes exponential backoff retry logic with zero wall-clock delay by recording backoff intervals via an injected
    sleep function.
  time: O(A) where A is max_attempts (bounded, typically <= 10)
  space: O(A) to store the sleep delay log
pitch_script: '**(Clarify)** "We need to implement an exponential backoff retry workflow with an injected sleep function that
  records delay intervals deterministically."


  **(Basement Insight)** "Coupling retry logic to system wall-clock sleep severely penalizes CI test speed. Injecting the
  sleep dependency allows instant verification of delay progressions."


  **(Solution)** "We track execution attempts. Each failure logs the current delay and scales it by the backoff factor until
  max_attempts is reached or the operation succeeds."


  **(Complexity)** "Executes in O(A) bounded iterations and O(A) space."

  '
