slug: container-with-most-water
lc: 11

concept:
  problem_it_solves: >-
    "Among all pairs, which one maximises (shorter height) × (distance)?" Checking every
    pair is quadratic. Starting with the widest pair and moving inward, each comparison
    proves that one of the two lines can never be part of a better container, so it can be
    discarded forever and the search finishes in one sweep.
  brute_force: >-
    Try every pair (i, j), compute min(height[i], height[j]) × (j − i), and keep the best.
    Most of those pairs are hopeless: once you have seen a short line paired with a far-away
    partner, every closer partner for that same short line can only be narrower and no
    taller, yet the brute force still evaluates all of them.
  brute_force_complexity: O(N²) time, O(1) space — 10⁵ lines means about 5 × 10⁹ pairs.
  key_insight: >-
    Put l and r at the two ends. The water is capped by the shorter line, say height[l].
    Every other container that uses line l pairs it with some r' between l and r: it is
    narrower, and its height is still at most height[l]. So none of them can beat the
    container you just measured, and line l is finished. Discard it (move l inward) and
    repeat. Moving the taller line instead could never help, because the shorter line still
    caps the height while the width shrinks.
  real_world: >-
    The same "the bottleneck side is settled, discard it" argument drives greedy matching
    in ride-hailing and logistics (pairing the heaviest load with the lightest that fits),
    and it is how query planners do merge-style scans over two sorted columns, advancing
    whichever side can no longer produce a better match.

statement:
  clean: |
    You are given an integer array `height` of length `n`. There are `n` vertical lines
    drawn such that the two endpoints of the `i`th line are `(i, 0)` and `(i, height[i])`.

    Find **two lines** that together with the x-axis form a container, such that the
    container holds the **most water**.

    Return the **maximum amount of water** a container can store. You may not slant the
    container, and the lines in between do not block the water.
  oa_story: |
    **UdaanFreight Logistics — OA Round 1**

    UdaanFreight's cross-dock in Whitefield has a straight row of `n` steel pillars, one
    metre apart, each with a different height. During the monsoon rush, the yard team
    creates temporary storage bays by hanging a roller shutter between two pillars. The
    shutter can only roll down from the top of the **shorter** of the two pillars, and the
    bay is as wide as the distance between them. The pillars in between are thin and don't
    get in the way.

    Given the list of pillar heights in order, return the largest front cross-section
    (height of the shutter × width of the bay) the team can create with a single pair of
    pillars. Bigger hubs have up to 100,000 pillars, and the planner tool must answer
    instantly.
  trigger_keywords: ["two lines", "most water", "maximum amount of water"]
  examples:
    - input: "height = [1,8,6,2,5,4,8,3,7]"
      output: "49"
      explanation: "Lines at index 1 (height 8) and index 8 (height 7): min(8, 7) × (8 − 1) = 49."
    - input: "height = [1,1]"
      output: "1"
  constraints:
    - "n == height.length"
    - "2 <= n <= 10^5"
    - "0 <= height[i] <= 10^4"

constraint_quiz:
  prompt: With up to 10⁵ lines, what time complexity do you need?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(log N)"]
  answer: 2
  explanation: >-
    O(N²) is about 5 × 10⁹ pairs, far too slow. Sorting the heights is O(N log N) but throws
    away the positions, and the width depends on positions, so sorting doesn't lead anywhere
    natural. Two pointers that discard one line per step is O(N). O(log N) is impossible:
    any line you never read could be the tallest one.

pattern_quiz:
  prompt: >-
    Choose two positions to maximise min(height[i], height[j]) × (j − i). Which pattern
    fits?
  options:
    - "Sort by height and pair the two tallest lines"
    - "Two pointers from both ends, always moving the shorter line inward"
    - "Monotonic stack of increasing heights"
    - "Sliding window that grows while the area increases"
  answer: 1
  explanation: >-
    Height alone is wrong because width matters: in [7, 8, 1, 1, 1, 6] the two tallest
    lines are adjacent and hold only 7, while lines 0 and 5 hold 6 × 5 = 30. A monotonic
    stack answers "next taller line", not "best pair". The area isn't monotonic in window size, so a window can't
    decide when to stop. "Best pair from both ends, where the shorter side is the
    bottleneck" is the opposite-ends greedy-discard trigger.

