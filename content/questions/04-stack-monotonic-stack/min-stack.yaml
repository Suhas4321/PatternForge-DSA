drills:
  - title: The running minimum of every prefix
    skill: setup
    goal: Build the list where entry k is the minimum of everything pushed up to k.
    instructions: |
      Given the values pushed onto a stack, in order (no pops), return a list where position
      `k` holds the minimum of the first `k + 1` values.

      This list *is* the auxiliary min stack. Each entry only needs the new value and the
      entry just below it: `min(x, mins[-1])`. You never look further back, which is why push
      stays O(1).
    function:
      name: runningMinimums
      params: [{name: pushes}]
    starter_code: |
      class Solution:
          def runningMinimums(self, pushes: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[3, 5, 2, 4, 1]], expected: [3, 3, 2, 2, 1]}
      - {args: [[1, 2, 3]], expected: [1, 1, 1]}
      - {args: [[-2, 0, -3]], expected: [-2, -2, -3]}
      - {args: [[5]], expected: [5], note: the first push has nothing below it}
      - {args: [[4, 4, 4]], expected: [4, 4, 4]}
    solution: |
      class Solution:
          def runningMinimums(self, pushes: List[int]) -> List[int]:
              mins = []
              for x in pushes:
                  mins.append(x if not mins else min(x, mins[-1]))
              return mins
    hint: "The first value has no previous minimum, so it is its own minimum."

  - title: Popping rolls the minimum back
    skill: core
    goal: Pop the min stack together with the main stack so the previous minimum reappears.
    instructions: |
      `ops` is a list where an integer means "push this value" and the string `"pop"` means
      "pop the top". After **every** operation, record the current minimum, or `null`
      (`None`) if the stack is empty. Return the recorded list.

      This is the move that makes Min Stack work: you never *compute* the old minimum after a
      pop; you just remove the newest running-minimum entry, and the one underneath is
      already the right answer.
    function:
      name: minAfterEachOp
      params: [{name: ops}]
    starter_code: |
      class Solution:
          def minAfterEachOp(self, ops: List) -> List:
              pass
    tests:
      - {args: [[3, 5, "pop", 1, "pop", "pop"]], expected: [3, 3, 3, 1, 3, null]}
      - {args: [[5, 4, 3, "pop", "pop"]], expected: [5, 4, 3, 4, 5]}
      - {args: [[2, 2, "pop"]], expected: [2, 2, 2], note: duplicate minimum survives one pop}
      - {args: [[1, "pop", 7]], expected: [1, null, 7], note: an empty stack has no minimum}
    solution: |
      class Solution:
          def minAfterEachOp(self, ops: List) -> List:
              mins = []
              out = []
              for op in ops:
                  if op == "pop":
                      mins.pop()
                  else:
                      mins.append(op if not mins else min(op, mins[-1]))
                  out.append(mins[-1] if mins else None)
              return out
    hint: "On `\"pop\"` just `mins.pop()`; the new `mins[-1]` is already the answer."

  - title: The space-saving version needs <=, not <
    skill: edge
    goal: Push onto the min stack only when the value is a new minimum or ties it, so duplicates survive pops.
    instructions: |
      A common optimisation keeps the min stack shorter: push `x` onto it **only if** it is
      empty or `x <= min_stack[-1]`, and later pop it only when the popped value equals
      `min_stack[-1]`. Given the pushed values (no pops), return the min stack after all
      pushes.

      The edge case people get wrong is ties. With `<` instead of `<=`, pushing 1, 1 stores
      a single 1; popping one 1 then removes it, and `getMin` wrongly forgets the other 1
      that is still on the stack. Ties must be stored too.
    function:
      name: compactMinStack
      params: [{name: pushes}]
    starter_code: |
      class Solution:
          def compactMinStack(self, pushes: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[2, 2, 1, 3]], expected: [2, 2, 1], note: the tie 2 is stored twice}
      - {args: [[5, 4, 3]], expected: [5, 4, 3]}
      - {args: [[1, 2, 3]], expected: [1], note: larger values never touch the min stack}
      - {args: [[3, 1, 1]], expected: [3, 1, 1]}
      - {args: [[0]], expected: [0]}
    solution: |
      class Solution:
          def compactMinStack(self, pushes: List[int]) -> List[int]:
              min_stack = []
              for x in pushes:
                  if not min_stack or x <= min_stack[-1]:
                      min_stack.append(x)
              return min_stack
    hint: "Ask: if I pop this value later, will the minimum still be correct without it?"

hints:
  - >-
    If you only store one "current minimum" and then pop that minimum, how would you know
    the minimum of what's left? What if every level of the stack remembered the minimum
    from that level down?
  - >-
    Keep two stacks of equal height. On push(val), append val to the main stack and
    min(val, current min) to the min stack. On pop, pop both. top reads the main stack's top;
    getMin reads the min stack's top.
  - |
    init: stack = empty, min_stack = empty
    push(val):
        stack.push(val)
        min_stack.push(val if min_stack empty else min(val, min_stack.top))
    pop():   stack.pop(); min_stack.pop()
    top():   return stack.top
    getMin(): return min_stack.top

solution:
  code: |
    class MinStack:

        def __init__(self):
            self.stack = []
            self.min_stack = []  # min_stack[k] = min(stack[0..k]); same height as stack

        def push(self, val: int) -> None:
            self.stack.append(val)
            current_min = val if not self.min_stack else min(val, self.min_stack[-1])
            self.min_stack.append(current_min)

        def pop(self) -> None:
            self.stack.pop()
            self.min_stack.pop()  # the entry below already holds the older minimum

        def top(self) -> int:
            return self.stack[-1]

        def getMin(self) -> int:
            return self.min_stack[-1]
  explanation: |
    A stack only changes at the top, so "the minimum of everything at or below this entry"
    is fixed for as long as that entry is on the stack. `min_stack` stores exactly that
    number for every level, so `min_stack[-1]` is always the minimum of the whole stack.

    Push needs only the new value and the previous minimum: `min(val, min_stack[-1])`. Pop
    removes both tops, and the entry that becomes the new top was computed when the stack
    looked exactly like it does now, so it is already correct. Duplicates are handled for
    free because every push writes its own min entry, which is why `[1, 1]` → pop still
    reports 1.

    An equivalent version stores `(val, current_min)` pairs in one stack. A space-saving
    version pushes onto `min_stack` only when `val <= min_stack[-1]` and pops it only when
    the popped value equals its top; the `<=` matters, or duplicate minimums get lost.
  time: O(1) — every method does a constant number of list appends, pops and reads
  space: O(N) — two stacks of N entries each (O(N) extra for the min stack)
  brute_force_code: |
    class MinStack:

        def __init__(self):
            self.stack = []

        def push(self, val: int) -> None:
            self.stack.append(val)

        def pop(self) -> None:
            self.stack.pop()

        def top(self) -> int:
            return self.stack[-1]

        def getMin(self) -> int:
            return min(self.stack)  # O(N) scan on every call

pitch_script: |
  **(Clarify)** "So I need push, pop, top and getMin all in O(1), and I can assume pop, top and
  getMin are only called on a non-empty stack. Values can repeat, including the minimum,
  right?"

  **(Brute force)** "The simple version is a normal list where getMin scans with min. That's
  O(N) per getMin. Tracking one min variable makes getMin O(1), but it breaks when I pop the
  minimum, because I've lost what the minimum was before it."

  **(Trigger)** "The 'minimum in constant time' plus 'pop' combination tells me I need the
  minimum to roll back on pop. A stack only changes at the top, so I can store the minimum
  as of each level in an auxiliary stack."

  **(Optimal)** "I keep two stacks of the same height. On push I append the value to the main
  stack and the minimum of the value and the current min to the min stack. On pop I pop
  both, and the min stack's new top is automatically the previous minimum. top reads the
  main stack and getMin reads the min stack."

  **(Complexity)** "Every operation is a constant number of appends or pops, so O(1) each, and
  O(N) extra space for the min stack. If space matters I can push to the min stack only on
  a new minimum or a tie, using less-than-or-equal so duplicates survive."

twist:
  lc: 1381
  title: Design a Stack With Increment Operation
  why: >-
    Now there's a bulk operation, increment(k, val), which adds val to the bottom k
    elements, and it must not cost O(k). Same idea of storing extra state per level: keep an
    inc array parallel to the stack and add val only at index min(k, size) − 1. On pop,
    return stack[top] + inc[top] and add inc[top] into inc[top − 1], so the pending
    increment rolls down lazily exactly like the running minimum rolls back.

viz:
  stacks: [self.stack, self.min_stack]
  watch: [val, current_min]
