drills:
  - title: Push indices, not values
    skill: setup
    goal: Loop over the array and keep a stack of indices that are still waiting for a warmer day.
    instructions: |
      Walk the array. Before pushing index `i`, pop indices while the temperature at the top of
      the stack is **strictly less** than `temperatures[i]`. Return the stack that is left at
      the end.

      Store **indices**, not temperatures: later you need the distance `i - index`, and you
      can always read the temperature back with `temperatures[index]`.
    function:
      name: remainingStack
      params: [{name: temperatures}]
    starter_code: |
      class Solution:
          def remainingStack(self, temperatures: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[73, 74, 75, 71, 69, 72, 76, 73]], expected: [6, 7]}
      - {args: [[90, 80, 70]], expected: [0, 1, 2]}
      - {args: [[30, 40, 50]], expected: [2]}
      - {args: [[70, 70]], expected: [0, 1]}
    solution: |
      class Solution:
          def remainingStack(self, temperatures: List[int]) -> List[int]:
              stack = []
              for i, t in enumerate(temperatures):
                  while stack and temperatures[stack[-1]] < t:
                      stack.pop()
                  stack.append(i)
              return stack
    hint: "`while stack and temperatures[stack[-1]] < t: stack.pop()` then `stack.append(i)`."

  - title: Answer the days you pop
    skill: core
    goal: Every index popped by day i gets its answer at that moment, i − index.
    instructions: |
      Same loop as before, but now each time you pop an index `j` because day `i` is warmer,
      record `answer[j] = i - j`. Return `answer` (start it as all zeros).

      This is the whole trick: the warmer day resolves everyone waiting below it.
    function:
      name: waitDays
      params: [{name: temperatures}]
    starter_code: |
      class Solution:
          def waitDays(self, temperatures: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[73, 74, 75, 71, 69, 72, 76, 73]], expected: [1, 1, 4, 2, 1, 1, 0, 0]}
      - {args: [[30, 40, 50, 60]], expected: [1, 1, 1, 0]}
      - {args: [[60, 50, 40, 70]], expected: [3, 2, 1, 0]}
    solution: |
      class Solution:
          def waitDays(self, temperatures: List[int]) -> List[int]:
              answer = [0] * len(temperatures)
              stack = []
              for i, t in enumerate(temperatures):
                  while stack and temperatures[stack[-1]] < t:
                      j = stack.pop()
                      answer[j] = i - j
                  stack.append(i)
              return answer
    hint: "Pop into a variable: `j = stack.pop()`, then `answer[j] = i - j`."

  - title: Equal isn't warmer, and leftovers need a default
    skill: edge
    goal: Use a strict comparison and give unresolved days a default answer.
    instructions: |
      Return, for each day, the **index** of the next strictly warmer day, or `-1` if there is
      none.

      Two details decide correctness: an equal temperature must **not** pop (use `<`, not
      `<=`), and days still on the stack at the end never get resolved, so the result has to
      start filled with the default (`-1` here, `0` in the real problem).
    function:
      name: nextWarmerIndex
      params: [{name: temperatures}]
    starter_code: |
      class Solution:
          def nextWarmerIndex(self, temperatures: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[70, 70, 70]], expected: [-1, -1, -1], note: equal is not warmer}
      - {args: [[73, 74, 75, 71, 69, 72, 76, 73]], expected: [1, 2, 6, 5, 5, 6, -1, -1]}
      - {args: [[30, 40]], expected: [1, -1]}
      - {args: [[50]], expected: [-1]}
      - {args: [[60, 60, 61]], expected: [2, 2, -1]}
    solution: |
      class Solution:
          def nextWarmerIndex(self, temperatures: List[int]) -> List[int]:
              result = [-1] * len(temperatures)
              stack = []
              for i, t in enumerate(temperatures):
                  while stack and temperatures[stack[-1]] < t:
                      result[stack.pop()] = i
                  stack.append(i)
              return result
    hint: "Start with `[-1] * n`; when day `i` pops index `j`, set `result[j] = i`."

