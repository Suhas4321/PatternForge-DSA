slug: lru-cache
lc: 146

concept:
  problem_it_solves: >-
    "Which key was used least recently?", answered in O(1) while keys are being read and
    written all the time. A hash map finds a key instantly but has no idea of order; a list
    keeps order but finding a key in it is O(N). Put both together, a map from key to a node
    in a doubly linked list kept in recency order, and every operation becomes a lookup plus
    a constant number of pointer changes.
  brute_force: >-
    Keep a dictionary for the values and a Python list of keys in recency order. Every get or
    put on an existing key has to find that key in the list (list.remove) and move it to the
    end, and evicting from the front (pop(0)) shifts every remaining element. The order
    information is there, but reaching a key's position in it costs a scan every time.
  brute_force_complexity: O(capacity) per get/put, O(capacity) space — 2 × 10⁵ calls on a 3000-entry cache means up to ~6 × 10⁸ element moves.
  key_insight: >-
    The two jobs need two structures that point at each other. A doubly linked list holds the
    entries in recency order (most recent right after a dummy `head`, least recent right
    before a dummy `tail`); because each node knows its `prev` and `next`, it can be unlinked
    from the middle in O(1). The hash map stores key → node, so you can jump straight to the
    node you need to move. And each node stores its own key, so when you evict `tail.prev`
    you know which map entry to delete. The dummy head and tail mean insert and unlink never
    have to check for an empty list or a missing neighbour.
  real_world: >-
    Memcached and Redis (allkeys-lru, approximated) evict cold keys this way, the Linux page
    cache keeps active/inactive LRU lists of pages, and CDNs and browser caches drop the least
    recently requested objects first. Python's functools.lru_cache is implemented as exactly
    this: a dict plus a circular doubly linked list with a sentinel root.

statement:
  clean: |
    Design a data structure that follows the constraints of a
    **Least Recently Used (LRU) cache**.

    Implement the `LRUCache` class:

    - `LRUCache(int capacity)` initializes the LRU cache with **positive** size `capacity`.
    - `int get(int key)` returns the value of the `key` if the key exists, otherwise returns
      `-1`.
    - `void put(int key, int value)` updates the value of the `key` if the `key` exists.
      Otherwise, adds the key-value pair to the cache. If the number of keys exceeds the
      `capacity` from this operation, **evict the least recently used key**.

    The functions `get` and `put` must each run in **O(1) average time complexity**.

    Both `get` and `put` count as a use of the key.
  oa_story: |
    **CacheChai Edge — OA Round 2**

    CacheChai runs a small edge server in every Bengaluru data-centre rack for food-delivery
    apps. Each server keeps restaurant menus in memory, but it only has room for `capacity`
    menus at once. A menu is "touched" whenever it is read or written. When a new menu has to
    be stored and the server is full, the menu that has gone the longest without being touched
    is thrown out to make room. Updating a menu that is already stored just replaces its
    contents and counts as a touch.

    Implement `LRUCache(capacity)`, `get(key)` (return the stored menu version for restaurant
    `key`, or -1 if it isn't on the server) and `put(key, value)` (store or update a menu). A
    lunch rush at 1 PM sends up to 200,000 requests, so every call must take the same small,
    constant amount of work regardless of how many menus are stored.
  trigger_keywords: ["Least Recently Used (LRU) cache", "evict the least recently used key", "O(1) average time complexity"]
  examples:
    - input: |
        ["LRUCache","put","put","get","put","get","put","get","get","get"]
        [[2],[1,1],[2,2],[1],[3,3],[2],[4,4],[1],[3],[4]]
      output: "[null,null,null,1,null,-1,null,-1,3,4]"
      explanation: "get(1) makes key 1 the most recent, so put(3) evicts key 2. Then put(4) evicts key 1, the least recent of {1, 3}."
    - input: |
        ["LRUCache","put","put","get","put","put","get"]
        [[2],[2,1],[2,2],[2],[1,1],[4,1],[2]]
      output: "[null,null,null,2,null,null,-1]"
      explanation: "put(2, 2) updates key 2 instead of adding a second entry. After put(1, 1) and put(4, 1), key 2 is the least recent and gets evicted."
  constraints:
    - "1 <= capacity <= 3000"
    - "0 <= key <= 10^4"
    - "0 <= value <= 10^5"
    - "At most 2 * 10^5 calls will be made to get and put."

constraint_quiz:
  prompt: >-
    Up to 2 × 10⁵ calls with a capacity of up to 3000, and the statement demands O(1) average
    per call. What can a single get or put afford?
  options:
    - "O(capacity) — scan a list of keys to update the order"
    - "O(log capacity) — keep entries in a heap ordered by last-used time"
    - "O(1) — a hash lookup plus a constant number of pointer changes"
    - "O(1) for get, O(capacity) for put — only scan when evicting"
  answer: 2
  explanation: >-
    Scanning a key list is O(capacity), up to ~6 × 10⁸ steps here and it breaks the stated
    requirement. A heap of timestamps makes each touch O(log capacity) and needs lazy
    deletion for stale entries, so it isn't O(1). "Only scan when evicting" fails too: once
    the cache is full, every put of a new key evicts, so put is O(capacity) on exactly the
    hot path. A hash map into a doubly linked list makes both calls a lookup plus a few
    pointer writes.

pattern_quiz:
  prompt: >-
    You need O(1) lookup by key and O(1) "move this entry to the most-recent end" and
    "remove the oldest entry". Which design fits?
  options:
    - "A hash map plus a queue of keys"
    - "A hash map from key to node in a doubly linked list ordered by recency, with dummy head and tail"
    - "A hash map plus a singly linked list ordered by recency"
    - "A min-heap keyed by last access time"
  answer: 1
  explanation: >-
    A queue can pop the oldest key, but a get on a key in the middle has to move it to the
    back, which a queue can't do without scanning. A singly linked list can't unlink a node in
    O(1) because the node doesn't know its predecessor. A heap gives O(log N), not O(1). The
    trigger "evict least recently used" + "O(1)" points to the doubly linked list: the map
    jumps to the node, and prev/next let you cut it out and reinsert it at the front in
    constant time.

