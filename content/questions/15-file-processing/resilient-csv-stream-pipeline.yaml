slug: resilient-csv-stream-pipeline
lc: 9224
citadel_id: python_data
brick_layer: 4
runner_type: python_practical

concept:
  problem_it_solves: >-
    "What happens when a 50GB telemetry CSV dump contains random corrupted rows, extra commas, or malformed numbers?"
    Standard parsers crash the entire batch halfway through with `ValueError` or `IndexError`, aborting hours of ETL progress.
    A resilient streaming CSV pipeline parses records sequentially, casts types safely, and drops malformed records into a dead-letter log.
  brute_force: >-
    Using `csv.reader` without defensive schema validation. A single misplaced comma or missing integer field halts the entire pipeline.
  brute_force_complexity: O(N) operations, but zero error tolerance.
  key_insight: >-
    Read the header row first to establish the expected column count and names. For each subsequent row, verify that the column
    count matches exactly before attempting type casting. Use safe scalar conversion helpers (`try int -> try float -> bool -> str`)
    so valid rows are ingested cleanly even if corrupted lines are present.
  real_world: >-
    Data warehouse ingestion (Snowflake Snowpipe, BigQuery CSV imports), telemetry log ETL, and Stripe transaction exports.

statement:
  clean: |
    Implement a fault-tolerant CSV log parser using csv streaming:
    `ingest_csv_stream(csv_lines: list[str]) -> list[dict]`.
    
    Given a list of strings representing lines from an incoming CSV stream:
    1. The first non-empty line represents the header row containing comma-separated column names.
       Strip whitespace from each column name.
    2. If `csv_lines` is empty or contains no valid header, return `[]`.
    3. For each subsequent line:
       - Strip leading and trailing whitespace. If the line is empty, skip it.
       - Split the line by commas `,` and strip whitespace from each value.
       - If the number of values does NOT match the number of header columns, skip the row as corrupted.
       - Convert each value to its appropriate Python type:
         - If value lowercased is `"true"`, cast to `True`.
         - If value lowercased is `"false"`, cast to `False`.
         - Otherwise, try casting to `int`.
         - If that fails, try casting to `float`.
         - If all numeric casts fail, retain the value as a trimmed `str`.
       - Create a dictionary mapping header names to the parsed typed values.
    4. Return the list of valid, typed row dictionaries in order.
  oa_story: |
    **Drizz Device Farm — Telemetry CSV Ingestion**
    
    During 24-hour stability testing on mobile device clusters, device logs are written to rotating CSV files.
    When a device loses power or disconnects mid-write, partial corrupted lines are flushed to disk.
    The daily analytics ingestion job crashed every morning on these truncated lines.
    
    Build a resilient streaming parser that validates row schemas and gracefully filters out corrupted records.
  trigger_keywords: ["csv streaming", "ingest_csv_stream", "csv_lines"]
  examples:
    - input: "csv_lines = ['id, device, latency, success', '101, Pixel 8, 320, true', '102, S23, invalid_line', '103, iPhone 15, 210, false']"
      output: "[{'id': 101, 'device': 'Pixel 8', 'latency': 320, 'success': True}, {'id': 103, 'device': 'iPhone 15', 'latency': 210, 'success': False}]"
      explanation: "Row 102 has only 3 values instead of 4, so it is filtered out as corrupted."
  constraints:
    - "csv_lines contains between 0 and 1000 lines"
    - "column names are non-empty strings"

constraint_quiz:
  prompt: >-
    What is the safest way to convert a string to int/float while allowing non-numeric strings to remain strings?
  options:
    - "Check s.isdigit() and then int(s)"
    - "Use a try/except ValueError block falling through from int -> float -> str"
    - "Use eval(s)"
    - "Cast directly with float(s)"
  answer: 1
  explanation: >-
    A try/except block cleanly handles negative numbers, floats, and strings without brittle regex checks or dangerous eval().

pattern_quiz:
  prompt: What should a robust data engineering ingestion pipeline do when encountering a corrupted row in a massive file?
  options:
    - "Crash immediately and abort the entire job"
    - "Log the corrupted row to a dead-letter queue and continue processing valid rows"
    - "Fill all missing values with random numbers"
    - "Delete the entire file from disk"
  answer: 1
  explanation: >-
    Skipping corrupted rows (or sending them to a Dead-Letter Queue / DLQ) prevents localized glitches from halting entire data pipelines.

