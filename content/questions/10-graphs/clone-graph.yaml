visualize_test: 0

drills:
  - title: Visit every node once, despite cycles
    skill: setup
    goal: Traverse a graph of node objects with a visited set and read back its adjacency list.
    instructions: |
      Return the graph's adjacency list: entry `v - 1` is the list of `val`s of the neighbours of the
      node with `val = v`, in the order they are stored in `neighbors`. Return `[]` if `node` is
      `None`.

      Before you can copy a graph you must be able to *walk* it. Unlike a tree, a graph has no
      "children only" direction: node 1's neighbour 2 lists 1 again. A `visited` set of node objects
      (an explicit `stack` works well here) makes sure each node is expanded exactly once. You also
      need to find every node, because only node 1 is handed to you.
    function:
      name: adjacencyOf
      params: [{name: node, type: GraphNode}]
    starter_code: |
      class Solution:
          def adjacencyOf(self, node: Optional['Node']) -> List[List[int]]:
              pass
    tests:
      - {args: [[[2, 4], [1, 3], [2, 4], [1, 3]]], expected: [[2, 4], [1, 3], [2, 4], [1, 3]]}
      - {args: [[[]]], expected: [[]]}
      - {args: [[]], expected: [], note: "no node at all"}
      - {args: [[[2, 3], [1, 3], [1, 2]]], expected: [[2, 3], [1, 3], [1, 2]], note: "a cycle must not loop forever"}
    solution: |
      class Solution:
          def adjacencyOf(self, node: Optional['Node']) -> List[List[int]]:
              if node is None:
                  return []
              visited, stack = {node}, [node]
              while stack:
                  cur = stack.pop()
                  for nb in cur.neighbors:
                      if nb not in visited:
                          visited.add(nb)
                          stack.append(nb)
              ordered = sorted(visited, key=lambda n: n.val)
              return [[nb.val for nb in n.neighbors] for n in ordered]
    hint: "Add a neighbour to `visited` when you push it; nodes are hashable, so a set of nodes works."

  - title: One object per node, wired through a lookup table
    skill: core
    goal: Build nodes from an adjacency list by creating each node exactly once and wiring edges through a table.
    instructions: |
      Build the graph described by `adjList` (1-indexed, as in the tests) out of `Node` objects and
      return the node with `val = 1`, or `None` if the list is empty.

      This is the lookup-table half of Clone Graph. If you write `Node(v)` every time you meet `v` in
      a neighbour list, you get many different objects all claiming to be node `v`, and the edges
      point at the wrong ones. Instead, create every node once, keep them in a table (`nodes[v - 1]`),
      and wire each edge by **looking up** the existing object. In Clone Graph, the `copies` map plays
      exactly this role, keyed by the original node instead of an index.
    function:
      name: buildGraph
      params: [{name: adjList}]
      returns: GraphNode
    starter_code: |
      class Solution:
          def buildGraph(self, adjList: List[List[int]]) -> Optional['Node']:
              pass
    tests:
      - {args: [[[2, 4], [1, 3], [2, 4], [1, 3]]], expected: [[2, 4], [1, 3], [2, 4], [1, 3]]}
      - {args: [[[2], [1]]], expected: [[2], [1]]}
      - {args: [[[]]], expected: [[]]}
      - {args: [[]], expected: [], note: "empty list: return None"}
    solution: |
      class Solution:
          def buildGraph(self, adjList: List[List[int]]) -> Optional['Node']:
              if not adjList:
                  return None
              nodes = [Node(i + 1) for i in range(len(adjList))]  # each node created once
              for i, neighbor_vals in enumerate(adjList):
                  for v in neighbor_vals:
                      nodes[i].neighbors.append(nodes[v - 1])  # look up, never re-create
              return nodes[0]
    hint: "Create all nodes first, then a second loop appends `nodes[v - 1]` to each neighbour list."

  - title: Clone breadth-first, creating copies on discovery
    skill: edge
    goal: Clone with BFS, creating each copy the moment a node is first seen so no node is copied twice.
    instructions: |
      Clone the graph again, but **iteratively with a queue** (BFS) instead of recursion. Return the
      copy of `node`, or `None`.

      The edge case lives in the timing. Create a node's copy (and put it in `copies`) the moment you
      first **discover** it as someone's neighbour, then enqueue it. If you wait until it's popped to
      create the copy, a node discovered by two neighbours is enqueued twice and copied twice, and
      half of the edges point at a duplicate. With the copy created on discovery, every edge can be
      wired immediately: `copies[cur].neighbors.append(copies[nb])`.
    function:
      name: cloneGraphBFS
      params: [{name: node, type: GraphNode}]
      returns: GraphNode
    starter_code: |
      class Solution:
          def cloneGraphBFS(self, node: Optional['Node']) -> Optional['Node']:
              pass
    tests:
      - {args: [[[2, 4], [1, 3], [2, 4], [1, 3]]], expected: [[2, 4], [1, 3], [2, 4], [1, 3]]}
      - {args: [[[2, 3, 4], [1, 3, 4], [1, 2, 4], [1, 2, 3]]], expected: [[2, 3, 4], [1, 3, 4], [1, 2, 4], [1, 2, 3]], note: "every node discovered several times"}
      - {args: [[[]]], expected: [[]]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def cloneGraphBFS(self, node: Optional['Node']) -> Optional['Node']:
              if node is None:
                  return None
              copies = {node: Node(node.val)}
              queue = deque([node])
              while queue:
                  cur = queue.popleft()
                  for nb in cur.neighbors:
                      if nb not in copies:
                          copies[nb] = Node(nb.val)  # copy on discovery
                          queue.append(nb)
                      copies[cur].neighbors.append(copies[nb])
              return copies[node]
    hint: "Seed `copies` with the start node's copy before the loop, and wire the edge whether or not `nb` was new."

hints:
  - >-
    Copying a node means copying its neighbours, whose neighbours include the node you started with.
    What do you need to remember so you never copy the same node twice, and so an edge can point at
    a copy that already exists?
  - >-
    Keep a map from original node → its copy. clone(n): if n is in the map, return its copy.
    Otherwise create the copy, put it in the map *right away*, then append clone(neighbour) for each
    neighbour. Why does the order of those last two steps matter on a cycle?
  - |
    copies = empty map (original -> clone)
    clone(cur):
        if cur in copies: return copies[cur]
        twin = new Node(cur.val)
        copies[cur] = twin                  (register before visiting neighbours)
        for each nb in cur.neighbors:
            twin.neighbors.append(clone(nb))
        return twin
    return None if node is None else clone(node)

solution:
  code: |
    class Solution:
        def cloneGraph(self, node: Optional['Node']) -> Optional['Node']:
            if node is None:
                return None
            copies = {}  # original node -> its clone; doubles as the visited set

            def clone(cur):
                if cur in copies:
                    return copies[cur]  # already copied (or being copied): just link to it
                twin = Node(cur.val)
                copies[cur] = twin  # register BEFORE recursing, so cycles find this copy
                for nb in cur.neighbors:
                    twin.neighbors.append(clone(nb))
                return twin

            return clone(node)
  explanation: |
    **One thing changed from the earlier lessons: the DFS builds something.** It's still a DFS with a
    visited mark, but the mark is a dictionary that also stores *what you built* for each node:
    `copies[original] = clone`.

    **Why register before recursing.** Take the 2-node graph 1 ↔ 2. `clone(1)` creates `1'` and
    stores it, then calls `clone(2)`. That creates `2'` and stores it, then looks at 2's neighbour,
    node 1. Node 1 is already in `copies`, so `clone(1)` immediately returns `1'` (still half-built,
    which is fine: it's the right object) and `2'` links to it. Back in the first call, `1'` links to
    `2'`. If you stored `1'` only *after* the loop, `clone(2)` would not find it, would call
    `clone(1)` again, and the recursion would never end.

    **Why a map and not a set.** A visited set would stop the loop, but when you meet an
    already-visited neighbour you'd have no way to find *its copy* to link to. The map answers both
    "seen it?" and "where's its copy?".

    **Keyed by node, not by value.** `copies` uses the node objects as keys. Here values happen to be
    unique, so `val` would also work, but keying by identity is what generalises to deep-copying any
    object graph.

    The harness checks that no original node appears in your answer; returning `node` itself, or
    linking a clone to an original neighbour, fails. BFS works equally well (see the edge drill).
  time: O(V + E) — each node is cloned once, and each adjacency entry (2 per undirected edge) is followed once
  space: O(V) — the copies map plus the recursion stack (up to V deep on a path-shaped graph), not counting the clone itself

pitch_script: |
  **(Clarify)** "I get a reference to node 1 of a connected undirected graph, or None for an empty
  graph, and I return node 1 of a brand-new copy, with no original nodes reused. Values are unique,
  and there are at most 100 nodes."

  **(Brute force)** "If I just copy a node and recursively copy its neighbours, it never terminates:
  an undirected edge means node 2 lists node 1 back, so I'd copy 1 again, then 2 again, forever.
  So the real question is how to remember what I've already copied."

  **(Trigger)** "'Deep copy' of a structure with cycles is the hash-map-from-old-to-new pattern. The
  map is my visited set, and it also tells me where each node's copy is so edges can point to it."

  **(Optimal)** "I'll do a DFS. clone(cur) first checks the map; if cur is already there, it returns
  the existing copy. Otherwise it creates a new node with the same value, stores it in the map
  immediately, and then for each neighbour appends clone(neighbour) to the new node's list. Storing
  before recursing is what lets a cycle come back around and find the half-built copy instead of
  recursing forever. I return clone(node), or None if the input is None."

  **(Complexity)** "Each node is created once and each edge is followed once from each side, so
  O(V + E) time, and O(V) extra space for the map and the recursion stack. If the graph were huge
  I'd switch to BFS with a queue, creating each copy when the node is first discovered."

twist:
  lc: 138
  title: Copy List with Random Pointer
  why: >-
    Now the structure is a linked list where each node also has a `random` pointer to any node (or
    null), so it's a graph with out-degree 2. The same old → new map does it: create the copy of
    every node in a first pass, then wire `copy.next = copies[old.next]` and
    `copy.random = copies[old.random]` in a second (exactly the buildGraph drill). The follow-up is
    O(1) extra space: interleave each copy right after its original (A → A' → B → B'), set
    `A'.random = A.random.next`, then unweave the two lists.

