drills:
  - title: Parse CSV header
    skill: setup
    goal: Extract trimmed column headers.
    instructions: |
      Given a header line `"col1, col2 , col3"`, return `["col1", "col2", "col3"]`.
    function:
      name: parse_headers
      params: [{name: line}]
    starter_code: |
      class Solution:
          def parse_headers(self, line: str) -> list[str]:
              pass
    tests:
      - {args: ["id, name, age"], expected: ["id", "name", "age"]}
      - {args: ["status"], expected: ["status"]}
    solution: |
      class Solution:
          def parse_headers(self, line: str) -> list[str]:
              return [col.strip() for col in line.split(",") if col.strip()]
    hint: "Use `[col.strip() for col in line.split(',') if col.strip()]`."

  - title: Safe scalar type casting
    skill: core
    goal: Convert string to bool, int, float, or str.
    instructions: |
      Cast `"true"`/`"false"` to bool, integer strings to int, decimal strings to float, otherwise str.
    function:
      name: cast_scalar
      params: [{name: val}]
    starter_code: |
      class Solution:
          def cast_scalar(self, val: str):
              pass
    tests:
      - {args: ["42"], expected: 42}
      - {args: ["3.14"], expected: 3.14}
      - {args: ["true"], expected: true}
      - {args: ["hello"], expected: "hello"}
    solution: |
      class Solution:
          def cast_scalar(self, val: str):
              v = val.strip()
              if v.lower() == "true":
                  return True
              if v.lower() == "false":
                  return False
              try:
                  return int(v)
              except ValueError:
                  pass
              try:
                  return float(v)
              except ValueError:
                  pass
              return v
    hint: "Check bool first, then try int, then try float, else return trimmed string."

  - title: Match row length against header
    skill: edge
    goal: Verify row column count.
    instructions: |
      Return `True` if `len(row_tokens) == header_count`, else `False`.
    function:
      name: is_valid_row_len
      params: [{name: tokens}, {name: expected_len}]
    starter_code: |
      class Solution:
          def is_valid_row_len(self, tokens: list, expected_len: int) -> bool:
              pass
    tests:
      - {args: [["a", "b"], 2], expected: true}
      - {args: [["a"], 3], expected: false}
    solution: |
      class Solution:
          def is_valid_row_len(self, tokens: list, expected_len: int) -> bool:
              return len(tokens) == expected_len
    hint: "Return len(tokens) == expected_len."

hints:
  - "Find the first non-empty line and split by `,` to establish the header names."
  - "Write a helper `_cast(val)` that checks bool, then `int()`, then `float()`, else `str`."
  - "Iterate over remaining lines: split, strip, verify length equals `len(headers)`, and build dictionary."

solution:
  code: |
    class Solution:
        def ingest_csv_stream(self, csv_lines: list[str]) -> list[dict]:
            # Step 1: Locate header row
            headers = None
            data_start = 0
            for idx, raw in enumerate(csv_lines):
                line = raw.strip()
                if line:
                    headers = [c.strip() for c in line.split(",") if c.strip()]
                    data_start = idx + 1
                    break

            if not headers:
                return []

            def _cast(val: str):
                v = val.strip()
                low = v.lower()
                if low == "true":
                    return True
                if low == "false":
                    return False
                try:
                    return int(v)
                except ValueError:
                    pass
                try:
                    return float(v)
                except ValueError:
                    pass
                return v

            results = []
            for raw in csv_lines[data_start:]:
                line = raw.strip()
                if not line:
                    continue
                parts = [p.strip() for p in line.split(",")]
                if len(parts) != len(headers):
                    continue  # Skip corrupted row

                row_dict = {}
                for h, val in zip(headers, parts):
                    row_dict[h] = _cast(val)
                results.append(row_dict)

            return results
  explanation: |
    The parser safely isolates header extraction from row parsing.
    Empty lines are ignored. Each subsequent data line is checked for schema conformance:
    if a line contains more or fewer columns than the header, it is immediately discarded
    without throwing an unhandled exception.
    
    Valid lines have each token cast to `bool`, `int`, `float`, or `str` before being packaged
    into a typed row record.
  time: O(N * C) where N is line count and C is column count
  space: O(N * C) for the resulting row dictionaries

pitch_script: |
  **(Clarify)** "We need to parse incoming CSV lines, extract the header schema, discard corrupted lines with mismatched column counts, and cast values to native Python types."

  **(Basement Insight)** "In high-throughput ETL pipelines, unhandled parse exceptions on corrupted rows kill long-running jobs. A defensive parser validates row length against the header before type conversion, isolating dirty data from the clean stream."

  **(Solution)** "We parse the header to establish schema arity. For each data line, we verify `len(parts) == len(headers)`. A scalar caster converts `true/false` to booleans, then attempts `int` and `float`, falling back to `str`. Valid rows are mapped to dictionary records."

  **(Complexity)** "Runs in O(N * C) time where N is lines and C is columns, using O(N * C) space for output records."

twist:
  lc: 9225
  title: Escaped Quotes and Dialect Sniffing with csv.reader
  why: >-
    If cell values contain commas inside double quotes (e.g. "San Francisco, CA"), simple split(',') breaks.
    Requires io.StringIO and csv.reader or csv.Sniffer for RFC 4180 compliance.

