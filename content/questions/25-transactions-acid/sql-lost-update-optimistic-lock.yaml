hints:
- Join `PurchaseOrders po` to `Inventory i` on `po.product_id = i.id`.
- 'Use a CASE statement: `WHEN po.client_version = i.version THEN ''SUCCESS_COMMITTED'' ELSE ''REJECTED_STALE_VERSION''`.'
- '| # Pseudocode Blueprint

  | SELECT po.order_id, i.product, po.quantity, po.client_version,

  |        i.version AS current_version,

  |        CASE WHEN po.client_version = i.version THEN ''SUCCESS_COMMITTED''

  |             ELSE ''REJECTED_STALE_VERSION'' END AS outcome

  | FROM PurchaseOrders po JOIN Inventory i ON po.product_id = i.id

  | ORDER BY po.order_id;'
solution:
  code: "SELECT\n    po.order_id,\n    i.product,\n    po.quantity,\n    po.client_version,\n    i.version AS current_version,\n\
    \    CASE\n        WHEN po.client_version = i.version THEN 'SUCCESS_COMMITTED'\n        ELSE 'REJECTED_STALE_VERSION'\n\
    \    END AS outcome\nFROM PurchaseOrders po\nJOIN Inventory i ON po.product_id = i.id\nORDER BY po.order_id;\n"
  explanation: Joining the purchase orders with the inventory records compares the client's cached version against the live
    row version. Orders matching the current database version commit safely, while orders carrying stale versions are flagged
    as concurrency conflicts, preventing lost updates.
  time: O(P + I) hash join
  space: O(I) for in-memory inventory hash table
pitch_script: '**(Clarify)** "We need to evaluate incoming purchase orders against live inventory versions to identify which
  orders commit safely versus which collide due to stale version numbers."


  **(Brute force)** "Blindly updating stock without version checks causes lost updates where concurrent writes clobber each
  other."


  **(Trigger)** "Comparing expected client version with current database version signals Optimistic Concurrency Control (OCC)."


  **(Optimal)** "We join PurchaseOrders with Inventory on product_id. We check `po.client_version = i.version`. Matching versions
  receive ''SUCCESS_COMMITTED'', while mismatched versions receive ''REJECTED_STALE_VERSION''. We project the order details
  and order by order_id."


  **(Complexity)** "Executes in O(P + I) time and O(I) space." '
