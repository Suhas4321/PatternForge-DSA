solution:
  code: |
    SELECT
      device,
      SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) AS pass_count,
      SUM(CASE WHEN status = 'FAIL' THEN 1 ELSE 0 END) AS fail_count,
      SUM(CASE WHEN status = 'TIMEOUT' THEN 1 ELSE 0 END) AS timeout_count
    FROM TestRuns
    GROUP BY device
    ORDER BY device ASC;
  explanation: |
    1. `GROUP BY device`: partitions rows into distinct device groups.
    2. `SUM(CASE WHEN status = '...' THEN 1 ELSE 0 END)`: evaluates each row in the group.
       If the status matches, it contributes 1; otherwise 0.
       This pivots status values into three clean columnar totals in a single table scan.
    3. `ORDER BY device ASC`: sorts the summary alphabetically.
  time: O(N) single-pass aggregation
  space: O(K) where K is unique devices

pitch_script: |
  **(Clarify)** "We need to summarize test execution counts across PASS, FAIL, and TIMEOUT statuses grouped by device in a single query."

  **(Basement Insight)** "Running multiple independent queries with `WHERE status = 'X'` forces the database to scan disk pages multiple times. Conditional aggregation using `SUM(CASE WHEN ... THEN 1 ELSE 0 END)` accomplishes the pivot in a single physical table scan."

  **(Solution)** "We group by `device`, evaluate three conditional `SUM(CASE ...)` expressions to compute individual status tallies, and order by `device ASC`."

  **(Complexity)** "Executes in O(N) time in a single pass over N rows, using O(K) space for K devices."

twist:
  lc: 9317
  title: Percentage Ratio Calculation in Conditional Aggregation
  why: >-
    Calculate pass percentage directly:
    ROUND(100.0 * SUM(CASE WHEN status = 'PASS' THEN 1 ELSE 0 END) / COUNT(*), 1) AS pass_percentage.

