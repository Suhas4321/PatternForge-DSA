slug: hmac-signed-jwt-engine
lc: 9521
citadel_id: backend_apis
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How can distributed microservices verify client authentication and role permissions without making a
    database query on every HTTP request? JSON Web Tokens (JWT) enable stateless authentication. The server encodes user claims
    into base64 JSON and appends an HMAC-SHA256 digital signature computed with a shared secret. Any service holding the secret
    can verify the signature and check expiration in microseconds without database lookups.
  brute_force: Storing session tokens in a central database and issuing SQL queries on every single API request, bottlenecking
    database IOPS.
  brute_force_complexity: O(1) database queries per request that exhaust connection pools under heavy load.
  key_insight: A signed token consists of `base64_payload.hmac_signature`. Verifying recomputes the HMAC using constant-time
    comparison (`hmac.compare_digest`), guarding against timing attacks and tampering.
  real_world: OAuth 2.0 Bearer tokens, GitHub webhook verification, and microservice service-to-service JWT authentication.
statement:
  clean: "Implement an HMAC-SHA256 stateless token signer and verifier:\n`sign_and_verify_token(action: str, payload_or_token:\
    \ any, secret: str, current_time: int) -> dict`.\n\nActions:\n1. `\"SIGN\"`:\n   - `payload_or_token` is a dictionary\
    \ (e.g. `{\"sub\": \"u1\", \"role\": \"admin\", \"exp\": 1700000100}`).\n   - Serialize payload to JSON with sorted keys\
    \ and compact separators: `json.dumps(payload, separators=(\",\", \":\"), sort_keys=True)`.\n   - Base64-encode the JSON\
    \ using URL-safe base64, stripping trailing padding (`=`): `b64_payload`.\n   - Compute HMAC-SHA256 signature using `secret`:\
    \ `hmac.new(secret.encode(), b64_payload.encode(), hashlib.sha256).hexdigest()`.\n   - Return token format: `f\"{b64_payload}.{sig}\"\
    `.\n   - Output: `{\"token\": token, \"success\": True}`.\n2. `\"VERIFY\"`:\n   - `payload_or_token` is a token string\
    \ `b64_payload.sig`.\n   - If not exactly two dot-separated parts: return `{\"valid\": False, \"error\": \"malformed_token\"\
    }`.\n   - Recompute expected HMAC-SHA256 signature from `b64_payload` and `secret`.\n   - Use `hmac.compare_digest(sig,\
    \ expected_sig)`. If mismatch: return `{\"valid\": False, \"error\": \"invalid_signature\"}`.\n   - Decode URL-safe base64\
    \ payload and parse JSON (adding back padding if necessary).\n   - Check expiration: if `\"exp\"` in payload and `current_time\
    \ > payload[\"exp\"]`:\n     return `{\"valid\": False, \"error\": \"token_expired\"}`.\n   - If signature and expiration\
    \ valid: return `{\"valid\": True, \"payload\": payload}`."
  oa_story: '**PayLoop Merchant Auth — Token Tampering Vulnerability**


    During a security audit, ethical hackers altered their JWT payload from `{"role": "merchant"}` to `{"role": "admin"}`.
    Because an insecure microservice decoded the base64 payload without verifying the HMAC cryptographic signature, the hacker
    gained full admin privileges.


    Implement this HMAC-SHA256 token engine with strict signature verification and expiration checking to secure PayLoop APIs
    against token forgery.'
  trigger_keywords:
  - stateless token signer
  - sign_and_verify_token
  - invalid_signature
  examples:
  - input: 'action = "SIGN", payload_or_token = {"sub": "u_99", "role": "admin", "exp": 1700000100}, secret = "sec_key", current_time
      = 1700000000'
    output: '{"token": "eyJleHAiOjE3MDAwMDAxMDAsInJvbGUiOiJhZG1pbiIsInN1YiI6InVfOTkifQ.d0c24c2d33454477c7f766e4a64fbbbc64cb3e390c5040ffb344754580bfb9f5",
      "success": True}'
    explanation: Generates URL-safe base64 payload joined with HMAC-SHA256 signature hex.
  - input: action = "VERIFY", payload_or_token = "eyJleHAiOjE3MDAwMDAxMDAsInJvbGUiOiJhZG1pbiIsInN1YiI6InVfOTkifQ.d0c24c2d33454477c7f766e4a64fbbbc64cb3e390c5040ffb344754580bfb9f5",
      secret = "sec_key", current_time = 1700000050
    output: '{"valid": True, "payload": {"exp": 1700000100, "role": "admin", "sub": "u_99"}}'
    explanation: Signature matches and current_time (1700000050) <= exp (1700000100), token valid.
  constraints:
  - secret is non-empty string
  - current_time >= 0
constraint_quiz:
  prompt: Why must token signature verification use `hmac.compare_digest` instead of standard `==` string equality?
  options:
  - 'To prevent timing attacks: standard string equality short-circuits on the first mismatched byte, leaking information
    about the expected signature'
  - '`==` does not work on hexadecimal strings'
  - Python deprecated `==` for security tokens
  - '`hmac.compare_digest` automatically decodes base64'
  answer: 0
  explanation: Constant-time comparison executes in identical time regardless of where bytes differ, preventing side-channel
    timing attacks that could deduce the valid signature byte-by-byte.
pattern_quiz:
  prompt: What makes JWT stateless compared to traditional session IDs?
  options:
  - The token itself contains user identity and expiry claims cryptographically protected by the signature, requiring zero
    server database lookups
  - JWTs run only on serverless platforms
  - JWTs are automatically stored in hardware chips
  - JWTs do not require a secret key
  answer: 0
  explanation: Because claims are carried within the token and validated mathematically via the HMAC signature, backend servers
    require no shared session cache.
