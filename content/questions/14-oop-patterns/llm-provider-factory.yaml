drills:
  - title: Class-level cache dictionary
    skill: setup
    goal: Store and retrieve objects from a class attribute.
    instructions: |
      Implement `CacheBox` with class dictionary `_items = {}`.
      Implement `@classmethod set(cls, k, v)` and `@classmethod get(cls, k)`.
    function:
      name: test_cache
      params: [{name: k}, {name: v}]
    starter_code: |
      class Solution:
          def test_cache(self, k: str, v: int) -> int:
              pass
    tests:
      - {args: ["counter", 42], expected: 42}
      - {args: ["val", 100], expected: 100}
    solution: |
      class CacheBox:
          _items = {}
          @classmethod
          def set(cls, k, v):
              cls._items[k] = v
          @classmethod
          def get(cls, k):
              return cls._items.get(k)

      class Solution:
          def test_cache(self, k: str, v: int) -> int:
              CacheBox.set(k, v)
              return CacheBox.get(k)
    hint: "Use `cls._items[k] = v` and `return cls._items.get(k)`."

  - title: Simple factory instantiation
    skill: core
    goal: Return the right subclass based on string name.
    instructions: |
      Given `"dog"` return `"Woof"`, given `"cat"` return `"Meow"`, otherwise `"Unknown"`.
    function:
      name: animal_sound
      params: [{name: kind}]
    starter_code: |
      class Solution:
          def animal_sound(self, kind: str) -> str:
              pass
    tests:
      - {args: ["dog"], expected: "Woof"}
      - {args: ["cat"], expected: "Meow"}
      - {args: ["lion"], expected: "Unknown"}
    solution: |
      class Solution:
          def animal_sound(self, kind: str) -> str:
              sounds = {"dog": "Woof", "cat": "Meow"}
              return sounds.get(kind, "Unknown")
    hint: "Use a mapping dictionary with `.get(kind, 'Unknown')`."

  - title: Singleton instance verification
    skill: edge
    goal: Verify that two factory calls return the identical heap object.
    instructions: |
      Return `True` if `a is b` (identical object reference), else `False`.
    function:
      name: is_same_instance
      params: [{name: a_val}, {name: b_val}]
    starter_code: |
      class Solution:
          def is_same_instance(self, a_val: int, b_val: int) -> bool:
              pass
    tests:
      - {args: [1, 1], expected: true}
      - {args: [1, 2], expected: false}
    solution: |
      class Box:
          pass

      class Solution:
          def is_same_instance(self, a_val: int, b_val: int) -> bool:
              b1 = Box()
              b2 = b1 if a_val == b_val else Box()
              return b1 is b2
    hint: "Use `is` to check identity."

hints:
  - "Define `MockOpenAIClient` and `MockAnthropicClient` with a `generate(prompt)` method."
  - "In `LLMClientFactory`, check if `provider in cls._instances` before creating a new instance."
  - "In `dispatch_prompts`, call `LLMClientFactory._instances.clear()` before running the batch."

solution:
  code: |
    class MockOpenAIClient:
        def generate(self, prompt: str) -> str:
            return f"OpenAI: {prompt}"

    class MockAnthropicClient:
        def generate(self, prompt: str) -> str:
            return f"Claude: {prompt}"

    class LLMClientFactory:
        _instances = {}

        @classmethod
        def get_client(cls, provider: str):
            if provider in cls._instances:
                return cls._instances[provider]
            if provider == "openai":
                client = MockOpenAIClient()
            elif provider == "anthropic":
                client = MockAnthropicClient()
            else:
                raise ValueError(f"Unsupported provider: {provider}")
            cls._instances[provider] = client
            return client

    class Solution:
        def dispatch_prompts(self, prompts: list[dict]) -> list[str]:
            LLMClientFactory._instances.clear()
            results = []
            for item in prompts:
                provider = item.get("provider")
                prompt = item.get("prompt", "")
                client = LLMClientFactory.get_client(provider)
                results.append(client.generate(prompt))
            return results
  explanation: |
    `LLMClientFactory` combines the Factory Method pattern with a Singleton registry.
    The client creation logic is isolated inside `get_client`.
    Because `_instances` caches the created objects, repeating calls for `"openai"` retrieve
    the existing `MockOpenAIClient` from memory without reallocating resources.
  time: O(N) where N is number of prompts
  space: O(1) auxiliary client memory (at most 2 singleton clients allocated)

pitch_script: |
  **(Clarify)** "We need to build a factory that lazily instantiates and caches LLM client singletons, dispatching prompt generation requests through pre-warmed client instances."

  **(Basement Insight)** "Creating new network clients on every request introduces significant overhead: TCP three-way handshakes, TLS session negotiation, and socket exhaustion under load. A Factory that caches singleton instances ensures that HTTP connection pools are safely reused across calls."

  **(Solution)** "We build `LLMClientFactory` with a class-level `_instances` cache. When `get_client(provider)` is called, it returns the cached instance or lazily instantiates the appropriate mock client. The dispatch loop iterates through prompts and executes `.generate()`."

  **(Complexity)** "Runs in O(N) time across N prompts with O(1) auxiliary client space."

twist:
  lc: 9215
  title: Thread-Safe Singleton with Double-Checked Locking
  why: >-
    In a multithreaded application, two threads might check `provider in _instances` simultaneously
    and instantiate two clients. A threading.Lock with double-checked locking guarantees thread safety.

