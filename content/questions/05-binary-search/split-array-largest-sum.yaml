slug: split-array-largest-sum
lc: 410

concept:
  problem_it_solves: >-
    "How do I cut a sequence into k contiguous pieces so the heaviest piece is as light as
    possible?" Choosing the cuts directly is a combinatorial search. Turning it around is
    easy: if someone fixes a ceiling X on every piece's sum, a single greedy pass tells you
    whether k pieces are enough. That yes/no question is monotonic in X, so you binary search
    X. In Indian interviews this exact problem is "Allocate Minimum Number of Pages"
    (Book Allocation): books in order, k students, minimise the maximum pages any student
    reads.
  brute_force: >-
    Try every way to place k − 1 cuts among the n − 1 gaps, compute each piece's sum, and keep
    the smallest maximum. There are C(n − 1, k − 1) cut sets, and each one re-adds the same
    elements that thousands of other cut sets already added. A DP over (prefix, pieces) removes
    the repetition but still tries every last-cut position: O(k · n²).
  brute_force_complexity: >-
    O(C(n − 1, k − 1) · n) time for brute force (n = 1000, k = 50 is astronomically large);
    the O(k · n²) DP is 5 × 10⁷ steps at LeetCode's limits and 5 × 10¹¹ for a GfG-style
    n = 10⁵.
  key_insight: >-
    "Minimise the maximum" is the signal to binary search the maximum itself. Guess a limit X
    and ask "can I split into at most k pieces with every piece sum <= X?". Greedy answers it
    in O(n): keep extending the current piece and only cut when the next element would push it
    over X. A larger X never needs more pieces, so feasible(X) is F ... F T ... T over
    [max(nums), sum(nums)], and the answer is the first T. Needing fewer than k pieces is still
    feasible, because you can always split a piece further without raising the maximum.
  real_world: >-
    Load balancing an ordered workload: Spark and Flink range partitioners split a sorted key
    space into k contiguous ranges so the heaviest partition (the straggler) is as small as
    possible. Video platforms split an ordered list of segments across k transcoding workers,
    and CI systems (e.g. test sharding in Bazel or pytest-split) assign ordered test files to
    k runners to minimise the slowest shard.

statement:
  clean: |
    Given an integer array `nums` and an integer `k`, split `nums` into `k` non-empty
    subarrays such that the **largest sum** of any subarray is **minimized**.

    Return the minimized largest sum of the split.

    A **subarray** is a **contiguous** part of the array.

    *Interview alias: **Allocate Minimum Pages / Book Allocation**. `nums` are the pages of
    books kept in order, `k` is the number of students, each student reads a contiguous run
    of at least one book, and you minimise the maximum pages assigned to a single student.*
  oa_story: |
    **DakshDeliveries — OA Round 2**

    DakshDeliveries runs evening grocery drops in Whitefield. Tonight's route is a fixed
    sequence of stops along the ITPL main road, and stop `i` has `nums[i]` parcels. The
    dispatcher must hand the route to exactly `k` riders: each rider takes one unbroken stretch
    of consecutive stops (at least one stop each), and every stop goes to exactly one rider,
    because riders can't leapfrog each other on a one-way service road.

    Riders are paid per parcel, but the shift ends when the busiest rider finishes, so
    operations wants the stretches chosen to make the busiest rider's parcel count as small as
    possible. Return that smallest possible count. A route can have up to 1000 stops with up
    to 10⁶ parcels each, and there are at most 50 riders.
  trigger_keywords: ["largest sum", "minimized", "contiguous"]
  examples:
    - input: "nums = [7,2,5,10,8], k = 2"
      output: "18"
      explanation: "Split as [7,2,5] and [10,8]: sums 14 and 18. Every other split has a bigger maximum."
    - input: "nums = [1,2,3,4,5], k = 2"
      output: "9"
      explanation: "Split as [1,2,3] and [4,5]: sums 6 and 9."
    - input: "nums = [12,34,67,90], k = 2"
      output: "113"
      explanation: "The classic Allocate Books example: [12,34,67] and [90], so one student reads 113 pages."
  constraints:
    - "1 <= nums.length <= 1000"
    - "0 <= nums[i] <= 10^6"
    - "1 <= k <= min(50, nums.length)"

constraint_quiz:
  prompt: >-
    n is up to 1000, k up to 50, values up to 10⁶ (so the total S is at most 10⁹). Interviewers
    also ask the Allocate Books version with n up to 10⁵. What should you aim for?
  options:
    - "O(C(n − 1, k − 1) · n) — try every set of cuts"
    - "O(k · n²) — DP over (prefix length, pieces used)"
    - "O(n · log S) — binary search the largest sum, greedy check"
    - "O(n) — one greedy pass, no search"
  answer: 2
  explanation: >-
    Every cut set is exponential in k. The DP is 5 × 10⁷ at LeetCode's limits, which passes in
    C++ but is slow in Python, and at n = 10⁵ it becomes 5 × 10¹¹, so it fails the Allocate
    Books version. One greedy pass can't know where to cut without a target limit. Binary
    searching the limit takes about log₂(10⁹) ≈ 30 greedy passes: ~3 × 10⁴ steps here and
    ~3 × 10⁶ at n = 10⁵.

pattern_quiz:
  prompt: >-
    Split an array into k contiguous parts so that the largest part sum is as small as
    possible. Which pattern fits?
  options:
    - "Sort the array and deal elements round-robin"
    - "Sliding window of fixed size n / k"
    - "Binary search on the answer (the largest sum) with a greedy piece count"
    - "Prefix sums + hash map"
  answer: 2
  explanation: >-
    "Minimise the maximum" (or "maximise the minimum") is the binary search on answer trigger:
    fix the maximum, check feasibility greedily, and search the smallest feasible value.
    Sorting destroys the required contiguity, equal-sized windows ignore that element values
    differ, and prefix-sum lookups answer "sum equals k", not "best split".

