drills:
  - title: Count k ahead before touching anything
    skill: setup
    goal: From a dummy node, walk k steps to find each group's last node, and stop when a group is short.
    instructions: |
      Without reversing anything, return the values of the **last node of every full group**
      of `k` nodes. Start from a dummy node in front of `head` (`group_prev = dummy`), walk
      `k` steps to reach `kth`, record it, and continue from `kth`. The moment a step falls
      off the end of the list, stop: that group is short.

      This is the guard of the full problem. You must know a group is complete *before*
      reversing it, because the left-out nodes at the end have to stay exactly as they are,
      and un-reversing them afterwards is both slower and bug-prone.
    function:
      name: groupEnds
      params: [{name: head, type: ListNode}, {name: k}]
    starter_code: |
      class Solution:
          def groupEnds(self, head: Optional[ListNode], k: int) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], 2], expected: [2, 4], note: "5 is in a short group"}
      - {args: [[1, 2, 3, 4, 5], 3], expected: [3]}
      - {args: [[1, 2, 3, 4, 5, 6], 3], expected: [3, 6]}
      - {args: [[1, 2], 3], expected: [], note: no full group at all}
      - {args: [[4, 5, 6], 1], expected: [4, 5, 6]}
    solution: |
      class Solution:
          def groupEnds(self, head: Optional[ListNode], k: int) -> List[int]:
              group_prev = ListNode(0, head)  # dummy in front of the first group
              ends = []
              while True:
                  kth = group_prev
                  for _ in range(k):
                      kth = kth.next
                      if not kth:
                          return ends
                  ends.append(kth.val)
                  group_prev = kth
    hint: "Check `if not kth` inside the k-step loop, right after each step."

  - title: Reverse a group so it lands on the rest of the list
    skill: core
    goal: Reverse the first k nodes with prev starting at group_next, so the reversed group stays attached.
    instructions: |
      Reverse only the first `k` nodes (assume the list has at least `k`) and return the new
      head; the remaining nodes must stay attached after the reversed group.

      The trick: first find `group_next`, the node right after the group. Then run the normal
      reversal loop, but start `prev` at `group_next` instead of `None`, and stop when `cur`
      reaches `group_next`. The old first node then automatically points at the rest of the
      list, with no extra reconnection step on that side.
    function:
      name: reverseFirstK
      params: [{name: head, type: ListNode}, {name: k}]
      returns: ListNode
    starter_code: |
      class Solution:
          def reverseFirstK(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5], 3], expected: [3, 2, 1, 4, 5]}
      - {args: [[1, 2], 2], expected: [2, 1], note: "group_next is None"}
      - {args: [[1, 2, 3], 1], expected: [1, 2, 3], note: "k = 1 is a no-op"}
      - {args: [[4, 5, 6, 7], 2], expected: [5, 4, 6, 7]}
    solution: |
      class Solution:
          def reverseFirstK(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
              group_next = head
              for _ in range(k):
                  group_next = group_next.next
              prev, cur = group_next, head  # the reversed group ends at group_next
              while cur is not group_next:
                  nxt = cur.next
                  cur.next = prev
                  prev, cur = cur, nxt
              return prev
    hint: "The loop condition is `cur is not group_next`, not `cur is not None`."

  - title: Reattach a group in the middle of the list
    skill: edge
    goal: Reverse a group that has a predecessor, reconnect it through group_prev, and leave a short group untouched.
    instructions: |
      Reverse **only the second group** of `k` nodes (positions `k+1 … 2k`) and return the
      head. If the second group has fewer than `k` nodes, return the list unchanged. Assume
      the list has at least `k` nodes.

      This is the reconnection that every group after the first needs. The node before the
      group (`group_prev`, here the k-th node) still points at the group's *old first* node,
      so after reversing you must set `group_prev.next = kth`. Get this wrong and the
      reversed group is cut off from everything before it. In the full problem you then move
      `group_prev` to the old first node, which is now the group's tail.
    function:
      name: reverseSecondGroup
      params: [{name: head, type: ListNode}, {name: k}]
      returns: ListNode
    starter_code: |
      class Solution:
          def reverseSecondGroup(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
              pass
    tests:
      - {args: [[1, 2, 3, 4, 5, 6], 2], expected: [1, 2, 4, 3, 5, 6]}
      - {args: [[1, 2, 3, 4, 5, 6], 3], expected: [1, 2, 3, 6, 5, 4]}
      - {args: [[1, 2, 3, 4, 5], 3], expected: [1, 2, 3, 4, 5], note: "second group is short: leave it"}
      - {args: [[1, 2, 3], 2], expected: [1, 2, 3], note: a single left-out node}
      - {args: [[7, 8], 1], expected: [7, 8], note: "k = 1: reversing one node changes nothing"}
    solution: |
      class Solution:
          def reverseSecondGroup(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
              group_prev = head
              for _ in range(k - 1):  # the last node of the first group
                  group_prev = group_prev.next
              kth = group_prev
              for _ in range(k):  # count ahead: is the second group complete?
                  kth = kth.next
                  if not kth:
                      return head
              group_next = kth.next
              prev, cur = group_next, group_prev.next
              while cur is not group_next:
                  nxt = cur.next
                  cur.next = prev
                  prev, cur = cur, nxt
              group_prev.next = kth  # reattach the reversed group to what came before
              return head
    hint: "After the reversal, `group_prev.next` still points at the old first node; point it at `kth` instead."

hints:
  - >-
    You already know how to reverse a whole list. If you reverse just one group of k nodes,
    which two connections are left broken, and which nodes would you need to remember to fix
    them? How do you know the group is complete before you start?
  - >-
    Put a dummy node in front and keep `group_prev`, the node just before the current group.
    Walk k steps from it to find `kth`; if you run out of nodes, stop. Remember
    `group_next = kth.next`, reverse the group with `prev` starting at `group_next`, then set
    `group_prev.next = kth` and move `group_prev` to the group's old first node.
  - |
    dummy = new node pointing at head; group_prev = dummy
    loop:
        kth = walk k steps from group_prev; if it falls off the end: return dummy.next
        group_next = kth.next
        prev, cur = group_next, group_prev.next
        while cur is not group_next: save next, cur.next = prev, advance prev and cur
        old_first = group_prev.next
        group_prev.next = kth
        group_prev = old_first

solution:
  code: |
    class Solution:
        def reverseKGroup(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
            dummy = ListNode(0, head)
            group_prev = dummy  # the node just before the current group

            while True:
                # 1. count k ahead: find the group's last node, or stop on a short group
                kth = group_prev
                for _ in range(k):
                    kth = kth.next
                    if not kth:
                        return dummy.next
                group_next = kth.next

                # 2. reverse the group; prev starts at group_next so it stays attached
                prev, cur = group_next, group_prev.next
                while cur is not group_next:
                    nxt = cur.next
                    cur.next = prev
                    prev = cur
                    cur = nxt

                # 3. reconnect: kth is the new front, the old first node is the new tail
                old_first = group_prev.next
                group_prev.next = kth
                group_prev = old_first
  explanation: |
    Each group is a tiny "reverse a list" problem with two loose ends, and `group_prev` plus
    `group_next` pin both of them down.

    **Count first.** Walking k steps from `group_prev` finds `kth`, the group's last node. If
    a step falls off the end, the remaining nodes are a short group, which must stay as it
    is, so we return immediately. Counting before reversing is the key ordering decision:
    reversing first and undoing a short group later is extra work and easy to get wrong.

    **Reverse with a head start.** Starting `prev` at `group_next` (instead of `None`) means
    the group's old first node ends up pointing at the rest of the list, so the right-hand
    connection is made by the reversal loop itself. The loop stops when `cur` reaches
    `group_next`.

    **Reconnect the left side.** `group_prev.next` still points at the old first node, which
    is now the group's tail; save it as `old_first`, point `group_prev.next` at `kth` (the
    new front), and make `old_first` the next `group_prev`. The dummy node gives the very
    first group a `group_prev` too, so the new head is simply `dummy.next`. `k = 1` works
    unchanged: each "group" reverses onto itself.
  time: O(N) — every node is visited once while counting and once while reversing
  space: O(1) — a fixed number of pointers; nodes are rewired in place
  brute_force_code: |
    class Solution:
        def reverseKGroup(self, head: Optional[ListNode], k: int) -> Optional[ListNode]:
            nodes = []
            cur = head
            while cur:
                nodes.append(cur)
                cur = cur.next
            # reverse each full block of k in the array; a short last block is skipped
            for start in range(0, len(nodes) - k + 1, k):
                nodes[start:start + k] = nodes[start:start + k][::-1]
            for a, b in zip(nodes, nodes[1:]):
                a.next = b
            nodes[-1].next = None
            return nodes[0]

pitch_script: |
  **(Clarify)** "So I reverse the nodes in consecutive groups of k, a final group shorter than
  k stays in its original order, and I can't swap values. k is between 1 and n, and the
  follow-up wants O(1) extra memory, right?"

  **(Brute force)** "The easy version copies the nodes into an array, reverses each full block
  of k there, and relinks. That's O(N) time but O(N) extra space, which misses the
  follow-up."

  **(Trigger)** "Reverse k at a time is in-place pointer reversal applied per group. The hard
  part is the bookkeeping at each group's two ends, so I'll use a dummy node and a group_prev
  pointer that always sits just before the current group."

  **(Optimal)** "For each group I first walk k steps from group_prev to find the kth node; if
  I run out, the rest is a short group and I return dummy.next. Otherwise I save group_next,
  reverse the group starting prev at group_next so the old first node lands on the rest of
  the list, then point group_prev.next at kth and move group_prev to the old first node,
  which is now the group's tail."

  **(Complexity)** "Every node is touched a constant number of times, once to count and once
  to reverse, so O(N) time, and only a few pointers, so O(1) extra space. A recursive version
  is shorter, but its call stack is O(N / k), so I'd stay iterative for the follow-up."

twist:
  lc: 24
  title: Swap Nodes in Pairs
  why: >-
    This is exactly the k = 2 case, and with only two nodes per group the template collapses.
    Counting ahead becomes the loop condition `group_prev.next and group_prev.next.next`, and
    the reversal loop becomes three direct rewires: with `first = group_prev.next` and
    `second = first.next`, set `first.next = second.next`, `second.next = first`,
    `group_prev.next = second`, then `group_prev = first`. Same dummy node, same group_prev
    handoff to the old first node, no inner loop.

