slug: merge-k-sorted-lists
lc: 23

concept:
  problem_it_solves: >-
    "Out of k sorted sources, which one holds the next smallest item?" Only the current front
    of each source can be the answer, so there are always exactly k candidates. A min-heap of
    those k fronts hands you the smallest one in O(log k), and after you take it, the only new
    candidate is the next item from the same source.
  brute_force: >-
    At every step, scan the heads of all k lists, take the smallest, and advance that list.
    Each scan re-compares k − 1 heads that haven't changed since the previous step; only one
    head moved. (Dumping every value into an array and sorting is O(N log N) and throws away
    the fact that each list is already sorted.)
  brute_force_complexity: O(N · k) time, O(1) extra space — N = 10⁴ nodes across k = 10⁴ lists means up to 10⁸ head comparisons.
  key_insight: >-
    You never need to compare all N nodes against each other, only the k current heads. Keep
    those heads in a min-heap as (value, list index, node). Pop the smallest, append it to the
    answer, and push its `next` (if any) back in. The heap never holds more than k entries, so
    each of the N steps costs O(log k) instead of O(k).
  real_world: >-
    This is the k-way merge at the heart of external sorting and of LSM-tree databases
    (RocksDB, Cassandra, LevelDB compaction merges k sorted SSTables with a heap). Elasticsearch
    merges sorted results from k shards the same way, and Kafka consumers merging time-ordered
    partitions use a heap of partition heads.

statement:
  clean: |
    You are given an array `lists` of k linked lists, where
    **each linked list is sorted in ascending order**.

    **Merge all the linked-lists into one sorted linked-list** and return it.
  oa_story: |
    **FeedFusion — OA Round 2**

    FeedFusion builds the "For You" feed for a Bengaluru short-video app. Posts are stored on
    `k` regional shards (Karnataka, Tamil Nadu, Maharashtra, and so on), and each shard returns
    its candidate posts as a singly linked chain of publish timestamps, oldest first. Some
    shards return an empty chain when they have nothing new.

    The feed service must stitch all the chains into a single chain ordered by timestamp,
    oldest first, reusing the nodes it was given. Return the head of the combined chain (or
    nothing if every shard came back empty). A busy evening can bring ten thousand shards and
    ten thousand posts in total, and the feed must render instantly.
  trigger_keywords: ["k linked lists", "each linked list is sorted in ascending order", "merge all the linked-lists into one sorted linked-list"]
  examples:
    - input: "lists = [[1,4,5],[1,3,4],[2,6]]"
      output: "[1,1,2,3,4,4,5,6]"
      explanation: "The three sorted lists 1->4->5, 1->3->4 and 2->6 merge into 1->1->2->3->4->4->5->6."
    - input: "lists = []"
      output: "[]"
      explanation: "No lists at all: the result is the empty list."
    - input: "lists = [[]]"
      output: "[]"
      explanation: "One list, and it is empty: there is still nothing to merge."
  constraints:
    - "k == lists.length"
    - "0 <= k <= 10^4"
    - "0 <= lists[i].length <= 500"
    - "-10^4 <= lists[i][j] <= 10^4"
    - "lists[i] is sorted in ascending order."
    - "The sum of lists[i].length will not exceed 10^4."

constraint_quiz:
  prompt: >-
    N ≤ 10⁴ nodes in total, spread over k ≤ 10⁴ lists that are each already sorted. What is
    the best bound you should aim for?
  options: ["O(N · k)", "O(N log N)", "O(N log k)", "O(N)"]
  answer: 2
  explanation: >-
    Scanning k heads per node is O(N · k), up to 10⁸ comparisons. Sorting everything is
    O(N log N) and passes, but it ignores that the lists are sorted and needs an O(N) array.
    A heap of the k heads (or pairwise divide-and-conquer merging) gives O(N log k), which is
    better whenever k is much smaller than N. O(N) is out of reach for comparison-based
    merging: with k lists of one element each, merging them is sorting k numbers.

pattern_quiz:
  prompt: >-
    You have k sorted sequences and must repeatedly take the smallest current front. Which
    pattern fits?
  options:
    - "Two pointers, one per list"
    - "Min-heap of the k current heads (k-way merge)"
    - "Monotonic stack"
    - "Binary search each list for the next value"
  answer: 1
  explanation: >-
    "k sorted lists, merge into one sorted list" is the k-way-merge trigger. Two pointers are
    perfect for k = 2 but need k pointers and an O(k) scan to find the smallest front for
    general k. A heap is exactly a structure that keeps the smallest of k candidates available
    in O(log k) while candidates are replaced. Nothing here is "next greater", and binary
    search can't tell you which list holds the next value.

