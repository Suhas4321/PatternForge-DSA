drills:
  - title: Page count calculation
    skill: setup
    goal: Compute ceil(N / capacity) without math.ceil.
    instructions: |
      Return total pages needed to hold `n` records with `capacity` per page.
    function:
      name: calc_page_count
      params: [{name: n}, {name: capacity}]
    starter_code: |
      class Solution:
          def calc_page_count(self, n: int, capacity: int) -> int:
              pass
    tests:
      - {args: [5, 2], expected: 3}
      - {args: [4, 2], expected: 2}
      - {args: [0, 2], expected: 0}
    solution: |
      class Solution:
          def calc_page_count(self, n: int, capacity: int) -> int:
              if n == 0:
                  return 0
              return (n + capacity - 1) // capacity
    hint: "Use `(n + capacity - 1) // capacity`."

  - title: Calculate tuple ctid coordinates
    skill: core
    goal: Compute page and slot from index.
    instructions: |
      Given record index `i` and `capacity`, return `[i // capacity, i % capacity]`.
    function:
      name: get_ctid
      params: [{name: i}, {name: capacity}]
    starter_code: |
      class Solution:
          def get_ctid(self, i: int, capacity: int) -> list[int]:
              pass
    tests:
      - {args: [3, 2], expected: [1, 1]}
      - {args: [0, 5], expected: [0, 0]}
    solution: |
      class Solution:
          def get_ctid(self, i: int, capacity: int) -> list[int]:
              return [i // capacity, i % capacity]
    hint: "Use `[i // capacity, i % capacity]`."

  - title: Early exit scan simulation
    skill: edge
    goal: Stop scan immediately when target found.
    instructions: |
      Find index of `target` in `nums`. Return index if found, else -1.
    function:
      name: linear_find
      params: [{name: nums}, {name: target}]
    starter_code: |
      class Solution:
          def linear_find(self, nums: list[int], target: int) -> int:
              pass
    tests:
      - {args: [[10, 20, 30], 20], expected: 1}
      - {args: [[10], 99], expected: -1}
    solution: |
      class Solution:
          def linear_find(self, nums: list[int], target: int) -> int:
              for idx, x in enumerate(nums):
                  if x == target:
                      return idx
              return -1
    hint: "Loop with enumerate and return early."

hints:
  - "If `records` is empty, return total_pages: 0, pages_scanned: 0, found: False, ctid: None."
  - "Divide records into chunks of size `page_capacity`."
  - "Scan page by page: if `search_id` is found in page `p` at slot `s`, pages_scanned is `p + 1` and ctid is `[p, s]`."

solution:
  code: |
    class Solution:
        def simulate_heap_scan(self, records: list[dict], page_capacity: int, search_id: int) -> dict:
            if not records:
                return {
                    "total_pages": 0,
                    "pages_scanned": 0,
                    "found": False,
                    "ctid": None,
                }

            total_pages = (len(records) + page_capacity - 1) // page_capacity

            pages_scanned = 0
            found = False
            target_ctid = None

            for page_idx in range(total_pages):
                pages_scanned += 1
                start = page_idx * page_capacity
                page_records = records[start : start + page_capacity]

                for slot_idx, rec in enumerate(page_records):
                    if rec["id"] == search_id:
                        found = True
                        target_ctid = [page_idx, slot_idx]
                        break

                if found:
                    break

            return {
                "total_pages": total_pages,
                "pages_scanned": pages_scanned,
                "found": found,
                "ctid": target_ctid,
            }
  explanation: |
    The simulator mirrors database buffer pool mechanics. Records are chunked into 8KB page blocks.
    A sequential table scan iterates through pages starting at page 0.
    Loading a page into memory increments `pages_scanned`.
    
    If an item matches `search_id`, the scan halts immediately, returning the physical `ctid = [page, slot]`.
    If unindexed, searching for a non-existent key forces the engine to read every single page into memory.
  time: O(N) worst case when searching unindexed heap pages
  space: O(1) auxiliary working memory

pitch_script: |
  **(Clarify)** "We need to simulate physical 8KB heap page storage and an unindexed sequential table scan, returning total allocated pages, pages read into RAM, and the tuple ID coordinates."

  **(Basement Insight)** "Databases execute disk I/O in fixed block chunks (8KB heap pages in PostgreSQL). A row's physical address is its `ctid` (page number, slot). Without an index, the storage engine must fetch every page from disk into the buffer cache sequentially."

  **(Solution)** "We partition records into pages of size `page_capacity`. We simulate the sequential scan by inspecting page by page, tracking `pages_scanned`. When the target ID matches, we record `[page_idx, slot_idx]` and break early."

  **(Complexity)** "Runs in O(N) time across N records, using O(1) auxiliary space beyond input records."

twist:
  lc: 9302
  title: Buffer Pool LRU Eviction Simulation
  why: >-
    When physical RAM can only hold 100 pages, reading 1,000 pages during a sequential scan evicts hot cached pages.
    PostgreSQL uses a 256KB ring buffer for large sequential scans to prevent buffer pool cache poisoning.

viz:
  title: "8KB Heap Page Disk Storage Engine"
