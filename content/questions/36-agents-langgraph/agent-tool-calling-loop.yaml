tests:
- args:
  - What is 12 * 8?
  - - type: tool
      tool_name: calculator
      tool_arg: 12 * 8
    - type: finish
      answer: The answer is 96.
  - 5
  expected:
    status: completed
    final_answer: The answer is 96.
    steps_executed: 2
    trace:
    - step: 1
      action:
        type: tool
        tool_name: calculator
        tool_arg: 12 * 8
      observation: '96'
    - step: 2
      action:
        type: finish
        answer: The answer is 96.
      observation: null
  note: Tool execution followed by final answer
- args:
  - Hi
  - - type: finish
      answer: Hello!
  - 5
  expected:
    status: completed
    final_answer: Hello!
    steps_executed: 1
    trace:
    - step: 1
      action:
        type: finish
        answer: Hello!
      observation: null
  note: Direct finish without tools
- args:
  - Check stock
  - - type: tool
      tool_name: search
      tool_arg: inventory
  - 1
  expected:
    status: max_steps_exceeded
    final_answer: null
    steps_executed: 1
    trace:
    - step: 1
      action:
        type: tool
        tool_name: search
        tool_arg: inventory
      observation: In Stock (14 units)
  note: Max steps halts execution when answer not provided
visualize_test: 0
drills:
- title: Dispatch Tool Call
  skill: setup
  goal: Execute calculator or search tool logic.
  instructions: Return '96' for calculator '12 * 8', 'In Stock (14 units)' for search 'inventory', else 'No results found'.
  function:
    name: dispatch_tool
    params:
    - name: name
      type: any
    - name: arg
      type: any
  starter_code: "class Solution:\n    def dispatch_tool(self, name: str, arg: str) -> str:\n        pass\n"
  tests:
  - args:
    - calculator
    - 12 * 8
    expected: '96'
  - args:
    - search
    - inventory
    expected: In Stock (14 units)
  - args:
    - search
    - unknown
    expected: No results found
  solution: "class Solution:\n    def dispatch_tool(self, name: str, arg: str) -> str:\n        if name == \"calculator\"\
    \ and arg == \"12 * 8\":\n            return \"96\"\n        if name == \"search\" and \"inventory\" in arg:\n       \
    \     return \"In Stock (14 units)\"\n        return \"No results found\"\n"
  hint: Check tool name and argument strings.
- title: Record Trace Step
  skill: core
  goal: Build step dictionary for execution telemetry.
  instructions: Return dict with keys 'step', 'action', 'observation'.
  function:
    name: make_trace_record
    params:
    - name: step
      type: any
    - name: action
      type: any
    - name: obs
      type: any
  starter_code: "class Solution:\n    def make_trace_record(self, step: int, action: dict, obs: str) -> dict:\n        pass\n"
  tests:
  - args:
    - 1
    - type: tool
    - '96'
    expected:
      step: 1
      action:
        type: tool
      observation: '96'
  solution: "class Solution:\n    def make_trace_record(self, step: int, action: dict, obs: str) -> dict:\n        return\
    \ {\"step\": step, \"action\": action, \"observation\": obs}\n"
  hint: Construct a dict with step, action, and observation.
- title: Evaluate Finish Action
  skill: edge
  goal: Determine if current model decision concludes execution.
  instructions: Return True if action.get('type') == 'finish' else False.
  function:
    name: is_finish
    params:
    - name: action
      type: any
  starter_code: "class Solution:\n    def is_finish(self, action: dict) -> bool:\n        pass\n"
  tests:
  - args:
    - type: finish
    expected: true
  - args:
    - type: tool
    expected: false
  solution: "class Solution:\n    def is_finish(self, action: dict) -> bool:\n        return action.get(\"type\") == \"finish\"\
    \n"
  hint: Check action['type'] == 'finish'.
hints:
- Loop over mock_llm_steps while tracking step_idx < max_steps.
- If action['type'] == 'finish', record observation None, set status completed, and break.
- If action['type'] == 'tool', invoke the corresponding tool to retrieve observation.
solution:
  code: "class Solution:\n    def execute_tool_loop(self, user_query: str, mock_llm_steps: list[dict], max_steps: int = 5)\
    \ -> dict:\n        trace = []\n        step_idx = 0\n        final_answer = None\n        status = \"max_steps_exceeded\"\
    \n        \n        for action in mock_llm_steps:\n            if step_idx >= max_steps:\n                break\n    \
    \        step_idx += 1\n            act_type = action.get(\"type\")\n            \n            if act_type == \"finish\"\
    :\n                final_answer = action.get(\"answer\")\n                trace.append({\n                    \"step\"\
    : step_idx,\n                    \"action\": action,\n                    \"observation\": None,\n                })\n\
    \                status = \"completed\"\n                break\n            elif act_type == \"tool\":\n             \
    \   tool_name = action.get(\"tool_name\")\n                tool_arg = action.get(\"tool_arg\", \"\")\n               \
    \ obs = \"No results found\"\n                if tool_name == \"calculator\":\n                    if tool_arg == \"12\
    \ * 8\":\n                        obs = \"96\"\n                    elif tool_arg == \"100 - 45\":\n                 \
    \       obs = \"55\"\n                    else:\n                        obs = str(len(tool_arg))\n                elif\
    \ tool_name == \"search\":\n                    if \"order_status\" in tool_arg:\n                        obs = \"Shipped:\
    \ arriving tomorrow\"\n                    elif \"inventory\" in tool_arg:\n                        obs = \"In Stock (14\
    \ units)\"\n                    else:\n                        obs = \"No results found\"\n                trace.append({\n\
    \                    \"step\": step_idx,\n                    \"action\": action,\n                    \"observation\"\
    : obs,\n                })\n        return {\n            \"status\": status,\n            \"final_answer\": final_answer,\n\
    \            \"steps_executed\": step_idx,\n            \"trace\": trace,\n        }\n"
  explanation: Iterates through model decisions, dispatching tools and collecting observations into an audit trace until a
    finish action is encountered or max_steps is reached.
  time: O(K) where K is the number of executed steps (bounded by max_steps)
  space: O(K) for storing trace history
pitch_script: '**(Clarify)** "We are implementing a ReAct agent execution loop that parses model decisions, dispatches tools,
  and terminates either on final answer or upon exceeding max_steps."


  **(Basement Insight)** "Without strict iteration caps, reasoning failures or contradictory tool outputs trap agents in infinite
  loops. A max-steps guard guarantees predictable cloud costs and deterministic timeout behavior."


  **(Solution)** "We process each decision step sequentially. If the model emits a tool call, we run the tool and log the
  observation. When a finish action is emitted, we record the final answer and halt immediately. If the budget expires first,
  we flag max_steps_exceeded."


  **(Complexity)** "Executes in O(K) time and O(K) space bounded by max_steps."

  '
