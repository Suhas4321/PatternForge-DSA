slug: jump-game
lc: 55

concept:
  problem_it_solves: >-
    "Can I get from the start to the end when each position lets me move up to some
    distance?" Exploring every path branches wildly. But the set of positions you can reach
    is always one unbroken block from index 0 up to some farthest index, so a single number,
    the farthest reach, captures everything you need to know.
  brute_force: >-
    Mark index 0 reachable, then for every reachable index mark all indices it can jump to
    (or, equivalently, work backward with a DP asking "can index i reach a good index?"). It
    wastes work because it marks the same indices over and over from different sources, when
    all that matters is how far right the reachable block extends.
  brute_force_complexity: >-
    O(N · K) time where K is the largest jump, i.e. O(N²) in the worst case, plus O(N)
    space — 10⁴ elements means up to ~5 × 10⁷ markings. Plain recursion over all paths
    without memoisation is exponential.
  key_insight: >-
    If you can reach index j, you can reach every index before it too: any jump that flies
    over k could have stopped at k instead, because you may jump *up to* nums[i]. So the
    reachable set is always the prefix [0 .. farthest]. Scan left to right, extend farthest
    with i + nums[i] for every index inside the prefix, and fail the moment i steps past
    farthest.
  real_world: >-
    Network and CDN engineers reason the same way about multi-hop reachability: each relay
    has a range, and you only track how far the signal has got. Video players buffering
    chunks, and build systems checking whether a chain of incremental snapshots covers up to
    the latest version, keep a single "covered up to here" watermark the same way.

statement:
  clean: |
    You are given an integer array `nums`. You are initially positioned at the array's
    **first index**, and each element in the array represents your **maximum jump length**
    at that position.

    Return `true` if you **can reach the last index**, or `false` otherwise.
  oa_story: |
    **SlotSarthi — OA Round 1**

    SlotSarthi books service slots for two-wheeler garages along Hosur Road. A rider's bike
    is towed in for a breakdown and must be passed down a line of partner garages, in a
    fixed order, to the one at the end of the line that stocks the part. Each garage, from
    the dispatch data, can forward the bike to any garage up to a certain number of places
    further down the line (zero if it has no tow van free today).

    Given that list of forwarding ranges, with the bike starting at the first garage, return
    whether the bike can make it to the final garage. Some lines have 10,000 garages and the
    check runs every time a dispatcher refreshes the board, so it must be linear.
  trigger_keywords: ["maximum jump length", "can reach the last index"]
  examples:
    - input: "nums = [2,3,1,1,4]"
      output: "true"
      explanation: "Jump 1 step from index 0 to 1, then 3 steps to the last index."
    - input: "nums = [3,2,1,0,4]"
      output: "false"
      explanation: "Every path lands on index 3, whose maximum jump length is 0, so index 4 is unreachable."
  constraints:
    - "1 <= nums.length <= 10^4"
    - "0 <= nums[i] <= 10^5"

constraint_quiz:
  prompt: >-
    N can be 10⁴ and each jump can be up to 10⁵. What time complexity should you aim for?
  options: ["Exponential (try every path)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    Trying every path is exponential. The marking/DP approach is O(N²) in the worst case,
    ~5 × 10⁷ operations: it might squeak through in C++ but is slow in Python and not what
    the interviewer wants. Nothing needs sorting, so O(N log N) isn't natural. Tracking a
    single farthest-reach value is one pass, O(N).

pattern_quiz:
  prompt: >-
    Each position lets you jump any distance up to nums[i] to the right. Can you reach the
    end? Which pattern fits?
  options:
    - "Greedy: track the farthest index reachable so far"
    - "Two pointers from both ends"
    - "Monotonic stack of jump lengths"
    - "Binary search on the number of jumps"
  answer: 0
  explanation: >-
    "Can you reach" with "maximum jump length" (any distance up to) is the farthest-reach
    trigger. Because shorter jumps are always allowed, reachable indices form a prefix, so
    one number summarises the whole state. Two pointers and monotonic stacks don't model
    reachability, and binary search on jump count answers a different question.

function:
  name: canJump
  params: [{name: nums}]

starter_code: |
