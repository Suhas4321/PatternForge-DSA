slug: sort-colors
lc: 75

concept:
  problem_it_solves: >-
    "Can I split an array into three groups in a single sweep, without extra memory?" When
    there are only three possible values, you don't need a general sort at all: you need to
    grow a zone of 0s from the left, a zone of 2s from the right, and let the 1s settle in
    the middle. Three pointers mark the zone boundaries, and each swap puts one element
    into its final zone for good.
  brute_force: >-
    Call a general sort, or count how many 0s, 1s and 2s there are and then overwrite the
    array. Sorting does O(N log N) comparisons to rediscover an order that only has three
    levels. Counting is O(N) but needs two passes, and it only works because the values are
    bare integers: if each element carried a payload (an order id, a ticket), overwriting by
    counts would destroy it, while swapping keeps every element intact.
  brute_force_complexity: >-
    O(N log N) time with a library sort; counting is O(N) time and O(1) space but takes two
    full passes and rewrites values instead of moving elements.
  key_insight: >-
    Keep four regions at all times: [0, low) is all 0s, [low, mid) is all 1s, [mid, high]
    is still unknown, and (high, end] is all 2s. Look only at nums[mid]. A 0 is swapped to
    low, a 1 stays, a 2 is swapped to high. Each step shrinks the unknown region by one, so
    one pass finishes the job. The subtle part: after swapping with high, the element that
    arrives at mid came from the unknown region, so mid must not move until it has been
    looked at.
  real_world: >-
    This is the three-way partition that production quicksorts use to survive many
    duplicate keys (Bentley–McIlroy partitioning, Java's dual-pivot quicksort, the
    "partition equal" step of pdqsort in Rust's sort_unstable and Go's sort package), which
    keeps an array full of repeats from degrading to O(N²). Job schedulers and
    message brokers use the same in-place partition to bucket work by priority (urgent,
    normal, batch) inside a fixed buffer without allocating.

statement:
  clean: |
    Given an array `nums` with `n` objects coloured red, white, or blue, sort them
    **in-place** so that objects of the same colour are adjacent, with the colours in the
    order red, white, and blue.

    The integers `0`, `1`, and `2` represent red, white, and blue respectively. You must
    solve this problem **without using the library's sort function**.

    **Follow-up:** can you come up with a **one-pass** algorithm using only
    **constant extra space**?
  oa_story: |
    **ByteBazaar Fulfilment — OA Round 1**

    ByteBazaar's Hosur Road warehouse loads delivery totes onto a single conveyor before
    the evening dispatch. Every tote is tagged with a service level: 0 for Express (must
    leave first), 1 for Standard, and 2 for Economy. The loading bay wants all Express totes
    at the front of the conveyor, then all Standard, then all Economy, so riders can pick
    them up in that order.

    The conveyor has no spare slots: the robotic arm can only exchange two totes that are
    already on the belt, and it gets one sweep down the belt before the trucks arrive. Given
    the list of service tags in belt order, rearrange the list itself into the required
    order. Using the platform's built-in ordering utility is not allowed, and the controller
    has memory for only a handful of counters.
  trigger_keywords: ["in-place", "one-pass", "constant extra space"]
  examples:
    - input: "nums = [2,0,2,1,1,0]"
      output: "[0,0,1,1,2,2]"
      explanation: "Two 0s, then two 1s, then two 2s."
    - input: "nums = [2,0,1]"
      output: "[0,1,2]"
  constraints:
    - "n == nums.length"
    - "1 <= n <= 300"
    - "nums[i] is either 0, 1, or 2."

constraint_quiz:
  prompt: >-
    n is at most 300, so even O(N²) would pass. But the follow-up asks for one pass and
    constant extra space. What should you aim for?
  options:
    - "O(N log N) time using sorted()"
    - "O(N) time, two passes: count the 0s, 1s and 2s, then overwrite"
    - "O(N) time, one pass, O(1) extra space"
    - "O(N) time, one pass, O(N) extra space with three separate lists"
  answer: 2
  explanation: >-
    sorted() is explicitly banned, and O(N log N) is more work than three levels need.
    Counting is O(N) and O(1) space but takes two passes, so it fails the follow-up. Three
    separate lists is one pass but O(N) extra memory and not in-place. The follow-up is a
    direct hint at a single sweep with a constant number of pointers: O(N) time, O(1) space.

pattern_quiz:
  prompt: >-
    Rearrange an array of only 0s, 1s and 2s in-place, in one pass, with O(1) extra space.
    Which pattern fits?
  options:
    - "Hash map of value → count"
    - "Two pointers from both ends that only swap 0s and 2s with each other"
    - "Dutch National Flag: low, mid and high pointers with a shrinking unknown region"
    - "Sliding window over runs of equal colours"
  answer: 2
  explanation: >-
    A count map is the two-pass approach. Two end pointers that only exchange 0s and 2s
    get stuck as soon as a 1 sits at one of the ends, because neither pointer knows where
    the 1s belong. "In-place" plus exactly three categories is the Dutch National Flag
    trigger: one pointer per boundary (end of 0s, end of 1s, start of 2s) and a scan that
    shrinks the unknown middle by one element every step.

