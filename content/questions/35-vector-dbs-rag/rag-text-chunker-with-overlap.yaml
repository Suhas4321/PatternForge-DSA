drills:
- title: Compute Advance Step
  skill: setup
  goal: Calculate sliding step increment.
  instructions: Return size - overlap.
  function:
    name: calc_step
    params:
    - name: size
      type: any
    - name: overlap
      type: any
  starter_code: "class Solution:\n    def calc_step(self, size: int, overlap: int) -> int:\n        pass\n"
  tests:
  - args:
    - 10
    - 3
    expected: 7
  - args:
    - 20
    - 5
    expected: 15
  solution: "class Solution:\n    def calc_step(self, size: int, overlap: int) -> int:\n        return size - overlap\n"
  hint: Return size - overlap.
- title: Slice Substring
  skill: core
  goal: Extract bounded character slice.
  instructions: Return text[start:min(start + size, len(text))].
  function:
    name: slice_text
    params:
