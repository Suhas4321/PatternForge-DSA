hints:
- Join `OrderItems oi` with `Customers c` on `oi.customer_id = c.customer_id`.
- Join with `Products p` on `oi.product_id = p.product_id` and compute `p.price * oi.quantity AS item_total`.
- '| # Pseudocode Blueprint

  | SELECT oi.order_id, c.customer_name, p.product_name, p.price, oi.quantity,

  |        (p.price * oi.quantity) AS item_total

  | FROM OrderItems oi

  | JOIN Customers c ON oi.customer_id = c.customer_id

  | JOIN Products p ON oi.product_id = p.product_id

  | ORDER BY oi.order_id, p.product_name;'
solution:
  code: "SELECT\n    oi.order_id,\n    c.customer_name,\n    p.product_name,\n    p.price,\n    oi.quantity,\n    (p.price\
    \ * oi.quantity) AS item_total\nFROM OrderItems oi\nJOIN Customers c ON oi.customer_id = c.customer_id\nJOIN Products\
    \ p ON oi.product_id = p.product_id\nORDER BY oi.order_id, p.product_name;\n"
  explanation: Joining the normalized entities across their foreign keys reconstructs the original order line items without
    data loss or spurious combinations. This verifies the Lossless Join property of Third Normal Form (3NF) while ensuring
    zero redundant customer or product data is stored in OrderItems.
  time: O(O + C + P) linear hash join
  space: O(C + P) for in-memory entity lookup tables
pitch_script: '**(Clarify)** "We need to verify that our 3NF decomposition of customer and product entities reconstructs the
  complete order details losslessly."


  **(Brute force)** "Storing customer contact information and product descriptions repeatedly in every order line item creates
  update and deletion anomalies."


  **(Trigger)** "Reconstructing normalized entities across primary-foreign key relationships signals a lossless join verification
  query."


  **(Optimal)** "We start from the bridge table `OrderItems oi`. We join `Customers c` on `customer_id` and `Products p` on
  `product_id`. We compute `p.price * oi.quantity` as item total and order by order_id and product_name."


  **(Complexity)** "Executes in O(O + C + P) time with O(C + P) space." '
