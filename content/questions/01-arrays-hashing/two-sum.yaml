tests:
  - {args: [[2, 7, 11, 15], 9], expected: [0, 1]}
  - {args: [[3, 2, 4], 6], expected: [1, 2], note: "can't reuse index 0 for 3 + 3"}
  - {args: [[3, 3], 6], expected: [0, 1], note: duplicate values}
  - {args: [[-1, -2, -3, -4, -5], -8], expected: [2, 4], note: negatives}
  - {args: [[0, 4, 3, 0], 0], expected: [0, 3], note: zeros}
  - {args: [[1, 5, 9, 13, 21, 2], 23], expected: [4, 5], note: pair at the very end}
  - {args: [[1000000000, -1000000000, 7], 0], expected: [0, 1], note: large values}
visualize_test: 0

drills:
  - title: Compute what each element needs
    skill: setup
    goal: Loop with enumerate and compute the complement target − x at each index.
    instructions: |
      Return a list of `[index, needed]` pairs where `needed` is the value that would complete
      the sum with `nums[index]`, i.e. `target - nums[index]`.

      This is the mental flip at the heart of Two Sum: at every index, you are not looking at
      `x`, you are looking for `target - x`.
    function:
      name: complements
      params: [{name: nums}, {name: target}]
    starter_code: |
      class Solution:
          def complements(self, nums: List[int], target: int) -> List[List[int]]:
              pass
    tests:
      - {args: [[2, 7, 11, 15], 9], expected: [[0, 7], [1, 2], [2, -2], [3, -6]]}
      - {args: [[3, 3], 6], expected: [[0, 3], [1, 3]]}
      - {args: [[-4, 0], -4], expected: [[0, 0], [1, -4]]}
    solution: |
      class Solution:
          def complements(self, nums: List[int], target: int) -> List[List[int]]:
              out = []
              for i, x in enumerate(nums):
                  out.append([i, target - x])
              return out
    hint: "`for i, x in enumerate(nums):` gives you index and value together."

  - title: Check before you insert
    skill: core
    goal: Use a set to answer "have I seen this before?" and insert only after checking.
    instructions: |
      Return the index of the **first element that has already appeared earlier** in the
      array, or `-1` if every element is unique.

      Order matters: check the set first, then add the current value. If you add first,
      every element "has been seen" — by itself.
    function:
      name: firstRepeatIndex
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def firstRepeatIndex(self, nums: List[int]) -> int:
              pass
    tests:
      - {args: [[5, 1, 5, 2]], expected: 2}
      - {args: [[1, 2, 3]], expected: -1}
      - {args: [[7, 7]], expected: 1}
      - {args: [[4, 9, 2, 9, 4]], expected: 3}
    solution: |
      class Solution:
          def firstRepeatIndex(self, nums: List[int]) -> int:
              seen = set()
              for i, x in enumerate(nums):
                  if x in seen:
                      return i
                  seen.add(x)
              return -1
    hint: "Inside the loop: `if x in seen: return i`, and only then `seen.add(x)`."

  - title: Never pair an element with itself
    skill: edge
    goal: Combine complement + check-before-insert so an element can't match itself.
    instructions: |
      Return `True` if some element has an **earlier** partner that adds up to `target`,
      otherwise `False`.

      Watch the edge case: `nums = [3]`, `target = 6`. The 3 must not pair with itself, so
      the answer is `False`. With `[3, 3]` it's `True`.
    function:
      name: hasEarlierPartner
      params: [{name: nums}, {name: target}]
    starter_code: |
      class Solution:
          def hasEarlierPartner(self, nums: List[int], target: int) -> bool:
              pass
    tests:
      - {args: [[3], 6], expected: false}
      - {args: [[3, 3], 6], expected: true}
      - {args: [[1, 2, 4], 8], expected: false}
      - {args: [[1, 2, 4], 6], expected: true}
      - {args: [[], 0], expected: false}
    solution: |
      class Solution:
          def hasEarlierPartner(self, nums: List[int], target: int) -> bool:
              seen = set()
              for x in nums:
                  if target - x in seen:
                      return True
                  seen.add(x)
              return False
    hint: "Look up `target - x` in `seen` *before* adding `x` to `seen`."

hints:
  - >-
    When you stand at a number x, you already know exactly which number would finish the
    pair. What is it, and how could you find out instantly whether it appeared earlier?
  - >-
    Keep a dictionary from value → index for everything to your left. At each step there are
    two moves: look up the complement, then record the current value. Which order keeps you
    from pairing an element with itself?
  - |
    seen = {}
    for i, x in enumerate(nums):
        if (target - x) is in seen: return [seen[target - x], i]
        seen[x] = i

solution:
  code: |
    class Solution:
        def twoSum(self, nums: List[int], target: int) -> List[int]:
            seen = {}  # value -> index, for everything to the left of i
            for i, x in enumerate(nums):
                need = target - x
                if need in seen:
                    return [seen[need], i]
                seen[x] = i
            return []
  explanation: |
    Walk the array once. For each `x`, the partner we need is `target - x`. If it is already
    in `seen`, we found the pair: its stored index plus the current index. Otherwise record
    `x → i` and move on.

    Inserting **after** the lookup is what stops `[3]` with target 6 from matching itself,
    and it still handles duplicates like `[3, 3]`: the first 3 is stored, and the second one
    finds it.
  time: O(N) — one pass, O(1) average per hash lookup/insert
  space: O(N) — the map can hold up to N − 1 entries
  brute_force_code: |
    class Solution:
        def twoSum(self, nums: List[int], target: int) -> List[int]:
            n = len(nums)
            for i in range(n):
                for j in range(i + 1, n):
                    if nums[i] + nums[j] == target:
                        return [i, j]
            return []

pitch_script: |
  **(Clarify)** "Just to confirm: exactly one valid pair, I return indices, and I can't use
  the same element twice, right? And the array isn't sorted?"

  **(Brute force)** "The straightforward approach checks every pair with two loops. That's
  O(N²) time and O(1) space. With N up to 10⁴ that's around 50 million checks, so let's do
  better."

  **(Trigger)** "The key observation: for each number x, I know exactly what I'm looking
  for, which is target minus x. So the problem becomes 'have I seen this value before, and
  where?', and that's a hash map lookup."

  **(Optimal)** "I'll make one pass with a map from value to index. At each index I first
  check whether the complement is in the map. If it is, I return both indices. If not, I
  store the current value. Checking before inserting makes sure I never pair an element
  with itself, and duplicates like [3, 3] still work."

  **(Complexity)** "That's O(N) time with average O(1) hash operations, and O(N) extra
  space for the map. If memory were tight I could sort index-value pairs and use two
  pointers, at O(N log N) time."

twist:
  lc: 167
  title: Two Sum II - Input Array Is Sorted
  why: >-
    The array is now sorted and you must use O(1) extra space. The map is no longer allowed,
    but sortedness lets two pointers from both ends discard one candidate per comparison.
    Same question, different trigger.

