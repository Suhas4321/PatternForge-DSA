concept:
  problem_it_solves: >-
    "How do we correlate incident alerts with user accounts across multiple normalized datasets without exporting everything to SQL?"
    Production data is normalized across entity boundaries (users, test runs, incident alerts).
    Pandas `pd.merge()` provides relational join semantics (`inner`, `left`, `right`, `outer`), matching foreign keys in C-speed hash joins.
  brute_force: >-
    Writing nested loops in Python: looping through incidents, scanning test runs to match `run_id`,
    and scanning users to match `user_id`.
  brute_force_complexity: O(I * R * U) polynomial runtime — completely unscalable beyond a few hundred records.
  key_insight: >-
    `pd.merge(left, right, on='key', how='inner')` builds an in-memory hash table of the join key,
    executing relational joins in linear O(N + M) time. Chaining two merges connects `incidents -> test_runs -> users`
    in two quick hash-join passes.
  real_world: >-
    Post-incident customer blast radius analysis, customer billing audits, and joining clickstream sessions with user CRM records.

statement:
  clean: |
    Implement a multi-table relational join pipeline using relational merge:
    `find_affected_customers(users: list[dict], test_runs: list[dict], incidents: list[dict]) -> list[dict]`.
    
    Given three relational datasets:
    1. `users`: list of user records `{"user_id": int, "name": str, "email": str}`.
    2. `test_runs`: list of device test runs `{"run_id": int, "user_id": int, "device": str}`.
    3. `incidents`: list of platform alerts `{"run_id": int, "severity": str, "description": str}`.
    
    Processing steps:
    1. If any of the three input lists is empty, return `[]`.
    2. Load each dataset into a `pandas.DataFrame`.
    3. Perform an inner join between `test_runs` and `incidents` on `run_id`.
    4. Perform an inner join between the resulting DataFrame and `users` on `user_id`.
    5. Filter the joined rows to keep only those with `severity == "P1"`.
    6. Select the customer columns `["user_id", "name", "email"]`.
    7. Deduplicate so each unique `user_id` appears at most once in the output.
    8. Sort the resulting customer list by `user_id` in ascending order.
    9. Return the result as a list of dictionaries via `.to_dict(orient='records')`.
  oa_story: |
    **Drizz Operations Center — P1 Customer Blast Radius**
    
    During an automated device farm outage, multiple physical device nodes went offline simultaneously.
    Platform monitoring logged incident alerts tied to specific `run_id` execution handles.
    The customer support team urgently needed to know which client accounts had their test suites disrupted by P1 failures.
    
    Implement a relational join pipeline in Pandas that links incident telemetry back to account owners for notification.
  trigger_keywords: ["relational merge", "find_affected_customers", "users"]
  examples:
    - input: "users = [{'user_id': 1, 'name': 'Acme', 'email': 'a@acme.com'}], test_runs = [{'run_id': 10, 'user_id': 1, 'device': 'Pixel'}], incidents = [{'run_id': 10, 'severity': 'P1', 'description': 'OOM'}]"
      output: "[{'user_id': 1, 'name': 'Acme', 'email': 'a@acme.com'}]"
      explanation: "Run 10 had a P1 incident and belongs to user 1 (Acme)."
  constraints:
    - "users, test_runs, and incidents contain between 0 and 10,000 items each"
    - "severity is a string (e.g. 'P1', 'P2', 'P3')"

constraint_quiz:
  prompt: >-
    What is the time complexity of a hash join between two DataFrames of size N and M on a common key in Pandas?
  options:
    - "O(N * M)"
    - "O(N + M) average time"
    - "O(log(N + M))"
    - "O(1)"
  answer: 1
  explanation: >-
    Pandas builds an in-memory hash table of the join keys from the smaller table and probes it with the larger table in O(N + M) time.

pattern_quiz:
  prompt: Which join type in `pd.merge()` discards rows that do not have matching keys in both tables?
  options:
    - "how='inner'"
    - "how='left'"
    - "how='right'"
    - "how='outer'"
  answer: 0
  explanation: >-
    An inner join (`how='inner'`, the default in `pd.merge`) preserves only records with matching keys in both DataFrames.

