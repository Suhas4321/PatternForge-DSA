drills:
  - title: Callable instance dunder call
    skill: setup
    goal: Make an instance callable via __call__.
    instructions: |
      Create a class `Multiplier` with `self.factor`. Calling `m(x)` should return `x * self.factor`.
    function:
      name: test_multiplier
      params: [{name: factor}, {name: x}]
    starter_code: |
      class Solution:
          def test_multiplier(self, factor: int, x: int) -> int:
              pass
    tests:
      - {args: [3, 4], expected: 12}
      - {args: [5, 0], expected: 0}
    solution: |
      class Multiplier:
          def __init__(self, factor):
              self.factor = factor
          def __call__(self, x):
              return x * self.factor

      class Solution:
          def test_multiplier(self, factor: int, x: int) -> int:
              m = Multiplier(factor)
              return m(x)
    hint: "Define `def __call__(self, x): return x * self.factor`."

  - title: Custom less than comparator
    skill: core
    goal: Implement __lt__ for custom sorting.
    instructions: |
      Given pairs `(name, score)`, return names sorted descending by score.
    function:
      name: sort_by_score
      params: [{name: pairs}]
    starter_code: |
      class Solution:
          def sort_by_score(self, pairs: list[list]) -> list[str]:
              pass
    tests:
      - {args: [[["A", 80], ["B", 95], ["C", 90]]], expected: ["B", "C", "A"]}
      - {args: [[]], expected: []}
    solution: |
      class Item:
          def __init__(self, name, score):
              self.name = name
              self.score = score
          def __lt__(self, other):
              return self.score < other.score

      class Solution:
          def sort_by_score(self, pairs: list[list]) -> list[str]:
              items = [Item(p[0], p[1]) for p in pairs]
              return [it.name for it in sorted(items, reverse=True)]
    hint: "Implement __lt__ and call sorted(items, reverse=True)."

  - title: String representation with repr
    skill: edge
    goal: Format diagnostic string using __repr__.
    instructions: |
      Return `f"Node({val})"` using the `__repr__` method of a `Node` class.
    function:
      name: repr_node
      params: [{name: val}]
    starter_code: |
      class Solution:
          def repr_node(self, val: int) -> str:
              pass
    tests:
      - {args: [42], expected: "Node(42)"}
      - {args: [0], expected: "Node(0)"}
    solution: |
      class Node:
          def __init__(self, val):
              self.val = val
          def __repr__(self):
              return f"Node({self.val})"

      class Solution:
          def repr_node(self, val: int) -> str:
              return repr(Node(val))
    hint: "Define `def __repr__(self): return f'Node({self.val})'`."

hints:
  - "Define `BenchmarkResult` with `__init__`, `__call__`, and `__lt__`."
  - "In `__lt__`, if `self.accuracy != other.accuracy`: return `self.accuracy < other.accuracy`."
  - "If accuracies are equal, return `self.latency > other.latency` (higher latency is considered 'lesser' rank)."

solution:
  code: |
    class BenchmarkResult:
        def __init__(self, model: str, latency: float, accuracy: float):
            self.model = model
            self.latency = latency
            self.accuracy = accuracy

        def __call__(self, min_acc: float) -> bool:
            return self.accuracy >= min_acc

        def __lt__(self, other: "BenchmarkResult") -> bool:
            if self.accuracy != other.accuracy:
                return self.accuracy < other.accuracy
            # When accuracy ties, lower latency is superior (so higher latency is 'less')
            return self.latency > other.latency

    class Solution:
        def rank_benchmarks(self, records: list[dict], min_accuracy: float) -> list[str]:
            benchmarks = [BenchmarkResult(r["model"], r["latency"], r["accuracy"]) for r in records]
            qualified = [b for b in benchmarks if b(min_accuracy)]
            ranked = sorted(qualified, reverse=True)
            return [b.model for b in ranked]
  explanation: |
    `BenchmarkResult` encapsulates evaluation state.
    Implementing `__call__` allows `b(min_accuracy)` to act as an expressive predicate.
    Implementing `__lt__` establishes a two-tiered priority ordering: accuracy takes precedence,
    with latency serving as the tiebreaker. Calling Python's built-in `sorted(..., reverse=True)`
    organizes the models from best to worst.
  time: O(N log N) — dominated by Timsort on the qualified list
  space: O(N) — instantiates N BenchmarkResult objects

pitch_script: |
  **(Clarify)** "We need to filter benchmark records by a minimum accuracy threshold and rank the survivors primarily by accuracy and secondarily by lower latency."

  **(Basement Insight)** "By implementing Python dunder methods (`__call__` and `__lt__`), custom classes integrate natively with Python's built-in functions like `filter()` and `sorted()`. Python's Timsort relies directly on `__lt__` for comparisons."

  **(Solution)** "We define `BenchmarkResult`. `__call__` validates whether accuracy meets the threshold. `__lt__` returns `self.accuracy < other.accuracy`, or if tied, `self.latency > other.latency`. We filter the objects with `b(min_accuracy)` and sort with `reverse=True`."

  **(Complexity)** "Runs in O(N log N) time for sorting N records, requiring O(N) space to hold the instances."

