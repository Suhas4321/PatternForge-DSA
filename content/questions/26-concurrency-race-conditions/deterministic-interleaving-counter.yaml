hints:
- Maintain a dictionary `registers = {}` mapping each thread ID to its local working value.
- When op is 'READ', copy the global counter to `registers[t]`. When 'ADD', increment `registers[t]`. When 'WRITE', commit
  `counter = registers[t]`.
- '| # Pseudocode Blueprint

  | counter = 0, registers = {}, writes = 0

  | for thread_id, op in steps:

  |     if op == "READ": registers[thread_id] = counter

  |     elif op == "ADD": registers[thread_id] += 1

  |     elif op == "WRITE": counter = registers[thread_id]; writes += 1

  | return writes - counter lost updates'
solution:
  code: "class Solution:\n    def simulate_interleaving(self, steps: list[list[str]]) -> dict:\n        counter = 0\n    \
    \    registers: dict[str, int] = {}\n        total_writes = 0\n\n        for thread_id, op in steps:\n            if op\
    \ == \"READ\":\n                registers[thread_id] = counter\n            elif op == \"ADD\":\n                registers[thread_id]\
    \ = registers.get(thread_id, 0) + 1\n            elif op == \"WRITE\":\n                counter = registers.get(thread_id,\
    \ 0)\n                total_writes += 1\n\n        lost = total_writes - counter\n        return {\n            \"final_counter\"\
    : counter,\n            \"total_writes\": total_writes,\n            \"lost_updates\": lost,\n            \"race_detected\"\
    : lost > 0,\n        }\n"
  explanation: By decoupling the read and write phases across threads with per-thread registers, the simulation faithfully
    replicates hardware CPU register preemption. When multiple threads execute READ before any thread commits its WRITE, they
    both write back the same incremented value, causing lost updates.
  time: O(N) where N is the number of steps in the schedule
  space: O(T) where T is the number of unique threads
pitch_script: '**(Clarify)** "We need to simulate thread execution on a shared counter across an explicit schedule of READ,
  ADD, and WRITE steps to identify lost updates and race conditions."


  **(Brute force)** "Running real multi-threaded code with `time.sleep()` yields non-deterministic timing that cannot be tested
  reliably across different CPU architectures."


  **(Trigger)** "The problem provides an explicit sequence of steps with thread IDs, which triggers an event-driven state
  simulation using thread-local registers."


  **(Optimal)** "We iterate through the steps linearly. A dictionary maintains each thread''s register state. When a thread
  executes READ, it snapshots the global counter. On ADD, it increments its register. On WRITE, it writes its register to
  the global counter and increments the write tally. Lost updates equal total writes minus final counter."


  **(Complexity)** "Executes in O(N) time across N steps and O(T) space for T thread registers." '
