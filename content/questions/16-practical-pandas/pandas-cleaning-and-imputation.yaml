concept:
  problem_it_solves: >-
    "How do we prepare raw telemetry with missing fields, repeated retries, and null values for production analytics?"
    Raw ingestion logs frequently contain duplicate retry attempts, corrupted null identifiers, and missing metric measurements.
    Pandas provides specialized vectorized operations (`.drop_duplicates()`, `.dropna()`, `.fillna()`) to normalize datasets cleanly.
  brute_force: >-
    Iterating with Python loops and dictionaries to track duplicate IDs, filtering None values manually,
    and calculating medians with custom sort passes.
  brute_force_complexity: O(N log N) sorting with high memory overhead and complex edge-case handling.
  key_insight: >-
    Chaining vectorized Pandas cleaning operations executes in compiled C code:
    `df.drop_duplicates(subset=['test_id'], keep='last')` keeps the final attempt,
    `df.dropna(subset=['device'])` eliminates records missing required foreign keys, and
    `df['latency_ms'].fillna(median_val)` imputes missing readings without distorting the distribution.
  real_world: >-
    Cleaning telemetry prior to feeding Grafana dashboards, preprocessing training sets for ML models, and ETL data quality gates.

statement:
  clean: |
    Implement an end-to-end telemetry cleaning pipeline using dropna fillna:
    `clean_telemetry_df(records: list[dict]) -> list[dict]`.
    
    Given a list of test run dictionaries containing keys:
    `test_id` (int), `device` (optional str), `status` (str), and `latency_ms` (optional float).
    
    Cleaning rules:
    1. If `records` is empty, return `[]`.
    2. Convert `records` into a `pandas.DataFrame`.
    3. **Deduplicate**: Drop duplicate rows sharing the same `test_id`, retaining the **last** occurrence (`keep='last'`).
    4. **Drop Missing Keys**: Drop any rows where `device` is `NaN` or `None`.
    5. **Median Imputation**: If any row has a missing or null `latency_ms`, fill it with the **median** of all non-null
       `latency_ms` values in the dataset. If all latencies are missing, fill with `0.0`.
    6. **Sort**: Sort the cleaned DataFrame by `test_id` ascending.
    7. Return the resulting records as a list of dictionaries via `.to_dict(orient='records')`.
  oa_story: |
    **FitLabs Virtual Try-On — Telemetry Quality Gate**
    
    During high-throughput GPU model benchmarking, client retries created duplicate run records, while network drops
    left some runs with missing device identifiers or null latency timers.
    Before metrics could be ingested into our Snowflake data warehouse, the pipeline needed an automated data quality cleaner.
    
    Implement a standardized Pandas cleaning pipeline that purges duplicates, drops invalid device records, and imputes missing latencies.
  trigger_keywords: ["dropna fillna", "clean_telemetry_df", "records"]
  examples:
    - input: "records = [{'test_id': 1, 'device': 'Pixel 8', 'status': 'PASS', 'latency_ms': 200}, {'test_id': 1, 'device': 'Pixel 8', 'status': 'PASS', 'latency_ms': 250}]"
      output: "[{'test_id': 1, 'device': 'Pixel 8', 'status': 'PASS', 'latency_ms': 250.0}]"
      explanation: "Duplicate test_id 1 is resolved by keeping the last record (latency 250.0)."
    - input: "records = [{'test_id': 2, 'device': None, 'status': 'FAIL', 'latency_ms': 100}]"
      output: "[]"
      explanation: "Row with missing device is dropped."
  constraints:
    - "records contains between 0 and 10,000 items"
    - "test_id is a positive integer"

constraint_quiz:
  prompt: >-
    Why is median imputation preferred over mean imputation when filling missing latency metrics?
  options:
    - "Because median is faster to compute"
    - "Because median is robust against extreme outliers (e.g. 60-second timeouts)"
    - "Because mean cannot be computed on floats"
    - "Because median always produces integers"
  answer: 1
  explanation: >-
    A single 60-second timeout can heavily skew the mean, whereas the median remains stable against extreme latency spikes.

pattern_quiz:
  prompt: Which argument in `.drop_duplicates()` ensures that the most recent attempt is retained?
  options:
    - "keep='first'"
    - "keep='last'"
    - "keep=False"
    - "inplace=True"
  answer: 1
  explanation: >-
    `keep='last'` retains the last observed duplicate row and drops earlier occurrences.

