slug: best-time-to-buy-and-sell-stock-with-cooldown
lc: 309

concept:
  problem_it_solves: >-
    "What's the best I can do when the moves I'm allowed today depend on what I did
    yesterday?" A plain dp[i] can't answer that, because "best profit after day i" hides
    whether you're holding a share or are locked out by a cooldown. State-machine DP keeps one
    best value per situation per day, and the rules of the problem become the arrows between
    those situations.
  brute_force: >-
    Recurse day by day with a flag for "am I holding a share?": when free, either wait or buy;
    when holding, either keep it or sell and jump two days ahead (the day after a sale is the
    cooldown). Each day branches two ways, and the recursion recomputes "best from day 9 while
    free" for every one of the many buy/sell histories that end up free on day 9.
  brute_force_complexity: >-
    Exponential time (the number of calls grows by a factor of about 1.75 per extra day), O(n)
    recursion depth — 5000 days is far beyond anything that finishes.
  key_insight: >-
    The future only depends on today's day and which of three states you end the day in, not
    on the path that got you there. HOLD: you own a share. SOLD: you sold today, so tomorrow
    you can't buy. REST: you own nothing and are free to buy. Draw the arrows: REST → HOLD
    (buy), HOLD → HOLD (keep), HOLD → SOLD (sell), SOLD → REST (the forced cooldown day),
    REST → REST (wait). There is no SOLD → HOLD arrow, and that missing arrow *is* the cooldown.
    Keep dp[i][state] = best profit at the end of day i in that state, and each state's value
    is the best over the arrows coming into it.
  real_world: >-
    Order-management systems in trading platforms (Zerodha Kite, Groww) model every order as a
    state machine (open, partially filled, filled, cancelled) with rules on which transitions
    are legal. The "best score per state per time step" table is the Viterbi algorithm, which
    decodes speech recognisers and hidden Markov models, and the same idea plans retry
    schedules where a failed call forces a cool-off before the next attempt.

statement:
  clean: |
    You are given an array `prices` where `prices[i]` is the price of a given stock on the
    `i`th day.

    Find the **maximum profit** you can achieve. You may complete
    as many transactions as you like (i.e., buy one and sell one share of the stock multiple
    times) with the following restrictions:

    - After you sell your stock, you cannot buy stock on the next day (i.e.,
      **cooldown one day**).

    **Note:** You may not engage in multiple transactions simultaneously (i.e., you must sell
    the stock before you buy again).
  oa_story: |
    **TradeTimer Paper-Trading League — OA Round 1**

    TradeTimer runs a paper-trading league for college students across Bengaluru, and the
    league's backend team in Whitefield needs a scoring engine. Each player trades a single
    share of one stock, and the closing price for every trading day of the season is known in
    advance for the replay: `prices[i]` is the price on day `i`. A player can own at most one
    share at a time and must sell it before buying again, but may trade as often as they like.

    There is one league rule: whenever a player closes a position, their account is frozen for
    the **whole of the next trading day** for a mandatory risk review, so no purchase is
    allowed on that day. The engine must report the best total profit any player could have
    made over the season (0 if no trade is worth it). Seasons last up to 5000 trading days, and
    prices are between 0 and 1000.
  trigger_keywords: ["maximum profit", "cooldown one day", "as many transactions as you like"]
  examples:
    - input: "prices = [1,2,3,0,2]"
      output: "3"
      explanation: "buy (day 0), sell (day 1), cooldown (day 2), buy (day 3), sell (day 4): (2 − 1) + (2 − 0) = 3."
    - input: "prices = [1]"
      output: "0"
      explanation: "With one day there is nothing to sell into."
  constraints:
    - "1 <= prices.length <= 5000"
    - "0 <= prices[i] <= 1000"

constraint_quiz:
  prompt: There can be 5000 days. What complexity should you aim for?
  options:
    - "O(2^n): try every buy/sell/wait pattern"
    - "O(n²): for each day, try every earlier day as the last sale"
    - "O(n): three states per day, constant work per state"
    - "O(n log n): sort the prices and pair lows with highs"
  answer: 2
  explanation: >-
    Every pattern of actions is exponential. The O(n²) DP ("best profit if my last sale was on
    day j") is about 1.25 × 10⁷ steps, which passes in C++ but is slow in Python, and it does
    work the state machine doesn't need. With three states the whole history collapses into
    three numbers per day, so O(n) is enough. Sorting throws away time order, and you can't
    sell before you buy.

pattern_quiz:
  prompt: >-
    Unlimited transactions, at most one share held at a time, and after a sale you're blocked
    for a day. Which pattern fits?
  options:
    - "Greedy: add every positive day-to-day price rise"
    - "State-machine DP: best profit per day for HOLD, SOLD and REST"
    - "Monotonic stack of prices waiting for a higher price"
    - "Two pointers: buy at the global minimum, sell at the later maximum"
  answer: 1
  explanation: >-
    "What you may do today depends on what you did yesterday" is the state-machine trigger: the
    cooldown makes the legal moves depend on whether you just sold. The greedy "collect every
    rise" is optimal only without a cooldown; on [1, 4, 2, 7] it collects 3 + 5 = 8, which needs
    a buy on the day right after a sale, while the true answer is 6. Two pointers solves only the
    single-transaction version, and a monotonic stack answers "next greater price", not "best
    sequence of trades".

function:
  name: maxProfit
  params: [{name: prices}]

starter_code: |
