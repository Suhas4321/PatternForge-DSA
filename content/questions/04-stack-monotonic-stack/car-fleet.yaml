slug: car-fleet
lc: 853

concept:
  problem_it_solves: >-
    "Which items get held up by a slower item in front of them?" On a single lane nobody can
    overtake, so a car's real arrival time is decided by the slowest car anywhere ahead of
    it. Once the cars are ordered by position, a stack of fleet arrival times answers that
    question in one pass: each car either joins the fleet ahead or starts a new one.
  brute_force: >-
    For every car, look at every car ahead of it and check whether any of them would arrive
    no earlier than it would on its own; if one does, this car gets stuck behind it and isn't
    the leader of a new fleet. Counting the cars that nobody blocks gives the answer, but
    each car re-examines the same cars ahead over and over.
  brute_force_complexity: >-
    O(N²) time, O(1) extra space — 10⁵ cars means about 10¹⁰ pair checks. (A step-by-step
    time simulation is even worse: its cost depends on the distance, not just N.)
  key_insight: >-
    Stop thinking about speeds and positions mid-journey; think about **arrival time if
    unblocked**, (target − position) / speed. Process cars from the one closest to the target
    backwards. The fleet directly ahead arrives at some time T. A car behind with time ≤ T
    would reach the target no later than that fleet, but it can't pass, so it catches up and
    arrives at exactly T: it joins. Only a car with time strictly greater than T is too slow
    to catch up and starts a new fleet, which now caps everyone behind it. So the stack only
    ever grows with strictly increasing times, and its size is the answer.
  real_world: >-
    Traffic and logistics platforms (Google Maps, Uber, Delhivery route planning) model
    single-lane road segments and conveyor belts this way: the slowest unit ahead sets the
    pace for the platoon behind it. The same "a slow upstream stage caps everything after it"
    reasoning shows up when analysing pipeline stages in stream processors like Kafka
    consumers, where throughput is bounded by the slowest stage ahead.

statement:
  clean: |
    There are `n` cars at given miles away from the starting mile 0, traveling to reach the
    mile `target`.

    You are given two integer arrays `position` and `speed`, both of length `n`, where
    `position[i]` is the starting mile of the `i`th car and `speed[i]` is the speed of the
    `i`th car in miles per hour.

    A car **cannot pass another car**, but it can catch up and then travel next to it at the
    speed of the slower car.

    A **car fleet** is a car or cars driving next to each other. The speed of the car fleet is
    the minimum speed of any car in the fleet.

    If a car catches up to a car fleet **at the mile target**, it will still be considered as
    part of the car fleet.

    Return the number of car fleets that will arrive at the destination.
  oa_story: |
    **TollTrack — Hiring Challenge, Backend SDE-1**

    TollTrack runs FASTag analytics for the toll plaza at the end of a single-lane stretch of
    the NICE Road service lane. Every morning at 8 AM a snapshot records each vehicle's
    distance from the start of the stretch and its cruising speed. The lane is too narrow for
    overtaking: a faster vehicle that reaches a slower one simply slows down and follows it
    bumper to bumper, and from then on they move together as one convoy at the slower speed.

    The plaza is at kilometre `target`. A vehicle that reaches a convoy exactly at the plaza
    is counted as part of that convoy. Given `target`, the list of starting kilometres
    (`position`, all different, in no particular order) and the list of speeds (`speed`),
    return how many separate convoys will reach the plaza, so the plaza can decide how many
    booths to open. A snapshot can contain up to 100,000 vehicles.
  trigger_keywords: ["cannot pass another car", "car fleet", "speed of the slower car"]
  examples:
    - input: "target = 12, position = [10,8,0,5,3], speed = [2,4,1,1,3]"
      output: "3"
      explanation: >-
        The cars at 10 and 8 meet at mile 12 and form one fleet. The car at 0 never catches
        anyone and is its own fleet. The cars at 5 and 3 meet at mile 6 and arrive together.
    - input: "target = 10, position = [3], speed = [3]"
      output: "1"
      explanation: "There is only one car, hence there is only one fleet."
    - input: "target = 100, position = [0,2,4], speed = [4,2,1]"
      output: "1"
      explanation: >-
        The cars at 0 and 2 meet at mile 4 and move at speed 2, then catch the car at 4 at
        mile 6. All three arrive together at speed 1.
  constraints:
    - "n == position.length == speed.length"
    - "1 <= n <= 10^5"
    - "0 < target <= 10^6"
    - "0 <= position[i] < target"
    - "All the values of position are unique."
    - "0 < speed[i] <= 10^6"

constraint_quiz:
  prompt: With up to 10⁵ cars, what time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(target)"]
  answer: 1
  explanation: >-
    O(N²) pair checks is 10¹⁰ steps, far too slow. O(N log N) is the target: the input
    positions arrive in no particular order, and you need them sorted so that "the car
    ahead" is meaningful; after sorting, the stack pass is O(N). Plain O(N) would need the
    cars already in road order, and a car's fleet depends on every car ahead of it. O(target)
    (bucketing or simulating mile by mile) ties the cost to the road length, up to 10⁶, rather
    than to the cars, and a simulation still has to handle cars meeting at fractional miles.

pattern_quiz:
  prompt: >-
    Cars can't overtake, a faster car behind gets capped by a slower car ahead, and positions
    are unsorted. Which pattern fits?
  options:
    - "Sort by speed, then count distinct speeds"
    - "Sort by position (closest to target first), then a stack of fleet arrival times"
    - "Hash map from arrival time to count of cars"
    - "Binary search on the number of fleets"
  answer: 1
  explanation: >-
    "Cannot pass" means order along the road is everything, so sort by position first. Then
    each car only needs to compare against the fleet directly ahead of it, the most recent
    unresolved thing, which is a stack. Sorting by speed ignores who is in front of whom;
    grouping equal arrival times misses cars that are faster but get capped (their own times
    differ from the fleet's); and the answer isn't monotone in anything you could binary
    search on.

