slug: count-good-nodes-in-binary-tree
lc: 1448

concept:
  problem_it_solves: >-
    "Does this node beat everything above it?" A child can't look up at its ancestors; a
    TreeNode only points down. So whatever a node needs to know about the path above it has to
    be handed to it by its parent. This problem is the cleanest example of passing state DOWN
    the recursion (the largest value seen on the path so far) while still returning an answer
    UP (how many good nodes are in this subtree).
  brute_force: >-
    For every node, rebuild its root-to-node path and check whether any value on it is larger.
    The natural way is a DFS that carries the whole path as a list and calls max(path) at each
    node. Every node re-scans all of its ancestors, even though its parent already knew the
    maximum of that exact path minus one element.
  brute_force_complexity: >-
    O(N · H) time, O(H) space for the path — on a 10⁵-node chain that's about 5 × 10⁹
    comparisons.
  key_insight: >-
    The only fact a node needs about its ancestors is one number: the maximum value on the path
    from the root to its parent. So pass that number down as an argument. The node is good if
    node.val >= max_so_far, and its children receive max(max_so_far, node.val). Each call then
    returns its own count (1 or 0) plus the counts returned by its two children, so the answer
    flows back up to the root. Two directions in one recursion: context goes down, results come
    up.
  real_world: >-
    Hierarchical permissions inherit context downward. Opening /a/b/c on Linux needs execute
    permission on every directory above it, so the kernel carries "still allowed?" down the
    path instead of re-checking ancestors for each file, and Google Drive applies a folder's
    sharing to everything beneath it. CSS is the same shape: inherited styles flow from parent
    to child as the browser walks the DOM tree.

statement:
  clean: |
    Given the `root` of a binary tree, a node `X` in the tree is named **good** if in the
    **path from root** to `X` there are **no nodes with a value greater than** `X`.

    Return the number of good nodes in the binary tree. The root is always good, and a node
    whose value equals the largest value above it is still good.
  oa_story: |
    **GullyGrid Mobility — OA Round 1**

    GullyGrid plans cycle-delivery routes through the hilly lanes of Bengaluru's older
    neighbourhoods. Every route network starts at a dark store and branches out: from each
    junction a rider can take at most two onward lanes, and lanes never reconnect, so there is
    exactly one way to reach any junction from the store. Every junction is tagged with its
    elevation in metres.

    A junction is a "clear-sky" junction if, on the ride from the store to it, no junction
    passed earlier was higher than it, so the rider has an unblocked view back to the store.
    The store itself always counts, and a junction exactly as high as the highest one before
    it still counts. The ops team wants the number of clear-sky junctions in a network.
    Networks can have up to 100,000 junctions, and elevations are given relative to a
    reference point, so they can be negative.
  trigger_keywords: ["good", "path from root", "no nodes with a value greater than"]
  examples:
    - input: "root = [3,1,4,3,null,1,5]"
      output: "4"
      explanation: "Good nodes: root 3, 4 (path 3→4), 5 (path 3→4→5) and the lower 3 (path 3→1→3: equal to the max, still good)."
    - input: "root = [3,3,null,4,2]"
      output: "3"
      explanation: "2 is not good because the 3s above it are greater. The other three nodes are good."
    - input: "root = [1]"
      output: "1"
      explanation: "The root is always good."
  constraints:
    - "The number of nodes in the binary tree is in the range [1, 10^5]"
    - "Each node's value is between [-10^4, 10^4]"

constraint_quiz:
  prompt: >-
    The tree has up to 10⁵ nodes and may be a single long chain. What time complexity should
    you aim for?
  options:
    - "O(N · H) — check each node's full path"
    - "O(N log N) — sort the values first"
    - "O(N) — visit each node once, carrying one number"
    - "O(H) — walk the longest path only"
  answer: 2
  explanation: >-
    Re-scanning each node's path is O(N · H), which is about N²/2 ≈ 5 × 10⁹ steps on a chain. Sorting
    destroys the root-to-node structure that defines "good". Looking at one path is not enough,
    because every node has to be classified. Carrying the running maximum down means each node
    does O(1) work: O(N) total.

pattern_quiz:
  prompt: >-
    Whether a node counts depends on the values of all its ancestors, and nodes only have
    pointers to their children. Which pattern fits?
  options:
    - "Level-order BFS comparing each node with the previous level's maximum"
    - "DFS that passes the maximum on the path so far down as an argument"
    - "Post-order DFS that returns each subtree's maximum to the parent"
    - "In-order traversal with a running maximum"
  answer: 1
  explanation: >-
    "Path from root to X" means the information lives above the node, so it has to be passed
    down. A level's maximum mixes in values from other branches that aren't on X's path.
    Returning subtree maxima goes the wrong direction: they describe what is below, not above.
    In-order visits left-subtree nodes before their ancestors, so its running maximum includes
    non-ancestors.

