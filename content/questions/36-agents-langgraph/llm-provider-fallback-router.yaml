    - openai
    - 1
    - hi
    - false
    expected:
      status: success
      provider_used: openai
      attempts: 1
      response: hi
      fallback_triggered: false
  solution: "class Solution:\n    def build_gateway_result(self, status: str, provider: str, attempts: int, text: str, fallback:\
    \ bool) -> dict:\n        return {\n            \"status\": status,\n            \"provider_used\": provider,\n      \
    \      \"attempts\": attempts,\n            \"response\": text,\n            \"fallback_triggered\": fallback,\n     \
    \   }\n"
  hint: Assemble the 5 gateway response keys.
hints:
- Calculate max primary attempts as 1 + max_retries.
- Iterate through primary responses; return immediately if status_code == 200.
- If all primary attempts fail, attempt secondary once and format fallback_triggered = True.
solution:
  code: "class Solution:\n    def route_request(self, prompt: str, primary_provider: str, secondary_provider: str, mock_responses:\
    \ dict, max_retries: int = 2) -> dict:\n        total_attempts = 0\n        primary_list = mock_responses.get(primary_provider,\
    \ [])\n        secondary_list = mock_responses.get(secondary_provider, [])\n        \n        # Primary attempts (1 initial\
    \ + up to max_retries)\n        max_primary = 1 + max_retries\n        for i in range(max_primary):\n            total_attempts\
    \ += 1\n            resp = primary_list[i] if i < len(primary_list) else {\"status_code\": 500, \"error\": \"No response\"\
    }\n            if resp.get(\"status_code\") == 200:\n                return {\n                    \"status\": \"success\"\
    ,\n                    \"provider_used\": primary_provider,\n                    \"attempts\": total_attempts,\n     \
    \               \"response\": resp.get(\"text\"),\n                    \"fallback_triggered\": False,\n              \
    \  }\n        \n        # Fallback to secondary\n        total_attempts += 1\n        sec_resp = secondary_list[0] if\
    \ len(secondary_list) > 0 else {\"status_code\": 500, \"error\": \"No response\"}\n        if sec_resp.get(\"status_code\"\
    ) == 200:\n            return {\n                \"status\": \"success\",\n                \"provider_used\": secondary_provider,\n\
    \                \"attempts\": total_attempts,\n                \"response\": sec_resp.get(\"text\"),\n              \
    \  \"fallback_triggered\": True,\n            }\n        \n        return {\n            \"status\": \"failed\",\n   \
    \         \"provider_used\": None,\n            \"attempts\": total_attempts,\n            \"response\": None,\n     \
    \       \"fallback_triggered\": True,\n        }\n"
  explanation: Executes bounded retries on the primary vendor before falling back to the backup provider, returning a normalized
    response payload.
  time: O(R) where R is max_retries (typically <= 5 attempts)
  space: O(1) constant memory for tracking attempt counters
pitch_script: '**(Clarify)** "We need to design a multi-provider gateway routing engine that retries the primary LLM vendor
  upon failure and falls back to a secondary provider if retries are exhausted."


  **(Basement Insight)** "Relying on a single AI provider invites downtime whenever rate limits or capacity constraints trigger
  429 or 503 errors. A multi-vendor routing gateway provides immediate failover protection."


  **(Solution)** "We attempt the primary model up to 1 + max_retries times. If any call succeeds with 200 OK, we return. If
  all primary attempts fail, we immediately dispatch the request to the secondary provider."


  **(Complexity)** "Executes in O(R) time bounded by retries, using O(1) space."

  '
