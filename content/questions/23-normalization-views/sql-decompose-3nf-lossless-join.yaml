function:
  name: execute_sql
  params: []
  returns: any
  compare: exact
starter_code: "-- Write your SQL query below to verify lossless join reconstruction\nSELECT\n    oi.order_id,\n    c.customer_name,\n\
  \    p.product_name,\n    p.price,\n    oi.quantity,\n    (p.price * oi.quantity) AS item_total\nFROM OrderItems oi\nJOIN\
  \ Customers c ON oi.customer_id = c.customer_id\nJOIN Products p ON oi.product_id = p.product_id\nORDER BY oi.order_id,\
  \ p.product_name;\n"
