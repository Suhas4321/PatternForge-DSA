slug: bubble-sort
lc: 9010
concept:
  problem_it_solves: Sorts an array into ascending numerical order by repeatedly comparing adjacent elements and swapping them if they are out of order.
  brute_force: Comparing random pairs or rescanning sorted suffixes wastes quadratic comparisons and excessive write cycles.
  brute_force_complexity: O(n^2) time, O(1) space — 100 elements means up to 10,000 comparison steps.
  key_insight: In each pass, the largest remaining unsorted element bubbles up to its final rightmost position. Adjacent comparisons ensure local ordering quickly propagates globally.
  real_world: Educational benchmarking, hardware verification, and nearly-sorted telemetry lists where a single pass with early exit runs in O(n) time.
statement:
  clean: |
    Given an array of integers `nums`, sort the array in **ascending order** using the **Bubble Sort** algorithm.

    In each pass through the array, compare **adjacent elements** from left to right. If two adjacent elements are in the wrong order (`nums[j] > nums[j + 1]`), **swap** them. Repeat this process until no more swaps are needed.

    Return the sorted array.
  oa_story: |
    **SwiftCart Logistics** warehouse robotics system processes incoming batches of parcel shipping weights. Conveyor sensor bays can only compare two adjacent package scales at a time.

    To calibrate the sorting track, the engineer must order package weights in ascending numerical sequence by repeatedly comparing neighboring cargo containers and triggering pneumatic diverters to swap any misordered adjacent boxes.
  trigger_keywords:
    - adjacent elements
    - swap
    - ascending order
  examples:
    - input: nums = [5, 1, 4, 2, 8]
      output: "[1, 2, 4, 5, 8]"
      explanation: In the first pass, 5 bubbles past 1, 4, and 2 before stopping before 8.
    - input: nums = [4, 2, 2, 1]
      output: "[1, 2, 2, 4]"
      explanation: Duplicate elements 2 maintain relative order while 4 bubbles to the right.
    - input: nums = [1, 2, 3]
      output: "[1, 2, 3]"
      explanation: The array is already sorted in ascending order.
  constraints:
    - 1 <= nums.length <= 100
    - -1000 <= nums[i] <= 1000
constraint_quiz:
  prompt: "Given N <= 100 package weights, what time complexity does standard nested Bubble Sort achieve in the worst case?"
  options:
    - "O(n^2) time with O(1) auxiliary space"
    - "O(n log n) time with O(n) auxiliary space"
    - "O(n) time with O(n) auxiliary space"
    - "O(1) time with O(1) auxiliary space"
  answer: 0
  explanation: "With nested loops comparing adjacent elements for each prefix, the total comparisons are n*(n-1)/2, which is O(n^2)."
pattern_quiz:
  prompt: "Which core mechanism enables Bubble Sort to place the largest unsorted element at the end of the array each pass?"
  options:
    - "Repeated adjacent comparisons and conditional swapping"
    - "Binary search halving on sorted ranges"
    - "Hash map frequency tallying"
    - "Prefix sum difference calculations"
  answer: 0
  explanation: "Comparing adjacent elements nums[j] and nums[j+1] and swapping when nums[j] > nums[j+1] guarantees the maximum value in the active range migrates to the right boundary."
