solution:
  code: |
    class Solution:
        def parse_error_logs(self, raw_lines: list[str]) -> list[dict]:
            def _stream_errors():
                for raw in raw_lines:
                    line = raw.strip()
                    if not line:
                        continue
                    parts = line.split()
                    if len(parts) != 4:
                        continue
                    status = int(parts[1])
                    if 500 <= status <= 599:
                        yield {
                            "status": status,
                            "path": parts[2],
                            "latency": int(parts[3]),
                        }
            return list(_stream_errors())
  explanation: |
    The internal generator `_stream_errors` processes the incoming lines sequentially.
    Empty strings and malformed records are cleanly ignored without raising uncaught exceptions.
    Matching 5xx records are yielded lazily, decoupling the parsing mechanics from the downstream
    consumption.
  time: O(N) — each line is scanned and split once
  space: O(K) where K is the number of 5xx errors returned

pitch_script: |
  **(Clarify)** "We need to parse incoming log records, filter for 5xx server errors, and return structured dictionaries with status, path, and latency."

  **(Basement Insight)** "When parsing large logs in Python, naive operations like `file.readlines()` allocate all records into a single gigantic list on the heap, triggering an OOM crash. By utilizing generators and `yield`, each record is evaluated lazily in O(1) auxiliary memory."

  **(Solution)** "We build a generator pipeline that cleans whitespace, skips non-conforming lines, checks `500 <= status <= 599`, and yields the parsed dictionary. In production, this generator can feed directly into a streaming Kafka publisher or SQLite batch insert."

  **(Complexity)** "Time complexity is O(N) across N lines. Auxiliary memory is O(1) for the generator pipeline itself."

