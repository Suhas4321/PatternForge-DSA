slug: agent-tool-calling-loop
lc: 9632
citadel_id: ai_resume
brick_layer: 5
runner_type: python_practical
concept:
  problem_it_solves: How do AI agents interact with external APIs, search engines, and calculators autonomously without freezing
    in infinite loops? The ReAct (Reason + Act) loop executes iterative cycles of Thought -> Tool Call -> Observation -> Answer.
    A hard max-steps guard is essential in production to halt runaway loops when the model repeats queries.
  brute_force: Unconstrained while True loops that call external APIs continuously until token budgets or cloud billing thresholds
    collapse.
  brute_force_complexity: Unbounded O(infinity) API invocations during reasoning failures.
  key_insight: Instrumenting each iteration step with an execution trace and bounding execution with a max-steps guard ensures
    deterministic termination and full observability.
  real_world: OpenAI Function Calling loops, LangChain ReAct agents, and Anthropic Tool Use SDK.
statement:
  clean: "Implement an agentic tool-calling loop with a max-steps guard:\n`execute_tool_loop(self, user_query: str, mock_llm_steps:\
    \ list[dict], max_steps: int = 5) -> dict`.\n\nInputs:\n- `user_query`: initial user prompt string\n- `mock_llm_steps`:\
    \ list of decision dicts emitted by the model at each reasoning step:\n  - Tool Call: `{'type': 'tool', 'tool_name': 'calculator'\
    \ | 'search', 'tool_arg': '...'}`\n  - Final Answer: `{'type': 'finish', 'answer': '...'}`\n- `max_steps`: maximum allowable\
    \ execution steps (`max_steps >= 1`)\n\nBuilt-in Tool Handlers:\n- `'calculator'`: If `tool_arg == '12 * 8'` returns `'96'`.\
    \ If `tool_arg == '100 - 45'` returns `'55'`. Otherwise returns string length `str(len(tool_arg))`.\n- `'search'`: If\
    \ `'order_status'` in `tool_arg`, returns `'Shipped: arriving tomorrow'`. If `'inventory'` in `tool_arg`, returns `'In\
    \ Stock (14 units)'`. Otherwise returns `'No results found'`.\n\nExecution Logic:\n1. Maintain `trace`: list of step logs:\
    \ `{'step': step_idx, 'action': action_dict, 'observation': obs_str}`.\n2. Iterate through `mock_llm_steps` up to `max_steps`:\n\
    \   - If `action['type'] == 'finish'`: record step with `observation: None`, set `status = 'completed'`, and return immediately.\n\
    \   - If `action['type'] == 'tool'`: dispatch tool to get `observation`, append to `trace`, and proceed.\n3. If loop finishes\
    \ without reaching a `'finish'` action or hits `max_steps`:\n   set `status = 'max_steps_exceeded'` and `final_answer\
    \ = None`.\n\nReturn dict:\n`{'status': status, 'final_answer': final_answer, 'steps_executed': step_idx, 'trace': trace}`."
  oa_story: '**Drizz Mobile AI — Autonomous App Interaction Loop**


    Drizz''s mobile testing agent translates natural language user stories into UI actions (tap, type, swipe) by inspecting
    device XML hierarchies. During automated regression runs on e-commerce apps, ambiguous search bars caused the agent to
    repeatedly trigger inventory queries without reaching the checkout assertion.


    The platform architect mandated that all agent tool runners enforce a deterministic tool-calling loop with a max-steps
    guard and structured execution telemetry. Implement this loop engine.'
  trigger_keywords:
  - tool-calling loop with a max-steps guard
  - mock_llm_steps
  - steps_executed
  examples:
  - input: 'user_query = ''What is 12 * 8?'', mock_llm_steps = [{''type'': ''tool'', ''tool_name'': ''calculator'', ''tool_arg'':
      ''12 * 8''}, {''type'': ''finish'', ''answer'': ''The answer is 96.''}], max_steps = 5'
    output: '{''status'': ''completed'', ''final_answer'': ''The answer is 96.'', ''steps_executed'': 2, ''trace'': [{''step'':
      1, ''action'': {''type'': ''tool'', ''tool_name'': ''calculator'', ''tool_arg'': ''12 * 8''}, ''observation'': ''96''},
      {''step'': 2, ''action'': {''type'': ''finish'', ''answer'': ''The answer is 96.''}, ''observation'': None}]}'
    explanation: Calculates 12 * 8 on step 1 and finishes on step 2 with status completed.
  constraints:
  - 1 <= max_steps <= 20
  - 0 <= len(mock_llm_steps) <= 50
constraint_quiz:
  prompt: What primary vulnerability does a max-steps guard mitigate in LLM tool execution loops?
  options:
  - Runaway recursion and infinite API cost consumption when the model hallucinates repeating tool calls
  - Python syntax errors in user prompts
  - Operating system thread deadlocks
  - Buffer overflows in the database driver
  answer: 0
  explanation: If a tool's observation does not satisfy the model, the model may repeatedly emit identical tool calls. The
    max_steps guard forcibly terminates execution before costs escalate.
pattern_quiz:
  prompt: What are the core stages of the ReAct agent design pattern?
  options:
  - Thought (reasoning), Action (tool call), and Observation (environment feedback)
  - Compile, Link, and Execute
  - Map, Shuffle, and Reduce
  - Prepare, Commit, and Rollback
  answer: 0
  explanation: ReAct stands for Reason + Act, alternating internal chain-of-thought generation with external environment observations.
