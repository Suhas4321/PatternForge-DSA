slug: subarray-sum-equals-k
lc: 560

concept:
  problem_it_solves: >-
    "How many contiguous stretches add up to exactly k?" Every subarray sum is the
    difference of two prefix sums, so the question becomes "how many earlier prefixes equal
    my current prefix minus k?". A hash map of prefix-sum counts answers that in O(1) per
    index.
  brute_force: >-
    Fix every start i, extend the end j one step at a time keeping a running sum, and count
    the times it equals k. It wastes work because the sum of nums[i..j] for every new start
    i re-adds the same elements that earlier starts already added together.
  brute_force_complexity: >-
    O(N²) time, O(1) space — 2 × 10⁴ elements means ~2 × 10⁸ subarray sums (O(N³) if you
    re-sum each subarray from scratch).
  key_insight: >-
    sum(nums[i+1..j]) = prefix[j] − prefix[i]. So at each j, instead of looking back over
    every start, ask "how many earlier prefixes equal prefix[j] − k?". It is Two Sum's
    complement lookup applied to prefix sums, with counts instead of indices, and the map
    is seeded with {0: 1} for the empty prefix so subarrays starting at index 0 are counted.
  real_world: >-
    Analytics stores (ClickHouse, Druid) and time-series databases keep cumulative counters
    so any range total is one subtraction. Fintech ledgers (Razorpay settlements, UPI
    reconciliation) use running balances the same way to find stretches of transactions that
    net to an exact amount, and fraud teams count windows where net flow hits a suspicious
    value.

statement:
  clean: |
    Given an array of integers `nums` and an integer `k`, return the
    **total number of subarrays** whose **sum equals k**.

    A subarray is a **contiguous** non-empty sequence of elements within the array. The
    array may contain **negative** numbers and zeros.
  oa_story: |
    **LedgerLeaf Fintech — OA Round 2**

    LedgerLeaf runs the books for thousands of kirana stores and cafes across Bengaluru.
    Every day, a merchant's account records one net cash-flow number: positive on days when
    UPI collections beat payouts, negative on days with big refunds or supplier payments,
    zero on holidays. The days are stored in date order.

    The audit team flags a merchant when some unbroken run of days (at least one day long)
    nets to exactly `k` rupees, because that matches a known loan-repayment amount. Given
    the list of daily net flows and `k`, return how many different runs of consecutive days
    net to exactly `k`. Some merchants have 2 × 10⁴ days of history and the audit job must
    finish in a single pass.
  trigger_keywords: ["total number of subarrays", "sum equals k", "contiguous", "negative"]
  examples:
    - input: "nums = [1,1,1], k = 2"
      output: "2"
      explanation: "[1,1] starting at index 0 and [1,1] starting at index 1."
    - input: "nums = [1,2,3], k = 3"
      output: "2"
      explanation: "[1,2] and [3]."
    - input: "nums = [1,-1,0], k = 0"
      output: "3"
      explanation: "[1,-1], [0] and [1,-1,0] all sum to 0."
  constraints:
    - "1 <= nums.length <= 2 * 10^4"
    - "-1000 <= nums[i] <= 1000"
    - "-10^7 <= k <= 10^7"

constraint_quiz:
  prompt: >-
    N can be 2 × 10⁴ and values can be negative. What time complexity should you aim for?
  options: ["O(N³)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 3
  explanation: >-
    O(N³) re-sums every subarray: ~10¹² steps. O(N²) with a running sum is ~2 × 10⁸, which
    is borderline at best in Python and will be rejected in an interview. There is no
    sorting step that helps, since sorting destroys contiguity, so O(N log N) isn't a natural
    target. One pass with a prefix-sum count map is O(N).

pattern_quiz:
  prompt: >-
    Count contiguous subarrays with sum exactly k, where elements can be negative. Which
    pattern fits?
  options:
    - "Sliding window that shrinks when the sum exceeds k"
    - "Prefix sums + hash map of prefix-sum counts"
    - "Sort and use two pointers"
    - "Binary search on the subarray length"
  answer: 1
  explanation: >-
    A sliding window only works when adding an element always grows the sum and removing
    one always shrinks it, i.e. all values non-negative. With negatives, a window whose sum
    is too big might still reach k after adding a negative, so you can't decide when to
    shrink. Sorting breaks contiguity, and the sum isn't monotonic in length. "Sum equals k"
    on a contiguous range with negatives is the prefix-sum + complement-count trigger.

