slug: bounded-semaphore-simulator
lc: 9421
citadel_id: os_concurrency
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How do distributed pools prevent runaway resource consumption without dropping connections? A counting
    semaphore maintains a pool of permits. When permits reach zero, callers wait in a queue until a permit is released. A
    *bounded* semaphore prevents bugs where calling release() excessively inflates the permit count beyond initial capacity.
  brute_force: Spawning unbounded threads or connections, causing socket exhaustion and database OOM crashes.
  brute_force_complexity: O(1) allocation that crashes servers under sudden traffic spikes.
  key_insight: A bounded semaphore simulation maintains `available_permits <= capacity`, a FIFO queue of waiting threads,
    and counts overflow errors when release exceeds capacity.
  real_world: PostgreSQL connection pooling in PgBouncer, rate limiters, and threadpool worker dispatchers.
statement:
  clean: "Implement a bounded semaphore simulation for resource permit management:\n`simulate_bounded_semaphore(capacity:\
    \ int, operations: list[list[str]]) -> dict`.\n\nEach operation is a list `[thread_id, action]` where `action` is either\
    \ `\"ACQUIRE\"` or `\"RELEASE\"`.\n\nRules:\n1. `available_permits` is initially `capacity`.\n2. `granted` is a list of\
    \ thread IDs currently holding permits.\n3. `waiting` is a FIFO queue of thread IDs waiting for permits.\n4. When `action\
    \ == \"ACQUIRE\"`:\n   - If `available_permits > 0`: decrement `available_permits`, append `thread_id` to `granted`.\n\
    \   - If `available_permits == 0`: append `thread_id` to `waiting`.\n5. When `action == \"RELEASE\"`:\n   - If `available_permits\
    \ >= capacity` and `len(waiting) == 0`: increment `overflow_errors` (cannot release beyond capacity).\n   - Otherwise:\n\
    \     - If `thread_id in granted`: remove `thread_id` from `granted`.\n     - If `waiting` is not empty: pop the first\
    \ thread from `waiting` and append to `granted`.\n     - If `waiting` is empty: increment `available_permits`.\n\nReturn\
    \ a dictionary containing:\n- `\"available_permits\"`: `int`\n- `\"granted\"`: `list[str]`\n- `\"waiting\"`: `list[str]`\n\
    - `\"overflow_errors\"`: `int`"
  oa_story: '**BharatPay Database Connection Pool — Permit Leak Post-Mortem**


    During UPI festive payments, BharatPay''s payment gateway experienced microservice latency spikes. An engineer discovered
    that buggy error-recovery code was calling `semaphore.release()` in a finally block even when the connection was never
    acquired, leaking permits.


    Implement this bounded semaphore simulator to enforce permit bounds and catch release overflow bugs in connection pools.'
  trigger_keywords:
  - bounded semaphore simulation
  - permit management
  - available_permits
  examples:
  - input: capacity = 2, operations = [["T1", "ACQUIRE"], ["T2", "ACQUIRE"], ["T3", "ACQUIRE"], ["T1", "RELEASE"]]
    output: '{"available_permits": 0, "granted": ["T2", "T3"], "waiting": [], "overflow_errors": 0}'
    explanation: T1 releases its permit, which is immediately handed over to waiting thread T3.
  - input: capacity = 1, operations = [["T1", "RELEASE"]]
    output: '{"available_permits": 1, "granted": [], "waiting": [], "overflow_errors": 1}'
    explanation: Releasing when permits already equal capacity triggers an overflow error.
  constraints:
  - 1 <= capacity <= 100
  - 0 <= len(operations) <= 500
  - Actions are strictly 'ACQUIRE' or 'RELEASE'
