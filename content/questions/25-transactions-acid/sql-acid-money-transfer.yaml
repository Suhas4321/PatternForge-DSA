hints:
- Use `(SELECT balance FROM Accounts WHERE id = 1) >= 200` to test if Account 1 has sufficient funds.
- In the `balance` expression, wrap the id checks inside a condition that tests the sender balance.
- '| # Pseudocode Blueprint

  | SELECT id, owner,

  |   CASE WHEN sender_balance >= 200 THEN

  |       CASE WHEN id = 1 THEN balance - 200

  |            WHEN id = 2 THEN balance + 200

  |            ELSE balance END

  |   ELSE balance END AS balance,

  |   CASE WHEN sender_balance >= 200 THEN ''COMMITTED'' ELSE ''ROLLEDBACK'' END AS status

  | FROM Accounts ORDER BY id;'
solution:
  code: "SELECT\n    id,\n    owner,\n    CASE\n        WHEN (SELECT balance FROM Accounts WHERE id = 1) >= 200 THEN\n   \
    \         CASE\n                WHEN id = 1 THEN balance - 200\n                WHEN id = 2 THEN balance + 200\n     \
    \           ELSE balance\n            END\n        ELSE balance\n    END AS balance,\n    CASE\n        WHEN (SELECT balance\
    \ FROM Accounts WHERE id = 1) >= 200 THEN 'COMMITTED'\n        ELSE 'ROLLEDBACK'\n    END AS status\nFROM Accounts\nORDER\
    \ BY id;\n"
  explanation: 'The query checks the precondition: Account 1 must have at least 200 units. If true, Account 1 is decremented
    by 200 and Account 2 is incremented by 200, outputting ''COMMITTED''. If Account 1 has less than 200, balances remain
    untouched and status reports ''ROLLEDBACK'', simulating atomic all-or-nothing execution.'
  time: O(N) single scan of Accounts table
  space: O(1) memory overhead
pitch_script: '**(Clarify)** "We need to simulate an atomic bank transfer of 200 units from Account 1 to Account 2, committing
  if the sender has sufficient funds, or rolling back without mutating balances if funds are insufficient."


  **(Brute force)** "Executing separate UPDATE statements without an atomic check risks negative balances or orphaned debits
  if a crash occurs between statements."


  **(Trigger)** "Simulating all-or-nothing transfer preconditions with a status outcome signals ACID atomicity modeling."


  **(Optimal)** "We evaluate `(SELECT balance FROM Accounts WHERE id = 1) >= 200`. In the balance column, if sufficient funds
  exist, we subtract 200 from id 1 and add 200 to id 2. Otherwise, we leave the balance unchanged. The status column similarly
  reports COMMITTED or ROLLEDBACK."


  **(Complexity)** "Executes in O(N) time with O(1) space." '
