slug: lowest-common-ancestor-of-a-binary-search-tree
lc: 235

concept:
  problem_it_solves: >-
    "Where do the paths to two nodes stop being the same path?" Walking down from the root
    towards p and towards q, both walks agree for a while and then part ways. The node where
    they split is the lowest common ancestor. In a binary search tree the values tell you which
    way each walk goes, so you can find that split point without searching the tree at all.
  brute_force: >-
    Ignore the ordering and treat it as any binary tree: DFS to find the root-to-p path, DFS
    again for the root-to-q path, then walk both paths together and return the last node they
    share. It's correct, but each DFS may explore the whole tree to find a node that the BST
    ordering could have led you to directly, and it stores two full paths.
  brute_force_complexity: >-
    O(N) time, O(N) space — 10⁵ nodes visited, when a balanced BST needs only about 17 steps.
  key_insight: >-
    At any node, compare both targets with node.val. If both are smaller, both live in the left
    subtree, so the LCA is there too: go left. If both are larger, go right. Otherwise they are
    on different sides (or one of them *is* this node), so this is the first node whose subtree
    contains both: it is the LCA. The answer is simply the first node on the root's path whose
    value lies between p.val and q.val, inclusive. One walk down, no recursion, no extra memory.
  real_world: >-
    IP routers store prefixes in binary tries keyed by address bits, and the lowest common
    ancestor of two addresses there is their longest common prefix, found by walking down until
    the two keys disagree, exactly this "same side or split" loop. Org-chart tools find the
    nearest common manager of two employees, and file systems the closest common directory of
    two paths, with the same idea.

statement:
  clean: |
    Given a **binary search tree** (BST) and two nodes `p` and `q` in it, return their
    **lowest common ancestor** (LCA).

    The lowest common ancestor of `p` and `q` is the lowest node in the tree that has both `p`
    and `q` as **descendants**, where a node is allowed to be a descendant of itself. All
    values in the tree are unique, `p != q`, and both `p` and `q` exist in the tree.

    In a BST, every value in a node's left subtree is smaller than the node's value, and every
    value in its right subtree is larger.
  oa_story: |
    **PincodeTree Logistics — OA Round 1**

    PincodeTree runs the parcel sorting network for a Bengaluru e-commerce marketplace. Every
    sorting hub is identified by a unique numeric code. The network is designed so routing
    never needs a lookup table: each hub forwards parcels to at most two downstream hubs, a
    "low" hub and a "high" hub, and every hub reachable through a hub's low line has a smaller
    code than that hub, while every hub reachable through its high line has a larger code. The
    main hub at Hoskote sits at the top.

    Two customers in different areas have ordered from the same seller, and operations wants
    to consolidate both parcels at a single hub before they split up. Given the network and two
    distinct hubs `p` and `q` that both exist in it, return the deepest hub that sits on the
    route from the main hub to `p` and also on the route to `q`. A hub on its own route counts,
    so if `p` lies downstream of `q`, the answer is `q`. The network can have up to 100,000
    hubs and is not guaranteed to be balanced.
  trigger_keywords: ["binary search tree", "lowest common ancestor", "descendants"]
  examples:
    - input: "root = [6,2,8,0,4,7,9,null,null,3,5], p = 2, q = 8"
      output: "6"
      explanation: "2 < 6 < 8: the paths to 2 and 8 split at the root."
    - input: "root = [6,2,8,0,4,7,9,null,null,3,5], p = 2, q = 4"
      output: "2"
      explanation: "4 is in 2's subtree, and a node is a descendant of itself, so the LCA is 2."
    - input: "root = [2,1], p = 2, q = 1"
      output: "2"
  constraints:
    - "The number of nodes in the tree is in the range [2, 10^5]"
    - "-10^9 <= Node.val <= 10^9"
    - "All Node.val are unique."
    - "p != q"
    - "p and q will exist in the BST."

constraint_quiz:
  prompt: >-
    The BST has up to 10⁵ nodes and is not guaranteed to be balanced. With H the height of the
    tree, what time complexity is optimal?
  options:
    - "O(N²) — compare every pair of ancestors"
    - "O(N) — DFS for both paths"
    - "O(H) — one walk down from the root"
    - "O(1) — the answer is always the root"
  answer: 2
  explanation: >-
    Comparing ancestor lists pairwise is wasteful even for a generic tree. Two DFS paths are
    O(N) and would pass, but they ignore the BST ordering entirely. The root is only the answer
    when p and q are on opposite sides of it. Using the ordering, each step goes down one
    level, so the walk is O(H): about log₂(10⁵) ≈ 17 steps on a balanced tree, and O(N) only in
    the worst case of a chain, where no method can do better than walking that chain.

pattern_quiz:
  prompt: >-
    You need the deepest node that is an ancestor of both p and q, and the tree is a BST.
    Which approach fits best?
  options:
    - "Level-order BFS until both nodes are found"
    - "Walk down using the BST ordering: both smaller go left, both larger go right, else stop"
    - "In-order traversal, then binary search the sorted list"
    - "Store parent pointers for every node, then intersect the ancestor sets"
  answer: 1
  explanation: >-
    "Binary search tree" is the signal to use the ordering. At each node the two values either
    both point the same way (the LCA is further down that side) or they disagree (this node is
    the split point). BFS, parent maps and ancestor sets all work on any tree, but they cost
    O(N) time and space. In-order gives sorted values but loses the ancestor structure you need.

