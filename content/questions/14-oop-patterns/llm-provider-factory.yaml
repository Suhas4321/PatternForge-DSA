concept:
  problem_it_solves: >-
    "Why does creating a new API client or database pool connection on every function call exhaust file descriptors and slow down latency?"
    Initializing HTTP connection pools, TLS sessions, and auth headers is expensive (often 100ms+ per handshake).
    The Factory pattern paired with Singleton instance caching guarantees that client instances are lazily created once and reused.
  brute_force: >-
    Calling `client = OpenAIClient(api_key=...)` inside every individual request handler.
    Under concurrent load, creating thousands of redundant client sessions exhausts sockets and triggers connection pool exhaustion.
  brute_force_complexity: O(1) runtime per request, but high memory churn and socket leakage.
  key_insight: >-
    A Factory class encapsulates object creation behind a static or class method `get_client(provider_name)`.
    By maintaining an internal cache (`_instances = {}`), subsequent requests for the same provider retrieve the pre-warmed
    singleton instance in O(1) time without rebuilding TCP connection pools.
  real_world: >-
    Database connection pooling (SQLAlchemy engine singleton), Redis client reuse, and Drizz's multi-threaded LLM provider manager.

statement:
  clean: |
    Implement a client instantiation engine using the factory pattern:
    `dispatch_prompts(prompts: list[dict]) -> list[str]`.
    
    Each item in `prompts` is a dictionary:
    `{"provider": "openai" | "anthropic", "prompt": str}`.
    
    Architecture requirements:
    1. Define client classes:
       - `MockOpenAIClient`: implements method `generate(self, prompt: str) -> str`, returning `f"OpenAI: {prompt}"`.
       - `MockAnthropicClient`: implements method `generate(self, prompt: str) -> str`, returning `f"Claude: {prompt}"`.
    2. Define `LLMClientFactory`:
       - Maintains a class-level cache `_instances = {}`.
       - Implements `@classmethod def get_client(cls, provider: str)`:
         - If `provider` already exists in `_instances`, return the cached instance.
         - If `provider == "openai"`, create `MockOpenAIClient()`, store it in `_instances["openai"]`, and return it.
         - If `provider == "anthropic"`, create `MockAnthropicClient()`, store it in `_instances["anthropic"]`, and return it.
         - If `provider` is unknown, raise a `ValueError(f"Unsupported provider: {provider}")`.
    3. In `dispatch_prompts`:
       - Clear `LLMClientFactory._instances` at the start of each run to ensure isolated test runs.
       - For each item in `prompts`, obtain the client from `LLMClientFactory.get_client(...)`.
       - Call `client.generate(item["prompt"])`.
       - Return the list of generated string responses.
  oa_story: |
    **Drizz Multi-LLM Benchmark Runner — Connection Pool Re-use**
    
    During high-concurrency evaluation of 100 mobile UI interaction prompts, workers were instantiating fresh
    HTTP client sessions for every single prompt. Sockets quickly accumulated in `TIME_WAIT` status, triggering
    `OS Error: Too many open files`.
    
    Build a centralized `LLMClientFactory` that caches client singletons and routes generation requests through pre-warmed connections.
  trigger_keywords: ["factory pattern", "dispatch_prompts", "prompts"]
  examples:
    - input: "prompts = [{'provider': 'openai', 'prompt': 'Summarize'}, {'provider': 'anthropic', 'prompt': 'Refactor'}]"
      output: "['OpenAI: Summarize', 'Claude: Refactor']"
      explanation: "Factory creates and reuses OpenAI and Anthropic client instances."
    - input: "prompts = [{'provider': 'openai', 'prompt': 'P1'}, {'provider': 'openai', 'prompt': 'P2'}]"
      output: "['OpenAI: P1', 'OpenAI: P2']"
      explanation: "The exact same cached MockOpenAIClient instance handles both requests."
  constraints:
    - "prompts contains between 0 and 200 items"
    - "provider is either 'openai' or 'anthropic'"

constraint_quiz:
  prompt: >-
    Why is caching client instances inside a Factory advantageous over instantiating new clients per request?
  options:
    - "It eliminates the need for unit tests"
    - "It reuses persistent TCP connection pools and avoids socket exhaustion"
    - "It makes Python run without a GIL"
    - "It converts synchronous code to multi-core"
  answer: 1
  explanation: >-
    Reusing clients preserves HTTP keep-alive connection pools, reducing latency and preventing TCP port exhaustion.

