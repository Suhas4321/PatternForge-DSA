drills:
  - title: Deduplicate dictionaries by key
    skill: setup
    goal: Deduplicate a list of dicts based on a specific key.
    instructions: |
      Return unique dicts based on `"dept_id"`.
    function:
      name: dedupe_departments
      params: [{name: depts}]
    starter_code: |
      class Solution:
          def dedupe_departments(self, depts: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"dept_id": 1, "name": "A"}, {"dept_id": 1, "name": "A"}, {"dept_id": 2, "name": "B"}]], expected: [{"dept_id": 1, "name": "A"}, {"dept_id": 2, "name": "B"}]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def dedupe_departments(self, depts: list[dict]) -> list[dict]:
              seen = set()
              res = []
              for d in depts:
                  if d["dept_id"] not in seen:
                      seen.add(d["dept_id"])
                      res.append(d)
              return res
    hint: "Track seen dept_ids in a set."

  - title: Project subset of keys
    skill: core
    goal: Extract a subset of dictionary keys.
    instructions: |
      From `rec`, return a dict containing only `"emp_id"`, `"emp_name"`, and `"dept_id"`.
    function:
      name: project_employee
      params: [{name: rec}]
    starter_code: |
      class Solution:
          def project_employee(self, rec: dict) -> dict:
              pass
    tests:
      - {args: [{"emp_id": 1, "emp_name": "Alex", "dept_id": 10, "location": "BLR"}], expected: {"emp_id": 1, "emp_name": "Alex", "dept_id": 10}}
    solution: |
      class Solution:
          def project_employee(self, rec: dict) -> dict:
              return {
                  "emp_id": rec["emp_id"],
                  "emp_name": rec["emp_name"],
                  "dept_id": rec["dept_id"],
              }
    hint: "Extract only the 3 employee keys."

  - title: Sort dictionaries by key
    skill: edge
    goal: Sort list of dicts by an integer key.
    instructions: |
      Sort `items` by `emp_id` ascending.
    function:
      name: sort_by_emp_id
      params: [{name: items}]
    starter_code: |
      class Solution:
          def sort_by_emp_id(self, items: list[dict]) -> list[dict]:
              pass
    tests:
      - {args: [[{"emp_id": 20}, {"emp_id": 10}]], expected: [{"emp_id": 10}, {"emp_id": 20}]}
      - {args: [[]], expected: []}
    solution: |
      class Solution:
          def sort_by_emp_id(self, items: list[dict]) -> list[dict]:
              return sorted(items, key=lambda x: x["emp_id"])
    hint: "Use `sorted(items, key=lambda x: x['emp_id'])`."

hints:
  - "If `unnormalized` is empty, return `{'employees': [], 'departments': []}`."
  - "Extract employees with `emp_id`, `emp_name`, and `dept_id`. Sort by `emp_id`."
  - "Extract unique departments mapped by `dept_id`, keeping `dept_name` and `dept_location`. Sort by `dept_id`."

solution:
  code: |
    class Solution:
        def decompose_to_3nf(self, unnormalized: list[dict]) -> dict:
            if not unnormalized:
                return {"employees": [], "departments": []}

            employees = []
            dept_map = {}

            for row in unnormalized:
                emp = {
                    "emp_id": row["emp_id"],
                    "emp_name": row["emp_name"],
                    "dept_id": row["dept_id"],
                }
                employees.append(emp)

                d_id = row["dept_id"]
                if d_id not in dept_map:
                    dept_map[d_id] = {
                        "dept_id": d_id,
                        "dept_name": row["dept_name"],
                        "dept_location": row["dept_location"],
                    }

            sorted_employees = sorted(employees, key=lambda x: x["emp_id"])
            sorted_departments = sorted(dept_map.values(), key=lambda x: x["dept_id"])

            return {
                "employees": sorted_employees,
                "departments": sorted_departments,
            }
  explanation: |
    In the unnormalized table, `dept_name` and `dept_location` depend transitively on `emp_id` via `dept_id`.
    By splitting the data into `employees` (storing the foreign key `dept_id`) and `departments`
    (storing unique department rows), we satisfy 3NF.
    
    This eliminates update, insertion, and deletion anomalies.
  time: O(N log N) dominated by sorting
  space: O(N) for output tables

pitch_script: |
  **(Clarify)** "We need to decompose an unnormalized wide table containing transitive department dependencies into two clean 3NF relational tables: employees and departments."

  **(Basement Insight)** "3NF states that non-key attributes must depend directly on the primary key, not transitively through another non-key attribute. Storing department metadata repeatedly in employee records causes update anomalies and space bloat."

  **(Solution)** "We iterate through the records, mapping each employee to their foreign key `dept_id`. Simultaneously, we deduplicate department rows into a dictionary keyed by `dept_id`. We sort both lists by their respective primary keys."

  **(Complexity)** "Executes in O(N log N) time due to sorting, using O(N) auxiliary space."

