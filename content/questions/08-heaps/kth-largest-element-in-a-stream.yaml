slug: kth-largest-element-in-a-stream
lc: 703

concept:
  problem_it_solves: >-
    "What is the kth largest value right now?", asked again after every new value arrives in a
    stream that only ever grows. Re-sorting the whole stream for each question repeats almost all
    of the previous work. A heap answers it by remembering only the k values that can still
    matter, and by keeping the weakest of them where you can read it instantly.
  brute_force: >-
    Keep every value in a list. On each add, append the new value, sort the list in descending
    order and return index k − 1. The sort re-orders thousands of values whose relative order did
    not change at all, and the list keeps growing even though values below the top k can never
    be the answer again.
  brute_force_complexity: >-
    O(N log N) per add with a re-sort (still O(N) per add with bisect.insort, because the list has
    to shift), O(N) space — 10⁴ adds on a stream that grows to 2 × 10⁴ values means at least ~10⁸
    element moves, and memory grows forever.
  key_insight: >-
    Only the k largest values seen so far can ever be the answer, and the kth largest is the
    *smallest* of those k. So keep exactly those k values in a min-heap: a complete binary tree
    stored in a list where every parent is <= its children (heap[i] <= heap[2i+1] and
    heap[2i+2]). That one rule puts the minimum at heap[0], so peeking is O(1), while push
    (append, then sift up) and pop (move the last item to the root, then sift down) each walk a
    single root-to-leaf path of height log k, so they cost O(log k). On add, push the value; if
    the heap now holds k + 1 values, pop the smallest. Nothing is ever deleted from the stream,
    so the kth largest can only stay the same or grow, which means an evicted value can never
    become the answer again.
  real_world: >-
    Search engines keep the top k results per query this way: Lucene's top-hits collector holds
    a size-k priority queue and rejects any document scoring below its root. Gaming and
    fantasy-sports leaderboards use the same root as the "score needed to enter the top k"
    cutoff, and monitoring agents track the k slowest requests in a fixed-size heap instead of
    storing every latency.

statement:
  clean: |
    Design a class to find the **kth largest element in a stream**. Note that it is the kth
    largest element in the sorted order, **not the kth distinct element**.

    Implement the `KthLargest` class:

    - `KthLargest(int k, int[] nums)` initializes the object with the integer `k` and the
      stream of integers `nums`.
    - `int add(int val)` appends the integer `val` to the stream and returns the element
      representing the kth largest element in the stream.
  oa_story: |
    **LeaderboardLabs — OA Round 1**

    LeaderboardLabs runs fantasy-cricket contests for office leagues across Bengaluru. In a
    contest, only the top `k` teams win prizes, so the app shows a live banner: "score needed to
    reach the prize zone". When the contest page loads, the scores of teams already locked in
    arrive as a list `nums`; after that, a new team's score arrives every time someone in
    Manyata Tech Park submits a team.

    Implement a `KthLargest` class: the constructor receives `k` and the starting scores, and
    `add(val)` records a newly submitted score and returns the current cutoff, which is the
    `k`-th highest score among all scores so far (two teams with equal scores take two separate
    places). A cutoff is only requested once at least `k` scores exist. Popular contests get
    thousands of submissions during a match, and the banner refreshes after every single one.
  trigger_keywords: ["kth largest element in a stream", "not the kth distinct element"]
  examples:
    - input: |
        ["KthLargest","add","add","add","add","add"]
        [[3,[4,5,8,2]],[3],[5],[10],[9],[4]]
      output: "[null,4,5,5,8,8]"
      explanation: "The three largest after adding 3 are [4,5,8], so the answer is 4. Adding 5 gives [5,5,8] → 5. Adding 10 gives [5,8,10] → 5. Adding 9 gives [8,9,10] → 8, and 4 is too small to change anything."
    - input: |
        ["KthLargest","add","add","add","add"]
        [[4,[7,7,7,7,8,3]],[2],[10],[9],[9]]
      output: "[null,7,7,7,8]"
      explanation: "Duplicates count separately: the four largest start as [7,7,7,8]. Only after 10, 9 and 9 arrive does the fourth largest become 8."
  constraints:
    - "0 <= nums.length <= 10^4"
    - "1 <= k <= nums.length + 1"
    - "-10^4 <= nums[i] <= 10^4"
    - "-10^4 <= val <= 10^4"
    - "At most 10^4 calls will be made to add."
    - "It is guaranteed that there will be at least k elements in the array when you search for the kth element."

constraint_quiz:
  prompt: >-
    The stream starts with up to 10⁴ values and add is called up to 10⁴ times, each call needing
    an answer immediately. What should one add cost?
  options: ["O(N log N) — re-sort the stream", "O(N) — insert into a sorted list", "O(log k) — push/pop on a heap of size k", "O(1) — update a single variable"]
  answer: 2
  explanation: >-
    Re-sorting is O(N log N) per add, and over 10⁴ adds on a growing stream that is far more work
    than needed. A sorted list with bisect.insort finds the spot in O(log N) but shifting the list
    is O(N), so it's still ~10⁸ moves overall. A single variable can't work: when a bigger value
    arrives, the new kth largest is the old (k−1)th largest, which you didn't store. A size-k
    min-heap does one push and at most one pop, each O(log k), and reads the answer in O(1).

pattern_quiz:
  prompt: >-
    Values keep arriving and after each one you need the kth largest so far. Which structure
    fits?
  options:
    - "Sort the whole stream on every add"
    - "A max-heap of every value, popping k times per query"
    - "A min-heap that keeps only the k largest values seen so far"
    - "A monotonic stack of decreasing values"
  answer: 2
  explanation: >-
    "Kth largest" plus "stream" is the size-k min-heap trigger. The k largest values are the
    only candidates, and the kth largest is the smallest of them, so a min-heap of exactly those
    k puts the answer at the root. A max-heap of everything has to pop k values (and push them
    back) on every query, O(k log N) each time. Sorting repeats work, and a monotonic stack
    answers "next greater" questions, not order statistics.

