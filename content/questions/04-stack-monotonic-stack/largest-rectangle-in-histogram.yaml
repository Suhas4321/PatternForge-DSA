slug: largest-rectangle-in-histogram
lc: 84

concept:
  problem_it_solves: >-
    "For each bar, how far can it stretch left and right before something shorter blocks it?"
    The best rectangle always uses the full height of its shortest bar, so the problem becomes
    finding, for every bar, its previous smaller and next smaller neighbours. A monotonic
    increasing stack finds both boundaries for every bar in a single pass.
  brute_force: >-
    For every bar i, treat heights[i] as the rectangle's height and expand outwards: walk left
    while bars are at least as tall, walk right while bars are at least as tall, and take
    heights[i] × width. On a flat or nearly flat histogram every bar walks across almost the
    whole array, re-reading the same bars N times.
  brute_force_complexity: >-
    O(N²) time, O(1) extra space — 10⁵ bars of equal height means about 10¹⁰ steps.
  key_insight: >-
    Any rectangle's height is limited by its shortest bar, so the best rectangle is "some bar
    at full height, stretched until a strictly shorter bar on each side". Those blockers are
    the previous smaller and next smaller elements. Keep a stack of indices with increasing
    heights. When bar i is shorter than (or equal to) the top, the top can't stretch any
    further right: i is its right blocker. And the index just beneath it on the stack is its
    left blocker, because everything between them was taller and already popped. So the
    popped bar's rectangle spans from (new top + 1) to (i − 1), and you compute it at the
    moment of popping. Each index is pushed and popped once: O(N).
  real_world: >-
    The same "largest area under a skyline" scan finds the biggest free rectangle when
    packing ads or widgets into a layout grid, and the largest empty region in a bitmap for
    image processing. Capacity planners use it on time series too: the largest block of
    hours × guaranteed load you can sell from a server fleet's capacity graph is exactly
    this histogram problem.

statement:
  clean: |
    Given an array of integers `heights` representing the **histogram's bar height** where
    the **width of each bar is 1**, return the area of the **largest rectangle in the
    histogram**.
  oa_story: |
    **BijliBills — Online Assessment, SDE-1 (Platform)**

    BijliBills sells rooftop-solar battery plans to apartment complexes in Whitefield and
    Sarjapur. For a complex, the analytics service has the guaranteed spare power for each
    hour of a day as a list of non-negative integers (in kW), one value per hour, in order.
    The sales team wants to offer a single "flat block" contract: a continuous run of hours
    during which the complex is promised one constant power level, and that level can never
    exceed the spare power of any hour in the run.

    The value of a contract is power level × number of hours. Write a function that returns
    the largest value any flat block contract can have. The analytics team will run it over
    histories with up to 100,000 hourly readings, so a slow solution will time out.
  trigger_keywords: ["histogram's bar height", "width of each bar is 1", "largest rectangle"]
  examples:
    - input: "heights = [2,1,5,6,2,3]"
      output: "10"
      explanation: >-
        The bars of height 5 and 6 form a rectangle of height 5 and width 2, area 10. Nothing
        bigger fits: the height-2 rectangle across bars 2..5 has area 8.
    - input: "heights = [2,4]"
      output: "4"
      explanation: "Either the single bar of height 4, or height 2 across both bars: both give 4."
  constraints:
    - "1 <= heights.length <= 10^5"
    - "0 <= heights[i] <= 10^4"

constraint_quiz:
  prompt: With up to 10⁵ bars, what time complexity should you aim for in an interview?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(N · max height)"]
  answer: 2
  explanation: >-
    Expanding from every bar is O(N²), up to 10¹⁰ steps on a flat histogram, so it times
    out. O(N log N) divide-and-conquer (split at the minimum bar, with a range-minimum
    structure) would pass, but it's harder to write and not what interviewers expect. O(N)
    is achievable with a monotonic stack because each index is pushed and popped once.
    O(N · max height), trying every height level, is up to 10⁹ steps and depends on the
    values instead of the number of bars.

pattern_quiz:
  prompt: >-
    The answer for each bar depends on the nearest strictly shorter bar on its left and on
    its right. Which pattern fits?
  options:
    - "Two pointers moving inwards from both ends, like Container With Most Water"
    - "Monotonic increasing stack of indices (previous / next smaller)"
    - "Sliding window with a running minimum"
    - "Prefix sums of heights"
  answer: 1
  explanation: >-
    "Nearest smaller on each side" is exactly what a monotonic increasing stack answers: when
    a shorter bar pops a taller one, the shorter bar is the popped bar's next smaller, and
    the bar beneath it is its previous smaller. Two pointers work for Container With Most
    Water because only the two end lines matter there; here every bar in between limits the
    height. A sliding window has no rule for when to shrink, and prefix sums measure total
    area, not the rectangle bounded by the shortest bar.

