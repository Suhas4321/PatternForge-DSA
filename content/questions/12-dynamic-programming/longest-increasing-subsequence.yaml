slug: longest-increasing-subsequence
lc: 300

concept:
  problem_it_solves: >-
    "What is the longest chain I can pick, in order, where every pick beats the previous one?"
    The picks don't have to be next to each other, so there are 2ᴺ possible subsequences. But
    the best chain that ends at a given element only depends on the best chains ending at the
    smaller elements before it, so you can compute one number per position and reuse it.
  brute_force: >-
    Try every subsequence: for each element, either take it (if it's bigger than the last
    taken) or skip it, and keep the longest valid chain. The recursion re-solves "best chain
    from position i onward, given the last taken value" again and again, once for every way of
    reaching i with that value.
  brute_force_complexity: O(2ᴺ) time, O(N) recursion depth — 2500 elements means 2²⁵⁰⁰ subsets.
  key_insight: >-
    Anchor the subproblem at its END: dp[i] = length of the longest increasing subsequence
    that ends exactly at index i. Whatever that chain is, the element before nums[i] is some
    nums[j] with j < i and nums[j] < nums[i], and the chain up to it is the best one ending at
    j. So dp[i] = 1 + max(dp[j]) over those j, or 1 if there is none. "Ends at i" is the key
    word: "best in the first i elements" doesn't tell you the last value, so you couldn't
    check whether nums[i] may extend it. The answer is max(dp), because the LIS can end
    anywhere.
  real_world: >-
    Patience diff (git diff --patience) aligns two files by matching lines that appear once in
    each and keeping the longest increasing subsequence of their positions. Merge tools, DNA
    sequence aligners and
    recommendation pipelines that look for the longest "upgrade path" in a user's purchase
    history all use LIS or its close cousin, longest common subsequence.

statement:
  clean: |
    Given an integer array `nums`, return the **length of the longest** **strictly increasing
    subsequence**.

    A **subsequence** is an array that can be derived from another array by deleting some or
    no elements without changing the order of the remaining elements. For example, `[3,6,2,7]`
    is a subsequence of the array `[0,3,1,6,2,2,7]`.

    **Follow up:** Can you come up with an algorithm that runs in `O(n log(n))` time
    complexity?
  oa_story: |
    **StreakStudio Fitness — OA Round 1**

    StreakStudio is a Bengaluru fitness app whose users log one workout score per session.
    The growth team in HSR Layout wants a "progress badge": the longest list of sessions,
    kept in their original order, where each chosen session's score is strictly higher than
    the previous chosen one. Sessions in between can be ignored (a bad day after a late-night
    deploy shouldn't break the badge), but the chosen ones must stay in date order.

    Write a function that takes a user's session scores in order and returns the size of the
    biggest such badge. Users have at most 2,500 sessions and scores range from −10,000 to
    10,000. A tie with an earlier chosen score does not count as progress.
  trigger_keywords: ["length of the longest", "strictly increasing", "subsequence"]
  examples:
    - input: "nums = [10,9,2,5,3,7,101,18]"
      output: "4"
      explanation: "One longest increasing subsequence is [2,3,7,101], so the length is 4."
    - input: "nums = [0,1,0,3,2,3]"
      output: "4"
      explanation: "[0,1,2,3]."
    - input: "nums = [7,7,7,7,7,7,7]"
      output: "1"
      explanation: "Equal values are not strictly increasing."
  constraints:
    - "1 <= nums.length <= 2500"
    - "-10^4 <= nums[i] <= 10^4"

constraint_quiz:
  prompt: >-
    N is at most 2500. What is the slowest time complexity that still comfortably passes, and
    what does the follow-up ask for?
  options:
    - "O(2ᴺ) passes; the follow-up wants O(N²)"
    - "O(N³) passes; the follow-up wants O(N²)"
    - "O(N²) passes; the follow-up wants O(N log N)"
    - "Only O(N) passes"
  answer: 2
  explanation: >-
    2ᴺ subsets is hopeless even for N = 50. O(N³) is about 1.6 × 10¹⁰ steps, far too slow.
    O(N²) is 2500² ≈ 6.25 × 10⁶ simple comparisons, which passes easily, and is the DP to
    write first. The follow-up asks for O(N log N), done with a sorted "tails" list and binary
    search. O(N) is out: comparison-based LIS has a proven Ω(N log N) lower bound.

pattern_quiz:
  prompt: >-
    You need the longest subsequence (not necessarily contiguous) whose values strictly
    increase. Which pattern fits?
  options:
    - "Sliding window over the longest increasing run"
    - "dp[i] = longest increasing subsequence ending at i, looking back over every j < i"
    - "Sort the array and count distinct values"
    - "Two pointers from both ends"
  answer: 1
  explanation: >-
    "Longest subsequence" is a DP trigger: the elements can be far apart, so there is no
    window to slide (a window only finds contiguous runs, which gives 3 instead of 4 on
    [10,9,2,5,3,7,101,18]). Sorting destroys the order the subsequence must respect, and
    counting distinct values ignores it. dp over "ends at i" captures both the order and the
    last value, which is what you need to know to extend a chain.

