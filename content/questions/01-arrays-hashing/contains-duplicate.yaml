slug: contains-duplicate
lc: 217

concept:
  problem_it_solves: >-
    "Has this exact value shown up before?" Without memory, the only way to answer is to
    re-read everything to your left for every element. A hash set remembers every value
    you've already passed, so each "seen it?" question becomes one O(1) membership check.
  brute_force: >-
    Compare every pair (i, j) with two nested loops and return True if nums[i] == nums[j].
    The inner loop re-reads the same values over and over, even though the outer loop has
    already looked at all of them once and could simply have remembered them.
  brute_force_complexity: O(N²) time, O(1) space — 10⁵ elements means ~5 × 10⁹ pair checks.
  key_insight: >-
    You don't need to know *which* pair matches, only whether the current value is already
    in your memory. Keep a set of everything to your left, check membership before adding,
    and the first repeat reveals itself the moment it arrives, so you can stop right there.
  real_world: >-
    Idempotency checks in payment APIs (Razorpay and Stripe use idempotency keys) reject a
    request whose key was already processed. Kafka consumers dedupe message IDs, and web
    crawlers keep a "visited URL" set so they never fetch the same page twice.

statement:
  clean: |
    Given an integer array `nums`, return `true` if **any value appears at least twice** in
    the array, and return `false` if **every element is distinct**.
  oa_story: |
    **TicketDhaba Events — OA Round 1**

    TicketDhaba sells passes for weekend concerts at a Bengaluru venue near Manyata Tech
    Park. Every pass carries a numeric pass code that the gate scanners read as fans walk
    in. Last Saturday a printing glitch at the vendor may have stamped the same code onto
    more than one pass, and security wants to know before gates open on Sunday.

    You are given the list of pass codes printed for the event. Write a function that
    returns `true` if the printer reused any code, so the batch must be pulled, and `false`
    if every pass is safe to hand out.
  trigger_keywords: ["appears at least twice", "every element is distinct"]
  examples:
    - input: "nums = [1,2,3,1]"
      output: "true"
      explanation: "The value 1 appears at index 0 and again at index 3."
    - input: "nums = [1,2,3,4]"
      output: "false"
      explanation: "All four values are different."
    - input: "nums = [1,1,1,3,3,4,3,2,4,2]"
      output: "true"
  constraints:
    - "1 <= nums.length <= 10^5"
    - "-10^9 <= nums[i] <= 10^9"

constraint_quiz:
  prompt: >-
    N can be 10⁵ and values range up to ±10⁹. What time complexity should you aim for?
  options: ["O(N²)", "O(N log N)", "O(N)", "O(1)"]
  answer: 2
  explanation: >-
    O(N²) is ~5 × 10⁹ pair checks, far beyond the ~10⁸ simple operations a judge allows per
    second. Sorting and comparing neighbours is O(N log N) and does pass, but it's not the
    best and it reorders the input. A hash set gives O(N) average. O(1) is impossible: if
    you skip even one element, it could be the duplicate.

pattern_quiz:
  prompt: You need to know whether any value repeats in an unsorted array. Which pattern fits?
  options:
    - "Two pointers from both ends"
    - "Hash set of values seen so far"
    - "Sliding window of fixed size"
    - "Prefix sums"
  answer: 1
  explanation: >-
    "Appears at least twice" is the textbook "seen before" trigger. Two pointers needs sorted
    data and solves pair-sum questions, a fixed window only helps when duplicates must be
    close together (that's the twist, #219), and prefix sums answer range-sum questions. A
    set answers "is this value already in my memory?" in O(1).

