drills:
  - title: Check first element presence
    skill: setup
    goal: Verify that the first column exists in the set.
    instructions: |
      Return `True` if `cols[0]` is in `where_set`, assuming `cols` is non-empty.
    function:
      name: has_first_col
      params: [{name: cols}, {name: where_set}]
    starter_code: |
      class Solution:
          def has_first_col(self, cols: list[str], where_set: list[str]) -> bool:
              pass
    tests:
      - {args: [["a", "b"], ["a"]], expected: true}
      - {args: [["a", "b"], ["b"]], expected: false}
    solution: |
      class Solution:
          def has_first_col(self, cols: list[str], where_set: list[str]) -> bool:
              return cols[0] in set(where_set)
    hint: "Check `cols[0] in set(where_set)`."

  - title: Case-insensitive column matching
    skill: core
    goal: Normalize column names before comparison.
    instructions: |
      Check if `target` matches any column in `cols` ignoring case.
    function:
      name: col_match_nocase
      params: [{name: target}, {name: cols}]
    starter_code: |
      class Solution:
          def col_match_nocase(self, target: str, cols: list[str]) -> bool:
              pass
    tests:
      - {args: ["Dept_Id", ["dept_id", "salary"]], expected: true}
      - {args: ["age", ["name"]], expected: false}
    solution: |
      class Solution:
          def col_match_nocase(self, target: str, cols: list[str]) -> bool:
              low_cols = {c.lower() for c in cols}
              return target.lower() in low_cols
    hint: "Convert all names to lowercase using `.lower()`."

  - title: Prefix length counter
    skill: edge
    goal: Count how many consecutive leading items match.
    instructions: |
      Count how many items from the start of `seq` are present in `lookup_set`.
    function:
      name: count_leading_matches
      params: [{name: seq}, {name: lookup_set}]
    starter_code: |
      class Solution:
          def count_leading_matches(self, seq: list[str], lookup_set: list[str]) -> int:
              pass
    tests:
      - {args: [["a", "b", "c"], ["a", "b"]], expected: 2}
      - {args: [["a", "b", "c"], ["b", "c"]], expected: 0}
    solution: |
      class Solution:
          def count_leading_matches(self, seq: list[str], lookup_set: list[str]) -> int:
              s = set(lookup_set)
              count = 0
              for item in seq:
                  if item in s:
                      count += 1
                  else:
                      break
              return count
    hint: "Loop over seq; increment count while item in s, break on first miss."

hints:
  - "Check if `not index_cols` or `not where_cols`; if so, return `False`."
  - "Convert `where_cols` to a set for O(1) membership lookups."
  - "Check if `index_cols[0]` is in the set; if it is, the query can use the leftmost prefix of the index."

solution:
  code: |
    class Solution:
        def can_use_composite_index(self, index_cols: list[str], where_cols: list[str]) -> bool:
            if not index_cols or not where_cols:
                return False

            where_set = set(where_cols)
            # The Leftmost Prefix Rule mandates that index_cols[0] must be present
            return index_cols[0] in where_set
  explanation: |
    In relational database B-Trees, an index on `(A, B, C)` sorts first by A.
    If column A is absent from the query's WHERE clause, the database cannot perform an index range scan
    because it cannot traverse from the root node.
    
    Therefore, the query planner can only use the index if `index_cols[0]` is specified in `where_cols`.
  time: O(W) where W is number of WHERE columns
  space: O(W) for the lookup set

pitch_script: |
  **(Clarify)** "We need to verify if a query's WHERE clause satisfies the Leftmost Prefix Rule to enable composite index usage."

  **(Basement Insight)** "A composite index on (A, B, C) physically organizes data ordered by A, then B, then C. Without column A in the query predicate, the database engine cannot prune branches at the B-Tree root, rendering the index unusable and forcing a full table scan."

  **(Solution)** "We verify that neither list is empty, convert `where_cols` to a set, and check if `index_cols[0]` is present. If `index_cols[0]` is missing, we return False; otherwise True."

  **(Complexity)** "Executes in O(W) time where W is WHERE columns, using O(W) space."

twist:
  lc: 9304
  title: Index Skip Scan in PostgreSQL 17 / Oracle
  why: >-
    Some advanced database engines can perform an 'Index Skip Scan' if the leading column has very low cardinality
    (e.g. gender with only 2 values), iterating each value of A and using the index for B.

