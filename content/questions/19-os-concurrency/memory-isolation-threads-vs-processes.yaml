    - a: 1
      b: 2
    expected:
      a: 1
      b: 2
  solution: "import copy\n\nclass Solution:\n    def drill_clone_dict(self, d: dict) -> dict:\n        return copy.deepcopy(d)\n"
  hint: Use copy.deepcopy(d).
- skill: core
  title: Apply mutations to dictionary
  goal: Mutate dictionary keys in-place.
  instructions: For each item in mutations, set `d[item['key']] = item['val']` and return `d`.
  function:
    name: drill_apply_muts
    params:
    - name: d
    - name: muts
  starter_code: "class Solution:\n    def drill_apply_muts(self, d: dict, muts: list[dict]) -> dict:\n        pass\n"
  tests:
  - args:
    - x: 0
    - - key: x
        val: 5
    expected:
      x: 5
  solution: "class Solution:\n    def drill_apply_muts(self, d: dict, muts: list[dict]) -> dict:\n        for m in muts:\n\
    \            d[m[\"key\"]] = m[\"val\"]\n        return d\n"
  hint: Loop through muts and update keys.
- skill: edge
  title: Verify memory isolation
  goal: Check that process copies differ from shared memory.
  instructions: Return True if all copies differ from shared, or if copies is empty.
  function:
    name: drill_check_iso
    params:
    - name: shared
    - name: copies
  starter_code: "class Solution:\n    def drill_check_iso(self, shared: dict, copies: list[dict]) -> bool:\n        pass\n"
  tests:
  - args:
    - a: 1
    - - a: 2
    expected: true
  - args:
    - a: 1
    - - a: 1
    expected: false
  solution: "class Solution:\n    def drill_check_iso(self, shared: dict, copies: list[dict]) -> bool:\n        return all(p\
    \ != shared for p in copies) if copies else True\n"
  hint: Check `all(p != shared for p in copies)`.
hints:
- Use `copy.deepcopy` to replicate OS Copy-on-Write page duplication.
- Apply thread mutations onto one shared dictionary, and process mutations onto separate clones.
- '| # Pseudocode Blueprint

  | thread_shared = deepcopy(initial_state)

  | for m in thread_mutations: thread_shared[m.key] = m.val

  | process_copies = []

  | for m in process_mutations:

  |     p_copy = deepcopy(initial_state)

  |     p_copy[m.key] = m.val

  |     process_copies.append(p_copy)

  | return thread_shared, process_copies, verified'
solution:
  code: "import copy\n\nclass Solution:\n    def simulate_memory_isolation(self, initial_state: dict, thread_mutations: list[dict],\
    \ process_mutations: list[dict]) -> dict:\n        thread_shared = copy.deepcopy(initial_state)\n        for mut in thread_mutations:\n\
    \            thread_shared[mut[\"key\"]] = mut[\"val\"]\n\n        process_copies = []\n        for mut in process_mutations:\n\
    \            p_copy = copy.deepcopy(initial_state)\n            p_copy[mut[\"key\"]] = mut[\"val\"]\n            process_copies.append(p_copy)\n\
    \n        return {\n            \"thread_shared_memory\": thread_shared,\n            \"process_isolated_memories\": process_copies,\n\
    \            \"isolation_verified\": all(p != thread_shared for p in process_copies) if process_copies else True,\n  \
    \      }\n"
  explanation: Threads share heap memory within the same process address space, causing all thread mutations to accumulate
    in the shared dictionary. Processes run in isolated virtual memory address spaces, so mutations apply only to each process's
    private Copy-on-Write page copy.
  time: O(T + P * M) where T is thread mutations, P is process mutations, and M is state size
  space: O(P * M) for the isolated process memory snapshots
pitch_script: '**(Clarify)** "We need to simulate memory mutation behaviors between OS threads that share a heap versus OS
  processes that operate on isolated Copy-on-Write memory."


  **(Brute force)** "Confusing process isolation with thread heap sharing leads to non-deterministic race conditions or lost
  process state in production."


  **(Trigger)** "Simulating thread memory sharing alongside process snapshotting signals virtual address space modeling."


  **(Optimal)** "We initialize a single shared state for threads and apply all thread mutations sequentially. For processes,
  we deep-copy the initial state for each process, applying mutations in isolation. We verify that process states do not bleed
  into the thread heap."


  **(Complexity)** "Executes in O(T + P * M) time and O(P * M) space." '
twist:
  lc: 9406
  title: Context-Switch Cost Model Comparison
  why: 'Process memory isolation comes with a trade-off: process context switches require flushing the TLB and page directory,
    which is much more expensive than a thread context switch.'
