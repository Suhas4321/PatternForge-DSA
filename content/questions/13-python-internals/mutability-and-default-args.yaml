slug: mutability-and-default-args
lc: 9201
citadel_id: python_data
brick_layer: 1
runner_type: python_practical

concept:
  problem_it_solves: >-
    "Why does my function remember items from previous calls?" In Python, function default arguments
    are evaluated once at function definition time on the heap, NOT on each call. If you use a mutable
    default like def log(item, store=[]):, every caller that omits store appends to the exact same heap list.
  brute_force: >-
    Using def log(item, store=[]): and hoping callers always pass an explicit empty list. In production,
    one forgotten argument shares state across different HTTP requests, leaking user data across sessions.
  brute_force_complexity: O(1) invocation, but catastrophic state corruption across calls.
  key_insight: >-
    Use None as the sentinel default: def log(item, store=None):. Inside the function body, check
    if store is None: store = []. This guarantees a freshly allocated list on the heap for every invocation.
  real_world: >-
    Production API request loggers, session stores, and metric accumulators. In FastAPI or Flask, a mutable default
    in a route handler or helper function will share state across unrelated concurrent user requests.

statement:
  clean: |
    Implement a safe telemetry logger method `append_record(record: dict, store: list = None) -> list`
    without suffering from a mutable default argument bug.
    
    A junior engineer previously wrote `def append_record(record, store=[]): store.append(record); return store`,
    which caused a catastrophic state leak where independent user telemetry records merged into the same list.
    
    Your task:
    1. If `store` is `None`, create and return a brand-new list containing a copy of `record`.
    2. If an existing `store` list is provided, append a copy of `record` into it and return `store`.
    3. Ensure records added to `store` are shallow copies (`record.copy()`), so subsequent external modifications
       to the input dictionary do not mutate the history inside `store`.
  oa_story: |
    **Drizz Telemetry Engine — P1 Production Post-Mortem**
    
    During high-throughput mobile app testing, telemetry payloads from device Alpha were mysteriously
    appearing in device Beta's session report. The investigation traced the bug to a helper function that
    used a mutable default argument `logs=[]`. Because Python binds default arguments to a single heap object
    when the module loads, all concurrent test workers shared the same log instance.
    
    Fix this function so every test run remains completely isolated unless an explicit store is provided.
  trigger_keywords: ["mutable default argument", "append_record", "store"]
  examples:
    - input: "record = {'event': 'click', 'id': 1}, store = None"
      output: "[{'event': 'click', 'id': 1}]"
      explanation: "A fresh list is created since store was None."
    - input: "record = {'event': 'swipe'}, store = [{'event': 'tap'}]"
      output: "[{'event': 'tap'}, {'event': 'swipe'}]"
      explanation: "Record is appended to the caller-supplied store."
  constraints:
    - "record is always a valid non-empty dictionary"
    - "store is either None or an existing Python list"

constraint_quiz:
  prompt: >-
    When is a default parameter expression evaluated in Python?
  options:
    - "Every time the function is called"
    - "Exactly once when the function definition is executed"
    - "When the garbage collector runs"
    - "Only when the parameter is omitted"
  answer: 1
  explanation: >-
    Default parameter values are evaluated once when the def statement executes. The resulting object
    is bound to the function's __defaults__ tuple on the heap.

pattern_quiz:
  prompt: What is the Pythonic idiom to avoid mutable default argument bugs?
  options:
    - "Use store = [] in the signature"
    - "Use store = None as the default, and inside the body if store is None: store = []"
    - "Use global store"
    - "Pass a string instead of a list"
  answer: 1
  explanation: >-
    Using None as the default sentinel and allocating store = [] inside the body ensures a fresh object is created
    every time the function is called without an explicit argument.

