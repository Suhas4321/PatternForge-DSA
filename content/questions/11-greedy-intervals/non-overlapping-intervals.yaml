  - {args: [[[1, 2], [1, 2], [1, 2]]], expected: 2, note: duplicates}
  - {args: [[[1, 2], [2, 3]]], expected: 0, note: touching is not overlapping}
  - {args: [[[1, 100], [11, 22], [1, 11], [2, 12]]], expected: 2, note: "keeping the early-starting [1,100] would cost 3 removals"}
  - {args: [[[0, 5]]], expected: 0, note: single interval}
  - {args: [[[1, 10], [2, 3], [4, 5], [6, 7]]], expected: 1, note: one long interval blocks three short ones}
  - {args: [[[-5, -2], [-3, 0], [-1, 2], [1, 4]]], expected: 2, note: negative coordinates}
  - {args: [[[1, 8], [2, 7], [3, 6], [4, 5]]], expected: 3, note: "fully nested: only the innermost stays"}
visualize_test: 3

drills:
  - title: Keep the earliest finisher
    skill: setup
    goal: Sort by end and walk the intervals, keeping each one that starts at or after the last kept end.
    instructions: |
      Return the list of intervals the greedy keeps, in the order it keeps them: sort by end,
      then keep an interval if the kept list is empty or the interval starts at or after the end
      of the last kept one.

      Seeing the kept set makes the greedy concrete. In `[[1,100],[11,22],[1,11],[2,12]]`, end
      order puts `[1,11]` first and `[1,100]` last, so the long interval never gets a chance to
      block anything.
    function:
      name: keptByEnd
      params: [{name: intervals}]
    starter_code: |
      class Solution:
          def keptByEnd(self, intervals: List[List[int]]) -> List[List[int]]:
              pass
    tests:
      - {args: [[[1, 2], [2, 3], [3, 4], [1, 3]]], expected: [[1, 2], [2, 3], [3, 4]]}
      - {args: [[[1, 100], [11, 22], [1, 11], [2, 12]]], expected: [[1, 11], [11, 22]]}
      - {args: [[[1, 10], [2, 3], [4, 5], [6, 7]]], expected: [[2, 3], [4, 5], [6, 7]]}
      - {args: [[[1, 2], [1, 2]]], expected: [[1, 2]]}
    solution: |
      class Solution:
          def keptByEnd(self, intervals: List[List[int]]) -> List[List[int]]:
              kept = []
              for start, end in sorted(intervals, key=lambda iv: iv[1]):
                  if not kept or start >= kept[-1][1]:  # touching is allowed
                      kept.append([start, end])
              return kept
    hint: "`sorted(intervals, key=lambda iv: iv[1])`, then compare `start` with `kept[-1][1]`."

  - title: On a clash, drop the one that ends later
    skill: core
    goal: Apply the exchange argument directly while scanning in start order, keeping the smaller end on every clash.
    instructions: |
      Return the minimum number of removals, but this time **sort by start**. Walk the intervals
      keeping `prev_end`, the end of the interval currently kept. When the next interval clashes
      (`start < prev_end`), one of the two must go: remove the one that **ends later**, so set
      `prev_end = min(prev_end, end)`.

      This is the exchange argument in code form: between two clashing intervals, the one that
      ends earlier leaves more room for everything after it. It is also why sorting by end works:
      end order simply makes that choice for you in advance.
    function:
      name: removalsByStart
      params: [{name: intervals}]
    starter_code: |
      class Solution:
          def removalsByStart(self, intervals: List[List[int]]) -> int:
              pass
    tests:
      - {args: [[[1, 2], [2, 3], [3, 4], [1, 3]]], expected: 1}
      - {args: [[[1, 100], [11, 22], [1, 11], [2, 12]]], expected: 2}
      - {args: [[[1, 10], [2, 3], [4, 5], [6, 7]]], expected: 1, note: "min() swaps [1,10] for [2,3]"}
      - {args: [[[1, 2], [1, 2], [1, 2]]], expected: 2}
    solution: |
      class Solution:
          def removalsByStart(self, intervals: List[List[int]]) -> int:
              intervals = sorted(intervals, key=lambda iv: iv[0])
              removed = 0
              prev_end = intervals[0][1]
              for start, end in intervals[1:]:
                  if start < prev_end:  # clash: drop whichever ends later
                      removed += 1
                      prev_end = min(prev_end, end)
                  else:
                      prev_end = end
              return removed
    hint: "On a clash, count a removal and keep `min(prev_end, end)` as the end."

  - title: A sentinel that survives negatives
    skill: edge
    goal: Initialise the last-kept end so that empty input and negative coordinates still work.
    instructions: |
      Return the **maximum number** of non-overlapping intervals you can keep (touching is
      allowed). The input may be empty, and coordinates can be negative.

      A common bug is starting with `prev_end = 0` or `-1`. With `[[-10,-5],[-4,-1]]` every
      start is below 0, so nothing is ever kept and you return 0 instead of 2. Start from
      negative infinity (or from the first interval after sorting) so the first interval is
      always kept. In the full problem the answer is then `len(intervals) - kept`.
    function:
      name: maxNonOverlapping
      params: [{name: intervals}]
    starter_code: |
      class Solution:
          def maxNonOverlapping(self, intervals: List[List[int]]) -> int:
              pass
    tests:
      - {args: [[[-10, -5], [-4, -1]]], expected: 2, note: "prev_end = 0 returns 0"}
      - {args: [[]], expected: 0, note: empty input}
      - {args: [[[1, 2], [2, 3], [3, 4]]], expected: 3, note: touching chain}
      - {args: [[[-3, -1], [-1, 0]]], expected: 2}
      - {args: [[[-5, -2], [-3, 0], [-1, 2], [1, 4]]], expected: 2}
    solution: |
      class Solution:
          def maxNonOverlapping(self, intervals: List[List[int]]) -> int:
              count = 0
              prev_end = float("-inf")  # nothing kept yet, so anything fits
              for start, end in sorted(intervals, key=lambda iv: iv[1]):
                  if start >= prev_end:
                      count += 1
                      prev_end = end
              return count
    hint: "`float('-inf')` is smaller than every coordinate, so the first interval is always kept."

hints:
  - >-
    Minimum removals is N minus the maximum number you can keep. If you could keep only one
    interval first, which one leaves the most room for all the others?
  - >-
    Sort by end. Track the end of the last interval you kept. Each next interval is kept if it
    starts at or after that end (touching is fine); otherwise it clashes and is removed, because
    it ends no earlier than the one you already kept.
  - |
    sort intervals by end
    kept = 1, prev_end = end of first interval
    for each next [start, end]:
        if start >= prev_end:
            kept = kept + 1
            prev_end = end
        (else: it clashes, so it is one of the removals)
    return number of intervals - kept

solution:
  code: |
    class Solution:
        def eraseOverlapIntervals(self, intervals: List[List[int]]) -> int:
            intervals.sort(key=lambda iv: iv[1])  # sort by END: earliest finisher first
            kept = 1
            prev_end = intervals[0][1]  # end of the last interval we kept
            for i in range(1, len(intervals)):
                start, end = intervals[i]
                if start >= prev_end:  # touching is NOT overlapping here
                    kept += 1
                    prev_end = end
            return len(intervals) - kept
  explanation: |
    **Reframe first:** removing the fewest intervals is the same as keeping the most, so the
    answer is `N - kept`.

    **Why sort by end and not by start?** Picture the first interval you keep. The earliest-
    finishing interval is always a safe choice: take any best answer, and replace its first
    interval with the earliest finisher. The finisher ends no later, so it cannot clash with
    anything that answer kept afterwards, and the count is unchanged. So keeping it never hurts.
    After that, the same argument applies to everything starting at or after its end. Sorting by
    start has no such guarantee: an interval that starts first can be enormous, like `[1,100]`,
    and keeping it blocks everything inside it.

    In end order, an interval that clashes with the last kept one also ends no earlier than it,
    so dropping it is always the right call; we never need to revisit a decision. The comparison
    is `start >= prev_end` because intervals that only touch, like `[1,2]` and `[2,3]`, do not
    overlap in this problem. (Balloons, #452, use the opposite rule.)
  time: O(N log N) — the sort dominates; the greedy pass is O(N)
  space: O(1) extra besides the sort (Python's in-place sort can use up to O(N))
  brute_force_code: |
    from itertools import combinations

    class Solution:
        def eraseOverlapIntervals(self, intervals: List[List[int]]) -> int:
            n = len(intervals)
            for size in range(n, 0, -1):  # try to keep as many as possible
                for combo in combinations(intervals, size):
                    ivs = sorted(combo)
                    if all(ivs[k][0] >= ivs[k - 1][1] for k in range(1, size)):
                        return n - size
            return n

pitch_script: |
  **(Clarify)** "So I return how many intervals to remove, not which ones, and intervals that
  only touch, like 1 to 2 and 2 to 3, don't count as overlapping? The input isn't sorted?"

  **(Brute force)** "Minimum removals equals N minus the maximum set I can keep. Brute force tries
  every subset, which is exponential. A DP for the longest chain is O(N²), which is still 10¹⁰
  at 10⁵ intervals."

  **(Trigger)** "Keeping the maximum number of non-overlapping intervals is activity selection,
  and the greedy there is to sort by end time. The earliest-finishing interval leaves the most
  room for everything else. If an optimal answer started with some other interval, I could swap
  in the earliest finisher; it ends no later, so nothing after it breaks, and the count stays
  the same."

  **(Optimal)** "I sort by end, keep the first interval, and track the end of the last kept one.
  For each next interval, if it starts at or after that end, I keep it and move the end
  forward; otherwise it clashes and it's a removal. I return N minus kept. Sorting by start
  would be wrong: an interval like 1 to 100 starts first and would block everything inside it."

  **(Complexity)** "O(N log N) for the sort and O(N) for the pass, with O(1) extra space apart
  from the sort."

twist:
  lc: 646
  title: Maximum Length of Pair Chain
  why: >-
    You now return the number you can keep, not the number to remove, and the chain rule is
    strict: pair [c, d] can follow [a, b] only if b < c, so pairs that touch at a point are NOT
    allowed to sit next to each other. Same sort-by-end greedy and the same exchange argument;
    only the comparison changes from start >= prev_end to start > prev_end, and you return kept
    instead of N − kept.

viz:
  arrays: [intervals]
  pointers: [i]
  watch: [prev_end, kept, start, end]
