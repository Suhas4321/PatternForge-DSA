  - {args: [[0, 0, 0], 0], expected: 6, note: every one of the 6 subarrays sums to 0}
  - {args: [[3, 4, 7, 2, -3, 1, 4, 2], 7], expected: 4, note: "negatives break sliding window"}
  - {args: [[-1, -1, 1], 0], expected: 1, note: all subarray sums are negative or zero}
  - {args: [[1, 2, 1, 2, 1], 3], expected: 4, note: overlapping matches}
visualize_test: 6

drills:
  - title: Compute running prefix sums
    skill: setup
    goal: Walk the array once keeping a running total, and record the prefix sum at every index.
    instructions: |
      Return a list where position `j` holds `nums[0] + nums[1] + ... + nums[j]`.

      Every subarray sum in the full problem is the difference of two of these numbers, so
      you have to be able to produce them in one pass with a single running variable, not by
      calling `sum()` on a slice each time (that would be O(N²)).
    function:
      name: prefixSums
      params: [{name: nums}]
    starter_code: |
      class Solution:
          def prefixSums(self, nums: List[int]) -> List[int]:
              pass
    tests:
      - {args: [[1, 2, 3]], expected: [1, 3, 6]}
      - {args: [[3, -3, 2]], expected: [3, 0, 2]}
      - {args: [[0]], expected: [0]}
      - {args: [[-1, -1, 1]], expected: [-1, -2, -1]}
    solution: |
      class Solution:
          def prefixSums(self, nums: List[int]) -> List[int]:
              prefix = 0
              out = []
              for x in nums:
                  prefix += x
                  out.append(prefix)
              return out
    hint: "Keep one variable `prefix`, add `x` to it, and append it after each step."

  - title: Count pairs with a fixed difference
    skill: core
    goal: Use a count map to count pairs i < j with values[j] − values[i] == k in one pass.
    instructions: |
      Return how many index pairs `i < j` satisfy `values[j] - values[i] == k`.

      This is the heart of the problem: once `values` are prefix sums, each such pair *is* a
      subarray summing to `k`. At each `j`, the number of good partners is how many earlier
      values equal `values[j] - k`, so you need a **count** (not a set, not an index), and
      you must look up before inserting the current value.
    function:
      name: countPairsWithDiff
      params: [{name: values}, {name: k}]
    starter_code: |
      class Solution:
          def countPairsWithDiff(self, values: List[int], k: int) -> int:
              pass
    tests:
      - {args: [[1, 2, 3], 1], expected: 2}
      - {args: [[0, 0, 0], 0], expected: 3}
      - {args: [[5, 3, 8, 3], -2], expected: 2}
      - {args: [[4], 0], expected: 0}
    solution: |
      class Solution:
          def countPairsWithDiff(self, values: List[int], k: int) -> int:
              counts = {}
              total = 0
              for v in values:
                  total += counts.get(v - k, 0)
                  counts[v] = counts.get(v, 0) + 1
              return total
    hint: "Before storing `v`, add `counts.get(v - k, 0)` to the total."

  - title: The subarrays the {0 → 1} seed rescues
    skill: edge
    goal: See exactly which subarrays are lost if the prefix-count map is not seeded with the empty prefix.
    instructions: |
      Return how many prefixes `nums[0..j]` (for `j = 0 .. n-1`) sum to exactly `k`.

      These are precisely the subarrays that **start at index 0**. In the full solution they
      are found when the lookup `prefix - k` equals `0`, i.e. it hits the empty prefix
      before the array. If you forget to seed the map with `{0: 1}`, every one of these is
      silently missed: `[5]` with `k = 5` would return 0 instead of 1.
    function:
      name: seedHits
      params: [{name: nums}, {name: k}]
    starter_code: |
      class Solution:
          def seedHits(self, nums: List[int], k: int) -> int:
              pass
    tests:
      - {args: [[5], 5], expected: 1}
      - {args: [[1, 1, 1], 2], expected: 1}
      - {args: [[2, -2, 2, -2], 0], expected: 2}
      - {args: [[1, 2], 7], expected: 0}
    solution: |
      class Solution:
          def seedHits(self, nums: List[int], k: int) -> int:
              prefix = 0
              hits = 0
              for x in nums:
                  prefix += x
                  if prefix - k == 0:  # the lookup would land on the empty prefix
                      hits += 1
              return hits
    hint: "A prefix sums to `k` exactly when `prefix - k == 0`, the value the seed stands for."

hints:
  - >-
    The sum of nums[i+1..j] can be written using two running totals. Which two? And once you
    write it that way, what does "subarray sum equals k" turn into at each index j?
  - >-
    Keep a running prefix and a map from prefix value → how many times it has appeared. At
    each element: update prefix, add the count of (prefix − k) to the answer, then record
    prefix. What should the map contain before the first element, so a subarray starting at
    index 0 is counted?
  - |
    counts = {0: 1}        # the empty prefix
    prefix = 0, answer = 0
    for each x in nums:
        prefix = prefix + x
        answer = answer + (counts[prefix - k] if present, else 0)
        counts[prefix] = counts[prefix] + 1
    return answer

solution:
  code: |
    class Solution:
        def subarraySum(self, nums: List[int], k: int) -> int:
            prefix_counts = {0: 1}  # prefix sum -> times seen; 0 is the empty prefix
            prefix = 0
            count = 0
            for x in nums:
                prefix += x
                # every earlier prefix equal to prefix - k starts a subarray summing to k
                count += prefix_counts.get(prefix - k, 0)
                prefix_counts[prefix] = prefix_counts.get(prefix, 0) + 1
            return count
  explanation: |
    If `prefix` is the sum of `nums[0..j]`, then a subarray `nums[i+1..j]` sums to `k`
    exactly when an earlier prefix equals `prefix - k`. So at each index we add **how many**
    earlier prefixes had that value: a count, because with zeros and negatives the same
    prefix value can appear many times (`[0, 0, 0]` with `k = 0` has 6 answers).

    Two ordering decisions matter. The map starts as `{0: 1}`, standing for the empty prefix
    before index 0; without it, subarrays that start at index 0 (like `[5]` with `k = 5`)
    are never counted. And we look up **before** recording the current prefix, otherwise
    with `k = 0` every prefix would match itself and count an empty subarray.

    Sliding window fails here because negatives make the window sum non-monotonic: in
    `[3, 4, 7, 2, -3, 1, 4, 2]`, the window `[7, 2]` overshoots 7, yet extending it with
    `-3, 1` brings it back to exactly 7. A window would have shrunk too early.
  time: O(N) — one pass, O(1) average per hash lookup/update
  space: O(N) — up to N + 1 distinct prefix sums in the map
  brute_force_code: |
    class Solution:
        def subarraySum(self, nums: List[int], k: int) -> int:
            count = 0
            for i in range(len(nums)):
                total = 0
                for j in range(i, len(nums)):
                    total += nums[j]
                    if total == k:
                        count += 1
            return count

pitch_script: |
  **(Clarify)** "Subarrays are contiguous and non-empty, I'm counting them rather than
  returning them, and values can be negative or zero, right? Overlapping subarrays each
  count separately?"

  **(Brute force)** "The simple approach fixes every start and extends the end with a
  running sum, counting matches. That's O(N²) time and O(1) space, about 2 × 10⁸ steps at
  N = 2 × 10⁴, which is too slow."

  **(Trigger)** "My first instinct with 'subarray sum' is a sliding window, but negatives
  rule that out, because the sum doesn't grow monotonically as the window grows. Instead,
  any subarray sum is a difference of two prefix sums, so 'sum equals k' becomes 'how many
  earlier prefixes equal my current prefix minus k', which is a hash map lookup, like Two
  Sum but counting."

  **(Optimal)** "I keep a running prefix and a map from prefix value to how many times I've
  seen it, seeded with zero mapped to one for the empty prefix, so subarrays starting at
  index zero are counted. At each element I update the prefix, add the count of prefix
  minus k to the answer, then record the current prefix. Looking up before recording means
  I never count an empty subarray when k is zero."

  **(Complexity)** "That's one pass, O(N) time with average O(1) hash operations, and O(N)
  space for the map in the worst case where every prefix is distinct."

twist:
  lc: 974
  title: Subarray Sums Divisible by K
  why: >-
    Now you count subarrays whose sum is a multiple of k. Two prefixes give such a subarray
    when they have the same remainder mod k, so the map stores counts of prefix % k (still
    seeded with {0: 1}) and you look up the current remainder itself instead of prefix − k.
    In Python % is already non-negative; in Java or C++ you must normalise negative
    remainders with ((p % k) + k) % k.

viz:
  arrays: [nums]
  maps: [prefix_counts]
  watch: [x, prefix, count, k]
