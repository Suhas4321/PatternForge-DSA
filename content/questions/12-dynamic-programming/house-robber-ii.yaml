slug: house-robber-ii
lc: 213

concept:
  problem_it_solves: >-
    "Take-or-skip on a circle." The houses form a ring, so the first and the last house are
    neighbours too. A circle has no natural starting point for a left-to-right DP, and the
    first decision now constrains the last one. The question is how to turn a circular
    constraint back into a straight line you already know how to solve.
  brute_force: >-
    Enumerate every subset of houses, reject any that contains two neighbours on the circle
    (including house 0 with house n − 1), and keep the best sum. It re-checks and re-sums
    overlapping plans over and over, and the number of subsets doubles with every house.
  brute_force_complexity: >-
    O(2ⁿ · N) time, O(1) extra space — 100 houses means about 1.3 × 10³⁰ subsets.
  key_insight: >-
    The circle adds exactly one rule: houses 0 and n − 1 can't both be robbed. So every valid
    plan skips house 0 or skips house n − 1 (or both). If it skips house n − 1, it's a plan
    for the line nums[0..n−2]; if it skips house 0, it's a plan for the line nums[1..n−1].
    Neither line contains both ends, so the circle constraint disappears inside each. Run
    the ordinary House Robber on both lines and take the max. Breaking a cycle by fixing the
    decision about one element is a trick that works for many circular DP problems.
  real_world: >-
    Circular schedules show up wherever time wraps around: a weekly on-call rota where Sunday
    is adjacent to Monday, a 24-hour maintenance window, or round-robin slots in a ring of
    servers (consistent-hashing rings). Schedulers handle the wraparound the same way: fix
    the choice at the seam, solve the resulting straight line, and compare the cases.

statement:
  clean: |
    You are a professional robber planning to rob houses along a street. Each house has a
    certain amount of money stashed. All houses at this place are **arranged in a circle**.
    That means the **first house is the neighbor of the last one**. Meanwhile, adjacent
    houses have a security system connected, and it will automatically contact the police if
    two adjacent houses were broken into on the same night.

    Given an integer array `nums` representing the amount of money of each house, return the
    **maximum amount of money** you can rob tonight **without alerting the police**.
  oa_story: |
    **RingRoad Retail — OA Round 1**

    RingRoad Retail runs a circular food court on the top floor of its Outer Ring Road mall:
    the kiosks stand in a ring around the central atrium, so kiosk 0 is right next to the
    last kiosk. For the Diwali weekend, marketing wants to run a flash sale at some of the
    kiosks, and kiosk `i` is expected to bring in `nums[i]` thousand rupees of extra sales if
    it runs one.

    Two neighbouring kiosks running a flash sale at the same time cause a crowd crush in the
    walkway, so security has banned that, and the ring means the first and last kiosk count
    as neighbours. Given the expected extra sales for each kiosk in ring order (at most 100
    kiosks, each at most 1000), return the largest total extra sales the mall can plan for.
  trigger_keywords: ["arranged in a circle", "first house is the neighbor of the last one", "maximum amount of money"]
  examples:
    - input: "nums = [2,3,2]"
      output: "3"
      explanation: "Houses 0 and 2 (2 + 2) are neighbours on the circle, so the best is house 1 alone."
    - input: "nums = [1,2,3,1]"
      output: "4"
      explanation: "Rob house 0 (1) and house 2 (3): 1 + 3 = 4."
    - input: "nums = [1,2,3]"
      output: "3"
  constraints:
    - "1 <= nums.length <= 100"
    - "0 <= nums[i] <= 1000"

constraint_quiz:
  prompt: >-
    You already have an O(N) House Robber for a line. With up to 100 houses on a circle, what
    should the circular version cost?
  options:
    - "O(N) — two runs of the linear DP"
    - "O(N²) — rerun the linear DP once for every possible starting house"
    - "O(2ⁿ) — the circle breaks DP, so enumerate subsets"
    - "O(N log N) — sort the houses to find a safe place to cut the circle"
  answer: 0
  explanation: >-
    Only one extra rule exists (not both ends), so two linear runs, one without the last
    house and one without the first, cover every valid plan: 2 × O(N) = O(N). Trying all N
    cut points would pass at N = 100 but adds nothing, because those two cases already cover
    every valid plan. Enumeration is 2¹⁰⁰ subsets, and the circle doesn't break DP, it just
    needs a case split. Sorting destroys the ring order that defines who is adjacent.

pattern_quiz:
  prompt: >-
    The houses form a circle, so house 0 and house n − 1 are neighbours. Which approach is
    correct?
  options:
    - "Run the linear robber once; if it used both ends, subtract the smaller end"
    - "Run the linear robber on nums[1:] and on nums[:-1], and take the max"
    - "Run the linear robber on nums and on reversed(nums), and take the max"
    - "Take the richest house, then run the linear robber on the remaining line"
  answer: 1
  explanation: >-
    Every valid plan skips the first or the last house, so the two slices together cover all
    of them, and neither slice contains both ends. Patching a linear answer fails on
    [5, 1, 1, 5]: the line takes 5 + 5, subtracting an end leaves 5, but the real answer is 6
    (5 + 1), because removing a house should let the rest of the plan change. Reversing the
    array gives the same answer as the original, still using both ends. Fixing the richest
    house first is a greedy guess, not a case split that covers every plan.

