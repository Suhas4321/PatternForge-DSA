slug: minimum-number-of-arrows-to-burst-balloons
lc: 452

concept:
  problem_it_solves: >-
    "What is the fewest points that hit every range?" Each arrow is a single point, and it
    covers every range that contains it. Choosing those points greedily, always as far right as
    the earliest-ending unhit range allows, gives the minimum in one pass after sorting by end.
  brute_force: >-
    Only interval endpoints are worth trying as arrow positions, so try every set of 1, 2, 3, …
    endpoints and stop at the first set that hits every balloon. It re-checks the same balloons
    against huge numbers of near-identical arrow sets, and the number of sets grows
    exponentially.
  brute_force_complexity: >-
    Exponential: 2N candidate points give up to 2²ᴺ = 4ᴺ sets, and checking a set of up to N
    arrows against N balloons is O(N²), so O(4ᴺ · N²) time, O(N) space — hopeless beyond a dozen
    or so balloons, and N here is 10⁵.
  key_insight: >-
    Look at the balloon that ends first. Some arrow has to hit it, at a point no further right
    than its end. Sliding that arrow right to exactly its end never loses a balloon: every
    balloon it was hitting starts before the arrow and, because this balloon ends first, ends at
    or after the new spot. So shoot at the end of the earliest-ending balloon, skip every balloon
    that starts at or before that point, and repeat with the next unburst one. Sort by end.
  real_world: >-
    Android's AlarmManager batches inexact alarms: each alarm has a window it may fire in, and
    the OS picks as few wake-up moments as possible that fall inside every window, saving
    battery. Batch-job schedulers consolidate cron jobs with flexible windows the same way, and
    city planners use it to place the fewest checkpoints or sensors that cover every stretch of
    road.

statement:
  clean: |
    Some spherical balloons are taped to a flat wall. The balloons are given as a 2D array
    `points` where `points[i] = [x_start, x_end]` is the horizontal diameter of a balloon.

    An arrow shot straight up from position `x` bursts every balloon with
    `x_start <= x <= x_end`, so balloons that only touch at a point are burst by the same arrow.
    There is no limit to the number of arrows, and an arrow keeps travelling after bursting a
    balloon.

    Return the **minimum number of arrows** that must be shot to **burst all balloons**.
  oa_story: |
    **TirthaTravels — OA Round 1**

    TirthaTravels runs overnight pilgrimage buses from Bengaluru to Tirupati along the highway.
    Every pilgrim group has told the ops desk the stretch of highway it can walk to, as
    `[from, to]` in metres measured from the Hoskote toll plaza (negative values are on the city
    side of the plaza). A group can be picked up at any single stop inside its stretch,
    including the two ends, and the bus has room for everyone.

    The ops desk wants the bus to make as few stops as possible while still picking up every
    group. Two groups whose stretches meet exactly at one point can both be picked up by a
    single stop there. Given the stretches of up to 100,000 groups, return the minimum number of
    stops.
  trigger_keywords: ["minimum number of arrows", "burst all balloons", "x_start <= x <= x_end"]
  examples:
    - input: "points = [[10,16],[2,8],[1,6],[7,12]]"
      output: "2"
      explanation: "An arrow at x = 6 bursts [2,8] and [1,6]; an arrow at x = 12 bursts [10,16] and [7,12]."
    - input: "points = [[1,2],[3,4],[5,6],[7,8]]"
      output: "4"
      explanation: "No two balloons share a point, so each needs its own arrow."
    - input: "points = [[1,2],[2,3],[3,4],[4,5]]"
      output: "2"
      explanation: "An arrow at x = 2 bursts [1,2] and [2,3]; an arrow at x = 4 bursts [3,4] and [4,5]."
  constraints:
    - "1 <= points.length <= 10^5"
    - "points[i].length == 2"
    - "-2^31 <= x_start < x_end <= 2^31 - 1"

constraint_quiz:
  prompt: With up to 10⁵ balloons, what time complexity do you need?
  options: ["O(2ᴺ)", "O(N²)", "O(N log N)", "O(N)"]
  answer: 2
  explanation: >-
    Trying sets of arrow positions is exponential. Checking each balloon against every other
    (for example, re-scanning all balloons for each arrow) is O(N²), about 10¹⁰ steps. Sorting by
    end costs O(N log N) and the greedy pass is O(N), so O(N log N) is the target. O(N) is out
    because the input is unsorted and the greedy needs end order.

pattern_quiz:
  prompt: >-
    You must place the fewest points so that every interval contains at least one of them.
    Which approach is correct?
  options:
    - "Merge overlapping intervals and count the merged blocks"
    - "Sweep line: count the maximum number of intervals overlapping at any point"
    - "Sort by end; shoot at the end of the first unburst balloon, skip all it hits"
    - "Sort by start; shoot at the end of the first balloon, skip all that start before it"
  answer: 2
  explanation: >-
    "Minimum number of points to stab every interval" is the sort-by-end greedy: the end of the
    earliest-ending balloon is the furthest-right spot that still hits it, so it hits as much as
    possible. Merging fails on [[1,2],[2,3],[3,4]]: one block, but it needs 2 arrows. The maximum
    overlap answers a different question (how many rooms or platforms you need): for
    [[1,2],[3,4]] it is 1, yet you need 2 arrows. Sorting by start fails on [[1,10],[2,3],[4,5]]:
    an arrow at 10 misses [2,3] and [4,5] even though they start before 10.

