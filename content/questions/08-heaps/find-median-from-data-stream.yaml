slug: find-median-from-data-stream
lc: 295

concept:
  problem_it_solves: >-
    "What is the middle value of everything I've seen so far?", asked again after every new
    number. The median only depends on the two values that sit at the boundary between the
    lower half and the upper half, so you never need the whole stream in sorted order. Two
    heaps keep exactly that boundary visible: the largest of the lower half and the smallest
    of the upper half.
  brute_force: >-
    Append every number to a list and sort it on every findMedian (or keep it sorted with
    bisect.insort). Sorting re-orders the whole stream each time even though only one number
    arrived since the last query, and insort still shifts up to N elements to make room.
  brute_force_complexity: >-
    O(N log N) per findMedian (sort each time) or O(N) per addNum (sorted insert), O(N)
    space — 5 × 10⁴ calls can mean 2.5 × 10⁴ sorts of 2.5 × 10⁴ numbers (~10¹⁰ comparisons),
    or ~1.25 × 10⁹ element shifts for sorted inserts.
  key_insight: >-
    Split the numbers into a lower half and an upper half. You only ever need the **maximum**
    of the lower half and the **minimum** of the upper half, which is exactly what a max-heap
    and a min-heap give in O(1). Keep two invariants: every value in `small` ≤ every value in
    `large`, and `small` has the same size as `large` or one more. Then the median is
    `small`'s top (odd count) or the average of both tops (even count), and each insert costs
    a few O(log N) heap operations.
  real_world: >-
    Latency dashboards show p50 (the median) of request times, and ride-hailing and food apps
    track running medians of delivery or wait times to set ETAs. At very large scale, systems
    like Prometheus histograms, Datadog's DDSketch and t-digest approximate quantiles to save
    memory, but exact running medians over a bounded stream are the two-heap design.

statement:
  clean: |
    The **median** is the middle value in an ordered integer list. If the size of the list is
    even, there is no single middle value, so the median is the **mean of the two middle values**.

    - For `arr = [2,3,4]`, the median is `3`.
    - For `arr = [2,3]`, the median is `(2 + 3) / 2 = 2.5`.

    Implement the `MedianFinder` class:

    - `MedianFinder()` initializes the `MedianFinder` object.
    - `void addNum(int num)` adds the integer `num` from the **data stream** to the data structure.
    - `double findMedian()` returns the median of all elements so far. Answers within `10^-5` of
      the actual answer are accepted.
  oa_story: |
    **LatencyLens — OA Round 2**

    LatencyLens sells an APM agent to UPI payment apps in Bengaluru. The agent sits next to a
    payment gateway and receives the response time of every request, in milliseconds, one at
    a time as requests complete. The on-call dashboard has a "typical latency" tile that can
    be refreshed at any moment, and it must show the value that half of the requests so far
    were at or below: the middle reading, or the average of the two middle readings when the
    number of readings is even.

    Implement a `MedianFinder` class with `addNum(num)` (a new reading arrives) and
    `findMedian()` (the tile refreshes), returning a float. The tile is only refreshed after
    at least one reading has arrived. During a festive-sale spike the agent handles tens of
    thousands of readings and refreshes per minute, so neither operation may slow down as the
    history grows.
  trigger_keywords: ["median", "data stream", "mean of the two middle values"]
  examples:
    - input: |
        ["MedianFinder","addNum","addNum","findMedian","addNum","findMedian"]
        [[],[1],[2],[],[3],[]]
      output: "[null,null,null,1.5,null,2.0]"
      explanation: "After 1 and 2 the median is (1 + 2) / 2 = 1.5. After adding 3 the list is [1,2,3], median 2."
    - input: |
        ["MedianFinder","addNum","findMedian","addNum","findMedian"]
        [[],[-1],[],[-2],[]]
      output: "[null,null,-1.0,null,-1.5]"
      explanation: "Negative numbers: (-1 + -2) / 2 = -1.5, which integer division would wrongly round to -2."
  constraints:
    - "-10^5 <= num <= 10^5"
    - "There will be at least one element in the data structure before calling findMedian."
    - "At most 5 * 10^4 calls will be made to addNum and findMedian."

constraint_quiz:
  prompt: >-
    Up to 5 × 10⁴ calls, mixed freely between addNum and findMedian. What cost per operation
    should you aim for?
  options:
    - "findMedian O(N log N): sort on every query"
    - "addNum O(N), findMedian O(1): keep a sorted list with insort"
    - "addNum O(log N), findMedian O(1): two heaps"
    - "O(1) for both"
  answer: 2
  explanation: >-
    Sorting on every query is O(N log N) per call: 2.5 × 10⁴ adds followed by 2.5 × 10⁴
    queries is ~10¹⁰ comparisons. A sorted
    list makes findMedian O(1), but each insort shifts up to N elements, ~1.25 × 10⁹ moves in
    the worst case; Python's fast memmove often survives this on LeetCode, but it is O(N²)
    overall and interviewers expect better. Two heaps give O(log N) inserts and O(1) queries.
    O(1) for both isn't available for arbitrary integers: placing a new value relative to the
    middle needs comparisons. Only the follow-up with values in [0, 100] allows a counting
    array that is effectively O(1).

pattern_quiz:
  prompt: >-
    Numbers arrive one at a time and you must report the median at any moment. Which pattern
    fits?
  options:
    - "A single min-heap holding every number"
    - "Two heaps: a max-heap for the lower half and a min-heap for the upper half"
    - "Quickselect on every findMedian"
    - "Sliding window with two pointers"
  answer: 1
  explanation: >-
    "Median" plus "data stream" is the two-heaps trigger. The median depends only on the
    largest value of the lower half and the smallest value of the upper half, and those are
    the tops of a max-heap and a min-heap. One min-heap only exposes the overall minimum.
    Quickselect is O(N) per query, too slow when queries are frequent. There is no window: the
    median covers every number seen so far.

