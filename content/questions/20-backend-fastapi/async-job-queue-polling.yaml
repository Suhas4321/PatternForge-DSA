hints:
  - "Check `if current_tick < job['created_tick']:` first and return status_code 400."
  - "Compute `elapsed = current_tick - job['created_tick']`. If 0, return status_code 202 with status 'pending' and progress 0."
  - "If `elapsed < job['duration_ticks']`, compute progress percentage and return 'processing'. Otherwise check `job.get('payload', {}).get('simulate_failure')` to return 'failed' or 'completed'."

solution:
  code: |
    class Solution:
        def poll_job_status(self, job: dict, current_tick: int) -> dict:
            created = job.get("created_tick", 0)
            duration = job.get("duration_ticks", 1)
            job_id = job.get("job_id", "unknown")

            if current_tick < created:
                return {
                    "status_code": 400,
                    "status": "invalid_tick",
                    "message": "Current tick precedes job creation",
                }

            elapsed = current_tick - created

            if elapsed == 0:
                return {
                    "status_code": 202,
                    "status": "pending",
                    "progress_percent": 0,
                    "retry_after": 2,
                }

            if elapsed < duration:
                progress = int((elapsed / duration) * 100)
                return {
                    "status_code": 200,
                    "status": "processing",
                    "progress_percent": progress,
                    "retry_after": 1,
                }

            # Completed or Failed
            payload = job.get("payload") or {}
            if payload.get("simulate_failure"):
                return {
                    "status_code": 200,
                    "status": "failed",
                    "error": "Inference computation failed",
                    "progress_percent": 100,
                }

            return {
                "status_code": 200,
                "status": "completed",
                "result_url": f"https://fitlabs.ai/results/{job_id}.png",
                "progress_percent": 100,
            }
  explanation: |
    The state machine transitions based on elapsed time:
    - `elapsed == 0`: initial enqueue, returning HTTP 202 Accepted.
    - `0 < elapsed < duration`: active processing, returning percentage completion and `retry_after`.
    - `elapsed >= duration`: terminal state, checking for worker errors or returning the generated resource URL.
  time: O(1) arithmetic
  space: O(1)

pitch_script: |
  **(Clarify)** "We need to simulate an asynchronous job queue status endpoint implementing the 202 Accepted and polling lifecycle pattern."

  **(Basement Insight)** "Synchronous HTTP requests for heavy jobs (e.g. 25-second AI inference) inevitably hit reverse proxy timeouts at 30 seconds. Decoupling ingestion from execution via HTTP 202 Accepted and polling endpoints avoids socket timeout crashes completely."

  **(Solution)** "We calculate elapsed time since job creation. If elapsed is 0, we return 202 pending. While elapsed is less than total duration, we return 200 processing with calculated progress percent. Once elapsed meets or exceeds duration, we return the final result or error."

  **(Complexity)** "Executes in O(1) time and space."

