slug: gepa-genetic-crossover-elitism
lc: 9608
citadel_id: ai_resume
brick_layer: 4
runner_type: python_practical
concept:
  problem_it_solves: How do AI engineers discover optimal prompt templates without spending dozens of hours manually tweaking
    words? Genetic Pareto Optimization (GEPA) treats prompts as evolutionary individuals. High-performing instructions cross
    over to produce offspring, while elitism preserves top candidates and mutations introduce creative exploration.
  brute_force: Manual trial-and-error prompt engineering with human inspection of thousands of LLM completions.
  brute_force_complexity: High human engineering overhead with non-replicable prompt quality.
  key_insight: Simulating biological selection (elitism preserves best prompts, crossover combines successful role and instruction
    pairs) systematically navigates the discrete prompt search space.
  real_world: GEPA/LLEGO automated prompt optimization engine (achieving 66% API cost reduction in production), DSPy teleprompters,
    and Microsoft Promptbreeder.
statement:
  clean: "Implement one generation of genetic prompt optimization with elitism, crossover, and mutation:\n`evolve_prompt_generation(self,\
    \ population: list[dict], elite_k: int = 2, crossover_pairs: list[list[int]] = None, mutation_rules: list[dict] = None)\
    \ -> list[dict]`.\n\nGiven:\n- `population`: list of candidate prompt dicts:\n  `{'id': str, 'role': str, 'instruction':\
    \ str, 'fitness': float}`\n- `elite_k`: number of top individuals to preserve via elitism (`elite_k >= 0`)\n- `crossover_pairs`:\
    \ list of index pairs `[parent1_idx, parent2_idx]` into the sorted population\n- `mutation_rules`: list of mutation action\
    \ dicts:\n  `{'target_id': str, 'mutation_type': 'append_constraint' | 'replace_role', 'value': str}`\n\nEvolutionary\
    \ Lifecycle:\n1. Sort `population` descending by `fitness` (tie-breaker: `id` alphabetically ascending).\n2. Elitism:\
    \ Directly copy the top `elite_k` individuals into the new generation.\n3. Crossover: For each `[p1_idx, p2_idx]` in `crossover_pairs`\
    \ (where indices reference the sorted population):\n   - Parent 1 is `sorted_pop[p1_idx]`, Parent 2 is `sorted_pop[p2_idx]`.\n\
    \   - Child prompt:\n     `{'id': f'child_{p1[\"id\"]}_{p2[\"id\"]}', 'role': p1['role'], 'instruction': p2['instruction'],\
    \ 'fitness': round((p1['fitness'] + p2['fitness']) / 2.0, 2)}`\n   - Append child to the new generation.\n4. Mutation:\
    \ For each rule in `mutation_rules`:\n   - Locate the individual in the new generation with `id == target_id`.\n   - If\
    \ `mutation_type == 'append_constraint'`:\n     append `f' Constraint: {value}'` to its `instruction`.\n   - If `mutation_type\
    \ == 'replace_role'`:\n     replace its `role` with `value`.\n   - Deduct `0.05` from its `fitness` (mutation cost) rounded\
    \ to 2 decimal places: `round(fitness - 0.05, 2)`.\n5. Return the new generation list of candidate prompt dicts."
  oa_story: '**GEPA Prompt Optimizer — Autonomous LLM Instruction Evolution**


    In production at scale, manual prompt engineering could not keep up with model updates and token cost constraints. The
    GEPA engine was built to automatically evolve prompt architectures through evolutionary hyper-parameter search.


    By combining the top 2 elite system instructions with crossover mutations, GEPA discovered compact prompts that reduced
    API token usage by 66% while improving accuracy. Implement one generation of this evolutionary prompt engine.'
  trigger_keywords:
  - genetic prompt optimization with elitism, crossover, and mutation
  - evolve_prompt_generation
  - crossover_pairs
  examples:
  - input: 'population = [{''id'': ''p1'', ''role'': ''Dev'', ''instruction'': ''Write Python'', ''fitness'': 0.90}, {''id'':
      ''p2'', ''role'': ''Arch'', ''instruction'': ''Optimize code'', ''fitness'': 0.80}], elite_k = 2, crossover_pairs =
      [[0, 1]], mutation_rules = []'
    output: '[{''id'': ''p1'', ''role'': ''Dev'', ''instruction'': ''Write Python'', ''fitness'': 0.90}, {''id'': ''p2'',
      ''role'': ''Arch'', ''instruction'': ''Optimize code'', ''fitness'': 0.80}, {''id'': ''child_p1_p2'', ''role'': ''Dev'',
      ''instruction'': ''Optimize code'', ''fitness'': 0.85}]'
    explanation: Elites p1 and p2 are preserved; child combines role from p1 and instruction from p2.
  constraints:
  - 0 <= len(population) <= 100
  - 0 <= elite_k <= len(population)
constraint_quiz:
  prompt: Why is elitism essential in genetic prompt optimization algorithms?
  options:
  - It guarantees that the highest-fitness prompt discovered so far is never lost across generations due to destructive mutations
  - It increases the learning rate of the LLM
  - It deletes low-performing prompts from disk immediately
  - It ensures prompts always have fewer than 10 words
  answer: 0
  explanation: Without elitism, random crossover or deleterious mutations might degrade the best prompt discovered in earlier
    iterations.
pattern_quiz:
  prompt: In evolutionary prompt synthesis, what does the crossover operator correspond to?
  options:
  - Synthesizing a new prompt by combining modular components (e.g. system persona from Prompt A and few-shot examples from
    Prompt B)
  - Translating prompts between Python and C++
  - Sorting prompts by length
  - Encrypting prompts with RSA keys
  answer: 0
  explanation: Crossover takes high-performing building blocks from two fit parent prompts and blends them into an offspring
    prompt.
