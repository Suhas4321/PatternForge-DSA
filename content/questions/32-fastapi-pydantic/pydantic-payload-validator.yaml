slug: pydantic-payload-validator
lc: 9511
citadel_id: backend_apis
brick_layer: 2
runner_type: python_practical
concept:
  problem_it_solves: How does FastAPI prevent corrupt or malformed client payloads from crashing backend services? FastAPI
    uses Pydantic to validate request bodies against Python type annotations and field constraints before business logic runs.
    When a payload is missing required fields, has invalid types, or violates constraints, the framework rejects it with HTTP
    422 Unprocessable Entity and detailed error locators.
  brute_force: 'Writing manual `if not data.get(''x''): return 400` checks in every route handler, leading to inconsistent
    error responses and runtime bugs.'
  brute_force_complexity: High developer toil and brittle validation logic.
  key_insight: A declarative schema definition validates field presence, data type, and boundary constraints in a single pass,
    returning structured 422 error objects.
  real_world: FastAPI request body validation, Stripe API parameter verification, and JSON schema gateway filters.
statement:
  clean: "Implement a Pydantic-style schema validation engine for incoming API request bodies:\n`validate_payload(schema:\
    \ dict, payload: dict) -> dict`.\n\nInput:\n- `schema`: dictionary mapping field names to rules:\n  `{\"type\": \"str\"\
    \ | \"int\" | \"float\" | \"bool\", \"required\": bool, \"min\": optional_num, \"max\": optional_num}`.\n- `payload`:\
    \ dictionary of client-submitted JSON data.\n\nValidation Rules:\n1. Missing Fields:\n   - If a field is `required: True`\
    \ in `schema` but not in `payload`:\n     error: `{\"loc\": [\"body\", field], \"msg\": \"Field required\", \"type\":\
    \ \"missing\"}`.\n2. Type Mismatch:\n   - If present, verify data types:\n     - `\"bool\"`: must be `isinstance(val,\
    \ bool)`.\n     - `\"int\"`: must be `isinstance(val, int)` and `not isinstance(val, bool)` (in Python bool is an int\
    \ subclass).\n     - `\"float\"`: must be `isinstance(val, (int, float))` and `not isinstance(val, bool)`.\n     - `\"\
    str\"`: must be `isinstance(val, str)`.\n   - On type failure:\n     error: `{\"loc\": [\"body\", field], \"msg\": f\"\
    Input should be a valid {expected_type}\", \"type\": f\"{expected_type}_type\"}`.\n3. Constraint Bounds:\n   - If `min`\
    \ is specified and `val < min`:\n     error: `{\"loc\": [\"body\", field], \"msg\": f\"Input should be greater than or\
    \ equal to {min}\", \"type\": \"greater_than_equal\"}`.\n   - If `max` is specified and `val > max`:\n     error: `{\"\
    loc\": [\"body\", field], \"msg\": f\"Input should be less than or equal to {max}\", \"type\": \"less_than_equal\"}`.\n\
    \nOutput Format:\n- If errors exist:\n  return `{\"status_code\": 422, \"detail\": errors, \"valid\": False}`.\n- If no\
    \ errors:\n  return `{\"status_code\": 200, \"data\": payload, \"valid\": True}`."
  oa_story: '**UrbanFix Service Booking — Request Validation Failure**


    UrbanFix customers booking home maintenance entered string values for technician counts and negative quantities for spare
    parts. The legacy Flask API crashed with unhandled 500 exceptions, polluting Sentry alert logs.


    The team migrated the booking endpoint to FastAPI. Implement this Pydantic-style validation engine to reject invalid payloads
    with clean HTTP 422 Unprocessable Entity responses before database queries execute.'
  trigger_keywords:
  - pydantic-style schema validation
  - validate_payload
  - status_code
  examples:
  - input: 'schema = {"name": {"type": "str", "required": True}, "age": {"type": "int", "required": True, "min": 18}}, payload
      = {"name": "Aarav", "age": 16}'
    output: '{"status_code": 422, "detail": [{"loc": ["body", "age"], "msg": "Input should be greater than or equal to 18",
      "type": "greater_than_equal"}], "valid": False}'
    explanation: Age 16 violates the min constraint of 18, returning HTTP 422.
  - input: 'schema = {"name": {"type": "str", "required": True}}, payload = {"name": "Priya"}'
    output: '{"status_code": 200, "data": {"name": "Priya"}, "valid": True}'
    explanation: Payload passes all schema rules, returning HTTP 200.
  constraints:
  - 0 <= len(schema) <= 50
  - 0 <= len(payload) <= 50
constraint_quiz:
  prompt: Why does FastAPI return HTTP 422 Unprocessable Entity instead of HTTP 400 Bad Request for schema errors?
  options:
  - 422 signifies the JSON syntax is well-formed, but the semantic data violates model domain constraints
  - 422 is faster to serialize over HTTP/2
  - HTTP 400 is not supported in Python
  - 422 instructs browsers to automatically reload the page
  answer: 0
  explanation: RFC 4918 / RFC 9110 define 422 Unprocessable Entity for requests that are syntactically correct JSON but contain
    semantic validation or business constraint errors.
pattern_quiz:
  prompt: Why is `isinstance(val, bool)` a critical check when validating integer types in Python?
  options:
  - In Python, bool is a subclass of int (True == 1, False == 0), so isinstance(True, int) returns True without explicit checking
  - Python booleans occupy 64 bits
  - Integer types cannot be serialized to JSON
  - Pydantic prohibits boolean fields
  answer: 0
  explanation: Because `bool` inherits from `int` in Python, validating `isinstance(True, int)` evaluates to True. Validators
    must guard against bool inputs when expecting integer numbers.
