slug: clone-graph
lc: 133

concept:
  problem_it_solves: >-
    "How do I copy a structure whose pointers loop back on themselves?" Copying one node is easy;
    the hard part is that its neighbours point back to it, so a naive copier keeps meeting nodes it
    has already copied. A hash map from each original node to its copy answers the question "have I
    already made a copy of this node, and where is it?", which both stops the infinite loop and makes
    every edge in the copy point at the one and only copy of each node.
  brute_force: >-
    Copy a node, then recursively copy each neighbour, with no memory of what has already been
    copied. In an undirected graph every edge goes both ways: copying node 1 copies its neighbour 2,
    which lists 1 as a neighbour, so it copies 1 again, which copies 2 again, forever. Even if you
    somehow stopped the loop, a node reachable along two different paths would be copied twice, and
    the copy would no longer have the same shape as the original.
  brute_force_complexity: >-
    Doesn't terminate on any graph with at least one edge (every undirected edge is a 2-cycle);
    there is no correct "simpler" version, only the memoised one.
  key_insight: >-
    Keep a dictionary `copies` from original node to its clone, and treat it as the visited set. To
    clone a node: if it's already in `copies`, return that clone. Otherwise create the clone,
    **store it in the map before touching the neighbours**, then clone each neighbour and append the
    result. Registering first is what breaks cycles: when the recursion comes back around to this
    node, it finds the half-built clone in the map and just links to it. Each node is cloned once and
    each edge is followed once, so the copy costs O(V + E).
  real_world: >-
    Deep-copying object graphs is everyday work: Python's `copy.deepcopy` keeps exactly this "memo"
    dictionary from id(original) to copy so cyclic objects don't recurse forever, and Java/Kotlin
    serialisation frameworks keep a handle table for the same reason. Infra teams clone service
    topologies or network meshes into staging environments, and garbage collectors that copy live
    objects (Cheney's algorithm) leave a forwarding pointer from each old object to its new copy.

statement:
  clean: |
    Given a reference to a node in a **connected undirected graph**, return a **deep copy** (clone)
    of the graph.

    Each node has an integer `val` and a list of its `neighbors`:

    ```python
    class Node:
        def __init__(self, val = 0, neighbors = None):
            self.val = val
            self.neighbors = neighbors if neighbors is not None else []
    ```

    The test cases describe the graph as a 1-indexed **adjacency list**: entry `i` lists the values
    of the neighbours of the node with `val = i + 1`. The given node is always the node with
    `val = 1` (or `None` for an empty graph). Return a reference to the copy of the given node.
    Every node of the copy must be newly created: no node of the original graph may appear in it.
  oa_story: |
    **MeshMitra Networks — OA Round 1**

    MeshMitra builds Wi-Fi mesh networks for apartment complexes in Whitefield and Electronic City.
    Each router in a complex knows only which routers it has a direct radio link to, and links work
    both ways. Before pushing a risky firmware update, the SRE team wants a perfect replica of a
    complex's live topology in their simulator, so they can break things there instead.

    You get a handle to router 1 of a complex, where each router object carries its ID and the list
    of routers it links to. Build the simulator's replica: brand-new router objects with the same IDs
    and the same links, and return the handle to the replica of router 1. The replica must never
    reference a live router object, or a test in the simulator could take down a real network. A
    complex can have no routers at all, and has at most 100.
  trigger_keywords: ["deep copy", "connected undirected graph", "neighbors"]
  examples:
    - input: "adjList = [[2,4],[1,3],[2,4],[1,3]]"
      output: "[[2,4],[1,3],[2,4],[1,3]]"
      explanation: >-
        Four nodes in a square: 1 links to 2 and 4, 2 links to 1 and 3, 3 links to 2 and 4, and 4
        links to 1 and 3. The copy has the same links between brand-new nodes.
    - input: "adjList = [[]]"
      output: "[[]]"
      explanation: "A single node with no neighbours."
    - input: "adjList = []"
      output: "[]"
      explanation: "An empty graph: the given node is None, so return None."
  constraints:
    - "The number of nodes in the graph is in the range [0, 100]"
    - "1 <= Node.val <= 100"
    - "Node.val is unique for each node"
    - "There are no repeated edges and no self-loops"
    - "The graph is connected and all nodes can be visited starting from the given node"

constraint_quiz:
  prompt: >-
    The graph has V nodes and E edges (at most 100 nodes here). What time complexity should a clone
    aim for?
  options:
    - "O(V + E) — create each node once and follow each edge once"
    - "O(V²) — for every node, scan all nodes to find its copied neighbours"
    - "O(V · E) — re-traverse the graph once per node"
    - "O(2^V) — every path from node 1 must be explored"
  answer: 0
  explanation: >-
    The output itself has V nodes and E edges, so O(V + E) is the floor, and a hash map from original
    to copy achieves it with O(1) lookups. Scanning a list of copies to find "the copy of node x"
    makes each lookup O(V), giving O(V²) or worse. Re-traversing per node repeats work for nothing.
    Exploring every path is what happens without the visited map: exponential at best, infinite with
    cycles.

pattern_quiz:
  prompt: >-
    You must copy a structure of nodes whose pointers can form cycles, so that the copy has exactly
    the same shape. Which approach fits?
  options:
    - "Recursively copy each node's neighbours with no extra memory"
    - "DFS/BFS with a hash map from original node to its copy"
    - "Sort the nodes by value and copy them in order"
    - "Two pointers walking the original and the copy in lockstep"
  answer: 1
  explanation: >-
    "Deep copy" of anything with cycles or shared nodes is the old → new hash-map trigger. The map is
    both the visited set (it stops the infinite recursion) and the lookup table that lets every edge
    point to the single copy of its target. Copying without memory loops forever. Sorting by value
    tells you nothing about the links, and two pointers only make sense for linear structures.

