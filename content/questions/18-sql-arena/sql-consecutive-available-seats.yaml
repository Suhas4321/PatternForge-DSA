solution:
  code: |
    WITH Windowed AS (
      SELECT
        seat_id,
        free,
        LAG(free, 1) OVER (ORDER BY seat_id) AS prev_free,
        LEAD(free, 1) OVER (ORDER BY seat_id) AS next_free
      FROM Cinema
    )
    SELECT seat_id
    FROM Windowed
    WHERE free = 1 AND (prev_free = 1 OR next_free = 1)
    ORDER BY seat_id;
  explanation: |
    1. The CTE `Windowed` projects each seat alongside its immediate predecessor (`LAG`) and successor (`LEAD`).
    2. A seat is part of a consecutive run if it is available (`free = 1`) and at least one adjacent neighbor
       (preceding or succeeding) is also available.
    3. `ORDER BY seat_id`: ensures the output displays in sequential physical hall order.
  time: O(N log N) for sorting window order
  space: O(N) for window buffer

pitch_script: |
  **(Clarify)** "We need to find all available cinema seats that are part of a continuous streak of two or more free seats."

  **(Basement Insight)** "Self-joining Cinema with itself on `ABS(a.seat_id - b.seat_id) = 1` incurs quadratic O(N^2) join overhead. Using window functions `LAG()` and `LEAD()` allows us to inspect immediate neighbors in a single O(N) linear scan over sorted keys."

  **(Solution)** "We build a CTE that computes `LAG(free, 1)` and `LEAD(free, 1)` ordered by `seat_id`. We select `seat_id` where `free = 1 AND (prev_free = 1 OR next_free = 1)` ordered by `seat_id`."

  **(Complexity)** "Runs in O(N log N) time for sorting, using O(N) space."

